<script type="application/json" id="data">{"title": "Four Characters and a Progress Bar: What tqdm Promises While It Prints", "premise": "A caller has a four-item list and a loop that does real work, and wants to see progress without writing any printing logic. The list is handed to `tqdm(...)`: from that moment it is no longer just a list but the payload of a progress meter that must allocate a global write lock, start a background thread, probe the terminal, render a frame, throttle itself, and clean up after the loop ends \\u2014 all on `sys.stderr`, all without changing what the loop iterates over. This story follows that list through one real run and asks, at each step, what is guaranteed and what could go wrong.", "reader": "owner", "repo": {"name": "tqdm/tqdm", "url": "https://github.com/tqdm/tqdm", "commit": "9cf5a12b1f955468a17f0ba3c59092b23e4258ac"}, "chapters": [{"n": 1, "title": "Before the list is even looked at: a lock, a registry, a thread", "data_in": "`tqdm(['a','b','c','d'])` is called; Python routes to `tqdm.__new__(cls=<type>)`, which ignores the list entirely", "data_out": "`<tqdm.std.tqdm object at 0x109742cf0>` \\u2014 a bare instance, already registered in `tqdm._instances`, with a process-wide `TqdmDefaultWriteLock` built and a daemon `TMonitor` thread running", "span": [2, 21], "md": "# Chapter 1 \u00b7 Before the list is even looked at: a lock, a registry, a thread\n\n> **Enters as:** `['a', 'b', 'c', 'd']`, passed to `tqdm(...)`\n\nThe list is four strings. It has no idea it is about to become the payload of a progress meter, and for the whole of this chapter it will be ignored.\n\nThat is literal. The call `tqdm(chars)` goes first to `tqdm.__new__`, whose signature is `def __new__(cls, *_, **__)` \u2014 the arguments are captured into throwaway names and never read ([std.py#L664-L665](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L664-L665)). The list sits on the stack while tqdm builds the world it is about to enter: a process-wide write lock, a registry of live bars, and a background thread.\n\n## The lock, built on demand\n\nThe first thing `__new__` does is `with cls.get_lock():` ([std.py#L666](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L666)). `get_lock` is deliberately lazy: it constructs a `TqdmDefaultWriteLock` only if the class has no `_lock` yet ([std.py#L766-L771](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L766-L771)). In this run it does not exist, so the trace shows `TqdmDefaultWriteLock.__init__` being called once, and the object it returns \u2014 `<tqdm.std.TqdmDefaultWriteLock object at 0x109742a50>` \u2014 becomes class state for the rest of the process.\n\nThat lock is two locks in a trench coat. A threading `RLock` is created at import time as a class attribute ([std.py#L86](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L86)); a `multiprocessing.RLock` is created only now, on first use, by `create_mp_lock` ([std.py#L114-L121](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L114-L121)). The comment above the class attribute explains why the multiprocessing lock is not made at import: creating one fixes the multiprocessing start context, which would forbid `spawn()` and `forkserver()` in the host application ([std.py#L83-L86](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L83-L86)). The two are stored in a list, acquired in order and released in reverse ([std.py#L96-L106](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L96-L106)).\n\n## The registry, entered before configuration\n\nInside that lock, the freshly allocated instance is added to `cls._instances` \u2014 a `WeakSet` held on the class ([std.py#L365](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L365), [std.py#L667](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L667)). The trace records `tqdm.__hash__` returning `4453575920`, which is simply `id(self)` ([std.py#L1163-L1164](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1163-L1164)) \u2014 the set keys bars by identity.\n\nNote the ordering: the instance joins the global registry before a single argument has been validated. That is why `__init__` has to undo it by hand on the two paths where no bar will be drawn \u2014 `disable=True` removes itself from `_instances` and returns ([std.py#L990-L999](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L990-L999)), and an unknown keyword argument removes itself and *then* raises ([std.py#L1001-L1012](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1001-L1012)).\n\n## The thread\n\nStill under the lock, `__new__` checks `cls.monitor_interval` (10 by default) and whether a monitor is already alive, then constructs `TMonitor(cls, 10)` ([std.py#L669-L672](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L669-L672)). The trace shows exactly that: `TMonitor.__init__(tqdm_cls=<class 'tqdm.std.tqdm'>, sleep_interval=10)`.\n\nThe thread names itself `tqdm_monitor`, marks itself `daemon` so a `KeyboardInterrupt` in the main thread kills it, registers an `atexit` handler, and starts ([_monitor.py#L31-L40](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L31-L40)). That handler only *sets* a kill event \u2014 it never joins \u2014 precisely to avoid deadlocking at interpreter exit on a dead fork or a stuck thread ([_monitor.py#L42-L48](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L42-L48)).\n\nIts job, once per `sleep_interval`, is narrow: take the same global write lock, look at registered bars whose `miniters > 1` and whose last print is older than `maxinterval`, force `miniters = 1` and repaint them ([_monitor.py#L75-L93](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L75-L93)). It deliberately skips instances that have no `start_t` yet ([_monitor.py#L56-L60](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L56-L60)) \u2014 which is why our instance, at this moment, is invisible to it.\n\n> **For the owner:** Constructing any `tqdm` bar creates process-global state \u2014 a reentrant write lock and one daemon thread \u2014 before any argument is checked, including for bars that will immediately be disabled. Set `tqdm.tqdm.monitor_interval = 0` before the first bar if an extra daemon thread is unacceptable in your environment.\n\nIf `TMonitor(...)` had raised, the caller would never hear about it: the exception is caught, a `TqdmMonitorWarning` is emitted, and `monitor_interval` is set to `0`, disabling monitoring for the whole process from then on ([std.py#L673-L677](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L673-L677)).\n\n> **For the owner:** A failure to start the monitor degrades silently and permanently, so the `maxinterval` safety net (\"a stalled bar will be repainted within 10 seconds\") is a best-effort guarantee, not a hard one. Treat `TqdmMonitorWarning` as a signal that bars may freeze on screen during slow iterations.\n\nThe lock is released ([std.py#L111-L113](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L111-L113)) and `__new__` returns `<tqdm.std.tqdm object at 0x109742cf0>` \u2014 an object with no `iterable`, no `n`, no `total`, no `start_t`. The list has not been touched. It is about to be.\n\n> **Leaves as:** `['a', 'b', 'c', 'd']`, still untouched, now about to be handed to `tqdm.__init__` on `<tqdm.std.tqdm object at 0x109742cf0>` \u2014 an instance already in `tqdm._instances`, with a process-global `TqdmDefaultWriteLock` and a live daemon `TMonitor` behind it\n"}, {"n": 2, "title": "Accepting the arguments: a wrapped stderr, a borrowed `len`, and a guess about Unicode", "data_in": "`tqdm.__init__(self, iterable=['a','b','c','d'], total=None, file=None, mininterval=0.1, maxinterval=10.0, miniters=None, ascii=None, disable=False, smoothing=0.3, delay=0.0, ...)`", "data_out": "`total=4` derived from `len(iterable)`; `file` replaced by `<DisableOnWriteError>` wrapping `<_io.TextIOWrapper name='<stderr>'>`; `ncols, nrows = (None, None)`; `ascii=False` (stderr reports `utf-8`); three `EMA(0.3)` accumulators created", "span": [22, 53], "md": "# Chapter 2 \u00b7 Accepting the arguments: a wrapped stderr, a borrowed `len`, and a guess about Unicode\n\n> **Enters as:** `['a', 'b', 'c', 'd']`, passed as `iterable` to `tqdm.__init__` on `<tqdm.std.tqdm object at 0x109742cf0>`\n\nNow the list is looked at. `__init__` receives it alongside a long tail of defaults the caller never typed: `desc=None, total=None, leave=True, file=None, ncols=None, mininterval=0.1, maxinterval=10.0, miniters=None, ascii=None, disable=False, unit='it', unit_scale=False, smoothing=0.3, unit_divisor=1000, delay=0.0, gui=False` \u2014 exactly as the trace records them.\n\nThose defaults did not come straight from the `def` line. `__init__` is wrapped by `envwrap(\"tqdm\", is_method=True, ...)` ([std.py#L958-L959](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L958-L959)), which scans `os.environ` at import time for keys beginning `TQDM_`, keeps those matching a parameter name, coerces them to the type of the parameter's default, and binds them as a `partialmethod` ([utils.py#L44-L75](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L44-L75)). In this run no such variables are set, so the defaults stand.\n\n> **For the owner:** Any `TQDM_*` environment variable matching a parameter name silently changes the defaults for every bar in the process \u2014 `TQDM_MININTERVAL=5` and `TQDM_DISABLE=1` are the documented examples. Check your deployment environment before concluding that a bar's observed behaviour comes from the code you reviewed.\n\n## The stream it will write to\n\n`file` is `None`, so it becomes `sys.stderr` ([std.py#L968-L969](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L968-L969)). That default matters for the scenario's shape: a bar on `stderr` never contaminates a pipeline's `stdout`, which is what makes `cat *.txt | tqdm | wc -l` work at all.\n\n`write_bytes` is false, so the `SimpleTextIOWrapper` branch is skipped and the stream goes straight into `DisableOnWriteError(file, tqdm_instance=self)` ([std.py#L971-L977](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L971-L977)). The trace shows what that constructor does: `ObjectWrapper.__init__` stashes the real `TextIOWrapper` as `_wrapped`, then `disable_on_exception` is called twice \u2014 once for `write`, once for `flush` \u2014 each returning an `inner` closure that is set as an attribute on the wrapper itself ([utils.py#L196-L203](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L196-L203)).\n\nWhat `inner` does is the first real risk decision in this chapter. It calls the wrapped method, and if that raises `OSError` with `errno == 5` (I/O error) or a `ValueError` whose message contains `'closed'`, it swallows the exception and instead sets `miniters = float('inf')` on a weak proxy to the bar ([utils.py#L170-L194](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L170-L194)). An infinite `miniters` means the counter gate in `update` can never open again, so the bar goes quiet. Any other `OSError` or `ValueError` is re-raised.\n\n> **For the owner:** If the output stream breaks mid-loop \u2014 closed file, detached terminal, `errno 5` \u2014 the bar silently stops updating and the caller's loop continues with no exception and no log line. This is deliberate (a progress meter should not kill the work it measures), but it means the absence of a bar is not evidence that the loop finished.\n\nA `proxy` is used rather than a strong reference ([utils.py#L175](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L175)) so the wrapper does not keep a dead bar alive; the `ReferenceError` that follows a collected bar is caught and ignored.\n\n`disable` is `False`, not `None`, so the `isatty` check at [std.py#L979-L980](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L979-L980) does not fire. Had the caller passed `disable=None`, a non-TTY stderr would have turned the bar off entirely.\n\n## Borrowing a `len`\n\nHere the list finally earns its keep. `total` is `None` and `iterable` is not, so:\n\n```python\ntry:\n    total = len(iterable)\nexcept (TypeError, AttributeError):\n    total = None\n```\n\n([std.py#L982-L988](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L982-L988)). Four items, so `total = 4`. The same lines are why wrapping a generator does not raise: the `TypeError` is caught and the bar degrades to counter-only output with no percentage and no ETA. An explicit `total=float(\"inf\")` is normalised to `None` on the next line, treated as \"unknown\" rather than as a number to divide by.\n\nWith `disable` false and `kwargs` empty, neither of the two early-exit paths from Chapter 1's registry discussion runs: the instance stays in `_instances` and the method continues.\n\n## Two probes at the terminal\n\nBecause `ncols` and `nrows` are both `None` and `file` compares equal to `sys.stderr`, the preprocessing block at [std.py#L1015-L1029](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1015-L1029) runs. That `in (sys.stderr, sys.stdout)` test is why the trace shows `DisableOnWriteError.__eq__` returning `True`: the wrapper forwards equality to its `_wrapped` object so it still *is* stderr for comparison purposes ([utils.py#L205-L206](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L205-L206)).\n\n`dynamic_ncols` is false, so the `else` branch builds a one-shot probe: `_screen_shape_wrapper()` returns an `inner` that calls `os.get_terminal_size(fp.fileno())` inside a bare `except Exception: return None, None` ([utils.py#L265-L278](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L265-L278)). The trace shows `ObjectWrapper.__getattr__` fetching `fileno` through the wrapper ([utils.py#L121-L123](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L121-L123)) and the result being `(None, None)` \u2014 this run's stderr is not an interactive terminal. So `ncols` and `nrows` both stay `None`.\n\nThat is a consequential `None`. With no `ncols`, nothing downstream will trim the rendered line to the console width; the bar will be a fixed ten cells and the line printed in full. With no `nrows`, the visibility checks in `display` and `clear` will fall back to a hard-coded 20 rows.\n\n> **For the owner:** Terminal geometry detection swallows every exception and falls back to \"unknown\", which disables width-based trimming rather than failing. If a bar's description is long and the console narrow, the line wraps and the `\\r` in-place update produces one line per refresh \u2014 the most common cosmetic complaint about tqdm. Pass `ncols=` explicitly where output width is predictable.\n\n## Guessing at Unicode\n\n`ascii` arrived as `None`, so `ascii = not _supports_unicode(file)` ([std.py#L1043-L1044](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1043-L1044)). `_supports_unicode` reads `fp.encoding` \u2014 again through the wrapper's `__getattr__`, yielding `'utf-8'` \u2014 and hands it to `_is_utf`, which tries to encode two block characters and returns `True` on success ([utils.py#L235-L253](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L235-L253)). So `ascii = False`: this bar will draw with smooth Unicode blocks. A stream with no `encoding` attribute raises `AttributeError`, which `_supports_unicode` catches and converts to `False`, degrading the bar to `\" 123456789#\"`.\n\n`mininterval` (0.1), `maxinterval` (10.0) and `smoothing` (0.3) are all non-`None`, so the three \"coerce `None` to 0\" guards at [std.py#L1037-L1051](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1037-L1051) pass through unchanged. `miniters` *is* `None`, which sets `miniters = 0` and `dynamic_miniters = True` ([std.py#L1031-L1035](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1031-L1035)) \u2014 tqdm has just granted itself permission to rewrite its own display-frequency threshold as the loop runs. That decision will bite in Chapter 8.\n\n## Three accumulators\n\nThe arguments are stored onto `self` ([std.py#L1053-L1082](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1053-L1082)), and along the way three `EMA(0.3)` objects are constructed \u2014 the trace shows `EMA.__init__` once plus \"\u00d72 more\". They track, respectively, the increment per print, the interval per print, and the tuned `miniters` ([std.py#L1076-L1078](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1076-L1078)). Each starts with `last = 0` and `calls = 0` ([std.py#L223-L226](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L223-L226)), which is why the first rendered frame will report a rate of `?`.\n\n`postfix` is `None`, so the `set_postfix` branch at [std.py#L1083-L1087](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1083-L1087) is skipped, and `self.postfix` stays `None`.\n\nThe list is now `self.iterable`, its length is `self.total = 4`, and the object knows where and how it will draw. What it does not yet have is a line to draw on.\n\n> **Leaves as:** the same four strings, now `self.iterable` on a bar with `total=4`, `fp=<DisableOnWriteError>` over stderr, `ncols=None`, `nrows=None`, `ascii=False`, `miniters=0`, `dynamic_miniters=True`, and three fresh `EMA(0.3)` accumulators \u2014 about to acquire a screen position\n"}, {"n": 3, "title": "Claiming a line: position under lock and a printer with a memory", "data_in": "the configured instance with `desc=''`, `nrows=None`, `gui=False`, and its wrapped stderr", "data_out": "`self.pos = 0` (chosen by `_get_free_pos` while holding the global lock) and `self.sp = <print_status closure>` over that stream", "span": [54, 67], "md": "# Chapter 3 \u00b7 Claiming a line: position under lock and a printer with a memory\n\n> **Enters as:** the four strings held as `self.iterable` on a bar with `total=4`, `desc=''`, `ncols=None`, `nrows=None`, `gui=False`, and a `DisableOnWriteError` wrapping stderr\n\nTwo small assignments come first. `last_print_n` and `n` are both set from `initial`, which is `0` ([std.py#L1089-L1091](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1089-L1091)) \u2014 the published counter and the counter as of the last repaint, starting in agreement. The gap that will later open between them is the whole throttling story, but right now there is none.\n\nThen the bar has to decide where on the screen it lives, and for that it needs the lock from Chapter 1.\n\n## A line number, decided under the lock\n\nThe trace shows `TqdmDefaultWriteLock.__enter__` \u2192 `acquire`, then `_get_free_pos`, then `__exit__` \u2192 `release`. In source that is three lines:\n\n```python\nwith self._lock:\n    # mark fixed positions as negative\n    self.pos = self._get_free_pos(self) if position is None else -position\n```\n\n([std.py#L1095-L1097](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1095-L1097)). `position` is `None` here, so the classmethod runs:\n\n```python\npositions = {abs(inst.pos) for inst in cls._instances\n             if inst is not instance and hasattr(inst, \"pos\")}\nreturn min(set(range(len(positions) + 1)).difference(positions))\n```\n\n([std.py#L680-L685](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L680-L685)). It walks the global `_instances` registry, skips the bar asking the question, collects the screen lines already taken, and returns the lowest non-negative integer not among them. This bar is the only live one, so `positions` is empty and the answer is `0` \u2014 the trace's return value.\n\nThree details in those five lines are worth an owner's attention. The `hasattr(inst, \"pos\")` guard tolerates another thread's bar that is mid-`__init__` and has not claimed a line yet. The `abs()` means a bar pinned with `position=3` \u2014 stored as `-3` by the branch this run did not take \u2014 still occupies line 3 for allocation purposes; the sign is a flag meaning \"fixed\", and Chapter 9 will show that fixed bars are never moved when a neighbour closes. And the whole computation is done while holding the process-wide reentrant lock, so two threads creating bars at once cannot both be told \"line 0\".\n\n> **For the owner:** Automatic positioning is correct only for bars that are registered and closed. A bar that is abandoned without `close()` keeps its line reserved until garbage collection drops it from the `WeakSet`, so long-lived leaked bars will push later bars down the screen. Require `with tqdm(...)` or an explicit `close()` in code you sign off on.\n\nThe lock is released immediately afterwards; it is held for the allocation only, not for the rest of initialisation.\n\n## A printer, built once, that remembers\n\nNext:\n\n```python\nif not gui:\n    # Initialize the screen printer\n    self.sp = self.status_printer(self.fp)\n```\n\n([std.py#L1099-L1101](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1099-L1101)). `gui` is `False`, so a printer is built. The `gui=True` path deliberately leaves `self.sp` unset: that is how GUI subclasses signal that they render elsewhere, and `display` checks for the missing attribute and raises a `TqdmDeprecationWarning` telling the caller to use `tqdm.gui.tqdm` instead of `tqdm(..., gui=True)` ([std.py#L1494-L1498](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1494-L1498)).\n\nInside `status_printer` the trace shows one call that looks out of place: `DisableOnWriteError.__eq__` against the real `TextIOWrapper`, returning `True`. That is this test:\n\n```python\nif fp in (sys.stderr, sys.stdout):\n    getattr(sys.stderr, 'flush', lambda: None)()\n    getattr(sys.stdout, 'flush', lambda: None)()\n```\n\n([std.py#L443-L447](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L443-L447)). The wrapper forwards equality to the object it wraps, so it still counts as stderr; both standard streams are flushed once up front, so whatever the program printed before the bar appeared is on screen before the bar starts overwriting lines.\n\nThen two closures are built. `fp_write` writes `str(s)` and flushes ([std.py#L449-L451](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L449-L451)). Above it sits the one piece of state this printer owns:\n\n```python\nlast_len = [0]\n\ndef print_status(s):\n    len_s = disp_len(s)\n    fp_write('\\r' + s + (' ' * max(last_len[0] - len_s, 0)))\n    last_len[0] = len_s\n```\n\n([std.py#L453-L459](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L453-L459)). A one-element list holding the on-screen length of the previous frame. Every frame begins with a carriage return and ends with enough spaces to erase whatever the last, possibly longer, frame left behind. That is the entire in-place-update mechanism: no cursor queries, no ANSI erase codes, just `\\r` and padding \u2014 which is exactly why the README promises tqdm works anywhere `\\r` and `\\n` do, and why a line too long for the console breaks it. If the terminal wraps the line, the `\\r` returns to the start of the *wrapped* fragment, not the start of the bar, and each refresh leaves a new line behind.\n\n> **For the owner:** In-place updating is a guarantee only when each rendered line fits the console width. With `ncols` unknown (Chapter 2) nothing trims the line, so a long `desc` or postfix in a narrow or log-capturing console produces one line per refresh instead of one updating line. If output goes to a log collector rather than a terminal, set `disable=None` to suppress the bar on non-TTYs, or pin `ncols`.\n\nThe returned closure \u2014 `<function tqdm.status_printer.<locals>.print_status at 0x109b2bc40>` in the trace \u2014 is stored as `self.sp`. It is per-bar: a second bar sharing stderr gets its own `last_len`, so the two never confuse each other's padding. What keeps them from overwriting each other's *lines* is the position allocated a moment ago, plus the shared lock.\n\n## What has not happened yet\n\nThe next statement is `if delay <= 0: self.refresh(...)` ([std.py#L1102-L1103](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1102-L1103)), and `delay` is `0.0`. Nothing has been drawn yet; the stream has been flushed but not written to.\n\nAnd deliberately, two attributes still do not exist. `last_print_t` and `start_t` are assigned only after that first refresh returns, with a comment saying so explicitly ([std.py#L1106-L1108](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1106-L1108)). The monitor thread from Chapter 1 filters its working set with `hasattr(i, 'start_t')` ([\\_monitor.py#L56-L60](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L56-L60)), so a bar that is registered but not finished is invisible to it. The ordering is the race avoidance.\n\nThe four strings have not moved. They are still a list behind `self.iterable`, and the bar that will report on them now has a line to write on and a function to write with.\n\n> **Leaves as:** the same four strings on a bar with `pos = 0` (claimed under the global lock) and `self.sp = <print_status closure>` over the wrapped stderr \u2014 about to paint its first frame\n"}, {"n": 4, "title": "The first frame, then four silent items and an automatic close", "data_in": "`tqdm.refresh(self, nolock=False, lock_args=None)` on a bar with `n=0, total=4, elapsed=0, ncols=None`, followed by `tqdm.__iter__(self)` over `['a','b','c','d']`", "data_out": "`'  0%|          | 0/4 [00:00<?, ?it/s]'` written as `'\\r' + s` to stderr (38 chars); then the four items yielded unchanged (`'a'`, `\\u2026 \\u00d74 more`), the `finally` block setting `self.n = 4` and calling `close()`, and a later `__del__` \\u2192 `close()` that returns immediately", "span": [68, 119], "md": "# Chapter 4 \u00b7 The first frame, four items, and an automatic close\n\n> **Enters as:** the four strings on a bar with `n=0`, `total=4`, `pos=0`, `sp` ready, and no `start_t` yet \u2014 entering `tqdm.refresh(self, nolock=False, lock_args=None)`\n\nThe last statement of `__init__` before the clocks are set is `self.refresh(lock_args=self.lock_args)` ([std.py#L1102-L1103](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1102-L1103)). `lock_args` is `None`, so `refresh` takes the plain blocking path:\n\n```python\nif not nolock:\n    if lock_args:\n        if not self._lock.acquire(*lock_args):\n            return False\n    else:\n        self._lock.acquire()\nself.display()\n```\n\n([std.py#L1345-L1357](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1345-L1357)). The trace shows exactly that: `acquire`, `display`, `release`, return `True`. The same process-wide lock from Chapter 1, now guarding the screen rather than the registry.\n\n> **For the owner:** `lock_args` changes a guarantee. With it set (e.g. `lock_args=(False,)` for a non-blocking acquire), a bar that loses the race prints nothing and `refresh` returns `False` instead of waiting. That is the correct choice for many parallel bars \u2014 contention never stalls the workers \u2014 but it means frames are silently dropped. Decide per use whether a dropped frame or a blocked worker is the worse outcome.\n\n## Deciding there is a line to draw on\n\n`display(msg=None, pos=None)` first resolves `pos = abs(self.pos)` \u2192 `0`, then applies the screen-height rule:\n\n```python\nnrows = self.nrows or 20\nif pos >= nrows - 1:\n    if pos >= nrows:\n        return False\n    if msg or msg is None:  # override at `nrows - 1`\n        msg = \" ... (more hidden) ...\"\n```\n\n([std.py#L1484-L1492](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1484-L1492)). `nrows` came back `None` from the terminal probe in Chapter 2, so the fallback 20 applies; at `pos=0` nothing is hidden. A bar on line 20 or beyond would simply not be drawn \u2014 `display` returns `False` and no exception is raised. That is deliberate: deeply nested bars go quiet rather than scrolling the terminal.\n\n`self.sp` exists (Chapter 3), so the deprecation branch for `gui=True` is skipped ([std.py#L1494-L1498](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1494-L1498)), and because `pos` is `0` the two `moveto` calls that would walk the cursor down and back up are skipped too ([std.py#L1500-L1504](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1500-L1504)). What remains is `self.sp(self.__str__())`.\n\n## A snapshot, then pure formatting\n\n`__str__` is one line: `return self.format_meter(**self.format_dict)` ([std.py#L1156-L1157](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1156-L1157)). The split matters: `format_dict` reads mutable bar state once, and `format_meter` is a `@staticmethod` that turns that snapshot into a string without touching the instance.\n\nThe snapshot the trace records is `{'ascii': False, 'bar_format': None, 'colour': None, 'elapsed': 0, 'initial': 0, 'n': 0, ...}`. Two entries are worth reading closely:\n\n- `'elapsed': 0`, because of `self._time() - self.start_t if hasattr(self, 'start_t') else 0` ([std.py#L1463](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1463)). `start_t` is still unassigned \u2014 Chapter 3's deliberate ordering \u2014 so the first frame honestly reports zero elapsed time rather than a number measured from a clock that does not exist yet.\n- `rate`, from `self._ema_dn() / self._ema_dt() if self._ema_dt() else None` ([std.py#L1466](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1466)). The trace shows a single `EMA.__call__(x=None)` returning `0`: with `calls == 0` the estimator returns its initial `last` ([std.py#L228-L239](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L228-L239)), the `if` short-circuits, `_ema_dn` is never consulted, and `rate` is `None`.\n\n`format_meter(n=0, total=4, elapsed=0, ncols=None, prefix='', ascii=False, ...)` then runs its gauntlet of degradations. `elapsed` is falsy, so the `rate = (n - initial) / elapsed` fallback never divides by zero ([std.py#L550-L551](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L550-L551)); with no rate, the formatter emits `'?it/s'` and the remaining-time field becomes `'?'` rather than an invented ETA ([std.py#L552-L574](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L552-L574)). `prefix` is empty, so `l_bar` starts bare and `format_interval(0)` gives `'00:00'` ([std.py#L397-L415](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L397-L415)).\n\n`total` is truthy, so the predictive branch runs: `frac = 0.0`, `percentage = 0.0`, `l_bar = '  0%|'`. Before building a bar, the formatter probes with a sentinel:\n\n```python\nfull_bar = FormatReplace()\nnobar = bar_format.format(bar=full_bar, **format_dict)  # no `{bar}`\nif not full_bar.format_called:\n    return disp_trim(nobar, ncols) if ncols else nobar\n```\n\n([std.py#L630-L633](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L630-L633)). `FormatReplace.__format__` just counts calls and returns its replacement string ([utils.py#L85-L97](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L85-L97)); the trace shows one such call. The default format does reference `{bar}`, so the real `Bar` gets built \u2014 `Bar(frac=0.0, default_len=10, charset=' \u258f\u258e\u258d\u258c\u258b\u258a\u2589\u2588', colour=None)`, the width being the fixed 10 precisely because `ncols` is unknown ([std.py#L636-L639](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L636-L639)). Rendering it is `divmod` arithmetic over the charset: zero full blocks, so ten spaces ([std.py#L202-L208](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L202-L208)). The two `_is_ascii` calls in the trace are the short-circuit pair at [std.py#L640-L641](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L640-L641): the charset is not ASCII, the format string is, so it is coerced to `str` \u2014 a no-op here.\n\nOut comes `'  0%|          | 0/4 [00:00<?, ?it/s]'`, returned untrimmed because `ncols` is falsy ([std.py#L642-L643](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L642-L643)).\n\n## Thirty-seven characters, plus a carriage return\n\n`print_status` measures the line with `disp_len` \u2192 `_text_width` \u2192 `37` ([utils.py#L303-L312](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L303-L312)) \u2014 ANSI codes stripped, East-Asian wide characters counted double, neither present here. `last_len[0]` is still `0`, so `max(0 - 37, 0)` adds no padding, and `fp_write('\\r' + s)` sends 38 characters. The write goes through `DisableOnWriteError.disable_on_exception.<locals>.inner`, which returns `38`, followed by the elided flush ([utils.py#L177-L194](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L177-L194)). Every frame from here on travels that same error-swallowing path.\n\n`display` returns `True`, `refresh` releases the lock and returns `True`, and `__init__` finally sets `last_print_t` and `start_t` ([std.py#L1106-L1108](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1106-L1108)). The bar is now visible to the monitor thread, and `tqdm(chars)` returns.\n\n## Four items, handed back exactly as they came\n\nThe caller's `for char in ...` drives `__iter__`. Its first act is the disabled shortcut \u2014 `yield from iterable; return`, with no bookkeeping at all ([std.py#L1172-L1176](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1172-L1176)) \u2014 then it copies `mininterval`, `last_print_t`, `last_print_n`, `n` and `self._time` into locals for speed, and computes `min_start_t = self.start_t + self.delay` ([std.py#L1178-L1183](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1178-L1183)).\n\nThe loop body yields first and counts afterwards:\n\n```python\nfor obj in iterable:\n    yield obj\n    n += 1\n    if n - last_print_n >= self.miniters:\n        cur_t = time()\n        dt = cur_t - last_print_t\n        if dt >= mininterval and cur_t >= min_start_t:\n            self.update(n - last_print_n)\n```\n\n([std.py#L1186-L1198](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1186-L1198)). The trace records this as `tqdm.__iter__(self) \u2192 'a'` and then `\u2026 tqdm.__iter__ \u00d74 more`: four yields of the original objects \u2014 `'a'`, `'b'`, `'c'`, `'d'`, unchanged, which is why the caller's `text` ends up `\"abcd\"` \u2014 plus a fifth resumption where the list is exhausted. Note the two gates: a cheap counter comparison first, so `time()` is not called on every iteration, and only then the clock. Nothing is printed unless both open. The second bar's trace opens this machinery up frame by frame; this chapter's remaining resumptions are collapsed into one line, so the frames the first bar drew along the way are not visible here.\n\nWhat *is* visible is the exit:\n\n```python\nfinally:\n    self.n = n\n    self.close()\n```\n\n([std.py#L1199-L1201](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1199-L1201)). The published counter is reconciled with the loop's private one \u2014 `n = 4` \u2014 and the bar closes itself. Because it is a `finally`, this also runs on `break` and on an exception propagating out of the loop body: the terminal is restored even when the loop aborts. With `leave=True` (the default), `close` draws one last frame at position 0 and writes `'\\n'` ([std.py#L1303-L1314](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1303-L1314)) \u2014 which is how the `0/4` line stops being the last word on screen.\n\nThen, later, garbage collection: `tqdm.__del__` \u2192 `close()` \u2192 `None`, with no children in the trace at all. That emptiness is the evidence. `close` opens with\n\n```python\nif getattr(self, 'disable', True):\n    return\nself.disable = True\n```\n\n([std.py#L1270-L1276](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1270-L1276)), so a second call does nothing \u2014 meaning (inference from the code plus the empty call) `disable` was already `True` when `__del__` fired, i.e. the `finally` had already done the work. The `getattr` default of `True` also covers an object that died before `__init__` finished.\n\n> **For the owner:** Cleanup is guaranteed, but its *timing* is not. The `finally` in `__iter__` closes the bar deterministically when a loop ends or breaks; a bar created outside a loop and never closed is tidied only by `__del__`, at an unpredictable moment, which can put the final frame in the middle of unrelated output. Require `with tqdm(...) as t:` \u2014 whose `__exit__` calls `close()` and tolerates a late `AttributeError` with a warning ([std.py#L1141-L1151](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1141-L1151)) \u2014 or an explicit `close()` in any code that holds a bar across function boundaries.\n\n> **Leaves as:** `'a'`, `'b'`, `'c'`, `'d'` handed back to the caller unchanged (`text == \"abcd\"`), the bar carrying `n = 4` and `disable = True` after its own `finally` closed it, and `__del__`'s second `close()` returning `None` immediately\n"}, {"n": 5, "title": "A second bar is born: the thread is reused, not replaced", "data_in": "`tqdm(chars, desc=\"Processing\")` \\u2192 `tqdm.__new__(cls=<type>)` with a monitor already running", "data_out": "`<tqdm.std.tqdm object at 0x109a02210>`; `TMonitor.report()` returned `True`, so `cls.monitor` is kept and no second thread starts", "span": [120, 135], "md": "# Chapter 5 \u00b7 A second bar is born: the thread is reused, not replaced\n\n> **Enters as:** the same four-item list, handed a second time \u2014 `tqdm(chars, desc=\"Processing\")` \u2014 which Python routes first to `tqdm.__new__(cls=<type>)`\n\nThe list makes the same entrance it made in Chapter 1, and gets the same treatment: `__new__` does not look at it. Its signature is `def __new__(cls, *_, **__)` \u2014 the arguments are swallowed into throwaway names ([std.py#L664-L665](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L664-L665)). What happens in this span is entirely about class-level state that outlived the first bar.\n\n## The lock is the same object\n\n```python\nwith cls.get_lock():  # also constructs lock if non-existent\n    cls._instances.add(instance)\n```\n\n([std.py#L666-L667](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L666-L667)). `get_lock` is guarded by a single `hasattr` check: `if not hasattr(cls, '_lock'): cls._lock = TqdmDefaultWriteLock()` ([std.py#L766-L771](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L766-L771)). Chapter 1 set `_lock`, so this time the constructor does not run \u2014 and the trace proves it: the call returns `<tqdm.std.TqdmDefaultWriteLock object at 0x109742a50>`, the identical address from line 8, with no nested `__init__` or `create_mp_lock` beneath it.\n\nThat one object is the serialisation point for every bar in the process, and for `tqdm.write` and `external_write_mode` too ([std.py#L717-L759](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L717-L759)). It is reentrant on both halves \u2014 a threading `RLock` and a multiprocessing `RLock`, acquired in order and released in reverse ([std.py#L96-L106](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L96-L106)) \u2014 which is what lets `close()` later take it while already inside locked code without deadlocking.\n\nInside that lock the new instance joins the registry. `_instances` is a `WeakSet` ([std.py#L365](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L365)), and the `tqdm.__hash__` call the trace records at this point \u2014 returning `4456456720`, the instance's own `id` ([std.py#L1163-L1164](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1163-L1164)) \u2014 is the set computing its bucket. Identity, not position, decides membership here; position only enters later, through `Comparable.__eq__`.\n\n## The monitor answers that it is still alive\n\nThen the branch that makes this chapter:\n\n```python\nif cls.monitor_interval and (cls.monitor is None\n                             or not cls.monitor.report()):\n```\n\n([std.py#L669-L670](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L669-L670)). `monitor_interval` is still `10`, so the first operand is truthy; `cls.monitor` is no longer `None`, so the question falls to `report()`:\n\n```python\ndef report(self):\n    return not self.was_killed.is_set()\n```\n\n([_monitor.py#L103-L104](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L103-L104)). The trace shows it returning `True`. The condition is therefore `10 and (False or False)` \u2014 false \u2014 and no new `TMonitor` is constructed. One daemon thread serves the whole process, surviving bars being created and closed. Note what was *not* checked: `report()` consults the kill event, not `is_alive()`. A monitor thread that died without setting the event would still report `True` and would not be replaced (inference from the two lines above; nothing in the trace exercises that case).\n\nHad a monitor been needed and its construction raised, the failure would not reach the caller:\n\n```python\nexcept Exception as e:  # pragma: nocover\n    warn(\"tqdm:disabling monitor support\"\n         \" (monitor_interval = 0) due to:\\n\" + str(e),\n         TqdmMonitorWarning, stacklevel=2)\n    cls.monitor_interval = 0\n```\n\n([std.py#L673-L677](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L673-L677)). A warning is emitted and monitoring is switched off for the rest of the process \u2014 the bar is delivered regardless.\n\n## What the shared thread is allowed to do to your bar\n\nThe thread this list's bar is now registered with is not passive. Every `sleep_interval` seconds it wakes, takes the same global write lock, and walks the instances that have a `start_t` \u2014 the half-built ones are skipped on purpose ([_monitor.py#L56-L60](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L56-L60), and recall Chapter 3's deliberate ordering). For each one:\n\n```python\nif (\n    instance.miniters > 1\n    and (cur_t - instance.last_print_t) >= instance.maxinterval\n):\n    instance.miniters = 1\n    instance.refresh(nolock=True)\n```\n\n([_monitor.py#L85-L93](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L85-L93)). That is the rescue for the hazard Chapter 8 will show being created: a bar whose self-tuned `miniters` grew large during fast iterations and then stalled when the loop slowed. The monitor forces `miniters` back to 1 and repaints from its own thread \u2014 holding the lock, which is why `refresh` is called with `nolock=True`. It re-checks the kill event inside the loop to keep shutdown prompt ([_monitor.py#L80-L82](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L80-L82)), and warns with `TqdmSynchronisationWarning` if the instance set changed under it ([_monitor.py#L96-L99](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L96-L99)).\n\n> **For the owner:** A tqdm bar means a shared daemon thread that mutates your bar's `miniters` and writes to your output stream on its own schedule. It is created at the first bar and lives until exit. Set `tqdm.tqdm.monitor_interval = 0` before any bar is constructed if an extra thread is unacceptable in your environment; accept that bars with long stalls will then stop refreshing until the loop itself calls `update`.\n\nShutdown was arranged back in Chapter 1 and is worth stating here, because it is where a thread like this usually goes wrong. The thread is `daemon` ([_monitor.py#L33](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L33)), and the `atexit` hook only sets the event \u2014 it deliberately does not join:\n\n```python\ndef _atexit_signal(self):\n    \"\"\"\n    Non-joining shutdown signal.\n    ...\n    \"\"\"\n    self.was_killed.set()\n```\n\n([_monitor.py#L42-L48](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L42-L48)). The joining variant exists as `exit()`, which also refuses to join itself ([_monitor.py#L50-L54](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L50-L54)). The net guarantee: interpreter exit cannot block on tqdm's monitor.\n\n> **For the owner:** The lock and the monitor are class attributes on `tqdm.std.tqdm`, so they are shared by every subclass and every library in the process that imports tqdm. Check that nothing in your dependency tree reassigns `tqdm.set_lock(...)` or `monitor_interval` behind your back, because those choices are process-wide, not per-bar.\n\n`__new__` releases the lock and returns `<tqdm.std.tqdm object at 0x109a02210>`: a bare object with no `iterable`, no `desc`, no `pos` \u2014 just a place in the registry and a claim on shared machinery. The list is still waiting outside.\n\n> **Leaves as:** `<tqdm.std.tqdm object at 0x109a02210>` \u2014 a bare, registered instance sharing the one `TqdmDefaultWriteLock` at `0x109742a50` and the one live `TMonitor` (`report() \u2192 True`, no second thread started) \u2014 about to be handed the list and `desc='Processing'` by `__init__`\n"}, {"n": 6, "title": "The same setup again, with a prefix", "data_in": "`tqdm.__init__(self, iterable=['a','b','c','d'], desc='Processing', total=None, ...)`", "data_out": "a fully initialised bar with `desc='Processing'`, `pos=0`, a fresh stderr wrapper and printer, and a first frame `'Processing:   0%|          | 0/4 [00:00<?, ?it/s]'` (50 chars written)", "span": [136, 226], "md": "# Chapter 6 \u00b7 The same setup again, with a prefix\n\n> **Enters as:** `tqdm.__init__(self=<tqdm object at 0x109a02210>, iterable=['a', 'b', 'c', 'd'], desc='Processing', total=None, leave=True, file=None, ncols=None, mininterval=0.1, maxinterval=10.0, miniters=None, ascii=None, disable=False, unit='it', unit_scale=False, dynamic_ncols=False, smoothing=0.3, bar_format=None, initial=0, position=None, postfix=None, unit_divisor=1000, write_bytes=False, lock_args=None, nrows=None, colour=None, delay=0.0, gui=False)`\n\nThe list arrives at the same door it went through in Chapters 2 and 3, and the sequence is identical, step for step. That sameness is the point of this chapter: initialisation is not adaptive. Whatever the caller passes, `__init__` runs one fixed script \u2014 wrap the stream, infer `total`, probe the terminal, detect Unicode, build the smoothers, claim a line under the lock, build the printer, paint one frame. Only one argument differs from the first bar, and it travels all the way to the left edge of the output.\n\n## The same seven steps, in the same order\n\nThe stream wrapping comes first. `file is None` so it becomes `sys.stderr` ([std.py#L968-L969](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L968-L969)), then `file = DisableOnWriteError(file, tqdm_instance=self)` ([std.py#L977](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L977)). The trace shows the wrapper being built fresh \u2014 `ObjectWrapper.__init__` stashing `_wrapped`, then two `disable_on_exception` closures installed over `write` and `flush` ([utils.py#L196-L203](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L196-L203)), this time bound by weak proxy to the *new* instance at `0x109a02210`. Each bar gets its own guard; they are not shared.\n\nThen `total`. The caller passed `total=None` and an iterable, so the same borrowing happens:\n\n```python\nif total is None and iterable is not None:\n    try:\n        total = len(iterable)\n    except (TypeError, AttributeError):\n        total = None\n```\n\n([std.py#L982-L986](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L982-L986)). `len(['a','b','c','d'])` is 4, and the trace confirms it downstream: `format_meter(n=0, total=4, ...)`.\n\nThen the terminal probe. `ncols` and `nrows` are both `None` and `file` compares equal to `sys.stderr` \u2014 that equality is `DisableOnWriteError.__eq__` unwrapping itself ([utils.py#L205-L206](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L205-L206)), returning `True` in the trace \u2014 so the else-branch calls `_screen_shape_wrapper()` and then its inner ([std.py#L1022-L1029](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1022-L1029)). It returns `(None, None)` again: `get_terminal_size` on a redirected stderr raises, and the bare `except Exception: return None, None` absorbs it ([utils.py#L270-L276](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L270-L276)). So `ncols` stays `None` \u2014 a 10-cell bar and no trimming \u2014 and `nrows` stays `None`, which `display` will later read as the fallback 20.\n\nThen Unicode: `ascii is None`, so `ascii = not _supports_unicode(file)` ([std.py#L1043-L1044](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1043-L1044)); the wrapper forwards `.encoding` as `'utf-8'`, `_is_utf` says `True`, so `ascii` becomes `False` and the bar will use the smooth block charset.\n\nThen the smoothers: three `EMA(0.3)` objects for increments, intervals, and miniters ([std.py#L1076-L1078](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1076-L1078)), each starting at `last = 0, calls = 0`.\n\n## The one difference: `desc` becomes a prefix\n\nThe new argument is stored in a single line:\n\n```python\nself.desc = desc or ''\n```\n\n([std.py#L1055](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1055)). `'Processing'` survives verbatim \u2014 no colon appended here. `format_dict` then publishes it under the key `prefix` ([std.py#L1464](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1464)), which is how the trace shows it reaching the renderer: `format_meter(..., prefix='Processing', ...)`. The colon is added at render time:\n\n```python\nif prefix:\n    # old prefix setup work around\n    bool_prefix_colon_already = (prefix[-2:] == \": \")\n    l_bar = prefix if bool_prefix_colon_already else prefix + \": \"\nelse:\n    l_bar = ''\n```\n\n([std.py#L582-L587](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L582-L587)). `'Processing'` does not end in `': '`, so it becomes `'Processing: '`. That check is what keeps `set_description` (which *does* append `': '`) from producing `'Processing a: : '` in Chapter 7. An empty `desc` takes the other branch and also strips a literal `'{desc}: '` out of any custom `bar_format` ([std.py#L624-L626](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L624-L626)), which is why the first bar's frame began with two spaces and a percentage rather than a stray colon.\n\n## Position 0, free again\n\nUnder the global lock:\n\n```python\nwith self._lock:\n    # mark fixed positions as negative\n    self.pos = self._get_free_pos(self) if position is None else -position\n```\n\n([std.py#L1095-L1097](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1095-L1097)). `_get_free_pos` collects `abs(inst.pos)` over every live instance except this one and returns the smallest non-negative integer not in that set ([std.py#L680-L685](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L680-L685)). The trace records `\u2192 0`. The first bar had held position 0; it is free now not because it was garbage-collected but because its `close()` ran `_decr_instances`, which removes the instance from `_instances` under the lock ([std.py#L697-L703](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L697-L703)).\n\n> **For the owner:** Line positions are reclaimed by `close()`, not by garbage collection, because `_get_free_pos` reads the registry that `_decr_instances` empties. A bar that is abandoned without closing keeps its slot until it is collected, so the next bar is pushed to the line below. Require `with tqdm(...)` or an explicit `close()` in code that creates bars in a loop.\n\n## The printer and the first frame\n\n`gui=False`, so the screen printer is built and, since `delay <= 0`, the bar paints immediately ([std.py#L1099-L1103](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1099-L1103)). `status_printer` closes over `last_len = [0]` and pads each write to erase whatever was longer before it ([std.py#L453-L459](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L453-L459)) \u2014 a fresh, zeroed memory for this bar, independent of the one the first bar used.\n\n`refresh` takes the lock, calls `display`, releases ([std.py#L1345-L1357](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1345-L1357)); `display` calls `self.__str__()`, which is `format_meter(**self.format_dict)` ([std.py#L1156-L1157](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1156-L1157)). The snapshot handed over is `n=0, total=4, elapsed=0, rate=None` \u2014 `rate` is `None` because `self._ema_dt()` is still `0` ([std.py#L1466](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1466)) \u2014 so the time fields render as `?`. A `FormatReplace` sentinel probes whether `{bar}` is used at all before the real `Bar` is built ([std.py#L630-L639](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L630-L639)); it is, and `Bar.__format__` at `frac=0.0` yields ten spaces ([std.py#L202-L208](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L202-L208)).\n\nThe result is `'Processing:   0%|          | 0/4 [00:00<?, ?it/s]'`. `disp_len` measures it at 49 columns \u2014 ANSI stripped, East-Asian wide characters counted double ([utils.py#L307-L312](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L307-L312)) \u2014 and `fp_write` emits `'\\r' + s`, 50 characters, through the error-swallowing wrapper.\n\n> **For the owner:** Two bars sharing stderr do not share the padding state that makes in-place updates work; each `status_printer` tracks its own `last_len`. Overlap is prevented only by distinct positions and the global write lock, so any code that writes to stderr outside tqdm (plain `print(file=sys.stderr)`) will garble the bar. Direct contributors to `tqdm.write` or the `external_write_mode` context manager instead.\n\nInitialisation closes by stamping the clock, deliberately last: `self.last_print_t = self._time()` and then `self.start_t = self.last_print_t`, with the comment `NB: Avoid race conditions by setting start_t at the very end of init` ([std.py#L1106-L1108](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1106-L1108)). Until that assignment the monitor thread from Chapter 5 would have skipped this instance; from here on it is a legitimate candidate for a forced refresh.\n\n> **Leaves as:** a fully initialised bar \u2014 `iterable=['a','b','c','d']`, `desc='Processing'`, `total=4`, `pos=0`, `ncols=None`, `nrows=None`, `ascii=False`, `miniters=0` with `dynamic_miniters=True`, `n=0`, `last_print_n=0`, `start_t` set \u2014 having written one 50-character frame `'\\rProcessing:   0%|          | 0/4 [00:00<?, ?it/s]'` to stderr, and ready for the caller's `for char in pbar:`\n"}, {"n": 7, "title": "Describing without counting: forced refreshes that show stale progress", "data_in": "first item `'a'` yielded, then `set_description('Processing a')`; same for `'b'`", "data_out": "two full repaints \\u2014 `'Processing a:   0%|          | 0/4 [00:00<?, ?it/s]'` and `'Processing b:   0%|          | 0/4 [00:00<?, ?it/s]'` \\u2014 while `n` is still 0 and two items have in fact been consumed", "span": [227, 322], "md": "# Chapter 7 \u00b7 Describing without counting: forced refreshes that show stale progress\n\n> **Enters as:** the bar at `0x109a02210` with `n=0`, `last_print_n=0`, `desc='Processing'`, `total=4`, `miniters=0`, `mininterval=0.1`, and the caller entering `for char in pbar:`\n\nThe list has been a passenger for two chapters. Now it starts giving up its contents, one at a time, and the first thing to say about `__iter__` is what it does *not* do to them:\n\n```python\nfor obj in iterable:\n    yield obj\n```\n\n([std.py#L1186-L1187](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1186-L1187)). The trace agrees: `tqdm.__iter__(self=<tqdm>) \u2192 'a'`. The same string object the caller put in comes back out. Everything tqdm does around that line is bookkeeping; the sequence itself is untouched.\n\nBefore the loop begins, `__iter__` copies the instance's state into locals \u2014 `mininterval`, `last_print_t`, `last_print_n`, `min_start_t`, and crucially `n = self.n` ([std.py#L1178-L1183](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1178-L1183)). From here on there are two counters: the generator's private `n`, which advances on every item, and `self.n`, which the display reads. They are not the same number, and this chapter is the gap between them.\n\n## `set_description` mutates, then insists on painting\n\nWith `'a'` in hand the caller sleeps 50 ms and calls `pbar.set_description(\"Processing a\")`. That method is two lines of work:\n\n```python\nself.desc = desc + ': ' if desc else ''\nif refresh:\n    self.refresh()\n```\n\n([std.py#L1399-L1401](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1399-L1401)). `desc` becomes `'Processing a: '` \u2014 the colon and space are appended here, which is why `format_meter`'s `prefix[-2:] == \": \"` check exists at the other end and declines to add a second one ([std.py#L582-L587](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L582-L587)). (`set_description_str` is the variant that stores the string verbatim ([std.py#L1403-L1407](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1403-L1407)).)\n\nThen `refresh()`. Not \"refresh if enough time has passed\" \u2014 `refresh` takes the global write lock, calls `display()`, and releases ([std.py#L1345-L1357](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1345-L1357)). There is no consultation of `mininterval` or `miniters` anywhere on this path. The throttling machinery that Chapter 4 described lives entirely inside `update`; `set_description` goes around it.\n\nSo the full render runs: `display` \u2192 `__str__` \u2192 `format_meter(**self.format_dict)` ([std.py#L1156-L1157](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1156-L1157)). The snapshot `format_dict` hands over is the one the trace records:\n\n```\n{'n': 0, 'total': 4, 'elapsed': 0.05352497100830078, 'prefix': 'Processing a: ', 'rate': None, ...}\n```\n\nTwo fields deserve attention. `elapsed` is computed live, `self._time() - self.start_t` ([std.py#L1463](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1463)), so the clock is honest: 53 ms have really passed. `rate` is `self._ema_dn() / self._ema_dt() if self._ema_dt() else None` ([std.py#L1466](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1466)) \u2014 and the trace shows `EMA.__call__(x=None) \u2192 0`, because no `update` has ever fed it an interval. `rate` is therefore `None`, and `format_meter` falls through to the `'?'` placeholders for speed and remaining time rather than dividing by zero ([std.py#L550-L559](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L550-L559), [std.py#L573-L574](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L573-L574)).\n\nAnd `n` is `0`. The item `'a'` has been consumed, the caller has already done its work with it, but `self.n` has not moved, because nothing has called `update`. `Bar` is constructed at `frac=0.0` and renders ten spaces ([std.py#L202-L208](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L202-L208)). The line that reaches the terminal is:\n\n```\nProcessing a:   0%|          | 0/4 [00:00<?, ?it/s]\n```\n\n`disp_len` measures it at 51 columns \u2014 ANSI stripped, wide characters counted double ([utils.py#L307-L312](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L307-L312)) \u2014 and `print_status` writes `'\\r' + s` with no padding, since 51 exceeds the previous 49 ([std.py#L453-L459](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L453-L459)). 52 characters go out through the error-swallowing wrapper.\n\n> **For the owner:** `set_description(..., refresh=True)` is the default and forces a full render plus a stream write on every call, ignoring `mininterval` and `miniters` entirely. In a loop that calls it per iteration this converts tqdm's throttled output into one frame per item. Pass `refresh=False` in hot loops and let the next `update` repaint.\n\n## The gate check that printed nothing\n\nThe caller's loop body ends and the generator resumes. This is where the throttling actually lives:\n\n```python\nn += 1\n\nif n - last_print_n >= self.miniters:\n    cur_t = time()\n    dt = cur_t - last_print_t\n    if dt >= mininterval and cur_t >= min_start_t:\n        self.update(n - last_print_n)\n```\n\n([std.py#L1190-L1196](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1190-L1196)). The private `n` becomes 1. The counter gate opens immediately \u2014 `1 - 0 >= 0`, since `miniters` is still the 0 that `dynamic_miniters` started it at. But `dt` is about 0.053 s and `mininterval` is 0.1, so the time gate stays shut and `update` is never called. The comment two lines above explains why this is inlined at all rather than calling `self.update(1)`: *does not call self.update(1) for speed optimisation* ([std.py#L1188-L1189](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1188-L1189)).\n\nThe trace shows this resumption only as its outcome \u2014 `tqdm.__iter__(self=<tqdm>) \u2192 'b'`, with no `update` beneath it. `'b'` goes to the caller untouched; `self.n` is still 0.\n\nThe body repeats: sleep, `set_description(\"Processing b\")`. `desc` becomes `'Processing b: '`, `refresh` fires again, and `format_dict` now reports `elapsed=0.10843706130981445` \u2014 the clock has moved \u2014 while `n` is still `0` and `rate` is still `None`. The frame is:\n\n```\nProcessing b:   0%|          | 0/4 [00:00<?, ?it/s]\n```\n\n51 columns again, 52 characters written. Two of the four items are gone and the meter has not budged off zero.\n\n> **For the owner:** The number on the bar is the last value `update` published, not the number of items the caller has consumed; `format_dict['n']` reports the same lagged value. Treat the display and `format_dict` as a monitoring view, not as a count you can act on. If a caller needs an exact consumed count, have them maintain it themselves or drive the bar manually with `update`.\n\nNothing here is a malfunction. The design is that cheap state changes (a description) may repaint freely, while the expensive, semantically meaningful counter advances only when both gates agree. The cost is a window \u2014 here two items wide \u2014 in which the terminal is confidently displaying a number that is out of date, with a live elapsed time beside it making the frame look fresher than it is.\n\n> **Leaves as:** the same bar with `n=0`, `last_print_n=0`, `desc='Processing b: '`, both EMAs still at zero and `rate` still `None`; two items (`'a'`, `'b'`) consumed by the caller, the generator's private `n` at 1, and the last line on screen reading `Processing b:   0%|          | 0/4 [00:00<?, ?it/s]`\n"}, {"n": 8, "title": "The gates open: update(2), the EMA rate, self-tuned miniters, and the run to 100%", "data_in": "`tqdm.__iter__` resumes for the third item and calls `tqdm.update(self, n=2)` with `dt \\u2248 0.11 s \\u2265 mininterval`", "data_out": "`n=2` published as `'Processing b:  50%|\\u2588\\u2588\\u2588\\u2588\\u2588     | 2/4 [00:00<00:00, 18.13it/s]'` with `miniters` tuned to `1.8125`; two more cosmetic `set_description` repaints at the same counter; then a second `update(2)` giving `n=4`, `'Processing d: 100%|\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588| 4/4 [00:00<00:00, 17.50it/s]'` and `miniters` retuned to `1.7514`", "span": [323, 529], "md": "# Chapter 8 \u00b7 The gates open: update(2), the EMA rate, self-tuned miniters, and the run to 100%\n\n> **Enters as:** the bar at `0x109a02210` with `n=0`, `last_print_n=0`, `desc='Processing b: '`, `miniters=0`, both EMAs empty; the generator's private `n` at 1, resuming for the third item\n\nThe caller's loop body has finished with `'b'`. The generator wakes up at the same four lines that declined to do anything last time:\n\n```python\nn += 1\n\nif n - last_print_n >= self.miniters:\n    cur_t = time()\n    dt = cur_t - last_print_t\n    if dt >= mininterval and cur_t >= min_start_t:\n        self.update(n - last_print_n)\n```\n\n([std.py#L1190-L1196](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1190-L1196)). Private `n` becomes 2. The counter gate opens as before. This time `dt` is about 0.110 s \u2014 the two sleeps since the last publication \u2014 and `mininterval` is 0.1. Both gates agree, and for the first time in this bar's life the trace shows something underneath `__iter__`: `tqdm.update(self=<tqdm>, n=2)`.\n\nNote the argument. Not `1` per item: `n - last_print_n`, the whole backlog at once. The two items that were consumed in silence are published together.\n\n## Inside `update`: gates again, then the averages\n\n`update` does not trust its caller. It re-runs the same two gates on its own state ([std.py#L1237-L1240](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1237-L1240)), because it is also the public API \u2014 the method a caller uses directly when driving a bar by hand. (A negative `n` is tolerated: `last_print_n` is decremented to match so the auto-refresh arithmetic still works on a meter that goes backwards ([std.py#L1232-L1233](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1232-L1233)). On a disabled bar the whole method is a `return` ([std.py#L1229-L1230](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1229-L1230)).)\n\n`self.n` becomes 2. The cheap counter check comes first *specifically* to avoid calling `time()` on every iteration \u2014 that is the comment on the line ([std.py#L1236-L1238](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1236-L1238)). Then `dn = 2`, and with `smoothing` truthy and both `dt` and `dn` non-zero, the two accumulators are finally fed ([std.py#L1243-L1246](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1243-L1246)):\n\n```\nEMA.__call__(self=<EMA>, x=2) \u2192 1.9999999999999996\n```\n\nThat is `_ema_dn`. Its arithmetic is `last = alpha*x + beta*last`, returned de-biased by `1 - beta**calls` ([std.py#L235-L239](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L235-L239)) \u2014 the division is what makes a *first* sample report itself rather than three-tenths of itself, and the floating-point residue 1.9999999999999996 is the visible trace of it. `_ema_dt` takes the interval the same way.\n\nThen `refresh(lock_args=self.lock_args)`, and the render chain runs as in Chapter 7 \u2014 except that `format_dict` now finds a non-zero `_ema_dt()` (0.11034297943115233) and so computes a real rate instead of `None` ([std.py#L1466](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1466)):\n\n```\nrate = 1.9999999999999996 / 0.11034297943115233 = 18.125303578991037\n```\n\nThis is an *exponential moving average* of increments over intervals, not `n/elapsed`. Recent intervals dominate; `smoothing=0.3` is the dial. With a rate in hand, `format_meter` stops printing `'?'`: `inv_rate` is 0.055, less than 1, so the non-inverted form wins and `rate_fmt` becomes `'18.13it/s'` ([std.py#L552-L559](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L552-L559)), and `remaining = (4 - 2)/18.125` formats as `'00:00'` ([std.py#L573-L574](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L573-L574)). `Bar` is built at `frac=0.5`; `divmod(int(0.5 * 10 * 8), 8)` gives five whole blocks and no partial, padded to ten cells ([std.py#L202-L207](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L202-L207)):\n\n```\nProcessing b:  50%|\u2588\u2588\u2588\u2588\u2588     | 2/4 [00:00<00:00, 18.13it/s]\n```\n\n59 columns by `disp_len`, 60 characters written. The counter has jumped from 0 to 2 in one step.\n\n> **For the owner:** tqdm guarantees it will not spam the terminal faster than `mininterval`; it does not guarantee any particular number of intermediate frames, and a short or fast loop may show only its first and last. Do not build logging or monitoring that assumes a frame per iteration.\n\n## The bar rewrites its own throttle\n\nBack in `update`, after the print, `dynamic_miniters` takes over ([std.py#L1248-L1263](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1248-L1263)). `dt` (0.110) is well under `maxinterval` (10), so the smoothed branch runs:\n\n```\nEMA.__call__(self=<EMA>, x=1.8125303578991039) \u2192 1.8125303578991034\n```\n\n`miniters` is now 1.8125 \u2014 a float, which is fine because the gate is a `>=` comparison, not an index. The bar has just decided, from observed speed, that roughly 1.8 items fit into a `mininterval`, and it will skip the clock entirely until that many have accumulated. `last_print_n` and `last_print_t` are stored, and `update` returns `True` \u2014 its documented signal that a display actually happened ([std.py#L1226-L1228](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1226-L1228), [std.py#L1266-L1268](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1266-L1268)).\n\n> **For the owner:** `update()` returns `True` only when a frame was drawn, which is the supported hook for custom callbacks that want tqdm's throttling rather than their own; everything else returns `None`. Point integrators at that return value instead of having them re-implement rate limiting.\n\nItem `'c'` is yielded. The caller sleeps and calls `set_description(\"Processing c\")`, which \u2014 as Chapter 7 established \u2014 bypasses both gates and repaints immediately ([std.py#L1399-L1401](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1399-L1401)). The EMAs have not been touched, so `format_dict` reports the same `rate=18.125303578991037`, and `elapsed` has crept to 0.1675:\n\n```\nProcessing c:  50%|\u2588\u2588\u2588\u2588\u2588     | 2/4 [00:00<00:00, 18.13it/s]\n```\n\nThe generator resumes: private `n` becomes 3, and `3 - 2 = 1` is *not* `>= 1.8125`. The counter gate is shut, so `time()` is never called at all \u2014 the cheap check doing exactly its job. `'d'` is yielded, `set_description(\"Processing d\")` forces another identical repaint at `elapsed=0.2253`, still `2/4`, still `18.13it/s`.\n\n> **For the owner:** The rate on screen is the rate as of the last counter publication, not an instantaneous measurement \u2014 three consecutive frames here report `18.13it/s` while no new timing sample exists. Also note that `dynamic_miniters` can leave `miniters` large after a burst of fast iterations, freezing the bar if the loop then slows; the recovery is the monitor thread, which forces `miniters = 1` and a refresh once `maxinterval` is exceeded ([_monitor.py#L85-L93](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/_monitor.py#L85-L93)). Setting `tqdm.monitor_interval = 0` removes that rescue.\n\n## Four of four\n\nThe last resumption: private `n` becomes 4, `4 - 2 = 2 >= 1.8125`, `dt \u2248 0.117 >= 0.1`. `update(2)` again. `self.n` becomes 4; `_ema_dn(2)` returns exactly `2.0` this time, `_ema_dt` settles at `0.1142889471615062`, and the rate is `17.499504979897324` \u2014 the second interval was slightly longer, and the average bent toward it.\n\n`format_meter` first checks whether the total is still meaningful: `n >= total + 0.5` would discard it and fall back to a counter-only line ([std.py#L533-L536](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L533-L536)). `4 >= 4.5` is false, so `total=4` survives and `frac` is exactly 1.0. `Bar` computes `divmod(80, 8) = (10, 0)`; `bar_length` is not less than `N_BARS`, so no padding is appended and the bar is ten solid blocks ([std.py#L205-L207](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L205-L207)):\n\n```\nProcessing d: 100%|\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588| 4/4 [00:00<00:00, 17.50it/s]\n```\n\n59 columns, 60 characters, written under the global lock like every other frame. Then `miniters` is retuned one last time, `EMA(1.7086550917816143) \u2192 1.7514272601829333`, `last_print_n` becomes 4, and `update` returns `True`.\n\nThe list is empty. The generator's `for` loop is about to raise `StopIteration` into its `finally`.\n\n> **Leaves as:** the bar with `n=4`, `last_print_n=4`, `miniters=1.7514272601829333`, EMAs at `dn=2.0` and `dt=0.1142889471615062`, the screen showing `Processing d: 100%|\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588| 4/4 [00:00<00:00, 17.50it/s]`, and `update` having returned `True` to an iterator one step from its `finally`\n"}, {"n": 9, "title": "Closing down: leaving the registry, the truth about the rate, and reading a dead bar", "data_in": "the generator's `finally` calls `tqdm.close(self)` on a bar with `n=4`, `pos=0`, `leave=True`; afterwards the caller reads `pbar.format_dict` and calls `close()` again", "data_out": "instance removed from `_instances`; final frame `'Processing d: 100%|\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588| 4/4 [00:00<00:00, 17.39it/s]'` followed by `'\\n'`; `disable=True`; `format_dict` still returns `{'n': 4, 'total': 4, 'elapsed': 0.2319, ...}` and both the explicit `close()` and `__del__`'s `close()` return `None` immediately", "span": [530, 610], "md": "# Chapter 9 \u00b7 Closing down: leaving the registry, the truth about the rate, and reading a dead bar\n\n> **Enters as:** the bar at `0x109a02210` with `n=4`, `last_print_n=4`, `pos=0`, `leave=True`, `disable=False`, screen showing `Processing d: 100%|\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588| 4/4 [00:00<00:00, 17.50it/s]`, and `StopIteration` arriving in the generator's `finally`\n\nThe `for` loop inside `__iter__` has nothing left to pull. Control falls into the two lines that were waiting the whole time ([std.py#L1199-L1201](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1199-L1201)): `self.n = n`, then `self.close()`. They sit in a `finally`, which is the real guarantee here \u2014 a `break`, an exception in the caller's body, a `return` out of the loop, all land in the same place. The terminal is left tidy whether or not the loop finished.\n\n## Leaving the registry\n\n`close` opens with a guard that doubles as a latch ([std.py#L1270-L1276](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1270-L1276)):\n\n```python\nif getattr(self, 'disable', True):\n    return\nself.disable = True\n```\n\nThe `getattr` default of `True` is defensive: a bar that failed halfway through `__init__` has no `disable` attribute and is treated as already closed rather than crashing in a destructor. For this bar, `disable` was `False`, so the latch flips and everything after this point will happen exactly once.\n\n`pos = abs(self.pos)` is read *before* deregistration, then `_decr_instances(self)` ([std.py#L1278-L1280](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1278-L1280)) takes the process-global lock \u2014 the same `TqdmDefaultWriteLock` from Chapter 1 \u2014 and removes the instance from the `WeakSet` ([std.py#L697-L703](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L697-L703)). The trace shows the removal machinery working: `tqdm.__hash__ \u2192 4456456720`, which is just `id(self)` ([std.py#L1163-L1164](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1163-L1164)), followed by `Comparable.__eq__` ([utils.py#L108-L109](https://github.com/tqdm/tqdm/bl
