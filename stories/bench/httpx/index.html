with the transport. `httpx.WSGITransport(app=app)` does nothing clever: it stores the callable and four defaults on itself and returns \u2014 `raise_app_exceptions=True`, `script_name=\"\"`, `remote_addr=\"127.0.0.1\"`, `wsgi_errors=None` ([wsgi.py#L77-L89](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L77-L89)). No connection pool, no SSL context, no DNS. Everything that will later be called \"sending a request\" is, from this object's point of view, calling `app(environ, start_response)`.\n\nThen `httpx.Client(transport=transport, base_url=\"http://testserver\")`. The constructor hands almost all of its work to `BaseClient.__init__` ([_client.py#L662-L674](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L662-L674)), which is where the configuration that will shape our request gets fixed in place.\n\nThe base URL is parsed first. `URL(\"http://testserver\")` runs the full RFC 3986 pipeline \u2014 scheme lowercased, host quoted and validated, port normalised (`normalize_port('', 'http')` \u2192 `None`), path validated and normalised \u2014 and comes back as `ParseResult(scheme='http', userinfo='', host='testserver', port=None, path='', query=None, fragment=None)`. Then `_enforce_trailing_slash` asks for `url.raw_path`, gets `b'/'` because an empty path reads as `/`, sees that it already ends in a slash, and returns the URL untouched ([_client.py#L234-L237](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L234-L237)). That trailing slash matters later: it is the invariant that makes relative-URL merging append rather than overwrite.\n\nThe headers setter is the next character, and it is opinionated. Whatever you pass, it first builds four defaults and then layers your headers on top ([_client.py#L305-L316](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L305-L316)):\n\n``` False` even though `trust_env` is still `True`. So `_get_proxy_map(proxy=None, allow_env_proxies=False)` skips the `get_environment_proxies()` branch entirely and returns `{}` ([_client.py#L239-L251](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L239-L251)). `_mounts` is built from that empty map, no `mounts=` argument arrives to extend it, and `dict(sorted(...))` sorts nothing ([_client.py#L697-L716](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L697-L716)). An empty mount table is a guarantee: when the request later asks which transport should carry it, there is only one answer.\n\n`_init_transport` confirms it. Its first two lines are `if transport is not None: return transport` ([_client.py#L728-L729](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L728-L729)) \u2014 so the `verify=True`, `cert`, `http1`/`http2` and `limits` arguments that were threaded all the way down are simply discarded, and no `HTTPTransport`, no SSL context and no `httpcore` pool is ever constructed. Had `transport` been `None`, this is where the real networking stack would have been built.\n\n> **For the owner:** supplying `transport=` silently disables environment-variable proxying, because `allow_env_proxies` requires `transport is None`. If any deployment relies on `HTTP_PROXY`/`HTTPS_PROXY` while also passing a custom transport, that proxy will not be used; configure the proxy on the transport instead.\n\nFinally the `with` block. `Client.__enter__` checks the state first and refuses anything other than `UNOPENED`, raising `RuntimeError(\"Cannot open a client instance more than once.\")` or the reopen-after-close variant ([_client.py#L1275-L1283](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1275-L1283)). Our client is `UNOPENED`, so the state flips to `OPENED` and every transport is entered \u2014 here just the one, whose `BaseTransport.__enter__` returns itself and does nothing else ([base.py#L15-L16](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/base.py#L15-L16)). The client itself is returned to the caller.\n\nThe road is finished. At the far end of it sits a twelve-line Python function; between it and the caller there is a headers dict, a cookie jar, a timeout, a redirect policy and an empty mount table. `\"/\"` and `{\"X-Custom\": \"value\"}` are about to be handed in.\n\n> **Leaves as:** an `OPENED` `Client` whose `_transport` **is** the caller's `WSGITransport`, `_mounts == {}`, `base_url == URL('http://testserver')` with `raw_path == b'/'`, default headers `Accept: */*` / `Accept-Encoding: gzip, deflate` / `Connection: keep-alive` / `User-Agent: python-httpx/0.28.1`, `Timeout(5.0)` on all four phases, `follow_redirects=False`, `max_redirects=20`\n"}, {"n": 2, "title": "\"/\" becomes an absolute URL", "data_in": "url='/' as handed to client.get(), together with the client's base_url", "data_out": "URL('http://testserver/') \ter scheme 'http', host 'testserver', port None, path '/', no query, no fragment", "span": [76, 135], "md": "# Chapter 2 \u00b7 \"/\" becomes an absolute URL\n\n> **Enters as:** `url='/'`, handed to `client.get(\"/\", headers={\"X-Custom\": \"value\"})`, with `base_url == URL('http://testserver')` waiting on the client\n\nThe string is one character long. It names no host, no scheme, no port \u2014 it is a path and nothing else, and on its own it could not be sent anywhere. The next few frames are about giving it an origin.\n\n`Client.get` does almost nothing with it. The method is a forwarder: it packs its arguments and calls `self.request(\"GET\", url, ...)` ([_client.py#L1053-L1063](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1053-L1063)). `request()` is barely thicker. It checks whether per-request `cookies=` were passed, and since `cookies is None` it skips the `DeprecationWarning` that would otherwise fire ([_client.py#L804-L810](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L804-L810)) \u2014 httpx would rather you set cookies on the client, because per-request cookies have ambiguous persistence across redirects. Then it calls `build_request()` ([_client.py#L812-L825](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L812-L825)), and the first thing `build_request` does is `url = self._merge_url(url)` ([_client.py#L366](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L366)).\n\n## Parsing it on its own terms first\n\n`_merge_url` does not treat `'/'` as a fragment of text to be concatenated. It parses it as a URL in its own right: `URL('/')` ([_client.py#L396](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L396)), which runs the same `urlparse` pipeline the base URL went through in chapter 1.\n\nThat pipeline opens with two checks that apply to every URL the client will ever build. A URL longer than `MAX_URL_LENGTH` (65536) raises `InvalidURL(\"URL too long\")`, and any ASCII character that is not printable \u2014 a tab, a carriage return, a newline \u2014 raises `InvalidURL` naming the character and its position ([_urlparse.py#L218-L229](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L218-L229)). That second check is the client's guard against request-line injection: you cannot smuggle a `\\r\\n` through a URL argument and have it reach the wire.\n\n> **For the owner:** URL construction rejects embedded CR, LF and tab with `InvalidURL` before any transport sees the value ([_urlparse.py#L221-L229](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L221-L229)). Note that this is an `InvalidURL`, which is not a subclass of `httpx.HTTPError` ([_exceptions.py#L271-L277](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_exceptions.py#L271-L277)); make sure callers that build URLs from untrusted input catch it explicitly rather than relying on a blanket `except httpx.HTTPError`.\n\nThe regex splits `'/'` into an empty scheme, an empty authority and a path of `'/'`. Each component is then normalised. `encode_host('')` short-circuits on the empty string and returns `''` ([_urlparse.py#L348-L350](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L348-L350)). `normalize_port('', '')` returns `None` ([_urlparse.py#L405-L406](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L405-L406)). `validate_path('/', has_scheme=False, has_authority=False)` takes the relative-URL branch and checks two things: that the path does not begin with `//`, which would be read as an authority, and that it does not begin with `:`, which would be read as a scheme ([_urlparse.py#L435-L444](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L435-L444)). A single slash passes both. Note what *didn't* run: `normalize_path` is only called when there is a scheme or an authority ([_urlparse.py#L328-L329](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L328-L329)), so a bare relative path keeps its `.` and `..` segments at this stage. Finally `quote('/', safe=PATH_SAFE)` leaves the slash alone, since `/` is in the path-safe set.\n\nWhat comes back is `ParseResult(scheme='', userinfo='', host='', port=None, path='/', query=None, fragment=None)` \u2014 a URL with a path and nothing else.\n\n## The branch that decides the host\n\n`_merge_url` now asks the question that matters: `if merge_url.is_relative_url` ([_client.py#L397](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L397)). That property is the negation of `is_absolute_url`, which is `bool(scheme and host)` ([_urls.py#L307-L325](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L307-L325)). Both are empty, so `is_absolute_url` is `False` and `is_relative_url` is `True`.\n\nThis is a fork worth naming, because it is the whole security story of `base_url`. Had the caller passed `\"http://evil.example.com/path\"` instead of `\"/\"`, `is_relative_url` would be `False`, the function would return at the last line \u2014 `return merge_url` ([_client.py#L411](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L411)) \u2014 and `base_url` would be ignored entirely. `base_url` constrains only relative arguments.\n\n> **For the owner:** `base_url` is a convenience for relative paths, not a containment boundary. An absolute URL argument bypasses it completely ([_client.py#L396-L411](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L396-L411)). If any URL fed to this client can come from user input, validate the host yourself before the call.\n\nTaking the relative road, the merge is two lines:\n\n```python\nmerge_raw_path = self.base_url.raw_path + merge_url.raw_path.lstrip(b\"/\")\nreturn self.base_url.copy_with(raw_path=merge_raw_path)\n```\n\n([_client.py#L409-L410](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L409-L410)). The base's `raw_path` is `b'/'` \u2014 the trailing slash chapter 1 guaranteed \u2014 and `b'/'.lstrip(b\"/\")` is `b''`, so `merge_raw_path` is `b'/'`. The construction is always *append*, never *replace*: because the base always ends in `/` and the leading slashes are stripped from the argument, `\"/path\"` and `\"path\"` produce the same result, and neither can escape upward out of the base path at this step.\n\n## Rebuilding on the base\n\n`copy_with(raw_path=b'/')` routes through `URL(self, raw_path=...)` ([_urls.py#L327-L340](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L327-L340)). The keyword passes the type check \u2014 `raw_path` is declared as `bytes` \u2014 and is decoded to the string `'/'` ([_urls.py#L104-L105](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L104-L105)). Because the source is a `URL` rather than a string, it becomes `ParseResult.copy_with` ([_urls.py#L118-L119](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L118-L119)), which reassembles the base's components into a defaults dict \u2014 including `authority`, computed as `'testserver'` \u2014 overlays the new `raw_path`, and re-runs `urlparse(\"\")` with all of them as keyword arguments ([_urlparse.py#L186-L198](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L186-L198)).\n\nInside, `raw_path` is split back apart at the first `?`: `kwargs[\"path\"] = '/'`, and since there was no separator, `kwargs[\"query\"] = None` ([_urlparse.py#L251-L255](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L251-L255)). That `None` rather than `''` is deliberate: it is how httpx distinguishes a URL with no query from one ending in a bare `?`.\n\nThen the whole validation pipeline runs again on the merged components, which is the point of rebuilding rather than string-splicing. `encode_host('testserver')` lowercases and quotes it back to `'testserver'`. `normalize_port('', 'http')` returns `None`. `validate_path('/', has_scheme=True, has_authority=True)` now takes the *absolute* branch \u2014 the path must be empty or begin with `/` ([_urlparse.py#L429-L433](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L429-L433)) \u2014 and passes. And because there is now a scheme and an authority, `normalize_path('/')` runs this time, dropping any `.` and `..` segments ([_urlparse.py#L447-L475](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L447-L475)). With a lone slash there is nothing to drop, but this is where `base_url + \"../../etc\"` would be collapsed rather than sent as-is.\n\nThe result is `ParseResult(scheme='http', userinfo='', host='testserver', port=None, path='/', query=None, fragment=None)`, wrapped as `URL('http://testserver/')` and returned to `build_request`.\n\n> **For the owner:** URL normalisation is lossy by design \u2014 scheme lowercased, default ports dropped to `None`, `.`/`..` segments collapsed, IDNA hostnames encoded or rejected with `InvalidURL` ([_urlparse.py#L318-L345](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L318-L345)). If any downstream system compares or signs URL strings, compare the normalised `str(request.url)`, not the string the caller supplied.\n\nNote what the host now is: `'testserver'`, a name that resolves nowhere. Nothing in this chapter tried to resolve it, and nothing downstream will \u2014 but that is chapter 5's story.\n\n> **Leaves as:** `URL('http://testserver/')` \u2014 scheme `'http'`, host `'testserver'`, port `None`, path `'/'`, query `None`, fragment `None`, `raw_path == b'/'` \u2014 returned from `_merge_url` into `build_request`\n"}, {"n": 3, "title": "Merging, then becoming a Request", "data_in": "headers={'X-Custom': 'value'}, cookies=None, params=None, timeout=USE_CLIENT_DEFAULT, plus the URL from chapter 2", "data_out": "<Request('GET', 'http://testserver/')> with Host first in headers, X-Custom present, stream=ByteStream(b''), _content=b'', extensions={'timeout': {'connect': 5.0, 'pool': 5.0, 'read': 5.0, 'write': 5.0}}", "span": [136, 246], "md": "# Chapter 3 \u00b7 Merging, then becoming a Request\n\n> **Enters as:** `URL('http://testserver/')` from `_merge_url`, alongside `headers={'X-Custom': 'value'}`, `cookies=None`, `params=None`, `timeout=USE_CLIENT_DEFAULT`, `extensions=None`\n\n`build_request` works through its arguments in order, and each one gets the same treatment: take whatever the client holds, take whatever the caller passed, and produce a single merged value ([_client.py#L366-L369](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L366-L369)). The URL has already been through that mill. The headers are next.\n\n## Four defaults and one caller\n\n`_merge_headers` copies the client's headers into a fresh `Headers` instance and then calls `.update()` with the caller's dict ([_client.py#L424-L431](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L424-L431)). The copy matters: the client's own `Headers` object is never mutated by a request, so concurrent requests on a shared client cannot scribble on each other's defaults.\n\n`Headers.update` is not a plain extend. It builds a `Headers` from the argument, and for every key in it that already exists on the target, it *pops* the existing entry before appending the new list ([_models.py#L274-L279](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L274-L279)). In the trace you can watch the lookup happen: `keys()` on the incoming headers yields `dict_keys(['x-custom'])` \u2014 already lower-cased \u2014 and `__contains__('x-custom')` against the client's four defaults returns `False`, so nothing is popped. Every header is stored as a triple of `(raw_key, lower_key, value)`, so the wire casing `X-Custom` is preserved while comparisons use `x-custom` ([_models.py#L155-L162](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L155-L162), [_models.py#L346-L348](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L346-L348)).\n\nBoth the key and the value are coerced to bytes on the way in \u2014 `'X-Custom'` \u2192 `b'X-Custom'`, `'value'` \u2192 `b'value'` \u2014 using ASCII unless an explicit encoding was given ([_models.py#L67-L82](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L67-L82)). A non-str, non-bytes value raises `TypeError` here rather than failing somewhere down in the transport.\n\nWhat comes back is `Headers({'accept': '*/*', 'accept-encoding': 'gzip, deflate', 'connection': 'keep-alive', 'user-agent': 'python-httpx/0.28.1', 'x-custom': 'value'})` \u2014 the four client defaults from chapter 1, plus the caller's one.\n\n> **For the owner:** A per-request header replaces a client-level header of the same name case-insensitively, rather than being sent alongside it ([_models.py#L274-L279](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L274-L279)). If your client is configured with a credential header, a caller passing `headers={\"authorization\": ...}` silently overrides it. Decide whether that override is intended, and keep credentials in an `auth=` scheme rather than a default header if it is not.\n\n## Two merges that decline to do anything\n\n`_merge_cookies` is guarded: it only builds a merged jar `if cookies or self.cookies` ([_client.py#L418](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L418)). The argument is `None` and `Cookies.__bool__` on the client's empty jar returns `False` ([_models.py#L1228-L1231](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L1228-L1231)), so it returns `cookies` unchanged \u2014 `None`. No `Cookie:` header will be constructed for this request. That is the quiet half of httpx's cookie design: the client's jar, not the request, is the authority on cookies.\n\n`_merge_queryparams` is shaped the same way ([_client.py#L440-L443](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L440-L443)). `QueryParams('')` on the client is falsy, the argument is `None`, so it returns `None` and the URL's query stays absent rather than becoming an empty `?`.\n\n## The timeout becomes cargo\n\nNow the one piece of configuration that travels *inside* the request. `extensions` is `None`, so it starts as `{}`; `\"timeout\"` is not in it, so the client's timeout is resolved. `timeout` is a `UseClientDefault` sentinel, so `self.timeout` wins \u2014 `Timeout(timeout=5.0)` \u2014 and `as_dict()` flattens it to `{'connect': 5.0, 'read': 5.0, 'write': 5.0, 'pool': 5.0}` ([_client.py#L371-L377](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L371-L377), [_config.py#L132-L138](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_config.py#L132-L138)). The dict is attached as `extensions={'timeout': ...}`.\n\nNote the shape of the condition. If the caller had supplied their own `extensions` containing a `\"timeout\"` key, the entire block is skipped and the client-level timeout never appears \u2014 caller-supplied extensions win outright, with no merge.\n\n> **For the owner:** Passing `extensions={\"timeout\": ...}` suppresses the client's configured timeout for that request entirely ([_client.py#L371](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L371)). Grep for `extensions=` in calling code and confirm each occurrence either carries a complete timeout dict or deliberately disables timeouts. Note also that this step only *records* the timeout on the request; nothing here enforces it.\n\n## Becoming a Request\n\nWith all four merged values in hand, `build_request` constructs the `Request` ([_client.py#L378-L389](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L378-L389)).\n\nThe constructor uppercases the method to `'GET'`, re-wraps the URL (a `copy_with()` with no changes, returning the same components), and copies the headers again into the request's own `Headers` ([_models.py#L398-L401](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L398-L401)). `self.extensions = dict(extensions)` is likewise a copy, so the dict the client built cannot be mutated out from under the request. The `cookies` branch is skipped, since cookies is `None` ([_models.py#L403-L404](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L403-L404)).\n\n`stream` is `None`, so the body is encoded. First a `content-type` lookup, which returns `None`, so `get_multipart_boundary_from_content_type(None)` returns `None` ([_models.py#L407-L418](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L407-L418), [_multipart.py#L56-L67](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_multipart.py#L56-L67)) \u2014 that lookup exists so that a caller who sets their own multipart content-type gets their boundary honoured rather than a fresh random one.\n\n`encode_request` then walks its cascade \u2014 `data`, `content`, `files`, `data`, `json` \u2014 and reaches the bottom with all of them `None`, returning `({}, ByteStream(b\"\"))` ([_content.py#L186-L218](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_content.py#L186-L218)). No content headers at all: no Content-Type, no Content-Length. (Had the caller passed `data=b\"...\"`, the first branch would have rerouted it to `encode_content` with a `DeprecationWarning` \u2014 a `requests` compatibility shim, not the intended API ([_content.py#L197-L207](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_content.py#L197-L207)).)\n\n## `_prepare`: the headers the caller didn't write\n\n`_prepare` receives that empty default-header dict, so its `setdefault` loop does nothing \u2014 including the branch that drops a `Transfer-Encoding` default when `Content-Length` was set explicitly, which exists to stop the two framing headers from contradicting each other ([_models.py#L442-L446](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L442-L446)).\n\nThen three membership checks, visible in the trace as one `__contains__` plus two more: `Host`, `Content-Length`, `Transfer-Encoding`. All absent. So `Host` is auto-added from `url.netloc` \u2014 `b'testserver'` ([_models.py#L450-L456](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L450-L456)) \u2014 and `Content-Length: 0` is *not*, because that is only added for `POST`, `PUT` and `PATCH` ([_models.py#L457-L458](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L457-L458)). A GET with no body therefore goes out with no framing header at all.\n\nThe final line rebuilds the header list as `auto_headers + self.headers.raw` ([_models.py#L460](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L460)), which is why `Host` lands first and the caller's ordering is otherwise preserved: `Host, Accept, Accept-Encoding, Connection, User-Agent, X-Custom`.\n\n> **For the owner:** `Host` is derived from the URL only when the caller did not supply one ([_models.py#L450-L456](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L450-L456)). A caller-supplied `Host` header overrides it while the connection target still comes from the URL, which changes virtual-host routing on the server. Treat a user-controllable `Host` header as a routing control, not a cosmetic one.\n\n## Read before it leaves\n\nLast, because the stream is a `ByteStream`, the constructor reads it immediately ([_models.py#L422-L423](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L422-L423)). `read()` joins the stream into `self._content = b''` ([_models.py#L468-L480](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L468-L480)). An in-memory body is buffered up front so that `request.content` is always available and the body can be sent more than once; a generator or file-iterator body would have been left lazy, and would be unrepeatable.\n\n`build_request` returns `<Request('GET', 'http://testserver/')>` to `request()`, which passes it straight to `send()`.\n\n> **Leaves as:** `<Request('GET', 'http://testserver/')>` \u2014 method `'GET'`, headers raw `[(b'Host', b'testserver'), (b'Accept', b'*/*'), (b'Accept-Encoding', b'gzip, deflate'), (b'Connection', b'keep-alive'), (b'User-Agent', b'python-httpx/0.28.1'), (b'X-Custom', b'value')]`, `stream=ByteStream(b'')`, `_content == b''`, `extensions == {'timeout': {'connect': 5.0, 'read': 5.0, 'write': 5.0, 'pool': 5.0}}`\n"}, {"n": 4, "title": "send(): state, auth resolution, transport selection", "data_in": "<Request('GET','http://testserver/')>, stream=False, auth=USE_CLIENT_DEFAULT, follow_redirects=USE_CLIENT_DEFAULT", "data_out": "state=OPENED, follow_redirects resolved to False, auth resolved to a bare <httpx.Auth>, history=[], transport = the caller's WSGITransport, perf-counter start captured, request_context entered", "span": [247, 266], "md": "# Chapter 4 \u00b7 send(): state, auth resolution, transport selection\n\n> **Enters as:** `<Request('GET', 'http://testserver/')>` with `stream=ByteStream(b'')`, `extensions={'timeout': {'connect': 5.0, 'read': 5.0, 'write': 5.0, 'pool': 5.0}}`, handed to `Client.send(request, stream=False, auth=USE_CLIENT_DEFAULT, follow_redirects=USE_CLIENT_DEFAULT)`\n\n`request()` does nothing further with the request; it forwards it straight into `send()` ([_client.py#L825](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L825)). From here the request stops being assembled and starts being dispatched, through three nested layers \u2014 auth, redirects, single request \u2014 before anything touches the application.\n\n## The gate at the door\n\nThe first thing `send()` does is check the client's lifecycle: if `self._state == ClientState.CLOSED`, it raises `RuntimeError(\"Cannot send a request, as the client has been closed.\")` ([_client.py#L900-L901](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L900-L901)). Our client was moved to `OPENED` by the `with` block in chapter 1, so the check passes; the next line sets `OPENED` again, unconditionally ([_client.py#L903](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L903)). That assignment is what lets a client be used without a `with` block at all \u2014 the first `send()` opens it.\n\nThen `follow_redirects` is resolved. The argument is the `UseClientDefault` sentinel, so the client's value wins: `False` ([_client.py#L904-L908](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L904-L908)). The sentinel exists precisely so that `follow_redirects=False` passed explicitly is distinguishable from \"not passed\" \u2014 `None` could not carry that distinction.\n\n> **For the owner:** The client's state transition to `CLOSED` is one-way; after `close()` or leaving the `with` block, every subsequent `send()` raises `RuntimeError` and `__enter__` refuses to reopen it ([_client.py#L900-L901](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L900-L901), [_client.py#L1275-L1283](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1275-L1283)). Check that any long-lived client in your code is created once and shared, not created per `with` block inside a request handler.\n\n## A no-op that is not dead code\n\n`_set_timeout(request)` runs next ([_client.py#L910](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L910)). It checks `if \"timeout\" not in request.extensions` and, finding the key already there from chapter 3, returns immediately ([_client.py#L584-L591](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L584-L591)). The trace records the call and an immediate `\u2192 None`.\n\nIt matters for the other entry point. A caller who constructs `httpx.Request(...)` by hand and passes it to `send()` bypasses `build_request` entirely, and would otherwise have no timeout attached at all. This line is what makes `client.send(hand_built_request)` inherit the client's timeout policy.\n\n## Who gets to sign the request\n\n`_build_request_auth(request, USE_CLIENT_DEFAULT)` resolves authentication ([_client.py#L457-L473](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L457-L473)). The sentinel means \"use the client's\", and the client's `_auth` is `None` (chapter 1), so the function falls through to its last resort:\n\n```\nusername, password = request.url.username, request.url.password\nif username or password:\n    return BasicAuth(username=username, password=password)\nreturn Auth()\n```\n\nThe trace shows both property reads returning `''` ([_urls.py#L150-L157](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L150-L157), [_urls.py#L159-L166](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L159-L166)) \u2014 `http://testserver/` has no userinfo \u2014 so the result is a bare `<httpx.Auth>` instance, the base class, whose entire flow is one unmodified yield.\n\nThat fallback branch is worth pausing on. Any URL containing `user:pass@` produces an `Authorization: Basic ...` header without the caller ever writing `auth=`, and without a warning.\n\n> **For the owner:** Credentials embedded in a request URL are silently converted into a Basic auth header ([_client.py#L469-L471](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L469-L471)). If any URL in your system is built from user input or a configuration string, a `user:pass@` prefix becomes a credential your client sends. Validate or strip userinfo from untrusted URLs before passing them to the client, and note that the full URL is also written to the `httpx` logger at INFO.\n\n## The auth loop, driven as a generator\n\n`_send_handling_auth` is the outermost of the three dispatch layers ([_client.py#L930-L962](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L930-L962)). It opens `auth.sync_auth_flow(request)` and calls `next()` on it to obtain the request to actually send.\n\nInside `sync_auth_flow`, the first check is `if self.requires_request_body: request.read()` ([_auth.py#L71-L72](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_auth.py#L71-L72)). The base `Auth` sets that flag `False`, so nothing is read \u2014 and it would have been a no-op anyway, since the body was already buffered at construction. The flow then delegates to `auth_flow`, which yields the request untouched ([_auth.py#L74-L75](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_auth.py#L74-L75), [_auth.py#L38-L60](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_auth.py#L38-L60)). The trace shows both calls returning the same `<Request('GET', 'http://testserver/')>`.\n\nThe generator protocol is the whole design here. Each response is pushed back into the flow with `flow.send(response)`; if the scheme wants another round trip it yields a new request, and if it is finished the generator raises `StopIteration` and the response is returned ([_client.py#L947-L951](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L947-L951)). That is how `DigestAuth` turns a 401 into a second, signed request without the client knowing anything about digest.\n\nThere is a cost attached to that generality. Before the loop goes round again, the intermediate response is fully read into memory and appended to `history` ([_client.py#L953-L956](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L953-L956)). And whatever happens, `auth_flow.close()` runs in a `finally` ([_client.py#L961-L962](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L961-L962)), so a generator-based scheme holding a lock or a file handle is always finalised.\n\n> **For the owner:** Any auth scheme that issues more than one request causes every intermediate response body to be buffered in memory and retained in `response.history` ([_client.py#L953-L956](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L953-L956)). Confirm that the endpoints you authenticate against return small bodies on their challenge responses.\n\nThis also settles a question left open in chapter 3: can a request be sent twice? Here it can. Retries through the auth loop and through redirects both reuse `request.stream` directly ([_client.py#L573-L582](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L573-L582)), and a `ByteStream` re-yields its buffered bytes on every iteration ([_content.py#L31-L39](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_content.py#L31-L39)). A generator body would raise `StreamConsumed` on the second send \u2014 which is exactly why bodies that fit in memory are read eagerly at construction ([_models.py#L422-L423](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L422-L423)).\n\n## The redirect loop, entered once\n\n`_send_handling_redirects(request, follow_redirects=False, history=[])` is the middle layer ([_client.py#L964-L999](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L964-L999)). Its first act each time round is the bound check: `if len(history) > self.max_redirects: raise TooManyRedirects(...)` ([_client.py#L970-L974](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L970-L974)). With `history == []` and `max_redirects == 20`, the loop is bounded by construction \u2014 a redirect chain cannot spin forever.\n\nThen the request event hooks run, before the transport is touched ([_client.py#L976-L977](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L976-L977)). The list is empty in this run, so the loop body is skipped and `_send_single_request(request)` is called.\n\n## Choosing where to send it\n\n`_send_single_request` opens with transport selection ([_client.py#L1005](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1005)). `_transport_for_url` iterates `self._mounts`, testing each `URLPattern` against the URL, and falls through to `self._transport` if nothing matches ([_client.py#L760-L769](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L760-L769)). `_mounts` is `{}` \u2014 the proxy map came back empty in chapter 1 because supplying an explicit transport set `allow_env_proxies=False`, and no `mounts=` argument was given \u2014 so the loop body never executes and the caller's `WSGITransport` is returned. That is the answer to the question left hanging in chapter 1: with no mounts, the caller's transport handles every URL, unconditionally.\n\nNext, `start = time.perf_counter()` ([_client.py#L1006](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1006)) \u2014 `428800.362486125` in this run. The clock starts here, before the transport is called, and will be stopped when the response body is closed.\n\nThen a guard: `if not isinstance(request.stream, SyncByteStream): raise RuntimeError(\"Attempted to send an async request with a sync Client instance.\")` ([_client.py#L1008-L1011](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1008-L1011)). `ByteStream` implements both interfaces, so it passes. This is where a sync/async mix-up is caught \u2014 before the application is invoked, not halfway through iterating a body.\n\nFinally the request enters `request_context(request=request)` ([_client.py#L1013-L1014](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1013-L1014)). That context manager catches `httpx.RequestError` raised inside the block and stamps `.request` onto it before re-raising ([_exceptions.py#L364-L377](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_exceptions.py#L364-L377)) \u2014 so that a timeout or connection error caught by the caller can report which request produced it. What it does *not* catch is anything that is not a `RequestError`; we will see that distinction matter in the next chapter, when the application itself runs.\n\nThe trace's next entry is `WSGITransport.handle_request`.\n\n> **Leaves as:** the same `<Request('GET', 'http://testserver/')>`, now inside `request_context`, with `transport = <WSGITransport>`, `start = 428800.362486125`, `follow_redirects = False`, `auth = <httpx.Auth>` (base class), `history = []`, client state `OPENED`\n"}, {"n": 5, "title": "Across the boundary: the request becomes a WSGI environ", "data_in": "<Request('GET','http://testserver/')> with headers Host/Accept/Accept-Encoding/Connection/User-Agent/X-Custom and an empty body", "data_out": "<Response [200 OK]> with headers Content-Type: text/plain; charset=utf-8 and Content-Length: 12, stream=WSGIByteStream over [b'Hello World!'], request not yet attached", "span": [267, 303], "md": "# Chapter 5 \u00b7 Across the boundary: the request becomes a WSGI environ\n\n> **Enters as:** `<Request('GET', 'http://testserver/')>` with headers `Host: testserver`, `Accept: */*`, `Accept-Encoding: gzip, deflate`, `Connection: keep-alive`, `User-Agent: python-httpx/0.28.1`, `X-Custom: value`, body `b''`, handed to `WSGITransport.handle_request`\n\nThis is the boundary. Above it, everything was `httpx` types; below it, the request has to become a plain dictionary and a callback, because that is the only vocabulary a WSGI application speaks.\n\n## Flattening the request\n\nThe first two lines of `handle_request` read the body and wrap it ([wsgi.py#L92-L93](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L92-L93)):\n\n```\nrequest.read()\nwsgi_input = io.BytesIO(request.content)\n```\n\n`request.read()` finds `_content` already set from chapter 3 and returns `b''` immediately ([_models.py#L468-L480](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L468-L480)); `request.content` then hands back the same `b''` ([_models.py#L462-L466](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L462-L466)). The empty body becomes a `BytesIO` with nothing in it.\n\n> **For the owner:** This transport buffers the entire request body in memory before calling the application ([wsgi.py#L92-L93](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L92-L93)). Do not use `WSGITransport` to exercise large-upload paths; it defeats the streaming behaviour you would get from a real transport.\n\nThen the port. `request.url.port` is `None` \u2014 chapter 2 normalised the absent `:80` away \u2014 so the fallback table supplies it ([wsgi.py#L95](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L95)):\n\n```\nport = request.url.port or {\"http\": 80, \"https\": 443}[request.url.scheme]\n```\n\nThe trace shows `URL.port \u2192 None` and `URL.scheme \u2192 'http'`, giving `port = 80`. Note that this is a bare dictionary subscript: a URL with any other scheme \u2014 `ftp://`, or a custom one mounted onto this transport \u2014 would raise `KeyError` here rather than an `httpx` exception.\n\nThe environ dict is assembled from the URL's parts ([wsgi.py#L96-L112](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L96-L112)). The trace walks each accessor in order: `URL.path \u2192 '/'` becomes `PATH_INFO`, `URL.query \u2192 b''` is decoded to `''` for `QUERY_STRING`, `URL.host \u2192 'testserver'` becomes `SERVER_NAME`. `REQUEST_METHOD` is `'GET'`, `SCRIPT_NAME` is `''` (the transport's default), `REMOTE_ADDR` is `'127.0.0.1'`, `SERVER_PROTOCOL` is the hardcoded string `'HTTP/1.1'`.\n\nThis answers a question from chapter 2. Nothing resolves `testserver`. The hostname is copied into the environ as metadata and carried in the `Host` header; no socket is opened, no DNS lookup happens, no TLS handshake occurs. The name only ever has to satisfy the application.\n\nHeaders follow, uppercased and underscored per the WSGI convention ([wsgi.py#L113-L117](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L113-L117)):\n\n```\nfor header_key, header_value in request.headers.raw:\n    key = header_key.decode(\"ascii\").upper().replace(\"-\", \"_\")\n    if key not in (\"CONTENT_TYPE\", \"CONTENT_LENGTH\"):\n        key = \"HTTP_\" + key\n    environ[key] = header_value.decode(\"ascii\")\n```\n\n`request.headers.raw` returns the six pairs built in chapter 3, `Host` first ([_models.py#L195-L200](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L195-L200)). The caller's `X-Custom: value` arrives at the application as `environ[\"HTTP_X_CUSTOM\"] == \"value\"`. `CONTENT_TYPE` and `CONTENT_LENGTH` are exempted from the prefix because WSGI specifies them bare \u2014 neither is present on this GET.\n\n## Calling the application\n\nThree `nonlocal` variables are declared and a `start_response` closure is defined to capture them ([wsgi.py#L119-L132](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L119-L132)). Then, in one line, the whole request crosses over ([wsgi.py#L134](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L134)):\n\n```\nresult = self.app(environ, start_response)\n```\n\nThe application runs synchronously, in this thread, on this stack. It asserts the method and path, then calls back: `start_response('200 OK', [('Content-Type', 'text/plain; charset=utf-8'), ('Content-Length', '12')], exc_info=None)`. The closure stores all three into `seen_status`, `seen_response_headers`, `seen_exc_info` and returns a throwaway `lambda _: None` \u2014 the legacy `write()` callable, which this transport does not support. The app then returns `[b'Hello World!']`.\n\nNothing here consults `request.extensions['timeout']`. The five-second budget assembled in chapter 3 and verified in chapter 4 travels all the way down and is simply never read. That answers the question left open in chapter 3: on this path, nobody enforces the timeout. A WSGI application that loops forever hangs the caller.\n\n> **For the owner:** `WSGITransport` ignores the request's timeout extension entirely ([wsgi.py#L91-L149](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L91-L149)); timeouts are enforced by the network transports, not by the client core. Do not rely on tests that use this transport to prove your timeout configuration works.\n\n## Checking what came back\n\n```\nassert seen_status is not None\nassert seen_response_headers is not None\nif seen_exc_info and seen_exc_info[0] and self.raise_app_exceptions:\n    raise seen_exc_info[1]\n```\n\n([wsgi.py#L138-L141](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L138-L141).) An application that returns without calling `start_response` trips a bare `AssertionError` \u2014 not an `httpx` exception. And since chapter 4's `request_context` only stamps `.request` onto `RequestError` subclasses and re-raises everything else untouched ([_exceptions.py#L364-L377](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_exceptions.py#L364-L377)), that `AssertionError` \u2014 and any exception the application itself raises and reports through `exc_info` \u2014 propagates out of `client.get()` raw and unwrapped. That answers chapter 4's open question: the context manager guarantees almost nothing about application-level failures.\n\n`raise_app_exceptions` defaults to `True` ([wsgi.py#L80](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L80)), which is why an application bug surfaces as that bug rather than as a 500 response. Setting it `False` is what lets a test inspect the body of a 500 instead.\n\n> **For the owner:** Exceptions raised inside the WSGI application are re-raised to the caller by default, and they are not `httpx` exception types ([wsgi.py#L140-L141](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L140-L141)). Code that catches `httpx.HTTPError` around a WSGI-transport call will not catch them.\n\n## Becoming a Response\n\nThe status line is split and parsed, the headers encoded ([wsgi.py#L143-L147](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L143-L147)):\n\n```\nstatus_code = int(seen_status.split()[0])\nheaders = [\n    (key.encode(\"ascii\"), value.encode(\"ascii\"))\n    for key, value in seen_response_headers\n]\n```\n\n`'200 OK'` becomes `200`; the two header tuples become `[(b'Content-Type', b'text/plain; charset=utf-8'), (b'Content-Length', b'12')]`. Both steps are strict: a malformed status string gives `ValueError`, a non-ASCII header name or value gives `UnicodeEncodeError`, and neither is caught.\n\nBefore that, the app's return value was wrapped ([wsgi.py#L136](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L136)). `WSGIByteStream.__init__` squirrels away `getattr(result, \"close\", None)` \u2014 a plain list has none, so `_close` is `None` \u2014 and passes the iterable through `_skip_leading_empty_chunks` ([wsgi.py#L30-L33](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L30-L33)). That helper pulls items until it finds a truthy one and chains it back on front ([wsgi.py#L22-L27](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L22-L27)), so an application that yields `b''` before its real content does not look like an empty body. The trace shows it returning an `itertools.chain` object.\n\nFinally ([wsgi.py#L149](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L149)):\n\n```\nreturn Response(status_code, headers=headers, stream=stream)\n```\n\nThe `stream=` form is deliberate. `Response.__init__` takes the branch that assigns `self.stream = stream` and stops ([_models.py#L555-L567](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L555-L567)) \u2014 no `_prepare`, no auto-populated content headers, no eager `read()`. The body stays lazy; only the headers the application actually sent are present. The trace shows just the `Headers.__init__` call and its four normalisation calls, then `\u2192 <Response [200 OK]>`.\n\nThe response that comes back has no `.request` attached, no `http_version` or `reason_phrase` extension, and an unread stream. Those gaps are the client's to fill.\n\n> **Leaves as:** `<Response [200 OK]>` with `headers = Headers({'content-type': 'text/plain; charset=utf-8', 'content-length': '12'})`, `stream = <WSGIByteStream>` over `[b'Hello World!']`, `extensions = {}`, `_request = None`, body unread\n"}, {"n": 6, "title": "Dressing the response, then unwinding the redirect and auth loops", "data_in": "<Response [200 OK]> from the transport, plus the Request and the perf-counter start", "data_out": "<Response [200 OK]> with .request set, .stream wrapped in BoundSyncStream, default_encoding='utf-8', history=[], returned out of _send_handling_redirects and _send_handling_auth still unread", "span": [304, 363], "md": "# Chapter 6 \u00b7 Dressing the response, then unwinding the redirect and auth loops\n\n> **Enters as:** `<Response [200 OK]>` with `headers = Headers({'content-type': 'text/plain; charset=utf-8', 'content-length': '12'})`, `stream = <WSGIByteStream>` over `[b'Hello World!']`, `extensions = {}`, `_request = None`, body unread \u2014 returned from the transport back into `Client._send_single_request`\n\nThe response is back on the `httpx` side of the boundary, but it is not yet a response the caller would recognise. It knows nothing about the request that produced it, nothing about how long it took, and its headers have not been shown to the cookie jar. The rest of `_send_single_request` is the dressing room.\n\n## First, the contract check\n\nControl returns from the `with request_context(...)` block and lands on an assertion ([_client.py#L1016](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1016)):\n\n```\nassert isinstance(response.stream, SyncByteStream)\n```\n\n`WSGIByteStream` subclasses `SyncByteStream` ([wsgi.py#L30](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L30)), so this passes. It is the mirror of the check on the way down: chapter 4 refused to send an async request body through a sync client, and here a transport that handed back an async stream would be caught before anything else touched the response.\n\n## Attaching the request, and the stopwatch\n\n```\nresponse.request = request\nresponse.stream = BoundSyncStream(\n    response.stream, response=response, start=start\n)\n```\n\n([_client.py#L1018-L1021](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1018-L1021).) The trace shows the setter at `_models.py:606` assigning `_request`, then `BoundSyncStream.__init__(stream=<WSGIByteStream>, response=<Response [200 OK]>, start=428800.362486125)`.\n\nThat `start` is the `time.perf_counter()` reading taken in chapter 4, *before* the transport was called ([_client.py#L1006](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1006)). `BoundSyncStream` exists for exactly one reason: it wraps the transport's stream so that when the body is eventually closed, the elapsed time is computed and stamped onto the response ([_client.py#L139-L159](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L139-L159)):\n\n```\ndef close(self) -> None:\n    elapsed = time.perf_counter() - self._start\n    self._response.elapsed = datetime.timedelta(seconds=elapsed)\n    self._stream.close()\n```\n\nThe request attachment is load-bearing. Without it, `response.url`, `response.raise_for_status()` and the cookie extraction that is about to happen would all raise `RuntimeError(\"The request instance has not been set on this response.\")` ([_models.py#L595-L604](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L595-L604)). That answers chapter 5's question about the empty `_request`: the client fills it in, one line after the transport returns.\n\n## The cookie jar, before the body\n\n```\nself.cookies.extract_cookies(response)\n```\n\n([_client.py#L1022](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1022).) This happens as soon as the headers exist and well before the body is read. `extract_cookies` builds two compatibility shims and hands them to the stdlib `CookieJar` ([_models.py#L1101-L1108](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L1101-L1108)).\n\nThe trace shows both being constructed. `_CookieCompatResponse` just wraps the response ([_models.py#L1267-L1268](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L1267-L1268)). `_CookieCompatRequest` is heavier: it subclasses `urllib.request.Request`, which means `str(request.url)` is computed (`'http://testserver/'`) and `dict(request.headers)` is materialised \u2014 hence the burst of `Headers.keys`, `Headers.encoding` and `Headers.__getitem__` calls in the trace, one per header ([_models.py#L1249-L1255](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L1249-L1255)). Then `info()` converts the response headers into an `email.message.Message` so the jar can read `Set-Cookie` from them ([_models.py#L1270-L1277](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L1270-L1277)).\n\nOur application sent no `Set-Cookie`, so the jar is still empty afterwards. But the plumbing matters: cookies land in the **client's** jar, not the response's, and they persist for every subsequent request on this client.\n\n> **For the owner:** Any `Set-Cookie` the application returns is written into the client's shared cookie jar and will be sent on later requests through the same client ([_client.py#L1022](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1022)). Use a fresh `Client` per test case, or per security principal, if cross-request cookie leakage would be a problem.\n\n## Degrading gracefully on missing extensions\n\n```\nresponse.default_encoding = self._default_encoding\n```\n\n([_client.py#L1023](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1023).) The client's text-decoding policy \u2014 `'utf-8'` here \u2014 is attached per response, not baked in at construction. That is what chapter 8 will consult.\n\nThen the log line ([_client.py#L1025-L1032](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1025-L1032)), which pulls two properties the transport never set:\n\n```\nlogger.info(\n    'HTTP Request: %s %s \"%s %d %s\"',\n    request.method, request.url,\n    response.http_version, response.status_code, response.reason_phrase,\n)\n```\n\nThe trace shows `Response.http_version \u2192 'HTTP/1.1'` and `Response.reason_phrase \u2192 'OK'`. Neither came from the application. `http_version` reads `extensions[\"http_version\"]` and, on `KeyError`, returns the literal `\"HTTP/1.1\"` ([_models.py#L610-L617](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L610-L617)). `reason_phrase` does the same and falls back to the status-code table, `codes.get_reason_phrase(200) \u2192 'OK'` ([_models.py#L619-L626](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L619-L626), [_status_codes.py#L38-L43](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_status_codes.py#L38-L43)). So the response reports an HTTP version it never negotiated \u2014 an honest default, but a default.\n\n> **For the owner:** The client logs every request at INFO on the `\"httpx\"` logger, including the full URL with its query string ([_client.py#L1025-L1032](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1025-L1032)). Check that no secrets are passed as query parameters, or configure that logger before shipping.\n\n`_send_single_request` returns the dressed response.\n\n## The redirect loop, which does not loop\n\nBack in `_send_handling_redirects`, the response enters a `try` block whose `except BaseException` closes it and re-raises ([_client.py#L980-L999](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L980-L999)). The response-hook list is empty, so nothing runs; `response.history = list(history)` sets `[]`. Then the decision ([_client.py#L985-L986](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L985-L986)):\n\n```\nif not response.has_redirect_location:\n    return response\n```\n\n`has_redirect_location` wants two things at once: a status in `{301, 302, 303, 307, 308}` *and* a `Location` header ([_models.py#L771-L792](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L771-L792)). Status 200 fails the first test, so the trace shows `\u2192 False` and the response is handed straight back.\n\nTwo roads not taken are worth naming, because they are where the interesting guarantees live.\n\nHad this been a 302 *with* a Location header, `follow_redirects` resolved to `False` in chapter 4 \u2014 so the client would not raise and would not fetch anything. It would build the follow-up request, hang it on `response.next_request`, and return the 302 to the caller ([_client.py#L988-L995](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L988-L995)). That answers chapter 1's question: the default is deliberately unlike `requests` \u2014 redirects are visible, not silent.\n\nAnd had redirects been followed to a different origin, `_redirect_headers` would have rewritten the header set ([_client.py#L546-L571](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L546-L571)): `Authorization` popped (except for a plain http\u2192https upgrade of the same host), `Host` rewritten to the new netloc, `Content-Length` and `Transfer-Encoding` dropped if the method flipped to GET, and `Cookie` always dropped so the client jar is the single source of cookie truth. A custom header like `X-Custom` is **not** stripped \u2014 it follows the redirect to the new origin. That answers chapter 3's question, and it is the one worth flagging.\n\n> **For the owner:** On a cross-origin redirect the client strips `Authorization` and `Cookie` but carries every other header, including custom ones, to the new host ([_client.py#L552-L569](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L552-L569)). Audit any header you use to carry a credential, such as `X-Api-Key`, and set it per-request rather than on the client if redirects are followed.\n\nAlso note that the loop is bounded by construction: `len(history) > self.max_redirects` raises `TooManyRedirects` at the top of every iteration, default 20 ([_client.py#L970-L974](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L970-L974)).\n\n## The auth generator, resumed and exhausted\n\nThe response surfaces in `_send_handling_auth`, which pushes it back into the generator ([_client.py#L947-L951](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L947-L951)):\n\n```\ntry:\n    next_request = auth_flow.send(response)\nexcept StopIteration:\n    return response\n```\n\n`sync_auth_flow` is sitting at `response = yield request`. `requires_response_body` is `False` on the base `Auth`, so no read happens ([_auth.py#L77-L80](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_auth.py#L77-L80)). It calls `flow.send(response)` on the inner `auth_flow`, which has nothing left after its single `yield request` ([_auth.py#L38-L60](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_auth.py#L38-L60)) \u2014 the trace shows both generators returning `None` \u2014 and `break`s out of its `while True` ([_auth.py#L82-L85](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_auth.py#L82-L85)). The outer `send()` raises `StopIteration`, caught, and the response is returned.\n\nHad the flow yielded a second request \u2014 a digest challenge, a token refresh \u2014 the path would have been different: `response.history = list(history)`, then `response.read()` to buffer it entirely, then append to history and loop ([_client.py#L953-L956](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L953-L956)). A multi-step auth scheme therefore implies buffering every intermediate response in memory. The `finally: auth_flow.close()` guarantees the generator is finalised either way ([_client.py#L961-L962](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L961-L962)).\n\nThe response leaves `_send_handling_auth` with its body still untouched.\n\n> **Leaves as:** `<Response [200 OK]>` with `.request` set to `<Request('GET', 'http://testserver/')>`, `.stream` a `BoundSyncStream` wrapping the `WSGIByteStream`, `.default_encoding == 'utf-8'`, `.history == []`, `.next_request is None`, `.http_version == 'HTTP/1.1'`, `.reason_phrase == 'OK'`, body unread and `is_closed is False`\n"}, {"n": 7, "title": "Reading the body: decoders, chunker, and the close that sets elapsed", "data_in": "<Response [200 OK]> with an unread BoundSyncStream over WSGIByteStream", "data_out": "response._content == b'Hello World!'; stream consumed and closed; response.elapsed set; is_closed True", "span": [364, 395], "md": "# Chapter 7 \u00b7 Reading the body: decoders, chunker, and the close that sets elapsed\n\n> **Enters as:** `<Response [200 OK]>` with `.request` set, `.stream` a `BoundSyncStream` wrapping a `WSGIByteStream` over `[b'Hello World!']`, `.default_encoding == 'utf-8'`, no `_content` attribute, `is_stream_consumed is False`, `is_closed is False`\n\nBack in `Client.send`, the response hits the one line that decides whether the body is the caller's problem or the client's ([_client.py#L920-L928](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L920-L928)):\n\n```\ntry:\n    if not stream:\n        response.read()\n    return response\nexcept BaseException as exc:\n    response.close()\n    raise exc\n```\n\n`stream` is `False` \u2014 `client.get()` never passes it \u2014 so `read()` runs, and it runs inside a handler that closes the response if anything goes wrong. That is the guarantee: on this path, a failure during the read cannot leave a stream dangling.\n\n## read(), which is a join over an iterator\n\n```\ndef read(self) -> bytes:\n    if not hasattr(self, \"_content\"):\n        self._content = b\"\".join(self.iter_bytes())\n    return self._content\n```\n\n([_models.py#L876-L882](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L876-L882).) Note the shape: the whole body is accumulated into one `bytes` object with no size cap anywhere. For a twelve-byte \"Hello World!\" that is nothing. For an application that returns a gigabyte, it is a gigabyte of client-side memory.\n\n> **For the owner:** `response.read()` buffers the entire decoded body into memory with no limit ([_models.py#L880-L882](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L880-L882)), and the non-streaming `client.get()` path always calls it ([_client.py#L921-L922](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L921-L922)). Use `client.stream(...)` and `iter_bytes()` for any endpoint whose response size you do not control.\n\n## Choosing a decoder from a header that isn't there\n\n`iter_bytes` checks for `_content` first; it is absent, so the decoding path opens ([_models.py#L889-L905](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L889-L905)). First it asks for a decoder.\n\n`_get_content_decoder` reads the response's `content-encoding` headers with `split_commas=True`, so `\"gzip, br\"` would arrive as two separate names ([_models.py#L699-L722](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L699-L722)). Our application sent none \u2014 the trace shows `Headers.get_list(key='content-encoding', split_commas=True) \u2192 []` \u2014 so no decoders are collected and the `else` branch produces an `IdentityDecoder`, whose `decode` returns its argument untouched ([_decoders.py#L44-L53](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_decoders.py#L44-L53)).\n\nThe branches not taken here are worth knowing, because two of them are policy decisions:\n\n- An encoding name that isn't in `SUPPORTED_DECODERS` is **silently skipped** (`except KeyError: continue`, [_models.py#L709-L713](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L709-L713)). The bytes then pass through undecoded rather than raising.\n- Several valid encodings compose into a `MultiDecoder`, which applies them in reverse order ([_models.py#L715-L720](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L715-L720), [_decoders.py#L203-L225](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_decoders.py#L203-L225)).\n- A corrupt gzip or deflate body raises `DecodingError` ([_decoders.py#L95-L105](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_decoders.py#L95-L105)) \u2014 and because the decode loop runs inside `with request_context(request=self._request)` ([_models.py#L896](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L896)), that error arrives with `.request` attached. `DecodingError` is a `RequestError`, so unlike the raw application exceptions of chapter 5, this one does get tagged.\n\nRecall that the client advertised `Accept-Encoding: gzip, deflate` back in chapter 1, derived from `SUPPORTED_DECODERS` minus `identity` ([_client.py#L120-L122](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L120-L122)). The client only asks for what it can undo.\n\nNext a `ByteChunker(chunk_size=None)` is built ([_models.py#L895](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L895), [_decoders.py#L233-L235](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_decoders.py#L233-L235)). With no chunk size it is a pass-through that drops empties: `return [content] if content else []` ([_decoders.py#L238-L239](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_decoders.py#L238-L239)). It earns its keep only when the caller asked for fixed-size chunks.\n\n## iter_raw: three refusals, then the bytes\n\n`iter_bytes` now pulls from `iter_raw()`, which begins with three guards ([_models.py#L939-L944](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L939-L944)):\n\n```\nif self.is_stream_consumed:\n    raise StreamConsumed()\nif self.is_closed:\n    raise StreamClosed()\nif not isinstance(self.stream, SyncByteStream):\n    raise RuntimeError(\"Attempted to call a sync iterator on an async stream.\")\n```\n\nAll three are false for a fresh response, so it proceeds \u2014 setting `is_stream_consumed = True` and resetting `_num_bytes_downloaded` to `0` ([_models.py#L946-L947](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L946-L947)). Those guards are what makes \"read the body twice\" a clean error rather than a silently empty result.\n\nInside its own `request_context`, it iterates `self.stream` \u2014 the `BoundSyncStream`, which simply forwards from the `WSGIByteStream` ([_client.py#L152-L154](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L152-L154), [wsgi.py#L35-L37](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L35-L37)). The trace shows one chunk coming through: `b'Hello World!'`. `_num_bytes_downloaded` grows by `12` ([_models.py#L952](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L952)) \u2014 counted on the *raw*, pre-decode bytes, which is precisely why it is the right basis for a download progress bar on a compressed response.\n\nThe chunker yields it through unchanged (`\u2192 [b'Hello World!']`), the decoder's `IdentityDecoder.decode` returns it unchanged, and `iter_bytes`'s own chunker yields it to `read()`'s `join`.\n\n## The close that sets elapsed\n\nWhen the `WSGIByteStream` is exhausted, `iter_raw` runs its last statement ([_models.py#L956-L959](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L956-L959)):\n\n```\nfor chunk in chunker.flush():\n    yield chunk\n\nself.close()\n```\n\nThe flush is empty \u2014 the chunker held nothing back. Then `close()` sets `is_closed = True` and calls `self.stream.close()` inside another `request_context` ([_models.py#L961-L972](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L961-L972)).\n\nThat is the `BoundSyncStream.close` from chapter 6, and here is where the stopwatch finally stops ([_client.py#L156-L159](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L156-L159)):\n\n```\nelapsed = time.perf_counter() - self._start\nself._response.elapsed = datetime.timedelta(seconds=elapsed)\nself._stream.close()\n```\n\nSo `elapsed` spans from just before the WSGI app was invoked to just after its body was fully consumed \u2014 not merely the transport call. Reading the body is part of the measurement.\n\nThe delegation continues down to `WSGIByteStream.close`, which calls the application iterable's `close` if it captured one ([wsgi.py#L31-L41](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L31-L41)):\n\n```\ndef __init__(self, result):\n    self._close = getattr(result, \"close\", None)\n...\ndef close(self):\n    if self._close is not None:\n        self._close()\n```\n\nOur app returned a plain `list`, which has no `close`, so `self._close` is `None` and this is a no-op. A generator-based or file-backed WSGI app would be properly closed here \u2014 which answers chapter 5's question about that captured attribute.\n\n> **For the owner:** `response.elapsed` is only assigned when the response stream is closed ([_client.py#L156-L158](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L156-L158)); reading it earlier raises `RuntimeError` ([_models.py#L584-L589](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L584-L589)). Do not use it as a server-latency metric, because it includes the time your own code spent consuming the body.\n\nThe trace records one more entry \u2014 `\u2026 Response.iter_bytes \u00d71 more` \u2014 the generator being resumed once to confirm exhaustion before `join` completes. `read()` assigns `self._content = b'Hello World!'` and returns it. `Client.send` returns the response, `Client.request` returns it, `Client.get` returns it, and it reaches the caller's `response` variable at last.\n\n> **Leaves as:** `<Response [200 OK]>` with `_content == b'Hello World!'`, `num_bytes_downloaded == 12`, `is_stream_consumed is True`, `is_closed is True`, `elapsed` set to a `datetime.timedelta`, `.request` still `<Request('GET', 'http://testserver/')>`\n"}, {"n": 8, "title": "Out to the caller, and closing a client that owns nothing", "data_in": "<Response [200 OK]> with _content == b'Hello World!' and Content-Type: text/plain; charset=utf-8, inside a Client in state OPENED", "data_out": "'<Response [200 OK]>', 'http://testserver/', 'text/plain; charset=utf-8', 'Hello World!'; request.headers['X-Custom'] == 'value'; client state CLOSED", "span": [398, 458], "md": "# Chapter 8 \u00b7 Out to the caller, and closing a client that owns nothing\n\n> **Enters as:** `<Response [200 OK]>` with `_content == b'Hello World!'`, headers `Content-Type: text/plain; charset=utf-8` and `Content-Length: 12`, `.request` set to `<Request('GET', 'http://testserver/')>`, inside a `Client` in state `OPENED`\n\nThe response is back in the caller's hands and the body is already bytes in memory. What remains is four attribute accesses, two assertions, and the exit of the `with` block. None of it touches the application again; all of it is the client answering questions about what it already has.\n\n## repr, and a reason phrase that was never on the wire\n\n`print(response)` calls `__repr__` ([_models.py#L859-L860](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L859-L860)):\n\n```\nreturn f\"<Response [{self.status_code} {self.reason_phrase}]>\"\n```\n\n`reason_phrase` looks for `self.extensions[\"reason_phrase\"]`, finds nothing \u2014 the WSGI transport never set it \u2014 and falls through to `codes.get_reason_phrase(200)` ([_models.py#L619-L626](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L619-L626)), which looks `200` up in the enum and returns `'OK'` ([_status_codes.py#L38-L43](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_status_codes.py#L38-L43)). The result is `'<Response [200 OK]>'`. The application did send `\"200 OK\"` as its status string, but the transport parsed only the integer out of it ([wsgi.py#L143](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/wsgi.py#L143)); the phrase you see is reconstructed from a table. For an unknown status code `get_reason_phrase` returns the empty string rather than raising.\n\n## The URL, unparsed back to a string\n\n`response.request.url` goes through the `request` property \u2014 which would raise `RuntimeError` if `_request` were `None`, but chapter 6 set it ([_models.py#L595-L604](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L595-L604)) \u2014 and then `URL.__str__`, which delegates to the `ParseResult` ([_urls.py#L374-L375](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L374-L375), [_urlparse.py#L200-L210](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urlparse.py#L200-L210)). The components reassemble to `'http://testserver/'` \u2014 the normalised form from chapter 2, not the `'/'` the caller typed. Note what `__str__` does *not* do: `__repr__` masks a password in the userinfo ([_urls.py#L377-L401](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L377-L401)), but `str()` emits it in full.\n\n> **For the owner:** `str(url)` renders userinfo credentials verbatim, while `repr(url)` masks the password as `[secure]` ([_urls.py#L380-L382](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_urls.py#L380-L382)). The client's own INFO log line uses `%s` on the URL ([_client.py#L1025-L1032](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1025-L1032)), so credentials or tokens in a URL will land in your logs. Keep secrets out of URLs, or set the `httpx` logger above INFO.\n\n## A header lookup that cannot fail on encoding\n\n`response.headers[\"content-type\"]` lowercases the key, encodes it with `self.encoding`, and collects every matching value ([_models.py#L284-L302](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L284-L302)):\n\n```\nif items:\n    return \", \".join(items)\nraise KeyError(key)\n```\n\nTwo design points here. Duplicate headers are joined with `\", \"` per RFC 7230 rather than one being dropped \u2014 if you need them separate, `get_list()` is the API ([_models.py#L252-L272](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L252-L272)). And an absent header raises `KeyError`; `.get()` is the non-raising form ([_models.py#L242-L250](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L242-L250)).\n\nThe `encoding` property it consults is a sniffer: try `ascii` across all raw keys and values, then `utf-8`, then fall back to `iso-8859-1` ([_models.py#L166-L189](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L166-L189)). The comment is explicit about why the last one is there: ISO-8859-1 covers all 256 byte values, so it \"will never raise decode errors.\" Header access is total \u2014 a server cannot make it throw a `UnicodeDecodeError`. Here everything is ASCII, and the trace records `'ascii'`. The answer is `'text/plain; charset=utf-8'`.\n\n## Bytes to text: charset, validation, and a decoder that never raises\n\n`response.text` is the one access that does real work ([_models.py#L641-L650](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L641-L650)). It reads `self.content` \u2014 `b'Hello World!'`, available because chapter 7 buffered it \u2014 then asks for an encoding.\n\n`Response.encoding` implements a three-step priority ([_models.py#L652-L672](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L652-L672)):\n\n1. `charset_encoding`, parsed out of Content-Type by stuffing the header into an `email.message.Message` and calling `get_content_charset` ([_models.py#L85-L90](https://github.com/encode/httpx/blob/b5addb64f0161ff6bf
