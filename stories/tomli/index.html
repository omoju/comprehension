<script type="application/json" id="data">{"title": "Two Players and a Parser: What `tomli.loads` Promises", "premise": "A caller hands Tomli a TOML string \ns a document with two `[[players]]` records \ns and expects back a plain Python dict of builtin types, or a clean `TOMLDecodeError` if the document is malformed. Nothing else: no partial results, no custom classes, no surprises. The string is the protagonist; the story follows it from the public entry point, through the single-pass statement loop, into the nested dict that is handed back, and notes at every branch what would have happened had the input been hostile or merely wrong.", "reader": "owner", "repo": {"name": "hukkin/tomli", "url": "https://github.com/hukkin/tomli", "commit": "18d8d59db6d632ebbcfe63f1f7636145d652da21"}, "chapters": [{"n": 1, "title": "Across the trust boundary", "data_in": "__s = '\\n[[players]]\\nname = \"Lehtinen\"\\nnumber = 26\\n\\n[[players]]\\nname = \"Numminen\"\\nnumber = 27\\n', parse_float=<class 'float'>", "data_out": "src (CRLF-normalized copy), pos=0, header=(), out=Output(NestedDict{}, Flags{}), parse_float=<class 'float'> (unwrapped)", "span": [2, 15], "md": "# Chapter 1 \u00b7 Across the trust boundary\n\n> **Enters as:** `__s = '\\n[[players]]\\nname = \"Lehtinen\"\\nnumber = 26\\n\\n[[players]]\\nname = \"Numminen\"\\nnumber = 27\\n'`, `parse_float=<class 'float'>`\n\nThe string arrives at the only door Tomli opens to the world. `tomli.loads` is eight lines of re-export away from `_parser.loads` ([`__init__.py`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/__init__.py#L5-L8)), and the function it lands in is small enough to read in one breath. What happens in the first few lines decides what kind of object the rest of the parser is allowed to assume it has.\n\nThe first thing done to the string is not parsing at all. It is a rewrite: `src = __s.replace(\"\\r\\n\", \"\\n\")` ([`_parser.py#L169-L174`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L169-L174)). The comment above it says the spec permits converting `\\r\\n` to `\\n` *even in string literals*, and Tomli takes that permission to simplify everything downstream: from here on, no code in the parser needs to consider a carriage return as a line ending. Our string has no `\\r\\n` in it, so `replace` hands back an equal copy, 87 characters long, and the parser proceeds with a value that is byte-for-byte what the caller wrote.\n\nThat `replace` call is also the type check. It sits inside a `try`, and an `AttributeError` or `TypeError` from it is converted into `TypeError(f\"Expected str object, not '{type(__s).__qualname__}'\")` with `from None` to suppress the misleading inner traceback. Hand `loads` a `bytes` object and you get \"Expected str object, not 'bytes'\"; hand it `False` and you get \"not 'bool'\". The parser never gets to run on a non-string. The sibling entry point `load` enforces the companion rule for files: it reads the file object and calls `.decode()`, and an `AttributeError` there becomes `TypeError(\"File must be opened in binary mode, e.g. use `open('foo.toml', 'rb')`\")` ([`_parser.py#L152-L161`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L152-L161)).\n\n> **For the owner:** Binary mode for `load` is a correctness requirement, not a style preference. Text mode would let Python apply universal newlines and a locale-dependent encoding before Tomli ever sees the bytes, which is why the code raises `TypeError` instead of guessing. Check that every `tomli.load` call site in your codebase opens with `\"rb\"`.\n\nNow the world the string is about to enter gets built, and all of it is local. `pos = 0`. `out = Output()`. `header: Key = ()` \u2014 the empty tuple, meaning \"the document root\" ([`_parser.py#L175-L178`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L175-L178)).\n\n`Output.__init__` is two assignments ([`_parser.py#L327-L330`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L327-L330)), and the trace shows both constructors running in turn. `NestedDict.__init__` creates `self.dict = {}` \u2014 the dictionary that will, eighty-odd characters later, be handed back to the caller as the result ([`_parser.py#L293-L296`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L293-L296)). `Flags.__init__` creates `self._flags = {}` and `self._pending_flags = set()`, the bookkeeping that will later decide which table names may be declared, redeclared, or mutated ([`_parser.py#L244-L246`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L244-L246)). Both start empty. Nothing in this module holds mutable state at import time; two threads calling `loads` at the same time build two independent `Output` objects and never see each other.\n\nThen the second argument gets its one moment of attention. `parse_float = make_safe_parse_float(parse_float)` ([`_parser.py#L178`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L178)). The trace records the call and its return on the next line: `make_safe_parse_float(<class 'float'>) \u2192 <class 'float'>`. The same object came back out. That is deliberate \u2014 the function's first statement is `if parse_float is float: return float`, with the comment \"The default `float` callable never returns illegal types. Optimize it.\" ([`_parser.py#L791-L793`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L791-L793)).\n\nThe rest of that function is what a *non*-default caller gets, and it is the reason the parameter is safe to expose at all. For any other callable, `make_safe_parse_float` returns a closure that calls the user's function and then checks the result: `if isinstance(float_value, (dict, list)): raise ValueError(\"parse_float must not return dicts or lists\")` ([`_parser.py#L795-L801`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L795-L801)). A `parse_float` that returned a dict would inject a value into the output tree that the parser could not distinguish from a parsed TOML table, confusing its own bookkeeping \u2014 so the check happens at the boundary, eagerly, rather than producing a quietly wrong document.\n\n> **For the owner:** `parse_float` is the one place where caller-supplied code runs inside the parse. The guard rejects only `dict` and `list` and their subtypes; it does not sandbox anything else, so an exception raised by your `parse_float` propagates out of `loads` as-is, not as a `TOMLDecodeError`. If you pass something other than `float` or `decimal.Decimal`, wrap your own error handling around the `loads` call.\n\nWith that, the string is no longer an argument: it is `src`, a validated `str`, paired with an integer cursor at 0, an empty result dict, an empty flag store, and a root header. The statement loop begins. Its very first act is `pos = skip_chars(src, pos, TOML_WS)` ([`_parser.py#L184`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L184)), which walks forward while the character is a space or a tab and stops otherwise, swallowing the `IndexError` at end-of-string rather than treating it as an error ([`_parser.py#L333-L339`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L333-L339)). Our document begins with a newline, not whitespace, so the call returns 0 unchanged. The loop reads `src[0]`, finds `\"\\n\"`, advances to 1 and continues ([`_parser.py#L198-L200`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L198-L200)); the trace's second, elided `skip_chars` is the same no-op at position 1.\n\nNow `src[1]` is `\"[\"`. The loop peeks at `src[2]` inside a `try/except IndexError` \u2014 a lone trailing `[` would leave `second_char = None` rather than crash \u2014 and before dispatching, calls `out.flags.finalize_pending()` ([`_parser.py#L204-L213`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L204-L213)). The trace shows it returning `None` having done nothing: `_pending_flags` is still the empty set it was born with, so the loop over it has no iterations ([`_parser.py#L251-L254`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L251-L254)). It matters later; here it is a formality.\n\n`second_char == \"[\"`, so the road leads to `create_list_rule`. Had there been a single bracket, `create_dict_rule` would have taken the string instead, with a stricter rule about declaring the same name twice \u2014 but that is the next chapter's business.\n\n> **Leaves as:** `src` (the CRLF-normalized copy, identical here), `pos=1` at the `[` of `[[players]]`, `header=()`, `out = Output(NestedDict{}, Flags{})`, `parse_float = <class 'float'>` (unwrapped), about to enter `create_list_rule`\n"}, {"n": 2, "title": "Reading the header name", "data_in": "src, pos=1 (just past the leading newline), first char '[', second char '['", "data_out": "(10, ('players',)) \ns key parsed, position parked on the closing brackets", "span": [16, 26], "md": "# Chapter 2 \u00b7 Reading the header name\n\n> **Enters as:** `src`, `pos=1` \u2014 the cursor on the first `[` of `[[players]]`, with `src[2]` confirmed to be `[` as well\n\n`create_list_rule` takes the string, the cursor, and the `Output` it will eventually write into, and its first line is the shortest possible acknowledgement of what the loop already knew: `pos += 2  # Skip \"[[\"` ([`_parser.py#L405-L406`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L405-L406)). The brackets are not re-checked. The caller's two-character peek was the whole check, and from here the cursor sits at 3, on the `p` of `players`.\n\nThen `skip_chars(src, 3, TOML_WS)` ([`_parser.py#L407`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L407)) \u2014 the same whitespace walker from the statement loop, swallowing spaces and tabs. The trace records it returning 3: there is nothing between the brackets and the name. This call is why `[[ players ]]` and `[[players]]` are the same header; TOML allows the padding, and Tomli discards it before the name is ever read.\n\nNow `parse_key(src, 3)` ([`_parser.py#L408`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L408)). This is the same function that will later read `name` and `number` on the left of an `=`; table headers and key/value pairs share one key grammar, so whatever is legal in one place is legal in the other.\n\n`parse_key` immediately delegates the first segment to `parse_key_part` ([`_parser.py#L478-L480`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L478-L480)), which reads one character and chooses a road ([`_parser.py#L500-L513`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L500-L513)). The character is `p`, a member of `BARE_KEY_CHARS` \u2014 the frozenset of ASCII letters, digits, hyphen and underscore ([`_parser.py#L66-L68`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L66-L68)). So the bare-key branch runs: remember `start_pos = 3`, call `skip_chars` a third time, now with `BARE_KEY_CHARS` as the alphabet, and slice.\n\nThe trace shows that walk stopping at 10 \u2014 the `]` is not a bare-key character \u2014 and `parse_key_part` returning `(10, 'players')`. The name was never built character by character; it is one slice, `src[3:10]`.\n\nTwo roads were not taken there. A `'` would have gone to `parse_literal_str` ([`_parser.py#L509-L510`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L509-L510)) and a `\"` to `parse_one_line_basic_str` ([`_parser.py#L511-L512`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L511-L512)) \u2014 which is how `[\"key#group\"]` and `[a.'\"b\"'.c]` are legal, and how an empty key `\"\"` is legal too. Anything else \u2014 a space, a bracket, a non-ASCII letter \u2014 falls through to `raise TOMLDecodeError(\"Invalid initial character for a key part\", src, pos)` ([`_parser.py#L513`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L513)).\n\n> **For the owner:** Table and key names are not restricted to anything resembling identifiers. Quoted parts may contain spaces, dots, `#`, control-ish characters and the empty string, and they arrive in the returned dict as literal `str` keys. Do not assume keys from an untrusted TOML file are safe to splice into paths, SQL, or attribute lookups.\n\nBack in `parse_key`, the part is wrapped into a one-element tuple \u2014 `key: Key = (key_part,)` \u2014 and that tuple, not a dotted string, is the parser's name for a namespace from here on ([`_parser.py#L479-L480`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L479-L480), type `Key = Tuple[str, ...]` in [`_types.py#L9`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_types.py#L9)). Tuples of `str` compare and hash by content, which is exactly what the flag bookkeeping in the next chapter needs.\n\nThen whitespace is skipped again \u2014 the trace's `skip_chars(src, 10, TOML_WS) \u2192 10` \u2014 and the loop asks whether the next character is a `.` ([`_parser.py#L481-L492`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L481-L488)). It is `]`. So the loop ends on its first iteration and `parse_key` returns `(10, ('players',))`.\n\nHad it been a dot, the loop would have consumed it, skipped more whitespace, parsed another part, and appended it \u2014 `[ g . h . i ]` and `[a.b.c]` reach the same three-element tuple. That loop carries one guard worth naming: after each append, `if len(key) > MAX_KEY_PARTS: raise RecursionError(f\"TOML key has more than the allowed {MAX_KEY_PARTS} parts\")` ([`_parser.py#L493-L496`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L493-L496)). `MAX_KEY_PARTS` is `sys.getrecursionlimit()`, and the comment above it states why: an excessive number of key parts \"runs into quadratic behavior (e.g. in `Flags.is_`)\", and although keys are not parsed recursively they name a recursive structure ([`_parser.py#L45-L50`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L45-L50)). This bound was added in 2.4.1 specifically to address that complexity ([CHANGELOG](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/CHANGELOG.md#L8-L11)).\n\n> **For the owner:** The key-length cap is read from `sys.getrecursionlimit()` once at import, so it is process-wide and whatever your application set it to; raising that limit also raises Tomli's tolerance for quadratic key handling. Note also that exceeding it raises `RecursionError`, not `TOMLDecodeError` \u2014 if you catch only `TOMLDecodeError` around `loads`, a pathological key will escape your handler.\n\nThe string leaves this stretch with its name read and its cursor parked on the first of the two closing brackets. Nothing has been written to the output dict yet, and nothing has been forbidden. `create_list_rule` is about to ask the `Flags` object whether this namespace may be claimed at all.\n\n> **Leaves as:** `(10, ('players',))` \u2014 a cursor at index 10 (on `]`) and the key tuple `('players',)`, returned into `create_list_rule`\n"}, {"n": 3, "title": "Claiming the namespace, appending the record", "data_in": "key=('players',), out with empty flags and empty data dict, pos=10", "data_out": "(12, ('players',)); out.data.dict == {'players': [{}]}, flag EXPLICIT_NEST set on ('players',); statement tail consumed to pos 13", "span": [27, 43], "md": "# Chapter 3 \u00b7 Claiming the namespace, appending the record\n\n> **Enters as:** `(10, ('players',))` inside `create_list_rule` \u2014 the key tuple read, the cursor on the first `]`, `out.data.dict` still `{}` and `out.flags` still empty\n\nThe name is parsed, but nothing has been promised yet. Before a single character of the document is turned into output, `create_list_rule` asks a question that has nothing to do with syntax: *is this namespace still open?*\n\n```\nif out.flags.is_(key, Flags.FROZEN):\n    raise TOMLDecodeError(f\"Cannot mutate immutable namespace {key}\", src, pos)\n```\n\n([`_parser.py#L410-L411`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L410-L411)). The trace records the call as `Flags.is_(key=('players',), flag=0) \u2192 False` \u2014 `FROZEN` is the constant `0` ([`_parser.py#L239`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L239)). `is_` walks its internal nested dict of flags, finds `_flags` empty, and returns `False` from its last line ([`_parser.py#L275-L290`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L275-L290)). Nothing has frozen `('players',)`, because nothing has happened yet.\n\nThat is the *only* thing `create_list_rule` refuses up front, and it is worth putting next to its sibling. `create_dict_rule` \u2014 the rule for a single-bracket `[table]` \u2014 checks two flags, not one: `if out.flags.is_(key, Flags.EXPLICIT_NEST) or out.flags.is_(key, Flags.FROZEN): raise TOMLDecodeError(f\"Cannot declare {key} twice\", ...)` ([`_parser.py#L390-L391`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L390-L391)). That asymmetry is the whole reason this document is legal: `[[players]]` may appear again further down, `[players]` may not.\n\nHaving decided the namespace is open, the rule does something that looks destructive and is in fact the point:\n\n```\n# Free the namespace now that it points to another empty list item...\nout.flags.unset_all(key)\n# ...but this key precisely is still prohibited from table declaration\nout.flags.set(key, Flags.EXPLICIT_NEST, recursive=False)\n```\n\n([`_parser.py#L412-L415`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L412-L415)). `unset_all` pops the key \u2014 and with it every flag recorded beneath it \u2014 out of the flag tree ([`_parser.py#L256-L262`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L256-L262)); on an empty tree it is a no-op, which is what the trace's `\u2192 None` reflects. Then `set` creates the entry fresh and drops flag `1`, `EXPLICIT_NEST`, into its non-recursive `\"flags\"` set ([`_parser.py#L264-L273`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L264-L273), constant at [`_parser.py#L242`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L242)). Wipe the sub-namespace so the new record starts clean; re-claim the key itself so no `[players]` can ever reopen it.\n\nOnly now does anything get written. `out.data.append_nest_to_list(key)` ([`_parser.py#L417`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L417)) calls `get_or_create_nest(key[:-1])` \u2014 here `key[:-1]` is the empty tuple, so the loop body never runs and the document root itself comes back, the trace's `\u2192 {}` ([`_parser.py#L298-L313`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L298-L313)). `'players'` is not in that root, so the `else` branch fires: `cont[last_key] = [{}]` ([`_parser.py#L315-L324`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L315-L324)). The output dict is now `{'players': [{}]}`, and that empty dict is the record the next two statements will fill.\n\nThe `if` branch is the interesting one. If `players` already existed and held something that was not a list, `append_nest_to_list` raises `KeyError(\"An object other than list found behind this key\")` ([`_parser.py#L320-L321`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L320-L321)) \u2014 and `create_list_rule` catches it and re-raises as `TOMLDecodeError(\"Cannot overwrite a value\", src, pos) from None` ([`_parser.py#L416-L419`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L416-L419)).\n\n> **For the owner:** Structural clashes such as `a = true` followed by `[[a]]` surface as `TOMLDecodeError`, not as the internal `KeyError` the nested-dict helper raises. Catch `TOMLDecodeError` (or its base `ValueError`) around `loads` and you will catch these; the `from None` also suppresses the internal exception from the traceback, so error output stays clean.\n\nLast, the closing brackets are verified rather than assumed: `if not src.startswith(\"]]\", pos)` raises `\"Expected ']]' at the end of an array declaration\"`, otherwise the rule returns `pos + 2` ([`_parser.py#L421-L425`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L421-L425)). The trace's `\u2192 (12, ('players',))` lands the cursor just past `]]`, and back in the loop that tuple is unpacked straight into `pos, header` ([`_parser.py#L211`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L211)) \u2014 `header` is now `('players',)` and will prefix every key until the next bracket statement.\n\nWhat follows is the statement tail, and it is identical for every rule in the loop. Trailing whitespace is skipped (`skip_chars(\u2026, 12, TOML_WS) \u2192 12`, [`_parser.py#L214`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L214)). Then `skip_comment(src, 12)` ([`_parser.py#L219`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L219)) reads `src[12]`, sees `\\n` rather than `#`, and returns 12 unchanged ([`_parser.py#L364-L373`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L364-L373)). Had there been a comment, `skip_until` would have run to the next newline \u2014 tolerating end-of-file, but raising `Found invalid character \u2026` if any ASCII control character appeared inside it ([`_parser.py#L342-L361`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L342-L361), alphabet at [`_parser.py#L62`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L62)).\n\nThen the loop insists on a clean break: the next character must be `\\n`, or the document must end, or `TOMLDecodeError(\"Expected newline or end of document after a statement\")` ([`_parser.py#L221-L230`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L221-L229)). It is `\\n`; `pos += 1` makes it 13, and the loop's first step skips leading whitespace there, finding none.\n\n> **For the owner:** There is no lenient mode. Trailing junk after a header, an unclosed bracket, or a stray character all abort the whole parse \u2014 `loads` either returns a complete document or raises. You never receive a partially parsed dict, which is the guarantee that makes it safe to use the result without checking whether parsing \"mostly\" worked.\n\nThe document's first record now exists as an empty dict inside a list inside the output, the header is set, and the cursor is poised on the `n` of `name`.\n\n> **Leaves as:** `pos = 13`, `header = ('players',)`, `out.data.dict == {'players': [{}]}`, with `('players',)` flagged `EXPLICIT_NEST` and not `FROZEN`\n"}, {"n": 4, "title": "A key, an equals sign, and a quoted string", "data_in": "src, pos=13, header=('players',), parse_float=float, nest_lvl=0", "data_out": "(30, ('name',), 'Lehtinen')", "span": [44, 62], "md": "# Chapter 4 \u00b7 A key, an equals sign, and a quoted string\n\n> **Enters as:** `src`, `pos = 13`, `header = ('players',)`, `parse_float = float` \u2014 the cursor resting on the `n` of `name = \"Lehtinen\"`\n\nThe statement loop looked at `src[13]`, found `'n'` in `KEY_INITIAL_CHARS`, and routed the line to `key_value_rule` ([`_parser.py#L201-L203`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L201-L203)). That rule's very first act is to delegate: `pos, key, value = parse_key_value_pair(src, pos, parse_float, nest_lvl=0)` ([`_parser.py#L428-L431`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L428-L431)). Note the `nest_lvl=0`. Nothing in the trace will change it, because it is incremented only when the parser descends into an array or an inline table \u2014 but it is the seed of a safety bound, and it travels with the data from here on.\n\n### The key, again\n\n`parse_key_value_pair` calls the same `parse_key` that read the table header one chapter ago ([`_parser.py#L465`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L465)). There is only one key grammar in TOML, and only one implementation of it; a bare word, a `'literal'` part, a `\"basic\"` part and a dotted chain all behave identically whether they name a table or a value.\n\n`parse_key_part(src, 13)` sees `'n'` in `BARE_KEY_CHARS`, runs `skip_chars` across the bare alphabet to 17, and slices out `'name'` \u2014 the trace's `\u2192 (17, 'name')` ([`_parser.py#L500-L508`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L500-L508)). Back in `parse_key`, the part is wrapped into the one-element tuple `('name',)`, whitespace is skipped (17 \u2192 18, swallowing the space before `=`), and the loop checks whether the next character is a dot ([`_parser.py#L478-L498`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L478-L488)). It is `'='`, so the loop returns immediately: `(18, ('name',))`. Had it been a dot, the loop would have appended another part and then enforced `MAX_KEY_PARTS`, raising `RecursionError` past `sys.getrecursionlimit()` parts ([`_parser.py#L489-L497`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L489-L497)) \u2014 a bound added because `Flags.is_` costs time proportional to key length.\n\nThe cursor is parked on the `=`, and `parse_key_value_pair` insists on finding it there:\n\n```\nif char != \"=\":\n    raise TOMLDecodeError(\"Expected '=' after a key in a key/value pair\", src, pos)\n```\n\n([`_parser.py#L466-L471`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L466-L471)). The read is wrapped in `try/except IndexError` so that a document ending right after a key \u2014 `fs.fw`, one of the invalid fixtures \u2014 produces that same decode error rather than an `IndexError`. Then `pos += 1` and `skip_chars` over the space: 19 \u2192 20 ([`_parser.py#L472-L473`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L472-L473)).\n\n### Choosing what kind of value this is\n\n`parse_value(src, 20, float, 0)` ([`_parser.py#L703-L705`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L703-L705)) begins with the guard that `nest_lvl` was carried here for:\n\n```\nif nest_lvl > MAX_INLINE_NESTING:\n    raise RecursionError(\n        \"TOML inline arrays/tables are nested more than the allowed\"\n        f\" {MAX_INLINE_NESTING} levels\"\n    )\n```\n\n([`_parser.py#L706-L712`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L706-L712)). `MAX_INLINE_NESTING` is 400, and the comment above it explains the choice plainly: inline tables and arrays are parsed by recursion, pure Python would raise `RecursionError` on its own, but a mypyc-compiled binary would crash the process unrecoverably instead ([`_parser.py#L32-L43`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L32-L43)). At `nest_lvl = 0` the check costs one comparison and passes.\n\n> **For the owner:** Pathologically nested input raises `RecursionError`, not `TOMLDecodeError`, and `RecursionError` does not inherit from `ValueError`. Catch both when parsing untrusted documents \u2014 the project's own fuzzer does exactly that ([`fuzzer/fuzz.py#L26-L27`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/fuzzer/fuzz.py#L26-L27)). Treat the 400-level cap as a crash guard for the binary wheels, not as a general input-size limit; nothing here bounds document length.\n\nThen comes a chain of `if`s whose order is deliberate, flagged by a comment reading *\"IMPORTANT: order conditions based on speed of checking and likelihood\"* ([`_parser.py#L719`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L719)). The character at 20 is `\"`, so the very first branch fires. It asks whether three quotes start here \u2014 `src[20:23]` is `\"Le`, so no \u2014 and falls through to the single-line form ([`_parser.py#L721-L725`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L721-L725)). Everything below is skipped untouched: literals, `true`/`false`, `[`, `{`, the datetime and number regexes, and finally the `inf`/`nan` prefixes before the catch-all `raise TOMLDecodeError(\"Invalid value\", src, pos)` ([`_parser.py#L776`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L776)). That last line is where `val=.` and a key with nothing after the `=` both end up \u2014 in the second case `char` is `None`, every test fails, and the error reports *at end of document*.\n\n### Eight characters, checked one at a time\n\n`parse_one_line_basic_str` does one thing: step over the opening quote and hand off with `multiline=False` ([`_parser.py#L516-L518`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L516-L518)). The trace shows `parse_basic_str(src, pos=21, multiline=False)`.\n\nInside, the `multiline` flag picks two things: the set of characters that are illegal, and the escape handler ([`_parser.py#L671-L677`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L671-L677)). For a one-line string the alphabet is `ILLEGAL_BASIC_STR_CHARS` \u2014 every ASCII control character plus DEL, minus tab ([`_parser.py#L52-L56`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L52-L56)). A raw newline is in that set, which is why `a = \"\\n\"` written literally across two lines is rejected.\n\nThen the scan: remember `start_pos = 21`, walk forward, and dispatch on each character ([`_parser.py#L678-L700`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L680-L700)). `L`, `e`, `h`, `t`, `i`, `n`, `e`, `n` are none of `\"`, `\\`, or an illegal character, so each one just advances `pos`. No slicing, no concatenation \u2014 the loop is deliberately doing nothing until it has a reason to. At 29 it meets `\"`, and since this is not a multiline string it returns on the spot: `pos + 1, result + src[start_pos:pos]` \u2192 `(30, 'Lehtinen')`, one slice for the whole string.\n\nThe three branches not taken are where the guarantees live. On `IndexError` \u2014 running off the end of the document \u2014 it raises `TOMLDecodeError(\"Unterminated string\")` ([`_parser.py#L681-L684`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L681-L684)). On a control character it raises `Illegal character {char!r}` ([`_parser.py#L698-L699`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L698-L699)). On a backslash it flushes the pending slice, calls the escape parser, appends the replacement and resets `start_pos` ([`_parser.py#L692-L697`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L692-L697)). That escape parser accepts only the eight entries in `BASIC_STR_ESCAPE_REPLACEMENTS` plus `\\x`, `\\u` and `\\U` ([`_parser.py#L72-L83`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L72-L83), [`_parser.py#L602-L611`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L602-L611)); anything else is `Unescaped '\\' in a string`. Hex escapes must be the right length and real hex digits, and the resulting codepoint must be a Unicode scalar value \u2014 surrogates are rejected with `Escaped character is not a Unicode scalar value` ([`_parser.py#L618-L628`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L618-L628), [`_parser.py#L779-L780`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L779-L780)).\n\n> **For the owner:** Raw control characters are rejected, but *escaped* ones are not \u2014 `\"\\u0000\"` and `\"\\x7f\"` parse successfully into real NUL and DEL characters in the returned `str`. Do not assume strings coming out of `loads` are safe to splice into log lines, filenames or terminals; sanitise them at the point of use.\n\nThe value climbs back out unchanged through `parse_one_line_basic_str` and `parse_value`, and `parse_key_value_pair` assembles the three things the caller asked for ([`_parser.py#L474-L475`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L474-L475)): the new cursor, the key tuple, and a plain Python `str` \u2014 exactly the mapping the README's type table promises for a TOML String.\n\nNothing has been written to the output dict yet. The pair is still in flight, and the question of *which* dict may receive it is the next chapter's.\n\n> **Leaves as:** `(30, ('name',), 'Lehtinen')` \u2014 returned from `parse_key_value_pair` into `key_value_rule`'s `pos, key, value`\n"}, {"n": 5, "title": "Where the value is allowed to land", "data_in": "key=('name',), value='Lehtinen', header=('players',), pos=30", "data_out": "pos 30 returned; out.data.dict == {'players': [{'name': 'Lehtinen'}]}; statement tail consumed to pos 31", "span": [63, 73], "md": "# Chapter 5 \u00b7 Where the value is allowed to land\n\n> **Enters as:** `(30, ('name',), 'Lehtinen')` \u2014 unpacked into `key_value_rule`'s `pos`, `key`, `value`, with `header = ('players',)` and `out.data.dict == {'players': [{}]}`\n\nThe pair is parsed but homeless. `key_value_rule` now has to decide, in order: which dict the value belongs in, whether that dict is allowed to be written to, and whether the name is already taken. Only then does anything land.\n\n### Computing the address\n\nTwo lines of arithmetic settle the destination:\n\n```\nkey_parent, key_stem = key[:-1], key[-1]\nabs_key_parent = header + key_parent\n```\n\n([`_parser.py#L432-L433`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L432-L433)). With `key = ('name',)`, `key_parent` is the empty tuple and `key_stem` is `'name'`, so `abs_key_parent` is just `('players',)` \u2014 the header the last `[[players]]` statement installed. This is the whole of the \"current table\" rule: a value is written under the header in force when its line was read, and nowhere else. A dotted key like `a.b.c = 1` would put `('a', 'b')` into `key_parent` and address the nested container instead, but the prefix is always the header.\n\nNext comes a loop that, in this run, does not execute at all:\n\n```\nrelative_path_cont_keys = (header + key[:i] for i in range(1, len(key)))\n```\n\n([`_parser.py#L435-L442`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L435-L442)). `len(key)` is 1, so `range(1, 1)` is empty and the generator yields nothing \u2014 which is why the trace shows no `Flags.add_pending` call between the return of `parse_key_value_pair` at line 62 and the `Flags.is_` at line 63. For a dotted key it would walk every intermediate container the key implies, refuse outright if one is already marked `EXPLICIT_NEST` (`Cannot redefine namespace {cont_key}`), and otherwise record a *pending* `EXPLICIT_NEST` on it via `add_pending` ([`_parser.py#L248-L249`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L248-L249)). Those pending marks are the subject of chapter 7; here it is enough that a single-part key creates none.\n\n### Permission: is this namespace frozen?\n\n```\nif out.flags.is_(abs_key_parent, Flags.FROZEN):\n    raise TOMLDecodeError(\n        f\"Cannot mutate immutable namespace {abs_key_parent}\", src, pos\n    )\n```\n\n([`_parser.py#L444-L447`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L444-L447)). The trace records `Flags.is_(key=('players',), flag=0) \u2192 False`. `Flags.is_` walks the key part by part through the nested flag tree, returning `True` early if any ancestor carries the flag in its `recursive_flags`, and finally checking the last part's own `flags` and `recursive_flags` ([`_parser.py#L275-L290`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L275-L290)). `('players',)` carries `EXPLICIT_NEST` from chapter 3 and nothing else, so the FROZEN query is `False` and the write may proceed.\n\nThis is also the answer to what FROZEN *is*. Nothing in table or array-of-tables syntax sets it; it is set a few lines below, and only for one kind of value \u2014 see the end of this chapter. Its effect is to close a namespace permanently: that check is what makes\n\n```\na = { b = 1 }\na.b = 2\n```\n\nan error rather than an update ([`tests/data/invalid/inline-table/mutate.toml#L1-L2`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/data/invalid/inline-table/mutate.toml#L1-L2)).\n\n### Finding the dict \u2014 and descending into the list\n\n```\ntry:\n    nest = out.data.get_or_create_nest(abs_key_parent)\nexcept KeyError:\n    raise TOMLDecodeError(\"Cannot overwrite a value\", src, pos) from None\n```\n\n([`_parser.py#L449-L452`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L449-L452)). The trace shows `NestedDict.get_or_create_nest(key=('players',), access_lists=True) \u2192 {}`.\n\nThat `{}` is not a new dict. `get_or_create_nest` starts at the root dict, and for each part of the key does three things ([`_parser.py#L298-L313`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L304-L313)): create an empty dict if the part is missing, step into it, and then \u2014 the line this whole chapter turns on \u2014\n\n```\nif access_lists and isinstance(cont, list):\n    cont = cont[-1]\n```\n\n([`_parser.py#L309-L310`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L309-L310)). `out.data.dict['players']` is a list, so the walk descends into its **last element** \u2014 the empty dict that `append_nest_to_list` pushed when the header was read. That single line is the entire implementation of \"each `[[players]]` block starts a new record, and the lines beneath it fill that record in.\" Nothing else tracks which item is current; it is always `cont[-1]`.\n\nIf the walk met something that was neither dict nor list \u2014 say `a = 1` followed by `[a.b.c.d]` \u2014 it raises `KeyError(\"There is no nest behind this key\")` ([`_parser.py#L311-L312`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L311-L312)), which the caller catches and converts into a `TOMLDecodeError`. That conversion matters: a structural clash in the document surfaces as a decode error with line and column, not as a bare `KeyError` escaping from internals.\n\nWorth noticing in the other direction: missing intermediate keys are created silently ([`_parser.py#L305-L307`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L305-L307)). Implicit parent tables are legal TOML, so the parser manufactures them without comment.\n\n### Permission, again: is the name taken?\n\n```\nif key_stem in nest:\n    raise TOMLDecodeError(\"Cannot overwrite a value\", src, pos)\n```\n\n([`_parser.py#L453-L454`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L453-L454)). `nest` is `{}`, so `'name'` is free. Had the same key already been assigned in this table, the document would be rejected \u2014 the parser never resolves a conflict by letting the later line win.\n\n> **For the owner:** Duplicate keys in the same table are a hard error, not a last-writer-wins merge, and this holds for keys that look different but decode the same \u2014 `a = 1` and `\"\\u0061\" = 1` collide, because the check is on the decoded `str` ([`tests/data/invalid/_external/toml-test/invalid/key/duplicate-keys-05.toml#L1-L2`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/data/invalid/_external/toml-test/invalid/key/duplicate-keys-05.toml#L1-L2)). If your config pipeline concatenates TOML fragments before parsing, expect the whole document to be rejected rather than quietly deduplicated.\n\n### The write, and the branch not taken\n\n```\nif isinstance(value, (dict, list)):\n    out.flags.set(header + key, Flags.FROZEN, recursive=True)\nnest[key_stem] = value\nreturn pos\n```\n\n([`_parser.py#L455-L459`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L455-L459)). `'Lehtinen'` is a `str`, so the `isinstance` test fails and no flag is set \u2014 which is why the trace shows no `Flags.set` call in this span. Had the value been an inline table or an array, this is where its namespace would be sealed: `recursive=True` puts FROZEN into `recursive_flags`, and `Flags.is_` returns `True` for that key and everything beneath it ([`_parser.py#L264-L273`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L264-L273), [`_parser.py#L282-L284`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L282-L284)). Inline tables are immutable in TOML, and this one line is the whole enforcement.\n\nThen `nest['name'] = 'Lehtinen'`. Because `nest` *is* the dict sitting inside `out.data.dict['players'][0]`, the root dict now reads `{'players': [{'name': 'Lehtinen'}]}`. `key_value_rule` returns `30`.\n\n> **For the owner:** Every rejection in this function \u2014 frozen namespace, non-dict in the path, duplicate key \u2014 raises before any mutation of that statement's value. But earlier statements have already been written into the dict, and `loads` discards it on the way out. There is no partial result to inspect: on `TOMLDecodeError` you get an exception and nothing else, so don't design a recovery path that expects half a document.\n\n### Finishing the line\n\nBack in the statement loop, the tail is identical for every rule ([`_parser.py#L218-L230`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L218-L230)). `skip_chars(src, 30, TOML_WS)` finds a newline immediately and returns 30. `skip_comment(src, 30)` sees no `#` and returns 30 unchanged ([`_parser.py#L364-L373`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L364-L373)). Then the loop insists on what the error message calls a clean ending:\n\n```\nif char != \"\\n\":\n    raise TOMLDecodeError(\n        \"Expected newline or end of document after a statement\", src, pos\n    )\npos += 1\n```\n\n`src[30]` is `'\\n'`, so `pos` becomes 31 and the loop runs again from the top, where `skip_chars(src, 31, TOML_WS)` returns 31 \u2014 the cursor on the `n` of `number = 26`. This check is why `a = 1 b = 2` on one line is invalid: after the first pair, the next character is a space-then-`b`, not a newline.\n\n> **Leaves as:** `pos = 31`, `out.data.dict == {'players': [{'name': 'Lehtinen'}]}`, `header` still `('players',)`\n"}, {"n": 6, "title": "When the value is not a string: regexes, lazily", "data_in": "src, pos=31 \ns2192 key/value `number = 26`", "data_out": "(42, ('number',), 26); out.data.dict == {'players': [{'name': 'Lehtinen', 'number': 26}]}", "span": [74, 95], "md": "# Chapter 6 \u00b7 When the value is not a string: regexes, lazily\n\n> **Enters as:** `pos = 31`, `header = ('players',)`, `out.data.dict == {'players': [{'name': 'Lehtinen'}]}` \u2014 the cursor on the `n` of `number = 26`\n\nThe second statement of the record travels the same road as the first. `key_value_rule` hands straight off to `parse_key_value_pair` ([`_parser.py#L431`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L431)), `parse_key` consumes six bare-key characters and returns `(37, 'number')`, a `skip_chars` eats the space to 38, where the `=` sits; `pos` steps to 39 and another `skip_chars` lands on 40 ([`_parser.py#L465-L474`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L465-L474)). The trace records exactly that: `(38, ('number',))`, then `skip_chars(pos=39) \u2192 40`.\n\nWhat is different starts here. At position 40 sits `2`, and `parse_value` has no fast character test for digits.\n\n### The dispatch runs out of cheap options\n\n`parse_value` is ordered deliberately \u2014 \"IMPORTANT: order conditions based on speed of checking and likelihood\" ([`_parser.py#L719`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L719)). A `\"` or `'` is a string, `t`/`f` a boolean, `[` an array, `{` an inline table; each is a single comparison ([`_parser.py#L721-L747`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L721-L747)). A `2` is none of them, so the value falls through to the only part of the parser that needs regular expressions.\n\nThat fall-through is the reason the regexes exist in a separate module at all. `_parser.py` opens by declaring it:\n\n```\n# Defer loading regular expressions until we actually need them in\n# parse_value().\n__lazy_modules__ = [\"tomli._re\"]\n```\n\n([`_parser.py#L7-L9`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L7-L9)), and only then writes the ordinary-looking `from ._re import (...)` ([`_parser.py#L13-L20`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L13-L20)). On an interpreter that honours the declaration, importing `tomli` does not pay for `re` and `datetime`; a document made only of strings, booleans and arrays never touches them. The repository checks this directly \u2014 a subprocess parses such a document and asserts `'tomli._re' not in sys.modules`, under pure Python 3.15+ ([`tests/test_misc.py#L160-L180`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/test_misc.py#L160-L180)). Our `26` is precisely the kind of value that ends that deferral.\n\n### Dates first, and why the order is not negotiable\n\nBefore the number regex gets a look, two others are tried:\n\n```\ndatetime_match = RE_DATETIME.match(src, pos)\n...\nlocaltime_match = RE_LOCALTIME.match(src, pos)\n```\n\n([`_parser.py#L749-L759`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L749-L759)). `RE_DATETIME` wants four digits then `-` ([`_re.py#L46-L56`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_re.py#L46-L56)); `RE_LOCALTIME` wants `[01][0-9]` or `2[0-3]` then `:` ([`_re.py#L17-L24`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_re.py#L17-L24)). `26` satisfies neither, and the trace shows no `match_to_datetime` or `match_to_localtime` call. The ordering is documented where it matters: \"The regex will greedily match any type starting with a decimal char, so needs to be located after handling of dates and times\" ([`_parser.py#L761-L763`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L761-L763)). Run `RE_NUMBER` first and `1987-07-05` would parse as the integer `1987` with trailing garbage.\n\nHad the date branch been taken, note where validity is decided. The regex only constrains shape \u2014 month `01`\u2013`12`, day up to `31`. The calendar is enforced by `datetime` itself, when `match_to_datetime` calls `date(...)` or `datetime(...)` ([`_re.py#L78-L92`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_re.py#L78-L92)), and `parse_value` catches the resulting `ValueError` and re-raises it as `TOMLDecodeError(\"Invalid date or datetime\", src, pos)` ([`_parser.py#L752-L755`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L752-L755)). `2100-02-29` is therefore rejected as a decode error with a position, not as a stray `ValueError` from the standard library.\n\n### One match, two possible types\n\n```\nnumber_match = RE_NUMBER.match(src, pos)\nif number_match:\n    return number_match.end(), match_to_number(number_match, parse_float)\n```\n\n([`_parser.py#L764-L766`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L764-L766)). The trace shows the match object: `<re.Match span=(40, 42) match='26'>`. `RE_NUMBER` covers hex/octal/binary prefixes and the decimal form in one pattern, with the fractional and exponent parts captured in a named group ([`_re.py#L26-L44`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_re.py#L26-L44)). That group is the whole of the int/float decision:\n\n```\ndef match_to_number(match: re.Match[str], parse_float: ParseFloat) -> Any:\n    if match.group(\"floatpart\"):\n        return parse_float(match.group())\n    return int(match.group(), 0)\n```\n\n([`_re.py#L116-L119`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_re.py#L116-L119)). For `26` the group matched the empty string \u2014 falsy \u2014 so `parse_float` is never called and `int('26', 0)` runs instead. Base `0` is what lets `0xDEADBEEF`, `0o755` and `0b1101` come back as integers without a second code path; the regex has already guaranteed the literal is well-formed, including the underscores Python's `int` also accepts. The trace: `match_to_number(...) \u2192 26`, and `parse_value` returns `(42, 26)`.\n\nNothing bounds how many digits that literal may have, which is worth remembering for untrusted input; the subject returns in chapter 8.\n\nHad the regexes all failed, three characters would have been compared against `inf` and `nan`, then four against the signed forms ([`_parser.py#L768-L774`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L768-L774)), and failing that the value would have been rejected: `raise TOMLDecodeError(\"Invalid value\", src, pos)` ([`_parser.py#L776`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L776)).\n\n### The `parse_float` seam\n\nThis is the one place a caller's own code could have run inside the parser, and it is also where chapter 1's unwrapped `float` is explained. `make_safe_parse_float` short-circuits the default \u2014 \"The default `float` callable never returns illegal types. Optimize it.\" ([`_parser.py#L791-L793`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L791-L793)) \u2014 and wraps anything else:\n\n```\nfloat_value = parse_float(float_str)\nif isinstance(float_value, (dict, list)):\n    raise ValueError(\"parse_float must not return dicts or lists\")\n```\n\n([`_parser.py#L795-L799`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L795-L799)). The reason is structural, not cosmetic: a dict or list returned from `parse_float` would be indistinguishable from a parsed table or array, and `key_value_rule` would mark its namespace FROZEN on the strength of an `isinstance` check ([`_parser.py#L455-L457`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L455-L457)). The guard stops the confusion at the door.\n\n> **For the owner:** A custom `parse_float` that returns a dict or list raises a plain `ValueError`, not a `TOMLDecodeError` ([`_parser.py#L797-L798`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L797-L798)). Catch `ValueError` around `loads` whenever you pass `parse_float`, since that covers both this guard and `TOMLDecodeError`, which subclasses it. Note also that the callable runs on attacker-controlled text, so review it as parser code.\n\n### What the exception would have carried\n\nEvery rejection in this chapter ends at the same constructor. `TOMLDecodeError` takes `msg`, `doc` and `pos`, derives the line from `doc.count(\"\\n\", 0, pos) + 1` and the column from the preceding newline, formats `\"{msg} (at line L, column C)\"` \u2014 or `\"(at end of document)\"` when `pos` is past the end \u2014 and then stores `msg`, `doc`, `pos`, `lineno` and `colno` on the instance ([`_parser.py#L132-L149`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L132-L149)). It subclasses `ValueError` ([`_parser.py#L91`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L91)). Constructing it with free-form arguments still works but warns, a deprecation kept for compatibility ([`_parser.py#L109-L130`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L109-L130)).\n\n> **For the owner:** Branch on the exception type and on `msg`, `lineno`, `colno` and `pos`, never on `str(e)`. The README states plainly that error messages are informational only and should not be assumed to stay constant across Tomli versions ([`README.md#L103-L104`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/README.md#L103-L104)). Note that `doc` holds the entire document, so an error object logged verbatim will spill whatever secrets the config contains.\n\n### Landing\n\nBack in `key_value_rule`, the second value repeats chapter 5's checks with one different answer. `Flags.is_(('players',), FROZEN)` is still `False`. `get_or_create_nest(('players',))` walks into the list and returns `cont[-1]` again \u2014 and the trace shows what that dict now holds: `{'name': 'Lehtinen'}`, not `{}` ([`_parser.py#L304-L313`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L304-L313)). `'number'` is not in it, so the duplicate check passes; `26` is neither dict nor list, so no FROZEN flag is set; `nest['number'] = 26` ([`_parser.py#L453-L458`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L453-L458)). The first record is complete, and `key_value_rule` returns 42.\n\n> **Leaves as:** `pos = 42`, `out.data.dict == {'players': [{'name': 'Lehtinen', 'number': 26}]}`, `header` still `('players',)`\n"}, {"n": 7, "title": "The same header again \ns legally", "data_in": "src, pos=42; out.data.dict == {'players': [{'name': 'Lehtinen', 'number': 26}]}", "data_out": "(55, ('players',)); out.data.dict == {'players': [{...26}, {}]}, header reset to ('players',)", "span": [96, 126], "md": "# Chapter 7 \u00b7 The same header again, legally\n\n> **Enters as:** `pos = 42`, `header = ('players',)`, `out.data.dict == {'players': [{'name': 'Lehtinen', 'number': 26}]}` \u2014 the cursor on the newline that ends `number = 26`\n\nThe first record is finished, but the statement is not. Back in the loop, the same three steps that close every statement run again: `skip_chars` finds no trailing whitespace and returns 42, `skip_comment` finds no `#` and returns 42, and then the character at 42 is read and tested ([`_parser.py#L218-L230`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L218-L230)). It is `\\n`, so `pos` becomes 43 and the loop turns over. Anything else there \u2014 a stray word, a second key \u2014 would have raised `TOMLDecodeError(\"Expected newline or end of document after a statement\", src, pos)` ([`_parser.py#L226-L230`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L226-L230)).\n\nPosition 43 is the blank line separating the two records. The loop's first step skips leading whitespace (trace: `skip_chars(pos=43) \u2192 43`), reads `\\n`, and takes the cheapest branch in the whole parser:\n\n```python\nif char == \"\\n\":\n    pos += 1\n    continue\n```\n\n([`_parser.py#L198-L200`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L198-L200)). No rule, no comment scan, no end-of-statement check. `pos` is 44, and the next `skip_chars` leaves it there.\n\n### Two brackets, and a flush before the rule\n\nAt 44 the character is `[`, which means a header \u2014 but which kind is decided by the character after it, read defensively:\n\n```python\ntry:\n    second_char: str | None = src[pos + 1]\nexcept IndexError:\n    second_char = None\nout.flags.finalize_pending()\nif second_char == \"[\":\n    pos, header = create_list_rule(src, pos, out)\nelse:\n    pos, header = create_dict_rule(src, pos, out)\n```\n\n([`_parser.py#L204-L213`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L204-L213)). A document ending in a lone `[` would set `second_char = None` and fall into `create_dict_rule`, which fails with a decode error rather than an `IndexError`. Here `src[45]` is `[`, so the array-of-tables rule is chosen.\n\nNote what happens *between* the two: `finalize_pending()`. The trace shows the call and a `None` return \u2014 it does nothing in this run, because nothing is pending. But its placement is the whole mechanism, so it is worth saying what it would have done.\n\n`Flags` keeps two kinds of marks. `set` writes a flag immediately; `add_pending` only drops `(key, flag)` into a set to be applied later ([`_parser.py#L248-L254`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L248-L254)). The only caller of `add_pending` is `key_value_rule`, which records an `EXPLICIT_NEST` mark for every intermediate container a dotted key creates, with the comment that those containers \"can't be opened with the table syntax or dotted key/value syntax in following table sections\" ([`_parser.py#L435-L442`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L435-L442)). Committing those marks straight away would be too strict: the same rule checks `is_(cont_key, EXPLICIT_NEST)` two lines earlier and raises `Cannot redefine namespace` if set, so `b.c = 1` followed by `b.d = 2` inside one table would reject itself on the shared `b`. That pattern is a valid fixture ([`key/dotted-04.toml#L4-L5`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/data/valid/_external/toml-test/valid/key/dotted-04.toml#L4-L5)). Deferring the marks until the next `[`-headed statement keeps the current table writable and still slams the door afterwards: `[t1]` / `t2.t3.v = 0` / `[t1.t2]` is invalid ([`table/redefine-1.toml#L1-L3`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/data/invalid/table/redefine-1.toml#L1-L3)).\n\n### The one check this rule makes\n\n`create_list_rule` skips the two brackets (44 \u2192 46), trims whitespace, and parses the key exactly as in chapter 2: the trace shows `parse_key(pos=46) \u2192 (53, ('players',))`. Then comes the gate:\n\n```python\nif out.flags.is_(key, Flags.FROZEN):\n    raise TOMLDecodeError(f\"Cannot mutate immutable namespace {key}\", src, pos)\n```\n\n([`_parser.py#L410-L411`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L410-L411)). That is the *only* flag it consults \u2014 the trace confirms a single `Flags.is_(('players',), 0) \u2192 False`. Its sibling `create_dict_rule` checks two:\n\n```python\nif out.flags.is_(key, Flags.EXPLICIT_NEST) or out.flags.is_(key, Flags.FROZEN):\n    raise TOMLDecodeError(f\"Cannot declare {key} twice\", src, pos)\n```\n\n([`_parser.py#L390-L391`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L390-L391)). That asymmetry is the entire answer to why this header may appear twice: a `[table]` is refused if the name is already an explicit nest, an `[[array]]` is not.\n\n> **For the owner:** A `[table]` header is guaranteed to be unique within a document, but a `[[table]]` header is not, and the parser treats a repeat as an append rather than an error ([`_parser.py#L390-L391`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L390-L391), [`_parser.py#L410-L417`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L410-L417)). Mixing the two forms on one name is rejected in both orders ([`table/duplicate-key-07.toml#L1-L2`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/data/invalid/_external/toml-test/invalid/table/duplicate-key-07.toml#L1-L2)). If your schema assumes a key appears once, validate the list length yourself after parsing.\n\n### Freeing the namespace, then re-claiming the name\n\nTwo lines, with the reasoning written beside them:\n\n```python\n# Free the namespace now that it points to another empty list item...\nout.flags.unset_all(key)\n# ...but this key precisely is still prohibited from table declaration\nout.flags.set(key, Flags.EXPLICIT_NEST, recursive=False)\n```\n\n([`_parser.py#L412-L415`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L412-L415)). `unset_all` walks to the parent container and pops the key, taking its whole `\"nested\"` subtree of flags with it ([`_parser.py#L256-L262`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L256-L262)). Everything the first record marked beneath `('players',)` is forgotten, which is what lets the second record use the same dotted-key prefixes again. `set` then immediately re-writes the single `EXPLICIT_NEST` mark on `('players',)` itself, so a later `[players]` still fails ([`_parser.py#L264-L273`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L264-L273)).\n\nNothing about duplicate *keys* is lost in that wipe. Duplicate detection inside a record is done against the dict itself \u2014 `if key_stem in nest` ([`_parser.py#L453-L454`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L453-L454)) \u2014 and the second record's dict is brand new.\n\n### The new record\n\n```python\ndef append_nest_to_list(self, key: Key) -> None:\n    cont = self.get_or_create_nest(key[:-1])\n    last_key = key[-1]\n    if last_key in cont:\n        list_ = cont[last_key]\n        if not isinstance(list_, list):\n            raise KeyError(\"An object other than list found behind this key\")\n        list_.append({})\n    else:\n        cont[last_key] = [{}]\n```\n\n([`_parser.py#L315-L324`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L315-L324)). `key[:-1]` is empty, so `get_or_create_nest(())` returns the document root \u2014 and the trace shows it is no longer empty: `{'players': [{'name': 'Lehtinen', 'number': 26}]}`. `'players'` is present and is a list, so a fresh `{}` is appended. That empty dict is now `list[-1]`, which is exactly what `get_or_create_nest` will descend into for every key/value statement that follows.\n\nThe `KeyError` branch is for a name already holding something that is not a list \u2014 `a = true` followed by `[[a]]` ([`array-of-tables/overwrite-bool-with-aot.toml#L1`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/data/invalid/array-of-tables/overwrite-bool-with-aot.toml#L1)). The caller converts it: `except KeyError: raise TOMLDecodeError(\"Cannot overwrite a value\", src, pos) from None` ([`_parser.py#L416-L419`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L416-L419)).\n\n> **For the owner:** Every internal `KeyError` raised by the nested-dict layer is caught and re-raised as `TOMLDecodeError` at each of its three call sites ([`_parser.py#L393-L396`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L393-L396), [`_parser.py#L416-L419`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L416-L419), [`_parser.py#L449-L452`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L449-L452)). Treat `TOMLDecodeError`, `TypeError` and `RecursionError` as the complete failure surface for a malformed document, and report anything else as a bug.\n\nFinally the rule insists on the closing brackets \u2014 `src.startswith(\"]]\", 53)` holds, otherwise `Expected ']]' at the end of an array declaration` ([`_parser.py#L421-L424`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L421-L424)) \u2014 and returns `(55, ('players',))`. Back in the loop, that tuple is unpacked into `pos` and `header` ([`_parser.py#L211`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L211)). The header string is identical to the one bound thirty characters earlier; the dict it now points at is not.\n\n> **Leaves as:** `pos = 55`, `header = ('players',)`, `out.data.dict == {'players': [{'name': 'Lehtinen', 'number': 26}, {}]}`, with `EXPLICIT_NEST` set on `('players',)` and nothing pending\n"}, {"n": 8, "title": "The second record, and handing back the dict", "data_in": "src, pos=55, header=('players',), out.data.dict == {'players': [{...26}, {}]}", "data_out": "{'players': [{'name': 'Lehtinen', 'number': 26}, {'name': 'Numminen', 'number': 27}]}", "span": [127, 191], "md": "# Chapter 8 \u00b7 The second record, and handing back the dict\n\n> **Enters as:** `pos = 55`, `header = ('players',)`, `out.data.dict == {'players': [{'name': 'Lehtinen', 'number': 26}, {}]}`\n\nThe header rule handed back position 55, and the statement that opened the second record still has to be closed the way every statement is closed. `skip_chars` at 55 finds no trailing whitespace and returns 55; `skip_comment` finds no `#` and returns 55; the character there is read and found to be `\\n`, so `pos` becomes 56 ([`_parser.py#L218-L230`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L218-L230)). The loop turns over, skips leading whitespace \u2014 `skip_chars(pos=56) \u2192 56` \u2014 and reads `n`, a bare-key character, which routes to `key_value_rule` ([`_parser.py#L201-L203`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L201-L203)).\n\nFrom here the two remaining statements retrace roads already walked. `name = \"Numminen\"` goes through `parse_key` (bare-key scan 56 \u2192 60, then whitespace to 61), the mandatory `=`, and `parse_value`, which sees `\"` and calls `parse_one_line_basic_str` \u2192 `parse_basic_str(pos=64, multiline=False)`. That returns `(73, 'Numminen')` \u2014 the closing quote at 72, position 73 just past it, and the slice between the quotes as a plain `str` ([`_parser.py#L685-L687`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L685-L687)). `parse_key_value_pair` assembles the triple `(73, ('name',), 'Numminen')` ([`_parser.py#L462-L475`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L462-L475)).\n\n### The same key, a different dict\n\nNow the interesting part, and the reason the first record's `name` is not about to be overwritten. `key_value_rule` computes `abs_key_parent = header + key[:-1]`, which is `('players',)` again \u2014 the identical tuple used for the first record ([`_parser.py#L432-L433`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L432-L433)). It asks `Flags.is_(('players',), FROZEN)`, gets `False`, and walks:\n\n```python\ncont: Any = self.dict\nfor k in key:\n    if k not in cont:\n        cont[k] = {}\n    cont = cont[k]\n    if access_lists and isinstance(cont, list):\n        cont = cont[-1]\n```\n\n([`_parser.py#L304-L313`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L298-L313)). `'players'` is present, it is a list, and `access_lists` is true, so the walk steps into `cont[-1]` \u2014 the empty dict appended by the header in the previous chapter. The trace records the return value plainly: `NestedDict.get_or_create_nest(key=('players',)) \u2192 {}`. The same key tuple, four lines of code later than last time, resolves to a different object, because the list grew underneath it.\n\n`'name' not in nest`, so no duplicate-key error ([`_parser.py#L453-L454`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L453-L454)); the value is a `str`, not a dict or list, so no `FROZEN` mark is set ([`_parser.py#L455-L457`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L455-L457)); and `nest['name'] = 'Numminen'` writes straight into the second record ([`_parser.py#L458-L459`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L458-L459)). The rule returns 73.\n\n### Twenty-seven\n\nThe statement tail runs again \u2014 `skip_chars(73) \u2192 73`, `skip_comment(73) \u2192 73`, `\\n`, `pos = 74` \u2014 and `number = 27` follows the numeric road from chapter 6. The bare-key scan runs 74 \u2192 80, whitespace to 81, `=` consumed, whitespace to 83, and `parse_value` falls past the string, boolean, array and inline-table tests into the regex section. `RE_DATETIME` and `RE_LOCALTIME` do not match; `RE_NUMBER` matches two characters, and the trace shows the handoff: `match_to_number(<re.Match span=(83, 85) '27'>, float) \u2192 27`. With no `floatpart` group, `parse_float` is never called and `int(match.group(), 0)` produces a Python `int` ([`_re.py#L116-L119`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_re.py#L116-L119), [`_parser.py#L764-L766`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L764-L766)).\n\nThis time `get_or_create_nest(('players',))` returns `{'name': 'Numminen'}` \u2014 the same object as a moment ago, now holding one key. `'number'` is added beside it, and the rule returns 85.\n\n### Falling off the end\n\nThe last statement tail: `skip_chars(85) \u2192 85`, `skip_comment(85) \u2192 85`, `src[85]` is the final `\\n`, `pos` becomes 86. The loop turns over one more time, `skip_chars(86) \u2192 86`, and then:\n\n```python\ntry:\n    char = src[pos]\nexcept IndexError:\n    break\n```\n\n([`_parser.py#L194-L197`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L194-L197)). The document is 86 characters long; there is no character at 86. The `IndexError` is the end-of-file signal, and it is caught in two places \u2014 here and again after the comment skip ([`_parser.py#L222-L225`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L222-L225)) \u2014 so a document ending in a newline, in trailing spaces, in a comment with no newline, or in nothing at all, all terminate cleanly rather than erroring.\n\nThen one line:\n\n```python\nreturn out.data.dict\n```\n\n([`_parser.py#L232`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L232)). Not a copy, not a wrapper \u2014 the very dict that `NestedDict.__init__` created at the start of the call ([`_parser.py#L293-L296`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L293-L296)) and that every `nest[key_stem] = value` has been filling in place. The `Output`, the `Flags`, the flag tree, the pending set, the 86-character `src` copy: all of it is local to the frame and goes away when the frame does ([`_parser.py#L175-L178`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L175-L178)). What crosses back over the boundary is:\n\n```python\n{'players': [{'name': 'Lehtinen', 'number': 26}, {'name': 'Numminen', 'number': 27}]}\n```\n\n> **For the owner:** The returned value is a plain `dict` of builtin and stdlib types only \u2014 `str`, `int`, `float` (or whatever `parse_float` returned), `bool`, `datetime`/`date`/`time`, `list`, `dict` ([README type table](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/README.md#L185-L199)). It is the parser's own object handed over whole rather than copied ([`_parser.py#L232`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L232)), and each call builds a fresh `Output` ([`_parser.py#L176`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L176)), so the result is yours to mutate and two concurrent calls cannot share state.\n\n> **For the owner:** A header with no key/value pairs under it is valid and yields an empty dict, not an error \u2014 `[[players]]` alone parses to `{\"players\": [{}]}` ([`table/array-empty.toml`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/data/valid/_external/toml-test/valid/table/array-empty.toml#L1), [`array-empty.json`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/tests/data/valid/_external/toml-test/valid/table/array-empty.json#L1-L3)). Validate required fields after parsing; a successful `loads` guarantees syntax, not shape.\n\n> **For the owner:** Parsing is single-pass over one in-memory string, and the only size bounds in the module are `MAX_INLINE_NESTING = 400` ([`_parser.py#L43`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L43)) and `MAX_KEY_PARTS` ([`_parser.py#L50`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L50)); document length and literal length are uncapped, and `loads` additionally holds a newline-normalized copy of the input ([`_parser.py#L169-L174`](https://github.com/hukkin/tomli/blob/18d8d59db6d632ebbcfe63f1f7636145d652da21/src/tomli/_parser.py#L169-L174)). Impose your own size limit before parsing untrusted input.\n\n> **Leaves as:** `{'players': [{'name': 'Lehtinen', 'number': 26}, {'name': 'Numminen', 'number': 27}]}` \u2014 a plain dict, returned to the caller\n"}], "flow": [{"kind": "start", "label": "The caller runs the intended use", "chapter": null}, {"kind": "step", "fn": "loads", "file": "src/tomli/_parser.py", "line": 164, "end": 232, "depth": 1, "returned": "{'players': [{'name': 'Lehtinen', 'number': 26}, {'name': 'Numminen', 'number': 27}]}", "chapter": 1}, {"kind": "decision", "line": 169, "end": 174, "question": "src = __s.replace('\\r\\n', '\\n') fails?", "answer": "no", "side": "yes", "exit": "raise TypeError", "file": "src/tomli/_parser.py", "chapter": 1}, {"kind": "step", "fn": "Output.__init__", "file": "src/tomli/_parser.py", "line": 328, "end": 330, "depth": 2, "returned": "None", "chapter": 1}, {"kind": "step", "fn": "NestedDict.__init__", "file": "src/tomli/_parser.py", "line": 294, "end": 296, "depth": 3, "returned": "None", "chapter": 1}, {"kind": "step", "fn": "Flags.__init__", "file": "src/tomli/_parser.py", "line": 244, "end": 246, "depth": 3, "returned": "None", "chapter": 1}, {"kind": "step", "fn": "make_safe_parse_float", "file": "src/tomli/_parser.py", "line": 783, "end": 801, "depth": 2, "returned": "<class 'float'>", "chapter": 1}, {"kind": "decision", "line": 792, "end": 793, "question": "parse_float is float", "answer": "yes", "side": "no", "exit": "raise ValueError", "file"
