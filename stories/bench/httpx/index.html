e94c124ef76f6a1fba5254/httpx/_models.py#L85-L90), [_models.py#L688-L697](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L688-L697)). That returns `'utf-8'`.\n2. If that is `None` *or* `_is_known_encoding` says `codecs.lookup` doesn't recognise it ([_models.py#L56-L64](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L56-L64)), fall back to `default_encoding` \u2014 the `'utf-8'` string the client attached in chapter 6, or, if it were a callable, a charset-autodetection function run over `_content`.\n3. Failing everything, `\"utf-8\"`.\n\nSo a server that advertises a nonsense charset cannot break text decoding; the bogus value is discarded and the default takes over. Here `_is_known_encoding('utf-8')` returns `True` and `self._encoding` is set to `'utf-8'`.\n\nThen a `TextDecoder` is built \u2014 and the critical argument is in its constructor ([_decoders.py#L311-L315](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_decoders.py#L311-L315)):\n\n```\nself.decoder = codecs.getincrementaldecoder(encoding)(errors=\"replace\")\n```\n\n`errors=\"replace\"`. `.text` will never raise on malformed bytes; invalid sequences become U+FFFD. Twelve clean ASCII bytes decode to `'Hello World!'`, the flush returns `''`, and the joined result is cached in `_text`.\n\nThat cache is also a lock: `encoding`'s setter raises `ValueError` if `_text` already exists ([_models.py#L674-L686](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L674-L686)), so a single response can never report two different texts. The scenario's second `response.text` at the end of the trace returns the cached string without re-decoding.\n\n> **For the owner:** `.text` silently substitutes replacement characters for undecodable bytes ([_decoders.py#L312](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_decoders.py#L312)) and guesses an encoding when the server omits or mis-states the charset ([_models.py#L664-L671](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L664-L671)). Use `.content` wherever byte-exactness matters, such as signature verification or binary payloads.\n\n## The audit trail: the header that was actually sent\n\n`response.request.headers[\"X-Custom\"]` returns `'value'`. This is not the dictionary the caller passed to `get()`; it is the `Headers` object on the `Request` that `_send_single_request` handed to the transport, after the merge of chapter 3 and the `Host`-prepending rebuild of `Request._prepare` ([_models.py#L460](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L460)). The request object is the record of what went out, which is why checking it is the right way to confirm a merge behaved.\n\n## Exiting the block\n\nThe `with` statement ends and `Client.__exit__` runs ([_client.py#L1293-L1304](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1293-L1304)):\n\n```\nself._state = ClientState.CLOSED\nself._transport.__exit__(exc_type, exc_value, traceback)\nfor transport in self._mounts.values():\n    if transport is not None:\n        transport.__exit__(exc_type, exc_value, traceback)\n```\n\nThe state flips to `CLOSED` unconditionally \u2014 before any cleanup, and regardless of whether the block exited by exception. From here `send()` raises `RuntimeError(\"Cannot send a request, as the client has been closed.\")` ([_client.py#L900-L901](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L900-L901)) and `__enter__` refuses to reopen it ([_client.py#L1275-L1283](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1275-L1283)). A `Client` is single-lifecycle.\n\n`_mounts` is empty, as chapter 1 established, so the loop does nothing. The transport's `__exit__` calls `close()` ([base.py#L18-L24](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/base.py#L18-L24)), and `WSGITransport` does not override it, so it lands on `BaseTransport.close`'s `pass` ([base.py#L61-L62](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_transports/base.py#L61-L62)). There is nothing to release: no socket, no file handle, no pool. This client owned a function.\n\nThat emptiness is specific to this scenario. With a real `HTTPTransport`, this same exit is what closes the connection pool ([_client.py#L1263-L1273](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1263-L1273)) \u2014 which is why the documented usage is the context-manager form.\n\n> **For the owner:** A `Client` that is neither context-managed nor explicitly `.close()`d leaks keep-alive connections when it uses a real transport ([_client.py#L1270-L1273](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_client.py#L1270-L1273)). Require `with httpx.Client(...)` or a `try/finally` around `close()` in any long-lived service code you sign off on.\n\nThe response survives its client. Because the body was buffered into `_content` during the read, `response.text` and `response.content` keep answering after the close ([_models.py#L636-L650](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L636-L650)) \u2014 the final `response.text` in the trace is served from the `_text` cache. Had the caller used `client.stream(...)` and held an unread response past the block, the stream would be closed and `iter_raw` would raise `StreamClosed` ([_models.py#L941-L942](https://github.com/encode/httpx/blob/b5addb64f0161ff6bfe94c124ef76f6a1fba5254/httpx/_models.py#L941-L942)).\n\nThe string `'Hello World!'` that the application returned as a one-element list has l(self, url: URL | str) -> None:\n        self._base_url = self._enforce_trailing_slash(URL(url))\n\n    @property\n    def headers(self) -> Headers:\n        \"\"\"\n        HTTP headers to include when sending requests.\n        \"\"\"\n        return self._headers\n\n    @headers.setter\n    def headers(self, headers: HeaderTypes) -> None:\n        client_headers = Headers(\n            {\n                b\"Accept\": b\"*/*\",\n                b\"Accept-Encoding\": ACCEPT_ENCODING.encode(\"ascii\"),\n                b\"Connection\": b\"keep-alive\",\n                b\"User-Agent\": USER_AGENT.encode(\"ascii\"),\n            }\n        )\n        client_headers.update(headers)\n        self._headers = client_headers\n\n    @property\n    def cookies(self) -> Cookies:\n        \"\"\"\n        Cookie values to include when sending requests.\n        \"\"\"\n        return self._cookies\n\n    @cookies.setter\n    def cookies(self, cookies: CookieTypes) -> None:\n        self._cookies = Cookies(cookies)\n\n    @property\n    def params(self) -> QueryParams:\n        \"\"\"\n        Query parameters to include in the URL when sending requests.\n        \"\"\"\n        return self._params\n\n    @params.setter\n    def params(self, params: QueryParamTypes) -> None:\n        self._params = QueryParams(params)\n\n    def build_request(\n        self,\n        method: str,\n        url: URL | str,\n        *,\n        content: RequestContent | None = None,\n        data: RequestData | None = None,\n        files: RequestFiles | None = None,\n        json: typing.Any | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Request:\n        \"\"\"\n        Build and return a request instance.\n\n        * The `params`, `headers` and `cookies` arguments\n        are merged with any values set on the client.\n        * The `url` argument is merged with any `base_url` set on the client.\n\n        See also: [Request instances][0]\n\n        [0]: /advanced/clients/#request-instances\n        \"\"\"\n        url = self._merge_url(url)\n        headers = self._merge_headers(headers)\n        cookies = self._merge_cookies(cookies)\n        params = self._merge_queryparams(params)\n        extensions = {} if extensions is None else extensions\n        if \"timeout\" not in extensions:\n            timeout = (\n                self.timeout\n                if isinstance(timeout, UseClientDefault)\n                else Timeout(timeout)\n            )\n            extensions = dict(**extensions, timeout=timeout.as_dict())\n        return Request(\n            method,\n            url,\n            content=content,\n            data=data,\n            files=files,\n            json=json,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            extensions=extensions,\n        )\n\n    def _merge_url(self, url: URL | str) -> URL:\n        \"\"\"\n        Merge a URL argument together with any 'base_url' on the client,\n        to create the URL used for the outgoing request.\n        \"\"\"\n        merge_url = URL(url)\n        if merge_url.is_relative_url:\n            # To merge URLs we always append to the base URL. To get this\n            # behaviour correct we always ensure the base URL ends in a '/'\n            # separator, and strip any leading '/' from the merge URL.\n            #\n            # So, eg...\n            #\n            # >>> client = Client(base_url=\"https://www.example.com/subpath\")\n            # >>> client.base_url\n            # URL('https://www.example.com/subpath/')\n            # >>> client.build_request(\"GET\", \"/path\").url\n            # URL('https://www.example.com/subpath/path')\n            merge_raw_path = self.base_url.raw_path + merge_url.raw_path.lstrip(b\"/\")\n            return self.base_url.copy_with(raw_path=merge_raw_path)\n        return merge_url\n\n    def _merge_cookies(self, cookies: CookieTypes | None = None) -> CookieTypes | None:\n        \"\"\"\n        Merge a cookies argument together with any cookies on the client,\n        to create the cookies used for the outgoing request.\n        \"\"\"\n        if cookies or self.cookies:\n            merged_cookies = Cookies(self.cookies)\n            merged_cookies.update(cookies)\n            return merged_cookies\n        return cookies\n\n    def _merge_headers(self, headers: HeaderTypes | None = None) -> HeaderTypes | None:\n        \"\"\"\n        Merge a headers argument together with any headers on the client,\n        to create the headers used for the outgoing request.\n        \"\"\"\n        merged_headers = Headers(self.headers)\n        merged_headers.update(headers)\n        return merged_headers\n\n    def _merge_queryparams(\n        self, params: QueryParamTypes | None = None\n    ) -> QueryParamTypes | None:\n        \"\"\"\n        Merge a queryparams argument together with any queryparams on the client,\n        to create the queryparams used for the outgoing request.\n        \"\"\"\n        if params or self.params:\n            merged_queryparams = QueryParams(self.params)\n            return merged_queryparams.merge(params)\n        return params\n\n    def _build_auth(self, auth: AuthTypes | None) -> Auth | None:\n        if auth is None:\n            return None\n        elif isinstance(auth, tuple):\n            return BasicAuth(username=auth[0], password=auth[1])\n        elif isinstance(auth, Auth):\n            return auth\n        elif callable(auth):\n            return FunctionAuth(func=auth)\n        else:\n            raise TypeError(f'Invalid \"auth\" argument: {auth!r}')\n\n    def _build_request_auth(\n        self,\n        request: Request,\n        auth: AuthTypes | UseClientDefault | None = USE_CLIENT_DEFAULT,\n    ) -> Auth:\n        auth = (\n            self._auth if isinstance(auth, UseClientDefault) else self._build_auth(auth)\n        )\n\n        if auth is not None:\n            return auth\n\n        username, password = request.url.username, request.url.password\n        if username or password:\n            return BasicAuth(username=username, password=password)\n\n        return Auth()\n\n    def _build_redirect_request(self, request: Request, response: Response) -> Request:\n        \"\"\"\n        Given a request and a redirect response, return a new request that\n        should be used to effect the redirect.\n        \"\"\"\n        method = self._redirect_method(request, response)\n        url = self._redirect_url(request, response)\n        headers = self._redirect_headers(request, url, method)\n        stream = self._redirect_stream(request, method)\n        cookies = Cookies(self.cookies)\n        return Request(\n            method=method,\n            url=url,\n            headers=headers,\n            cookies=cookies,\n            stream=stream,\n            extensions=request.extensions,\n        )\n\n    def _redirect_method(self, request: Request, response: Response) -> str:\n        \"\"\"\n        When being redirected we may want to change the method of the request\n        based on certain specs or browser behavior.\n        \"\"\"\n        method = request.method\n\n        # https://tools.ietf.org/html/rfc7231#section-6.4.4\n        if response.status_code == codes.SEE_OTHER and method != \"HEAD\":\n            method = \"GET\"\n\n        # Do what the browsers do, despite standards...\n        # Turn 302s into GETs.\n        if response.status_code == codes.FOUND and method != \"HEAD\":\n            method = \"GET\"\n\n        # If a POST is responded to with a 301, turn it into a GET.\n        # This bizarre behaviour is explained in 'requests' issue 1704.\n        if response.status_code == codes.MOVED_PERMANENTLY and method == \"POST\":\n            method = \"GET\"\n\n        return method\n\n    def _redirect_url(self, request: Request, response: Response) -> URL:\n        \"\"\"\n        Return the URL for the redirect to follow.\n        \"\"\"\n        location = response.headers[\"Location\"]\n\n        try:\n            url = URL(location)\n        except InvalidURL as exc:\n            raise RemoteProtocolError(\n                f\"Invalid URL in location header: {exc}.\", request=request\n            ) from None\n\n        # Handle malformed 'Location' headers that are \"absolute\" form, have no host.\n        # See: https://github.com/encode/httpx/issues/771\n        if url.scheme and not url.host:\n            url = url.copy_with(host=request.url.host)\n\n        # Facilitate relative 'Location' headers, as allowed by RFC 7231.\n        # (e.g. '/path/to/resource' instead of 'http://domain.tld/path/to/resource')\n        if url.is_relative_url:\n            url = request.url.join(url)\n\n        # Attach previous fragment if needed (RFC 7231 7.1.2)\n        if request.url.fragment and not url.fragment:\n            url = url.copy_with(fragment=request.url.fragment)\n\n        return url\n\n    def _redirect_headers(self, request: Request, url: URL, method: str) -> Headers:\n        \"\"\"\n        Return the headers that should be used for the redirect request.\n        \"\"\"\n        headers = Headers(request.headers)\n\n        if not _same_origin(url, request.url):\n            if not _is_https_redirect(request.url, url):\n                # Strip Authorization headers when responses are redirected\n                # away from the origin. (Except for direct HTTP to HTTPS redirects.)\n                headers.pop(\"Authorization\", None)\n\n            # Update the Host header.\n            headers[\"Host\"] = url.netloc.decode(\"ascii\")\n\n        if method != request.method and method == \"GET\":\n            # If we've switch to a 'GET' request, then strip any headers which\n            # are only relevant to the request body.\n            headers.pop(\"Content-Length\", None)\n            headers.pop(\"Transfer-Encoding\", None)\n\n        # We should use the client cookie store to determine any cookie header,\n        # rather than whatever was on the original outgoing request.\n        headers.pop(\"Cookie\", None)\n\n        return headers\n\n    def _redirect_stream(\n        self, request: Request, method: str\n    ) -> SyncByteStream | AsyncByteStream | None:\n        \"\"\"\n        Return the body that should be used for the redirect request.\n        \"\"\"\n        if method != request.method and method == \"GET\":\n            return None\n\n        return request.stream\n\n    def _set_timeout(self, request: Request) -> None:\n        if \"timeout\" not in request.extensions:\n            timeout = (\n                self.timeout\n                if isinstance(self.timeout, UseClientDefault)\n                else Timeout(self.timeout)\n            )\n            request.extensions = dict(**request.extensions, timeout=timeout.as_dict())\n\n\nclass Client(BaseClient):\n    \"\"\"\n    An HTTP client, with connection pooling, HTTP/2, redirects, cookie persistence, etc.\n\n    It can be shared between threads.\n\n    Usage:\n\n    ```python\n    >>> client = httpx.Client()\n    >>> response = client.get('https://example.org')\n    ```\n\n    **Parameters:**\n\n    * **auth** - *(optional)* An authentication class to use when sending\n    requests.\n    * **params** - *(optional)* Query parameters to include in request URLs, as\n    a string, dictionary, or sequence of two-tuples.\n    * **headers** - *(optional)* Dictionary of HTTP headers to include when\n    sending requests.\n    * **cookies** - *(optional)* Dictionary of Cookie items to include when\n    sending requests.\n    * **verify** - *(optional)* Either `True` to use an SSL context with the\n    default CA bundle, `False` to disable verification, or an instance of\n    `ssl.SSLContext` to use a custom context.\n    * **http2** - *(optional)* A boolean indicating if HTTP/2 support should be\n    enabled. Defaults to `False`.\n    * **proxy** - *(optional)* A proxy URL where all the traffic should be routed.\n    * **timeout** - *(optional)* The timeout configuration to use when sending\n    requests.\n    * **limits** - *(optional)* The limits configuration to use.\n    * **max_redirects** - *(optional)* The maximum number of redirect responses\n    that should be followed.\n    * **base_url** - *(optional)* A URL to use as the base when building\n    request URLs.\n    * **transport** - *(optional)* A transport class to use for sending requests\n    over the network.\n    * **trust_env** - *(optional)* Enables or disables usage of environment\n    variables for configuration.\n    * **default_encoding** - *(optional)* The default encoding to use for decoding\n    response text, if no charset information is included in a response Content-Type\n    header. Set to a callable for automatic character set detection. Default: \"utf-8\".\n    \"\"\"\n\n    def __init__(\n        self,\n        *,\n        auth: AuthTypes | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        verify: ssl.SSLContext | str | bool = True,\n        cert: CertTypes | None = None,\n        trust_env: bool = True,\n        http1: bool = True,\n        http2: bool = False,\n        proxy: ProxyTypes | None = None,\n        mounts: None | (typing.Mapping[str, BaseTransport | None]) = None,\n        timeout: TimeoutTypes = DEFAULT_TIMEOUT_CONFIG,\n        follow_redirects: bool = False,\n        limits: Limits = DEFAULT_LIMITS,\n        max_redirects: int = DEFAULT_MAX_REDIRECTS,\n        event_hooks: None | (typing.Mapping[str, list[EventHook]]) = None,\n        base_url: URL | str = \"\",\n        transport: BaseTransport | None = None,\n        default_encoding: str | typing.Callable[[bytes], str] = \"utf-8\",\n    ) -> None:\n        super().__init__(\n            auth=auth,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            timeout=timeout,\n            follow_redirects=follow_redirects,\n            max_redirects=max_redirects,\n            event_hooks=event_hooks,\n            base_url=base_url,\n            trust_env=trust_env,\n            default_encoding=default_encoding,\n        )\n\n        if http2:\n            try:\n                import h2  # noqa\n            except ImportError:  # pragma: no cover\n                raise ImportError(\n                    \"Using http2=True, but the 'h2' package is not installed. \"\n                    \"Make sure to install httpx using `pip install httpx[http2]`.\"\n                ) from None\n\n        allow_env_proxies = trust_env and transport is None\n        proxy_map = self._get_proxy_map(proxy, allow_env_proxies)\n\n        self._transport = self._init_transport(\n            verify=verify,\n            cert=cert,\n            trust_env=trust_env,\n            http1=http1,\n            http2=http2,\n            limits=limits,\n            transport=transport,\n        )\n        self._mounts: dict[URLPattern, BaseTransport | None] = {\n            URLPattern(key): None\n            if proxy is None\n            else self._init_proxy_transport(\n                proxy,\n                verify=verify,\n                cert=cert,\n                trust_env=trust_env,\n                http1=http1,\n                http2=http2,\n                limits=limits,\n            )\n            for key, proxy in proxy_map.items()\n        }\n        if mounts is not None:\n            self._mounts.update(\n                {URLPattern(key): transport for key, transport in mounts.items()}\n            )\n\n        self._mounts = dict(sorted(self._mounts.items()))\n\n    def _init_transport(\n        self,\n        verify: ssl.SSLContext | str | bool = True,\n        cert: CertTypes | None = None,\n        trust_env: bool = True,\n        http1: bool = True,\n        http2: bool = False,\n        limits: Limits = DEFAULT_LIMITS,\n        transport: BaseTransport | None = None,\n    ) -> BaseTransport:\n        if transport is not None:\n            return transport\n\n        return HTTPTransport(\n            verify=verify,\n            cert=cert,\n            trust_env=trust_env,\n            http1=http1,\n            http2=http2,\n            limits=limits,\n        )\n\n    def _init_proxy_transport(\n        self,\n        proxy: Proxy,\n        verify: ssl.SSLContext | str | bool = True,\n        cert: CertTypes | None = None,\n        trust_env: bool = True,\n        http1: bool = True,\n        http2: bool = False,\n        limits: Limits = DEFAULT_LIMITS,\n    ) -> BaseTransport:\n        return HTTPTransport(\n            verify=verify,\n            cert=cert,\n            trust_env=trust_env,\n            http1=http1,\n            http2=http2,\n            limits=limits,\n            proxy=proxy,\n        )\n\n    def _transport_for_url(self, url: URL) -> BaseTransport:\n        \"\"\"\n        Returns the transport instance that should be used for a given URL.\n        This will either be the standard connection pool, or a proxy.\n        \"\"\"\n        for pattern, transport in self._mounts.items():\n            if pattern.matches(url):\n                return self._transport if transport is None else transport\n\n        return self._transport\n\n    def request(\n        self,\n        method: str,\n        url: URL | str,\n        *,\n        content: RequestContent | None = None,\n        data: RequestData | None = None,\n        files: RequestFiles | None = None,\n        json: typing.Any | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault | None = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Build and send a request.\n\n        Equivalent to:\n\n        ```python\n        request = client.build_request(...)\n        response = client.send(request, ...)\n        ```\n\n        See `Client.build_request()`, `Client.send()` and\n        [Merging of configuration][0] for how the various parameters\n        are merged with client-level configuration.\n\n        [0]: /advanced/clients/#merging-of-configuration\n        \"\"\"\n        if cookies is not None:\n            message = (\n                \"Setting per-request cookies=<...> is being deprecated, because \"\n                \"the expected behaviour on cookie persistence is ambiguous. Set \"\n                \"cookies directly on the client instance instead.\"\n            )\n            warnings.warn(message, DeprecationWarning, stacklevel=2)\n\n        request = self.build_request(\n            method=method,\n            url=url,\n            content=content,\n            data=data,\n            files=files,\n            json=json,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            timeout=timeout,\n            extensions=extensions,\n        )\n        return self.send(request, auth=auth, follow_redirects=follow_redirects)\n\n    @contextmanager\n    def stream(\n        self,\n        method: str,\n        url: URL | str,\n        *,\n        content: RequestContent | None = None,\n        data: RequestData | None = None,\n        files: RequestFiles | None = None,\n        json: typing.Any | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault | None = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> typing.Iterator[Response]:\n        \"\"\"\n        Alternative to `httpx.request()` that streams the response body\n        instead of loading it into memory at once.\n\n        **Parameters**: See `httpx.request`.\n\n        See also: [Streaming Responses][0]\n\n        [0]: /quickstart#streaming-responses\n        \"\"\"\n        request = self.build_request(\n            method=method,\n            url=url,\n            content=content,\n            data=data,\n            files=files,\n            json=json,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            timeout=timeout,\n            extensions=extensions,\n        )\n        response = self.send(\n            request=request,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            stream=True,\n        )\n        try:\n            yield response\n        finally:\n            response.close()\n\n    def send(\n        self,\n        request: Request,\n        *,\n        stream: bool = False,\n        auth: AuthTypes | UseClientDefault | None = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n    ) -> Response:\n        \"\"\"\n        Send a request.\n\n        The request is sent as-is, unmodified.\n\n        Typically you'll want to build one with `Client.build_request()`\n        so that any client-level configuration is merged into the request,\n        but passing an explicit `httpx.Request()` is supported as well.\n\n        See also: [Request instances][0]\n\n        [0]: /advanced/clients/#request-instances\n        \"\"\"\n        if self._state == ClientState.CLOSED:\n            raise RuntimeError(\"Cannot send a request, as the client has been closed.\")\n\n        self._state = ClientState.OPENED\n        follow_redirects = (\n            self.follow_redirects\n            if isinstance(follow_redirects, UseClientDefault)\n            else follow_redirects\n        )\n\n        self._set_timeout(request)\n\n        auth = self._build_request_auth(request, auth)\n\n        response = self._send_handling_auth(\n            request,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            history=[],\n        )\n        try:\n            if not stream:\n                response.read()\n\n            return response\n\n        except BaseException as exc:\n            response.close()\n            raise exc\n\n    def _send_handling_auth(\n        self,\n        request: Request,\n        auth: Auth,\n        follow_redirects: bool,\n        history: list[Response],\n    ) -> Response:\n        auth_flow = auth.sync_auth_flow(request)\n        try:\n            request = next(auth_flow)\n\n            while True:\n                response = self._send_handling_redirects(\n                    request,\n                    follow_redirects=follow_redirects,\n                    history=history,\n                )\n                try:\n                    try:\n                        next_request = auth_flow.send(response)\n                    except StopIteration:\n                        return response\n\n                    response.history = list(history)\n                    response.read()\n                    request = next_request\n                    history.append(response)\n\n                except BaseException as exc:\n                    response.close()\n                    raise exc\n        finally:\n            auth_flow.close()\n\n    def _send_handling_redirects(\n        self,\n        request: Request,\n        follow_redirects: bool,\n        history: list[Response],\n    ) -> Response:\n        while True:\n            if len(history) > self.max_redirects:\n                raise TooManyRedirects(\n                    \"Exceeded maximum allowed redirects.\", request=request\n                )\n\n            for hook in self._event_hooks[\"request\"]:\n                hook(request)\n\n            response = self._send_single_request(request)\n            try:\n                for hook in self._event_hooks[\"response\"]:\n                    hook(response)\n                response.history = list(history)\n\n                if not response.has_redirect_location:\n                    return response\n\n                request = self._build_redirect_request(request, response)\n                history = history + [response]\n\n                if follow_redirects:\n                    response.read()\n                else:\n                    response.next_request = request\n                    return response\n\n            except BaseException as exc:\n                response.close()\n                raise exc\n\n    def _send_single_request(self, request: Request) -> Response:\n        \"\"\"\n        Sends a single request, without handling any redirections.\n        \"\"\"\n        transport = self._transport_for_url(request.url)\n        start = time.perf_counter()\n\n        if not isinstance(request.stream, SyncByteStream):\n            raise RuntimeError(\n                \"Attempted to send an async request with a sync Client instance.\"\n            )\n\n        with request_context(request=request):\n            response = transport.handle_request(request)\n\n        assert isinstance(response.stream, SyncByteStream)\n\n        response.request = request\n        response.stream = BoundSyncStream(\n            response.stream, response=response, start=start\n        )\n        self.cookies.extract_cookies(response)\n        response.default_encoding = self._default_encoding\n\n        logger.info(\n            'HTTP Request: %s %s \"%s %d %s\"',\n            request.method,\n            request.url,\n            response.http_version,\n            response.status_code,\n            response.reason_phrase,\n        )\n\n        return response\n\n    def get(\n        self,\n        url: URL | str,\n        *,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault | None = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Send a `GET` request.\n\n        **Parameters**: See `httpx.request`.\n        \"\"\"\n        return self.request(\n            \"GET\",\n            url,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            timeout=timeout,\n            extensions=extensions,\n        )\n\n    def options(\n        self,\n        url: URL | str,\n        *,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Send an `OPTIONS` request.\n\n        **Parameters**: See `httpx.request`.\n        \"\"\"\n        return self.request(\n            \"OPTIONS\",\n            url,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            timeout=timeout,\n            extensions=extensions,\n        )\n\n    def head(\n        self,\n        url: URL | str,\n        *,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Send a `HEAD` request.\n\n        **Parameters**: See `httpx.request`.\n        \"\"\"\n        return self.request(\n            \"HEAD\",\n            url,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            timeout=timeout,\n            extensions=extensions,\n        )\n\n    def post(\n        self,\n        url: URL | str,\n        *,\n        content: RequestContent | None = None,\n        data: RequestData | None = None,\n        files: RequestFiles | None = None,\n        json: typing.Any | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Send a `POST` request.\n\n        **Parameters**: See `httpx.request`.\n        \"\"\"\n        return self.request(\n            \"POST\",\n            url,\n            content=content,\n            data=data,\n            files=files,\n            json=json,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            timeout=timeout,\n            extensions=extensions,\n        )\n\n    def put(\n        self,\n        url: URL | str,\n        *,\n        content: RequestContent | None = None,\n        data: RequestData | None = None,\n        files: RequestFiles | None = None,\n        json: typing.Any | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Send a `PUT` request.\n\n        **Parameters**: See `httpx.request`.\n        \"\"\"\n        return self.request(\n            \"PUT\",\n            url,\n            content=content,\n            data=data,\n            files=files,\n            json=json,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            timeout=timeout,\n            extensions=extensions,\n        )\n\n    def patch(\n        self,\n        url: URL | str,\n        *,\n        content: RequestContent | None = None,\n        data: RequestData | None = None,\n        files: RequestFiles | None = None,\n        json: typing.Any | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Send a `PATCH` request.\n\n        **Parameters**: See `httpx.request`.\n        \"\"\"\n        return self.request(\n            \"PATCH\",\n            url,\n            content=content,\n            data=data,\n            files=files,\n            json=json,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            timeout=timeout,\n            extensions=extensions,\n        )\n\n    def delete(\n        self,\n        url: URL | str,\n        *,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Send a `DELETE` request.\n\n        **Parameters**: See `httpx.request`.\n        \"\"\"\n        return self.request(\n            \"DELETE\",\n            url,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            timeout=timeout,\n            extensions=extensions,\n        )\n\n    def close(self) -> None:\n        \"\"\"\n        Close transport and proxies.\n        \"\"\"\n        if self._state != ClientState.CLOSED:\n            self._state = ClientState.CLOSED\n\n            self._transport.close()\n            for transport in self._mounts.values():\n                if transport is not None:\n                    transport.close()\n\n    def __enter__(self: T) -> T:\n        if self._state != ClientState.UNOPENED:\n            msg = {\n                ClientState.OPENED: \"Cannot open a client instance more than once.\",\n                ClientState.CLOSED: (\n                    \"Cannot reopen a client instance, once it has been closed.\"\n                ),\n            }[self._state]\n            raise RuntimeError(msg)\n\n        self._state = ClientState.OPENED\n\n        self._transport.__enter__()\n        for transport in self._mounts.values():\n            if transport is not None:\n                transport.__enter__()\n        return self\n\n    def __exit__(\n        self,\n        exc_type: type[BaseException] | None = None,\n        exc_value: BaseException | None = None,\n        traceback: TracebackType | None = None,\n    ) -> None:\n        self._state = ClientState.CLOSED\n\n        self._transport.__exit__(exc_type, exc_value, traceback)\n        for transport in self._mounts.values():\n            if transport is not None:\n                transport.__exit__(exc_type, exc_value, traceback)\n\n\nclass AsyncClient(BaseClient):\n    \"\"\"\n    An asynchronous HTTP client, with connection pooling, HTTP/2, redirects,\n    cookie persistence, etc.\n\n    It can be shared between tasks.\n\n    Usage:\n\n    ```python\n    >>> async with httpx.AsyncClient() as client:\n    >>>     response = await client.get('https://example.org')\n    ```\n\n    **Parameters:**\n\n    * **auth** - *(optional)* An authentication class to use when sending\n    requests.\n    * **params** - *(optional)* Query parameters to include in request URLs, as\n    a string, dictionary, or sequence of two-tuples.\n    * **headers** - *(optional)* Dictionary of HTTP headers to include when\n    sending requests.\n    * **cookies** - *(optional)* Dictionary of Cookie items to include when\n    sending requests.\n    * **verify** - *(optional)* Either `True` to use an SSL context with the\n    default CA bundle, `False` to disable verification, or an instance of\n    `ssl.SSLContext` to use a custom context.\n    * **http2** - *(optional)* A boolean indicating if HTTP/2 support should be\n    enabled. Defaults to `False`.\n    * **proxy** - *(optional)* A proxy URL where all the traffic should be routed.\n    * **timeout** - *(optional)* The timeout configuration to use when sending\n    requests.\n    * **limits** - *(optional)* The limits configuration to use.\n    * **max_redirects** - *(optional)* The maximum number of redirect responses\n    that should be followed.\n    * **base_url** - *(optional)* A URL to use as the base when building\n    request URLs.\n    * **transport** - *(optional)* A transport class to use for sending requests\n    over the network.\n    * **trust_env** - *(optional)* Enables or disables usage of environment\n    variables for configuration.\n    * **default_encoding** - *(optional)* The default encoding to use for decoding\n    response text, if no charset information is included in a response Content-Type\n    header. Set to a callable for automatic character set detection. Default: \"utf-8\".\n    \"\"\"\n\n    def __init__(\n        self,\n        *,\n        auth: AuthTypes | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        verify: ssl.SSLContext | str | bool = True,\n        cert: CertTypes | None = None,\n        http1: bool = True,\n        http2: bool = False,\n        proxy: ProxyTypes | None = None,\n        mounts: None | (typing.Mapping[str, AsyncBaseTransport | None]) = None,\n        timeout: TimeoutTypes = DEFAULT_TIMEOUT_CONFIG,\n        follow_redirects: bool = False,\n        limits: Limits = DEFAULT_LIMITS,\n        max_redirects: int = DEFAULT_MAX_REDIRECTS,\n        event_hooks: None | (typing.Mapping[str, list[EventHook]]) = None,\n        base_url: URL | str = \"\",\n        transport: AsyncBaseTransport | None = None,\n        trust_env: bool = True,\n        default_encoding: str | typing.Callable[[bytes], str] = \"utf-8\",\n    ) -> None:\n        super().__init__(\n            auth=auth,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            timeout=timeout,\n            follow_redirects=follow_redirects,\n            max_redirects=max_redirects,\n            event_hooks=event_hooks,\n            base_url=base_url,\n            trust_env=trust_env,\n            default_encoding=default_encoding,\n        )\n\n        if http2:\n            try:\n                import h2  # noqa\n            except ImportError:  # pragma: no cover\n                raise ImportError(\n                    \"Using http2=True, but the 'h2' package is not installed. \"\n                    \"Make sure to install httpx using `pip install httpx[http2]`.\"\n                ) from None\n\n        allow_env_proxies = trust_env and transport is None\n        proxy_map = self._get_proxy_map(proxy, allow_env_proxies)\n\n        self._transport = self._init_transport(\n            verify=verify,\n            cert=cert,\n            trust_env=trust_env,\n            http1=http1,\n            http2=http2,\n            limits=limits,\n            transport=transport,\n        )\n\n        self._mounts: dict[URLPattern, AsyncBaseTransport | None] = {\n            URLPattern(key): None\n            if proxy is None\n            else self._init_proxy_transport(\n                proxy,\n                verify=verify,\n                cert=cert,\n                trust_env=trust_env,\n                http1=http1,\n                http2=http2,\n                limits=limits,\n            )\n            for key, proxy in proxy_map.items()\n        }\n        if mounts is not None:\n            self._mounts.update(\n                {URLPattern(key): transport for key, transport in mounts.items()}\n            )\n        self._mounts = dict(sorted(self._mounts.items()))\n\n    def _init_transport(\n        self,\n        verify: ssl.SSLContext | str | bool = True,\n        cert: CertTypes | None = None,\n        trust_env: bool = True,\n        http1: bool = True,\n        http2: bool = False,\n        limits: Limits = DEFAULT_LIMITS,\n        transport: AsyncBaseTransport | None = None,\n    ) -> AsyncBaseTransport:\n        if transport is not None:\n            return transport\n\n        return AsyncHTTPTransport(\n            verify=verify,\n            cert=cert,\n            trust_env=trust_env,\n            http1=http1,\n            http2=http2,\n            limits=limits,\n        )\n\n    def _init_proxy_transport(\n        self,\n        proxy: Proxy,\n        verify: ssl.SSLContext | str | bool = True,\n        cert: CertTypes | None = None,\n        trust_env: bool = True,\n        http1: bool = True,\n        http2: bool = False,\n        limits: Limits = DEFAULT_LIMITS,\n    ) -> AsyncBaseTransport:\n        return AsyncHTTPTransport(\n            verify=verify,\n            cert=cert,\n            trust_env=trust_env,\n            http1=http1,\n            http2=http2,\n            limits=limits,\n            proxy=proxy,\n        )\n\n    def _transport_for_url(self, url: URL) -> AsyncBaseTransport:\n        \"\"\"\n        Returns the transport instance that should be used for a given URL.\n        This will either be the standard connection pool, or a proxy.\n        \"\"\"\n        for pattern, transport in self._mounts.items():\n            if pattern.matches(url):\n                return self._transport if transport is None else transport\n\n        return self._transport\n\n    async def request(\n        self,\n        method: str,\n        url: URL | str,\n        *,\n        content: RequestContent | None = None,\n        data: RequestData | None = None,\n        files: RequestFiles | None = None,\n        json: typing.Any | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault | None = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> Response:\n        \"\"\"\n        Build and send a request.\n\n        Equivalent to:\n\n        ```python\n        request = client.build_request(...)\n        response = await client.send(request, ...)\n        ```\n\n        See `AsyncClient.build_request()`, `AsyncClient.send()`\n        and [Merging of configuration][0] for how the various parameters\n        are merged with client-level configuration.\n\n        [0]: /advanced/clients/#merging-of-configuration\n        \"\"\"\n\n        if cookies is not None:  # pragma: no cover\n            message = (\n                \"Setting per-request cookies=<...> is being deprecated, because \"\n                \"the expected behaviour on cookie persistence is ambiguous. Set \"\n                \"cookies directly on the client instance instead.\"\n            )\n            warnings.warn(message, DeprecationWarning, stacklevel=2)\n\n        request = self.build_request(\n            method=method,\n            url=url,\n            content=content,\n            data=data,\n            files=files,\n            json=json,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            timeout=timeout,\n            extensions=extensions,\n        )\n        return await self.send(request, auth=auth, follow_redirects=follow_redirects)\n\n    @asynccontextmanager\n    async def stream(\n        self,\n        method: str,\n        url: URL | str,\n        *,\n        content: RequestContent | None = None,\n        data: RequestData | None = None,\n        files: RequestFiles | None = None,\n        json: typing.Any | None = None,\n        params: QueryParamTypes | None = None,\n        headers: HeaderTypes | None = None,\n        cookies: CookieTypes | None = None,\n        auth: AuthTypes | UseClientDefault | None = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n        timeout: TimeoutTypes | UseClientDefault = USE_CLIENT_DEFAULT,\n        extensions: RequestExtensions | None = None,\n    ) -> typing.AsyncIterator[Response]:\n        \"\"\"\n        Alternative to `httpx.request()` that streams the response body\n        instead of loading it into memory at once.\n\n        **Parameters**: See `httpx.request`.\n\n        See also: [Streaming Responses][0]\n\n        [0]: /quickstart#streaming-responses\n        \"\"\"\n        request = self.build_request(\n            method=method,\n            url=url,\n            content=content,\n            data=data,\n            files=files,\n            json=json,\n            params=params,\n            headers=headers,\n            cookies=cookies,\n            timeout=timeout,\n            extensions=extensions,\n        )\n        response = await self.send(\n            request=request,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            stream=True,\n        )\n        try:\n            yield response\n        finally:\n            await response.aclose()\n\n    async def send(\n        self,\n        request: Request,\n        *,\n        stream: bool = False,\n        auth: AuthTypes | UseClientDefault | None = USE_CLIENT_DEFAULT,\n        follow_redirects: bool | UseClientDefault = USE_CLIENT_DEFAULT,\n    ) -> Response:\n        \"\"\"\n        Send a request.\n\n        The request is sent as-is, unmodified.\n\n        Typically you'll want to build one with `AsyncClient.build_request()`\n        so that any client-level configuration is merged into the request,\n        but passing an explicit `httpx.Request()` is supported as well.\n\n        See also: [Request instances][0]\n\n        [0]: /advanced/clients/#request-instances\n        \"\"\"\n        if self._state == ClientState.CLOSED:\n            raise RuntimeError(\"Cannot send a request, as the client has been closed.\")\n\n        self._state = ClientState.OPENED\n        follow_redirects = (\n            self.follow_redirects\n            if isinstance(follow_redirects, UseClientDefault)\n            else follow_redirects\n        )\n\n        self._set_timeout(request)\n\n        auth = self._build_request_auth(request, auth)\n\n        response = await self._send_handling_auth(\n            request,\n            auth=auth,\n            follow_redirects=follow_redirects,\n            history=[],\n        )\n        try:\n            if not stream:\n                await response.aread()\n\n            return response\n\n        except BaseException as exc:\n            await response.aclose()\n            raise exc\n\n    async def _send_handling_auth(\n        self,\n        request: Request,\n        auth: Auth,\n        follow_redirects: bool,\n        history: list[Response],\n    ) -> Response:\n        auth_flow = auth.async_auth_flow(request)\n        try:\n            request = await auth_flow.__anext__()\n\n            while True:\n                response = await self._send_handling_redirects(\n                    request,\n                    follow_redirects=follow_redirects,\n                    history=history,\n                )\n                try:\n                    try:\n                        next_request = await auth_flow.asend(response)\n                    except StopAsyncIteration:\n                        return response\n\n                    response.history = list(history)\n                    await response.aread()\n                    request = next_request\n                    history.append(response)\n\n                except BaseException as exc:\n                    await response.aclose()\n                    raise exc\n        finally:\n            await auth_flow.aclose()\n\n    async def _send_handling_redirects(\n        self,\n        request: Request,\n        follow_redirects: bool,\n        history: list[Response],\n e  # pragma: no cover\n\n__all__ = [\n    \"CloseError\",\n    \"ConnectError\",\n    \"ConnectTimeout\",\n    \"CookieConflict\",\n    \"DecodingError\",\n    \"HTTPError\",\n    \"HTTPStatusError\",\n    \"InvalidURL\",\n    \"LocalProtocolError\",\n    \"NetworkError\",\n    \"PoolTimeout\",\n    \"ProtocolError\",\n    \"ProxyError\",\n    \"ReadError\",\n    \"ReadTimeout\",\n    \"RemoteProtocolError\",\n    \"RequestError\",\n    \"RequestNotRead\",\n    \"ResponseNotRead\",\n    \"StreamClosed\",\n    \"StreamConsumed\",\n    \"StreamError\",\n    \"TimeoutException\",\n    \"TooManyRedirects\",\n    \"TransportError\",\n    \"UnsupportedProtocol\",\n    \"WriteError\",\n    \"WriteTimeout\",\n]\n\n\nclass HTTPError(Exception):\n    \"\"\"\n    Base class for `RequestError` and `HTTPStatusError`.\n\n    Useful for `try...except` blocks when issuing a request,\n    and then calling `.raise_for_status()`.\n\n    For example:\n\n    ```\n    try:\n        response = httpx.get(\"https://www.example.com\")\n        response.raise_for_status()\n    except httpx.HTTPError as exc:\n        print(f\"HTTP Exception for {exc.request.url} - {exc}\")\n    ```\n    \"\"\"\n\n    def __init__(self, message: str) -> None:\n        super().__init__(message)\n        self._request: Request | None = None\n\n    @property\n    def request(self) -> Request:\n        if self._request is None:\n            raise RuntimeError(\"The .request property has not been set.\")\n        return self._request\n\n    @request.setter\n    def request(self, request: Request) -> None:\n        self._request = request\n\n\nclass RequestError(HTTPError):\n    \"\"\"\n    Base class for all exceptions that may occur when issuing a `.request()`.\n    \"\"\"\n\n    def __init__(self, message: str, *, request: Request | None = None) -> None:\n        super().__init__(message)\n        # At the point an exception is raised we won't typically have a request\n        # instance to associate it with.\n uture__ import annotations\n\nimport io\nimport itertools\nimport sys\nimport typing\n\nfrom .._models import Request, Response\nfrom .._types import SyncByteStream\nfrom .base import BaseTransport\n\nif typing.TYPE_CHECKING:\n    from _typeshed import OptExcInfo  # pragma: no cover\n    from _typeshed.wsgi import WSGIApplication  # pragma: no cover\n\n_T = typing.TypeVar(\"_T\")\n\n\n__all__ = [\"WSGITransport\"]\n\n\ndef _skip_leading_empty_chunks(body: typing.Iterable[_T]) -> typing.Iterable[_T]:\n    body = iter(body)\n    for chunk in body:\n        if chunk:\n            return itertools.chain([chunk], body)\n    return []\n\n\nclass WSGIByteStream(SyncByteStream):\n    def __init__(self, result: typing.Iterable[bytes]) -> None:\n        self._close = getattr(result, \"close\", None)\n        self._result = _skip_leading_empty_chunks(result)\n\n    def __iter__(self) -> typing.Iterator[bytes]:\n        for part in self._result:\n            yield part\n\n    def close(self) -> None:\n        if self._close is not None:\n            self._close()\n\n\nclass WSGITransport(BaseTransport):\n    \"\"\"\n    A custom transport that handles sending requests directly to an WSGI app.\n    The simplest way to use this functionality is to use the `app` argument.\n\n    ```\n    client = httpx.Client(app=app)\n    ```\n\n    Alternatively, you can setup the transport instance explicitly.\n    This allows you to include any additional configuration arguments specific\n    to the WSGITransport class:\n\n    ```\n    transport = httpx.WSGITransport(\n        app=app,\n        script_name=\"/submount\",\n        remote_addr=\"1.2.3.4\"\n    )\n    client = httpx.Client(transport=transport)\n    ```\n\n    Arguments:\n\n    * `app` - The WSGI application.\n    * `raise_app_exceptions` - Boolean indicating if exceptions in the application\n       should be raised. Default to `True`. Can be set to `False` for use cases\n       such as testing the content of a client 500 response seen_exc_info = None\n\n        def start_response(\n            status: str,\n            response_headers: list[tuple[str, str]],\n            exc_info: OptExcInfo | None = None,\n        ) -> typing.Callable[[bytes], typing.Any]:\n            nonlocal seen_status, seen_response_headers, seen_exc_info\n            seen_status = status\n            seen_response_headers = response_headers\n            seen_exc_info = exc_info\n            return lambda _: None\n\n        result = self.app(environ, start_response)\n\n        stream = WSGIByteStream(result)\n\n        assert seen_status is not None\n        assert seen_response_headers is not None\n        if seen_exc_info and seen_exc_info[0] and self.raise_app_exceptions:\n            raise seen_exc_info[1]\n\n        status_code = int(seen_status.split()[0])\n        headers = [\n            (key.encode(\"ascii\"), value.encode(\"ascii\"))\n            for key, value in seen_response_headers\n        ]\n\n        return Response(status_code, headers=headers, stream=stream)\n", "httpx/_urlparse.py": "\"\"\"\nAn implementation of `urlparse` that provides URL validation and normalization\nas described by RFC3986.\n\nWe rely on this implementation rather than the one in Python's stdlib, because:\n\n* It provides more complete URL validation.\n* It properly differentiates between an empty querystring and an absent querystring,\n  to distinguish URLs with a trailing '?'.\n* It handles scheme, hostname, port, and path normalization.\n* It supports IDNA hostnames, normalizing them to their encoded form.\n* The API supports passing individual components, as well as the complete URL string.\n\nPreviously we relied on the excellent `rfc3986` package to handle URL parsing and\nvalidation, but this module provides a simpler alternative, with less indirection\nrequired.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport ipaddress\nimport re\nimport typing\n\nimport idna\n\nfrom ._exceptions import InvalidURL\n\nMAX_URL_LENGTH = 65536\n\n# https://datatracker.ietf.org/doc/html/rfc3986.html#section-2.3\nUNRESERVED_CHARACTERS = (\n    \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~\"\n)\nSUB_DELIMS = \"!$&'()*+,;=\"\n\nPERCENT_ENCODED_REGEX = re.compile(\"%[A-Fa-f0-9]{2}\")\n\n# https://url.spec.whatwg.org/#percent-encoded-bytes\n\n# The fragment percent-encode set is the C0 control percent-encode set\n# and U+0020 SPACE, U+0022 (\"), U+003C (<), U+003E (>), and U+0060 (`).\nFRAG_SAFE = \"\".join(\n    [chr(i) for i in range(0x20, 0x7F) if i not in (0x20, 0x22, 0x3C, 0x3E, 0x60)]\n)\n\n# The query percent-encode set is the C0 control percent-encode set\n# and U+0020 SPACE, U+0022 (\"), U+0023 (#), U+003C (<), and U+003E (>).\nQUERY_SAFE = \"\".join(\n    [chr(i) for i in range(0x20, 0x7F) if i not in (0x20, 0x22, 0x23, 0x3C, 0x3E)]\n)\n\n# The path percent-encode set is the query percent-encode set\n# and U+003F (?), U+0060 (`), U+007B ({), and U+007D (}).\nPATH_SAFE = \"\".join(\n    [\n        chr(i)\n        for i in range(0x20, 0x7F)\n        if i not in (0x20, 0x22, 0x23, 0x3C, 0x3E) + (0x3F, 0x60, 0x7B, 0x7D)\n    ]\n)\n\n# The userinfo percent-encode set is the path percent-encode set\n# and U+002F (/), U+003A (:), U+003B (;), U+003D (=), U+0040 (@),\n# U+005B ([) to U+005E (^), inclusive, and U+007C (|).\nUSERNAME_SAFE = \"\".join(\n    [\n        chr(i)\n        for i in range(0x20, 0x7F)\n        if i\n        not in (0x20, 0x22, 0x23, 0x3C, 0x3E)\n        + (0x3F, 0x60, 0x7B, 0x7D)\n        + (0x2F, 0x3A, 0x3B, 0x3D, 0x40, 0x5B, 0x5C, 0x5D, 0x5E, 0x7C)\n    ]\n)\nPASSWORD_SAFE = \"\".join(\n    [\n        chr(i)\n        for i in range(0x20, 0x7F)\n        if i\n        not in (0x20, 0x22, 0x23, 0x3C, 0x3E)\n        + (0x3F, 0x60, 0x7B, 0x7D)\n        + (0x2F, 0x3A, 0x3B, 0x3D, 0x40, 0x5B, 0x5C, 0x5D, 0x5E, 0x7C)\n    ]\n)\n# Note... The terminology 'userinfo' percent-encode set in the WHATWG document\n# is used for the username and password quoting. For the joint userinfo component\n# we remove U+003A (:) from the safe set.\nUSERINFO_SAFE = \"\".join(\n    [\n        chr(i)\n        for i in range(0x20, 0x7F)\n        if i\n        not in (0x20, 0x22, 0x23, 0x3C, 0x3E)\n        + (0x3F, 0x60, 0x7B, 0x7D)\n        + (0x2F, 0x3B, 0x3D, 0x40, 0x5B, 0x5C, 0x5D, 0x5E, 0x7C)\n    ]\n)\n\n\n# {scheme}:      (optional)\n# //{authority}  (optional)\n# {path}\n# ?{query}       (optional)\n# #{fragment}    (optional)\nURL_REGEX = re.compile(\n    (\n        r\"(?:(?P<scheme>{scheme}):)?\"\n        r\"(?://(?P<authority>{authority}))?\"\n        r\"(?P<path>{path})\"\n        r\"(?:\\?(?P<query>{query}))?\"\n        r\"(?:#(?P<fragment>{fragment}))?\"\n    ).format(\n        scheme=\"([a-zA-Z][a-zA-Z0-9+.-]*)?\",\n        authority=\"[^/?#]*\",\n        path=\"[^?#]*\",\n        query=\"[^#]*\",\n        fragment=\".*\",\n    )\n)\n\n# {userinfo}@    (optional)\n# {host}\n# :{port}        (optional)\nAUTHORITY_REGEX = re.compile(\n    (\n        r\"(?:(?P<userinfo>{userinfo})@)?\" r\"(?P<host>{host})\" r\":?(?P<port>{port})?\"\n    ).format(\n        userinfo=\".*\",  # Any character sequence.\n        host=\"(\\\\[.*\\\\]|[^:@]*)\",  # Either any character sequence excluding ':' or '@',\n        # or an IPv6 address enclosed within square brackets.\n        port=\".*\",  # Any character sequence.\n    )\n)\n\n\n# If we call urlparse with an individual component, then we need to regex\n# validate that component individually.\n# Note that we're duplicating the same strings as above. Shock! Horror!!\nCOMPONENT_REGEX = {\n    \"scheme\": re.compile(\"([a-zA-Z][a-zA-Z0-9+.-]*)?\"),\n    \"authority\": re.compile(\"[^/?#]*\"),\n    \"path\": re.compile(\"[^?#]*\"),\n    \"query\": re.compile(\"[^#]*\"),\n    \"fragment\": re.compile(\".*\"),\n    \"userinfo\": re.compile(\"[^@]*\"),\n    \"host\": re.compile(\"(\\\\[.*\\\\]|[^:]*)\"),\n    \"port\": re.compile(\".*\"),\n}\n\n\n# We use these simple regexs as a first pass before handing off to\n# the stdlib 'ipaddress' module for IP address validation.\nIPv4_STYLE_HOSTNAME = re.compile(r\"^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$\")\nIPv6_STYLE_HOSTNAME = re.compile(r\"^\\[.*\\]$\")\n\n\nclass ParseResult(typing.NamedTuple):\n    scheme: str\n    userinfo: str\n    host: str\n    port: int | None\n    path: str\n    query: str | None\n    fragment: str | None\n\n    @property\n    def authority(self) -> str:\n        return \"\".join(\n            [\n                f\"{self.userinfo}@\" if self.userinfo else \"\",\n                f\"[{self.host}]\" if \":\" in self.host else self.host,\n                f\":{self.port}\" if self.port is not None else \"\",\n            ]\n        )\n\n    @property\n    def netloc(self) -> str:\n        return \"\".join(\n            [\n                f\"[{self.host}]\" if \":\" in self.host else self.host,\n                f\":{self.port}\" if self.port is not None else \"\",\n            ]\n        )\n\n    def copy_with(self, **kwargs: str | None) -> ParseResult:\n        if not kwargs:\n            return self\n\n        defaults = {\n            \"scheme\": self.scheme,\n            \"authority\": self.authority,\n            \"path\": self.path,\n            \"query\": self.query,\n            \"fragment\": self.fragment,\n        }\n        defaults.update(kwargs)\n        return urlparse(\"\", **defaults)\n\n    def __str__(self) -> str:\n        authority = self.authority\n        return \"\".join(\n            [\n                f\"{self.scheme}:\" if self.scheme else \"\",\n                f\"//{authority}\" if authority else \"\",\n                self.path,\n                f\"?{self.query}\" if self.query is not None else \"\",\n                f\"#{self.fragment}\" if self.fragment is not None else \"\",\n            ]\n        )\n\n\ndef urlparse(url: str = \"\", **kwargs: str | None) -> ParseResult:\n    # Initial basic checks on allowable URLs.\n    # ---------------------------------------\n\n    # Hard limit the maximum allowable URL length.\n    if len(url) > MAX_URL_LENGTH:\n        raise InvalidURL(\"URL too long\")\n\n    # If a URL includes any ASCII control characters including \\t, \\r, \\n,\n    # then treat it as invalid.\n    if any(char.isascii() and not char.isprintable() for char in url):\n        char = next(char for char in url if char.isascii() and not char.isprintable())\n        idx = url.find(char)\n        error = (\n            f\"Invalid non-printable ASCII character in URL, {char!r} at position {idx}.\"\n        )\n        raise InvalidURL(error)\n\n    # Some keyword arguments require special handling.\n    # ------------------------------------------------\n\n    # Coerce \"port\" to a string, if it is provided as an integer.\n    if \"port\" in kwargs:\n        port = kwargs[\"port\"]\n        kwargs[\"port\"] = str(port) if isinstance(port, int) else port\n\n    # Replace \"netloc\" with \"host and \"port\".\n    if \"netloc\" in kwargs:\n        netloc = kwargs.pop(\"netloc\") or \"\"\n        kwargs[\"host\"], _, kwargs[\"port\"] = netloc.partition(\":\")\n\n    # Replace \"username\" and/or \"password\" with \"userinfo\".\n    if \"username\" in kwargs or \"password\" in kwargs:\n        username = quote(kwargs.pop(\"username\", \"\") or \"\", safe=USERNAME_SAFE)\n        password = quote(kwargs.pop(\"password\", \"\") or \"\", safe=PASSWORD_SAFE)\n        kwargs[\"userinfo\"] = f\"{username}:{password}\" if password else username\n\n    # Replace \"raw_path\" with \"path\" and \"query\".\n    if \"raw_path\" in kwargs:\n        raw_path = kwargs.pop(\"raw_path\") or \"\"\n        kwargs[\"path\"], seperator, kwargs[\"query\"] = raw_path.partition(\"?\")\n        if not seperator:\n            kwargs[\"query\"] = None\n\n    # Ensure that IPv6 \"host\" addresses are always escaped with \"[...]\".\n    if \"host\" in kwargs:\n        host = kwargs.get(\"host\") or \"\"\n        if \":\" in host and not (host.startswith(\"[\") and host.endswith(\"]\")):\n            kwargs[\"host\"] = f\"[{host}]\"\n\n    # If any keyword arguments are provided, ensure they are valid.\n    # -------------------------------------------------------------\n\n    for key, value in kwargs.items():\n        if value is not None:\n            if len(value) > MAX_URL_LENGTH:\n                raise InvalidURL(f\"URL component '{key}' too long\")\n\n            # If a component includes any ASCII control characters including \\t, \\r, \\n,\n            # then treat it as invalid.\n            if any(char.isascii() and not char.isprintable() for char in value):\n                char = next(\n                    char for char in value if char.isascii() and not char.isprintable()\n                )\n                idx = value.find(char)\n                error = (\n                    f\"Invalid non-printable ASCII character in URL {key} component, \"\n                    f\"{char!r} at position {idx}.\"\n                )\n                raise InvalidURL(error)\n\n            # Ensure that keyword arguments match as a valid regex.\n            if not COMPONENT_REGEX[key].fullmatch(value):\n                raise InvalidURL(f\"Invalid URL component '{key}'\")\n\n    # The URL_REGEX will always match, but may have empty components.\n    url_match = URL_REGEX.match(url)\n    assert url_match is not None\n    url_dict = url_match.groupdict()\n\n    # * 'scheme', 'authority', and 'path' may be empty strings.\n    # * 'query' may be 'None', indicating no trailing \"?\" portion.\n    #   Any string including the empty string, indicates a trailing \"?\".\n    # * 'fragment' may be 'None', indicating no trailing \"#\" portion.\n    #   Any string including the empty string, indicates a trailing \"#\".\n    scheme = kwargs.get(\"scheme\", url_dict[\"scheme\"]) or \"\"\n    authority = kwargs.get(\"authority\", url_dict[\"authority\"]) or \"\"\n    path = kwargs.get(\"path\", url_dict[\"path\"]) or \"\"\n    query = kwargs.get(\"query\", url_dict[\"query\"])\n    frag = kwargs.get(\"fragment\", url_dict[\"fragment\"])\n\n    # The AUTHORITY_REGEX will always match, but may have empty components.\n    authority_match = AUTHORITY_REGEX.match(authority)\n    assert authority_match is not None\n    authority_dict = authority_match.groupdict()\n\n    # * 'userinfo' and 'host' may be empty strings.\n    # * 'port' may be 'None'.\n    userinfo = kwargs.get(\"userinfo\", authority_dict[\"userinfo\"]) or \"\"\n    host = kwargs.get(\"host\", authority_dict[\"host\"]) or \"\"\n    port = kwargs.get(\"port\", authority_dict[\"port\"])\n\n    # Normalize and validate each component.\n    # We end up with a parsed representation of the URL,\n    # with components that are plain ASCII bytestrings.\n    parsed_scheme: str = scheme.lower()\n    parsed_userinfo: str = quote(userinfo, safe=USERINFO_SAFE)\n    parsed_host: str = encode_host(host)\n    parsed_port: int | None = normalize_port(port, scheme)\n\n    has_scheme = parsed_scheme != \"\"\n    has_authority = (\n        parsed_userinfo != \"\" or parsed_host != \"\" or parsed_port is not None\n    )\n    validate_path(path, has_scheme=has_scheme, has_authority=has_authority)\n    if has_scheme or has_authority:\n        path = normalize_path(path)\n\n    parsed_path: str = quote(path, safe=PATH_SAFE)\n    parsed_query: str | None = None if query is None else quote(query, safe=QUERY_SAFE)\n    parsed_frag: str | None = None if frag is None else quote(frag, safe=FRAG_SAFE)\n\n    # The parsed ASCII bytestrings are our canonical form.\n    # All properties of the URL are derived from these.\n    return ParseResult(\n        parsed_scheme,\n        parsed_userinfo,\n        parsed_host,\n        parsed_port,\n        parsed_path,\n        parsed_query,\n        parsed_frag,\n    )\n\n\ndef encode_host(host: str) -> str:\n    if not host:\n        return \"\"\n\n    elif IPv4_STYLE_HOSTNAME.match(host):\n        # Validate IPv4 hostnames like #.#.#.#\n        #\n        # From https://datatracker.ietf.org/doc/html/rfc3986/#section-3.2.2\n        #\n        # IPv4address = dec-octet \".\" dec-octet \".\" dec-octet \".\" dec-octet\n        try:\n            ipaddress.IPv4Address(host)\n        except ipaddress.AddressValueError:\n            raise InvalidURL(f\"Invalid IPv4 address: {host!r}\")\n        return host\n\n    elif IPv6_STYLE_HOSTNAME.match(host):\n        # Validate IPv6 hostnames like [...]\n        #\n        # From https://datatracker.ietf.org/doc/html/rfc3986/#section-3.2.2\n        #\n        # \"A host identified by an Internet Protocol literal address, version 6\n        # [RFC3513] or later, is distinguished by enclosing the IP literal\n        # within square brackets (\"[\" and \"]\").  This is the only place where\n        # square bracket characters are allowed in the URI syntax.\"\n        try:\n            ipaddress.IPv6Address(host[1:-1])\n        except ipaddress.AddressValueError:\n            raise InvalidURL(f\"Invalid IPv6 address: {host!r}\")\n        return host[1:-1]\n\n    elif host.isascii():\n        # Regular ASCII hostnames\n        #\n        # From https://datatracker.ietf.org/doc/html/rfc3986/#section-3.2.2\n        #\n        # reg-name    = *( unreserved / pct-encoded / sub-delims )\n        WHATWG_SAFE = '\"`{}%|\\\\'\n        return quote(host.lower(), safe=SUB_DELIMS + WHATWG_SAFE)\n\n    # IDNA hostnames\n    try:\n        return idna.encode(host.lower()).decode(\"ascii\")\n    except idna.IDNAError:\n        raise InvalidURL(f\"Invalid IDNA hostname: {host!r}\")\n\n\ndef normalize_port(port: str | int | None, scheme: str) -> int | None:\n    # From https://tools.ietf.org/html/rfc3986#section-3.2.3\n    #\n    # \"A scheme may define a default port.  For example, the \"http\" scheme\n    # defines a default port of \"80\", corresponding to its reserved TCP\n    # port number.  The type of port designated by the port number (e.g.,\n    # TCP, UDP, SCTP) is defined by the URI scheme.  URI producers and\n    # normalizers should omit the port component and its \":\" delimiter if\n    # port is empty or if its value would be the same as that of the\n    # scheme's default.\"\n    if port is None or port == \"\":\n        return None\n\n    try:\n        port_as_int = int(port)\n    except ValueError:\n        raise InvalidURL(f\"Invalid port: {port!r}\")\n\n    # See https://url.spec.whatwg.org/#url-miscellaneous\n    default_port = {\"ftp\": 21, \"http\": 80, \"https\": 443, \"ws\": 80, \"wss\": 443}.get(\n        scheme\n    )\n    if port_as_int == default_port:\n        return None\n    return port_as_int\n\n\ndef validate_path(path: str, has_scheme: bool, has_authority: bool) -> None:\n    \"\"\"\n    Path validation rules that depend on if the URL contains\n    a scheme or authority component.\n\n    See https://datatracker.ietf.org/doc/html/rfc3986.html#section-3.3\n    \"\"\"\n    if has_authority:\n        # If a URI contains an authority component, then the path component\n        # must either be empty or begin with a slash (\"/\") character.\"\n        if path and not path.startswith(\"/\"):\n            raise InvalidURL(\"For absolute URLs, path must be empty or begin with '/'\")\n\n    if not has_scheme and not has_authority:\n        # If a URI does not contain an authority component, then the path cannot begin\n        # with two slash characters (\"//\").\n        if path.startswith(\"//\"):\n            raise InvalidURL(\"Relative URLs cannot have a path starting with '//'\")\n\n        # In addition, a URI reference (Section 4.1) may be a relative-path reference,\n        # in which case the first path segment cannot contain a colon (\":\") character.\n        if path.startswith(\":\"):\n            raise InvalidURL(\"Relative URLs cannot have a path starting with ':'\")\n\n\ndef normalize_path(path: str) -> str:\n    \"\"\"\n    Drop \".\" and \"..\" segments from a URL path.\n\n    For example:\n\n        normalize_path(\"/path/./to/somewhere/..\") == \"/path/to\"\n    \"\"\"\n    # Fast return when no '.' characters in the path.\n    if \".\" not in path:\n        return path\n\n    components = path.split(\"/\")\n\n    # Fast return when no '.' or '..' components in the path.\n    if \".\" not in components and \"..\" not in components:\n        return path\n\n    # https://datatracker.ietf.org/doc/html/rfc3986#section-5.2.4\n    output: list[str] = []\n    for component in components:\n        if component == \".\":\n            pass\n        elif component == \"..\":\n            if output and output != [\"\"]:\n                output.pop()\n        else:\n            output.append(component)\n    return \"/\".join(output)\n\n\ndef PERCENT(string: str) -> str:\n    return \"\".join([f\"%{byte:02X}\" for byte in string.encode(\"utf-8\")])\n\n\ndef percent_encoded(string: str, safe: str) -> str:\n    \"\"\"\n    Use percent-encoding to quote a string.\n    \"\"\"\n    NON_ESCAPED_CHARS = UNRESERVED_CHARACTERS + safe\n\n    # Fast path for strings that don't need escaping.\n    if not string.rstrip(NON_ESCAPED_CHARS):\n        return string\n\n    return \"\".join(\n        [char if char in NON_ESCAPED_CHARS else PERCENT(char) for char in string]\n    )\n\n\ndef quote(string: str, safe: str) -> str:\n    \"\"\"\n    Use percent-encoding to quote a string, omitting existing '%xx' escape sequences.\n\n    See: https://www.rfc-editor.org/rfc/rfc3986#section-2.1\n\n    * `string`: The string to be percent-escaped.\n    * `safe`: A string containing characters that may be treated as safe, and do not\n        need to be escaped. Unreserved characters are always treated as safe.\n        See: https://www.rfc-editor.org/rfc/rfc3986#section-2.3\n    \"\"\"\n    parts = []\n    current_position = 0\n    for match in re.finditer(PERCENT_ENCODED_REGEX, string):\n        start_position, end_position = match.start(), match.end()\n        matched_text = match.group(0)\n        # Add any property\n    def query(self) -> bytes:\n        \"\"\"\n        The URL query string, as raw bytes, excluding the leading b\"?\".\n\n        This is necessarily a bytewise interface, because we cannot\n        perform URL decoding of this representation until we've parsed\n        the keys and values into a QueryParams instance.\n\n        For example:\n\n        url = httpx.URL(\"https://example.com/?filter=some%20search%20terms\")\n        assert url.query == b\"filter=some%20search%20terms\"\n        \"\"\"\n        query = self._uri_reference.query or \"\"\n        return query.encode(\"ascii\")\n\n    @property\n    def params(self) -> QueryParams:\n        \"\"\"\n        The URL query parameters, neatly parsed and packaged into an immutable\n        multidict representation.\n        \"\"\"\n        return QueryParams(self._uri_reference.query)\n\n    @property\n    def raw_path(self) -> bytes:\n        \"\"\"\n        The complete URL path and query string as raw bytes.\n        Used as the target when constructing HTTP requests.\n\n        For example:\n\n        GET /users?search=some%20text HTTP/1.1\n        Host: www.example.org\n        Connection: close\n        \"\"\"\n        path = self._uri_reference.path or \"/\"\n        if self._uri_reference.query is not None:\n            path += \"?\" + self._uri_reference.query\n        return path.encode(\"ascii\")\n\n    @property\n    def fragment(self) -> str:\n        \"\"\"\n        The URL fragments, as used in HTML anchors.\n        As a string, without the leading '#'.\n        \"\"\"\n        return unquote(self._uri_reference.fragment or \"\")\n\n    @property\n    def is_absolute_url(self) -> bool:\n        \"\"\"\n        Return `True` for absolute URLs such as 'http://example.com/path',\n        and `False` for relative URLs such as '/path'.\n        \"\"\"\n        # We don't use `.is_absolute` from `rfc3986` because it treats\n        # URLs with a fragment portion as not absolute.\n
