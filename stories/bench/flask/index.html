<script type="application/json" id="data">{"title": "One Request Through Flask: What the Framework Promises Between `environ` and `200 OK`", "premise": "A ten-line application \n\n`app = Flask(__name__)`, one route returning `\"Hello, World!\"` \n\n is the smallest thing anyone can be asked to sign off on. Nothing is configured: no secret key, no error handlers, no blueprints, no before/after hooks. Everything that happens between the client's `GET /` and the `200 OK` it gets back is Flask's own behaviour, running on its defaults. This story follows one WSGI environ dict from the moment the test client builds it to the moment the response iterator closes, and asks at each step: what is guaranteed here, what are the defaults, and what happens when something goes wrong.", "reader": "owner", "repo": {"name": "pallets/flask", "url": "https://github.com/pallets/flask", "commit": "d73fa1cdcbd8b1465c151db8924ba58b1dd14e35"}, "chapters": [{"n": 1, "title": "The World Before the Request: What `Flask(__name__)` Decides For You", "data_in": "`import_name='__main__'`, with every other constructor argument left at its default (`static_folder='static'`, `host_matching=False`, `subdomain_matching=False`, `instance_relative_config=False`).", "data_out": "A `Flask` instance carrying a `Config` of 29 defaults (`DEBUG=False`, `SECRET_KEY=None`, `TESTING=False`, `PROPAGATE_EXCEPTIONS=None`, `PROVIDE_AUTOMATIC_OPTIONS=True`, \ngg), a `url_map` holding two rules \n\n `/static/<path:filename>` \n `static` and `/` \n `hello` \n\n and `_got_first_request = False`.", "span": [2, 60], "md": "# Chapter 1 \u00b7 The World Before the Request: What `Flask(__name__)` Decides For You\n\n> **Enters as:** `import_name='__main__'`, with every other constructor argument left at its default (`static_url_path=None`, `static_folder='static'`, `static_host=None`, `host_matching=False`, `subdomain_matching=False`, `template_folder='templates'`, `instance_path=None`, `instance_relative_config=False`, `root_path=None`).\n\nNo request exists yet. What exists is a single string, `'__main__'`, handed to [`Flask.__init__`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L311-L323). Everything an incoming `GET /` will later be measured against \u2014 which routes exist, whether sessions work, whether debug tracebacks leak, which hosts are trusted \u2014 is decided in the next fifty-odd trace lines, from that one string plus a pile of defaults nobody typed.\n\n`Flask.__init__` immediately passes the whole argument list up to [`App.__init__`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L324-L335), which passes a subset further up to [`Scaffold.__init__`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L75-L100) \u2014 the layer shared with `Blueprint`. There, `'static'` goes through the [static folder setter](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L233-L238), which strips trailing slashes and stores it; `static_url_path=None` goes through [its setter](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L264-L269) and stays `None`, to be derived later.\n\nThen the import name earns its keep. `root_path` was `None`, so [`get_root_path('__main__')`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/helpers.py#L587-L600) looks the module up in `sys.modules`, finds it has a `__file__`, and returns that file's directory \u2014 in this run `'stories/bench/flask'`. Templates, static files, and `open_resource` will all be resolved relative to that path. Scaffold also lays out the empty registries the request will consult later: `view_functions`, the nested [`error_handler_spec`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L123-L126) defaultdict, and the `before_request_funcs` / `after_request_funcs` / `teardown_request_funcs` dicts. In this app they stay empty, which is why later chapters will have so few hooks to run.\n\nBack in `App.__init__`, [`auto_find_instance_path`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L507-L518) asks [`find_package('__main__')`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L762-L800) where this code lives; it answers `(None, 'demo-repos/flask')` \u2014 prefix `None` meaning \"not installed\" \u2014 so the instance path becomes that directory plus `instance`. Nothing is created on disk; it is just a path the app will offer if asked.\n\n## The config: twenty-nine decisions you did not make\n\n[`make_config`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L479-L493) copies [`Flask.default_config`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L207-L239) \u2014 twenty-nine keys \u2014 and then does one thing that is not a copy: it overwrites `DEBUG` with [`get_debug_flag()`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/helpers.py#L28-L33), which reads the `FLASK_DEBUG` environment variable. In this run it returned `False` (trace lines 19\u201320). The declared default in the class body is `None`; the effective default is whatever the environment says.\n\nThe resulting [`Config`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/config.py#L94-L100) is a plain `dict` subclass that also remembers `root_path` for later file loading. Three of its values will decide most of what happens in this story: `SECRET_KEY: None`, `TRUSTED_HOSTS: None`, `PROPAGATE_EXCEPTIONS: None`.\n\n> **For the owner:** `SECRET_KEY` defaults to `None` and app construction succeeds anyway, with no warning. Sessions in this app are therefore non-functional in a specific way you will see in Chapter 4. Confirm that any app you sign off on sets `SECRET_KEY` from configuration before it serves traffic.\n\n> **For the owner:** `DEBUG` comes from the `FLASK_DEBUG` environment variable at construction time, not from code. Verify that your production environment does not set `FLASK_DEBUG`, because that single variable switches on tracebacks in responses and exception re-raising.\n\nTwo small objects follow: [`make_aborter`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L495-L505) builds the `Aborter` that `flask.abort` will call, and the JSON provider is constructed, storing the app as a [`weakref.proxy`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/json/provider.py#L38-L39) so the provider does not keep the app alive. Then the [`url_map`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L402-L408) is created with `host_matching=False`, `subdomain_matching` is stored as `False`, and `_got_first_request` is set to `False` \u2014 a flag that will matter a great deal in Chapter 5.\n\n## Two routes get written into the map\n\nBack in `Flask.__init__`, the app gets a Click group named after itself, and then the static route. [`has_static_folder`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L240-L246) is `True` because `static_folder` resolves to `<root_path>/static`, and [`static_url_path`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L248-L262) derives `'/static'` from that folder's basename. The route is then registered [without checking whether the directory exists](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L352-L364) \u2014 deliberately, since the folder may appear later \u2014 and the view function is a lambda closing over a `weakref.ref(self)` rather than the app itself, to avoid a reference cycle between app and view.\n\n> **For the owner:** A `/static/<path:filename>` route is added to every app that has a static folder configured, existing or not, and it serves files off the filesystem. If your deployment serves static assets from a reverse proxy, pass `static_folder=None` so the application does not also expose that path.\n\nBoth registrations \u2014 the static one and the user's `@app.route(\"/\")` \u2014 go through [`setupmethod`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L42-L49), which calls [`_check_setup_finished`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L410-L420) first. While `_got_first_request` is `False` the check returns silently (trace lines 38\u201340, 52\u201354); it is a lock that has not yet engaged.\n\nInside [`add_url_rule`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L604-L661), the decorated function supplies the endpoint name: for the static route it was given explicitly; for `hello` the trace shows [`_endpoint_from_view_func`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L709-L714) returning `'hello'` \u2014 the function's `__name__`. [Methods default to `(\"GET\",)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L616-L628), and because `PROVIDE_AUTOMATIC_OPTIONS` is `True` and `OPTIONS` was not declared, [`OPTIONS` is added to the rule and `provide_automatic_options=True` is stamped onto the rule object](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L633-L651). That flag is a message to Chapter 6: an `OPTIONS` request to `/` will never reach the view. Finally the rule is added to the map and the view is recorded in `view_functions`, with [an `AssertionError` if an endpoint name is reused for a different function](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L653-L661) \u2014 a collision fails at import, not at request time.\n\nThe decorator [returns the original function unchanged](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L368-L371), so `hello` is still an ordinary callable; the registration happened as a side effect. The world is now built, and nothing has been served.\n\n> **Leaves as:** A `Flask` instance carrying a `Config` of 29 defaults (`DEBUG=False`, `SECRET_KEY=None`, `TESTING=False`, `PROPAGATE_EXCEPTIONS=None`, `TRUSTED_HOSTS=None`, `PROVIDE_AUTOMATIC_OPTIONS=True`, \u2026), a `url_map` holding two rules \u2014 `/static/<path:filename>` \u2192 `static` and `/` \u2192 `hello` with methods `{GET, HEAD, OPTIONS}` and `provide_automatic_options=True` \u2014 empty hook registries, and `_got_first_request = False`.\n"}, {"n": 2, "title": "The Request Is Manufactured: `environ` Takes Shape", "data_in": "`client.get(\"/\")` \n\n positional args `('/',)` and `kwargs={'method': 'GET'}`.", "data_out": "A `Request` object wrapping a WSGI environ: `{'HTTP_HOST': 'localhost', 'HTTP_USER_AGENT': 'Werkzeug/3.1.9', 'PATH_INFO': '/', 'QUERY_STRING': '', 'REMOTE_ADDR': '127.0.0.1', \ngg}`.", "span": [61, 73], "md": "# Chapter 2 \u00b7 The Request Is Manufactured: `environ` Takes Shape\n\n> **Enters as:** `client.get(\"/\")` \u2014 positional args `('/',)` and `kwargs={'method': 'GET'}`.\n\nA path and a method. That is the whole of what the caller supplied. Everything else the application will see \u2014 the host it was asked for, the scheme, the client's IP, the user agent \u2014 is about to be invented on the caller's behalf, by Flask, from the defaults assembled in Chapter 1.\n\nFirst the client itself. [`Flask.test_client`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L809-L814) checks `test_client_class`, which is `None` on a stock app, imports `FlaskClient`, and constructs it with the app, the app's `response_class`, and `use_cookies=True`. [`FlaskClient.__init__`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L125-L133) then sets three things that matter to every request this client will ever make: `preserve_context = False`, an empty `ExitStack` for held contexts, and an `environ_base` dict seeded with `REMOTE_ADDR` of `'127.0.0.1'` and a `HTTP_USER_AGENT` built from [`_get_werkzeug_version()`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L100-L106), which reads the installed distribution metadata once and caches it in a module global. In this run that returned `'3.1.9'`, so the base environ is `{'REMOTE_ADDR': '127.0.0.1', 'HTTP_USER_AGENT': 'Werkzeug/3.1.9'}`.\n\n> **For the owner:** The test client fabricates `REMOTE_ADDR` as `127.0.0.1` and supplies its own `User-Agent` on every request. Do not treat a passing test as evidence that code reading `request.remote_addr` behaves correctly behind a real proxy; set `environ_base` explicitly in tests that depend on those values.\n\n## From two arguments to a `Request`\n\n`client.get(\"/\")` lands in Werkzeug's `Client.get`, which forwards to [`FlaskClient.open`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L204-L228) with `args=('/',)` and `kwargs={'method': 'GET'}`. `open` first asks whether the caller handed it a pre-built request: an `EnvironBuilder`, a raw `dict` environ, or a `BaseRequest` would each take their own branch, with the environ merged or copied accordingly. A bare path takes none of them, so control falls to the `else`: [`_request_from_builder_args`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L193-L202).\n\nThat function does one thing before building: it folds the client's defaults into whatever `environ_base` the caller passed, via [`_copy_environ`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L185-L191). The caller passed none, so `other` is `{}` and the result is just the two base keys. The same function is where context preservation would be switched on \u2014 if `preserve_context` were true, it would add `werkzeug.debug.preserve_context` to the environ, a callback that captures the context so it survives the request. `preserve_context` is only set inside a `with client:` block, and this scenario does not use one, so the key is absent. Chapter 8 will depend on that: nothing will hold the context open after the response.\n\nThen [Flask's `EnvironBuilder`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L49-L86) is constructed with `app`, `path='/'`, and `base_url`, `subdomain`, `url_scheme` all `None`. Its first act is an [assertion](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L59-L63) that you did not pass `base_url` together with `subdomain` or `url_scheme` \u2014 a contradiction caught at build time rather than producing a confusing URL. Nothing was passed, so it proceeds to [invent the base URL from the app's config](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L65-L86):\n\n- `http_host = app.config.get(\"SERVER_NAME\") or \"localhost\"` \u2014 `SERVER_NAME` is `None` in this app, so the literal fallback `'localhost'` wins.\n- `app_root = app.config[\"APPLICATION_ROOT\"]`, which is `'/'`.\n- `url_scheme = app.config[\"PREFERRED_URL_SCHEME\"]`, which is `'http'`.\n- The requested path is split; `'/'` has no scheme and no netloc of its own, so `base_url` becomes `'http://localhost/'` and `path` stays `'/'`.\n\nThe app is stored on the builder so that [`json_dumps`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L88-L94) can route JSON bodies through the application's own provider, keeping request serialization consistent with response serialization. No JSON here.\n\n`builder.get_request()` produces the object the trace reports as `<Request 'http://localhost/' [GET]>`, and the builder is closed in a `finally` so any file handles it opened are released even if building raised. The environ underneath it is the dict the rest of this story travels in: `HTTP_HOST='localhost'`, `HTTP_USER_AGENT='Werkzeug/3.1.9'`, `PATH_INFO='/'`, `QUERY_STRING=''`, `RAW_URI='/'`, `REMOTE_ADDR='127.0.0.1'`, and the usual WSGI scaffolding.\n\n> **For the owner:** The `Host` header in a test request comes from `SERVER_NAME`, defaulting to the string `'localhost'`, and the scheme from `PREFERRED_URL_SCHEME`, defaulting to `'http'`. Tests therefore never exercise the host your production app actually receives; if your routing uses subdomains or host matching, set `SERVER_NAME` in the test config and pass `subdomain=` explicitly.\n\nOne more thing happens before the request leaves the client: `open` [closes `self._context_stack`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/testing.py#L230-L233), popping any contexts preserved by an earlier call. That is what keeps one request's context from leaking into the next, or across a redirect chain. The stack is empty here. With the environ built and the slate clean, `super().open(request, ...)` hands the dict to the WSGI application \u2014 which is where the next chapter picks it up.\n\n> **Leaves as:** A `Request` object wrapping a WSGI environ: `{'HTTP_HOST': 'localhost', 'HTTP_USER_AGENT': 'Werkzeug/3.1.9', 'PATH_INFO': '/', 'QUERY_STRING': '', 'RAW_URI': '/', 'REMOTE_ADDR': '127.0.0.1', \u2026}`, reported as `<Request 'http://localhost/' [GET]>`.\n"}, {"n": 3, "title": "Crossing the Boundary: `wsgi_app` and the Context That Wraps Everything", "data_in": "The environ dict plus a `start_response` callable, arriving at `Flask.__call__`.", "data_out": "`<AppContext 4557234128 of scenario, GET 'http://localhost/'>` \n\n a context holding the app, a fresh `g`, the `Request`, and a bound `MapAdapter`; not yet pushed.", "span": [74, 83], "md": "# Chapter 3 \u00b7 Crossing the Boundary: `wsgi_app` and the Context That Wraps Everything\n\n> **Enters as:** The environ dict plus a `start_response` callable, arriving at `Flask.__call__`.\n\nThe dict stops being a test fixture here. Werkzeug's client calls the application object itself, and [`Flask.__call__`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1621-L1628) does exactly one thing with the two arguments: forwards them to `self.wsgi_app`. The indirection is deliberate and documented \u2014 it exists so middleware can be installed as `app.wsgi_app = MyMiddleware(app.wsgi_app)` without replacing the app object and losing every method hanging off it. The lookup is on the instance, so whatever is bound to `wsgi_app` at call time is what runs.\n\n[`wsgi_app`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1595-L1619) is where the request's whole lifetime is framed, before any of it happens. Read the shape first, because the shape is the guarantee:\n\n```python\nctx = self.request_context(environ)\nerror = None\ntry:\n    try:\n        ctx.push()\n        response = self.full_dispatch_request(ctx)\n    except Exception as e:\n        error = e\n        response = self.handle_exception(ctx, e)\n    except:\n        error = sys.exc_info()[1]\n        raise\n    return response(environ, start_response)\nfinally:\n    ...\n    ctx.pop(error)\n```\n\nDispatch is wrapped twice: an inner `except Exception` that converts errors into a response, a bare `except` that records non-`Exception` escapes (a `KeyboardInterrupt`, a `SystemExit`) and re-raises them, and a `finally` that pops the context either way. Whatever happens between here and the end of the story, the context gets torn down. Chapter 8 collects on that promise.\n\n> **For the owner:** Teardown is in a `finally`, so teardown callbacks and `request.close()` run even when a view raises or the process is interrupted. That is the guarantee worth leaning on; it is not a guarantee that `after_request` hooks ran, since those live inside the part that can fail.\n\n## Building the context\n\n[`request_context`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1504-L1518) hands the environ to [`AppContext.from_environ`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L339-L348), which wraps it in `app.request_class(environ)` \u2014 Flask's `Request` \u2014 and attaches `request.json_module = app.json`, so a JSON body would be parsed by the same provider that will serialize responses. Then it constructs the context.\n\n[`AppContext.__init__`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L307-L323) sets up the furniture: `self.app`, a fresh `g` from `app.app_ctx_globals_class()`, `url_adapter = None`, the request, `_session = None` (not yet loaded \u2014 that is Chapter 4), `_flashes = None`, and an empty `_after_request_functions` list. Then the one interesting line:\n\n```python\ntry:\n    self.url_adapter = app.create_url_adapter(self._request)\nexcept HTTPException as e:\n    if self._request is not None:\n        self._request.routing_exception = e\n```\n\n[This try/except](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L325-L329) is the first of several places where an error is parked rather than raised. If binding fails \u2014 and it can, as we are about to see \u2014 the exception is stored on `request.routing_exception` and the context is constructed anyway, with `url_adapter` left `None`. A failure to bind becomes an ordinary HTTP error response later instead of a stack trace escaping into the WSGI server.\n\nFinally [`_cv_token = None` and `_push_count = 0`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L331-L337): the context exists but is not active. Nothing can see it through `current_app`, `g`, or `request` yet.\n\n## Who decides what host this is\n\n[`create_url_adapter`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L530-L535) takes the request branch and starts with host validation:\n\n```python\nif (trusted_hosts := self.config[\"TRUSTED_HOSTS\"]) is not None:\n    request.trusted_hosts = trusted_hosts\n\nrequest.host = get_host(request.environ, request.trusted_hosts)\n```\n\n`TRUSTED_HOSTS` is `None` in this app \u2014 one of the 29 defaults from Chapter 1 \u2014 so the first line is skipped and `get_host` is called with no allow-list. It reads `HTTP_HOST` out of the environ and returns it unchanged: `'localhost'`. Had the config been set, a mismatch would raise a `SecurityError` (a 400), which the `except HTTPException` above would catch and park on `routing_exception`, leaving `url_adapter` as `None`.\n\nThat answers the question Chapter 2 left open. Yes, Flask trusts the `Host` header the caller sent. Host validation is opt-in.\n\n> **For the owner:** `TRUSTED_HOSTS` defaults to `None`, meaning any `Host` header is accepted and reflected in `request.host`, `request.url`, and anything built from them. If your app generates absolute URLs into emails or redirects, set `TRUSTED_HOSTS` to the hosts you actually serve, or validate the host at the proxy.\n\nNext, [subdomains](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L539-L547). `url_map.host_matching` is `False`, so the first branch \u2014 which would blank `server_name` so the real host governs matching \u2014 is skipped. `self.subdomain_matching` is also `False`, so the `elif` runs and pins `subdomain` to `self.url_map.default_subdomain or \"\"`. The comment says why: Werkzeug's subdomain matching isn't wired up here, so Flask forces the current subdomain to the default rather than leaving it to be derived from the host. The practical consequence is that a request to `foo.localhost` would match app-level routes exactly as `localhost` does.\n\nThen [`url_map.bind_to_environ(request.environ, server_name=None, subdomain=\"\")`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L549-L551) returns the `MapAdapter` at `0x10fa1e900`, bound to this environ and holding the two rules registered in Chapter 1. (The [other path](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L553-L561) \u2014 binding without a request, from `SERVER_NAME` and `APPLICATION_ROOT` \u2014 is what makes `url_for` work in a CLI command; it returns `None` when `SERVER_NAME` is unset, which is why building URLs outside a request fails with that particular error message.)\n\nThe adapter is assigned to `ctx.url_adapter`, `__init__` returns, and the context surfaces back through `from_environ` and `request_context` to `wsgi_app`. Its [`__repr__`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L518-L525) shows what it is carrying: `<AppContext 4557234128 of scenario, GET 'http://localhost/'>`. Built, bound, and still invisible \u2014 the contextvar has not been touched.\n\n> **Leaves as:** `<AppContext 4557234128 of scenario, GET 'http://localhost/'>` \u2014 a context holding the app, a fresh `g`, the `Request`, and a bound `MapAdapter`; `_session is None`, `_cv_token is None`, `_push_count == 0`; not yet pushed.\n"}, {"n": 4, "title": "Push: The Session Opens Before the URL Is Matched", "data_in": "The unpushed `AppContext` holding the `Request` and `MapAdapter`.", "data_out": "The active context: `_cv_app` set, `_session = <NullSession {}>`, and `request.url_rule`/`request.view_args` filled in from the match on `/`.", "span": [84, 101], "md": "# Chapter 4 \u00b7 Push: The Session Opens Before the URL Is Matched\n\n> **Enters as:** `<AppContext 4557234128 of scenario, GET 'http://localhost/'>` \u2014 built and bound, `_session is None`, `_cv_token is None`, `_push_count == 0`, invisible to every proxy.\n\n`wsgi_app` calls `ctx.push()`, and the context goes from being an object someone holds a reference to into being *the* context \u2014 the one `current_app`, `g`, `request`, and `session` all resolve to.\n\n[`push`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L416-L444) begins by counting, not by activating:\n\n```python\nself._push_count += 1\n\nif self._cv_token is not None:\n    return\n```\n\n[Those four lines](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L428-L432) are the re-entrancy guard. A context can legitimately be pushed more than once \u2014 streaming responses do it, `stream_with_context` does it, the test client does it when preserving a context \u2014 and the counter means the expensive, observable half of push (signals, opening the session, routing) happens only on the first one. Here `_push_count` goes 0 \u2192 1 and `_cv_token` is `None`, so execution continues into the real work.\n\n[`self._cv_token = _cv_app.set(self)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L433-L434) installs the context in the contextvar and stashes the token needed to restore the previous state later. From this instruction on, `current_app` is this app and `g` is this context's globals, for this thread only. `appcontext_pushed.send(...)` fires immediately after; with Blinker present but no subscribers connected, it costs a dictionary lookup and returns.\n\n## The session, before the route\n\nBecause `self._request is not None`, push does two more things, and the order is the point:\n\n```python\n# Open the session at the moment that the request context is available.\n# This allows a custom open_session method to use the request context.\nself._get_session()\n\n# Match the request URL after loading the session, so that the\n# session is available in custom URL converters.\nif self.url_adapter is not None:\n    self.match_request()\n```\n\n[The comments are the contract](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L437-L444): a custom `open_session` may use `request` and `g`, because the contextvar is already set; and a custom URL converter may read `session`, because the session is already loaded. Both of those are guarantees someone writing an extension can rely on.\n\n[`_get_session`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L381-L393) raises `RuntimeError(\"There is no request in this context.\")` if there is no request \u2014 not the case here \u2014 then, since `_session` is `None`, asks the app's session interface to open one. The default interface is the class-level [`SecureCookieSessionInterface()`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L249-L253) shared by every `Flask` instance.\n\n[`open_session`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L323-L335) asks for a serializer before it so much as looks at the cookies:\n\n```python\ns = self.get_signing_serializer(app)\nif s is None:\n    return None\n```\n\n[`get_signing_serializer`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L303-L321) reads `app.secret_key`, which is a [`ConfigAttribute`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/config.py#L35-L44) forwarding to `config[\"SECRET_KEY\"]`. The trace records that descriptor call returning `None` \u2014 the default set in Chapter 1 and never overridden. `if not app.secret_key: return None`. No serializer, so `open_session` returns `None`, and the cookie in the request (there isn't one, but it wouldn't matter) is never read.\n\n`_get_session` sees that `None` and falls back to [`make_null_session`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L150-L160), which constructs the interface's `null_session_class`. `SecureCookieSession.__init__` runs with `initial=None`, wiring up the `on_update` callback that would set `modified = True`, and out comes `<NullSession {}>`. That object is stored on `ctx._session` and returned.\n\nA [`NullSession`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L83-L97) is a real dict-like session that is permanently empty and refuses to change: `__setitem__`, `__delitem__`, `clear`, `pop`, `popitem`, `update`, and `setdefault` are all bound to `_fail`, which raises `RuntimeError(\"The session is unavailable because no secret key was set. Set the secret_key on the application to something unique and secret.\")`. Reads are silent \u2014 `session.get(\"user_id\")` returns `None`, `\"user_id\" in session` is `False` \u2014 and only writes complain.\n\nThat is the answer to the question Chapter 1 left hanging. A missing secret key does not stop the app from starting, or from serving. It degrades the session into something that reads as empty forever and explodes the first time a view tries to write to it.\n\n> **For the owner:** With `SECRET_KEY` unset, session reads succeed and return nothing while session writes raise `RuntimeError` at request time, which becomes a 500 for that user. A login flow would appear to work until the moment it stores anything. Set `SECRET_KEY` from the environment in every deployed configuration and fail startup if it is missing, rather than relying on this error to surface in production.\n\nOne detail worth holding onto for Chapter 7: push calls `_get_session()`, not the [`session` property](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L395-L403). Only the property sets `accessed = True`. Loading a session as part of push therefore does not, by itself, mark it accessed or earn the response a `Vary: Cookie` header.\n\n> **For the owner:** The session is opened on every request with a request context, including requests for static files, whether or not the view touches `session`. If you replace the session interface with one backed by Redis or a database, that is a store round-trip per request. Check that any custom `open_session` is cheap, or short-circuits on paths that don't need it.\n\n## Routing, and errors parked again\n\n`url_adapter` is the `MapAdapter` bound in Chapter 3, so [`match_request`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L405-L414) runs:\n\n```python\ntry:\n    result = self.url_adapter.match(return_rule=True)\nexcept HTTPException as e:\n    self._request.routing_exception = e\nelse:\n    self._request.url_rule, self._request.view_args = result\n```\n\nSame pattern as the adapter binding: a 404 from an unknown path, a 405 from a wrong method, a 308 `RequestRedirect` from a missing trailing slash \u2014 all of them are `HTTPException` subclasses, all of them get stored on `request.routing_exception` and none of them are raised here. Matching `/` against the two rules succeeds, so the `else` branch fires and the request now carries `url_rule` (endpoint `'hello'`) and `view_args` (`{}`). `routing_exception` stays `None`.\n\nParking the exception rather than raising it inside `push()` matters because of where `push()` sits: in `wsgi_app`'s inner `try`, yes, but *before* `full_dispatch_request`. An exception raised here would skip `request_started`, skip `preprocess_request`, and land in `handle_exception` rather than in the user-error path. By deferring it, Flask makes a 404 take exactly the same route through the error machinery as a 404 raised by `abort(404)` in a view. Who actually re-raises it is the next chapter's business.\n\n`push()` returns `None`. The context is live.\n\n> **Leaves as:** The active context \u2014 `_cv_app` set to it, `_cv_token` holding the reset token, `_push_count == 1`, `_session = <NullSession {}>` with `accessed` still `False`, `request.url_rule` the `/` rule with endpoint `'hello'`, `request.view_args == {}`, `request.routing_exception is None`.\n"}, {"n": 5, "title": "`full_dispatch_request`: The Error Boundary and the Setup Lock", "data_in": "The pushed `AppContext` (`GET 'http://localhost/'`, matched endpoint `hello`).", "data_out": "`None` from `preprocess_request` \n\n no before-request hook short-circuited, so dispatch proceeds.", "span": [102, 112], "md": "# Chapter 5 \u00b7 `full_dispatch_request`: The Error Boundary and the Setup Lock\n\n> **Enters as:** the active `<AppContext 4557234128 of scenario, GET 'http://localhost/'>` \u2014 `_push_count == 1`, `_session = <NullSession {}>`, `request.url_rule` matched to endpoint `'hello'`, `request.view_args == {}`, `request.routing_exception is None`.\n\n`wsgi_app` hands the live context straight into [`full_dispatch_request(ctx)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L995-L1022). This is the method that owns the request's error boundary, and it does two pieces of bookkeeping before it dispatches anything.\n\nThe first is a check that costs nothing here:\n\n```python\nif not self._got_first_request and self.should_ignore_error is not None:\n    import warnings\n    warnings.warn(...)\n```\n\n[`should_ignore_error`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L928-L937) is a class attribute pinned to `None` and deprecated \u2014 subclasses that still override it get one `DeprecationWarning` on the first request, and the hook is scheduled for removal in Flask 3.3. This app doesn't override it, so the branch is skipped and the trace shows nothing at all for it.\n\nThe second is a single assignment, and it changes what the application is:\n\n```python\nself._got_first_request = True\n```\n\n## The lock closes\n\nUp to this instruction, [`_check_setup_finished`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L410-L420) has been waving everything through \u2014 twice in Chapter 1, once for the static rule and once for `/`. After [line 1013](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1013), the same check raises:\n\n```\nAssertionError: The setup method 'route' can no longer be called on the\napplication. It has already handled its first request, any changes will not\nbe applied consistently.\n```\n\nEvery registration method \u2014 `route`, `add_url_rule`, `before_request`, `after_request`, `errorhandler`, `teardown_request`, `register_blueprint`, `template_filter` \u2014 goes through the [`setupmethod`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L42-L49) wrapper, which calls that check before doing any work. This answers the question Chapter 1 left open: the guard exists because a route added after serving began would be visible to some workers and not others, and a `before_request` hook added mid-flight would run for some requests and not others. Flask refuses the inconsistency rather than hiding it.\n\n> **For the owner:** Any code path that registers routes, hooks, or error handlers lazily \u2014 on first use, inside a view, from a plugin loaded on demand \u2014 will raise `AssertionError` once a worker has served one request, and it will do so on only the workers that reached that path. Require that all registration happens during import or inside the app factory, before the app is handed to the server.\n\n## One `try`, three things inside it\n\nThe rest of the method is small enough to quote whole:\n\n```python\ntry:\n    request_started.send(self, _async_wrapper=self.ensure_sync)\n    rv = self.preprocess_request(ctx)\n    if rv is None:\n        rv = self.dispatch_request(ctx)\nexcept Exception as e:\n    rv = self.handle_user_exception(ctx, e)\nreturn self.finalize_request(ctx, rv)\n```\n\n[Those eight lines](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1015-L1022) are the guarantee worth remembering: the `request_started` signal, the before-request hooks, and the view itself all sit inside the *same* `except Exception`. A subscriber that raises, a `before_request` that raises, and a view that raises are indistinguishable from here \u2014 all three go to [`handle_user_exception`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L868-L898), which looks for a registered error handler and, failing that, re-raises. And whichever way `rv` was produced \u2014 view return value, hook return value, or error handler output \u2014 it leaves through the one exit, `finalize_request`.\n\n`request_started.send` fires first. Blinker is installed and nobody is connected, so it returns having found no receivers.\n\n## `preprocess_request`: two passes over an empty table\n\n[`preprocess_request(ctx)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1369-L1395) takes the request off the context and works out which scopes apply:\n\n```python\nreq = ctx.request\nnames = (None, *reversed(req.blueprints))\n```\n\n`None` is the app scope; the rest are blueprint names. Computing `req.blueprints` sends the trace down a short chain: [`Request.blueprints`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/wrappers.py#L180-L195) asks [`Request.blueprint`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/wrappers.py#L161-L178), which asks [`Request.endpoint`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/wrappers.py#L146-L159). The endpoint is `'hello'` \u2014 the one set on the request during `match_request` in Chapter 4. It contains no `.`, so `blueprint` is `None` and `blueprints` is `[]`. `names` is therefore just `(None,)`.\n\nNote what `endpoint` would be if routing had failed: `url_rule` would be `None`, `endpoint` would be `None`, `blueprints` would be `[]` \u2014 the scope machinery degrades to app-only rather than erroring. That is why a 404 still runs app-level before-request hooks.\n\nTwo loops follow. The first runs [URL value preprocessors](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1382-L1385), which can mutate `req.view_args` in place before the view ever sees them. The second runs [before-request functions](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1387-L1393):\n\n```python\nrv = self.ensure_sync(before_func)()\n\nif rv is not None:\n    return rv\n```\n\nA before-request hook that returns anything other than `None` becomes the response. The view is never called, and the remaining before-request hooks are never called either. That is the documented mechanism for things like \"redirect anonymous users to the login page\" \u2014 and it is also the reason a hook with an accidental `return` can silently take a route out of service.\n\nBoth dictionaries are `defaultdict`s and both are empty, so `name in self.url_value_preprocessors` and `name in self.before_request_funcs` are false for `None`, both loops do nothing, and `preprocess_request` falls through to `return None`.\n\n> **For the owner:** Order is asymmetric and worth knowing before you debug one: preprocessing runs app scope first, then blueprints from outermost in; after-request and teardown run the reverse. A `before_request` registered on the app always sees the request before a blueprint's, and a non-`None` return from any of them cancels every hook after it plus the view. Require before-request hooks to end in an explicit `return None` unless they are deliberately short-circuiting.\n\nBack in `full_dispatch_request`, `rv is None` is true, so the `if` opens the door to `dispatch_request(ctx)` \u2014 the next chapter's territory.\n\n> **Leaves as:** `None` returned from `preprocess_request`, with the app now permanently closed to setup (`_got_first_request is True`), the request still carrying endpoint `'hello'`, `blueprints == []`, and dispatch about to begin inside the `try`.\n"}, {"n": 6, "title": "Dispatch and `make_response`: The Branches Not Taken, and the String That Becomes a Response", "data_in": "The pushed `AppContext` with `request.url_rule` pointing at the `/` rule and `view_args = {}`.", "data_out": "`<Response 13 bytes [200 OK]>`, built from the view's raw return value `'Hello, World!'`.", "span": [113, 121], "md": "# Chapter 6 \u00b7 Dispatch and `make_response`: The Branches Not Taken, and the String That Becomes a Response\n\n> **Enters as:** the active `<AppContext 4557234128 of scenario, GET 'http://localhost/'>`, with `preprocess_request` having just returned `None`, `request.url_rule` pointing at the `/` rule, `request.view_args == {}`, and `request.routing_exception is None`.\n\n`rv` is `None`, so the `if` in `full_dispatch_request` opens and the context goes into [`dispatch_request(ctx)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L969-L993). This method is twelve lines long and three of them are branches. The request takes exactly one of them.\n\n## Branch one: the exception parked in Chapter 4\n\n```python\nreq = ctx.request\n\nif req.routing_exception is not None:\n    self.raise_routing_exception(req)\n```\n\n[That check](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L979-L982) is the first thing dispatch does, and it answers the question Chapter 4 left hanging. When `match_request` caught an `HTTPException` from the URL map and quietly stored it on the request instead of raising it, it deferred the decision to here \u2014 and *here* is inside `full_dispatch_request`'s `try`. A 404, a 405, a redirect for a missing trailing slash: all of them are re-raised at this line and immediately caught one frame up, where `handle_user_exception` turns them into ordinary responses. That deferral is deliberate. Routing happens during `push()`, before the error boundary exists; raising there would escape past every error handler the application registered.\n\n[`raise_routing_exception`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L563-L589) is almost entirely a pass-through. It substitutes a friendlier `FormDataRoutingRedirect` only when *all* of debug mode is on, the exception is a `RequestRedirect`, its code is not 307 or 308, and the method is not GET/HEAD/OPTIONS. With `DEBUG=False` \u2014 the value the config picked up from the environment back in Chapter 1 \u2014 the first condition already fails and the original exception is re-raised unchanged. The debug helper never runs in production.\n\nOur request matched cleanly, so `routing_exception` is `None` and the branch is skipped.\n\n## Branch two: the `OPTIONS` reply that was decided at registration time\n\n```python\nrule: Rule = req.url_rule\n\nif (\n    getattr(rule, \"provide_automatic_options\", False)\n    and req.method == \"OPTIONS\"\n):\n    return self.make_default_options_response(ctx)\n```\n\n[This branch](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L983-L990) reads a flag that was written long before the request existed. In Chapter 1, [`add_url_rule`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L633-L651) saw that `OPTIONS` was not among the declared methods and that `PROVIDE_AUTOMATIC_OPTIONS` was `True`, so it added `OPTIONS` to the rule's method set and stamped `provide_automatic_options = True` onto the rule object. Had the request method been `OPTIONS`, [`make_default_options_response`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1056-L1066) would have asked the context's URL adapter for `allowed_methods()` and returned an empty response carrying only an `Allow` header \u2014 the view would never be called.\n\nThe method is `GET`. Skipped.\n\n## Branch three: the view\n\n```python\nview_args: dict[str, t.Any] = req.view_args\nreturn self.ensure_sync(self.view_functions[rule.endpoint])(**view_args)\n```\n\n[One line](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L992-L993) does three things: it looks the view up by endpoint name (`'hello'`) in the dict `add_url_rule` populated, it passes it through `ensure_sync`, and it calls it with the matched URL variables as keyword arguments \u2014 here an empty dict, because `/` has no variable parts.\n\n[`ensure_sync`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1068-L1080) asks `iscoroutinefunction(func)` and, for a plain `def`, returns the function unchanged \u2014 the trace records it handing back the identical `<function hello at 0x10f9b7ec0>` it was given. An `async def` view would instead be routed through [`async_to_sync`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1082-L1103), which imports `asgiref` and raises `RuntimeError(\"Install Flask with the 'async' extra in order to use async views.\")` if it isn't installed. That failure is at call time, not import time: an async view in an app without the extra looks fine until someone requests it.\n\n`hello()` runs and returns the str `'Hello, World!'`. That value \u2014 not a response, just a string \u2014 is what `dispatch_request` returns to `full_dispatch_request`, which passes it straight to `finalize_request`.\n\n> **For the owner:** `ensure_sync` wraps each async view in its own event loop per request, so async views do not increase the number of concurrent requests a worker can handle \u2014 they only let a single request await concurrent I/O. Check whether any `async def` views exist in the codebase and whether `flask[async]` is in the dependency list, because a missing extra surfaces as a 500 on first request to that route rather than as an import error at startup.\n\n## `finalize_request`: one entrance for every outcome\n\n[`finalize_request(ctx, rv, from_error_handler=False)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1024-L1054) is where the normal path and the error path converge. Its first act is `response = self.make_response(rv)`; after that it will run `process_response` and send `request_finished`, both inside a `try`. That `try` only swallows failures when `from_error_handler` is `True` \u2014 a flag set by exactly one caller, [`handle_exception`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L951). On the normal path, a failing `after_request` function propagates out of `finalize_request` and is not hidden.\n\n## `make_response`: the type contract\n\n[`make_response(rv)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1227-L1367) is 140 lines of docstring and about 70 lines of careful type dispatch, and it is the only place where \"whatever the view returned\" becomes \"a `Response`\". The string takes a short path through it, but the shape of the whole function is what the owner is signing off on.\n\nIt starts with `status = None` and `headers = None` and unpacks tuples first. A [3-tuple](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1291-L1293) is `(body, status, headers)`. A [2-tuple](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1294-L1299) is disambiguated by inspecting the second element: a `Headers`, `dict`, `tuple` or `list` means headers, anything else means status. Any other length [raises `TypeError`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1300-L1306) naming the three allowed forms. Our `rv` is not a tuple, so none of this runs.\n\nThen the body is checked against `None`:\n\n```python\nif rv is None:\n    raise TypeError(\n        f\"The view function for {request.endpoint!r} did not\"\n        \" return a valid response. The function either returned\"\n        \" None or ended without a return statement.\"\n    )\n```\n\n[This](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1308-L1314) is a guarantee worth stating plainly: a view that forgets to return is never turned into an empty `200`. It raises, the exception lands in `full_dispatch_request`'s `except`, and \u2014 with no handler registered \u2014 becomes a 500. Loud, with the endpoint name in the message.\n\nNext, the type ladder. `'Hello, World!'` is a `str`, so it takes [the first rung](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1317-L1327):\n\n```python\nrv = self.response_class(rv, status=status, headers=headers)\nstatus = headers = None\n```\n\nThe status and headers are handed to the `Response` constructor rather than applied afterwards, so the class can apply its own logic \u2014 the comment on those lines says exactly that. `Response.default_mimetype` is `\"text/html\"`, which is where the `Content-Type: text/html; charset=utf-8` on the final response comes from; the string is encoded UTF-8, giving 13 bytes. The trace records the result: `<Response 13 bytes [200 OK]>`.\n\nThe rungs not taken are the interesting ones. A [`dict` or `list`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1328-L1329) goes to `self.json.response(rv)` \u2014 JSON serialization is implicit for those two types and only those two. A [`BaseResponse` or any callable](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1330-L1345) is coerced via `force_type`, which for a callable means *evaluating it as a WSGI application*. Anything else [raises `TypeError`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1346-L1353) listing the permitted return types.\n\nFinally the deferred `status` and `headers` are applied if they survived: [status](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1356-L1361) as a string or an int, and [headers](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1363-L1365) with `rv.headers.update(headers)` \u2014 note *update*, which extends rather than replaces. Both were set back to `None` by the str branch, so neither applies here.\n\n> **For the owner:** The `callable(rv)` branch means a view that accidentally returns a function \u2014 a decorator mistake, a missing call \u2014 is executed as a WSGI application against the live `request.environ` rather than rejected. Treat any view whose return value is not obviously a str, bytes, dict, list, tuple, or `Response` as something to look at twice in review.\n\n`make_response` returns the `Response` to `finalize_request`, which now holds a real HTTP response and has `process_response` left to run.\n\n> **Leaves as:** `<Response 13 bytes [200 OK]>` \u2014 body `b'Hello, World!'`, `Content-Type: text/html; charset=utf-8`, no cookies and no `Vary` header yet \u2014 held by `finalize_request`, about to be passed to `process_response`.\n"}, {"n": 7, "title": "`process_response`: After-Request Hooks and the Cookie That Isn't Written", "data_in": "`<Response 13 bytes [200 OK]>` plus the active `AppContext`.", "data_out": "The same `<Response 13 bytes [200 OK]>`, unmodified, with no `Set-Cookie` and no `Vary` header.", "span": [122, 137], "md": "# Chapter 7 \u00b7 `process_response`: After-Request Hooks and the Cookie That Isn't Written\n\n> **Enters as:** `<Response 13 bytes [200 OK]>` \u2014 body `b'Hello, World!'`, `Content-Type: text/html; charset=utf-8`, no cookies, no `Vary` \u2014 held by `finalize_request`, together with the active `<AppContext 4557234128 of scenario, GET 'http://localhost/'>`.\n\n`finalize_request` has its response object. Its next line opens a `try` and calls [`self.process_response(ctx, response)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1042-L1047). This is the application's last chance to touch the response before it leaves \u2014 and in an app with nothing registered, it is mostly a tour of the hooks that aren't there.\n\n[`process_response`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1397-L1421) does three things in a fixed order: per-request callbacks, registered after-request functions, then the session.\n\n## One: the callbacks this request asked for\n\n```python\nfor func in ctx._after_request_functions:\n    response = self.ensure_sync(func)(response)\n```\n\n[That list](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1410-L1411) lives on the context object itself, created empty in `AppContext.__init__` back in Chapter 3. The only way anything gets into it is [`after_this_request`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L139-L148), which fetches the active context, raises `RuntimeError` if there isn't one or if it has no request, and appends the function. It is scoped to this one request and dies with the context.\n\n`hello()` registered nothing. The loop body never runs, and `response` is still the same object.\n\n## Two: the hooks registered at setup, in reverse\n\n```python\nfor name in chain(ctx.request.blueprints, (None,)):\n    if name in self.after_request_funcs:\n        for func in reversed(self.after_request_funcs[name]):\n            response = self.ensure_sync(func)(response)\n```\n\n[This loop](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1413-L1416) is the mirror image of `preprocess_request` from Chapter 5. There, the scope order was `(None, *reversed(req.blueprints))` \u2014 app first, then outward-to-inward through the blueprints. Here it is `chain(ctx.request.blueprints, (None,))` \u2014 innermost blueprint first, app last \u2014 and within each scope the functions run in *reverse* registration order. The effect is a nesting discipline: whatever ran first on the way in runs last on the way out, so a hook that sets something up in `before_request` can rely on its paired `after_request` hook running after every inner one has finished.\n\nThe trace shows the context being asked for its request and the request computing `blueprints` again \u2014 `Request.blueprint` finds no dot in the endpoint `'hello'` and returns `None`, so `blueprints` is `[]`. The chain collapses to `(None,)`, and `self.after_request_funcs` has no `None` key because nothing was ever registered with `@app.after_request`. Nothing runs.\n\nThe contract in that line deserves naming: each function is called with the response and its return value *replaces* `response`. A hook that modifies headers and forgets to `return response` silently substitutes `None`, and the next hook \u2014 or the session code below \u2014 receives it. There is no check. The docstring on [`after_request`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/scaffold.py#L494-L513) also notes the other half of the deal: if one of these raises, the remaining ones are skipped, which is why cleanup belongs in `teardown_request` and not here.\n\n> **For the owner:** Require every `after_request` function to end with `return response`, and treat a hook that performs cleanup or resource release here as a defect \u2014 an exception in an earlier hook skips all later ones. Note also that these hooks run *before* the session is saved, so an `after_request` function cannot inspect or modify the session cookie.\n\n## Three: the session that is never saved\n\n```python\nif not self.session_interface.is_null_session(ctx._get_session()):\n    self.session_interface.save_session(self, ctx._get_session(), response)\n```\n\n[This](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1418-L1419) is where Chapter 4's missing secret key produces its visible consequence. `ctx._get_session()` returns the already-open `<NullSession {}>` \u2014 no re-opening, the context cached it during `push()`. [`is_null_session`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L162-L169) is a plain `isinstance` check against `null_session_class`, and the trace records it returning `True`. The `if` is false. `save_session` is not called.\n\nSo the response leaves with no `Set-Cookie` header and no `Vary` header. An application with no secret key is not an application with a broken session cookie; it is an application with no session cookie at all. Reads of `session` return empty, and writes raise `RuntimeError(\"The session is unavailable because no secret key was set...\")` from [`NullSession._fail`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L89-L97), which is bound to `__setitem__`, `__delitem__`, `clear`, `pop`, `popitem`, `update` and `setdefault`.\n\nHad a secret key been set, [`save_session`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L337-L385) would have run and made three decisions in order. First, [`Vary: Cookie` is added whenever `session.accessed` is true](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L349-L350) \u2014 merely reading the session makes the response cache-varying, which is the correct and easily-forgotten behaviour. Second, [an empty session that was modified gets the cookie deleted](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L353-L367), and an empty session that was never modified gets nothing. Third, [`should_set_cookie`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sessions.py#L233-L247) gates the write on `session.modified or (session.permanent and SESSION_REFRESH_EACH_REQUEST)` \u2014 so an unmodified non-permanent session costs no bandwidth.\n\nThe cookie attributes it would use come straight from the config defaults chosen in Chapter 1: [`SESSION_COOKIE_HTTPONLY=True`, but `SESSION_COOKIE_SECURE=False`, `SESSION_COOKIE_SAMESITE=None`, `SESSION_COOKIE_PARTITIONED=False`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L219-L226).\n\n> **For the owner:** Set `SESSION_COOKIE_SECURE=True` and `SESSION_COOKIE_SAMESITE=\"Lax\"` for any deployment served over HTTPS; the defaults are permissive so that plain-HTTP local development works, and they do not harden themselves in production. Confirm that `SECRET_KEY` is loaded from the environment in every deployed configuration \u2014 without it the app serves successfully but every session write raises a 500.\n\n## Back out through `finalize_request`\n\n`process_response` returns the same `<Response 13 bytes [200 OK]>` it was given. `finalize_request` then sends [`request_finished`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1045-L1047) with the response as a keyword argument \u2014 subscribers see the finished object, and because we are on the normal path with `from_error_handler=False`, an exception raised by a subscriber [propagates rather than being logged and swallowed](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1048-L1053).\n\nNothing is connected. The response is returned unchanged through `finalize_request`, through `full_dispatch_request`, and back to `wsgi_app`, which still has a context to pop.\n\n> **Leaves as:** `<Response 13 bytes [200 OK]>`, the identical object that entered \u2014 no `Set-Cookie`, no `Vary`, body `'Hello, World!'` \u2014 returned from `finalize_request` to `full_dispatch_request` and on to `wsgi_app`.\n"}, {"n": 8, "title": "`pop` and the Way Out: Teardown That Runs Everything, Even When It Fails", "data_in": "The active `AppContext` and `exc=None` (no error occurred during dispatch).", "data_out": "`<werkzeug.wsgi.ClosingIterator object at 0x10fa1ef90>` returned from `wsgi_app`, surfacing to the caller as `<WrapperTestResponse streamed [200 OK]>` with body `'Hello, World!'`; the context is popped, `_cv_app` reset, `_cv_token = None`, request closed, no errors collected.", "span": [138, 190], "md": "# Chapter 8 \u00b7 `pop` and the Way Out: Teardown That Runs Everything, Even When It Fails\n\n> **Enters as:** `<Response 13 bytes [200 OK]>` back inside `wsgi_app`, with `error = None` and the still-active `<AppContext 4557234128 of scenario, GET 'http://localhost/'>` as `ctx`.\n\n`full_dispatch_request` hands the response back to [`wsgi_app`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1595-L1619), which does one thing with it: `return response(environ, start_response)`. Calling a Werkzeug response as a WSGI application is what actually starts the HTTP reply \u2014 status line and headers go to `start_response`, and the return value is a `ClosingIterator` over the body bytes. But the `return` is inside a `try`, and the `try` has a `finally`. Before that iterator reaches the caller, the finally block runs.\n\nThree things happen there, in order. First, [`if \"werkzeug.debug.preserve_context\" in environ`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1609-L1610) \u2014 the hook by which the debugger or a `with client:` block asks to keep the context alive past the request. Chapter 2 established that `preserve_context` is `False` here, so the key isn't in the environ and the branch is skipped. Second, a check on [`self.should_ignore_error`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1612-L1617), which is [`None` on the base class](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/sansio/app.py#L928-L937) and deprecated; nothing to do. Third, [`ctx.pop(error)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1619), with `error` still `None`.\n\n## The guards before anything is torn down\n\n[`AppContext.pop`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L446-L504) refuses to work on the wrong object. It raises `RuntimeError` if this context was never pushed (`_cv_token is None`), if no context is currently active, or \u2014 the important one \u2014 [if the active context is not `self`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L465-L479). Mismatched push/pop pairs fail loudly rather than quietly resetting someone else's contextvar. All three checks pass here.\n\nThen [`self._push_count -= 1`, and if it is still positive, `pop` returns immediately](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L481-L484). This is the mirror of the counting in `push()` from Chapter 4: a context pushed three times (streaming with `stream_with_context`, a preserved test context, a nested re-entry) tears down only when the last pop arrives. Our context was pushed once, the count goes to zero, and teardown proceeds.\n\n## `_CollectErrors`: the reason the rest of this always finishes\n\nThe next line is `collect_errors = _CollectErrors()` \u2014 trace line 139 \u2014 and from here every remaining step is wrapped in `with collect_errors:`. [That context manager's `__exit__` appends any exception to a list and returns `True`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/helpers.py#L665-L674), which suppresses it. The trace is full of these: `__enter__`/`__exit__` pairs at lines 141/161, 163/165, 167/179, 181/183, each returning `True`.\n\nThe guarantee this buys is concrete. A teardown function that raises does not prevent the next teardown function from running, does not prevent `request.close()` from releasing uploaded file handles, and \u2014 most importantly \u2014 does not prevent `_cv_app.reset()`. A buggy teardown callback cannot leave a stale context pinned to the worker for every subsequent request it handles. At the end, [`raise_any`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/helpers.py#L676-L682) re-raises what was collected: a `BaseExceptionGroup` on Python 3.11+, or the first error on older versions. Here the list is empty and `raise_any(\"Errors during context teardown\")` returns `None` (trace line 185).\n\n## The fixed order\n\n[Because `self._request is not None`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L488-L496), request teardown comes first. [`do_teardown_request`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1443-L1454) builds its *own* `_CollectErrors` and walks `chain(ctx.request.blueprints, (None,))` \u2014 the same innermost-blueprint-first, app-last ordering as `after_request`, with each scope's functions [in reverse registration order](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1445-L1449). The context is asked for its request, the request recomputes `blueprints` as `[]` (trace lines 146-153), and `self.teardown_request_funcs` has no `None` key. Nothing runs. Then, inside its own collector, [`request_tearing_down.send(self, _async_wrapper=self.ensure_sync, exc=exc)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1451-L1452) fires with `exc=None`. No subscribers. `raise_any(\"Errors during request teardown\")` finds nothing.\n\nNext, [`self._request.close()`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L492-L493) \u2014 trace lines 163-165, an enter/exit pair with no call between them visible, because `close()` on a request with no uploaded files does nothing observable.\n\nThen [`do_teardown_appcontext`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1473-L1482), trace line 169: same pattern, [`reversed(self.teardown_appcontext_funcs)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L1475-L1477) (empty), then `appcontext_tearing_down` with `exc=None`, then its own `raise_any(\"Errors during app teardown\")`.\n\nOnly now, after both teardown phases, does [`_cv_app.reset(self._cv_token)` run and `_cv_token` go back to `None`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L498-L499). That ordering is a promise to teardown authors: `current_app`, `g`, `request` and `session` are all still live while your cleanup runs. The last step, [`appcontext_popped.send(...)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/ctx.py#L501-L502), is deliberately on the far side of that reset \u2014 subscribers to *popped* see no active context.\n\n> **For the owner:** Write every `teardown_request` and `teardown_appcontext` function so it cannot raise \u2014 wrap fallible work in `try`/`except` and log it. Errors raised there are collected and re-raised as an exception group out of `wsgi_app` *after* the response has already been started, so the client has a 200 and your server has a traceback the application cannot turn into an error page.\n\n> **For the owner:** Do not assume a teardown function means the view ran. Teardown is invoked from `ctx.pop()` for every pushed context, including routing failures, `with app.app_context():` blocks in CLI commands and setup code, and preserved test contexts that are popped a second time. Also note the `exc` argument is `None` when an error handler handled the exception, so it is not a reliable \"did this request fail\" signal.\n\n## The road not taken\n\nHad `hello()` raised, this chapter would look different only in what `exc` carried. [`handle_user_exception`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L885-L898) would search for a handler by status code and MRO across blueprint-then-app scope; finding none for a non-HTTP exception, it re-raises, and `wsgi_app`'s own `except Exception` catches it, records it in `error`, and calls [`handle_exception`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L900-L951). That always sends `got_request_exception`, then reads `PROPAGATE_EXCEPTIONS` \u2014 [`None` by default, which resolves to `self.testing or self.debug`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L930-L941), both `False` in this app. So the exception would be logged by [`log_exception`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L953-L967) and the client would get a generic 500 with no traceback \u2014 and that 500 would still go through [`finalize_request(..., from_error_handler=True)`](https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/src/flask/app.py#L943-L951), so after-request hooks and session saving run for error responses too. Then `ctx.pop(error)` would run exactly as above, with the exception passed to every teardown function.\n\n## Out\n\n`pop` returns `None`. The `finally` block ends. The `ClosingIterator` that was built before the finally is returned from `wsgi_app` (trace line 188), from `__call__` (189), and Werkzeug's test machinery iterates it \u2014 with the context already gone \u2014 into `<WrapperTestResponse streamed [200 OK]>`, which `FlaskClient.open` hands back with `response.json_module` set to the app's provider.\n\nThe caller prints `200 OK`, `text/html; charset=utf-8`, and `Hello, World!`.\n\n> **Leaves as:** `<werkzeug.wsgi.ClosingIterator object at 0x10fa1ef90>` yielding `b'Hello, World!'`, surfaced to the scenario as `<WrapperTestResponse streamed [200 OK]>`; the context popped, `_cv_app` reset to no active context, the request closed, and no errors collected.\n"}], "flow": [{"kind": "start", "label": "The caller runs the intended use", "chapter": null}, {"kind": "step", "fn": "Flask.__init__", "file": "src/flask/app.py", "line": 311, "end": 364, "depth": 1, "returned": "None", "chapter": 1}, {"kind": "step", "fn": "App.__init__", "file": "src/flask/sansio/app.py", "line": 279, "end": 408, "depth": 2, "returned": "None", "chapter": 1}, {"kind": "step", "fn": "Scaffold.__init__", "file": "src/flask/sansio/scaffold.py", "line": 75, "end": 215, "depth": 3, "returned": "None", "chapter": 1}, {"kind": "step", "fn rove debugging\n        information and a lot more.\n\n        So it's important what you provide there.  If you are using a single\n        module, `__name__` is always the correct value.  If you however are\n        using a package, it's usually recommended to hardcode the name of\n        your package there.\n\n        For example if your application is defined in :file:`yourapplication/app.py`\n        you should create it with one of the two versions below::\n\n            app = Flask('yourapplication')\n            app = Flask(__name__.split('.')[0])\n\n        Why is that?  The application will work even with `__name__`, thanks\n        to how resources are looked up.  However it will make debugging more\n        painful.  Certain extensions can make assumptions based on the\n        import name of your application.  For example the Flask-SQLAlchemy\n        extension will look for the code in your application that triggered\n        an SQL query in debug mode.  If the import name is not properly set\n        up, that debugging information is lost.  (For example it would only\n        pick up SQL queries in `yourapplication.app` and not\n        `yourapplication.views.frontend`)\n\n    .. versionadded:: 0.7\n       The `static_url_path`, `static_folder`, and `template_folder`\n       parameters were added.\n\n    .. versionadded:: 0.8\n       The `instance_path` and `instance_relative_config` parameters were\n       added.\n\n    .. versionadded:: 0.11\n       The `root_path` parameter was added.\n\n    .. versionadded:: 1.0\n       The ``host_matching`` and ``static_host`` parameters were added.\n\n    .. versionadded:: 1.0\n       The ``subdomain_matching`` parameter was added. Subdomain\n       matching needs to be enabled manually now. Setting\n       :data:`SERVER_NAME` does not implicitly enable it.\n\n    :param import_name: the name of the application package\n    :param static_url_path: can be used to specify a different path for the\n ": None,\n            \"PERMANENT_SESSION_LIFETIME\": timedelta(days=31),\n            \"USE_X_SENDFILE\": False,\n            \"TRUSTED_HOSTS\": None,\n            \"SERVER_NAME\": None,\n            \"APPLICATION_ROOT\": \"/\",\n            \"SESSION_COOKIE_NAME\": \"session\",\n            \"SESSION_COOKIE_DOMAIN\": None,\n            \"SESSION_COOKIE_PATH\": None,\n            \"SESSION_COOKIE_HTTPONLY\": True,\n            \"SESSION_COOKIE_SECURE\": False,\n            \"SESSION_COOKIE_PARTITIONED\": False,\n            \"SESSION_COOKIE_SAMESITE\": None,\n            \"SESSION_REFRESH_EACH_REQUEST\": True,\n            \"MAX_CONTENT_LENGTH\": None,\n            \"MAX_FORM_MEMORY_SIZE\": 500_000,\n            \"MAX_FORM_PARTS\": 1_000,\n            \"SEND_FILE_MAX_AGE_DEFAULT\": None,\n            \"TRAP_BAD_REQUEST_ERRORS\": None,\n            \"TRAP_HTTP_EXCEPTIONS\": False,\n            \"EXPLAIN_TEMPLATE_LOADING\": False,\n            \"PREFERRED_URL_SCHEME\": \"http\",\n            \"TEMPLATES_AUTO_RELOAD\": None,\n            \"MAX_COOKIE_SIZE\": 4093,\n            \"PROVIDE_AUTOMATIC_OPTIONS\": True,\n        }\n    )\n\n    #: The class that is used for request objects.  See :class:`~flask.Request`\n    #: for more information.\n    request_class: type[Request] = Request\n\n    #: The class that is used for response objects.  See\n    #: :class:`~flask.Response` for more information.\n    response_class: type[Response] = Response\n\n    #: the session interface to use.  By default an instance of\n    #: :class:`~flask.sessions.SecureCookieSessionInterface` is used here.\n    #:\n    #: .. versionadded:: 0.8\n    session_interface: SessionInterface = SecureCookieSessionInterface()\n\n    def __init_subclass__(cls, **kwargs: t.Any) -> None:\n        import warnings\n\n        # These method signatures were updated to take a ctx param. Detect\n        # overridden methods in subclasses that still have the old signature.\n        # Show a deprecation warning
