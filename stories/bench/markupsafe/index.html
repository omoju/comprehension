 "Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')", "chapter": 6}, {"kind": "decision", "line": 125, "end": 126, "question": "hasattr(object, '__html__')", "answer": "yes", "side": "no", "exit": "if encoding is None:", "file": "src/markupsafe/__init__.py", "chapter": 6}, {"kind": "data", "label": "Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')", "chapter": 6}, {"kind": "step", "fn": "Markup.striptags", "file": "src/markupsafe/__init__.py", "line": 199, "end": 228, "depth": 1, "returned": "'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'", "chapter": 6}, {"kind": "decision", "line": 221, "end": 222, "question": "(end := value.find('>', start)) == -1", "answer": "no", "side": "yes", "exit": "break", "file": "src/markupsafe/__init__.py", "chapter": 6}, {"kind": "step", "fn": "Markup.unescape", "file": "src/markupsafe/__init__.py", "line": 188, "end": 197, "depth": 2, "returned": "'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'", "chapter": 6}, {"kind": "data", "label": "'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'", "chapter": 6}, {"kind": "step", "fn": "Markup.__new__", "file": "src/markupsafe/__init__.py", "line": 122, "end": 131, "depth": 1, "returned": "Markup('<p>User: <a href=\"/user/3\"><sp...(document.cookie);&lt;/script&gt;<\/p>')", "chapter": 6}, {"kind": "decision", "line": 125, "end": 126, "question": "hasattr(object, '__html__')", "answer": "yes", "side": "no", "exit": "if encoding is None:", "file": "src/markupsafe/__init__.py", "chapter": 6}, {"kind": "data", "label": "Markup('<p>User: <a href=\"/user/3\"><sp...(document.cookie);&lt;/script&gt;<\/p>')", "chapter": 6}, {"kind": "end", "label": "The caller holds Markup('<p>User: <a href=\"/user/3\"><sp...(document.cookie);&lt;/script&gt;<\/p>')", "chapter": null}], "files": {"CHANGES.rst": "Version 3.1.0\n-------------\n\nUnreleased\n\n-   Drop support for Python 3.9.\n-   Remove previously deprecated code.\n\n\nVersion 3.0.3\n-------------\n\nReleased 2025-09-27\n\n-   ``__version__`` raises ``DeprecationWarning`` instead of ``UserWarning``.\n    :issue:`487`\n-   Adopt multi-phase initialisation (:pep:`489`) for the C extension.\n    :issue:`494`\n-   Build Windows ARM64 wheels. :issue:`485`\n-   Build Python 3.14 wheels. :issue:`503`\n-   Build riscv64 wheels. :issue:`505`\n\n\nVersion 3.0.2\n-------------\n\nReleased 2024-10-18\n\n-   Fix compatibility when ``__str__`` returns a ``str`` subclass. :issue:`472`\n-   Build requires setuptools >= 70.1. :issue:`475`\n\n\nVersion 3.0.1\n-------------\n\nReleased 2024-10-08\n\n-   Address compiler warnings that became errors in GCC 14. :issue:`466`\n-   Fix compatibility with proxy objects. :issue:`467`\n\n\nVersion 3.0.0\n-------------\n\nReleased 2024-10-07\n\n-   Support Python 3.13 and its experimental free-threaded build. :pr:`461`\n-   Drop support for Python 3.7 and 3.8.\n-   Use modern packaging metadata with ``pyproject.toml`` instead of ``setup.cfg``.\n    :pr:`348`\n-   Change ``distutils`` imports to ``setuptools``. :pr:`399`\n-   Use deferred evaluation of annotations. :pr:`400`\n-   Update signatures for ``Markup`` methods to match ``str`` signatures. Use\n    positional-only arguments. :pr:`400`\n-   Some ``str`` methods on ``Markup`` no longer escape their argument:\n    ``strip``, ``lstrip``, ``rstrip``, ``removeprefix``, ``removesuffix``,\n    ``partition``, and ``rpartition``; ``replace`` only escapes its ``new``\n    argument. These methods are conceptually linked to search methods such as\n    ``in``, ``find``, and ``index``, which already do not escape their argument.\n    :issue:`401`\n-   The ``__version__`` attribute is deprecated. Use feature detection, or\n    ``importlib.metadata.version(\"markupsafe\")``, instead. :pr:`402`\n-   Speed up escaping plain strings by 40%. :pr:`434`\n-   Simplify speedups implementation. :pr:`437`\n\n\nVersion 2.1.5\n-------------\n\nReleased 2024-02-02\n\n-   Fix ``striptags`` not collapsing spaces. :issue:`417`\n\n\nVersion 2.1.4\n-------------\n\nReleased 2024-01-19\n\n-   Don't use regular expressions for ``striptags``, avoiding a performance\n    issue. :pr:`413`\n\n\nVersion 2.1.3\n-------------\n\nReleased 2023-06-02\n\n-   Implement ``format_map``, ``casefold``, ``removeprefix``, and ``removesuffix``\n    methods. :issue:`370`\n-   Fix static typing for basic ``str`` methods on ``Markup``. :issue:`358`\n-   Use ``Self`` for annotating return types. :pr:`379`\n\n\nVersion 2.1.2\n-------------\n\nReleased 2023-01-17\n\n-   Fix ``striptags`` not stripping tags containing newlines.\n    :issue:`310`\n\n\nVersion 2.1.1\n-------------\n\nReleased 2022-03-14\n\n-   Avoid ambiguous regex matches in ``striptags``. :pr:`293`\n\n\nVersion 2.1.0\n-------------\n\nReleased 2022-02-17\n\n-   Drop support for Python 3.6. :pr:`262`\n-   Remove ``soft_unicode``, which was previously deprecated. Use\n    ``soft_str`` instead. :pr:`261`\n-   Raise error on missing single placeholder during string\n    interpolation. :issue:`225`\n-   Disable speedups module for GraalPython. :issue:`277`\n\n\nVersion 2.0.1\n-------------\n\nReleased 2021-05-18\n\n-   Mark top-level names as exported so type checking understands\n    imports in user projects. :pr:`215`\n-   Fix some types that weren't available in Python 3.6.0. :pr:`215`\n\n\nVersion 2.0.0\n-------------\n\nReleased 2021-05-11\n\n-   Drop Python 2.7, 3.4, and 3.5 support.\n-   ``Markup.unescape`` uses :func:`html.unescape` to support HTML5\n    character references. :pr:`117`\n-   Add type annotations for static typing tools. :pr:`149`\n\n\nVersion 1.1.1\n-------------\n\nReleased 2019-02-23\n\n-   Fix segfault when ``__html__`` method raises an exception when using\n    the C speedups. The exception is now propagated correctly. :pr:`109`\n\n\nVersion 1.1.0\n-------------\n\nReleased 2018-11-05\n\n-   Drop support for Python 2.6 and 3.3.\n-   Build wheels for Linux, Mac, and Windows, allowing systems without\n    a compiler to take advantage of the C extension speedups. :pr:`104`\n-   Use newer CPython API on Python 3, resulting in a 1.5x speedup.\n    :pr:`64`\n-   ``escape`` wraps ``__html__`` result in ``Markup``, consistent with\n    documented behavior. :pr:`69`\n\n\nVersion 1.0\n-----------\n\nReleased 2017-03-07\n\n-   Fixed custom types not invoking ``__unicode__`` when used with\n    ``format()``.\n-   Added ``__version__`` module attribute.\n-   Improve unescape code to leave lone ampersands alone.\n\n\nVersion 0.18\n------------\n\nReleased 2013-05-22\n\n-   Fixed ``__mul__`` and string splitting on Python 3.\n\n\nVersion 0.17\n------------\n\nReleased 2013-05-21\n\n-   Fixed a bug with broken interpolation on tuples.\n\n\nVersion 0.16\n------------\n\nReleased 2013-05-20\n\n-   Improved Python 3 Support and removed 2to3.\n-   Removed support for Python 3.2 and 2.5.\n\n\nVersion 0.15\n------------\n\nReleased 2011-07-20\n\n-   Fixed a typo that caused the library to fail to install on pypy and\n    jython.\n\n\nVersion 0.14\n------------\n\nReleased 2011-07-20\n\n-   Release fix for 0.13.\n\n\nVersion 0.13\n------------\n\nReleased 2011-07-20\n\n-   Do not attempt to compile extension for PyPy or Jython.\n-   Work around some 64bit Windows issues.\n\n\nVersion 0.12\n------------\n\nReleased 2011-02-17\n\n-   Improved PyPy compatibility.\n", "docs/formatting.rst": ".. currentmodule:: markupsafe\n\nString Formatting\n=================\n\nThe :class:`Markup` class can be used as a format string. Objects\nformatted into a markup string will be escaped first.\n\n\nFormat Method\n-------------\n\nThe ``format`` method extends the standard :meth:`str.format` behavior\nto use an ``__html_format__`` method.\n\n#.  If an object has an ``__html_format__`` method, it is called as a\n    replacement for the ``__format__`` method. It is passed a format\n    specifier if it's given. The method must return a string or\n    :class:`Markup` instance.\n\n#.  If an object has an ``__html__`` method, it is called. If a format\n    specifier was passed and the class defined ``__html__`` but not\n    ``__html_format__``, a ``ValueError`` is raised.\n\n#.  Otherwise Python's default format behavior is used and the result\n    is escaped.\n\nFor example, to implement a ``User`` that wraps its ``name`` in a\n``span`` tag, and adds a link when using the ``\"link\"`` format\nspecifier:\n\n.. code-block:: python\n\n    class User(object):\n        def __init__(self, id, name):\n            self.id = id\n            self.name = name\n\n        def __html_format__(self, format_spec):\n            if format_spec == \"link\":\n                return Markup(\n                    '<a href=\"/user/{}\">{}<\/a>'\n                ).format(self.id, self.__html__())\n            elif format_spec:\n                raise ValueError(\"Invalid format spec\")\n            return self.__html__()\n\n        def __html__(self):\n            return Markup(\n                '<span class=\"user\">{0}<\/span>'\n            ).format(self.name)\n\n\n.. code-block:: pycon\n\n    >>> user = User(3, \"<script>\")\n    >>> escape(user)\n    Markup('<span class=\"user\">&lt;script&gt;<\/span>')\n    >>> Markup(\"<p>User: {user:link}\").format(user=user)\n    Markup('<p>User: <a href=\"/user/3\"><span class=\"user\">&lt;script&gt;<\/span><\/a>\n\nSee Python's docs on :ref:`format string syntax <python:formatstrings>`.\n\n\nprintf-style Formatting\n-----------------------\n\nBesides escaping, there's no special behavior involved with percent\nformatting.\n\n.. code-block:: pycon\n\n    >>> user = User(3, \"<script>\")\n    >>> Markup('<a href=\"/user/%d\">%s<\/a>') % (user.id, user.name)\n    Markup('<a href=\"/user/3\">&lt;script&gt;<\/a>')\n\nSee Python's docs on :ref:`printf-style formatting <python:old-string-formatting>`.\n", "docs/html.rst": ".. currentmodule:: markupsafe\n\nHTML Representations\n====================\n\nIn many frameworks, if a class implements an ``__html__`` method it\nwill be used to get the object's representation in HTML. MarkupSafe's\n:func:`escape` function and :class:`Markup` class understand and\nimplement this method. If an object has an ``__html__`` method it will\nbe called rather than converting the object to a string, and the result\nwill be assumed safe and not escaped.\n\nFor example, an ``Image`` class might automatically generate an\n``<img>`` tag:\n\n.. code-block:: python\n\n    class Image:\n        def __init__(self, url):\n            self.url = url\n\n        def __html__(self):\n            return f'<img src=\"{self.url}\">'\n\n.. code-block:: pycon\n\n    >>> img = Image(\"/static/logo.png\")\n    >>> Markup(img)\n    Markup('<img src=\"/static/logo.png\">')\n\nSince this bypasses escaping, you need to be careful about using\nuser-provided data in the output. For example, a user's display name\nshould still be escaped:\n\n.. code-block:: python\n\n    class User:\n        def __init__(self, id, name):\n            self.id = id\n            self.name = name\n\n        def __html__(self):\n            return f'<a href=\"/user/{self.id}\">{escape(self.name)}<\/a>'\n\n.. code-block:: pycon\n\n    >>> user = User(3, \"<script>\")\n    >>> escape(user)\n    Markup('<a href=\"/users/3\">&lt;script&gt;<\/a>')\n", "src/markupsafe/__init__.py": "from __future__ import annotations\n\nimport collections.abc as cabc\nimport string\nimport typing as t\n\ntry:\n    from ._speedups import _escape_inner\nexcept ImportError:\n    from ._native import _escape_inner\n\nif t.TYPE_CHECKING:\n    import typing_extensions as te\n\n\nclass _HasHTML(t.Protocol):\n    def __html__(self, /) -> str: ...\n\n\nclass _TPEscape(t.Protocol):\n    def __call__(self, s: t.Any, /) -> Markup: ...\n\n\ndef escape(s: t.Any, /) -> Markup:\n    \"\"\"Replace the characters ``&``, ``<``, ``>``, ``'``, and ``\"`` in\n    the string with HTML-safe sequences. Use this if you need to display\n    text that might contain such characters in HTML.\n\n    If the object has an ``__html__`` method, it is called and the\n    return value is assumed to already be safe for HTML.\n\n    :param s: An object to be converted to a string and escaped.\n    :return: A :class:`Markup` string with the escaped text.\n    \"\"\"\n    # If the object is already a plain string, skip __html__ check and string\n    # conversion. This is the most common use case.\n    # Use type(s) instead of s.__class__ because a proxy object may be reporting\n    # the __class__ of the proxied value.\n    if type(s) is str:\n        return Markup(_escape_inner(s))\n\n    if hasattr(s, \"__html__\"):\n        return Markup(s.__html__())\n\n    return Markup(_escape_inner(str(s)))\n\n\ndef escape_silent(s: t.Any | None, /) -> Markup:\n    \"\"\"Like :func:`escape` but treats ``None`` as the empty string.\n    Useful with optional values, as otherwise you get the string\n    ``'None'`` when the value is ``None``.\n\n    >>> escape(None)\n    Markup('None')\n    >>> escape_silent(None)\n    Markup('')\n    \"\"\"\n    if s is None:\n        return Markup()\n\n    return escape(s)\n\n\ndef soft_str(s: t.Any, /) -> str:\n    \"\"\"Convert an object to a string if it isn't already. This preserves\n    a :class:`Markup` string rather than converting it back to a basic\n    string, so it will still be marked as safe and won't be escaped\n    again.\n\n    >>> value = escape(\"<User 1>\")\n    >>> value\n    Markup('&lt;User 1&gt;')\n    >>> escape(str(value))\n    Markup('&amp;lt;User 1&amp;gt;')\n    >>> escape(soft_str(value))\n    Markup('&lt;User 1&gt;')\n    \"\"\"\n    if not isinstance(s, str):\n        return str(s)\n\n    return s\n\n\nclass Markup(str):\n    \"\"\"A string that is ready to be safely inserted into an HTML or XML\n    document, either because it was escaped or because it was marked\n    safe.\n\n    Passing an object to the constructor converts it to text and wraps\n    it to mark it safe without escaping. To escape the text, use the\n    :meth:`escape` class method instead.\n\n    >>> Markup(\"Hello, <em>World<\/em>!\")\n    Markup('Hello, <em>World<\/em>!')\n    >>> Markup(42)\n    Markup('42')\n    >>> Markup.escape(\"Hello, <em>World<\/em>!\")\n    Markup('Hello &lt;em&gt;World&lt;/em&gt;!')\n\n    This implements the ``__html__()`` interface that some frameworks\n    use. Passing an object that implements ``__html__()`` will wrap the\n    output of that method, marking it safe.\n\n    >>> class Foo:\n    ...     def __html__(self):\n    ...         return '<a href=\"/foo\">foo<\/a>'\n    ...\n    >>> Markup(Foo())\n    Markup('<a href=\"/foo\">foo<\/a>')\n\n    This is a subclass of :class:`str`. It has the same methods, but\n    escapes their arguments and returns a ``Markup`` instance.\n\n    >>> Markup(\"<em>%s<\/em>\") % (\"foo & bar\",)\n    Markup('<em>foo &amp; bar<\/em>')\n    >>> Markup(\"<em>Hello<\/em> \") + \"<foo>\"\n    Markup('<em>Hello<\/em> &lt;foo&gt;')\n    \"\"\"\n\n    __slots__ = ()\n\n    def __new__(\n        cls, object: t.Any = \"\", encoding: str | None = None, errors: str = \"strict\"\n    ) -> te.Self:\n        if hasattr(object, \"__html__\"):\n            object = object.__html__()\n\n        if encoding is None:\n            return super().__new__(cls, object)\n\n        return super().__new__(cls, object, encoding, errors)\n\n    def __html__(self, /) -> te.Self:\n        return self\n\n    def __add__(self, value: str | _HasHTML, /) -> te.Self:\n        if isinstance(value, str) or hasattr(value, \"__html__\"):\n            return self.__class__(super().__add__(self.escape(value)))\n\n        return NotImplemented\n\n    def __radd__(self, value: str | _HasHTML, /) -> te.Self:\n        if isinstance(value, str) or hasattr(value, \"__html__\"):\n            return self.escape(value).__add__(self)\n\n        return NotImplemented\n\n    def __mul__(self, value: t.SupportsIndex, /) -> te.Self:\n        return self.__class__(super().__mul__(value))\n\n    def __rmul__(self, value: t.SupportsIndex, /) -> te.Self:\n        return self.__class__(super().__mul__(value))\n\n    def __mod__(self, value: t.Any, /) -> te.Self:\n        if isinstance(value, tuple):\n            # a tuple of arguments, each wrapped\n            value = tuple(_MarkupEscapeHelper(x, self.escape) for x in value)\n        elif hasattr(type(value), \"__getitem__\") and not isinstance(value, str):\n            # a mapping of arguments, wrapped\n            value = _MarkupEscapeHelper(value, self.escape)\n        else:\n            # a single argument, wrapped with the helper and a tuple\n            value = (_MarkupEscapeHelper(value, self.escape),)\n\n        return self.__class__(super().__mod__(value))\n\n    def __repr__(self, /) -> str:\n        return f\"{self.__class__.__name__}({super().__repr__()})\"\n\n    def join(self, iterable: cabc.Iterable[str | _HasHTML], /) -> te.Self:\n        return self.__class__(super().join(map(self.escape, iterable)))\n\n    def split(  # type: ignore[override]\n        self, /, sep: str | None = None, maxsplit: t.SupportsIndex = -1\n    ) -> list[te.Self]:\n        return [self.__class__(v) for v in super().split(sep, maxsplit)]\n\n    def rsplit(  # type: ignore[override]\n        self, /, sep: str | None = None, maxsplit: t.SupportsIndex = -1\n    ) -> list[te.Self]:\n        return [self.__class__(v) for v in super().rsplit(sep, maxsplit)]\n\n    def splitlines(  # type: ignore[override]\n        self, /, keepends: bool = False\n    ) -> list[te.Self]:\n        return [self.__class__(v) for v in super().splitlines(keepends)]\n\n    def unescape(self, /) -> str:\n        \"\"\"Convert escaped markup back into a text string. This replaces\n        HTML entities with the characters they represent.\n\n        >>> Markup(\"Main &raquo; <em>About<\/em>\").unescape()\n        'Main \u00bb <em>About<\/em>'\n        \"\"\"\n        from html import unescape\n\n        return unescape(str(self))\n\n    def striptags(self, /) -> str:\n        \"\"\":meth:`unescape` the markup, remove tags, and normalize\n        whitespace to single spaces.\n\n        >>> Markup(\"Main &raquo;\\t<em>About<\/em>\").striptags()\n        'Main \u00bb About'\n        \"\"\"\n        value = str(self)\n\n        # Look for comments then tags separately. Otherwise, a comment that\n        # contains a tag would end early, leaving some of the comment behind.\n\n        # keep finding comment start marks\n        while (start := value.find(\"<!--\")) != -1:\n            # find a comment end mark beyond the start, otherwise stop\n            if (end := value.find(\"-->\", start)) == -1:\n                break\n\n            value = f\"{value[:start]}{value[end + 3 :]}\"\n\n        # remove tags using the same method\n        while (start := value.find(\"<\")) != -1:\n            if (end := value.find(\">\", start)) == -1:\n                break\n\n            value = f\"{value[:start]}{value[end + 1 :]}\"\n\n        # collapse spaces\n        value = \" \".join(value.split())\n        return self.__class__(value).unescape()\n\n    @classmethod\n    def escape(cls, s: t.Any, /) -> te.Self:\n        \"\"\"Escape a string. Calls :func:`escape` and ensures that for\n        subclasses the correct type is returned.\n        \"\"\"\n        rv = escape(s)\n\n        if rv.__class__ is not cls:\n            return cls(rv)\n\n        return rv  # type: ignore[return-value]\n\n    def __getitem__(self, key: t.SupportsIndex | slice, /) -> te.Self:\n        return self.__class__(super().__getitem__(key))\n\n    def capitalize(self, /) -> te.Self:\n        return self.__class__(super().capitalize())\n\n    def title(self, /) -> te.Self:\n        return self.__class__(super().title())\n\n    def lower(self, /) -> te.Self:\n        return self.__class__(super().lower())\n\n    def upper(self, /) -> te.Self:\n        return self.__class__(super().upper())\n\n    def replace(self, old: str, new: str, count: t.SupportsIndex = -1, /) -> te.Self:\n        return self.__class__(super().replace(old, self.escape(new), count))\n\n    def ljust(self, width: t.SupportsIndex, fillchar: str = \" \", /) -> te.Self:\n        return self.__class__(super().ljust(width, self.escape(fillchar)))\n\n    def rjust(self, width: t.SupportsIndex, fillchar: str = \" \", /) -> te.Self:\n        return self.__class__(super().rjust(width, self.escape(fillchar)))\n\n    def lstrip(self, chars: str | None = None, /) -> te.Self:\n        return self.__class__(super().lstrip(chars))\n\n    def rstrip(self, chars: str | None = None, /) -> te.Self:\n        return self.__class__(super().rstrip(chars))\n\n    def center(self, width: t.SupportsIndex, fillchar: str = \" \", /) -> te.Self:\n        return self.__class__(super().center(width, self.escape(fillchar)))\n\n    def strip(self, chars: str | None = None, /) -> te.Self:\n        return self.__class__(super().strip(chars))\n\n    def translate(\n        self,\n        table: cabc.Mapping[int, str | int | None],  # type: ignore[override]\n        /,\n    ) -> str:\n        return self.__class__(super().translate(table))\n\n    def expandtabs(self, /, tabsize: t.SupportsIndex = 8) -> te.Self:\n        return self.__class__(super().expandtabs(tabsize))\n\n    def swapcase(self, /) -> te.Self:\n        return self.__class__(super().swapcase())\n\n    def zfill(self, width: t.SupportsIndex, /) -> te.Self:\n        return self.__class__(super().zfill(width))\n\n    def casefold(self, /) -> te.Self:\n        return self.__class__(super().casefold())\n\n    def removeprefix(self, prefix: str, /) -> te.Self:\n        return self.__class__(super().removeprefix(prefix))\n\n    def removesuffix(self, suffix: str) -> te.Self:\n        return self.__class__(super().removesuffix(suffix))\n\n    def partition(self, sep: str, /) -> tuple[te.Self, te.Self, te.Self]:\n        left, sep, right = super().partition(sep)\n        cls = self.__class__\n        return cls(left), cls(sep), cls(right)\n\n    def rpartition(self, sep: str, /) -> tuple[te.Self, te.Self, te.Self]:\n        left, sep, right = super().rpartition(sep)\n        cls = self.__class__\n        return cls(left), cls(sep), cls(right)\n\n    def format(self, *args: t.Any, **kwargs: t.Any) -> te.Self:\n        formatter = EscapeFormatter(self.escape)\n        return self.__class__(formatter.vformat(self, args, kwargs))\n\n    def format_map(\n        self,\n        mapping: cabc.Mapping[str, t.Any],  # type: ignore[override]\n        /,\n    ) -> te.Self:\n        formatter = EscapeFormatter(self.escape)\n        return self.__class__(formatter.vformat(self, (), mapping))\n\n    def __html_format__(self, format_spec: str, /) -> te.Self:\n        if format_spec:\n            raise ValueError(\"Unsupported format specification for Markup.\")\n\n        return self\n\n\nclass EscapeFormatter(string.Formatter):\n    __slots__ = (\"escape\",)\n\n    def __init__(self, escape: _TPEscape) -> None:\n        self.escape: _TPEscape = escape\n        super().__init__()\n\n    def format_field(self, value: t.Any, format_spec: str) -> str:\n        if hasattr(value, \"__html_format__\"):\n            rv = value.__html_format__(format_spec)\n        elif hasattr(value, \"__html__\"):\n            if format_spec:\n                raise ValueError(\n                    f\"Format specifier {format_spec} given, but {type(value)} does not\"\n                    \" define __html_format__. A class that defines __html__ must define\"\n                    \" __html_format__ to work with format specifiers.\"\n                )\n            rv = value.__html__()\n        else:\n            # We need to make sure the format spec is str here as\n            # otherwise the wrong callback methods are invoked.\n            rv = super().format_field(value, str(format_spec))\n        return str(self.escape(r <script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const short = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const permalink = (path, a, b) => `${D.repo.url}/blob/${D.repo.commit}/${path}#L${a}` + (b && b !== a ? `-L${b}` : "");

$("meta").textContent = `${D.repo.name} @ ${D.repo.commit.slice(0, 7)} · written for the ${D.reader}`;
$("title").textContent = D.title;
$("premise").innerHTML = marked.parseInline(D.premise);

// ---- flowchart: laid out top to bottom on one spine; roads not taken exit to the right
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
function wrap(text, width) {  // monospace, so characters are a fair measure
  const out = []; let line = "";
  for (let word of String(text).split(/(?<=[ .,(])/)) {
    if ((line + word).length > width && line) { out.push(line.trimEnd()); line = ""; }
    while (word.length > width && !line) { out.push(word.slice(0, width)); word = word.slice(width); }
    line += word;
  }
  if (line) out.push(line.trimEnd());
  return out;
}
const svg = $("chart");
const CX = 112, BOX = 210, SIDE_X = 240, SIDE_W = 136, GAP = 26;
const bandOf = {}; let y = 10, prevBottom = null, prevChapter = undefined;
const defs = el("defs", {}, svg);
for (const [id, cls] of [["arrow", ""], ["dash", ""]]) {
  const m = el("marker", { id, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L8,4 L0,8 z" }, m);
}
const bandsLayer = el("g", {}, svg), wires = el("g", {}, svg), nodes = el("g", {}, svg);
const chapterTitle = Object.fromEntries(D.chapters.map((c) => [c.n, c]));
function textLines(g, lines, x, y0, anchor, cls) {
  lines.forEach((t, i) => { const e = el("text", { x, y: y0 + i * 13, "text-anchor": anchor }, g); if (cls) e.setAttribute("class", cls); e.textContent = t; });
}
function connect(fromY, toY, label) {
  el("line", { x1: CX, y1: fromY, x2: CX, y2: toY - 1, class: "wire", "marker-end": "url(#arrow)" }, wires);
  if (label) { const t = el("text", { x: CX + 6, y: fromY + 14, class: "ans" }, wires); t.textContent = label; }
}
let pendingLabel = null;
for (const it of D.flow) {
  if (it.chapter !== prevChapter && it.chapter != null) {  // a chapter starts: open its band
    y += prevBottom == null ? 0 : 8;
    bandOf[it.chapter] = { top: y, bottom: y };
    y += 20;
  }
  if (it.chapter != null) prevChapter = it.chapter;
  const top = y + (prevBottom == null ? 0 : GAP);
  const g = el("g", { class: "node", tabindex: 0 }, nodes);
  let h;
  if (it.kind === "start" || it.kind === "end") {
    const lines = wrap(it.label, 30); h = 14 + lines.length * 13;
    g.classList.add("term");
    el("rect", { x: CX - BOX / 2, y: top, width: BOX, height: h, rx: h / 2, class: "shape" }, g);
    textLines(g, lines, CX, top + 17, "middle");
  } else if (it.kind === "data") {
    const lines = wrap(it.label, 28).slice(0, 3); h = 14 + lines.length * 13;
    g.classList.add("data");
    const k = 10;
    el("path", { d: `M${CX - BOX / 2 + k},${top} H${CX + BOX / 2} L${CX + BOX / 2 - k},${top + h} H${CX - BOX / 2} Z`, class: "shape" }, g);
    textLines(g, lines, CX, top + 17, "middle");
    g.onclick = () => {};
  } else if (it.kind === "step") {
    const name = it.fn.length > 28 && it.fn.includes(".") ? [it.fn.slice(0, it.fn.lastIndexOf(".")), it.fn.slice(it.fn.lastIndexOf("."))] : wrap(it.fn, 28);
    const val = it.returned && it.returned !== "None" ? ["→ " + (it.returned.length > 26 ? it.returned.slice(0, 25) + "…" : it.returned)] : [];
    h = 12 + (name.length + val.length) * 13;
    el("rect", { x: CX - BOX / 2, y: top, width: BOX, height: h, rx: 3, class: "shape" }, g);
    textLines(g, name, CX, top + 16, "middle");
    textLines(g, val, CX, top + 16 + name.length * 13, "middle", "val");
    const title = el("title", {}, g); title.textContent = `${it.fn}  (${it.file}:${it.line})` + (it.returned ? `\nreturns ${it.returned}` : "");
    g.onclick = () => { showCode(it.file, it.line, it.end); if (it.chapter) $("ch-" + it.chapter).scrollIntoView(); };
  } else {  // decision
    let lines = wrap(it.question, 16);
    if (lines.length > 3) lines = [...lines.slice(0, 2), lines[2].slice(0, 15) + "…"];
    h = 34 + lines.length * 13;
    const hw = 100;
    el("path", { d: `M${CX},${top} L${CX + hw},${top + h / 2} L${CX},${top + h} L${CX - hw},${top + h / 2} Z`, class: "shape" }, g);
    textLines(g, lines, CX, top + h / 2 - (lines.length - 1) * 6 + 4, "middle");
    // the road not taken
    const ex = el("g", { class: "exit" }, g);
    const exitLines = wrap(it.exit, 20).slice(0, 3);
    const eh = 10 + exitLines.length * 13, ey = top + h / 2 - eh / 2;
    el("path", { d: `M${CX + hw},${top + h / 2} H${SIDE_X - 1}`, class: "road", "marker-end": "url(#dash)" }, ex);
    const sa = el("text", { x: CX + hw + 5, y: top + h / 2 - 5, class: "ans side" }, ex); sa.textContent = it.side;
    el("rect", { x: SIDE_X, y: ey, width: SIDE_W, height: eh, rx: 3 }, ex);
    textLines(ex, exitLines, SIDE_X + 6, ey + 15, "start");
    sa.setAttribute("x", CX + hw + 3);
    const title = el("title", {}, g); title.textContent = `${it.question}\ntaken: ${it.answer}\notherwise (${it.side}): ${it.exit}\n${it.file}:${it.line}`;
    g.onclick = () => { showCode(it.file, it.line, it.end); if (it.chapter) $("ch-" + it.chapter).scrollIntoView(); };
  }
  if (prevBottom != null) connect(prevBottom, top, pendingLabel);
  pendingLabel = it.kind === "decision" ? it.answer : null;
  if (pendingLabel && pendingLabel.length > 18) pendingLabel = pendingLabel.slice(0, 17) + "…";
  prevBottom = top + h; y = prevBottom;
  if (it.chapter != null && bandOf[it.chapter]) bandOf[it.chapter].bottom = y;
}
y += 12;
for (const [n, b] of Object.entries(bandOf)) {
  const ch = chapterTitle[n];
  const g = el("g", { class: "band" + (ch && ch.md ? "" : " unwritten"), id: "band-" + n }, bandsLayer);
  el("rect", { x: 0, y: b.top, width: 380, height: b.bottom - b.top + 8, rx: 6 }, g);
  const t = el("text", { x: 6, y: b.top + 14 }, g);
  t.textContent = `${n} · ${ch ? (ch.title.length > 48 ? ch.title.slice(0, 47) + "…" : ch.title) : ""}`;
  g.style.cursor = "pointer";
  g.onclick = () => $("ch-" + n).scrollIntoView();
}
svg.setAttribute("viewBox", `0 0 380 ${y}`);
svg.setAttribute("height", y);

// ---- story
const story = $("story");
const cite = new RegExp(D.repo.url.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "/blob/[0-9a-f]+/([^#]+)#L(\\d+)(?:-L(\\d+))?");
for (const ch of D.chapters) {
  const sec = document.createElement("section");
  sec.className = "chapter"; sec.id = "ch-" + ch.n; sec.dataset.n = ch.n;
  const prose = document.createElement("div"); prose.className = "prose";
  if (ch.md) {
    prose.innerHTML = marked.parse(ch.md);
    for (const q of prose.querySelectorAll("blockquote")) {  // "**For the owner:** …" callouts
      const lead = q.querySelector("p > strong:first-child");
      if (lead && /^for the /i.test(lead.textContent)) q.classList.add("aside");
    }
    for (const a of prose.querySelectorAll("a[href]")) {
      const m = a.getAttribute("href").match(cite);
      if (!m) { a.target = "_blank"; a.rel = "noopener"; continue; }
      a.className = "cite";
      a.dataset.path = m[1]; a.dataset.a = m[2]; a.dataset.b = m[3] || m[2];
      a.onclick = (e) => { e.preventDefault(); pick(a, true); };
    }
  } else {
    prose.innerHTML = `<h1></h1><div class="pending">This chapter is planned but not written yet.<div class="io"></div></div>`;
    prose.querySelector("h1").textContent = `Chapter ${ch.n} · ${ch.title}`;
    prose.querySelector(".io").textContent = `enters as ${ch.data_in}\nleaves as ${ch.data_out}`;
  }
  sec.append(prose);
  story.append(sec);
}

// ---- code panel
const panel = $("code");
let pinned = null;
function showCode(path, a, b) {
  a = +a; b = +b;
  const src = D.files[path];
  $("where").textContent = `${path}:${a}${b !== a ? "-" + b : ""}`;
  $("gh").href = permalink(path, a, b);
  const body = $("codebody");
  body.textContent = "";
  if (src === undefined) { body.innerHTML = '<div class="code-empty">This file is not part of the repository snapshot.</div>'; return; }
  const frag = document.createDocumentFragment();
  src.split("\n").forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "ln" + (i + 1 >= a && i + 1 <= b ? " hl" : "");
    const n = document.createElement("span"); n.textContent = i + 1;
    const t = document.createElement("span"); t.textContent = text || " ";
    row.append(n, t); frag.append(row);
  });
  body.append(frag);
  const first = body.children[Math.max(0, a - 1)];
  if (first) body.scrollTop += first.getBoundingClientRect().top - body.getBoundingClientRect().top - body.clientHeight * 0.3;
  panel.classList.add("open");
}
function pick(a, byClick) {
  document.querySelectorAll("a.cite.on").forEach((x) => x.classList.remove("on"));
  a.classList.add("on");
  if (byClick) pinned = a.closest("p, li, td, blockquote");
  showCode(a.dataset.path, a.dataset.a, a.dataset.b);
}
$("close").onclick = () => panel.classList.remove("open");

// ---- follow the reader: current chapter on the map, current paragraph's code on the right
const wide = () => window.matchMedia("(min-width: 1361px)").matches;
let current = null, activePara = null;
function follow() {
  const mid = window.innerHeight * 0.4;
  let sec = null;
  for (const s of document.querySelectorAll(".chapter")) { const r = s.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid) sec = s; }
  if (sec && sec.dataset.n !== current) {
    current = sec.dataset.n;
    document.querySelectorAll(".band.active").forEach((b) => b.classList.remove("active"));
    const band = $("band-" + current);
    if (band) {
      band.classList.add("active");
      const map = document.querySelector(".map");
      if (window.matchMedia("(min-width: 761px)").matches) {
        const r = band.getBoundingClientRect(), m = map.getBoundingClientRect();
        if (r.top < m.top || r.top > m.bottom - 80) map.scrollTop += r.top - m.top - 40;
      }
    }
  }
  if (!wide()) return;  // on narrow screens the code opens only when asked
  let para = null;
  for (const p of document.querySelectorAll(".chapter p")) {
    if (!p.querySelector("a.cite")) continue;
    const r = p.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid - 40) { para = p; break; }
  }
  if (para && para !== activePara) {
    if (activePara) activePara.classList.remove("active");
    activePara = para; para.classList.add("active");
    if (pinned !== para) { pinned = null; pick(para.querySelector("a.cite"), false); }
  }
}
let ticking = false;
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; follow(); }); } }, { passive: true });
addEventListener("resize", follow);
follow();
if (wide()) { const first = document.querySelector("a.cite"); if (first && !activePara) pick(first, false); }
</script>
