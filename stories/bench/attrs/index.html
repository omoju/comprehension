<script type="application/json" id="data">{"title": "The Class That Was Rewritten: One Run Through attrs", "premise": "Writing a Python class with a handful of data fields means hand-writing nine or more dunder methods \n\n\n\n `__init__`, `__repr__`, `__eq__`, `__ne__`, ordering, hashing, pickling \n\n\n\n and keeping them in sync forever. *attrs* offers to write them for you. The price is that a decorator gets to inspect your class body at import time and, for slotted classes, hand you back a *different class object* than the one you wrote. This story follows one real run of the README example: a class body with two annotated fields walks into `@define`, comes out as a finished, slotted, unhashable class; an instance of it is compared and serialized to a dict; and finally a second class is conjured at runtime from nothing but two strings. The reader is the person who has to sign off on all of that: what is guaranteed, what is silently decided, and where it can bite.", "reader": "owner", "repo": {"name": "python-attrs/attrs", "url": "https://github.com/python-attrs/attrs", "commit": "8f767776326faaed11e6c2974798787f6e19b343"}, "chapters": [{"n": 1, "title": "The Door, and the Flags That Become Policy", "data_in": "`class SomeClass` with annotations `a_number: int = 42` and `list_of_numbers: list[int] = Factory(list)`, handed to `@define` as `maybe_cls`", "data_out": "`ClassProps(is_exception=False, is_slotted=True, has_weakref_slot=True, is_frozen=False, kw_only=NO, collected_fields_by_mro=True, added_init=True, added_repr=True, added_eq=True, added_ordering=False, hashability=UNHASHABLE, added_match_args=True, added_str=False, added_pickling=True, on_setattr_hook=<wrapped_pipe>, field_transformer=None)`", "span": [2, 30], "md": "# Chapter 1 \u00b7 The Door, and the Flags That Become Policy\n\n> **Enters as:** `class SomeClass` with annotations `a_number: int = 42` and `list_of_numbers: list[int] = Factory(list)`, handed to `@define` as `maybe_cls`\n\nBefore the class exists, one small object is made ready for it. The expression `Factory(list)` in the class body runs first, and all it does is remember: [`self.factory = factory; self.takes_self = takes_self`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3105-L3107). No list is created. `list` is stored as a callable, `takes_self` as `False`, and the object sits in the class body as a stand-in for \"ask me later.\" That \"later\" is six chapters away.\n\nThen Python finishes the class body, builds a plain type object named `SomeClass` with two annotations, one integer, one `Factory`, and one method, and hands it to the decorator.\n\n`define` catches it as `maybe_cls` and immediately passes it to its inner `wrap` ([`return wrap(maybe_cls)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L424-L427)). Everything that happens now happens exactly once, at import time, and the choices made here are frozen into the class for the rest of the program's life.\n\nThe first thing to notice is what the class *didn't* bring with it. The trace shows `define` called with `slots=True, auto_exc=True, auto_detect=True, order=False, force_kw_only=False` \u2014 not because the caller asked, but because those are the [signature defaults of `define`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L23-L47). The modern API is a different set of policies wearing the same machinery as `attr.s`.\n\n`wrap` starts by rewriting one of its own arguments. The caller passed `on_setattr=None`, and the class is not frozen, so [`on_setattr = _DEFAULT_ON_SETATTR`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L399-L401) \u2014 which is [`setters.pipe(setters.convert, setters.validate)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L57-L57). That is the `<function pipe.<locals>.wrapped_pipe>` you see threaded through the rest of the trace. The default for a mutable *attrs* class is that assignment after construction re-runs converters and validators, not just `__init__`.\n\nNext `wrap` looks upward. It walks `cls.__bases__` and checks whether any of them has `__setattr__ is _frozen_setattrs`; if so, the subclass inherits immutability and `on_setattr` is forced to `NO_OP`. But if the caller had *also* asked for a hook, that combination raises instead of silently winning: [`\"Frozen classes can't use on_setattr (frozen-ness was inherited).\"`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L405-L412). `SomeClass` inherits from `object`, so this loop finds nothing and the convert-and-validate hook stands.\n\n> **For the owner:** Mutable classes built with `@define` run converters and validators on *every* attribute assignment, not only in `__init__`. If you need plain assignment semantics for performance or for a field whose setter must not be re-validated, pass `on_setattr=None` or `attrs.setters.NO_OP` explicitly.\n\nThen comes the guess. `auto_attribs` was left at `None`, so *attrs* does not ask \u2014 it tries: [`try: return do_it(cls, True) except UnannotatedAttributeError: return do_it(cls, False)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L414-L420). The entire class build is the thing inside the `try`. This class is fully annotated, so the first attempt succeeds and the fallback never runs; the question of whether a half-built class can escape the failed attempt belongs to the next chapter, where the exception is actually raised.\n\n`do_it` is a translation layer. It forwards everything to the classic [`attrs()`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L362-L387) and hard-codes one thing the old API leaves off by default: `collect_by_mro=True`. Users of `@define` never get the legacy base-class ordering bug.\n\nInside `attrs`, the class is still just an argument. `_determine_attrs_eq_order(None, None, False, None)` returns `(None, False)` \u2014 `eq` stays undecided because its default is `None` here, while `order=False` is already settled ([lines 1266-1281](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1266-L1281)). Then `attrs.wrap` runs the interrogation the trace records step by step:\n\n- `_has_frozen_base_class(cls)` \u2192 `False`: [the check is literally `cls.__setattr__ is _frozen_setattrs`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1626-L1631).\n- `_has_own_attribute(cls, \"__setattr__\")` \u2192 `False`, so there's no custom setter to collide with.\n- `_determine_whether_to_implement(cls, None, True, (\"__eq__\", \"__ne__\"))` \u2192 `True`. With a `None` flag and `auto_detect=True`, this [loops over the dunders and asks `_has_own_attribute`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1339-L1350), which is nothing more than [`attrib_name in cls.__dict__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L313-L317) \u2014 the class's *own* dict, not its MRO.\n- `_has_own_attribute(cls, \"__hash__\")` \u2192 `False`, and then the hashability ladder: `hash` is `None`, the class defines no `__hash__`, `eq` is True but `is_frozen` is False, so the result is `Hashability.UNHASHABLE` ([lines 1506-1518](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1506-L1518)).\n- Three more `_determine_whether_to_implement` calls settle `added_repr`, `added_ordering` (gated by `order_ = False`), and `added_pickling`, whose default is `slots` \u2014 [`default=slots`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1553-L1559) \u2014 so a slotted class gets `__getstate__`/`__setstate__` unless it defines its own.\n\n> **For the owner:** `auto_detect` only looks at the decorated class's own `__dict__`. A hand-written `__eq__`, `__init__`, or `__hash__` on a *base* class does not stop *attrs* from generating and attaching its own on the subclass. Check inheritance hierarchies explicitly when you rely on a base class's dunder behaviour.\n\nAll of that collapses into one object. `ClassProps.__init__` takes sixteen positional settings and [assigns them straight to slots](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3020-L3054). The trace's final call in this span is `ClassProps.is_hashable` \u2192 `False`, consulted by the guard that [rejects `cache_hash=True` on a non-hashable class with a `TypeError`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1564-L1566) before a single method is written. `cache_hash` was `False`, so the road is clear.\n\nThe class has not been touched yet. What exists is a record of intent \u2014 and *attrs* keeps it: the builder will stamp it onto the class as `__attrs_props__`, which is exactly what [`attrs.inspect()`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L674-L678) hands back to anyone who wants to audit what a decorated class actually agreed to.\n\n> **For the owner:** Use `attrs.inspect(TheClass)` in review to read back the sixteen effective settings rather than inferring them from the decorator call. Note that `inspect` is documented as experimental and outside the project's backwards-compatibility guarantee, so do not build production logic on it.\n\n> **Leaves as:** `ClassProps(is_exception=False, is_slotted=True, has_weakref_slot=True, is_frozen=False, kw_only=KeywordOnly.NO, collected_fields_by_mro=True, added_init=True, added_repr=True, added_eq=True, added_ordering=False, hashability=Hashability.UNHASHABLE, added_match_args=True, added_str=False, added_pickling=True, on_setattr_hook=<wrapped_pipe>, field_transformer=None)`\n"}, {"n": 2, "title": "Harvesting the Fields", "data_in": "`_transform_attrs(cls, these=None, auto_attribs=True, kw_only=KeywordOnly.NO, collect_by_mro=True, field_transformer=None)` over a class whose `__dict__` holds `42`, a `Factory`, and a method", "data_out": "`_Attributes(attrs=(Attribute(name='a_number', default=42, type=int, alias='a_number'), Attribute(name='list_of_numbers', default=Factory(list), type=list[int], alias='list_of_numbers')), base_attrs=[], base_attrs_map={})` wrapped in a generated `SomeClassAttributes` tuple subclass", "span": [31, 68], "md": "# Chapter 2 \u00b7 Harvesting the Fields\n\n> **Enters as:** `_transform_attrs(cls, these=None, auto_attribs=True, kw_only=KeywordOnly.NO, collect_by_mro=True, field_transformer=None)` over a class whose `__dict__` holds `42`, a `Factory`, and a method\n\nThe `ClassProps` record from the last chapter is handed, along with the class itself, to `_ClassBuilder.__init__`. Before the builder assigns a single one of its own slots, it [calls `_transform_attrs`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L684-L691) with five of those settings unpacked. This is the only place where *attrs* reads the class body, and everything downstream \u2014 the `__init__` signature, the `__repr__`, the slots \u2014 is built from what comes back.\n\nThe first two lines of the function take the class apart: [`cd = cls.__dict__` and `anns = _get_annotations(cls)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L399-L400). The trace records the annotation lookup returning `{'a_number': <class 'int'>, 'list_of_numbers': list[int]}`. On this interpreter that comes from the simple branch \u2014 [`cls.__dict__.get(\"__annotations__\", {})`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_compat.py#L30-L34); on Python 3.14 and later the same call routes through [`annotationlib` in `FORWARDREF` format](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_compat.py#L17-L26) so that unresolvable forward references don't explode here.\n\nNote what the two dicts disagree about. `cd` contains `42`, the `Factory`, *and* `hard_math`. `anns` contains only the two names that were annotated. In `auto_attribs` mode it is the annotations that decide: the loop [`for attr_name, type in anns.items()`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L411-L420) never looks at `hard_math`, and a plain unannotated class attribute would be equally invisible.\n\nEach annotation is first screened by `_is_class_var`. The trace shows it called with `<class 'int'>` \u2192 `False` and with `list[int]` \u2192 `False`. The implementation is unapologetically a string comparison: it stringifies the annotation, strips surrounding quotes, and [tests `annot.startswith(_CLASSVAR_PREFIXES)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L295-L310) against the four spellings `\"typing.ClassVar\"`, `\"t.ClassVar\"`, `\"ClassVar\"`, `\"typing_extensions.ClassVar\"` ([listed here](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L41-L46)). The docstring says why: evaluating every string annotation would put *attrs* classes at a performance disadvantage against plain classes.\n\n> **For the owner:** ClassVar detection is textual, not semantic. An annotation written through an unrecognized alias \u2014 say `import typing as tp` and `tp.ClassVar[int]` \u2014 is not detected, and the member silently becomes an instance field with the class-body value as its default. Require one of the four recognized spellings in annotated *attrs* classes.\n\nSurviving the screen, each name is looked up in the class body: [`a = cd.get(attr_name, NOTHING)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L416-L419). Neither `42` nor the `Factory` is a `_CountingAttr`, so both are auto-wrapped by `attrib(a)` \u2014 which is exactly what the trace shows: `attrib(default=42, ...)` and `attrib(default=Factory(factory=<class 'list'>, takes_self=False), ...)`.\n\nInside `attrib`, `_determine_attrib_eq_order(None, None, None, True)` resolves `(True, None, True, None)` \u2014 equality on, ordering mirroring equality, no key functions \u2014 and then, because `factory` was `None` and `metadata` was `None`, the latter [becomes an empty dict](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L184-L185). A list or tuple passed as `validator`, `converter`, or `on_setattr` would have been wrapped here in [`and_` / `pipe` / `setters.pipe`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L188-L195); all three were `None`. What comes out is a [`_CountingAttr`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L197-L214) whose only job is to remember a definition order: the trace shows `counter=6` and `counter=7`, drawn from a [process-wide class counter](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2828-L2829). In annotation mode the order is already fixed by the annotations dict; the counter matters for the non-annotated path, which sorts the class body by it.\n\nThis is also where the fallback promised in chapter 1 lives. After the loop, `_transform_attrs` computes `unannotated = ca_names - annot_names` and, if it is non-empty, raises [`UnannotatedAttributeError` listing the offenders](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L422-L430). That happens here, at the very top of the build, before the builder has written anything onto the class \u2014 which is why `define`'s `try/except` can simply re-enter with `auto_attribs=False` against a class that is still exactly as the user wrote it. `SomeClass` has no bare `field()`, so `unannotated` is empty.\n\nNow the two `_CountingAttr`s are promoted. `Attribute.from_counting_attr('a_number', ca, kw_only=False, type=int)` \u2014 note the third argument: `_transform_attrs` passes [`kw_only is not no`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L441-L451), and since the class-level setting is `KeywordOnly.NO`, that is `False`. `from_counting_attr` then copies fifteen values across, resolving two of them by hand: the per-field setting wins over the class default via [`kw_only if ca.kw_only is None else ca.kw_only`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2618-L2618), and `alias_is_default` is recorded as [`ca.alias is None`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2624-L2625) \u2014 `True` here, because nobody asked for a specific `__init__` parameter name. (Had the user supplied both an annotation and `field(type=...)`, this method would have [raised a `ValueError`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2601-L2605) rather than guess.)\n\n`Attribute.__init__` writes every one of those values through [`bound_setattr = _OBJ_SETATTR.__get__(self)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2558-L2589) \u2014 because `Attribute` defines [`__setattr__` to raise `FrozenInstanceError`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2591-L2592). The field descriptions that every validator, every `fields()` caller, and every third-party tool will later read are immutable by construction. The trace's nested `_determine_attrib_eq_order(cmp=None, eq=True, order=True, default_eq=True)` with its two `decide_callable_or_boolean` calls is just the same normalization run again on already-normalized values: a callable in `eq` would have [become `(True, that_callable)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1293-L1301); a bare `True` stays `(True, None)`.\n\nNext, inheritance. `_collect_base_attrs(cls, {'a_number', 'list_of_numbers'})` returns `([], {})` \u2014 `SomeClass` has only `object` behind it. The function it took is the correct one: it walks [`reversed(cls.__mro__[1:-1])`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L330-L338), skips anything already defined on this class or already marked `inherited`, and then [keeps only the furthest-back definition of each name](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L342-L349). `define` always routes here; the legacy forward-walking variant is reachable only through `attr.s` and will matter again in chapter 8.\n\nThen the aliases. Any field without one gets `name.lstrip(\"_\")`, and the write is done with the same frozen-bypass trick, with a comment that doesn't pretend otherwise \u2014 [*\"Evolve is very slow, so we hold our nose and do it dirty\"*](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L470-L476). The trace shows `_default_init_alias_for('a_number')` \u2192 `'a_number'` and the same for `list_of_numbers`; nothing is stripped because neither name starts with an underscore. Crucially this happens *before* the [`field_transformer` hook](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L477-L478), so a hook always receives fully populated `Attribute`s \u2014 and a [second alias pass afterwards](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L494-L499) catches any field the hook invented. Here `field_transformer` is `None`, so the attribute list passes through untouched.\n\nBetween the two alias passes sits the one rule *attrs* enforces on field order. It walks the fields that are `init is not False` and `kw_only is False`, and if a mandatory field follows one with a default, it raises [`ValueError: No mandatory attributes allowed after an attribute with a default value or factory`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L485-L489). Both of this class's fields have defaults, so the check passes silently.\n\n> **For the owner:** A field ordering mistake \u2014 including one introduced by base-class inheritance or by a `field_transformer` \u2014 raises `ValueError` at class-definition time, which means at import time, not at the first instantiation. Treat that as a guarantee you can rely on: these classes cannot be imported in a broken state.\n\nFinally the container. `_make_attr_tuple_class('SomeClass', ['a_number', 'list_of_numbers'])` builds [a bare `tuple` subclass with one `property` per field name](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L266-L284), returned in the trace as `<class 'attr._make.SomeClassAttributes'>`. It is created *after* the transformer precisely because the transformer may add or remove names. The two `Attribute`s are packed into it and returned as [`_Attributes(AttrsClass(attrs), base_attrs, base_attr_map)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L503-L506) \u2014 a tuple you can index *and* reach into by name, which is what makes `attrs.fields(C).a_number` work.\n\nThe class body has now been fully read. Nothing has been written back to it yet.\n\n> **Leaves as:** `_Attributes(attrs=(Attribute(name='a_number', default=42, type=int, alias='a_number', alias_is_default=True, kw_only=False, inherited=False), Attribute(name='list_of_numbers', default=Factory(factory=list, takes_self=False), type=list[int], alias='list_of_numbers')), base_attrs=[], base_attrs_map={})`, the pair wrapped in a generated `SomeClassAttributes` tuple subclass\n"}, {"n": 3, "title": "The Hook That Quietly Removed Itself", "data_in": "the `_Attributes` tuple plus `ClassProps`, inside `_ClassBuilder.__init__`", "data_out": "a builder whose `_on_setattr` is now `None`, holding `__attrs_attrs__`, `__attrs_props__`, getstate/setstate, a queued `__repr__` and `__eq__` script, `__ne__`, and `__hash__ = None`", "span": [69, 85], "md": "# Chapter 3 \u00b7 The Hook That Quietly Removed Itself\n\n> **Enters as:** `_Attributes(attrs=(Attribute(name='a_number', \u2026), Attribute(name='list_of_numbers', \u2026)), base_attrs=[], base_attrs_map={})` returning into `_ClassBuilder.__init__`, alongside the `ClassProps` record from chapter 1\n\nThe two `Attribute`s come back up the call and land in a builder that has, so far, nothing but a name. Over the next thirty lines of `__init__` the builder copies the policy out of `ClassProps` into its own slots \u2014 [`self._slots = props.is_slotted`, `self._frozen = props.is_frozen`, `self._cache_hash = props.hashability is HASHABLE_CACHED`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L693-L718) \u2014 and takes a snapshot of the class it was given: [`self._cls_dict = dict(cls.__dict__) if props.is_slotted else {}`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L694). For a slotted class that snapshot is not a scratch pad; it is the seed of the replacement type that chapter 5 will build. `hard_math` rides along inside it.\n\nIt also looks for the two initialization hooks. [`getattr(cls, \"__attrs_pre_init__\", False)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L705-L715) and the same for `__attrs_post_init__` both come back falsy \u2014 `SomeClass` defines neither \u2014 so no `inspect.signature` call is made and both flags stay `False`. That is why the trace shows nothing between the `_transform_attrs` return and `_make_getstate_setstate`.\n\nTwo entries go onto the class dict immediately: [`__attrs_attrs__` and `__attrs_props__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L723-L724). The first is the `SomeClassAttributes` tuple from the last chapter; it is the entire public introspection surface that `fields()`, `has()`, and every third-party tool will read. The second is the policy record itself, which is what `attrs.inspect()` hands back later.\n\n## The hook that was installed, then wasn't\n\nThen comes the branch that matters most for anyone reviewing this class's runtime behaviour. The class isn't frozen, so the `_frozen_setattrs` path is skipped and the builder falls into the [`elif self._on_setattr in (_DEFAULT_ON_SETATTR, setters.validate, setters.convert)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L731-L756) arm. Chapter 1's `define` wrapper put `pipe(convert, validate)` here on the grounds that mutable classes should re-run converters and validators on every assignment. Now the builder checks whether there is any work for that hook to do: it loops over the two attributes looking for a non-`None` `validator` or `converter`, breaking early if it finds both.\n\nIt finds neither. `a_number` has `validator=None, converter=None`; so does `list_of_numbers`. The condition `self._on_setattr == _DEFAULT_ON_SETATTR and not (has_validator or has_converter)` holds, and the builder sets `self._on_setattr = None`. The comment is blunt about the reasoning: *\"If class-level on_setattr is set to convert + validate, but there's no field to convert or validate, pretend like there's no on_setattr.\"* The `ClassProps` record still reports `on_setattr_hook=<wrapped_pipe>` \u2014 only the builder's working copy was cleared.\n\n> **For the owner:** The convert-and-validate-on-assignment guarantee that `@define` advertises is decided once, at class-creation time, and is dropped entirely when no field declares a converter or validator. The shortcut recognizes only the three built-in hooks by equality \u2014 a custom `on_setattr` callable is always kept \u2014 so if you later attach a validator to an `Attribute` by hand, nothing will run it, because this class has no `__setattr__` of its own. Add validators in the class body, not afterwards.\n\nBecause `props.added_pickling` is `True` (chapter 1 derived it from `slots=True`), the builder calls `_make_getstate_setstate`, which the trace records returning the pair `slots_getstate` / `slots_setstate`. Both close over [`state_attr_names`, the field names minus `__weakref__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1030-L1032), because that slot isn't writable. `slots_getstate` returns a plain dict of name to value. `slots_setstate` accepts [either a tuple \u2014 for pickles written by *attrs* before v22.2.0 \u2014 or a dict, in which case it sets only the names actually present](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1042-L1055).\n\n> **For the owner:** `slots_setstate` skips state keys it doesn't find rather than raising, so a slotted instance restored from an old or truncated pickle comes back with some slots simply unset; the failure surfaces much later as an `AttributeError` on first read. If you pickle these classes across versions, assert on the full field set after loading.\n\nFinally `__init__` decides how methods will be stamped: since the class has both `__module__` and `__qualname__`, [`self._add_method_dunders = self._add_method_dunders_unsafe`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L770-L777) \u2014 the variant that assigns without `contextlib.suppress`. The builder is ready.\n\n## Three strings and a `None`\n\nBack in `attrs.wrap`, the builder is now driven method by method, in the order the flags were resolved.\n\n`add_repr(None)` calls `_make_repr_script`, which returns a source string and a globals dict. The trace's truncated return shows both: a script beginning `def __repr__(self):\\n  try:\\n    alre\u2026` and globs `{'AttributeError': \u2026, 'NOTHING': NOTHING, '_compat': <module 'attr._compat'>}`. The generated function doesn't just interpolate fields. It [opens with a lookup of `_compat.repr_context.already_repring`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1888-L1904) \u2014 a thread-local set of `id(self)` values \u2014 and if this instance is already being repr'd somewhere up the stack, it returns `'...'` instead of recursing forever. The thread-local deliberately [lives in `_compat` rather than `_make`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_compat.py#L83-L95) so the generated functions don't hold a direct reference to it, which would break cloudpickle.\n\nTwo details in that script are worth knowing. The class name is rendered from [`self.__class__.__qualname__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1883-L1886), so a subclass reprs under its own name, not the one it inherited the method from. And a field with `init=False` is read via [`getattr(self, name, NOTHING)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1871-L1880) rather than `self.name`, so an unset slot reprs as `NOTHING` instead of raising. Nothing is compiled yet: `add_repr` [appends `(script, globs, _attach_repr)` to `self._script_snippets`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1004-L1012) and sets `_repr_added = True` \u2014 a flag that only exists so `add_str` can refuse to run without it. `added_str` is `False`, so `add_str` is never called.\n\n`add_eq` does the same for equality. `_make_eq_script` returns a script whose first act is a type check:\n\n```\ndef __eq__(self, other):\n    if other.__class__ is not self.__class__:\n        return NotImplemented\n```\n\nthen a single `and`-chain over the fields \u2014 `self.a_number == other.a_number and self.list_of_numbers == other.list_of_numbers` \u2014 [built field by field](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1746-L1770). A `__ne__` is not generated; `add_eq` [assigns the one shared module-level function](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1158-L1161), which calls `self.__eq__(other)` and [forwards `NotImplemented` rather than inverting it](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1730-L1739). That function is the only piece of *attrs* that the scenario's instances will call at runtime.\n\n> **For the owner:** Equality here is type-exact by design: `other.__class__ is not self.__class__` returns `NotImplemented`, so a subclass instance never compares equal to a base instance with identical field values, and Python then falls back to identity. If your domain expects a subclass to be substitutable in an equality test, this class will not give you that.\n\n`add_setattr` runs next, because the class isn't frozen. It walks the fields building `sa_attrs` from [`a.on_setattr or self._on_setattr`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1175-L1186) \u2014 and both halves are now `None`, the class-level half because of the removal thirty lines earlier. `sa_attrs` stays empty, and the method returns on the spot. **No `__setattr__` is written at all.** Assignment on these instances is an ordinary slot write with no interposition. Had there been even one hook, the generated `__setattr__` would have looked up the field in a dict, [checked whether the hook is a generator function and if so driven it around the assignment](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1194-L1222) \u2014 and would have [refused outright if the user had their own `__setattr__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1188-L1191).\n\nThe last step in this span is hashing. `props.is_hashable` is read \u2014 it is `True` only for [`HASHABLE` or `HASHABLE_CACHED`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3056-L3061) \u2014 and returns `False`. The `hashability` is `UNHASHABLE`, so [`make_unhashable`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1066-L1068) writes a single entry: `self._cls_dict[\"__hash__\"] = None`. `hash(sc)` will raise `TypeError`, which is Python's own rule for a class that customizes equality. Note what this *isn't*: *attrs* only adds. If a base class had defined a real `__hash__`, this `None` shadows it on `SomeClass` but leaves the ancestor untouched.\n\nThe builder now holds a finished class dict and three unevaluated strings.\n\n> **Leaves as:** a `_ClassBuilder` with `_on_setattr = None`, `_wrote_own_setattr = False`, `_repr_added = True`, a `_cls_dict` carrying `__attrs_attrs__`, `__attrs_props__`, `__getstate__`, `__setstate__`, `__ne__` and `__hash__ = None` (and no `__setattr__`), plus two queued `_script_snippets` holding the `__repr__` and `__eq__` sources\n"}, {"n": 4, "title": "Writing the Initializer, and Two Protocols Added Only If Vacant", "data_in": "`_make_init_script(cls, attrs, pre_init=False, post_init=False, frozen=False, slots=True, cache_hash=False, base_attr_map={}, is_exc=False, cls_on_setattr=None, attrs_init=False)`", "data_out": "init script `def __init__(self, a_number=attr_dict['a_number'].default, list_of_numbers=NOTHING): ... self.list_of_numbers = __attr_factory_list_of_numbers()` with globs including the defining module's `__dict__`; plus `cls_dict['__replace__']` and `cls_dict['__match_args__'] = ('a_number', 'list_of_numbers')`", "span": [86, 106], "md": "# Chapter 4 \u00b7 Writing the Initializer, and Two Protocols Added Only If Vacant\n\n> **Enters as:** `_make_init_script(cls, attrs=(Attribute(name='a_number', default=42, \u2026), Attribute(name='list_of_numbers', default=Factory(list), \u2026)), pre_init=False, pre_init_has_args=False, post_init=False, frozen=False, slots=True, cache_hash=False, base_attr_map={}, is_exc=False, cls_on_setattr=None, attrs_init=False)`\n\n`props.added_init` is `True`, so [`attrs.wrap` calls `builder.add_init()`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1595-L1601), and the two `Attribute`s go off to be turned into source for the one method a caller actually types. The alternative branch \u2014 `init=False` \u2014 would have routed the identical script to `__attrs_init__` instead, leaving the user's own `__init__` untouched; it also rejects `cache_hash=True` there, since there'd be nothing to initialize the cache.\n\nNotice what `add_init` passes as `cls_on_setattr`: `self._on_setattr`, which chapter 3 set to `None`. So the first thing `_make_init_script` computes, [`has_cls_on_setattr`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2044-L2046), is `False`. That single `False` propagates all the way down and decides what the assignment statements will look like.\n\n`_make_init_script` then does its own filtering: [any field that is both `init=False` and has no default is skipped entirely](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2053-L2060) \u2014 there'd be nothing to set it from. Both of ours survive, and both land in `attr_dict`, a `{name: Attribute}` map that the generated code will consult at runtime. Alongside it, [`needs_cached_setattr = cache_hash or frozen`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2052) is `False`, and no field carries an `on_setattr`, so it stays `False`. The script will not open with `_setattr = _cached_setattr_get(self)`.\n\n## Four lines of body\n\nInside [`_attrs_to_init_script`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2187-L2448), the first decision is how to write a value onto an instance. [`_determine_setters(frozen=False, slots=True, base_attr_map={})`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2140-L2184) returns, as the trace records, `((), <function _assign>, <function _assign_with_converter>)` \u2014 no preamble lines and the plainest strategy there is. A frozen slotted class would get `_setattr` (going through a cached `object.__setattr__`); a frozen dict class would get direct `_inst_dict['x'] = \u2026` writes. Ours gets ordinary attribute assignment.\n\nThen the loop over fields. For each one, [`arg_name = a.alias`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2236-L2242) \u2014 this is where chapter 2's quiet `name.lstrip(\"_\")` becomes the public contract. The parameter in the signature is the alias; the attribute written on `self` is the name.\n\n`a_number` has a default that isn't a `Factory`, so it takes [the simple branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2296-L2314): the parameter becomes `a_number=attr_dict['a_number'].default` and the body gets one call to `_assign`, which the trace shows returning `'self.a_number = a_number'`. Because `has_on_setattr` is `False`, [`_assign` takes its fast path](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2116-L2124) and emits a bare assignment instead of relegating to `_setattr`.\n\nThe default is referenced *indirectly*, through `attr_dict`, so the `Attribute` object remains the single source of truth rather than having `42` baked into the string. Python evaluates default expressions once, when the `def` is executed \u2014 which is why a mutable default would be shared across every instance, and why `Factory` exists at all.\n\n`list_of_numbers` takes [the factory branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2316-L2359). Its parameter becomes `list_of_numbers=NOTHING` \u2014 a sentinel, not a list \u2014 and the body gets three more lines and two more `_assign` calls (the trace's `_assign \u00d72 more`):\n\n```\nif list_of_numbers is not NOTHING:\n    self.list_of_numbers = list_of_numbers\nelse:\n    self.list_of_numbers = __attr_factory_list_of_numbers()\n```\n\nThe factory is injected into the globals under the mangled name from [`_INIT_FACTORY_PAT = \"__attr_factory_%s\"`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L40), and the trace confirms the payload: `{'__attr_factory_list_of_numbers': <class 'list'>}`. That `else` branch is the guarantee: each construction calls `list()` again, so no two instances share a list.\n\nTwo more blocks would have been appended if the class had asked for them. Validators are collected into `attrs_to_validate` and emitted *after* every assignment, inside [`if _config._run_validators is True:`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2386-L2394) \u2014 so a validator always sees a fully populated instance, and the whole set can be switched off globally at runtime. A `__attrs_post_init__` would have been called at the very end. `SomeClass` has neither.\n\nThe function returns the script, the globs `{'__attr_factory_list_of_numbers': list}`, and `annotations = {'a_number': int, 'list_of_numbers': list[int], 'return': None}`, built from [`a.type` for each `init=True` field](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2379-L2384) \u2014 keyed, again, by alias.\n\n## The namespace the initializer will live in\n\nBack in `_make_init_script`, two updates widen those globs considerably. First, [if the defining module is importable, its entire `__dict__` is merged in](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2085-L2087) \u2014 the trace's return shows `'Factory'`, `'SomeClass'`, `'_SRC'`, `'__builtins__'` and the rest of the scenario's module sitting next to the factory. The stated reason is one line of comment: *\"This makes `typing.get_type_hints(CLS.__init__)` resolve string types.\"* Then [`NOTHING` and `attr_dict` are added](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2089), which the script needs for its sentinel check and its default lookup.\n\n> **For the owner:** The generated `__init__` executes with a copy of your module's namespace as its globals, and the module's names are merged in *after* the ones attrs injected, so a module-level name shaped like `__attr_factory_<field>`, `__attr_validator_<field>` or `__attr_converter_<field>` silently replaces the callable attrs meant to use. Do not define module-level names in that form.\n\n`add_init` queues the snippet and a `_attach_init` hook that will later set `init.__annotations__ = annotations` and stamp the function onto the class dict. Nothing is compiled yet.\n\n## Added only if vacant\n\nTwo protocol attributes follow, each gated the same way. [`PY_3_13_PLUS and not _has_own_attribute(cls, \"__replace__\")`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1603-L1604) \u2014 the interpreter is new enough, and [`_has_own_attribute`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L313-L317), which checks `cls.__dict__` and nothing else, returns `False`. So [`add_replace`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1110-L1116) defines a three-line proxy and hands it to `_add_method_dunders_unsafe`, which mutates it in place \u2014 the trace shows the same object address, `0x10e173ba0`, going in anonymous and coming out as `<function SomeClass.__replace__>`.\n\n> **For the owner:** `copy.replace(instance, \u2026)` on these classes is not a field-by-field copy; [`evolve`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L634-L644) re-runs `__init__` with each field's *alias* as a keyword, so all converters and validators fire again and any `init=False` field is skipped rather than carried over. Check that your `init=False` fields can be recomputed before you let callers use `copy.replace`.\n\nThe same `_has_own_attribute` check clears `__match_args__`, and [`add_match_args`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1118-L1123) writes `('a_number', 'list_of_numbers')` \u2014 every field that is `init=True` and not keyword-only.\n\n> **For the owner:** `__match_args__` is built from `field.name`, while `__init__` parameters come from `field.alias`. For a private field `_x` the constructor takes `x` but a positional `case C(\u2026)` pattern binds through `_x`. Confirm this asymmetry is acceptable before relying on pattern matching over classes with underscore-prefixed fields.\n\n> **Leaves as:** a third queued snippet \u2014 script `def __init__(self, a_number=attr_dict['a_number'].default, list_of_numbers=NOTHING): \u2026` with globs containing `__attr_factory_list_of_numbers`, `NOTHING`, `attr_dict` and the defining module's namespace, and annotations `{'a_number': int, 'list_of_numbers': list[int], 'return': None}` \u2014 plus `cls_dict['__replace__'] = <function SomeClass.__replace__>` and `cls_dict['__match_args__'] = ('a_number', 'list_of_numbers')`\n"}, {"n": 5, "title": "One compile(), and the Class You Get Back Is Not the Class You Wrote", "data_in": "three queued snippets (repr, eq, init) with merged globs, filename `<attrs generated methods __main__.SomeClass>`", "data_out": "a brand-new `<class '__main__.SomeClass'>` with `__slots__ = ('a_number', 'list_of_numbers', '__weakref__')`, returned up through `attrs` \n\n\n\n `do_it` \n\n\n\n `wrap` \n\n\n\n `define`; then `sc != SomeClass(2, [3, 2, 1])` \n\n\n\n `True`", "span": [107, 137], "md": "# Chapter 5 \u00b7 One compile(), and the Class You Get Back Is Not the Class You Wrote\n\n> **Enters as:** three queued snippets \u2014 `(repr_script, repr_globs, _attach_repr)`, `(eq_script, {}, _attach_eq)`, `(init_script, init_globs, _attach_init)` \u2014 plus a `_cls_dict` already holding `__attrs_attrs__`, `__attrs_props__`, getstate/setstate, `__ne__`, `__hash__ = None`, `__replace__` and `__match_args__`\n\n`attrs.wrap` has nothing left to decide. It calls [`builder.build_class()`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L800-L821), and the first thing that happens is the moment all three scripts have been waiting for.\n\n## One compile, one namespace\n\n[`_eval_snippets`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L782-L798) joins the snippets with newlines into a single source string and merges every snippet's globs dict into one. The trace shows the result: a script that begins `def __repr__(self):\\n  try:\\n    alre\u2026` and ends `\u2026s = __attr_factory_list_of_numbers()\\n`, and a globs dict carrying `AttributeError`, `Factory`, `NOTHING`, `_SRC`, `__attr_factory_list_of_numbers`, `__builtins__` \u2014 the repr snippet's helpers and the init snippet's factory and module namespace, now indistinguishable from each other.\n\nThat merge is worth pausing on. There is one namespace for all generated methods on a class, not one per method. A name injected for the initializer is visible to `__repr__` and `__eq__` as well.\n\n[`_generate_unique_filename(cls, \"methods\")`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1634-L1641) produces `'<attrs generated methods __main__.SomeClass>'`, and [`_linecache_and_compile`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L231-L263) registers the source under that name in `linecache.cache` as the tuple `(len(script), None, script.splitlines(True), filename)`. This is why a debugger can step into `SomeClass.__init__` and why a traceback from it shows real source lines instead of `<string>`. If the name is already taken by a *different* source, [the loop appends a counter](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L246-L259) until it finds a free one \u2014 two classes with the same qualname don't overwrite each other's debug source.\n\nThen [`_compile_and_eval`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L217-L228): `compile(script, filename, \"exec\")` followed by `eval(bytecode, globs, locs)`. One `compile` and one `eval` for the whole class. The trace records what came back in `locs`:\n\n```\n{'__eq__': <function __eq__>, '__init__': <function __init__>, '__repr__': <function __repr__>}\n```\n\nThree real functions, built from strings attrs assembled out of field names.\n\n> **For the owner:** attrs interpolates field names directly into the source text it compiles, with no identifier check \u2014 `make_class` [states in its own docstring](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3276-L3281) that validating names is the caller's duty, and [the initializer is built by f-string](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2442-L2448). Validate any field names that arrive from outside your own source before passing them to `make_class` or to `these`.\n\nThe three attach hooks then run in registration order. [`_attach_repr`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1007-L1008) pulls `globs[\"__repr__\"]`, stamps it via `_add_method_dunders_unsafe` \u2014 the trace shows the same address `0x10e15c400` going in bare and coming out as `<function SomeClass.__repr__>` \u2014 and writes it into `cls_dict`. Then [`_attach_eq`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1155-L1156), then [`_attach_init`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1101-L1104), which also sets `init.__annotations__` to the dict chapter 4 built. You can watch the dict fill up across trace lines 115, 119 and 123.\n\n## A different class\n\n`self._slots` is `True`, so [`build_class` takes the replacement branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L806-L809) rather than patching in place. `__slots__` cannot be added to a class after creation, so [`_create_slots_class`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L859-L1002) builds a new type.\n\nIt starts from [a copy of the class dict minus the field names, `__dict__` and `__weakref__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L863-L867) \u2014 the `42` and the `Factory(list)` that sat in the body are dropped here, because slots will occupy those names. On 3.14 and later it also [clears the original type's descriptors](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L869-L871). It [walks the MRO for inherited slots and an existing `__weakref__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L890-L902) \u2014 empty here, the only base is `object` \u2014 and so [appends a weakref slot](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L906-L913). Only [names not inherited from a base](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L946-L948) are slotted, and slots a base already defines are [re-bound from the collected descriptors instead of redefined](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L950-L960), so a parent's descriptor isn't shadowed by an empty one. The result is `cd[\"__slots__\"] = ('a_number', 'list_of_numbers', '__weakref__')`, `cd[\"__qualname__\"] = 'SomeClass'`, and then [`type(self._cls)(self._cls.__name__, self._cls.__bases__, cd)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L968-L969).\n\nHad the class carried a `functools.cached_property`, this is where its name would have been slotted and [a generated `__getattr__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L915-L944) installed to compute and cache it \u2014 the documented crime against nature that makes `cached_property` work without a `__dict__`. `SomeClass` has none.\n\nThe last thing `_create_slots_class` does is the repair work the swap makes necessary. A method that mentions `__class__` or calls bare `super()` carries a closure cell baked by the compiler, and that cell points at the class being discarded. So attrs [walks the new class's dict \u2014 unwrapping classmethods, staticmethods and properties \u2014 and overwrites any cell whose contents are the old class](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L971-L1001).\n\nBack in `build_class`, the old class gets [`__attrs_base_of_slotted__ = weakref.ref(cls)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L808-L809) \u2014 a weak pointer from the discarded original to its replacement. Then [an *inherited* `__attrs_init_subclass__` would be called](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L813-L819); there is none. The new class is returned, and the trace shows it bubbling up unchanged through `build_class` \u2192 `wrap` \u2192 `do_it` \u2192 `wrap` \u2192 `define`, five returns of `<class '__main__.SomeClass'>`, until the name in the scenario module is bound to it.\n\n> **For the owner:** With `slots=True` \u2014 the default for `@define` \u2014 the object bound to your class name is not the object the decorator received, which is why the *attrs* documentation records that [`object.__init_subclass__` misbehaves and the dead original lingers in `type.__subclasses__` until a garbage collection](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/docs/glossary.md#L96-L101). Do not keep references to the class from inside another decorator or a metaclass hook; use `__attrs_init_subclass__` instead of `__init_subclass__`.\n\n## The silence afterwards\n\nThe scenario now builds `sc = SomeClass(1, [1, 2, 3])`, reprs it, calls `hard_math(3)` for `19`, builds a twin and compares them with `==`. The trace shows **nothing** for any of that. Those methods are compiled functions living on the class, not library calls into `attr`; the only reason `__ne__` appears at all is that it was never generated \u2014 [it is a plain module-level function](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1730-L1739) assigned straight onto the class.\n\nSo `sc != SomeClass(2, [3, 2, 1])` lands in `__ne__`, which calls `self.__eq__(other)`. Both operands are `SomeClass`, so the generated `__eq__` passes its class-identity guard, compares `1 == 2`, short-circuits, and returns `False`. `__ne__` sees a real boolean rather than `NotImplemented`, negates it, and returns `True` \u2014 trace line 137. A foreign operand would have travelled the other road: `__eq__` returning `NotImplemented`, `__ne__` forwarding it unchanged, and Python falling back to identity.\n\n> **For the owner:** All per-class work \u2014 compiling, slotting, closure repair \u2014 happens once at import time, and the guarantees it establishes are then inert machine code on the class. Budget the cost against process startup, not against instance throughput.\n\n> **Leaves as:** a new `<class '__main__.SomeClass'>` with `__slots__ = ('a_number', 'list_of_numbers', '__weakref__')`, `__repr__`/`__eq__`/`__init__` sharing one globals dict and one linecache entry at `<attrs generated methods __main__.SomeClass>`, bound to the scenario's module name; `sc = SomeClass(a_number=1, list_of_numbers=[1, 2, 3])`; and `sc != SomeClass(2, [3, 2, 1])` \u2192 `True`\n"}, {"n": 6, "title": "Flattening It Out", "data_in": "`attrs.asdict(inst=SomeClass(a_number=1, list_of_numbers=[1, 2, 3]), recurse=True, filter=None, value_serializer=None)`", "data_out": "`{'a_number': 1, 'list_of_numbers': [1, 2, 3]}`", "span": [138, 152], "md": "# Chapter 6 \u00b7 Flattening It Out\n\n> **Enters as:** `attrs.asdict(inst=SomeClass(a_number=1, list_of_numbers=[1, 2, 3]), recurse=True, filter=None, value_serializer=None)`\n\nThe instance has no `__dict__`. Chapter 5 saw to that: its two values live in slots named `a_number` and `list_of_numbers`, and there is no mapping on the object to hand anyone. Yet the scenario asks for a dict.\n\n## The wrapper that changes one default\n\nThe name imported from `attrs` is not the same function as `attr.asdict`. It is [a four-line wrapper](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L627-L640) that forwards the instance and then hard-codes `retain_collection_types=True`, leaving `dict_factory` at its `dict` default. The trace shows the hand-off exactly: the outer call carries four arguments, the inner call to [`attr.asdict`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L26-L33) carries six, with `dict_factory=<class 'dict'>` and `retain_collection_types=True` filled in.\n\nThat one flag is the only difference, and it is a behavioural one: the `attr`-namespace function [converts tuples, sets and frozensets to `list`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L101-L102) unless told otherwise, while the `attrs`-namespace one keeps them.\n\n> **For the owner:** `attrs.asdict` and `attr.asdict` produce different output for the same instance whenever a field holds a tuple, set or frozenset. Pin down which namespace your serialization code imports from before changing any import.\n\n## Finding out what the instance contains\n\nThe first thing [`asdict`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L78-L79) does is call [`fields(inst.__class__)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1924-L1972). It asks [`get_generic_base`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_compat.py#L98-L102) whether this is a specialized generic like `A[str]`; `SomeClass.__class__` is `type`, not `_GenericAlias`, so it gets `None` back (trace lines 141\u2013142). `cls` is a real class, so [the instance-handling branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1950-L1956) is skipped, and [`getattr(cls, \"__attrs_attrs__\", None)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1958) returns the tuple `_ClassBuilder` stamped on in chapter 3.\n\nSo the answer to the missing `__dict__` is that the instance was never asked. The field names come from the class; the values come from `getattr`. A plain class would have fallen off the end into `NotAnAttrsClassError`, and a non-class, non-instance argument into `TypeError` \u2014 [both raised before any work is done](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1952-L1970).\n\nA detail that matters for private fields: the loop reads values with [`getattr(inst, a.name)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L81) \u2014 the field *name*, not the alias chapter 2 computed. A field called `_x` appears in the output dict as `_x`, even though `__init__` takes it as `x`. The dict is not round-trippable through the constructor without renaming.\n\n## Two values, two roads\n\n`rv = dict_factory()` creates an empty dict, and the loop walks the two `Attribute`s in order.\n\n**`a_number`.** `v = 1`. `filter` is `None`, so [the skip check](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L82-L83) doesn't fire; `value_serializer` is `None`, so [the hook](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L85-L86) doesn't run. `recurse` is `True`, so `value_type = type(v)` is computed once and checked against [`_ATOMIC_TYPES`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L9-L23) \u2014 a frozenset holding `NoneType`, `bool`, `int`, `float`, `str`, `complex`, `bytes`, `EllipsisType`, `type`, `range` and `property`. `int` is in it, so [`rv['a_number'] = 1`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L90-L91) and that is the whole story. The trace records no call at all for this field; the fast path is a set membership test.\n\n**`list_of_numbers`.** `v = [1, 2, 3]`, `value_type = list`. Not atomic, so the next question is whether this is itself an *attrs* class: [`has(list)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L352-L377) looks for `__attrs_attrs__`, finds nothing, asks `get_generic_base(list)`, gets `None`, and returns `False` (trace lines 144\u2013147). Had it been an attrs class, `asdict` would have recursed into itself with the same options.\n\nIt isn't, so [the collection branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L101-L121) takes it. `retain_collection_types` is `True`, so `cf = value_type` \u2014 `list`, the concrete class of this value, not a generic fallback. Each element is run through [`_asdict_anything`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L152-L227), which is `asdict`'s logic for values that aren't attrs instances: the same atomic / attrs-class / collection / dict / passthrough cascade, keyed on `type(val)`. All three elements are `int`, so all three take [the atomic path](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L163-L167) and come back unchanged \u2014 the trace's `_asdict_anything(val=1, \u2026) \u2192 1` and `\u00d72 more`.\n\nThen `rv['list_of_numbers'] = cf(items)` rebuilds the collection. [The `except TypeError` beside it](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L114-L121) is a targeted workaround: a namedtuple's `__new__` wants positional arguments, not an iterable, so if `cf(items)` fails *and* `cf` is a tuple subclass, attrs retries as `cf(*items)`. Any other collection type whose constructor accepts neither shape sees its `TypeError` propagate.\n\nTwo branches went unvisited. A `dict` value would have been rebuilt with [`dict_factory` over key/value pairs](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L122-L144), with keys passed `is_key=True` so a collection key collapses to a hashable tuple. And anything else \u2014 a `datetime`, a file handle, an arbitrary object \u2014 would have hit [the final `else`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_funcs.py#L145-L146) and been stored **as-is**.\n\n> **For the owner:** `asdict` guarantees a dict, not a serializable one \u2014 unrecognized types are copied into the output untouched, and the rebuilt collections are shallow, so a nested mutable object is still shared with the original instance. Pass a `value_serializer` for every type your sink cannot encode, and do not treat the result as a snapshot you can mutate safely.\n\nThe loop ends, `rv` is returned through the wrapper unchanged, and the scenario's assertion holds: `{'a_number': 1, 'list_of_numbers': [1, 2, 3]}`.\n\n> **Leaves as:** `{'a_number': 1, 'list_of_numbers': [1, 2, 3]}` \u2014 a fresh `dict` whose `'list_of_numbers'` is a new `list` object holding the same three `int`s\n"}, {"n": 7, "title": "A Class From Two Strings", "data_in": "`make_class(name='C', attrs=['a', 'b'], bases=(object,), class_body=None)`", "data_out": "a fresh `type_` named `C` plus `these={'a': _CountingAttr(counter=8), 'b': _CountingAttr(counter=9)}`, handed to `attrs(these=..., slots=False, auto_detect=False, eq=True, order=True, force_kw_only=True)` which returns the `wrap` closure", "span": [153, 166], "md": "# Chapter 7 \u00b7 A Class From Two Strings\n\n> **Enters as:** `make_class(name='C', attrs=['a', 'b'], bases=(<class 'object'>,), class_body=None)`\n\nEverything so far began with a class body someone typed. This time the input is a string and a list of two more strings, and the scenario expects a working class out the other end. The same machinery is about to run \u2014 but it enters through a different door, and the door has different defaults nailed to it.\n\n## Normalizing the name, then trusting it\n\nThe first thing [`make_class`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3261-L3262) does to `'C'` is run it through [`unicodedata.normalize(\"NFKC\", name)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3308-L3309). That is the same normalization the Python parser applies to identifiers, so a name like `\"\u2102\"` arrives as the class `C` \u2014 matching what you'd get from writing `class \u2102:` by hand. For the plain ASCII `'C'` in this run, nothing changes.\n\nThat is the *only* thing done to the name. The docstring says so [in a warning block](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3276-L3281): it is the caller's duty to ensure the class name and attribute names are valid identifiers, and `make_class` will not validate them. The reason is visible from chapter 5: the field names are pasted verbatim into source strings that get `compile()`d. A name that isn't an identifier doesn't produce a polite error here \u2014 it produces a `SyntaxError` out of the generated-code compiler, pointing at a synthetic filename.\n\n> **For the owner:** `make_class` accepts any strings as class and field names and interpolates them into generated source before compiling it. Validate any name that originates outside your own code \u2014 from config, a schema, or user input \u2014 before passing it to `make_class`.\n\n## Two strings become two field definitions\n\n`attrs` is a `list`, so [the list branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3311-L3317) builds `cls_dict = {a: attrib() for a in attrs}`, preserving order. A `dict` input would have been used as-is; anything else raises `TypeError: attrs argument must be a dict or a list.` before a class exists.\n\nSo `'a'` and `'b'` each get a call to [`attrib()`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L104-L120) with every parameter at its default. Inside, [`_determine_attrib_eq_order(None, None, None, True)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1284-L1324) takes the `eq is None` path and returns the default `True` with no key function, then [order mirrors eq](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1315-L1316) \u2014 the trace's `\u2192 (True, None, True, None)`. `factory` is `None`, so [the default/factory exclusivity check](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L173-L182) is skipped and `default` stays `NOTHING`: both fields are mandatory.\n\nEach call ends in [a `_CountingAttr`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L197-L214), whose constructor [bumps a class-level counter](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2828-L2829) \u2014 `counter=8` for `a`, `counter=9` for `b` in this process, following the `6` and `7` that `SomeClass`'s fields took in chapter 2. That counter exists so that fields declared in a class body can be sorted back into definition order; here the dict already preserves it.\n\nThe dict now holds exactly what `@define` found by scanning a class body. The two strings have become field definitions.\n\n## A class with nothing in it\n\nBefore building, [three names are *popped* out](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3319-L3321) of `cls_dict`: `__attrs_pre_init__`, `__attrs_post_init__`, and `__init__`. They, plus any `class_body` you passed, go into a separate `body` dict and are [installed as real class members](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3323-L3331). This is the seam that lets you hand `make_class` your hooks in the same mapping as your fields without attrs mistaking a function for a field. Here all three are absent.\n\n[`types.new_class(name, bases, {}, lambda ns: ns.update(body))`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3333) produces a bare `C` subclassing `object` with an empty body \u2014 the blank canvas that chapter 8 will paint on. Then [`sys._getframe(1)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3335-L3342) reaches up one stack frame to the caller and copies its `__name__` into `type_.__module__`, so that `pickle` can find the class again by module path. The whole thing sits inside `contextlib.suppress(AttributeError, ValueError)`: on interpreters without frame introspection the module stays wrong rather than the call failing.\n\n## The defaults you inherit by using this door\n\n[`_determine_attrs_eq_order(cmp=None, eq=None, order=None, default_eq=True)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3344-L3354) runs here, with `default_eq=True`, and returns `(True, True)` \u2014 equality *and* ordering, written back into `attributes_arguments`. Compare chapter 1, where `define` passed `default_eq=None` and got `(None, False)`.\n\nThen [`_attrs(these=cls_dict, **attributes_arguments)(type_)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3356). `_attrs` is the internal alias for `attr.s`, **not** `attrs.define` \u2014 the docstring [calls this out explicitly](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3267-L3274). Everything the caller didn't name falls to [`attrs`'s own defaults](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1353-L1379), and the trace records the result: `slots=False`, `auto_detect=False`, `auto_exc=False`, `collect_by_mro=False`, `on_setattr=None`, `force_kw_only=True`. Every one of those is the opposite of what `@define` chose [in chapter 1](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_next_gen.py#L23-L47).\n\nThe consequence that bites hardest is `on_setattr=None`: `define` would have installed the convert-and-validate pipe, but `attr.s` installs nothing, so a `make_class` class never re-runs converters or validators when you assign to an attribute after construction.\n\n> **For the owner:** classes built by `make_class` are dict classes with ordering enabled and no `on_setattr` hooks, because it wraps `attr.s` rather than `define`. If you need converters and validators to run on assignment, pass `on_setattr=setters.pipe(setters.convert, setters.validate)` to `make_class` yourself.\n\nInside `attrs`, [`_determine_attrs_eq_order`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1469) runs a second time \u2014 now with the explicit `eq=True, order=True` \u2014 and confirms `(True, True)`. `maybe_cls` is `None` because `make_class` called the decorator in two steps, so [`attrs` returns the `wrap` closure](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1611-L1616) instead of building anything.\n\nOne last thing waits for after the build: [`cls.__annotations__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3357-L3360) is set from the fields' `type` values only once the class is finished \u2014 because setting annotations earlier would have made `_transform_attrs` read them as auto-attribs declarations. Neither field here has a type, so that dict will come out empty.\n\n> **Leaves as:** `<function attrs.<locals>.wrap>`, closed over `these={'a': _CountingAttr(counter=8, _default=NOTHING, eq=True, order=True, alias=None), 'b': _CountingAttr(counter=9, \u2026)}`, `slots=False`, `auto_detect=False`, `collect_by_mro=False`, `eq=True`, `order=True`, `force_kw_only=True` \u2014 about to be called with the bare `C` built by `types.new_class`\n"}, {"n": 8, "title": "The Same Machine, Legacy Settings", "data_in": "`attrs.<locals>.wrap(cls=<type C>)` with `these={'a': ..., 'b': ...}`, `auto_attribs=False`, `collect_by_mro=False`, `eq=True`, `order=True`, `slots=False`", "data_out": "a builder for `C` carrying repr/eq/init snippets, four ordering methods, `__hash__ = None`, `__replace__`, and `__match_args__ = ('a', 'b')`; the init script is `def __init__(self, a, b): self.a = a; self.b = b`", "span": [167, 241], "md": "# Chapter 8 \u00b7 The Same Machine, Legacy Settings\n\n> **Enters as:** `attrs.<locals>.wrap(cls=<type C>)` \u2014 the bare class from `types.new_class`, with `these={'a': _CountingAttr(counter=8), 'b': _CountingAttr(counter=9)}`, `auto_attribs=False`, `collect_by_mro=False`, `slots=False`, `eq=True`, `order=True`, `force_kw_only=True` closed over it\n\nThe same `wrap` that processed `SomeClass` in chapter 1 opens again, and this time the class it receives is empty. No annotations, no methods, no defaults \u2014 the two field definitions are riding in the closure, in `these`, not in the class body. Everything downstream from here is the machinery of chapters 2 through 5 run a second time, with the dials turned to the positions `attr.s` left them in.\n\n## Three questions, answered cheaply\n\n[`_has_frozen_base_class(C)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1626-L1631) compares `C.__setattr__` to `_frozen_setattrs` and gets `False`: `object` is the only base, so nothing immutable is inherited. Next, `auto_detect` is `False`, so [the custom-`__setattr__` probe](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1482-L1484) short-circuits on the `and` without ever calling `_has_own_attribute` \u2014 which is why the trace for `C` shows none of the `__eq__` / `__init__` / `__hash__` dictionary probes that cluttered chapter 1.\n\nThe same shortcut runs through every flag. [`_determine_whether_to_implement`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1339-L1344) returns the flag immediately when it is `True` or `False`, and returns `default` the moment it sees `flag is None and auto_detect is False`. It is called five times for `C` \u2014 eq, init, repr, ordering, pickling \u2014 and never looks at the class at all. `eq` and `order` were handed in as explicit `True`, so both come back `True`. `getstate_setstate` is `None` with a `default` of [`slots`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1553-L1559), which is `False` here: **this class gets no `__getstate__`/`__setstate__`**, unlike the slotted `SomeClass`, because a dict class pickles fine without them.\n\nHashability lands in the same place by a different route. With `hash is None` and `auto_detect` off, [the chain](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1506-L1518) skips the own-`__hash__` probe, finds `eq is True` but `is_frozen is False`, and falls to the final `else`: `UNHASHABLE`.\n\nAnd despite `force_kw_only=True` arriving from `make_class`, [the keyword-only decision](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1523-L1527) is gated on `kw_only` being truthy first. It is `False`, so `kwo = KeywordOnly.NO` and the flag never fires.\n\n> **For the owner:** `make_class` and `attr.s` default `force_kw_only` to `True`, while `define` defaults it to `False`. If you pass `kw_only=True` to `make_class`, every attribute becomes keyword-only including inherited ones and ones that set `kw_only=False` themselves; pass `force_kw_only=False` if you want the modern per-class behavior.\n\nThe result is [a `ClassProps`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1529-L1562) that reads as the mirror image of chapter 1's: `is_slotted=False`, `collected_fields_by_mro=False`, `added_ordering=True`, `added_pickling=False`, `on_setattr_hook=None`, `hashability=UNHASHABLE`. [`is_hashable`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3056-L3061) returns `False`, so the `cache_hash` guard passes trivially.\n\n## Harvesting fields that were never in the class\n\n[`_ClassBuilder.__init__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L684-L691) calls `_transform_attrs` as before, and this time [the very first branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L402-L403) takes over: `these is not None`, so `ca_list = list(these.items())` and the class body is never scanned. [`_get_annotations(C)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_compat.py#L30-L34) still runs \u2014 the trace records it returning `{}` \u2014 but its only remaining job is supplying `anns.get(attr_name)` as the type, which is `None` for both fields.\n\nEach `_CountingAttr` is frozen into an [`Attribute`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2594-L2626): `Attribute(name='a', default=NOTHING, type=None, kw_only=False, eq=True, order=True, alias=None, alias_is_default=True)`, and the same for `b`. Because neither carries an explicit alias, [the alias-filling loop](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L471-L476) reaches past the frozen `__setattr__` with `object.__setattr__` and writes `alias='a'` and `alias='b'`. Both defaults are `NOTHING`, so [the mandatory-after-default ordering check](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L485-L489) never trips.\n\nBetween those two steps sits the one genuine divergence. `collect_by_mro` is `False`, so base-class fields are gathered by [`_collect_base_attrs_broken`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L353-L378) rather than the MRO-correct version chapter 2 used. Its own docstring says it \"adhere[s] to the old incorrect behavior\": it walks the MRO *forward* instead of reversed, it keeps attributes that were already marked `inherited`, and it mutates the `taken_attr_names` set it was given. For `C`, whose `__mro__[1:-1]` is empty, it returns `([], {})` and the choice is invisible. For any `make_class` class with an *attrs* base, it is not.\n\n> **For the owner:** `make_class` leaves `collect_by_mro` at `attr.s`'s default of `False`, which reproduces the known-wrong field ordering of issue #42
