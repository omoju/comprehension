ob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/utils.py#L108-L109)) consulting `_comparable` twice and getting `0` both times ([std.py#L1159-L1161](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1159-L1161)). Hashing is by identity; equality is by screen position. A `KeyError` on removal is swallowed on purpose \u2014 a bar that has already vanished is not an error.\n\nWith the instance gone, `_decr_instances` looks for an unfixed bar that had been pushed past the visible rows (`pos >= nrows - 1`), clears it and moves it into the freed slot ([std.py#L705-L715](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L705-L715)). Here there are no other bars, so nothing moves. The docstring is candid about the trade: order is not maintained, flicker and blank space are.\n\n## Three ways to print nothing\n\nBefore drawing, `close` has three escape hatches, none of which this bar takes.\n\nIf `last_print_t` was never set, or `last_print_t < start_t + delay` \u2014 the bar never displayed \u2014 it returns silently ([std.py#L1282-L1286](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1282-L1286)). A `delay=` long enough to outlive a fast loop therefore leaves *no trace at all*, which is the point of the option. If `self.sp` is `None` \u2014 a GUI subclass \u2014 it returns too ([std.py#L1289-L1290](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1289-L1290)).\n\nThe third is a live probe. `close` defines a bare `fp_write` and calls it with the empty string ([std.py#L1293-L1301](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1293-L1301)):\n\n```\ntqdm.close.<locals>.fp_write(s='')\n  DisableOnWriteError.disable_on_exception.<locals>.inner() \u2192 0\n```\n\nZero characters written, no exception. Had the stream been closed underneath the bar, the `ValueError` containing `'closed'` would be caught and `close` would return \u2014 shutting down a bar whose terminal has gone away is not treated as a failure. Any other `ValueError` re-raises.\n\n## The final frame tells a different story\n\n`leave = pos == 0 if self.leave is None else self.leave` ([std.py#L1303](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1303)) resolves to `True`. Under the lock, two statements run that are easy to miss ([std.py#L1305-L1310](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1305-L1310)):\n\n```python\nself._ema_dt = lambda: None\nself.display(pos=0)\n```\n\nThe EMA that Chapter 8 spent two updates training is *thrown away* and replaced with a function that returns `None`. `format_dict` computes `rate` as `self._ema_dn() / self._ema_dt() if self._ema_dt() else None` ([std.py#L1466](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1466)) \u2014 the condition is evaluated first, is now falsy, and `_ema_dn()` is never even called. That is visible in the trace: at line 558 `format_dict` has no `EMA.__call__` beneath it at all, unlike every earlier render.\n\n`format_meter` therefore receives `rate=None` with `elapsed=0.230072021484375`, and falls back to the plain overall average ([std.py#L550-L551](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L550-L551)): `(4 - 0) / 0.230072 = 17.386`, formatted `17.39it/s`. The bar renders at `frac=1.0`, ten solid blocks, 59 columns:\n\n```\nProcessing d: 100%|\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588| 4/4 [00:00<00:00, 17.39it/s]\n```\n\nNote `17.39`, where the in-flight frame a moment earlier said `17.50`. The closing line deliberately reports a *different statistic* \u2014 the honest overall throughput for the whole run, not the smoothed recent speed. `display(pos=0)` also means the final frame is drawn at the top line rather than wherever the bar had 468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1459-L1460)).\n\nThen the caller's explicit `pbar.close()`. The latch holds: `disable` is `True`, so the method returns at its first line, printing nothing and touching no lock. Later, when the object is collected, `__del__` calls `close` once more ([std.py#L1153-L1154](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1153-L1154)) and again returns `None`. Three closes, one final frame.\n\n> **For the owner:** Relying on `__del__` to close a bar makes the timing of the final frame depend on garbage collection; prefer `with tqdm(...) as t:`, whose `__exit__` closes deterministically and downgrades a late `AttributeError` to a `TqdmWarning` rather than raising during teardown ([std.py#L1144-L1151](https://github.com/tqdm/tqdm/blob/9cf5a12b1f955468a17f0ba3c59092b23e4258ac/tqdm/std.py#L1144-L1151)).\n\nThe guarantees, in sum: the wrapped iterable is passed through unchanged; output goes to `stderr` and is throttled by `mininterval` and a self-tuning `miniters`; display and registry mutations happen under one process-global reentrant lock; stream and terminal failures degrade to a silent bar rather than an exception; and the bar is always closed, idempotently, from the iterator's `finally`. The risks worth naming before signing off: a shared daemon thread and a global lock held as class state, `TQDM_*` environment variables that can silently redefine defaults for every bar in the process, a display that lags the loop by design, and broad `except` clauses that hide I/O failures from the caller.\n\n> **Leaves as:** `text == \"abcd\"` and `stats == {'n': 4, 'total': 4, 'elapsed': 0.23186588287353516, 'rate': None, ...}`; the bar deregistered, `disable=True`, and the last line on stderr `Processing d: 100%|\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588| 4/4 [00:00<00:00, 17.39it/s]\\n`\n"}], "flow": [{"kind": "start", "label": "The caller runs the intended use", "chapter": null}, {" f.frac = frac\n        self.default_len = default_len\n        self.charset = charset\n        self.colour = colour\n\n    @property\n    def colour(self):\n        return self._colour\n\n    @colour.setter\n    def colour(self, value):\n        if not value:\n            self._colour = None\n            return\n        try:\n            if value.upper() in self.COLOURS:\n                self._colour = self.COLOURS[value.upper()]\n            elif value[0] == '#' and len(value) == 7:\n                self._colour = self.COLOUR_RGB % tuple(\n                    int(i, 16) for i in (value[1:3], value[3:5], value[5:7]))\n            else:\n                raise KeyError\n        except (KeyError, AttributeError):\n            warn(f\"Unknown colour ({value}); valid choices:\"\n                 f\" [hex (#00ff00), {', '.join(self.COLOURS)}]\", TqdmWarning, stacklevel=2)\n            self._colour = None\n\n    def __format__(self, format_spec):\n        if format_spec:\n            _type = format_spec[-1].lower()\n            try:\n                charset = {'a': self.ASCII, 'u': self.UTF, 'b': self.BLANK}[_type]\n            except KeyError:\n                charset = self.charset\n            else:\n                format_spec = format_spec[:-1]\n            if format_spec:\n                N_BARS = int(format_spec)\n                if N_BARS < 0:\n                    N_BARS += self.default_len\n            else:\n                N_BARS = self.default_len\n        else:\n            charset = self.charset\n            N_BARS = self.default_len\n\n        nsyms = len(charset) - 1\n        bar_length, frac_bar_length = divmod(int(self.frac * N_BARS * nsyms), nsyms)\n\n        res = charset[-1] * bar_length\n        if bar_length < N_BARS:  # whitespace padding\n            res = res + charset[frac_bar_length] + charset[0] * (N_BARS - bar_length - 1)\n        return self.colour + res + self.COLOUR_RESET if self.colour else res\n\n\nclass EMA:\n    \"\"\"\n    Exponential moving average: smoothing to give progressively lower\n    weights to older values.\n\n    Parameters\n    ----------\n    smoothing  : float, optional\n        Smoothing factor in range [0, 1], [default: 0.3].\n        Increase to give more weight to recent values.\n        Ranges from 0 (yields old value) to 1 (yields new value).\n    \"\"\"\n    def __init__(self, smoothing=0.3):\n        self.alpha = smoothing\n        self.last = 0\n        self.calls = 0\n\n    def __call__(self, x=None):\n        \"\"\"\n        Parameters\n        ----------\n        x  : float\n            New value to include in EMA.\n        \"\"\"\n        beta = 1 - self.alpha\n        if x is not None:\n            self.last = self.alpha * x + beta * self.last\n            self.calls += 1\n        return self.last / (1 - beta ** self.calls) if self.calls else self.last\n\n\nclass tqdm(Comparable):\n    \"\"\"\n    Decorate an iterable object, returning an iterator which acts exactly\n    like the original iterable, but prints a dynamically updating\n    progress bar every time a value is requested.\n\n    Parameters\n    ----------\n    iterable  : iterable, optional\n        Iterable to decorate with a progress bar.\n        Leave blank to manually manage the updates.\n    desc  : str, optional\n        Prefix for the progress bar.\n    total  : int or float, optional\n        The number of expected iterations. If unspecified,\n        len(iterable) is used if possible. If float(\"inf\") or as a last\n        resort, only basic progress statistics are displayed\n        (no ETA, no progress bar).\n        If `gui` is True and this parameter needs subsequent updating,\n        specify an initial arbitrary large positive number,\n        e.g. 9e9.\n    leave  : bool, optional\n        If [default: True], keeps all traces of the progress bar\n        upon termination of iteration.\n        If `None`, will leave only if `position` is `0`.\n    file  : `io.TextIOWrapper` or `io.StringIO`, r(n, total, elapsed, ncols=None, prefix='',\n                     ascii=False,  # pylint: disable=redefined-builtin\n                     unit='it', unit_scale=False, rate=None, bar_format=None, postfix=None,\n                     unit_divisor=1000, initial=0, colour=None, **extra_kwargs):\n        \"\"\"\n        Return a string-based progress bar given some parameters\n\n        Parameters\n        ----------\n        n  : int or float\n            Number of finished iterations.\n        total  : int or float\n            The expected total number of iterations. If meaningless (None),\n            only basic progress statistics are displayed (no ETA).\n        elapsed  : float\n            Number of seconds passed since start.\n        ncols  : int, optional\n            The width of the entire output message. If specified,\n            dynamically resizes `{bar}` to stay within this bound\n            [default: None]. If `0`, will not print any bar (only stats).\n            The fallback is `{bar:10}`.\n        prefix  : str, optional\n            Prefix message (included in total width) [default: ''].\n            Use as {desc} in bar_format string.\n        ascii  : bool, optional or str, optional\n            If not set, use unicode (smooth blocks) to fill the meter\n            [default: False]. The fallback is to use ASCII characters\n            \" 123456789#\".\n        unit  : str, optional\n            The iteration unit [default: 'it'].\n        unit_scale  : bool or int or float, optional\n            If 1 or True, the number of iterations will be printed with an\n            appropriate SI metric prefix (k = 10^3, M = 10^6, etc.)\n            [default: False]. If any other non-zero number, will scale\n            `total` and `n`.\n        rate  : float, optional\n            Manual override for iteration rate.\n            If [default: None], uses n/elapsed.\n        bar_format  : str, optional\n            Specify a custom bar string formatting. May impact performance.\n            [default: '{l_bar}{bar}{r_bar}'], where\n            l_bar='{desc}: {percentage:3.0f}%|' and\n            r_bar='| {n_fmt}/{total_fmt} [{elapsed}<{remaining}, '\n              '{rate_fmt}{postfix}]'\n            Possible vars: l_bar, bar, r_bar, n, n_fmt, total, total_fmt,\n              percentage, elapsed, elapsed_s, ncols, nrows, desc, unit,\n              rate, rate_fmt, rate_noinv, rate_noinv_fmt,\n              rate_inv, rate_inv_fmt, postfix, unit_divisor,\n              remaining, remaining_s, eta.\n            Note that a trailing \": \" is automatically removed after {desc}\n            if the latter is empty.\n        postfix  : *, optional\n            Similar to `prefix`, but placed at the end\n            (e.g. for additional stats).\n            Note: postfix is usually a string (not a dict) for this method,\n            and will if possible be set to postfix = ', ' + postfix.\n            However other types are supported (#382).\n        unit_divisor  : float, optional\n            [default: 1000], ignored unless `unit_scale` is True.\n        initial  : int or float, optional\n            The initial counter value [default: 0].\n        colour  : str, optional\n            Bar colour (e.g. 'green', '#00ff00').\n\n        Returns\n        -------\n        out  : Formatted meter and stats, ready to display.\n        \"\"\"\n\n        # sanity check: total\n        if total and (n >= (total + 0.5) or total == float(\"inf\")):\n            # allow float imprecision (#849) or inf (#651)\n            total = None\n\n        # apply custom scale if necessary\n        if unit_scale and unit_scale not in (True, 1):\n            if total:\n                total *= unit_scale\n            n *= unit_scale\n            if rate:\n                rate *= unit_scale  # by default rate = self.avg_dn / self.avg_dt\n            unit_scale = False\n\n        elapsed_str = tqdm.format_interval(elapsed)\n\n        # if unspecified, attempt to use rate = average speed\n        # (we allow manual override since predicting time is an arcane art)\n        if rate is None and elapsed:\n            rate = (n - initial) / elapsed\n        inv_rate = 1 / rate if rate else None\n        format_sizeof = tqdm.format_sizeof\n        rate_noinv_fmt = ((format_sizeof(rate) if unit_scale else f'{rate:5.2f}')\n                          if rate else '?') + unit + '/s'\n        rate_inv_fmt = (\n            (format_sizeof(inv_rate) if unit_scale else f'{inv_rate:5.2f}')\n            if inv_rate else '?') + 's/' + unit\n        rate_fmt = rate_inv_fmt if inv_rate and inv_rate > 1 else rate_noinv_fmt\n\n        if unit_scale:\n            n_fmt = format_sizeof(n, divisor=unit_divisor)\n            total_fmt = format_sizeof(total, divisor=unit_divisor) if total is not None else '?'\n        else:\n            n_fmt = str(n)\n            total_fmt = str(total) if total is not None else '?'\n\n        try:\n            postfix = ', ' + postfix if postfix else ''\n        except TypeError:\n            pass\n\n        remaining = (total - n) / rate if rate and total else 0\n        remaining_str = tqdm.format_interval(remaining) if rate else '?'\n        try:\n            eta_dt = (datetime.now() + timedelta(seconds=remaining)\n                      if rate and total else datetime.fromtimestamp(0, timezone.utc))\n        except OverflowError:\n            eta_dt = datetime.max\n\n        # format the stats displayed to the left and right sides of the bar\n        if prefix:\n            # old prefix setup work around\n            bool_prefix_colon_already = (prefix[-2:] == \": \")\n            l_bar = prefix if bool_prefix_colon_already else prefix + \": \"\n        else:\n            l_bar = ''\n\n        r_bar = f'| {n_fmt}/{total_fmt} [{elapsed_str}<{remaining_str}, {rate_fmt}{postfix}]'\n\n        # Custom bar formatting\n        # Populate a dict with all available progress indicators\n        format_dict = {\n            # slight extension of self.format_dict\n            'n': n, 'n_fmt': n_fmt, 'total': total, 'total_fmt': total_fmt,\n            'elapsed': elapsed_str, 'elapsed_s': elapsed,\n            'ncols': ncols, 'desc': prefix or '', 'unit': unit,\n            'rate': inv_rate if inv_rate and inv_rate > 1 else rate,\n            'rate_fmt': rate_fmt, 'rate_noinv': rate,\n            'rate_noinv_fmt': rate_noinv_fmt, 'rate_inv': inv_rate,\n            'rate_inv_fmt': rate_inv_fmt,\n            'postfix': postfix, 'unit_divisor': unit_divisor,\n            'colour': colour,\n            # plus more useful definitions\n            'remaining': remaining_str, 'remaining_s': remaining,\n            'l_bar': l_bar, 'r_bar': r_bar, 'eta': eta_dt,\n            **extra_kwargs}\n\n        # total is known: we can predict some stats\n        if total:\n            # fractional and percentage progress\n            frac = n / total\n            percentage = frac * 100\n\n            l_bar += f'{percentage:3.0f}%|'\n\n            if ncols == 0:\n                return l_bar[:-1] + r_bar[1:]\n\n            format_dict.update(l_bar=l_bar)\n            if bar_format:\n                format_dict.update(percentage=percentage)\n\n                # auto-remove colon for empty `{desc}`\n                if not prefix:\n                    bar_format = bar_format.replace(\"{desc}: \", '')\n            else:\n                bar_format = \"{l_bar}{bar}{r_bar}\"\n\n            full_bar = FormatReplace()\n            nobar = bar_format.format(bar=full_bar, **format_dict)  # no `{bar}`\n            if not full_bar.format_called:\n                return disp_trim(nobar, ncols) if ncols else nobar\n\n            # Formatting progress bar space available for bar's display\n            full_bar = Bar(frac,\n                           max(1, ncols - disp_len(nobar)) if ncols else 10,\n                           charset=Bar.ASCII if ascii is True else ascii or Bar.UTF,\n                           colour=colour)\n            if not _is_ascii(full_bar.charset) and _is_ascii(bar_format):\n                bar_format = str(bar_format)\n            res = bar_format.format(bar=full_bar, **format_dict)\n            return disp_trim(res, ncols) if ncols else res\n\n        elif bar_format:\n            # user-specified bar_format but no total\n            l_bar += '|'\n            format_dict.update(l_bar=l_bar, percentage=0)\n            full_bar = FormatReplace()\n            nobar = bar_format.format(bar=full_bar, **format_dict)\n            if not full_bar.format_called:\n                return disp_trim(nobar, ncols) if ncols else nobar\n            full_bar = Bar(0,\n                           max(1, ncols - disp_len(nobar)) if ncols else 10,\n                           charset=Bar.BLANK, colour=colour)\n            res = bar_format.format(bar=full_bar, **format_dict)\n            return disp_trim(res, ncols) if ncols else res\n        else:\n            # no total: no bar & ETA, just progress stats\n            res = (f'{(prefix + \": \") if prefix else \"\"}'\n                   f'{n_fmt}{unit} [{elapsed_str}, {rate_fmt}{postfix}]')\n            return disp_trim(res, ncols) if ncols else res\n\n    def __new__(cls, *_, **__):\n        instance = object.__new__(cls)\n        with cls.get_lock():  # also constructs lock if non-existent\n            cls._instances.add(instance)\n            # create monitoring thread\n            if cls.monitor_interval and (cls.monitor is None\n                                         or not cls.monitor.report()):\n                try:\n                    cls.monitor = TMonitor(cls, cls.monitor_interval)\n                except Exception as e:  # pragma: nocover\n                    warn(\"tqdm:disabling monitor support\"\n                         \" (monitor_interval = 0) due to:\\n\" + str(e),\n                         TqdmMonitorWarning, stacklevel=2)\n                    cls.monitor_interval = 0\n        return instance\n\n    @classmethod\n    def _get_free_pos(cls, instance=None):\n        \"\"\"Skips specified instance.\"\"\"\n        positions = {abs(inst.pos) for inst in cls._instances\n                     if inst is not instance and hasattr(inst, \"pos\")}\n        return min(set(range(len(positions) + 1)).difference(positions))\n\n    @classmethod\n    def _decr_instances(cls, instance):\n        \"\"\"\n        Remove from list and reposition another unfixed bar\n        to fill the new gap.\n\n        This means that by default (where all nested bars are unfixed),\n        order is not maintained but screen flicker/blank space is minimised.\n        (tqdm<=4.44.1 moved ALL subsequent unfixed bars up.)\n        \"\"\"\n        with cls._lock:\n            try:\n                cls._instances.remove(instance)\n            except KeyError:\n                # if not instance.gui:  # pragma: no cover\n                #     raise\n                pass  # py2: maybe magically removed already\n            # else:\n            if not instance.gui:\n                last = (instance.nrows or 20) - 1\n                # find unfixed (`pos >= 0`) overflow (`pos >= nrows - 1`)\n                instances = list(filter(\n                    lambda i: hasattr(i, \"pos\") and last <= i.pos,\n                    cls._instances))\n                # set first found to current `pos`\n                if instances:\n                    inst = min(instances, key=lambda i: i.pos)\n                    inst.clear(nolock=True)\n                    inst.pos = abs(instance.pos)\n\n    @classmethod\n    def write(cls, s, file=None, end=\"\\n\", nolock=False):\n        \"\"\"Print a message via tqdm (without overlap with bars).\"\"\"\n        fp = file if file is not None else sys.stdout\n        if fp is None:\n            return\n        with cls.external_write_mode(file=file, nolock=nolock):\n            # Write the message\n            fp.write(s)\n            fp.write(end)\n\n    @classmethod\n    @contextmanager\n    def external_write_mode(cls, file=None, nolock=False):\n        \"\"\"\n        Disable tqdm within context and refresh tqdm when exits.\n        Useful when writing to standard output stream\n        \"\"\"\n        fp = file if file is not None else sys.stdout\n        if fp is None:\n            yield\n            return\n\n        try:\n            if not nolock:\n                cls.get_lock().acquire()\n            # Clear all bars\n            inst_cleared = []\n            for inst in getattr(cls, '_instances', []):\n                # Clear instance if in the target output file\n                # or if write output + tqdm output are both either\n                # sys.stdout or sys.stderr (because both are mixed in terminal)\n                if hasattr(inst, \"start_t\") and (inst.fp == fp or all(\n                        f in (sys.stdout, sys.stderr) for f in (fp, inst.fp))):\n                    inst.clear(nolock=True)\n                    inst_cleared.append(inst)\n            yield\n            # Force refresh display of bars we cleared\n            for inst in inst_cleared:\n                inst.refresh(nolock=True)\n        finally:\n            if not nolock:\n                cls._lock.release()\n\n    @classmethod\n    def set_lock(cls, lock):\n        \"\"\"Set the global lock.\"\"\"\n        cls._lock = lock\n\n    @classmethod\n    def get_lock(cls):\n        \"\"\"Get the global lock. Construct it if it does not exist.\"\"\"\n        if not hasattr(cls, '_lock'):\n            cls._lock = TqdmDefaultWriteLock()\n        return cls._lock\n\n    @classmethod\n    def pandas(cls, **tqdm_kwargs):\n        \"\"\"\n        Registers the current `tqdm` class with\n            pandas.core.\n            ( frame.DataFrame\n            | series.Series\n            | groupby.(generic.)DataFrameGroupBy\n            | groupby.(generic.)SeriesGroupBy\n            ).progress_apply\n\n        A new instance will be created every time `progress_apply` is called,\n        and each instance will automatically `close()` upon completion.\n\n        Parameters\n        ----------\n        tqdm_kwargs  : arguments for the tqdm instance\n\n        Examples\n        --------\n        >>> import pandas as pd\n        >>> import numpy as np\n        >>> from tqdm import tqdm\n        >>> from tqdm.gui import tqdm as tqdm_gui\n        >>>\n        >>> df = pd.DataFrame(np.random.randint(0, 100, (100000, 6)))\n        >>> tqdm.pandas(ncols=50)  # can use tqdm_gui, optional kwargs, etc\n        >>> # Now you can use `progress_apply` instead of `apply`\n        >>> df.groupby(0).progress_apply(lambda x: x**2)\n\n        References\n        ----------\n        <https://stackoverflow.com/questions/18603270/\\\n        progress-indicator-during-pandas-operations-python>\n        \"\"\"\n        from warnings import catch_warnings, simplefilter\n\n        from pandas.core.frame import DataFrame\n        from pandas.core.series import Series\n        try:\n            with catch_warnings():\n                simplefilter(\"ignore\", category=FutureWarning)\n                from pandas import Panel\n        except ImportError:  # pandas>=1.2.0\n            Panel = None\n        Rolling, Expanding = None, None\n        try:  # pandas>=1.0.0\n            from pandas.core.window.rolling import _Rolling_and_Expanding\n        except ImportError:\n            try:  # pandas>=0.18.0\n                from pandas.core.window import _Rolling_and_Expanding\n            except ImportError:  # pandas>=1.2.0\n                try:  # pandas>=1.2.0\n                    from pandas.core.window.expanding import Expanding\n                    from pandas.core.window.rolling import Rolling\n                    _Rolling_and_Expanding = Rolling, Expanding\n                except ImportError:  # pragma: no cover\n                    _Rolling_and_Expanding = None\n        try:  # pandas>=0.25.0\n            from pandas.core.groupby.generic import SeriesGroupBy  # , NDFrameGroupBy\n            from pandas.core.groupby.generic import DataFrameGroupBy\n        except ImportError:  # pragma: no cover\n            try:  # pandas>=0.23.0\n                from pandas.core.groupby.groupby import DataFrameGroupBy, SeriesGroupBy\n            except ImportError:\n                from pandas.core.groupby import DataFrameGroupBy, SeriesGroupBy\n        try:  # pandas>=0.23.0\n            from pandas.core.groupby.groupby import GroupBy\n        except ImportError:  # pragma: no cover\n            from pandas.core.groupby import GroupBy\n\n        try:  # pandas>=0.23.0\n            from pandas.core.groupby.groupby import PanelGroupBy\n        except ImportError:\n            try:\n                from pandas.core.groupby import PanelGroupBy\n            except ImportError:  # pandas>=0.25.0\n                PanelGroupBy = None\n\n        tqdm_kwargs = tqdm_kwargs.copy()\n        deprecated_t = [tqdm_kwargs.pop('deprecated_t', None)]\n\n        def inner_generator(df_function='apply'):\n            def inner(df, func, *args, **kwargs):\n                \"\"\"\n                Parameters\n                ----------\n                df  : (DataFrame|Series)[GroupBy]\n                    Data (may be grouped).\n                func  : function\n                    To be applied on the (grouped) data.\n                **kwargs  : optional\n                    Transmitted to `df.apply()`.\n                \"\"\"\n\n                # Precompute total iterations\n                total = tqdm_kwargs.pop(\"total\", getattr(df, 'ngroups', None))\n                if total is None:  # not grouped\n                    if df_function == 'applymap':\n                        total = df.size\n                    elif isinstance(df, Series):\n                        total = len(df)\n                    elif (_Rolling_and_Expanding is None or\n                          not isinstance(df, _Rolling_and_Expanding)):\n                        # DataFrame or Panel\n                        axis = kwargs.get('axis', 0)\n                        if axis == 'index':\n                            axis = 0\n                        elif axis == 'columns':\n                            axis = 1\n                        # when axis=0, total is shape[axis1]\n                        total = df.size // df.shape[axis]\n\n                # Init bar\n                if deprecated_t[0] is not None:\n                    t = deprecated_t[0]\n                    deprecated_t[0] = None\n                else:\n                    t = cls(total=total, **tqdm_kwargs)\n\n                if len(args) > 0:\n                    # *args intentionally not supported (see #244, #299)\n                    TqdmDeprecationWarning(\n                        \"Except func, normal arguments are intentionally\" +\n                        \" not supported by\" +\n                        \" `(DataFrame|Series|GroupBy).progress_apply`.\" +\n                        \" Use keyword arguments instead.\",\n                        fp_write=getattr(t.fp, 'write', sys.stderr.write))\n\n                try:  # pandas>=1.3.0,<3.0\n                    from pandas.core.common import is_builtin_func\n                except ImportError:  # pandas<1.3.0\n                    is_builtin_func = getattr(df, '_is_builtin_func', lambda f: f)\n                try:\n                    func = is_builtin_func(func)\n                except TypeError:\n                    pass\n\n                # Define bar updating wrapper\n                def wrapper(*args, **kwargs):\n                    # update tbar correctly\n                    # it seems `pandas apply` calls `func` twice\n                    # on the first column/row to decide whether it can\n                    # take a fast or slow code path; so stop when t.total==t.n\n                    t.update(n=1 if not t.total or t.n < t.total else 0)\n                    return func(*args, **kwargs)\n\n                # Apply the provided function (in **kwargs)\n                # on the df using our wrapper (which provides bar updating)\n                try:\n                    return getattr(df, df_function)(wrapper, **kwargs)\n                finally:\n                    t.close()\n\n            return inner\n\n        # Monkeypatch pandas to provide easy methods\n        # Enable custom tqdm progress in pandas!\n        Series.progress_apply = inner_generator()\n        SeriesGroupBy.progress_apply = inner_generator()\n        Series.progress_map = inner_generator('map')\n        SeriesGroupBy.progress_map = inner_generator('map')\n\n        DataFrame.progress_apply = inner_generator()\n        DataFrameGroupBy.progress_apply = inner_generator()\n        DataFrame.progress_applymap = inner_generator('applymap')\n        DataFrame.progress_map = inner_generator('map')\n        DataFrameGroupBy.progress_map = inner_generator('map')\n\n        if Panel is not None:\n            Panel.progress_apply = inner_generator()\n        if PanelGroupBy is not None:\n            PanelGroupBy.progress_apply = inner_generator()\n\n        GroupBy.progress_apply = inner_generator()\n        GroupBy.progress_aggregate = inner_generator('aggregate')\n        GroupBy.progress_transform = inner_generator('transform')\n\n        if Rolling is not None and Expanding is not None:\n            Rolling.progress_apply = inner_generator()\n            Expanding.progress_apply = inner_generator()\n        elif _Rolling_and_Expanding is not None:\n            _Rolling_and_Expanding.progress_apply = inner_generator()\n\n    # override defaults via env vars\n    @envwrap(\"tqdm\", is_method=True, types={'total': float, 'ncols': int, 'miniters': float,\n                                            'position': int, 'nrows': int})\n    def __init__(self, iterable=None, desc=None, total=None, leave=True, file=None,\n                 ncols=None, mininterval=0.1, maxinterval=10.0, miniters=None,\n                 ascii=None,  # p .wrapper_setattr('write', write)\n        elif method == \"read\":\n            @wraps(func)\n            def read(*args, **kwargs):\n                data = func(*args, **kwargs)\n                callback(len(data))\n                return data\n            self.wrapper_setattr('read', read)\n        else:\n            raise KeyError(\"Can only wrap read/write methods\")\n\n\ndef _is_utf(encoding):\n    try:\n        '\\u2588\\u2589'.encode(encoding)\n    except UnicodeEncodeError:\n        return False\n    except Exception:\n        try:\n            return encoding.lower().startswith('utf-') or ('U8' == encoding)\n        except Exception:\n            return False\n    else:\n        return True\n\n\ndef _supports_unicode(fp):\n    try:\n        return _is_utf(fp.encoding)\n    except AttributeError:\n        return False\n\n\ndef _is_ascii(s):\n    if isinstance(s, str):\n        for c in s:\n            if ord(c) > 255:\n                return False\n        return True\n    return _supports_unicode(s)\n\n\ndef _screen_shape_wrapper():  # pragma: no cover\n    \"\"\"\n    Return a function which returns console dimensions (width, height).\n    Supported: linux, osx, windows, cygwin.\n    \"\"\"\n    def inner(fp):\n        try:\n            from os import get_terminal_size\n            cols, lines = get_terminal_size(getattr(fp, 'fileno', lambda: None)())\n            return cols - 1, lines - 1\n        except Exception:\n            return None, None\n\n    return inner\n\n\ndef _environ_cols_wrapper():  # pragma: no cover\n    \"\"\"\n    Return a function which returns console width.\n    Supported: linux, osx, windows, cygwin.\n    \"\"\"\n    warn(\"Use `_screen_shape_wrapper()(file)[0]` instead of\"\n         \" `_environ_cols_wrapper()(file)`\", DeprecationWarning, stacklevel=2)\n    shape = _screen_shape_wrapper()\n    if not shape:\n        return None\n\n    @wraps(shape)\n    def inner(fp):\n        return shape(fp)[0]\n\n    return inner\n\n\ndef _term_move_up():  # pragma: no cover\n    return '' if (os.name == 'nt') and (colorama is None) else '\\x1b[A'\n\n\ndef _text_width(s):\n    return sum(2 if east_asian_width(ch) in 'FW' else 1 for ch in str(s))\n\n\ndef disp_len(data):\n    \"\"\"\n    Returns the real on-screen length of a string which may contain\n    ANSI control codes and wide chars.\n    \"\"\"\n    return _text_width(RE_ANSI.sub('', data))\n\n\ndef disp_trim(data, length):\n    \"\"\"\n    Trim a string which may contain ANSI control characters.\n    \"\"\"\n    if len(data) == disp_len(data):\n        return data[:length]\n\n    ansi_present = bool(RE_ANSI.search(data))\n    while disp_len(data) > length:  # carefully delete one char at a time\n        data = data[:-1]\n    if ansi_present and bool(RE_ANSI.search(data)):\n        # assume ANSI reset is required\n        return data if data.endswith(\"\\033[0m\") else data + \"\\033[0m\"\n    return data\n"}}</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const short = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const permalink = (path, a, b) => `${D.repo.url}/blob/${D.repo.commit}/${path}#L${a}` + (b && b !== a ? `-L${b}` : "");

$("meta").textContent = `${D.repo.name} @ ${D.repo.commit.slice(0, 7)} · written for the ${D.reader}`;
$("title").textContent = D.title;
$("premise").innerHTML = marked.parseInline(D.premise);

// ---- flowchart: laid out top to bottom on one spine; roads not taken exit to the right
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
function wrap(text, width) {  // monospace, so characters are a fair measure
  const out = []; let line = "";
  for (let word of String(text).split(/(?<=[ .,(])/)) {
    if ((line + word).length > width && line) { out.push(line.trimEnd()); line = ""; }
    while (word.length > width && !line) { out.push(word.slice(0, width)); word = word.slice(width); }
    line += word;
  }
  if (line) out.push(line.trimEnd());
  return out;
}
const svg = $("chart");
const CX = 112, BOX = 210, SIDE_X = 240, SIDE_W = 136, GAP = 26;
const bandOf = {}; let y = 10, prevBottom = null, prevChapter = undefined;
const defs = el("defs", {}, svg);
for (const [id, cls] of [["arrow", ""], ["dash", ""]]) {
  const m = el("marker", { id, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L8,4 L0,8 z" }, m);
}
const bandsLayer = el("g", {}, svg), wires = el("g", {}, svg), nodes = el("g", {}, svg);
const chapterTitle = Object.fromEntries(D.chapters.map((c) => [c.n, c]));
function textLines(g, lines, x, y0, anchor, cls) {
  lines.forEach((t, i) => { const e = el("text", { x, y: y0 + i * 13, "text-anchor": anchor }, g); if (cls) e.setAttribute("class", cls); e.textContent = t; });
}
function connect(fromY, toY, label) {
  el("line", { x1: CX, y1: fromY, x2: CX, y2: toY - 1, class: "wire", "marker-end": "url(#arrow)" }, wires);
  if (label) { const t = el("text", { x: CX + 6, y: fromY + 14, class: "ans" }, wires); t.textContent = label; }
}
let pendingLabel = null;
for (const it of D.flow) {
  if (it.chapter !== prevChapter && it.chapter != null) {  // a chapter starts: open its band
    y += prevBottom == null ? 0 : 8;
    bandOf[it.chapter] = { top: y, bottom: y };
    y += 20;
  }
  if (it.chapter != null) prevChapter = it.chapter;
  const top = y + (prevBottom == null ? 0 : GAP);
  const g = el("g", { class: "node", tabindex: 0 }, nodes);
  let h;
  if (it.kind === "start" || it.kind === "end") {
    const lines = wrap(it.label, 30); h = 14 + lines.length * 13;
    g.classList.add("term");
    el("rect", { x: CX - BOX / 2, y: top, width: BOX, height: h, rx: h / 2, class: "shape" }, g);
    textLines(g, lines, CX, top + 17, "middle");
  } else if (it.kind === "data") {
    const lines = wrap(it.label, 28).slice(0, 3); h = 14 + lines.length * 13;
    g.classList.add("data");
    const k = 10;
    el("path", { d: `M${CX - BOX / 2 + k},${top} H${CX + BOX / 2} L${CX + BOX / 2 - k},${top + h} H${CX - BOX / 2} Z`, class: "shape" }, g);
    textLines(g, lines, CX, top + 17, "middle");
    g.onclick = () => {};
  } else if (it.kind === "step") {
    const name = it.fn.length > 28 && it.fn.includes(".") ? [it.fn.slice(0, it.fn.lastIndexOf(".")), it.fn.slice(it.fn.lastIndexOf("."))] : wrap(it.fn, 28);
    const val = it.returned && it.returned !== "None" ? ["→ " + (it.returned.length > 26 ? it.returned.slice(0, 25) + "…" : it.returned)] : [];
    h = 12 + (name.length + val.length) * 13;
    el("rect", { x: CX - BOX / 2, y: top, width: BOX, height: h, rx: 3, class: "shape" }, g);
    textLines(g, name, CX, top + 16, "middle");
    textLines(g, val, CX, top + 16 + name.length * 13, "middle", "val");
    const title = el("title", {}, g); title.textContent = `${it.fn}  (${it.file}:${it.line})` + (it.returned ? `\nreturns ${it.returned}` : "");
    g.onclick = () => { showCode(it.file, it.line, it.end); if (it.chapter) $("ch-" + it.chapter).scrollIntoView(); };
  } else {  // decision
    let lines = wrap(it.question, 16);
    if (lines.length > 3) lines = [...lines.slice(0, 2), lines[2].slice(0, 15) + "…"];
    h = 34 + lines.length * 13;
    const hw = 100;
    el("path", { d: `M${CX},${top} L${CX + hw},${top + h / 2} L${CX},${top + h} L${CX - hw},${top + h / 2} Z`, class: "shape" }, g);
    textLines(g, lines, CX, top + h / 2 - (lines.length - 1) * 6 + 4, "middle");
    // the road not taken
    const ex = el("g", { class: "exit" }, g);
    const exitLines = wrap(it.exit, 20).slice(0, 3);
    const eh = 10 + exitLines.length * 13, ey = top + h / 2 - eh / 2;
    el("path", { d: `M${CX + hw},${top + h / 2} H${SIDE_X - 1}`, class: "road", "marker-end": "url(#dash)" }, ex);
    const sa = el("text", { x: CX + hw + 5, y: top + h / 2 - 5, class: "ans side" }, ex); sa.textContent = it.side;
    el("rect", { x: SIDE_X, y: ey, width: SIDE_W, height: eh, rx: 3 }, ex);
    textLines(ex, exitLines, SIDE_X + 6, ey + 15, "start");
    sa.setAttribute("x", CX + hw + 3);
    const title = el("title", {}, g); title.textContent = `${it.question}\ntaken: ${it.answer}\notherwise (${it.side}): ${it.exit}\n${it.file}:${it.line}`;
    g.onclick = () => { showCode(it.file, it.line, it.end); if (it.chapter) $("ch-" + it.chapter).scrollIntoView(); };
  }
  if (prevBottom != null) connect(prevBottom, top, pendingLabel);
  pendingLabel = it.kind === "decision" ? it.answer : null;
  if (pendingLabel && pendingLabel.length > 18) pendingLabel = pendingLabel.slice(0, 17) + "…";
  prevBottom = top + h; y = prevBottom;
  if (it.chapter != null && bandOf[it.chapter]) bandOf[it.chapter].bottom = y;
}
y += 12;
for (const [n, b] of Object.entries(bandOf)) {
  const ch = chapterTitle[n];
  const g = el("g", { class: "band" + (ch && ch.md ? "" : " unwritten"), id: "band-" + n }, bandsLayer);
  el("rect", { x: 0, y: b.top, width: 380, height: b.bottom - b.top + 8, rx: 6 }, g);
  const t = el("text", { x: 6, y: b.top + 14 }, g);
  t.textContent = `${n} · ${ch ? (ch.title.length > 48 ? ch.title.slice(0, 47) + "…" : ch.title) : ""}`;
  g.style.cursor = "pointer";
  g.onclick = () => $("ch-" + n).scrollIntoView();
}
svg.setAttribute("viewBox", `0 0 380 ${y}`);
svg.setAttribute("height", y);

// ---- story
const story = $("story");
const cite = new RegExp(D.repo.url.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "/blob/[0-9a-f]+/([^#]+)#L(\\d+)(?:-L(\\d+))?");
for (const ch of D.chapters) {
  const sec = document.createElement("section");
  sec.className = "chapter"; sec.id = "ch-" + ch.n; sec.dataset.n = ch.n;
  const prose = document.createElement("div"); prose.className = "prose";
  if (ch.md) {
    prose.innerHTML = marked.parse(ch.md);
    for (const q of prose.querySelectorAll("blockquote")) {  // "**For the owner:** …" callouts
      const lead = q.querySelector("p > strong:first-child");
      if (lead && /^for the /i.test(lead.textContent)) q.classList.add("aside");
    }
    for (const a of prose.querySelectorAll("a[href]")) {
      const m = a.getAttribute("href").match(cite);
      if (!m) { a.target = "_blank"; a.rel = "noopener"; continue; }
      a.className = "cite";
      a.dataset.path = m[1]; a.dataset.a = m[2]; a.dataset.b = m[3] || m[2];
      a.onclick = (e) => { e.preventDefault(); pick(a, true); };
    }
  } else {
    prose.innerHTML = `<h1></h1><div class="pending">This chapter is planned but not written yet.<div class="io"></div></div>`;
    prose.querySelector("h1").textContent = `Chapter ${ch.n} · ${ch.title}`;
    prose.querySelector(".io").textContent = `enters as ${ch.data_in}\nleaves as ${ch.data_out}`;
  }
  sec.append(prose);
  story.append(sec);
}

// ---- code panel
const panel = $("code");
let pinned = null;
function showCode(path, a, b) {
  a = +a; b = +b;
  const src = D.files[path];
  $("where").textContent = `${path}:${a}${b !== a ? "-" + b : ""}`;
  $("gh").href = permalink(path, a, b);
  const body = $("codebody");
  body.textContent = "";
  if (src === undefined) { body.innerHTML = '<div class="code-empty">This file is not part of the repository snapshot.</div>'; return; }
  const frag = document.createDocumentFragment();
  src.split("\n").forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "ln" + (i + 1 >= a && i + 1 <= b ? " hl" : "");
    const n = document.createElement("span"); n.textContent = i + 1;
    const t = document.createElement("span"); t.textContent = text || " ";
    row.append(n, t); frag.append(row);
  });
  body.append(frag);
  const first = body.children[Math.max(0, a - 1)];
  if (first) body.scrollTop += first.getBoundingClientRect().top - body.getBoundingClientRect().top - body.clientHeight * 0.3;
  panel.classList.add("open");
}
function pick(a, byClick) {
  document.querySelectorAll("a.cite.on").forEach((x) => x.classList.remove("on"));
  a.classList.add("on");
  if (byClick) pinned = a.closest("p, li, td, blockquote");
  showCode(a.dataset.path, a.dataset.a, a.dataset.b);
}
$("close").onclick = () => panel.classList.remove("open");

// ---- follow the reader: current chapter on the map, current paragraph's code on the right
const wide = () => window.matchMedia("(min-width: 1361px)").matches;
let current = null, activePara = null;
function follow() {
  const mid = window.innerHeight * 0.4;
  let sec = null;
  for (const s of document.querySelectorAll(".chapter")) { const r = s.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid) sec = s; }
  if (sec && sec.dataset.n !== current) {
    current = sec.dataset.n;
    document.querySelectorAll(".band.active").forEach((b) => b.classList.remove("active"));
    const band = $("band-" + current);
    if (band) {
      band.classList.add("active");
      const map = document.querySelector(".map");
      if (window.matchMedia("(min-width: 761px)").matches) {
        const r = band.getBoundingClientRect(), m = map.getBoundingClientRect();
        if (r.top < m.top || r.top > m.bottom - 80) map.scrollTop += r.top - m.top - 40;
      }
    }
  }
  if (!wide()) return;  // on narrow screens the code opens only when asked
  let para = null;
  for (const p of document.querySelectorAll(".chapter p")) {
    if (!p.querySelector("a.cite")) continue;
    const r = p.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid - 40) { para = p; break; }
  }
  if (para && para !== activePara) {
    if (activePara) activePara.classList.remove("active");
    activePara = para; para.classList.add("active");
    if (pinned !== para) { pinned = null; pick(para.querySelector("a.cite"), false); }
  }
}
let ticking = false;
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; follow(); }); } }, { passive: true });
addEventListener("resize", follow);
follow();
if (wide()) { const first = document.querySelector("a.cite"); if (first && !activePara) pick(first, false); }
</script>
