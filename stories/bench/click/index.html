<script type="application/json" id="data">{"title": "Hello, Click: one value's round trip through a command line", "premise": "A caller has a Python function, `hello(count, name)`, and wants it to behave like a real command line program: `--count=3` typed on the command line, a name asked for interactively, output captured so a test can assert on it. Nothing in the function knows about argv, prompts, encodings, or exit codes. The data that arrives \nu2014 the argument list `['--count=3']` and the keystrokes `'Click\\n'` \nu2014 has to cross from an untrusted outside world into a typed Python call, and a result has to come back out with an exit code that means something. This is the story of that crossing, and of the guarantees Click makes along the way.", "reader": "owner", "repo": {"name": "pallets/click", "url": "https://github.com/pallets/click", "commit": "06b2a678741131fd577ce170e23e5ca0aeba0309"}, "chapters": [{"n": 1, "title": "Before the data: declarations become objects", "data_in": "the undecorated function `hello` plus decorator keywords: `default=1, help=\"Number of greetings.\"` and `prompt=\"Your name\", help=\"The person to greet.\"`", "data_out": "`<Command hello>` carrying `params=[<Option count>, <Option name>]`, each with a resolved name, type and default", "span": [2, 38], "md": "# Chapter 1 \u00b7 Before the data: declarations become objects\n\n> **Enters as:** a plain function `hello(count, name)` and two sets of decorator keywords \u2014 `(\"--count\", default=1, help=\"Number of greetings.\")` and `(\"--name\", prompt=\"Your name\", help=\"The person to greet.\")`\n\nNothing has been typed yet. There is no `--count=3`, no keystroke `Click\\n`, no exit code. What exists at this moment is a function that takes two ordinary Python arguments and knows nothing about argv, and three decorator expressions sitting above it. Those expressions run at import time, in source order: `click.command()` first, then `click.option(\"--count\", ...)`, then `click.option(\"--name\", ...)`. Each one only manufactures a closure and hands it back \u2014 [`option` picks `Option` as its class and returns an inner `decorator`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/decorators.py#L370-L377), nothing more.\n\nThe real work starts when those closures are *applied*, and Python applies decorators bottom-up. So the first declaration to become an object is the one written last: `--name`.\n\n## `--name` becomes an Option\n\n[`decorator(f)` constructs `cls(param_decls, **attrs)` immediately](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/decorators.py#L373-L375), so `Option.__init__` runs with `param_decls=('--name',)`, `prompt='Your name'`, `help='The person to greet.'`, and \u2014 importantly \u2014 `flag_value=Sentinel.UNSET`, the default for an argument the caller never passed.\n\nIt delegates first [to `Parameter.__init__`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3076-L3083), where three things are decided about the declaration.\n\n**A name.** [`_parse_decls` walks the declarations](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3364-L3389), splitting `'--name'` with [`_split_opt`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L111-L117) into the prefix `'--'` and the body `'name'`. With no explicit identifier among the declarations, [the longest spelling wins and is lowercased with dashes turned into underscores](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3391-L3393). The result is the triple `('name', ['--name'], [])`: the Python name, the primary spellings, and no secondary (negating) spellings. That `name` is the keyword the function will eventually be called with, which is why [`_check_name_is_usable`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2482-L2517) inspects it on the way past.\n\n> **For the owner:** A declaration like `--from` or `--0-file` produces a parameter name that no Python callback can declare, and Click reports this as a `DeprecationWarning` today and [promises a `TypeError` in 9.0](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2509-L2517). Run your test suite with deprecation warnings turned into errors so these surface before the upgrade.\n\n**A type.** No `type=` was given, so [`convert_type(None, default)` is asked to guess](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2389) from the default \u2014 and the default here is the sentinel `UNSET`. [`_guess_type` dutifully returns `type(UNSET)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/types.py#L1321-L1328), the `Sentinel` enum class, which is exactly the sort of nonsense you do not want to become a converter. It does not: because the type was *guessed* rather than declared, [`convert_type` falls back to `STRING`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/types.py#L1372-L1385) rather than wrapping the enum in a `FuncParamType`. `--name` will therefore accept text.\n\n**A default that is honestly absent.** [`self.default = default` keeps the raw sentinel](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2404-L2410), and alongside it `self._default_explicit = default is not UNSET` records `False`. This pair is the whole reason Click can later tell \"the author supplied no default\" apart from \"the author supplied `None`\" \u2014 a distinction that matters when two options share a storage name, and again when a flag's default has to be derived lazily.\n\nBack in `Option.__init__`, the remaining phases are quick. The prompt string is stored as given, `'Your name'`, and `prompt_required` stays `True`. [`_infer_flag_kind(is_flag=None, flag_value=UNSET)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3155-L3186) returns `(False, False)`: there is no `flag_value`, no secondary spelling, and `prompt_required` is on, so this is an ordinary value-taking option, not a flag. [`_pick_type`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3202-L3209) sees a non-flag, non-count option and leaves `STRING` in place. Finally [`_validate`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3251-L3271) checks the combinations that cannot work \u2014 `nargs=-1` on an option, a secondary spelling on a non-boolean flag, `count` together with `multiple` \u2014 and passes.\n\n> **For the owner:** Every one of those illegal-combination checks sits behind [`if not __debug__: return`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3257-L3258), so running the interpreter with `-O` constructs the broken option silently. Keep assertions enabled wherever the CLI is built, or treat a clean start under `-O` as unverified.\n\nThe finished object is then [appended to `f.__click_params__`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/decorators.py#L314-L321) \u2014 a list bolted onto the still-undecorated function, because there is no command yet to attach it to.\n\n## `--count` takes the same road to a different place\n\nThe second decorator runs the identical path with one keyword changed: `default=1`. That single difference propagates. `_guess_type` sees an `int` and [`convert_type` returns the `INT` singleton](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/types.py#L1375-L1376); `_default_explicit` records `True`. `--count` is now an option that will insist on integers, purely because its default happened to be one.\n\n> **For the owner:** An option's type is inferred from its default value, so changing a default from `1` to `None` silently changes the option from integer-parsing to text-parsing. Set `type=` explicitly on any option whose default is not representative of the values you expect.\n\n## The command assembles itself\n\nLast, the `command` closure receives the function. It [pops `__click_params__`, deletes the attribute, and extends its parameter list with `reversed(decorator_params)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/decorators.py#L221-L230) \u2014 the reversal undoing the bottom-up application, so the options end up in the order a reader of the source would expect: `count`, then `name`. [The help text is taken from `f.__doc__`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/decorators.py#L232-L233), and [the command name is the function name lowercased with underscores turned into dashes](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/decorators.py#L239-L246) \u2014 `hello`, with no `_command`/`_cmd`/`_group`/`_grp` suffix to strip. Then [`Command.__init__` stores name, callback, params and help](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1080-L1095) and the module-level name `hello` stops being a function and becomes a `Command`.\n\n> **For the owner:** The function's docstring is published verbatim as the program's `--help` body. Review docstrings on command callbacks as user-facing copy, not as internal notes.\n\nTwo options now stand ready: one that knows it wants an integer and has a fallback of `1`, one that knows it wants text, has no fallback at all, and carries a question to ask if nobody answers it. Neither has seen a single character of input.\n\n> **Leaves as:** `<Command hello>` with `params == [<Option count>, <Option name>]`, where `count` has `type is INT`, `default == 1`, `_default_explicit is True`, and `name` has `type is STRING`, `default is UNSET`, `_default_explicit is False`, `prompt == 'Your name'`, `is_flag is False`\n"}, {"n": 2, "title": "An isolated world: the runner swaps the process out from under you", "data_in": "`input='Click\\n'`, `env=None`, `color=False`", "data_out": "three byte buffers `(stdout, stderr, output)` and a process whose `sys.stdin/stdout/stderr`, `termui` prompt hooks, `should_strip_ansi`, `pdb.Pdb.__init__` and `FORCED_WIDTH` have all been replaced", "span": [39, 57], "md": "# Chapter 2 \u00b7 An isolated world: the runner swaps the process out from under you\n\n> **Enters as:** `input='Click\\n'`, `args=['--count=3']`, `env=None`, `color=False` \u2014 a string of keystrokes that has not yet been typed, and a command line that has not yet been read\n\nThe command is built. What it needs now is a world to run in: a stdin that will answer its prompt, a stdout that can be read back afterwards, and an environment that is not the test runner's own. `CliRunner` manufactures that world, and it does so by reaching into process-global state and swapping it out.\n\nThe runner itself is cheap. [`CliRunner.__init__` validates the capture mode first](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L368-L375) \u2014 anything other than `'sys'` or `'fd'` is a `ValueError`, and `'fd'` is rejected outright on Windows \u2014 then [stores five settings](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L376-L380). For this run they are the defaults: `charset='utf-8'`, `env={}`, `echo_stdin=False`, `catch_exceptions=True`, `capture='sys'`.\n\n`invoke` is called with the command, the argument list, and the input string. Before entering isolation it checks whether file-descriptor capture was requested; [`capture == 'fd'` would start two `_FDCapture`s on fds 1 and 2](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L657-L664). Here it is `'sys'`, so `cap_out` and `cap_err` stay `None` and the real file descriptors of the host process are never touched. Then [`with self.isolation(input=input, env=env, color=color)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L666) opens the door.\n\n## The keystrokes become bytes\n\n`'Click\\n'` is the first thing isolation handles. [`make_input_stream`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L211-L228) looks for a `read` attribute, finds none on a `str`, and so [encodes it with the runner's charset and wraps it in a `BytesIO`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L223-L228). The input is now `b'Click\\n'` sitting in a buffer at position zero, waiting for something to read a line from it. (Had a real file object been passed, it would have been unwrapped to its binary reader instead, or rejected with a `TypeError` if it had none.)\n\nBefore anything is replaced, the current values are captured: [`old_stdin`, `old_stdout`, `old_stderr` and `old_forced_width`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L435-L439), with `formatting.FORCED_WIDTH` immediately pinned to `80` so help output does not vary with the terminal that happens to be running the tests. [`make_env`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L389-L396) copies the runner's own environment overrides and merges the per-call ones; with both empty it returns `{}`.\n\n## Three buffers, one of them shared\n\n[`StreamMixer()` creates a plain `BytesIO` called `output`, then two `BytesIOCopy` buffers that both copy into it](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L150-L153). `BytesIOCopy` is four lines of mechanism with one guarantee in it: [`write` appends to the shared buffer before appending to itself](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L133-L135), and [`flush` flushes both](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L129-L131). Because the mixing happens at write time rather than by concatenating two logs afterwards, the shared buffer records the true order in which stdout and stderr were written \u2014 which is why the prompt echo will later appear ahead of the greetings in the result the test asserts on.\n\nOver those buffers go three text wrappers. [`sys.stdin` becomes a `_NamedTextIOWrapper` over the input bytes](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L450-L452), [`sys.stdout` over the stdout copy](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L459-L464), and [`sys.stderr` over the stderr copy with `errors=\"backslashreplace\"`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L466-L472) \u2014 so a command that writes undecodable bytes to stderr produces escapes rather than an exception during the test.\n\nEach wrapper carries [`_original_fd = -1`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L182), and [`fileno()` only returns a real descriptor when that field is non-negative](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L192-L200). In `'sys'` mode it stays `-1`, so `sys.stdout.fileno()` raises `io.UnsupportedOperation`. That is deliberate: it stops code under test from calling `os.dup2` on the \"stdout\" fd and clobbering the host test runner's real output. In `'fd'` mode `invoke` would [point `_original_fd` at the saved pre-redirection descriptor](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L670-L672) so C-level consumers keep working.\n\n> **For the owner:** The default `capture='sys'` records only Python-level writes, so output from C extensions, subprocesses, or a stale reference to the old `sys.stdout` is not captured and `fileno()` raises. Choose `capture='fd'` for commands that shell out or write from native code, and note it is unavailable on Windows ([docstring](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L331-L338)).\n\n## The hooks the command will reach for\n\nStreams alone are not enough: a prompt does not go through `sys.stdout.write` in Click, it goes through a module-level function. So isolation defines [`visible_input`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L474-L483), which writes the prompt, pulls one line from the text-wrapped input, strips the newline, echoes it back and flushes \u2014 the behaviour a terminal would have given for free. Alongside it are [`hidden_input`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L485-L492), [`_getchar`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L494-L502) and a [`should_strip_ansi` that ignores the stream entirely and answers from the `color` argument](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L504-L511) \u2014 `color=False`, so it will answer `True` and colour codes will be stripped.\n\nThen the swap: [six module attributes are saved and overwritten](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L513-L523), including `should_strip_ansi` in *both* the `utils` and `_compat` namespaces, because each module imported its own reference. [`pdb.Pdb.__init__` is patched too](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L525-L562), defaulting the debugger to `sys.__stdin__`/`sys.__stdout__` so a `breakpoint()` inside a command talks to the real terminal instead of reading from an empty `BytesIO`; debuggers that do not subclass `pdb.Pdb` are not covered.\n\nLast, [each environment key is recorded in `old_env` before being set or deleted](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L564-L574) \u2014 the record is taken *before* the mutation, so restoration can distinguish \"was absent\" from \"was empty\". With nothing to override, the loop does nothing and [the generator yields the three buffers](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L575).\n\n> **For the owner:** Everything isolation touches is process-global \u2014 the standard streams, `os.environ`, Click's prompt hooks, the ANSI policy, and `pdb`. [The class documents that it works only in single-threaded use](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L317-L322). Parallelise tests that use `CliRunner` with processes, not threads.\n\nInside the new world, `invoke` finishes its preparation. The argument list is already a list, so [the `shlex.split` branch for string arguments](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L678-L679) is skipped. No `prog_name` was passed in `extra`, so [the fallback runs](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L681-L684) and [`get_default_prog_name` returns the command's own name](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L382-L387): `'hello'`. The argument list `['--count=3']` is about to be handed to `Command.main`.\n\n> **Leaves as:** `outstreams = (BytesIOCopy stdout, BytesIOCopy stderr, BytesIO output)` with both copies mirroring into the third; `sys.stdin` reading `b'Click\\n'`, `sys.stdout`/`sys.stderr` writing into the copies, `FORCED_WIDTH == 80`, the prompt and ANSI hooks replaced; `args == ['--count=3']` and `prog_name == 'hello'`\n"}, {"n": 3, "title": "main(): the policy at the door, and a context to live in", "data_in": "`args=['--count=3']`, `prog_name='hello'`, `standalone_mode=True`", "data_out": "a `Context` with empty `params`, empty `args`, `help_option_names=['--help']`, a fresh `ExitStack`, pushed onto the thread-local stack with `_depth == 2`", "span": [58, 69], "md": "# Chapter 3 \u00b7 main(): the policy at the door, and a context to live in\n\n> **Enters as:** `args=['--count=3']`, `prog_name='hello'`, `standalone_mode=True`\n\nThe argument list crosses into Click proper. From here until the function runs, it is in the hands of `Command.main`, which is less a parser than a doorman: it decides where the arguments go, what counts as an answer, and what the process will tell the operating system when it is over.\n\n## Two things that do not happen\n\n`args` was supplied, so the branch that reads `sys.argv[1:]` is skipped entirely, and with it the Windows expansion step: [glob patterns, `~`, and `%VAR%` are only expanded when `args is None` and `os.name == \"nt\"`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1562-L1568). Our list is simply copied. `prog_name` was supplied too \u2014 `'hello'`, from the runner \u2014 so [the `_detect_program_name()` fallback](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1570-L1571), which would have looked at `sys.argv[0]` and the `__main__` module to guess whether you ran a file or `python -m something`, never fires.\n\n## The completion door, checked first\n\nBefore a single token is parsed, [`main` calls `_main_shell_completion`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1573-L1574). That method derives a variable name from the program name \u2014 [dashes and dots become underscores, wrapped as `_{NAME}_COMPLETE`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1665-L1667), here `_HELLO_COMPLETE` \u2014 and reads it from the environment. [If it holds anything, Click runs the completion machinery and calls `sys.exit` with its result](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1669-L1677); the program's own logic is never reached. In this run the variable is unset, the function [returns immediately](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1671-L1672), and the trace records that `None`.\n\n> **For the owner:** An environment variable named after the program diverts every invocation into the completion code path and exits before the command runs. Treat `_<PROG>_COMPLETE` as part of the program's input surface in any setting where the environment is not fully under your control, and pass an explicit `complete_var` if you want a name that is harder to guess.\n\n## The policy: every path ends in sys.exit\n\nWith completion out of the way, `main` sets up its failure policy before doing any work: [`report = None` and `exit_code = 1`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1576-L1583). The initial `1` matters \u2014 anything that produces a message without choosing a code reports failure by default.\n\nThe body is a single `try` whose happy path is three lines: [build the context, invoke the command, and call `ctx.exit()`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1585-L1598). The comment there is unusually blunt about why the command's return value is *not* used as the exit code. Below it sits a ladder of handlers, each doing the same two things: re-raise when `standalone_mode` is off, otherwise record a message-writing callable and a code. [`Exit` yields its own code](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1599-L1611); [`Abort` and an interrupted prompt both end in `Aborted!`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1612-L1624); [a `ClickException` contributes `e.show` and `e.exit_code`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1625-L1629); and [an `OSError` is swallowed only when it is `EPIPE`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1630-L1635), by wrapping the streams so the interpreter's final flush cannot raise. Any other `OSError` propagates. Only then does [the message get written and `sys.exit(exit_code)` run](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1637-L1640), with [an outer handler that keeps the chosen exit code even if an interrupt arrives mid-report](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1641-L1645).\n\n> **For the owner:** With the default `standalone_mode=True`, `main` never returns \u2014 every path raises `SystemExit`, and the command's return value is discarded rather than used as a status. If you need the return value or want exceptions to propagate to your own handler, call `main(..., standalone_mode=False)` and handle `Exit` and `ClickException` yourself.\n\n## A context to live in\n\n[`make_context('hello', ['--count=3'])`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1355-L1390) first [folds `self.context_settings` into the keyword arguments, but only for keys the caller did not already pass](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1382-L1384) \u2014 explicit arguments win over command-level settings. There are none of either here, so `Context` is constructed with the command, `info_name='hello'`, and `parent=None`.\n\nWith no parent, every inherited setting falls back to the command's class defaults or to a literal. [`params` and `args` start empty](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L391-L395). [`allow_extra_args` takes `Command.allow_extra_args`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L447-L454), which [for a plain command is `False`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1038-L1045), while `allow_interspersed_args` is `True` and `ignore_unknown_options` is `False`. [`help_option_names` becomes the hard-coded `['--help']`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L478-L485).\n\nOne default deserves a second look. [`auto_envvar_prefix` stays `None`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L502-L517) because there is no parent to inherit one from and the caller passed none. That is the switch for *implicit* environment reading: with it unset, no option will quietly take its value from `HELLO_NAME` or `HELLO_COUNT` later. Options with an explicit `envvar=` always read the environment; this prefix is the opt-in for the automatic kind.\n\nFinally the bookkeeping: [empty close-callback list, `_depth = 0`, empty `_parameter_source` and `_param_default_explicit` maps, and a fresh `ExitStack`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L531-L540). That stack is where files opened by a `click.File` parameter, or anything registered with `call_on_close`, will accumulate.\n\n## Entered, but not armed\n\n`make_context` now parses \u2014 but first it enters the context in a very particular way: [`with ctx.scope(cleanup=False)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1388-L1390). `scope` [bumps `_depth` by one before delegating to the context manager and drops it afterwards](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L622-L630), and [`__enter__` bumps it again and pushes the context onto the thread-local stack](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L575-L578). So during parsing `_depth` is `2`, and when the scope closes it will fall to `1` \u2014 never to zero, which is the only value at which `__exit__` unwinds the exit stack. The practical effect: resources opened while parsing arguments stay open for the command body.\n\n[`push_context`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/globals.py#L44-L46) puts the context where [`get_current_context()`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/globals.py#L20-L41) can find it \u2014 the lookup behind `@pass_context`, behind `echo`'s colour default, and behind any helper that wants to know which command is running. It is thread-local, which is the other half of the runner's single-threaded caveat.\n\n> **For the owner:** Anything a parameter type opens during parsing (a `click.File`, for example) is registered on the context's `ExitStack` and stays open until the outermost `with` block around the context finishes. Register your own resources with `ctx.with_resource` or `ctx.call_on_close` so they are released on the same schedule, including on an early `ctx.exit()`.\n\nThe context is live, empty, and on the stack. `parse_args` is the next call.\n\n> **Leaves as:** a `Context` with `params == {}`, `args == []`, `help_option_names == ['--help']`, `allow_extra_args is False`, `auto_envvar_prefix is None`, `resilient_parsing is False`, a fresh `ExitStack`, `_depth == 2`, and `get_current_context()` returning it \u2014 about to be handed `['--count=3']`\n"}, {"n": 4, "title": "Building the parser, and the help option nobody declared", "data_in": "the fresh context and `args=['--count=3']`", "data_out": "an `_OptionParser` with `--count`, `--name` and `--help` registered, and `Command.params` now holding a cached third option named `_click_default_help`", "span": [70, 124], "md": "# Chapter 4 \u00b7 Building the parser, and the help option nobody declared\n\n> **Enters as:** the live `Context` (`params == {}`, `help_option_names == ['--help']`) and `args == ['--count=3']`\n\n`Command.parse_args` receives the list first, and its very first line is a question about emptiness: [if `args` is falsy and `no_args_is_help` is set and parsing is not resilient, raise `NoArgsIsHelpError`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1392-L1394). Two of the three are false here \u2014 the list has a token in it, and a plain `Command` leaves [`no_args_is_help` at `False`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1072) unless you ask for it \u2014 so the list passes through untouched into [`self.make_parser(ctx)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1396).\n\n## An empty parser that already knows the house rules\n\n[`make_parser` constructs an `_OptionParser` and then asks every parameter to register itself](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1252-L1257). The parser is deliberately thin \u2014 the module header says so, and the class docstring adds that it implements nothing that Click handles at a higher level. What it does take from the context are the two switches that change how tokens are grouped: [`allow_interspersed_args` and `ignore_unknown_options` are copied off `ctx`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L256-L258), `True` and `False` respectively for this run. It starts with [empty short- and long-option tables, `_opt_prefixes = {\"-\", \"--\"}`, and no positional arguments](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L260-L263).\n\n## The third parameter\n\n`make_parser` iterates over `self.get_params(ctx)`, not `self.params`, and that difference is where a parameter the author never wrote comes into existence. [`get_params` asks for the help option and, if there is one, appends it to a new list](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1128-L1133).\n\n[`get_help_option_names` starts from `ctx.help_option_names` as an ordered `dict`, then walks every user parameter and pops any name it has already claimed](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1212-L1216). `--count` and `--name` claim neither spelling, so the result is `['--help']` \u2014 exactly what the trace records. Had the author declared their own `--help`, this list would have come back empty, and [the next check would return `None`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1231-L1234): no automatic option, no error, no warning.\n\n> **For the owner:** Declaring your own option named `--help` (or `-h`, if you set `help_option_names`) silently removes Click's automatic help option rather than colliding with it. If you do that, make your option print the help page itself \u2014 `ctx.get_help()` \u2014 because nothing else will.\n\nWith a name available and `add_help_option` left at its default `True`, [Click imports the `help_option` decorator and applies it to the command](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1240-L1250). The decorator fills in a familiar shape: [`is_flag=True`, `expose_value=False`, `is_eager=True`, help text \"Show this message and exit.\", and a `show_help` callback](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/decorators.py#L612-L627). Note the second positional declaration Click passes alongside `--help`: `_HELP_OPTION_STORAGE_NAME`, [a reserved string no user parameter is expected to claim](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L59-L61). Because it is a bare identifier, [`_parse_decls` takes it as the explicit storage name](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3364-L3368) and returns `('_click_default_help', ['--help'], [])`. That indirection is why a user parameter literally named `help` no longer clobbers the help option's slot.\n\nThe rest of construction runs the same path Chapter 1 walked: [`_infer_flag_kind(is_flag=True, flag_value=UNSET)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3169-L3186) returns `(True, False)`, and [`_pick_type` sees a flag with no `flag_value` and chooses `BoolParamType`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3211-L3213) \u2014 `BOOL` in the trace.\n\nThen a small piece of housekeeping with a real reason behind it. `help_option(...)(self)` appends the new `Option` to `self.params` through `_param_memo`; [`get_help_option` immediately pops it back off and stores it in `self._help_option`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1247-L1250). So `Command.params` is still `[count, name]` afterwards, and every later call returns the same object. The comment above the cache spells out the stake: [callback ordering is computed by object comparison](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1236-L1239), so a fresh help option on each call would break the ordering in Chapter 6. The trace shows the payoff \u2014 `get_params` runs twice during parsing, and the second time `get_help_option` returns without rebuilding anything.\n\n## The checks that only exist when you are not optimising\n\nBefore returning, `get_params` polices the assembled list. [A `Counter` over every spelling warns about any option used more than once](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1138-L1149). [A second `Counter` over storage names warns in two further cases](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1151-L1180): a parameter squatting on the reserved help name, and an `Argument` sharing a name with another parameter \u2014 which, as the comment notes, silently overwrites a value during parsing. Options sharing a name are left alone on purpose; that is the feature-switch pattern.\n\nHere the counters find nothing: three distinct spellings, three distinct names. The list `[<Option count>, <Option name>, <Option _click_default_help>]` goes back to `make_parser`.\n\n> **For the owner:** All of these duplicate- and reserved-name checks sit inside `if __debug__`, so `python -O` disables them along with the illegal-combination validation in `Option._validate`. They are `UserWarning`s, not errors, even when enabled. Run your test suite without `-O` so a parameter that silently overwrites another's value is reported.\n\n## Three declarations become three parser entries\n\nEach parameter is now asked to describe itself to the parser. [`Option.add_to_parser` picks an action from the declarative settings](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3422-L3428): `append` for `multiple`, `count` for counters, otherwise `store`. Both `--count` and `--name` are ordinary value options, so both take [the non-flag branch, registering with `nargs=self.nargs`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3455-L3462) \u2014 the trace shows `add_option(obj=<Option count>, opts=['--count'], dest='count', action='store', nargs=1, const=None)`.\n\nThe help option takes the other branch: [`store` becomes `store_const`, and since there are no secondary opts, it registers once with `const=self.flag_activation_value`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3430-L3454). That property is the resolver from Chapter 1 \u2014 [an `UNSET` `flag_value` becomes `True` for an actual flag](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3142-L3153) \u2014 so the parser stores `True` when `--help` appears, while `Option.flag_value` itself keeps the sentinel for the \"did the author pass one?\" question.\n\nInside the parser, [`add_option` normalises each spelling through `_normalize_opt`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L282-L288) \u2014 a no-op here, since [no `token_normalize_func` is set on the context](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L120-L124), so `'--count'` comes back as `'--count'`. [`_Option.__init__` then splits each spelling into prefix and value](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L141-L154): `_split_opt('--count')` returns `('--', 'count')`, a two-character prefix with a multi-character value, so it goes in `_long_opts` and both `-` and `--` join the prefix set. A declaration whose first character is alphanumeric would have raised `ValueError` right there \u2014 options must start with a prefix.\n\nThree calls later the parser holds `--count`, `--name` and `--help` in `_long_opt`, an empty `_short_opt`, and an empty `_args` list, because this command declares no positional arguments.\n\n> **Leaves as:** an `_OptionParser` with `_long_opt == {'--count', '--name', '--help'}` (`--count` and `--name` as `store`/`nargs=1`, `--help` as `store_const`/`const=True`/`dest='_click_default_help'`), `_short_opt` and `_args` empty, `_opt_prefixes == {'-', '--'}`; `Command.params` still `[count, name]` with the help option cached in `Command._help_option`; `args` still `['--count=3']`, unread\n"}, {"n": 5, "title": "Tokens become a raw dict", "data_in": "`['--count=3']`", "data_out": "`({'count': '3'}, [], [<Option count>])` \nu2014 a raw string value, no leftovers, and the invocation order", "span": [125, 146], "md": "# Chapter 5 \u00b7 Tokens become a raw dict\n\n> **Enters as:** `args == ['--count=3']` \u2014 one string, still exactly as the caller typed it, handed to `_OptionParser.parse_args`\n\nThe list arrives at a parser that has never seen it. [`parse_args` wraps it in a `_ParsingState` and then runs two passes over that state: options first, positional arguments second](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L298-L314). The state is four fields and no logic: [`opts` an empty dict, `largs` an empty list, `rargs` the caller's list itself, and `order` an empty list](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L216-L222). `rargs` is the queue of tokens still to read; `largs` is where leftovers accumulate; `opts` is the dict being built; `order` is the record of who was mentioned, and in what sequence.\n\n## One token, classified\n\n[The first pass pops tokens off the front of `rargs` until it is empty](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L328-L341). `'--count=3'` comes off, nine characters long, and gets sorted into one of four buckets. It is not the bare `'--'`, which would [return immediately and leave everything after it unparsed](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L333-L334) \u2014 the standard escape hatch for a value that looks like an option. Its first character *is* in `_opt_prefixes` and it is longer than one character, so [it takes the option branch](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L335-L336). The two remaining branches are for non-option tokens: with `allow_interspersed_args` true they go to `largs` and parsing continues; with it false (what a `Group` sets, to hand the rest to a subcommand) the token is [pushed back and the pass stops](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L337-L341).\n\n## Splitting the token\n\n[`_process_opts` looks for an `=` and splits on the first one](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L475-L479): `long_opt = '--count'`, `explicit_value = '3'`. Only the first \u2014 a value like `--name=a=b` keeps its own `=` intact. The option half goes through `_normalize_opt`, which is a no-op without a `token_normalize_func`, and comes back as `'--count'`.\n\nThen [the long-option matcher is tried inside a `try`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L484-L500). That `try` is the whole unknown-option policy. If the name is not registered, [`_match_long_opt` raises `NoSuchOption` with the parser's long-option table as the pool of suggestions](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L366-L367), which the exception narrows down [with `difflib.get_close_matches`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/exceptions.py#L254-L260) \u2014 that is where `Did you mean '--count'?` comes from. The handler then has three outs: retry the token as a bundle of short options if its prefix is only one character, swallow it into `largs` if `ignore_unknown_options` is set, or re-raise.\n\nHere the name is registered, and the token stays on the road.\n\n## Reclaiming the value\n\nThe matched `_Option` is the `store` entry Chapter 4 registered. [`takes_value` is true for `store` and `append`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L165-L167), so the parser does something that reads oddly and is deliberate: [it pushes `'3'` back onto the front of `rargs` and then asks `_get_value_from_state` to consume it](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L370-L378). The comment explains the ordering \u2014 the injection happens only in a branch where no exception can follow, so an inserted value is always fully consumed. The alternative branches: an attached value on an option that takes none [raises `BadOptionUsage`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L380-L383), and a flag with no value [gets `UNSET`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L385-L386).\n\n[`_get_value_from_state` sees `nargs == 1` and one token waiting](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L450-L463). It checks whether the next token looks like the start of another option \u2014 if it did, and this option were allowed to stand alone, it would return the `FLAG_NEEDS_VALUE` sentinel instead of stealing it. `--count` is not such an option, so the branch is skipped and `'3'` is popped. Had `rargs` been empty, the same two outcomes would apply one level up: the sentinel, or [`BadOptionUsage` saying the option requires an argument](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L437-L449).\n\n[`_Option.process` writes it](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L169-L182): `state.opts['count'] = '3'` under the `store` action, and then, for every action alike, [`state.order.append(self.obj)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L182) \u2014 the Click-level `Option`, not the parser's shadow of it. `order` is now `[<Option count>]`, a record of what the user mentioned and when.\n\n> **For the owner:** The parser performs no type conversion and no validation; `opts['count']` is the string `'3'`, and the declared `default=1`/`INT` type play no part at this layer. Every rule you want enforced on input must be expressed as a parameter type, a `callback`, or a check in your command body \u2014 there is no second, hidden validation pass here.\n\n## Nothing left over\n\nThe loop finds `rargs` empty and ends. [The second pass asks `_unpack_args` to deal out whatever remains to the declared positional arguments](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L316-L325). This command declares none, so both inputs are empty and [the function returns `((), [])`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L103-L108) \u2014 no values to distribute, no unclaimed tokens. `state.largs` is set to `[]` and `rargs` cleared.\n\nOne more thing happened invisibly: both passes ran inside [a `try` that catches `UsageError` and only re-raises it when the context is not in resilient-parsing mode](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/parser.py#L308-L314). This run is not resilient, so a parse failure would have escaped normally.\n\n> **For the owner:** `resilient_parsing` discards every `UsageError` raised during parsing and returns whatever was collected so far. Shell completion relies on that, which is why completion still works on a half-typed command line. Do not set `resilient_parsing=True` on a context that will actually execute a command: unknown options and missing values become silent.\n\n> **Leaves as:** `({'count': '3'}, [], [<Option count>])` \u2014 the value still a raw string, no leftover tokens, and the user's invocation order recorded for the next stage\n"}, {"n": 6, "title": "Deciding who goes first, and the help option that was never passed", "data_in": "invocation order `[<Option count>]`, declaration order `[count, name, _click_default_help]`, and `opts={'count': '3'}` in which the help option appears nowhere", "data_out": "processing order `[_click_default_help, count, name]`, and for the help option `(None, [])` \nu2014 value `False`, source `DEFAULT`, callback invoked and did nothing, `ctx.params` untouched", "span": [147, 215], "md": "# Chapter 6 \u00b7 Deciding who goes first, and the help option that was never passed\n\n> **Enters as:** `({'count': '3'}, [], [<Option count>])` \u2014 the parser's dict, no leftover tokens, and the user's invocation order\n\nThe tuple lands back in `Command.parse_args`, which unpacks it into `opts`, `args` and `param_order` and then does something the dict has no say in: [it decides the order in which parameters will be processed, and loops over that order rather than over the dict](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1396-L1400). The dict is a lookup table now, not a work list. Every declared parameter gets a turn, including the two that appear nowhere in it.\n\n## The same three objects, again\n\n[`get_params` is called a second time](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1128-L1133) and returns `[<Option count>, <Option name>, <Option _click_default_help>]`. The help option is not rebuilt: [it was cached in `Command._help_option` the first time](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1240-L1250), and the comment there says why \u2014 the ordering function about to run compares parameters by object identity, so a fresh instance each call would quietly break callback order.\n\n[`iter_params_for_processing` sorts the declaration list with a two-part key](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L168-L192): `not item.is_eager` first, then the parameter's index in the invocation order, with [`float(\"inf\")` for anything the user never mentioned](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L185-L190). `count` was mentioned and is not eager, so its key is `(True, 0)`. `name` was not mentioned and is not eager: `(True, inf)`. The help option is eager, so its key begins with `False` and it sorts ahead of both. The result is `[<Option _click_default_help>, <Option count>, <Option name>]`.\n\n> **For the owner:** Eagerness is the mechanism behind the guarantee that `prog --help` and `prog --version` work even when a required option is missing \u2014 an eager callback can print and exit before any non-eager parameter is validated. If you write an option whose callback exits the program, mark it `is_eager=True`; otherwise a missing required parameter elsewhere will pre-empt it with a usage error.\n\n## The parameter nobody typed goes first\n\n[`handle_parse_result`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2835-L2855) opens by photographing the slot this parameter is about to write: `ctx.params.get('_click_default_help', UNSET)` is `UNSET` because nothing has been stored yet, `ctx.get_parameter_source(...)` is `None`, and the explicit-default flag defaults to `False`. Those three readings matter only when several options share one storage name; they are taken now, before anything is mutated.\n\nThen [the whole body runs inside `augment_usage_errors(ctx, param=self)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2857-L2858), a context manager that [catches `BadParameter` and `UsageError` on the way out and fills in the missing `ctx` and `param`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L149-L165). That is why a type failure raised deep inside a converter still names the option that caused it.\n\n## Where a value comes from, in order\n\n[`Option.consume_value` delegates first to `Parameter.consume_value`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3726-L3738), which walks a fixed precedence. [The parser's dict is consulted first](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2599-L2607): `opts.get('_click_default_help', UNSET)` misses, so the value is the `UNSET` sentinel and the source starts as `DEFAULT` rather than `COMMANDLINE`. Next [the environment variable](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2609-L2613): `Option.resolve_envvar_value` finds no declared `envvar` and [returns `None` immediately](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2799-L2800), then checks [`ctx.auto_envvar_prefix`, which is `None` here](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3669-L3676) \u2014 so `os.environ` is never read at all. Next [the default map](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2615-L2624); [`_default_map_has` answers `False`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L787-L799) because the context has no map.\n\nThat leaves the parameter's own default, and this is where the sentinel earns its keep. [`Parameter.get_default` returns the raw stored value, still `UNSET`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2573-L2581). [`Option.get_default` hands it to `_resolve_lazy_default`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3318-L3327), which sees a non-required boolean flag and [turns `UNSET` into `False`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3239-L3243). Deriving that lazily, rather than writing `False` into `self.default` at construction time, is what keeps `default is UNSET` a truthful answer to \"did the author pass a default?\" \u2014 the question tie-breaks feature-switch groups later in this same method.\n\nSo `consume_value` returns `(False, ParameterSource.DEFAULT)`. Back in `handle_parse_result`, [the source is recorded on the context straight away](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2860-L2863) \u2014 before conversion, before the callback \u2014 so that an eager callback can ask where its own value came from.\n\n> **For the owner:** The precedence is command line, then environment variable, then `default_map`, then the parameter's default, and it is fixed; the chosen source is recorded and readable by your code as `ctx.get_parameter_source(name)`. Note that environment reading is opt-in per option via `envvar`, or globally via `Context.auto_envvar_prefix`; neither is set here, so no option in this command can be influenced by the environment.\n\n[The deprecation branch is skipped](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2865-L2879) \u2014 this option is not deprecated, and the branch would in any case only warn for a value the user actually supplied, since it requires a source more explicit than `DEFAULT_MAP`.\n\n## Converting a value that came from nowhere\n\n[`Option.process_value` has a shortcut for unset boolean flags](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3782-L3794), but the value is already `False`, not `UNSET`, so it falls through [to `Parameter.process_value`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3796-L3797). There `False` is [run through the parameter's type](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2726-L2730): `nargs == 1`, so [a single-value converter is built](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2657-L2660) and `BoolParamType` is called, whose [`str_to_bool` returns a `bool` unchanged](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/types.py#L866-L868). `False` survives as `False`. The option is not required, so [the missing-value check passes](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2732-L2733).\n\nAnd then the callback runs \u2014 [for a parameter the user never passed](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2735-L2745). `ctx.params` is still empty, so there are no `UNSET` values to mask and the plain call is taken. [`show_help` receives `value=False`, fails its `if value and not ctx.resilient_parsing` guard, and returns `None`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/decorators.py#L612-L616). The callback's return value replaces the value, so what comes out of `process_value` is `None`.\n\nHad conversion raised, [the surrounding `except` would re-raise in normal mode and reset the value to `UNSET` under resilient parsing](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2881-L2890) \u2014 so a bad value can never stop `--help` or shell completion from working.\n\n> **For the owner:** Every parameter's callback fires on every run, including for parameters the user did not supply; the callback is handed the default (or `None`) rather than being skipped. Write callbacks so that the \"not provided\" case is a no-op, as `show_help` does with its leading truthiness check.\n\n## Winning a slot and then declining it\n\nFinally, [the arbitration](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2892-L2919). The snapshot said the slot was empty, so `slot_empty` is true and this option is the winner. But [writing the value is conditional on `expose_value`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2909-L2912), and the help option was built with `expose_value=False`: nothing is written. `ctx.params` is still `{}`. The recorded source stays `DEFAULT`.\n\nThat is also why the storage name is the reserved `_click_default_help` rather than `help` \u2014 [a name no user parameter is expected to claim](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L59-L61), so a command with its own `help` parameter cannot clobber the slot.\n\n[`handle_parse_result` returns `(None, [])`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2921) \u2014 a value that goes nowhere and the unchanged leftover args. The loop turns to `count`, which is the first parameter the user actually typed.\n\n> **Leaves as:** processing order `[_click_default_help, count, name]`; the help option resolved to `False`, converted, its callback run and its result `None` discarded; `ctx.params == {}` and `ctx.get_parameter_source('_click_default_help') is ParameterSource.DEFAULT`\n"}, {"n": 7, "title": "The caller's '3', the user's 'Click', and the handover to the function", "data_in": "`opts={'count': '3'}`, nothing at all for `--name`, and a context whose `_depth` is about to unwind", "data_out": "`ctx.params == {'count': 3, 'name': 'Click'}`, `parse_args` returns `[]` leftovers, and the context is re-entered by `main` ready to call `hello`", "span": [216, 236], "md": "# Chapter 7 \u00b7 The caller's '3', the user's 'Click', and the handover to the function\n\n> **Enters as:** `opts={'count': '3'}` with no entry for `--name`, `ctx.params == {}`, and the processing loop now arriving at `<Option count>`\n\n## The token the caller typed\n\n`count` is the only parameter the user actually mentioned, and [the loop reaches it second](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1399-L1400). Its trip through `consume_value` is short: [the parser's dict is consulted first, `opts.get('count', UNSET)` hits, and because the value is not the sentinel the source is `COMMANDLINE`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2599-L2607). Environment, default map and the parameter's own `default=1` are never consulted \u2014 each of those lookups is guarded by `if value is UNSET`, and it is not.\n\nWhat arrives is still the string `'3'`. The conversion happens one layer up, in [`type_cast_value`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2634-L2642): `nargs` is 1, so [a single-value converter is built](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2657-L2660) and the `IntParamType` that chapter 1 inferred from `default=1` is called. [`int('3')` succeeds and the value becomes `3`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/types.py#L598-L610).\n\nHad the caller typed `--count=x`, that same `except ValueError` would have called `fail`, raising `BadParameter`. `augment_usage_errors` would have stamped it with the context and the parameter, and because [`UsageError.exit_code` is `2`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/exceptions.py#L77) the program would have ended with a usage block, a `Try 'hello --help' for help.` hint and `Error: Invalid value for '--count': ...` on stderr. The parser never validates; this is the only place a command-line string is proven to be the type the function expects.\n\n> **For the owner:** Type conversion and validation happen here, between the parser and your function, so a callback body can assume `count` is an `int`. Anything you want enforced \u2014 ranges, file existence, mutually exclusive options \u2014 belongs in a `ParamType` or a parameter `callback`, not in the function body, because only failures raised here become a clean exit code 2 instead of a traceback.\n\nWith `expose_value` left at its default, [the winner of the slot writes the value](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2909-L2912): `ctx.params` becomes `{'count': 3}`.\n\n## The parameter that has to be asked for\n\n`name` comes last. The dict has nothing for it, no `envvar` was declared and `auto_envvar_prefix` is `None`, there is no default map, and its `default` is still the `UNSET` sentinel \u2014 so `Parameter.consume_value` returns `(UNSET, DEFAULT)`. Then [`Option.consume_value` checks the condition that only an option can satisfy](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3769-L3778): the value is unset, `prompt` is the string `'Your name'`, `prompt_required` is True, and `resilient_parsing` is False. So it prompts.\n\n[`prompt_for_value` computes the default before touching the user](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3604-L3614) \u2014 locking it in before any interaction \u2014 and here that default resolves to the sentinel, which [`_hide_unset` presents to `prompt()` as `None`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3641-L3652), the signal to keep re-asking until something is typed. The important argument in that call is the last one: [`value_proc=lambda x: self.process_value(ctx, x)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L3650). Whatever the user types is run through the parameter's own type and callback, exactly as a command-line token would be; an answer that fails conversion is rejected and the question is asked again rather than crashing the program.\n\nUnder the runner's isolation the prompt never reaches a terminal. `termui.visible_prompt_func` is the [`visible_input` closure installed in chapter 2](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L474-L483): it writes the prompt to the captured stdout, pulls one line from the `BytesIO` holding `'Click\\n'`, strips the newline, echoes `Click` back and flushes. That is why [the captured stdout in the trace begins `b'Your name: Click\\n'`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L262-L280) before any greeting.\n\nThe value comes back as `'Click'` with the source recorded as `PROMPT`, and `ctx.params` becomes `{'count': 3, 'name': 'Click'}`.\n\n> **For the owner:** An option with `prompt=` has no safe non-interactive fallback unless you also give it a `default` or an `envvar`. With stdin exhausted the prompt raises, and [Click's abort handling](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1612-L1624) writes `Aborted!` to stderr and exits non-zero \u2014 loud, but a hard failure in any pipeline or CI job that runs this command without a tty. Decide per option whether prompting is a convenience or a requirement, and give the ones that must work unattended a default.\n\nThere is a second, quieter consequence of the `value_proc` design: a prompted value is processed twice. `prompt()` runs `process_value` through `value_proc`, and then [`handle_parse_result` runs `process_value` on the returned value again](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2881-L2883). For a `str` that is harmless. For a parameter callback with a side effect \u2014 writing a file, incrementing a counter, calling a service \u2014 it fires twice.\n\n## Sweeping up after the loop\n\nWith every parameter handled, `parse_args` finishes its own work. First it [walks `ctx.params` and rewrites any surviving `UNSET` to `None`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1411-L1413). Both values here are real, so the sweep changes nothing \u2014 but it is the guarantee that the sentinel, useful internally for telling \"absent\" from \"`None`\", never reaches user code. Then [the leftover-args check](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1415-L1422): `args` is empty, so nothing fires; had a stray token survived, a plain `Command` (whose `allow_extra_args` is False) would have failed with `Got unexpected extra argument (...)`. Finally [`ctx.args` is set to the empty list and the parser's option prefixes are folded into the context](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1424-L1426).\n\n> **For the owner:** A plain `Command` rejects anything it does not recognise, and that strictness is the default worth keeping. `Group` flips it (`allow_extra_args = True`) so tokens can be handed to a subcommand, and `ignore_unknown_options` turns unknown flags into positional leftovers; both widen what your command will silently accept, so ask what consumes the leftovers before approving either.\n\n## Handing the context back\n\n[`make_context` returns the context](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1386-L1390), and the `scope(cleanup=False)` wrapper unwinds. [`Context.__exit__` drops `_depth` from 2 to 1](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L580-L592) \u2014 not zero, so `_close_with_exception_info` is not called and nothing registered during parsing is closed \u2014 pops the context off the thread-local stack, and then [`scope`'s `finally` removes the extra depth it added](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L623-L630), leaving `_depth` at 0. A `click.File` argument opened during parsing is still open, as intended.\n\nImmediately [`main` enters the same context with a real `with`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1585-L1588), taking `_depth` to 1 and [pushing it back onto the stack](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/globals.py#L44-L46). This time the matching exit will reach zero, and the teardown is armed. The parameters are converted, the slot dictionary is complete, and the next thing to happen is the call to `hello`.\n\n> **Leaves as:** `ctx.params == {'count': 3, 'name': 'Click'}`, `ctx.args == []`, `parse_args` returned `[]`, and the context re-entered by `main` at `_depth == 1` with `'Your name: Click\\n'` already in the captured stdout\n"}, {"n": 8, "title": "Into the call, and out through echo", "data_in": "the context with `params={'count': 3, 'name': 'Click'}` and the callback about to run", "data_out": "`b'Hello, Click!\\n'` written and flushed three times into the captured stdout buffer and mirrored into the mixed output buffer; the callback returns `None`", "span": [237, 280], "md": "# Chapter 8 \u00b7 Into the call, and out through echo\n\n> **Enters as:** a context at `_depth == 1` holding `params={'count': 3, 'name': 'Click'}`, with `'Your name: Click\\n'` already in the captured stdout\n\n## Two lines to reach user code\n\n[`Command.invoke`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1428-L1442) does only two things. First it [checks `self.deprecated`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1432-L1439); had this command been marked deprecated, a red `DeprecationWarning: The command 'hello' is deprecated.` would have gone to stderr before anything else ran. It is not, so it falls straight to [`ctx.invoke(self.callback, **ctx.params)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1441-L1442).\n\nThat splat is the whole handover. The dictionary assembled over the last two chapters becomes keyword arguments: `hello(count=3, name='Click')`. It is also the reason parameter names must be legal Python identifiers \u2014 a parameter named `from` can only ever be reached through `**kwargs`, which is why [`_check_name_is_usable` warns about it back at declaration time](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L2502-L2517).\n\nThe callback is a plain function, not a `Command`, so [`Context.invoke` skips the sub-context branch and reuses `self`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L932-L936). The call happens inside two wrappers: `augment_usage_errors(self)`, which stamps the context onto any `UsageError` your code raises so it still prints a usage block, and `with ctx`, which pushes the context onto the thread-local stack again (`_depth` 1 \u2192 2) so that `get_current_context()` works from anywhere inside the body.\n\n> **For the owner:** Only `UsageError` and its subclasses get the polite treatment. Any other exception your callback raises \u2014 a `KeyError`, a `requests` timeout \u2014 travels past every handler in `main` except the bare `OSError`/`EPIPE` case and surfaces as an unhandled traceback with exit code 1. If you want a clean message and a chosen exit code, raise `ClickException` or call `ctx.exit(n)`.\n\nInside, the loop runs three times and calls `click.echo(f\"Hello, {name}!\")`.\n\n## Finding a stream to write to\n\n`echo` is called with `message='Hello, Click!'`, `file=None`, `nl=True`, `err=False`, `color=None`. With no file given and `err` false, it [asks `_default_text_stdout()`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/utils.py#L287-L291) for one. That function is a closure built by [`_make_cached_stream_func`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L547-L572): it reads `sys.stdout` *now*, looks it up in a `WeakKeyDictionary`, and only builds a wrapper on a miss. The cache is keyed on the stream object, so the runner swapping `sys.stdout` out from under Click yields a fresh entry rather than a stale wrapper pointing at the real terminal \u2014 and the second and third greetings skip the whole resolution and hit the cache.\n\nThe first greeting does the work. [`get_text_stdout`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L347-L351) tries the Windows console shim (`None` off Windows) and then [`_force_correct_text_writer`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L303-L316). Inside [`_force_correct_text_stream`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L241-L259) the runner's `_NamedTextIOWrapper` is not a binary writer, its `encoding` and `errors` are compatible with the unset requested values, and `_stream_is_misconfigured` is False because [`is_ascii_encoding('utf-8')`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L43-L48) answers False. So the stream comes back **unchanged** \u2014 `echo` writes to exactly the object the test installed.\n\nThe branch not taken matters more than the one taken. If stdout had reported an ASCII encoding \u2014 the classic misconfigured-locale case \u2014 Click would have dug out the underlying binary buffer and [rewrapped it as UTF-8 with `errors='replace'`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L261-L284), deliberately choosing mojibake over a `UnicodeEncodeError` mid-run. If no binary buffer could be found, it [silently returns the original stream](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L264-L267) and accepts whatever comes out. And if there is no stdout at all \u2014 `pythonw` on Windows \u2014 [`echo` returns without writing anything](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/utils.py#L293-L296).\n\n## Newline, colour, bytes\n\nThe message is a `str`, so it passes through [the match statement unchanged](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/utils.py#L298-L304) and `nl=True` appends a `\\n`: `'Hello, Click!\\n'`.\n\nThen the colour decision. `color=None` means \"decide for me\", so [`resolve_color_default`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/globals.py#L54-L66) consults the current context \u2014 `ctx.color` is `None` \u2014 and [`should_strip_ansi` is asked](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/utils.py#L330-L331). Normally that is [the `_compat` version](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L502-L513), whose rule is \"strip unless the stream is a tty\": pipe your program's output into a file and the escape codes vanish on their own. Here the runner has [swapped in its own](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L506-L511), which answers from the `color=False` passed to `invoke`, and returns `True`. [`strip_ansi`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/_compat.py#L491-L492) runs its CSI regex over `'Hello, Click!\\n'` and finds nothing to remove.\n\nHad the message been `bytes`, control would have gone the [other way](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/utils.py#L320-L326) \u2014 find the binary writer underneath, flush the text layer, write the bytes \u2014 which is how `echo` manages to write bytes to a text stream without raising. Colour stripping is skipped on that path by construction.\n\nFinally [`file.write(out)` and `file.flush()`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/utils.py#L333-L334). `echo` always flushes; that is what keeps output ordered against a subprocess or a prompt rather than appearing in a lump at exit.\n\n## Two buffers at once\n\nThe text wrapper encodes and hands `b'Hello, Click!\\n'` to [`BytesIOCopy.write`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L133-L135), which writes those 14 bytes to the shared mixed buffer *first*, then to its own, and returns `14`. [`flush` flushes both](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L129-L131). That ordering is the entire mechanism behind faithful interleaving: the mixed buffer records writes in real time, across stdout and stderr, so `result.output` shows what a user at a terminal would have seen \u2014 the prompt echo from chapter 7 first, then the three greetings.\n\nThree times round, and the callback returns `None`. [`Context.invoke`'s `with ctx` exits](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L580-L592), dropping `_depth` back to 1 \u2014 not zero, so nothing is closed yet \u2014 and `Command.invoke` hands that `None` back to `main`.\n\n> **For the owner:** `echo` is not cosmetic sugar for `print`: it is where encoding recovery, ANSI stripping, byte handling and flushing live. Use it (or `secho`) for all program output, and leave `color=None` so the tty check decides; passing `color=True` forces escape codes into redirected output and into log files.\n\n> **Leaves as:** `b'Hello, Click!\\n'` written and flushed three times into both the captured stdout buffer and the mixed output buffer, and the callback's return value `None` on its way back to `main`\n"}, {"n": 9, "title": "Exit is an exception, and what the caller gets back", "data_in": "the callback's return value `None`, discarded; `ctx.exit(0)`", "data_out": "`Result(exit_code=0, exception=None, output_bytes=b'Your name: Click\\nHello, Click!\\n...')` and `result.output` as a `str`", "span": [281, 310], "md": "# Chapter 9 \u00b7 Exit is an exception, and what the caller gets back\n\n> **Enters as:** the callback's return value `None`, handed back to `main`, with the context still open at `_depth == 1`\n\n## The return value is deliberately thrown away\n\n`rv` is `None`. `main` does not look at it. In standalone mode it falls straight to [`ctx.exit()`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1587-L1598), and the comment sitting above that line is the whole argument: it is not safe to call `ctx.exit(rv)`, because `rv` may be `1` \u2014 which looks like success to a Python author and like failure to a shell \u2014 and because a chained group returning `[None, None]` has no meaningful truthiness at all. So success is one fixed thing: exit code 0, chosen by Click, not inferred from your function.\n\n> **For the owner:** Returning a v
