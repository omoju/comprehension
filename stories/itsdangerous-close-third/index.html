<script type="application/json" id="data">{"title": "A Token and Its Word: One Round Trip Through ItsDangerous", "premise": "A web app wants to hand a user's identity \u2014 `{\"id\": 5, \"name\": \"itsdangerous\"}` \u2014 to an untrusted place (a URL, a cookie, an email link) and get it back later without having stored anything server-side. The data must survive the trip in a form that is safe for URLs, and any tampering must be detectable on return. `URLSafeSerializer(\"secret key\", \"auth\")` is the promise; this story follows the dict out to a token and back again, and notes exactly what that promise covers and what it does not.", "reader": "owner", "repo": {"name": "pallets/itsdangerous", "url": "https://github.com/pallets/itsdangerous", "commit": "672971d66a2ef9f85151e53283113f33d642dabd"}, "chapters": [{"n": 1, "title": "The World the Dict Enters", "data_in": "secret_key='secret key', salt='auth', serializer=None, signer=None, signer_kwargs=None, fallback_signers=None", "data_out": "a URLSafeSerializer with secret_keys=[b'secret key'], salt=b'auth', serializer=_CompactJSON, is_text_serializer=True, signer=Signer, fallback_signers=[]", "span": [4, 15], "md": "# Chapter 1 \u00b7 The World the Dict Enters\n\n> **Enters as:** `secret_key='secret key'`, `salt='auth'`, `serializer=None`, `serializer_kwargs=None`, `signer=None`, `signer_kwargs=None`, `fallback_signers=None`\n\nThe dict `{\"id\": 5, \"name\": \"itsdangerous\"}` is not here yet. It is one line away, waiting in `main()`, and before it can be handed over there has to be something to hand it to. That something is built in a single call \u2014 `URLSafeSerializer(\"secret key\", \"auth\")` \u2014 and what happens inside decides almost everything the dict will experience later: how it will be written down, what key will vouch for it, and whether it comes back as text or bytes.\n\n`URLSafeSerializer` has no body of its own; it is a name for the combination of a mixin and the base serializer ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L72-L76)), so construction lands in `Serializer.__init__` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L190-L202)). Four decisions get made there, in order.\n\n**The key becomes a list.** `'secret key'` goes to `_make_keys_list`, which sees a `str`, wraps it, and returns `[b'secret key']` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L67-L73)). The encoding step is `want_bytes`, which encodes text as UTF-8 with `errors='strict'` ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L11-L17)) \u2014 so keys are always compared as bytes, never as text, and no locale or encoding surprise can make two \"equal\" keys differ. The one-element list is not a formality: it is the key-rotation mechanism collapsed to its simplest case. Had the caller passed `[\"old\", \"new\"]`, the same function would have produced two entries, oldest to newest, and stored them on `self.secret_keys` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L208)).\n\n**The salt becomes bytes.** `'auth'` is not `None`, so it is run through `want_bytes` and stored as `b'auth'` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L210-L214)). Passing `None` here would have been allowed too, and would have left the decision to the `Signer`'s own default later. The parameter's default, if the caller had given only a key, is `b\"itsdangerous\"`. Nothing cryptographic happens to the salt yet; it is just filed away.\n\n> **For the owner:** The salt is not a second secret. It is a context label \u2014 `\"auth\"` here \u2014 that will be mixed into key derivation so that tokens minted for one purpose cannot be replayed into another. It may live in source code; the secret key may not. If you see a review where someone has swapped their roles (random salt, hardcoded key), that is the bug worth catching. The library's own docs are explicit that the salt \"only has to be unique between contexts, not private\" ([concepts.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/concepts.rst#L56-L69)).\n\n**The serializer is chosen, then probed.** `serializer=None`, so the class attribute is used ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L216-L217)) \u2014 and because of the mixin, that attribute is not stdlib `json` but `_CompactJSON` ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L21)), a thin wrapper that defaults `separators` to `(\",\", \":\")` and `ensure_ascii` to `False` ([_json.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/_json.py#L14-L18)). That is why the dict will come out as `{\"id\":5,...}` with no spaces: every byte saved is a byte the token does not have to carry through a URL.\n\nThen something slightly unusual. The constructor calls `is_text_serializer(serializer)`, which does not ask the serializer what it produces \u2014 it *makes* it produce something: `serializer.dumps({})` and an `isinstance(..., str)` check ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L33-L37)). The trace shows exactly that throwaway call returning `'{}'`, and the answer `True` being remembered as `self.is_text_serializer` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L219-L220)). It is a probe, not a declaration. A custom serializer that raised on an empty dict \u2014 or whose `dumps` had side effects \u2014 would misbehave at construction time rather than at first use. For `json` and `pickle`, the two cases the project tests, the probe is cheap and correct.\n\n**The signer and its fallbacks.** `signer=None` means the class default, which for the plain serializer is `Signer` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L222-L226)); `signer_kwargs=None` becomes `{}`. `fallback_signers=None` becomes a copy of `default_fallback_signers` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L228-L233)), which since 2.0 is an empty list ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L101-L104)) \u2014 the old SHA-512 fallback was removed. So this serializer will accept exactly one shape of signature, and no legacy one.\n\nNotice what did *not* happen. No hash was computed. No key was derived. `hashlib.sha1` was not even looked up: the default digest is `_lazy_sha1`, a function that defers the attribute access to call time precisely so that FIPS builds without SHA-1 don't explode at import, before a developer has had the chance to configure something else ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L40-L45)). Construction is pure bookkeeping.\n\n> **For the owner:** Two defaults here are worth a question before sign-off. First, the secret key: this constructor accepts a short human-typed string like `\"secret key\"` without complaint, and nothing downstream stretches it \u2014 key derivation is a hash concatenation, not a KDF. Whether the key is strong is entirely the caller's problem. Second, `fallback_signers=[]` means there is no migration path built in: if you later change the digest method or derivation scheme, every token already in the wild stops validating on the next deploy unless you add a fallback entry then. Both are defensible defaults; both are decisions someone should have made deliberately.\n\n`__init__` returns `None`. What exists now is an object holding `secret_keys=[b'secret key']`, `salt=b'auth'`, `serializer=_CompactJSON`, `is_text_serializer=True`, `signer=Signer`, and empty dicts and lists for everything else \u2014 a set of rules, waiting. On the next line of `main()`, the dict arrives.\n\n> **Leaves as:** a `URLSafeSerializer` with `secret_keys=[b'secret key']`, `salt=b'auth'`, `serializer=_CompactJSON`, `is_text_serializer=True`, `signer=Signer`, `signer_kwargs={}`, `serializer_kwargs={}`, `fallback_signers=[]`\n"}, {"n": 2, "title": "Becoming a Payload", "data_in": "obj={'id': 5, 'name': 'itsdangerous'}, salt=None", "data_out": "b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9' (base64, no leading dot)", "span": [16, 28], "md": "# Chapter 2 \u00b7 Becoming a Payload\n\n> **Enters as:** `obj={'id': 5, 'name': 'itsdangerous'}`, `salt=None`\n\nThe dict arrives at `Serializer.dumps` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L309-L320)) as a live Python object: two keys, an int, a str. Nothing about it is portable yet. You cannot put a dict in a URL, and you certainly cannot sign one \u2014 HMAC takes bytes, not hash tables. So the very first thing `dumps` does, before any thought of signing, is send the object away to be written down: `self.dump_payload(obj)` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L314)).\n\nBecause this object is a `URLSafeSerializer`, `dump_payload` resolves to the mixin's version ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L55-L69)), and its first act is to delegate upward with `super().dump_payload(obj)` \u2014 so the dict travels one level further down before anything URL-specific touches it.\n\n## Written down\n\nIn `Serializer.dump_payload` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L271-L276)) the dict finally stops being a dict. `self.serializer.dumps(obj, **self.serializer_kwargs)` \u2014 the `_CompactJSON` chosen back in chapter 1, with an empty kwargs dict \u2014 turns it into the text `'{\"id\":5,\"name\":\"itsdangerous\"}'`. Thirty characters, no spaces anywhere, because `_CompactJSON` forces `separators=(\",\", \":\")` ([_json.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/_json.py#L14-L18)). Stdlib `json` would have written `{\"id\": 5, \"name\": \"itsdangerous\"}` and cost two more bytes in every URL that ever carries this token.\n\nThen `want_bytes` encodes that text to UTF-8 ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L11-L17)), and `b'{\"id\":5,\"name\":\"itsdangerous\"}'` goes back up to the mixin. This wrapper is why `dump_payload` can promise bytes regardless of what the inner serializer prefers: a text serializer's output gets encoded here, a binary one's passes through untouched.\n\n> **For the owner:** `serializer_kwargs` is empty in this run, but note where it lands \u2014 straight into the call that produces the bytes that get signed. Anything a caller puts there changes the signed payload. That is fine for `sort_keys` or `skipkeys`; it is worth a second look if someone ever reaches for `default=` with a callable that can emit different output for equal inputs, because then two \"identical\" dumps stop producing identical tokens and any equality check on tokens quietly breaks.\n\n## Weighed, and left as it was\n\nNow the URL-safe part. The mixin compresses the payload unconditionally and *then* decides whether it was worth it ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L56-L63)):\n\n```python\ncompressed = zlib.compress(json)\nif len(compressed) < (len(json) - 1):\n```\n\nThe trace does not record this call \u2014 `zlib.compress` is C, invisible to the tracer \u2014 but the outcome is legible in the result. Thirty bytes of JSON, most of it high-entropy field names appearing exactly once, does not compress: zlib's header and checksum alone cost more than the redundancy it can find. The condition is false, `is_compressed` stays `False`, and the dict's bytes continue unchanged.\n\nThe `- 1` in that comparison is not a rounding error. A compressed payload must be marked so the reader knows to decompress it, and the mark is one extra byte \u2014 a leading `.` added at the end ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L66-L67)). So compression only wins if it saves more than the flag costs. Had the payload been something like the `\"a\" * 1000` case the project tests, the branch would have gone the other way and this chapter's data would leave with a dot on its front.\n\n> **For the owner:** Compression before signing is a length side-channel, and it is a deliberate trade. The token's length depends on how compressible the payload is, so anyone who can see tokens learns a little about their contents \u2014 and if an attacker can influence *part* of a payload that also contains a secret, repeated observations can leak whether their guess matched, the CRIME/BREACH pattern. For the intended use here \u2014 a user id and a display name, all of it the attacker's own data anyway \u2014 it costs nothing and saves URL length. For a payload that mixes attacker-controlled fields with a secret one, use the plain `Serializer` instead. This behaviour is not configurable; it is baked into the mixin.\n\n## Made safe for a URL\n\nThe last step is `base64_encode` ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L20-L25)). It runs `want_bytes` again \u2014 harmless, the value is already bytes \u2014 and then `base64.urlsafe_b64encode(...).rstrip(b\"=\")`. Two things matter about that one line. *Urlsafe* means the alphabet is `A-Za-z0-9-_`: no `+`, no `/`, nothing a URL or a cookie will mangle. And `rstrip(b\"=\")` removes padding, which is both shorter and, less obviously, keeps the payload inside an alphabet that cannot collide with anything structural. Here the input is 30 bytes \u2014 exactly ten three-byte groups \u2014 so there was no padding to strip, and the output is exactly 40 characters:\n\n`b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'`\n\nCrucially, none of those characters is a `.`. The dot is about to become the separator between payload and signature, and it will be the *last* dot that decides where the split happens. The payload's alphabet guarantees it contributes no dots at all; the compression marker, when present, contributes exactly one at the front, harmlessly to the left of the split.\n\nSince `is_compressed` is `False`, no marker is prepended, and the bytes return to `dump_payload`'s caller unchanged. The dict `{\"id\": 5, \"name\": \"itsdangerous\"}` is now forty bytes of URL-safe base64 \u2014 readable by anyone who cares to decode it, and so far, vouched for by no one.\n\n> **Leaves as:** `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'` \u2014 base64, 40 bytes, no leading dot\n"}, {"n": 3, "title": "A Signer Is Built for the Job", "data_in": "payload b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'; make_signer(salt=None)", "data_out": "a fresh Signer(secret_keys=[b'secret key'], salt=b'auth', sep=b'.', key_derivation='django-concat', algorithm=HMACAlgorithm(_lazy_sha1))", "span": [29, 44], "md": "# Chapter 3 \u00b7 A Signer Is Built for the Job\n\n> **Enters as:** `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'`, back in `Serializer.dumps`\n\nThe payload comes home to line 314 of `dumps`, where it meets a small redundancy: `want_bytes(self.dump_payload(obj))` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L314)). It is already bytes \u2014 `dump_payload` promised that \u2014 so `want_bytes` looks at it, finds it is not a `str`, and hands it straight back ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L11-L17)). The trace records the call and the identical return. It is a belt-and-braces line: a subclass could override `dump_payload` and return text, and this keeps the next step honest either way.\n\nNow the payload has to wait. Before anything can sign it, a signer has to exist, and one does not yet \u2014 `dumps` calls `self.make_signer(salt)` with `salt=None` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L315)).\n\n## Whose salt, and whose keys\n\n`make_signer` is four lines and both of them matter ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L278-L285)):\n\n```python\nif salt is None:\n    salt = self.salt\nreturn self.signer(self.secret_keys, salt=salt, **self.signer_kwargs)\n```\n\nThe `None` the caller passed is not \"no salt\" \u2014 it is \"use mine\". So `salt` becomes `b'auth'`, the bytes stored at construction. This is the mechanism behind a guarantee worth stating plainly: because `dumps` and `loads` both funnel through `make_signer`, and both substitute the serializer's own salt when none is given, a token made by `auth_s.dumps(...)` is always readable by `auth_s.loads(...)`. The two ends cannot drift apart by accident. (If you *do* pass a salt to `dumps`, you must pass the same one to `loads` \u2014 that is the `test_alt_salt` case, and it fails with `BadSignature` if you forget.)\n\nThe second line hands over `self.secret_keys` \u2014 the whole list, `[b'secret key']`, not one key \u2014 plus `self.signer_kwargs`, which is `{}` here. The trace shows the constructor receiving exactly that: `secret_key=[b'secret key'], salt=b'auth', sep=b'.', key_derivation=None, digest_method=None, algorithm=None`.\n\n> **For the owner:** This is where a caller's `signer_kwargs` reaches the cryptography \u2014 `digest_method`, `key_derivation`, `algorithm`, `sep` all arrive here unvalidated by the serializer. The serializer itself contributes no defaults for them; every default in the next section is the `Signer` class's own. If you want to know what algorithm a deployment is actually signing with, read `signer_kwargs` at the call site, not this file.\n\n## The separator is checked before anything else\n\nInside `Signer.__init__` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L129-L173)) the list of keys goes through `_make_keys_list` a second time ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L67-L73)). It was already `[b'secret key']`, but the function does not know that; it sees an iterable that is neither `str` nor `bytes`, so it takes the comprehension branch and runs `want_bytes` over each element, producing a fresh `[b'secret key']`. Idempotent, cheap, and it means `Signer` is equally safe to construct directly with a raw string, as the docs show.\n\nThen `sep`. `want_bytes(b'.')` gives `b'.'`, and immediately:\n\n```python\nif self.sep in _base64_alphabet:\n    raise ValueError(...)\n```\n\n([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L146-L151)). `_base64_alphabet` is the bytes of `A-Za-z0-9-_=` ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L42)) \u2014 precisely the characters that can appear inside a base64-encoded signature. `b'.'` is not among them, so construction proceeds. Had someone passed `sep=\"-\"`, this line would have raised `ValueError` here, at construction time, rather than producing tokens that split ambiguously when read back. It is a small guard in a constructor doing the work of a whole class of runtime bugs: the reader will use `rsplit(sep, 1)`, and that is only unambiguous if the signature cannot contain the separator.\n\n> **For the owner:** This check is a genuine fail-fast: a bad separator is rejected the moment a `Signer` is built, not the moment a token fails to verify. Worth knowing it exists, because the equivalent mistake one line below is *not* caught \u2014 see the defaults.\n\n## Defaults, and one that waits to complain\n\nThe remaining fields fill in from class attributes ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L153-L173)). `salt` is not `None`, so `want_bytes(b'auth')` returns `b'auth'` and it is stored. `key_derivation` is `None`, so it becomes `default_key_derivation`, the string `\"django-concat\"` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L127)). `digest_method` is `None`, so it becomes `default_digest_method`, the function `_lazy_sha1` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L120)).\n\nThat `_lazy_sha1` is not a mistake for `hashlib.sha1`. It is a one-line wrapper that defers the attribute access to call time ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L40-L45)) \u2014 the docstring says why: FIPS builds may not ship SHA-1, and touching `hashlib.sha1` at import time would blow up the whole library before a developer had any chance to configure a different digest. Nothing has been hashed yet at this point in the trace; the first `_lazy_sha1` call comes in the next chapter.\n\nNote the asymmetry with the separator check. `key_derivation` is stored as whatever string arrived, with no validation. A typo \u2014 `\"hmc\"` instead of `\"hmac\"` \u2014 survives construction happily and raises `TypeError(\"Unknown key derivation method\")` only later, from inside `derive_key` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L212-L213)), on the first attempt to sign or verify.\n\nFinally, `algorithm` is `None`, so the constructor builds one: `HMACAlgorithm(self.digest_method)`, which simply stores the digest function ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L56-L60)). The trace shows it receiving `digest_method=<function _lazy_sha1>`.\n\n> **For the owner:** The default is HMAC, and it is the safe one \u2014 but `algorithm` is an open extension point, and `NoneAlgorithm` lives one class away in the same file, returning `b\"\"` for every signature ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L31-L37)). A serializer configured with `signer_kwargs={\"algorithm\": NoneAlgorithm()}` produces tokens that anyone can forge, and nothing in this constructor objects. On SHA-1 specifically: it is used here only as HMAC's inner hash, where collision resistance is not what the security rests on, and the project documents that reasoning. If policy forbids SHA-1 regardless, `signer_kwargs={\"digest_method\": hashlib.sha512}` is the knob, with a fallback signer for old tokens.\n\n`__init__` returns `None`, `make_signer` returns the object, and the trace records `<itsdangerous.signer.Signer object at 0x10cd174d0>`. Worth noticing: this signer was built fresh for this one `dumps` call. `Serializer` keeps no signer around \u2014 it keeps the *ingredients* and assembles one on demand, and will assemble another in chapter 5 when the token comes back. Signers hold no per-message state, so nothing carries over between calls, and nothing is shared across threads by accident.\n\nThe payload has not moved. It is still forty bytes of base64 sitting in a local variable, waiting. What has changed is that there is now something in the room that knows the secret.\n\n> **Leaves as:** the same `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'`, now paired with a fresh `Signer(secret_keys=[b'secret key'], salt=b'auth', sep=b'.', key_derivation='django-concat', digest_method=_lazy_sha1, algorithm=HMACAlgorithm(_lazy_sha1))`\n"}, {"n": 4, "title": "The Signature, and the Token Leaves Home", "data_in": "Signer.sign(value=b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9')", "data_out": "'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg' (str)", "span": [45, 67], "md": "# Chapter 4 \u00b7 The Signature, and the Token Leaves Home\n\n> **Enters as:** `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'`, handed to `Signer.sign`\n\nThe payload is passed into `sign` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L222-L225)), which is three lines long and gives away the whole shape of the result:\n\n```python\nvalue = want_bytes(value)\nreturn value + self.sep + self.get_signature(value)\n```\n\nThe first line is the same no-op coercion as before \u2014 the trace shows `want_bytes` taking `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'` and returning it unchanged ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L11-L17)). It matters because `sign` is public: a caller may hand it text, and everything downstream is byte arithmetic.\n\nThe second line says something the owner should hear plainly: the payload is *concatenated*, not transformed. Whatever comes back, the readable base64 is still in it, unaltered, at the front.\n\n## Deriving the key\n\n`get_signature` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L215-L220)) coerces once more, then calls `self.derive_key()` with no argument.\n\nInside `derive_key` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L182-L213)), `secret_key is None`, so it takes the default branch: `secret_key = self.secret_keys[-1]` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L195-L196)). That is the answer to the question left open in chapter 3. The signer was handed a *list* of keys, but signing consults exactly one of them \u2014 the last, the newest. The list is for reading, not writing; it exists so that a rotation system can keep old keys around to verify old tokens while every new token is signed with the current one. Here the list has one element, so `b'secret key'` it is.\n\nThen the derivation branch, chosen by the `\"django-concat\"` string stored at construction ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L202-L205)):\n\n```python\nreturn self.digest_method(self.salt + b\"signer\" + secret_key).digest()\n```\n\nThe trace shows the concrete call: `_lazy_sha1(string=b'authsignersecret key')`. There it is \u2014 the salt, the literal word `signer`, and the secret, glued end to end and hashed. This is the first time in the whole run that a hash function has actually been touched, which is exactly what `_lazy_sha1` was deferring for ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L40-L45)). The digest comes back as twenty bytes: `b'\\xcea\\x91\\xbb\\x97+C\\x86\\xdc\\x0f\\x82\\xd1uM\\xbf\\x16\\r\\xa8\\xff\\xd8'`.\n\nTwo things follow from that one line. First, this is where the salt `'auth'` finally earns its keep: because it is a prefix of the hashed material, a serializer built with `salt=\"upgrade\"` and the *same* secret key derives a completely different key and cannot verify this token. That is the context separation the docs describe, and it costs nothing secret \u2014 the salt can sit in source code.\n\nSecond, and less comfortable: this is a single unsalted-in-the-cryptographic-sense hash of a concatenation, not a key derivation function. The docstring says so outright \u2014 key derivation \"is not intended to be used as a security method to make a complex key out of a short password. Instead you should use large random secret keys\" ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L183-L187)).\n\n> **For the owner:** The strength of every token this library issues is the entropy of `secret_key`, full stop. `derive_key` does one SHA-1 pass; it does not stretch, iterate, or slow anything down. A short or guessable secret is brute-forceable offline by anyone holding one token, because they can check a guess by recomputing the signature themselves. The scenario's literal `\"secret key\"` is README material, not deployment material. What to check before signing off: where the real secret comes from (environment, secret manager), how long it is, and that it is not in version control.\n\nAlso worth noting: the branch taken is chosen by an `if/elif` chain on a plain string, and `\"none\"` is one of the accepted values ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L210-L211)), which returns the secret key as the HMAC key with no derivation at all. Legal, occasionally wanted for compatibility, and it discards the salt's separating effect.\n\n## The HMAC itself\n\nWith the derived key in hand, `get_signature` hands both it and the payload to the algorithm object built in chapter 3 ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L219)). `HMACAlgorithm.get_signature` is two lines ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L62-L64)):\n\n```python\nmac = hmac.new(key, msg=value, digestmod=self.digest_method)\nreturn mac.digest()\n```\n\nThe two `_lazy_sha1(string=b'')` calls the trace records inside this frame are `hmac.new` constructing its inner and outer hash objects \u2014 standard HMAC machinery. The message being authenticated is the *base64 payload bytes*, not the original dict and not the raw JSON: `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'`. That matters for chapter 6, because it means the verifier can check the signature without decoding anything first.\n\nOut comes a raw twenty-byte digest: `b'\\xe9\\x83\\xfaO@Z;\\xae\\xd7?\\xef\\xbdS4\\xeb\\x9a\\xea\\xd7Jh'`.\n\nRaw bytes cannot go in a URL, so `get_signature` runs it through `base64_encode` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L220)) \u2014 the same URL-safe encoder, padding stripped, that shaped the payload in chapter 2 ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L20-L25)). Twenty bytes become twenty-seven characters: `b'6YP6T0BaO67XP--9UzTrmurXSmg'`. Notice those two hyphens \u2014 that is `urlsafe_b64encode`'s alphabet at work, and it is exactly why chapter 3's separator check refuses `-` as a `sep`.\n\n## Joining up\n\nBack in `sign`, the concatenation happens and the trace returns:\n\n```\nb'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg'\n```\n\nPayload, dot, signature. One `.` in the whole string, because base64 cannot produce one.\n\n> **For the owner:** State the guarantee precisely, because it is narrower than people assume. This is **integrity and authenticity, not confidentiality**. The payload is base64, which is an encoding, not encryption \u2014 anyone holding the token can decode it and read `{\"id\":5,\"name\":\"itsdangerous\"}`. What they cannot do is change it, because any edit invalidates the HMAC. Never put anything in a token that the token's holder should not see. Also absent by construction: any notion of time. Nothing here expires, and nothing prevents the same token from being presented forever, or replayed after a user's session should have ended. If you need age limits, that is `URLSafeTimedSerializer`, a different class ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L79-L83)).\n\n## One last decode\n\n`dumps` receives the signed bytes and reaches its final branch ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L317-L320)):\n\n```python\nif self.is_text_serializer:\n    return rv.decode(\"utf-8\")\nreturn rv\n```\n\nThis is the boolean from chapter 1 finally being spent. `is_text_serializer` was set to `True` at construction, because a throwaway `_CompactJSON.dumps({})` returned the `str` `'{}'` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L33-L37), [serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L220)). So the bytes are decoded and the token leaves as a `str`. Had the caller supplied a binary serializer \u2014 `pickle`, say \u2014 the same code would have returned `bytes` instead, which is why the scenario's `assert isinstance(token, str)` is checking something real rather than a formality.\n\nThe decode is safe without a try/except because both halves are base64 from a URL-safe alphabet: pure ASCII, and ASCII is always valid UTF-8.\n\nThe trace prints it, and the dict's outbound journey is over:\n\n```\ntoken: eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg\n```\n\nSixty-nine characters that can sit in a query string, a cookie, or an email link, carrying a user id and a name out into a place nobody controls \u2014 and carrying, stuck to the end, twenty-seven characters that only someone holding `b'secret key'` could have produced.\n\n> **Leaves as:** `'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg'` (a `str`)\n"}, {"n": 5, "title": "Back From the Untrusted World", "data_in": "s='eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg', salt=None", "data_out": "bytes to verify, plus exactly one candidate Signer (salt=b'auth') from iter_unsigners", "span": [68, 86], "md": "# Chapter 5 \u00b7 Back From the Untrusted World\n\n> **Enters as:** `'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg'` (a `str`), handed to `auth_s.loads`\n\nThe token comes back. In the scenario it never really left \u2014 it is handed straight from a local variable to `auth_s.loads` \u2014 but the code cannot know that, and its whole design assumes the opposite: that between chapter 4 and this line the string passed through a browser, a mail client, a proxy, and possibly an attacker. Everything from here on treats the sixty-nine characters as a claim, not a fact.\n\n`Serializer.loads` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L328-L343)) is short enough to read whole:\n\n```python\ns = want_bytes(s)\nlast_exception = None\n\nfor signer in self.iter_unsigners(salt):\n    try:\n        return self.load_payload(signer.unsign(s))\n    except BadSignature as err:\n        last_exception = err\n\nraise t.cast(BadSignature, last_exception)\n```\n\n## Back to bytes\n\nFirst, `want_bytes` ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L11-L17)). The trace records it receiving the `str` and returning `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg'` \u2014 this time an actual conversion, not the no-op it was on the way out, because chapter 4 ended by decoding the bytes to text.\n\nThe round trip through `str` and back is lossless here for a mundane reason: the alphabet is URL-safe base64 plus a dot, so every character is ASCII, and UTF-8 encoding of ASCII is the identity. The signature will be checked over exactly the bytes that were signed.\n\nNote also that the parameter is typed `str | bytes` and `want_bytes` accepts both ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L328-L330)). A caller pulling a token out of a cookie jar as bytes, or out of a query string as text, does not have to think about it. Nothing is validated yet \u2014 the string could be empty, could be a novel, could contain no dot at all. It is just bytes now.\n\n## Choosing who gets to judge it\n\n`last_exception = None`, and then the loop asks `iter_unsigners(salt)` for candidates. `salt` is `None`, because the scenario called `auth_s.loads(token)` with no salt argument.\n\n`iter_unsigners` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L287-L307)) opens with the same defaulting move that `make_signer` used on the way out:\n\n```python\nif salt is None:\n    salt = self.salt\n\nyield self.make_signer(salt)\n```\n\nThis is the symmetry that makes the round trip work at all. `dumps` with no salt signed under `b'auth'`; `loads` with no salt verifies under `b'auth'`. The trace shows it concretely: `iter_unsigners(salt=None)` immediately calls `make_signer(salt=b'auth')` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L278-L285)), which builds a brand-new `Signer` with `secret_key=[b'secret key']`, `salt=b'auth'`, `sep=b'.'`, and a fresh `HMACAlgorithm(_lazy_sha1)` \u2014 the same construction sequence narrated in chapter 3, `_make_keys_list` and all ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L129-L173)).\n\nIt is a *different object* from the one that signed \u2014 `0x10ce94050` here against `0x10cd174d0` in chapter 4 \u2014 carrying identical parameters. Signers hold no per-message state, so this costs one SHA-1's worth of work later and buys the guarantee that a signer cannot accidentally remember something about a previous token.\n\nHad the caller passed an explicit salt \u2014 `auth_s.loads(token, salt=\"other\")` \u2014 this line would have built a signer whose derived key differed in its first four bytes of input, and the verification in chapter 7 would simply have failed. That is the intended mechanism, not a bug: it is how an activation token is stopped from working as an upgrade token.\n\n## The generator that yields once\n\n`iter_unsigners` is a generator. Having yielded the primary signer, it would continue into the fallback loop ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L297-L307)):\n\n```python\nfor fallback in self.fallback_signers:\n    if isinstance(fallback, dict):\n        kwargs = fallback\n        fallback = self.signer\n    elif isinstance(fallback, tuple):\n        fallback, kwargs = fallback\n    else:\n        kwargs = self.signer_kwargs\n\n    for secret_key in self.secret_keys:\n        yield fallback(secret_key, salt=salt, **kwargs)\n```\n\nHere `self.fallback_signers` is `[]` \u2014 the empty default from chapter 1 \u2014 so the loop body never runs and the generator is exhausted after one item. The trace bears this out: `iter_unsigners` produces exactly one `Signer` and `loads` never comes back for a second.\n\nThe road not taken is worth understanding anyway, because it is where a real deployment's upgrade path lives. Each fallback entry may be a dict of `signer_kwargs` (applied to the configured signer class), a `(class, kwargs)` tuple, or a bare `Signer` subclass. That is how a team switches from SHA-1 to SHA-256 without invalidating every token already in the wild: sign with the new parameters, list the old ones as a fallback, and let tokens expire naturally. Note the ordering \u2014 the *current* signer is always tried first, and fallbacks are constructed one key at a time across `secret_keys`, whereas the primary signer receives the whole key list at once and will iterate it internally.\n\n> **For the owner:** Two defaults to be aware of. `default_fallback_signers` is `[]` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L101-L104)) \u2014 since 2.0 there is no legacy signer silently accepting old-format tokens, which is the safe choice, and it means changing `signer_kwargs` on a running system invalidates every outstanding token unless you add the old parameters as a fallback. Conversely, anything you *do* put in `fallback_signers` is a standing acceptance of that parameter set: a fallback with a weakened `digest_method` or a `\"none\"` key derivation is an open door that stays open until someone removes the entry. Ask what is in that list and when each entry is scheduled to come out.\n\n## What the loop does with failure\n\nThe loop's error handling is the other thing to read carefully, because it shapes what a caller sees when a token is bad. Every `BadSignature` is caught, stashed in `last_exception`, and the loop moves on ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L337-L343)). If all candidates reject the token, the *last* exception is re-raised \u2014 not the first, not an aggregate. With several fallbacks configured, the message a caller sees (\"Signature ... does not match\", or \"No b'.' found in value\") comes from whichever signer happened to be tried last, which is not necessarily the most informative one. It is a diagnostic wrinkle, not a security hole: rejection is rejection.\n\nOne genuinely odd corner: if `iter_unsigners` ever yielded nothing, `last_exception` would still be `None` and the final line would execute `raise None`, which Python reports as `TypeError: exceptions must derive from BaseException` rather than any `BadData` subclass. Reaching it requires overriding `iter_unsigners` to produce an empty iterator \u2014 the stock code always yields at least the primary signer. Worth knowing only if someone on your team subclasses this.\n\nNote too what is *not* caught. The `except` clause names `BadSignature` specifically, and `BadPayload` is a sibling under `BadData`, not a subclass of `BadSignature` ([exc.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/exc.py#L22-L23), [exc.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/exc.py#L92-L99)). So a token with a *valid* signature over an undecodable body will not cause a quiet retry against the next signer; it escapes the loop immediately. That distinction pays off in chapter 8.\n\n> **For the owner:** `loads` gives you one of two outcomes and nothing in between: the deserialised object, or an exception deriving from `BadData`. It never returns a partially-trusted value, and it never hands back the payload of a token it rejected. Callers who want to look at rejected data have to ask for it explicitly \u2014 `BadSignature.payload` ([exc.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/exc.py#L25-L33)), or the honestly-named `loads_unsafe` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L349-L365)). If you find either of those in application code outside a debugging path, that is the line to question in review.\n\nThe loop body now calls `signer.unsign(s)` with the bytes. The token is about to be taken apart.\n\n> **Leaves as:** `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg'`, entering `Signer.unsign` on the single candidate `Signer(secret_keys=[b'secret key'], salt=b'auth', sep=b'.')`\n"}, {"n": 6, "title": "Splitting the Token Apart", "data_in": "signed_value=b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg'", "data_out": "value=b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9' and raw sig bytes b'\\xe9\\x83\\xfaO@Z;\\xae\\xd7?\\xef\\xbdS4\\xeb\\x9a\\xea\\xd7Jh' ready to compare", "span": [87, 96], "md": "# Chapter 6 \u00b7 Splitting the Token Apart\n\n> **Enters as:** `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg'`, arriving at `Signer.unsign` on the single candidate signer\n\nThe bytes arrive at [`Signer.unsign`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L244-L256), which is the first place in the whole return journey that looks at the *shape* of the token rather than passing it along. It is eight lines, and each one is a decision about an untrusted string.\n\n## Bytes again, harmlessly\n\n```python\nsigned_value = want_bytes(signed_value)\n```\n\nThe trace shows `want_bytes` called with the bytes it was already given and returning them unchanged ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L246), [encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L11-L17)). `loads` had already normalised them in chapter 5; this second call is not waste but independence \u2014 `Signer` is a public class in its own right ([docs/signer.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/signer.rst#L20-L22)), and someone calling `signer.unsign(\"some string\")` directly must get the same treatment as someone coming through a serializer. Every entry point normalises; no entry point assumes an earlier one did.\n\n## Is there a dot at all?\n\n```python\nif self.sep not in signed_value:\n    raise BadSignature(f\"No {self.sep!r} found in value\")\n```\n\nThis is the cheapest possible rejection, and it happens before a single hash is computed ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L248-L249)). A caller who hands over a bare word, an empty string, or a truncated token that lost its tail gets `BadSignature(\"No b'.' found in value\")` immediately.\n\nTwo things about that road not taken. First, no key derivation runs, so the cost of a flood of malformed tokens is a substring search, not a SHA-1 per key per fallback. Second \u2014 and this matters more \u2014 the exception is constructed *without* a `payload` argument, so `BadSignature.payload` is `None` ([exc.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/exc.py#L25-L33)). There is nothing sensible to hand back, and the code does not invent something. A caller using `loads_unsafe` on such a token gets `(False, None)` rather than a guess ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L382-L384)).\n\nOur token has a dot. On we go.\n\n## The last dot wins\n\n```python\nvalue, sig = signed_value.rsplit(self.sep, 1)\n```\n\n`rsplit` with a maximum of one split, from the right ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L251)). The trace records the result implicitly in the next call's arguments: `verify_signature(value=b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9', sig=b'6YP6T0BaO67XP--9UzTrmurXSmg')`. The payload from chapter 2 and the signature from chapter 4, cleanly separated.\n\nSplitting from the right, rather than the left, is what makes the format unambiguous \u2014 and it only works because of the guard back in chapter 3. `Signer.__init__` refuses any separator that appears in `_base64_alphabet`, the ASCII letters, digits, `-`, `_` and `=` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L146-L151), [encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L42)). Because `.` can never occur inside a base64 signature, the rightmost dot is *always* the boundary. Dots inside the payload are therefore free \u2014 which is exactly what the URL-safe mixin relies on when it prefixes a compressed payload with `b\".\"` ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L66-L68)). A compressed token looks like `.eJy....sig`, and `rsplit` still finds the right seam.\n\n> **For the owner:** The separator rule is enforced at construction, not at use ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L146-L151)) \u2014 a bad `sep` is a `ValueError` at start-up, loudly, rather than a token-parsing ambiguity discovered in production. If your code passes a custom `sep` through `signer_kwargs`, that is the guarantee protecting you, and it is one of the few places in this library that refuses input outright instead of returning a failure value.\n\n## Decoding a signature you do not trust yet\n\n`unsign` now calls [`verify_signature(value, sig)`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L227-L242), and its first act is to turn the presented signature text back into raw bytes:\n\n```python\ntry:\n    sig = base64_decode(sig)\nexcept Exception:\n    return False\n```\n\nThe `try` is deliberately total ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L229-L232)). `base64_decode` raises `BadData` on input that base64 cannot parse ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L35-L38)), but a garbled signature is not a *different kind* of failure from a wrong one \u2014 both mean \"this token is not ours\". Swallowing it and returning `False` means a caller sees one consistent `BadSignature` for tampering of any flavour, instead of a `BadData` leaking out of the crypto path with a different message and a different stack.\n\nInside, [`base64_decode`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L28-L38) does two small repairs before decoding:\n\n```python\nstring = want_bytes(string, encoding=\"ascii\", errors=\"ignore\")\nstring += b\"=\" * (-len(string) % 4)\n```\n\nThe trace shows that first call: `want_bytes(s=b'6YP6T0BaO67XP--9UzTrmurXSmg', encoding='ascii', errors='ignore')` returning the same bytes. The `errors=\"ignore\"` only bites when the input is `str` \u2014 here it is already bytes, so `want_bytes` returns it untouched ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L14-L17)). Then the padding is restored: the signature is 27 characters, `-27 % 4` is `1`, so a single `=` is appended to make a legal base64 group. Chapter 4 stripped that `=` to shorten the token ([encoding.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L25)); this line puts it back. The two are a matched pair.\n\nOut comes `b'\\xe9\\x83\\xfaO@Z;\\xae\\xd7?\\xef\\xbdS4\\xeb\\x9a\\xea\\xd7Jh'` \u2014 twenty bytes, the length of a SHA-1 digest, and byte-for-byte the digest that `HMACAlgorithm.get_signature` produced in chapter 4. The signature has made the round trip through text and back without losing a bit.\n\nThen the value gets the same normalising treatment it has had at every boundary \u2014 `want_bytes(b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9')`, unchanged ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L234)) \u2014 and the two byte strings stand ready for judgement.\n\n## What happens if they don't match\n\nIt is worth naming the other exit now, because it is the one an attacker will meet. If `verify_signature` comes back `False`, the last line runs ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L256)):\n\n```python\nraise BadSignature(f\"Signature {sig!r} does not match\", payload=value)\n```\n\nNote the `payload=value`. Unlike the missing-separator case, here the code *does* attach the unverified payload to the exception \u2014 on purpose. The docs explain the reasoning: sometimes you want to inspect what someone tried to send you, for debugging or for logging, even knowing it is tampered with ([docs/serializer.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/serializer.rst#L36-L64)). But the payload is attached *raw*: still base64, still undeserialised. Turning it into an object requires a separate, explicit `load_payload` call, precisely so that nobody deserialises attacker-controlled bytes by accident.\n\n> **For the owner:** This is the design's clearest trust boundary, and it is enforced by shape rather than by discipline: a failed `unsign` hands you bytes, never an object. The risk lives entirely on the other side \u2014 if application code catches `BadSignature` and calls `load_payload(e.payload)`, it is deserialising unauthenticated input, and with the default JSON serializer that is merely unwise, while with a `pickle` serializer it is remote code execution ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L358-L361)). Two things to check before signing off: that no production path calls `load_payload` on a rejected token, and that nobody has passed `serializer=pickle` to a serializer reading data from users.\n\nThe payload and the recomputed-signature-to-be are now side by side. Nothing has been decided.\n\n> **Leaves as:** `value = b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'` and the decoded signature `b'\\xe9\\x83\\xfaO@Z;\\xae\\xd7?\\xef\\xbdS4\\xeb\\x9a\\xea\\xd7Jh'`, inside `verify_signature`, awaiting key derivation and comparison\n"}, {"n": 7, "title": "The Verdict", "data_in": "key derivation for secret_key=b'secret key'; sig vs recomputed HMAC", "data_out": "True \u2192 unsign returns b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'", "span": [97, 112], "md": "# Chapter 7 \u00b7 The Verdict\n\n> **Enters as:** `value = b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'` and `sig = b'\\xe9\\x83\\xfaO@Z;\\xae\\xd7?\\xef\\xbdS4\\xeb\\x9a\\xea\\xd7Jh'`, inside `Signer.verify_signature`, nothing decided yet\n\nEverything so far has been preparation: encoding, splitting, re-padding. Now the library has to answer one question \u2014 *did someone holding a secret key produce this signature over these bytes?* \u2014 and it answers it in five lines.\n\n## Every key, newest first\n\n```python\nfor secret_key in reversed(self.secret_keys):\n    key = self.derive_key(secret_key)\n\n    if self.algorithm.verify_signature(key, value, sig):\n        return True\n\nreturn False\n```\n\nThat is the whole verification policy ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L236-L242)). `self.secret_keys` is the list built in chapter 1 \u2014 here the single-element `[b'secret key']` that `_make_keys_list` produced from the string the caller passed ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L67-L73)) \u2014 so the loop runs exactly once, and the trace shows exactly one `derive_key` call.\n\nThe `reversed` is the interesting part. Signing used `secret_keys[-1]`, the newest key, and nothing else (chapter 4). Verification tries *all* of them, newest first, and accepts on the first match. That asymmetry is the entire key-rotation feature: append a new key and every token you mint from then on uses it, while tokens signed under the older keys keep validating until those keys are dropped from the list ([docs/concepts.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/concepts.rst#L116-L134)).\n\n> **For the owner:** There is no per-key expiry here and no revocation list. A key is valid for exactly as long as it appears in `secret_keys`; removing it is the *only* way to invalidate the tokens it signed, and doing so invalidates all of them at once. If you adopt rotation, the schedule that adds and removes entries lives in your code, not this library's \u2014 the docs are explicit that the rotation system is out of scope ([docs/concepts.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/concepts.rst#L112-L114)). Worth asking: who owns that list, and what happens to a user whose token was signed with a key that aged out?\n\n## The same key, derived the same way\n\n```\nSigner.derive_key(self=<Signer>, secret_key=b'secret key')\n  want_bytes(s=b'secret key', ...) \u2192 b'secret key'\n  _lazy_sha1(string=b'authsignersecret key') \u2192 <sha1 ...>\n  \u2192 b'\\xcea\\x91\\xbb\\x97+C\\x86\\xdc\\x0f\\x82\\xd1uM\\xbf\\x16\\r\\xa8\\xff\\xd8'\n```\n\nThis is the same twenty bytes that came out of `derive_key` during signing in chapter 4 \u2014 but it arrived by a slightly different route. Signing called `derive_key()` with no argument and took the default branch, `secret_key = self.secret_keys[-1]`. Verification passes a key explicitly, so the `else` branch runs and coerces it through `want_bytes` ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L195-L198)). It is already bytes; nothing changes.\n\nThen the `django-concat` branch, still the default nobody overrode ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L202-L205)):\n\n```python\nreturn self.digest_method(self.salt + b\"signer\" + secret_key).digest()\n```\n\n`b'auth'` + `b'signer'` + `b'secret key'` = `b'authsignersecret key'`, hashed. This is where the salt earns its keep. Two serializers sharing `\"secret key\"` but salted `\"activate\"` and `\"upgrade\"` derive different keys and cannot read each other's tokens ([docs/concepts.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/concepts.rst#L56-L69)). It is also where the library is careful *not* to oversell: the docstring says plainly that key derivation \"is not intended to be used as a security method to make a complex key out of a short password\" ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L183-L187)). One SHA-1 over a concatenation is not a KDF. A guessable secret key stays guessable after derivation.\n\nHad `key_derivation` been set to some string the code doesn't recognise, this is where it would have blown up \u2014 `raise TypeError(\"Unknown key derivation method\")`, at first use rather than at construction ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L212-L213)).\n\n## Recompute, then compare in constant time\n\nThe derived key, the payload and the presented signature go to [`SigningAlgorithm.verify_signature`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L24-L28) \u2014 the base-class method, inherited by `HMACAlgorithm`, which is why the trace names it `SigningAlgorithm.verify_signature(self=<HMACAlgorithm>, ...)`:\n\n```python\nreturn hmac.compare_digest(sig, self.get_signature(key, value))\n```\n\nNote what it does *not* do: there is no stored expected signature anywhere, and no attempt to reverse anything. It simply re-signs the payload from scratch. The trace shows `HMACAlgorithm.get_signature` running again ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L62-L64)) \u2014 `hmac.new` constructing its two internal SHA-1 states, which is the pair of `_lazy_sha1(string=b'')` calls \u2014 and producing `b'\\xe9\\x83\\xfaO@Z;\\xae\\xd7?\\xef\\xbdS4\\xeb\\x9a\\xea\\xd7Jh'`, identical to what came out of chapter 4 and identical to what chapter 6 decoded from the token's tail.\n\nThe comparison is `hmac.compare_digest`, not `==`. Constant-time: it does not return early at the first differing byte, so an attacker who can measure how long verification takes learns nothing about how many leading bytes of their forgery were correct. Without it, an adversary could in principle build a valid signature one byte at a time. With it, the only route to a matching HMAC is possession of a key.\n\n`True` comes back, `verify_signature` returns `True`, and [`unsign`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L253-L254) hands the payload back:\n\n```python\nif self.verify_signature(value, sig):\n    return value\n```\n\n`b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'` \u2014 the same bytes that went in, now vouched for. Had the loop fallen through to `return False`, the `BadSignature` from the end of chapter 6 would have been raised instead, carrying the payload as unverified bytes. Callers who want a plain boolean rather than an exception have [`Signer.validate`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L258-L266), which catches `BadSignature` and only that.\n\n## What was just guaranteed, and by whom\n\nThis is the moment the library's promise is either kept or broken, so it is worth being precise about it. What has been established is that these payload bytes were signed by someone in possession of `b'secret key'` under the salt `b'auth'`. Nothing about *when*, nothing about *how many times*, nothing about secrecy \u2014 the payload has been readable base64 the whole trip.\n\nAnd the guarantee rests on a default that is swappable. `self.algorithm` is whatever was configured; the base class is generic enough that a custom `SigningAlgorithm` could verify an asymmetric signature ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L15-L22)). It could also be `NoneAlgorithm`, which signs `b\"\"` and would therefore accept an empty signature from anybody ([signer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/signer.py#L31-L37)). The default \u2014 HMAC, constant-time \u2014 is the safe one, and no code in this run departed from it.\n\n> **For the owner:** Two defaults reviewers reliably flag here. The first is SHA-1, and the answer is that its collision weaknesses do not apply to its use as the inner hash of an HMAC; the maintainers say so directly and offer a fallback-signer path for projects with a policy against it anyway ([docs/concepts.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/concepts.rst#L137-L154)). The second is real: the security of this whole chapter reduces to `secret_keys` and to `algorithm` staying at its default. Grep for `algorithm=` and `key_derivation=` in your configuration, and confirm the secret key comes from the environment and is long and random rather than a memorable string ([docs/concepts.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/concepts.rst#L20-L29)) \u2014 derivation will not rescue a weak one.\n\nThe bytes are trusted now. They are also still base64, and still not a dict.\n\n> **Leaves as:** `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'`, returned from `Signer.unsign` to `Serializer.loads`\n"}, {"n": 8, "title": "Home Again, and What Was Promised", "data_in": "payload=b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'", "data_out": "{'id': 5, 'name': 'itsdangerous'}", "span": [113, 123], "md": "# Chapter 8 \u00b7 Home Again, and What Was Promised\n\n> **Enters as:** `b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'` \u2014 verified bytes, handed from `Signer.unsign` straight into `self.load_payload(...)`\n\nThe bytes come back into [`Serializer.loads`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L337-L339) and go nowhere except one place:\n\n```python\nreturn self.load_payload(signer.unsign(s))\n```\n\nThe call is on `self`, and `self` is a `URLSafeSerializer`. Because `URLSafeSerializerMixin` comes first in that class's bases ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L72-L76)), the mixin's `load_payload` answers, not the base serializer's \u2014 which is exactly what chapter 2's `dump_payload` needs on the return leg, since the mixin is what base64-encoded these bytes in the first place.\n\n## The dot that isn't there\n\nThe first thing the mixin does is look for a marker ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L30-L34)):\n\n```python\ndecompress = False\n\nif payload.startswith(b\".\"):\n    payload = payload[1:]\n    decompress = True\n```\n\nThis payload starts with `e`, so `decompress` stays `False` and the bytes pass through untouched. That is the other half of a contract opened in chapter 2: `dump_payload` ran zlib, found the compressed form no shorter, kept the plain JSON, and therefore prefixed nothing ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L60-L68)). Had the payload been the thousand-`a` string the tests use, the token would have carried a leading `.` and this branch would have set the flag. One byte in the token is the whole signal \u2014 and note that it sits *inside* the signed value, so an attacker cannot flip it without breaking the HMAC.\n\nThe dot is also why chapter 6's split had to be `rsplit(sep, 1)`: a compressed token contains two dots, and only the last one separates payload from signature.\n\n## Base64, again, in reverse\n\n```\nbase64_decode(string=b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9')\n  want_bytes(s=..., encoding='ascii', errors='ignore') \u2192 b'eyJpZCI6...'\n  \u2192 b'{\"id\":5,\"name\":\"itsdangerous\"}'\n```\n\n[`base64_decode`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/encoding.py#L28-L38) re-adds the padding that `base64_encode` stripped \u2014 `b\"=\" * (-len(string) % 4)`, here forty characters so zero padding \u2014 and decodes. Out comes the thirty-byte JSON text that `_CompactJSON.dumps` produced in chapter 2, byte for byte.\n\nThe mixin wraps this in its own guard ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L36-L42)): a failure here becomes `BadPayload(\"Could not base64 decode the payload because of an exception\", original_error=e)`. The decompression path, not taken, has the matching guard right below it ([url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L44-L51)). Both keep the underlying exception on `original_error` rather than discarding it.\n\n> **For the owner:** On the path this run took, zlib only ever sees bytes whose signature has already been verified \u2014 `loads` calls `unsign` first and `load_payload` second. That ordering is the thing to preserve. The documented debugging recipe, catching `BadSignature` and calling `s.load_payload(e.payload)` yourself ([docs/serializer.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/serializer.rst#L52-L64)), deliberately steps outside it: that payload is attacker-controlled and will be decompressed unverified. The docs flag the decode step as unsafe and explain why it is kept explicit. If you see `load_payload` or `loads_unsafe` in production code rather than in a debug tool, ask what stops a decompression bomb there.\n\n## From text to a dict\n\nThe decoded JSON goes to `super().load_payload(json)` \u2014 the base [`Serializer.load_payload`](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L243-L269). With `serializer=None` it uses the instance's own, and reads the boolean computed back in chapter 1 ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L252-L254)):\n\n```python\nif serializer is None:\n    use_serializer = self.serializer\n    is_text = self.is_text_serializer\n```\n\n`is_text_serializer` was `True` \u2014 that throwaway `dumps({})` probe returning `'{}'` \u2014 so the bytes are decoded to UTF-8 text before being handed over ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L260-L263)). The trace shows it: `_CompactJSON.loads(payload='{\"id\":5,\"name\":\"itsdangerous\"}')` receives a `str`, not bytes, and returns `{'id': 5, 'name': 'itsdangerous'}`. A binary serializer such as `pickle` would have taken the other line and received the raw bytes.\n\nThe entire call sits inside one `try` whose `except Exception` converts anything the inner serializer throws into `BadPayload` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L264-L269)). That is a deliberate narrowing of the blast radius: a serializer mismatch, a truncated JSON document, a `UnicodeDecodeError` \u2014 all surface as a `BadData` subclass the caller can catch, rather than as whatever exception type the third-party serializer happened to raise.\n\nAnd `BadPayload` descends from `BadData`, *not* from `BadSignature` ([exc.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/exc.py#L92-L99)). That matters for the loop in chapter 5: `loads` only catches `BadSignature` ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L340-L341)). A payload that passed signature verification but cannot be parsed escapes immediately rather than quietly causing the next fallback signer to be tried. A correctly-signed token that doesn't parse is a bug or a serializer change, and it fails loudly.\n\nThe dict travels back out unchanged through the mixin, through `loads`, to the caller, where the scenario's `assert data == user` holds and `data[\"name\"]` prints `itsdangerous`.\n\n## What the round trip promises\n\nThe journey is over, so here is the contract in plain terms. The object returned by `loads` is the object that was passed to `dumps` by someone holding one of the keys in `secret_keys`, under this salt. That is it. Three things it explicitly does not promise:\n\n**Confidentiality.** The payload rode across as readable base64 the entire way; anyone can decode it. The docs say so \u2014 the receiver \"can see the data, but they can not modify it\" ([docs/index.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/index.rst#L14-L20)).\n\n**Freshness.** No timestamp was written and none was checked. A token stays valid until its key leaves the list. Expiry requires `URLSafeTimedSerializer`, whose signer stamps and verifies an age ([timed.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/timed.py#L45-L51), [timed.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/timed.py#L138-L146)).\n\n**Single use.** Nothing here records that a token was seen. Replay is the caller's problem.\n\n> **For the owner:** The default serializer is JSON ([serializer.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/serializer.py#L95), overridden to `_CompactJSON` by the URL-safe mixin at [url_safe.py](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/src/itsdangerous/url_safe.py#L21)), and that is the single most load-bearing default in this file. JSON parsing of hostile bytes is dull; `pickle.loads` of hostile bytes is remote code execution. The library supports `serializer=pickle` and the docs warn against combining it with `loads_unsafe` ([docs/serializer.rst](https://github.com/pallets/itsdangerous/blob/672971d66a2ef9f85151e53283113f33d642dabd/docs/serializer.rst#L58-L64)). Before signing off: confirm no `serializer=` argument in your call sites, and decide whether a token that never expires is acceptable for the thing you are putting in it. If it carries authorisation, you probably want the timed variant.\n\n> **Leaves as:** `{'id': 5, 'name': 'itsdangerous'}` \u2014 the caller's dict, returned from `Serializer.loads`, equal to the one handed to `dumps`\n"}], "flow": [{"kind": "start", "label": "The caller runs the intended use", "chapter": null}, {"kind": "step", "fn": "Serializer.__init__", "file": "src/itsdangerous/serializer.py", "line": 190, "end": 234, "depth": 1, "returned": "None", "chapter": 1}, {"kind": "step", "fn": "_make_keys_list", "file": "src/itsdangerous/signer.py", "line": 67, "end": 73, "depth": 2, "returned": "[b'secret key']", "chapter": 1}, {"kind": "decision", "line": 70, "end": 71, "question": "isinstance(secret_key, (str, bytes))", "answer": "yes", "side": "no", "exit": "return [want_bytes(s) for s in secret_key]", "file": "src/itsdangerous/signer.py", "chapter": 1}, {"kind": "step", "fn": "is_text_serializer", "file": "src/itsdangerous/serializer.py", "line": 33, "end": 37, "depth": 2, "returned": "True", "chapter": 1}, {"kind": "step", "fn": "_CompactJSON.dumps", "file": "src/itsdangerous/_json.py", "line": 14, "end": 18, "depth": 3, "returned": "'{}'", "chapter": 1}, {"kind": "step", "fn": "Serializer.dumps", "file": "src/itsdangerous/serializer.py", "line": 309, "end": 320, "depth": 1, "returned": "'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9.6YP6T0BaO67XP--9UzTrmurXSmg'", "chapter": 2}, {"kind": "step", "fn": "URLSafeSerializerMixin.dump_payload", "file": "src/itsdangerous/url_safe.py", "line": 55, "end": 69, "depth": 2, "returned": "b'eyJpZCI6NSwibmFtZSI6Iml0c2Rhbmdlcm91cyJ9'", "chapter": 2}, {"kind": "step", "fn": "Serializer.dump_payload", "file": "src/itsdangerous/serializer.py", "line": 271, "end": 276, "depth": 3,
