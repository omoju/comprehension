8 when the new class inherits from other *attrs* classes. Pass `collect_by_mro=True` to `make_class` whenever `bases` contains an *attrs* class.\n\n[`_make_attr_tuple_class('C', ['a', 'b'])`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L266-L284) mints a `CAttributes` tuple subclass with `a` and `b` as properties, and `_Attributes(attrs=(Attribute('a'), Attribute('b')), base_attrs=[], base_attrs_map={})` goes back to the builder.\n\nBack in the constructor, two small settings follow from `these` and from `slots`. [`self._cls_dict`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L694) starts as an empty `{}` rather than a copy of the class dict, because nothing is being rebuilt \u2014 it will accumulate only what attrs adds. And [`self._delete_attribs = not bool(these)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L716) is `False`: when you supply fields via `these`, attrs promises not to strip anything off your class body later. `__attrs_attrs__` and `__attrs_props__` are [stashed in the dict](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L723-L724), and because `props.on_setattr_hook` is `None` rather than one of the three recognized hooks, [the convert/validate pruning branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L731-L756) is skipped entirely \u2014 there was nothing to prune.\n\n## Four comparison methods, written by hand\n\n[`add_repr`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1004-L1012) and [`add_eq`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1150-L1162) queue their scripts exactly as in chapter 3 \u2014 the repr with its thread-local recursion guard, the eq with its `other.__class__ is not self.__class__: return NotImplemented` preamble and the two-term `and` chain over `self.a` and `self.b` \u2014 and `__ne__` is dropped straight into the dict as [the shared function](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1730-L1739).\n\nThen something chapter 3 never did: [`add_order`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1164-L1172). `order` resolved to `True` back in chapter 7, so [`_make_order`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1779-L1832) produces four real closures \u2014 not source strings \u2014 over a shared [`attrs_to_tuple`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1785-L1794) helper that builds a tuple of the ordered field values. Each of the four is passed through [`_add_method_dunders_unsafe`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1226-L1238), which stamps `__module__`, `__qualname__` (`C.__lt__`, `C.__le__`, \u2026) and a generated docstring, and lands in `cd` immediately rather than in the snippet queue.\n\nThe type check in [`__lt__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1796-L1803) is the same exact-identity test as `__eq__`: a subclass instance, or anything else, gets `NotImplemented`. For equality that degrades politely to `False`; for ordering, when both sides return `NotImplemented`, Python raises `TypeError: '<' not supported between instances of \u2026`.\n\n> **For the owner:** `make_class` enables ordering by default (`attr.s` resolves `order` to mirror `eq`), while `define` does not. The generated `__lt__`/`__le__`/`__gt__`/`__ge__` return `NotImplemented` unless both operands are the exact same class, so comparing a subclass instance to a base instance raises `TypeError` rather than ordering them; pass `order=False` to `make_class` if you don't want these four methods.\n\n[`add_setattr`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1174-L1186) then walks both fields looking for `a.on_setattr or self._on_setattr`. Both are `None`, `sa_attrs` stays empty, and it returns on the spot. `C` gets no custom `__setattr__`: assignment is a plain write into the instance `__dict__`. Finally, `is_hashable` is `False` and the hashability is `UNHASHABLE`, so [`make_unhashable`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1066-L1068) writes `__hash__ = None`.\n\n## The two-line initializer\n\n[`add_init`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1085-L1108) calls [`_make_init_script`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2030-L2096) with `frozen=False`, `slots=False`, `cache_hash=False` and `cls_on_setattr=None`, so `needs_cached_setattr` stays `False` and both fields survive the filter. Inside `_attrs_to_init_script`, [`_determine_setters(frozen=False, slots=False, base_attr_map={})`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2183-L2184) falls through to the last line \u2014 when a class isn't frozen, `slots` doesn't matter at all \u2014 and returns `((), _assign, _assign_with_converter)`.\n\nBoth fields are mandatory with no factory and no converter, so each takes [the final `else`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2360-L2377): the alias goes into `args` as a bare positional parameter, and [`_assign('a', 'a', False)`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2116-L2124) returns the string `'self.a = a'`. There are no validators to append, no post-init call, no hash-cache line, no `BaseException.__init__`. What [comes out](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2442-L2448) is exactly:\n\n```\ndef __init__(self, a, b):\n    self.a = a\n    self.b = b\n```\n\n`annotations` is just `{'return': None}`, because [the annotation step](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2379-L2384) needs `a.type` to be non-`None` and these fields have no types. The globs, however, are not empty: [`_make_init_script` copies in](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L2085-L2087) `sys.modules[cls.__module__].__dict__`, which is why the trace shows `SomeClass`, `Factory`, `NOTHING` and `_SRC` sitting in the namespace of a function that references none of them. Same snapshot semantics as chapter 5, same blast radius.\n\n## Two protocols, added because the slots were empty\n\n[`_has_own_attribute(C, '__replace__')`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L313-L317) is `False`, so [`add_replace`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1110-L1116) installs a `__replace__` that forwards to [`evolve`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L636-L644) \u2014 meaning `copy.replace(C('foo','bar'), b='baz')` will go back through `__init__` with the fields' aliases, not poke at the instance dict. `__match_args__` is likewise absent, so [`add_match_args`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1118-L1123) collects every `init` and non-`kw_only` field into `('a', 'b')`.\n\nThe builder is now loaded: three queued snippets, four ordering functions, `__ne__`, `__hash__ = None`, `__replace__`, `__match_args__`, `__attrs_attrs__`, `__attrs_props__`. Nothing has been compiled and nothing has touched the class object yet.\n\n> **Leaves as:** a `_ClassBuilder(cls=C)` holding `_cls_dict` with `__attrs_attrs__`, `__attrs_props__`, `__ne__`, `__lt__`/`__le__`/`__gt__`/`__ge__`, `__hash__ = None`, `__replace__`, `__match_args__ = ('a', 'b')`, plus three unevaluated snippets whose init script is `def __init__(self, a, b):\\n    self.a = a\\n    self.b = b\\n`\n"}, {"n": 9, "title": "Patching In Place, and the Coda", "data_in": "the builder for `C` with its compiled `__repr__`/`__eq__`/`__init__` and the ordering/match-args entries", "data_out": "`<class '__main__.C'>` \n\n\n\n the *same* object `types.new_class` produced, now carrying all attrs methods; `C('foo','bar')` reprs as `C(a='foo', b='bar')`; final `sc.__ne__(SomeClass(2, [3, 2, 1]))` \n\n\n\n `True`", "span": [242, 269], "md": "# Chapter 9 \u00b7 Patching In Place, and the Coda\n\n> **Enters as:** a `_ClassBuilder(cls=C)` holding three unevaluated snippets plus a `_cls_dict` of `__attrs_attrs__`, `__attrs_props__`, `__ne__`, `__lt__`/`__le__`/`__gt__`/`__ge__`, `__hash__ = None`, `__replace__`, and `__match_args__ = ('a', 'b')`\n\n[`build_class`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L800-L821) opens the same way it did for `SomeClass`: evaluate the snippets, then decide how to deliver the result. The decision is one line, and this time it goes the other way.\n\n## One compile, three functions\n\n[`_eval_snippets`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L782-L798) joins the repr, eq and init sources into a single string and merges their three globs dicts into one. [`_generate_unique_filename(C, \"methods\")`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1634-L1641) produces `<attrs generated methods __main__.C>`, and [`_linecache_and_compile`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L231-L263) files the source under that name in the interpreter's global `linecache.cache` \u2014 a four-tuple of length, `None` mtime, the split lines, and the filename \u2014 before handing it to [`compile()` and `eval()`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L227-L228). That cache entry is why a debugger can step into `C.__init__` and why a traceback through it shows real source lines.\n\nThis is also the `compile()` that chapter 7's unvalidated names would have reached. `make_class` normalizes the class name and otherwise trusts you; a field called `a-b` or `class` becomes a parameter name in the generated `def __init__(self, a-b, \u2026)` and dies here as a `SyntaxError`, far from the call that caused it.\n\nThe `eval` is given `globs` and a separate empty `locs`, so the three `def` statements bind into `locs` \u2014 the trace shows it coming back as `{'__eq__': \u2026, '__init__': \u2026, '__repr__': \u2026}` \u2014 while each function's `__globals__` is the merged `globs` dict, the one carrying `Factory`, `NOTHING`, `SomeClass` and the rest of the defining module's namespace snapshot. The three attach hooks then run in registration order, each fishing its function out of that shared dict and passing it through [`_add_method_dunders_unsafe`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1226-L1238), which mutates the function in place: `__module__`, `__qualname__` (`C.__repr__`, `C.__eq__`, `C.__init__`) and a generated docstring. You can see the mutation propagate in the trace \u2014 by the time [`_attach_eq`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1155-L1156) is called, the `__repr__` in the dict it is handed already reads `<function C.__repr__>`.\n\n> **For the owner:** Each distinct generated source gets a permanent entry in the process-wide `linecache.cache`, and *attrs* never removes it; repeated calls with the same filename but different source append a `-1`, `-2` suffix and add another entry. Check that you are not building *attrs* classes dynamically in a long-running loop, and call `linecache.clearcache()` if you must.\n\n## The class you handed in is the class you get back\n\n`self._slots` is `False`, so [`build_class`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L806-L811) skips `_create_slots_class` entirely and calls `abc.update_abstractmethods(self._patch_original_class())`. Everything chapter 5 had to warn about \u2014 the identity swap, the `__attrs_base_of_slotted__` weak reference, the closure-cell rewriting for bare `super()`, the double `__init_subclass__` fire, the dead original lingering in `type.__subclasses__` \u2014 simply does not happen here. There is no second class.\n\n[`_patch_original_class`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L823-L857) does three things and returns the object it was given. First it checks `self._delete_attribs`, which chapter 8 saw set to `False` because fields arrived via `these`; so [the loop that normally strips `attr.ib()` sentinels off the class body](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L831-L841) is skipped. Second, it [`setattr`s every entry of `_cls_dict` onto the class](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L843-L845) \u2014 the compiled trio, the four ordering closures, `__ne__`, `__hash__ = None`, `__replace__`, `__match_args__`, `__attrs_attrs__`, `__attrs_props__`. Third, it checks whether the class *inherited* an attrs-written `__setattr__` while writing none of its own; [that branch](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L849-L855) resets `__attrs_own_setattr__` and restores `object.__setattr__`, and it is the only place in the library where an inherited hook is taken *away*. `C`'s only base is `object`, so it does nothing.\n\n`abc.update_abstractmethods` then recomputes `__abstractmethods__`, which matters because a patched class may have just acquired implementations of abstract methods that were missing when `type` first evaluated it. Finally [`build_class` looks for an inherited `__attrs_init_subclass__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L813-L819) \u2014 *attrs*' replacement for the `__init_subclass__` hook that slotted classes break \u2014 finds none, and returns `<class '__main__.C'>`.\n\n> **For the owner:** For non-slotted classes the decorator mutates and returns the same class object, so any reference captured before it ran still points at the finished class; for slotted classes (the `define` default) it does not, and a pre-decoration reference points at a dead class. Treat `@define` as returning a new object and never capture the undecorated class.\n\n> **For the owner:** The in-place patch overwrites same-named attributes without warning, and `attr.s` / `make_class` leave `auto_detect` at `False`, so a hand-written `__repr__` or `__eq__` on a class decorated with `@attr.s` is silently replaced by the generated one. Use `@attrs.define`, which sets `auto_detect=True`, or pass the relevant flag as `False` explicitly.\n\n## The coda\n\nControl returns to [`make_class`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L3356-L3361), which attaches annotations only now \u2014 deliberately, because doing it earlier would have made `_transform_attrs` treat them as `auto_attribs` fields. Both `_CountingAttr`s have `type=None`, so `C.__annotations__` becomes `{}`.\n\n`C(\"foo\", \"bar\")` then runs the two-line initializer into an ordinary instance `__dict__`, and `repr(made)` returns `C(a='foo', b='bar')` from the generated function. Neither call appears in the trace, because neither is library code any more.\n\nThe last entry is the one the scenario's final assertion triggers: [`__ne__`](https://github.com/python-attrs/attrs/blob/8f767776326faaed11e6c2974798787f6e19b343/src/attr/_make.py#L1730-L1739), the single shared function that every *attrs* class points at. It calls `sc.__eq__(SomeClass(2, [3, 2, 1]))`; the generated `__eq__` confirms both operands are exactly `SomeClass`, compares `1 == 2`, short-circuits the `and` chain and returns `False`; `__ne__` sees a real boolean rather than `NotImplemented` and returns `True`.\n\nThat is the whole runtime footprint. Across two classes, one instance built, compared twice, repr'd, serialized and a second class conjured from two strings, the only *attrs* functions that executed after class creation were `__ne__` and the `asdict` helper the caller asked for by name. Every other guarantee in this run \u2014 the signature, the defaults, the fresh list per instance, the type-exact equality, the unhashability, the field list \u2014 was compiled into the class at import time and then got out of the way.\n\n> **Leaves as:** `<class '__main__.C'>` \u2014 the same object `types.new_class` produced, now carrying `__init__`, `__repr__`, `__eq__`, `__ne__`, four ordering methods, `__hash__ = None`, `__replace__`, `__match_args__ = ('a', 'b')`, `__attrs_attrs__`, `__attrs_props__` and `__annotations__ = {}`; `C(\"foo\", \"bar\")` reprs as `C(a='foo', b='bar')`, and `sc.__ne__(SomeClass(2, [3, 2, 1]))` \u2192 `True`\n"}], "flow": [{"kind": "start", "label": "The caller runs the intended use", "chapter": null}, {"kind": "step", "fn": "define", "file": "src/attr/_next_gen.py", "line": 23, "end": 427, "depth": 1, "returned": "<class '__main_  "end": 821, "depth": 3, "returned": "<class '__main__.C'>", "chapter": 9}, {"kind": "step", "fn": "_ClassBuilder._eval_snippets", "file": "src/attr/_make.py", "line": 782, "end": 798, "depth": 4, "returned": "None", "chapter": 9}, {"kind": "decision", "line": 807, "end": 811, "question": "self._slots is True", "answer": "yes", "side": "no", "exit": "cls = abc.update_abstractmethods(self._patch_original_class())", "file": "src/attr/_make.py", "chapter": 9}, {"kind": "step", "fn": "_ClassBuilder._patch_original_class", "file": "src/attr/_make.py", "line": 823, "end": 857, "depth": 4, "returned": "<class '__main__.C'>", "chapter": 9}, {"kind": "decision", "line": 831, "end": 841, "question": "self._delete_attribs", "answer": "no", "side": "yes", "exit": "for name in self._attr_names:", "file": "src/attr/_make.py", "chapter": 9}, {"kind": "decision", "line": 849, "end": 855, "question": "not self._wrote_own_setattr and getattr(cls, '__attrs_own_setattr__', False)", "answer": "no", "side": "yes", "exit": "cls.__attrs_own_setattr__ = False", "file": "src/attr/_make.py", "chapter": 9}, {"kind": "data", "label": "<class '__main__.C'>", "chapter": 9}, {"kind": "step", "fn": "__ne__", "file": "src/attr/_make.py", "line": 1730, "end": 1739, "depth": 1, "returned": "True", "chapter": 9}, {"kind": "decision", "line": 1736, "end": 1737, "question": "result is NotImplemented", "answer": "no", "side": "yes", "exit": "return NotImplemented", "file": "src/attr/_make.py", "chapter": 9}, {"kind": "data", "label": "True", "chapter": 9}, {"kind": "end", "label": "The caller holds True", "chapter": null}], "files": {"docs/glossary.md": "# Glossary\n\n:::{glossary}\ndunder methods\n  \"Dunder\" is a contraction of \"double underscore\".\n\n  It's methods like `__init__` or `__eq__` that are sometimes also called *magic methods* or it's said that they implement an *object protocol*.\n\n  In spoken form, you'd call `__init__` just \"dunder init\".\n\n  Its first documented use is a [mailing list posting](https://mail.python.org/pipermail/python-list/2002-September/155836.html) by Mark Jackson from 2002.\n\n\ndict classes\n  A regular class whose attributes are stored in the {attr}`object.__dict__` attribute of every single instance.\n  This is quite wasteful especially for objects with very few data attributes and the space consumption can become significant when creating large numbers of instances.\n\n  This is the type of class you get by default both with and without *attrs* (except with the next APIs {func}`attrs.define()`, [`attrs.mutable()`](attrs.mutable), and [`attrs.frozen()`](attrs.frozen)).\n\n\nslotted classes\n  A class whose instances have no {attr}`object.__dict__` attribute and [define](https://docs.python.org/3/reference/datamodel.html#slots) their attributes in a `object.__slots__` attribute instead.\n  In *attrs*, they are created by passing `slots=True` to `@attr.s` (and are on by default in {func}`attrs.define()`, [`attrs.mutable()`](attrs.mutable), and [`attrs.frozen()`](attrs.frozen)).\n\n  Their main advantage is that they use less memory on CPython[^pypy] and are slightly faster.\n\n  However, they also come with several possibly surprising gotchas:\n\n  - Slotted classes don't allow for any other attribute to be set except for those defined in one of the class' hierarchies `__slots__`:\n\n    ```{doctest}\n    >>> from attr import define\n    >>> @define\n    ... class Coordinates:\n    ...     x: int\n    ...     y: int\n    ...\n    >>> c = Coordinates(x=1, y=2)\n    >>> c.z = 3\n    Traceback (most recent call last):\n        ...\n    AttributeError: 'Coordinates' object has no attribute 'z'\n    ```\n\n  - Slotted classes can inherit from other classes just like non-slotted classes, but some of the benefits of slotted classes are lost if you do that.\n    If you must inherit from other classes, try to inherit only from other slotted classes.\n\n  - However, [it's not possible](https://docs.python.org/3/reference/datamodel.html#slots) to inherit from more than one class that has attributes in `__slots__` (you will get an `TypeError: multiple bases have instance lay-out conflict`).\n\n  - It's not possible to monkeypatch methods on slotted classes.\n    This can feel limiting in test code, however the need to monkeypatch your own classes is usually a design smell.\n\n    If you really need to monkeypatch an instance in your tests, but don't want to give up on the advantages of slotted classes in production code, you can always subclass a slotted class as a dict class with no further changes and all the limitations go away:\n\n    ```{doctest}\n    >>> import unittest.mock\n    >>> @define\n    ... class Slotted:\n    ...     x: int\n    ...\n    ...     def method(self):\n    ...         return self.x\n    >>> s = Slotted(42)\n    >>> s.method()\n    42\n    >>> with unittest.mock.patch.object(s, \"method\", return_value=23):\n    ...     pass\n    Traceback (most recent call last):\n      ...\n    AttributeError: 'Slotted' object attribute 'method' is read-only\n    >>> @define(slots=False)\n    ... class Dicted(Slotted):\n    ...     pass\n    >>> d = Dicted(42)\n    >>> d.method()\n    42\n    >>> with unittest.mock.patch.object(d, \"method\", return_value=23):\n    ...     assert 23 == d.method()\n    ```\n\n  - Slotted classes must implement {meth}`__getstate__ <object.__getstate__>` and {meth}`__setstate__ <object.__setstate__>` to be serializable with {mod}`pickle` protocol 0 and 1.\n    Therefore, *attrs* creates these methods automatically for slotted classes.\n\n    :::{note}\n    When decorating with `@attr.s(slots=True)` and the class already implements the {meth}`__getstate__ <object.__getstate__>` and {meth}`__setstate__ <object.__setstate__>` methods, they will be *overwritten* by *attrs* autogenerated implementation by default.\n\n    This can be avoided by setting `@attr.s(getstate_setstate=False)` or by setting `@attr.s(auto_detect=True)`.\n\n    {func}`~attrs.define` sets `auto_detect=True` by default.\n    :::\n\n    Also, [think twice](https://www.youtube.com/watch?v=7KnfGDajDQw) before using {mod}`pickle`.\n\n  - Slotted classes are weak-referenceable by default.\n    This can be disabled in CPython by passing `weakref_slot=False` to `@attr.s` [^pypyweakref].\n\n  - Since it's currently impossible to make a class slotted after it's been created, *attrs* has to replace your class with a new one.\n    While it tries to do that as graciously as possible, certain metaclass features like {meth}`object.__init_subclass__` do not work with slotted classes.\n\n  - The {attr}`type.__subclasses__` attribute needs a garbage collection run (which can be manually triggered using {func}`gc.collect`), for the original class to be removed.\n    See issue [#407](https://github.com/python-attrs/attrs/issues/407) for more details.\n\n  - Pickling of slotted classes will fail if you define a class with missing attributes.\n\n    This situation can occur if you define an `attrs.field(init=False)` and don't set the attribute by hand before pickling.\n\n  - You can't call a bare `super()` in a decorated method like `contextlib.contextmanager`.\n    Use `super(YourClass, self)` until we get a way to work around this from Python.\n    See also [#1038](https://github.com/python-attrs/attrs/issues/1038) for more details.\n\n\nfield\n  As the project name suggests, *attrs* is all about attributes.\n  We especially tried to emphasize that we only care about attributes and not about the classes themselves -- because we believe the class belongs to the user.\n\n  This explains why the traditional API uses an {func}`attr.ib` (or ``attrib``) function to define attributes and we still use the term throughout the documentation.\n\n  However, with the emergence of {mod}`dataclasses`, [Pydantic](https://docs.pydantic.dev/latest/concepts/fields/), and other libraries, the term \"field\" has become a common term for a predefined attribute on a class in the Python ecosystem.\n\n  So with our new APIs, we've embraced it too by calling the function to create them {func}`attrs.field`, and use the term \"field\" throughout the documentation interchangeably.\n\n  See also {doc}`names`.\n\nattribute\n  See {term}`field`.\n:::\n\n[^pypy]: On PyPy, there is no memory advantage in using slotted classes.\n\n[^pypyweakref]: On PyPy, slotted classes are naturally weak-referenceable so `weakref_slot=False` has no effect.\n", "src/attr/_compat.py": "# SPDX-License-Identifier: MIT\n\nimport sys\nimport threading\n\nfrom collections.abc import Mapping, Sequence  # noqa: F401\nfrom typing import Callable, _GenericAlias\n\n\nPYPY = sys.implementation.name == \"pypy\"\nPY_3_11_PLUS = sys.version_info[:2] >= (3, 11)\nPY_3_12_PLUS = sys.version_info[:2] >= (3, 12)\nPY_3_13_PLUS = sys.version_info[:2] >= (3, 13)\nPY_3_14_PLUS = sys.version_info[:2] >= (3, 14)\n\n\nif PY_3_14_PLUS:\n    # We request forward-ref annotations to not break in the presence of\n    # forward references.\n\n    def _get_annotations(cls):\n        import annotationlib\n\n        return annotationlib.get_annotations(\n            cls, format=annotationlib.Format.FORWARDREF\n        )\n\nelse:\n\n    def _get_annotations(cls):\n        \"\"\"\n        Get annotations for *cls*.\n        \"\"\"\n        return cls.__dict__.get(\"__annotations__\", {})  # noqa: RUF063\n\n\nclass _AnnotationExtractor:\n    \"\"\"\n    Extract type annotations from a callable, returning None whenever there\n    is none.\n    \"\"\"\n\n    __slots__ = [\"sig\"]\n\n    def __init__(self, callable):\n        import inspect\n\n        try:\n            self.sig = inspect.signature(callable)\n        except (ValueError, TypeError):  # inspect failed\n            self.sig = None\n\n    def get_first_param_type(self):\n        \"\"\"\n        Return the type annotation of the first argument if it's not empty.\n        \"\"\"\n        import inspect\n\n        if not self.sig:\n            return None\n\n        params = list(self.sig.parameters.values())\n        if params and params[0].annotation is not inspect.Parameter.empty:\n            return params[0].annotation\n\n        return None\n\n    def get_return_type(self):\n        \"\"\"\n        Return the return type if it's not empty.\n        \"\"\"\n        import inspect\n\n        if (\n            self.sig\n            and self.sig.return_annotation is not inspect.Signature.empty\n        ):\n            return self.sig.return_annotation\n\n        return None\n\n\n# Thread-local global to track attrs instances which are already being repr'd.\n# This is needed because there is no other (thread-safe) way to pass info\n# about the instances that are already being repr'd through the call stack\n# in order to ensure we don't perform infinite recursion.\n#\n# For instance, if an instance contains a dict which contains that instance,\n# we need to know that we're already repr'ing the outside instance from within\n# the dict's repr() call.\n#\n# This lives here rather than in _make.py so that the functions in _make.py\n# don't have a direct reference to the thread-local in their globals dict.\n# If they have such a reference, it breaks cloudpickle.\nrepr_context = threading.local()\n\n\ndef get_generic_base(cl):\n    \"\"\"If this is a generic class (A[str]), return the generic base for it.\"\"\"\n    if cl.__class__ is _GenericAlias:\n        return cl.__origin__\n    return None\n\n\n_IS_GENERATOR_RESULTS = {}\n\n\ndef _lazy_is_generator(f: Callable) -> Callable[[], bool]:\n    \"\"\"\n    Return a caching closure over callable f that returns whether f is a\n    generator function.\n\n    Not thread-safe but doesn't matter.\n    \"\"\"\n\n    def is_gen() -> bool:\n        import inspect\n\n        try:\n            if f not in _IS_GENERATOR_RESULTS:\n                _IS_GENERATOR_RESULTS[f] = inspect.isgeneratorfunction(f)\n        except TypeError:  # f is not hashable\n            return inspect.isgeneratorfunction(f)\n\n        return _IS_GENERATOR_RESULTS[f]\n\n    return is_gen\n", "src/attr/_funcs.py": "# SPDX-License-Identifier: MIT\n\n\nfrom ._compat import get_generic_base\nfrom ._make import _OBJ_SETATTR, NOTHING, fields\nfrom .exceptions import AttrsAttributeNotFoundError\n\n\n_ATOMIC_TYPES = frozenset(\n    {\n        type(None),\n        bool,\n        int,\n        float,\n        str,\n        complex,\n        bytes,\n        type(...),\n        type,\n        range,\n        property,\n    }\n)\n\n\ndef asdict(\n    inst,\n    recurse=True,\n    filter=None,\n    dict_factory=dict,\n    retain_collection_types=False,\n    value_serializer=None,\n):\n    \"\"\"\n    Return the *attrs* attribute values of *inst* as a dict.\n\n    Optionally recurse into other *attrs*-decorated classes.\n\n    Args:\n        inst: Instance of an *attrs*-decorated class.\n\n        recurse (bool): Recurse into classes that are also *attrs*-decorated.\n\n        filter (~typing.Callable):\n            A callable whose return code determines whether an attribute or\n            element is included (`True`) or dropped (`False`).  Is called with\n            the `attrs.Attribute` as the first argument and the value as the\n            second argument.\n\n        dict_factory (~typing.Callable):\n            A callable to produce dictionaries from.  For example, to produce\n            ordered dictionaries instead of normal Python dictionaries, pass in\n            ``collections.OrderedDict``.\n\n        retain_collection_types (bool):\n            Do not convert to `list` when encountering an attribute whose type\n            is `tuple` or `set`.  Only meaningful if *recurse* is `True`.\n\n        value_serializer (typing.Callable | None):\n            A hook that is called for every attribute or dict key/value.  It\n            receives the current instance, field and value and must return the\n            (updated) value.  The hook is run *after* the optional *filter* has\n            been applied.\n\n    Returns:\n        Return type of *dict_factory*.\n\n    Raises:\n        attrs.exceptions.NotAnAttrsClassError:\n            If *cls* is not an *attrs* class.\n\n    ..  versionadded:: 16.0.0 *dict_factory*\n    ..  versionadded:: 16.1.0 *retain_collection_types*\n    ..  versionadded:: 20.3.0 *value_serializer*\n    ..  versionadded:: 21.3.0\n        If a dict has a collection for a key, it is serialized as a tuple.\n    \"\"\"\n    attrs = fields(inst.__class__)\n    rv = dict_factory()\n    for a in attrs:\n        v = getattr(inst, a.name)\n        if filter is not None and not filter(a, v):\n            continue\n\n        if value_serializer is not None:\n            v = value_serializer(inst, a, v)\n\n        if recurse is True:\n            value_type = type(v)\n            if value_type in _ATOMIC_TYPES:\n                rv[a.name] = v\n            elif has(value_type):\n                rv[a.name] = asdict(\n                    v,\n                    recurse=True,\n                    filter=filter,\n                    dict_factory=dict_factory,\n                    retain_collection_types=retain_collection_types,\n                    value_serializer=value_serializer,\n                )\n            elif issubclass(value_type, (tuple, list, set, frozenset)):\n                cf = value_type if retain_collection_types is True else list\n                items = [\n                    _asdict_anything(\n                        i,\n                        is_key=False,\n                        filter=filter,\n                        dict_factory=dict_factory,\n                        retain_collection_types=retain_collection_types,\n                        value_serializer=value_serializer,\n                    )\n                    for i in v\n                ]\n                try:\n                    rv[a.name] = cf(items)\n                except TypeError:\n                    if not issubclass(cf, tuple):\n                        raise\n                    # Workaround for TypeError: cf.__new__() missing 1 required\n                    # positional argument (which appears, for a namedturle)\n                    rv[a.name] = cf(*items)\n            elif issubclass(value_type, dict):\n                df = dict_factory\n                rv[a.name] = df(\n                    (\n                        _asdict_anything(\n                            kk,\n                            is_key=True,\n                            filter=filter,\n                            dict_factory=df,\n                            retain_collection_types=retain_collection_types,\n                            value_serializer=value_serializer,\n                        ),\n                        _asdict_anything(\n                            vv,\n                            is_key=False,\n                            filter=filter,\n                            dict_factory=df,\n                            retain_collection_types=retain_collection_types,\n                            value_serializer=value_serializer,\n                        ),\n                    )\n                    for kk, vv in v.items()\n                )\n            else:\n                rv[a.name] = v\n        else:\n            rv[a.name] = v\n    return rv\n\n\ndef _asdict_anything(\n    val,\n    is_key,\n    filter,\n    dict_factory,\n    retain_collection_types,\n    value_serializer,\n):\n    \"\"\"\n    ``asdict`` only works on attrs instances, this works on anything.\n    \"\"\"\n    val_type = type(val)\n    if val_type in _ATOMIC_TYPES:\n        rv = val\n        if value_serializer is not None:\n            rv = value_serializer(None, None, rv)\n    elif getattr(val_type, \"__attrs_attrs__\", None) is not None:\n        # Attrs class.\n        rv = asdict(\n            val,\n            recurse=True,\n            filter=filter,\n            dict_factory=dict_factory,\n            retain_collection_types=retain_collection_types,\n            value_serializer=value_serializer,\n        )\n    elif issubclass(val_type, (tuple, list, set, frozenset)):\n        if retain_collection_types is True:\n            cf = val.__class__\n        elif is_key:\n            cf = tuple\n        else:\n            cf = list\n\n        rv = cf(\n            [\n                _asdict_anything(\n                    i,\n                    is_key=False,\n                    filter=filter,\n                    dict_factory=dict_factory,\n                    retain_collection_types=retain_collection_types,\n                    value_serializer=value_serializer,\n                )\n                for i in val\n            ]\n        )\n    elif issubclass(val_type, dict):\n        df = dict_factory\n        rv = df(\n            (\n                _asdict_anything(\n                    kk,\n                    is_key=True,\n                    filter=filter,\n                    dict_factory=df,\n                    retain_collection_types=retain_collection_types,\n                    value_serializer=value_serializer,\n                ),\n                _asdict_anything(\n                    vv,\n                    is_key=False,\n                    filter=filter,\n                    dict_factory=df,\n                    retain_collection_types=retain_collection_types,\n                    value_serializer=value_serializer,\n                ),\n            )\n            for kk, vv in val.items()\n        )\n    else:\n        rv = val\n        if value_serializer is not None:\n            rv = value_serializer(None, None, rv)\n\n    return rv\n\n\ndef astuple(\n    inst,\n    recurse=True,\n    filter=None,\n    tuple_factory=tuple,\n    retain_collection_types=False,\n):\n    \"\"\"\n    Return the *attrs* attribute values of *inst* as a tuple.\n\n    Optionally recurse into other *attrs*-decorated classes.\n\n    Args:\n        inst: Instance of an *attrs*-decorated class.\n\n        recurse (bool):\n            Recurse into classes that are also *attrs*-decorated.\n\n        filter (~typing.Callable):\n            A callable whose return code determines whether an attribute or\n            element is included (`True`) or dropped (`False`).  Is called with\n            the `attrs.Attribute` as the first argument and the value as the\n            second argument.\n\n        tuple_factory (~typing.Callable):\n            A callable to produce tuples from. For example, to produce lists\n            instead of tuples.\n\n        retain_collection_types (bool):\n            Do not convert to `list` or `dict` when encountering an attribute\n            which type is `tuple`, `dict` or `set`. Only meaningful if\n            *recurse* is `True`.\n\n    Returns:\n        Return type of *tuple_factory*\n\n    Raises:\n        attrs.exceptions.NotAnAttrsClassError:\n            If *cls* is not an *attrs* class.\n\n    ..  versionadded:: 16.2.0\n    \"\"\"\n    attrs = fields(inst.__class__)\n    rv = []\n    retain = retain_collection_types  # Very long. :/\n    for a in attrs:\n        v = getattr(inst, a.name)\n        if filter is not None and not filter(a, v):\n            continue\n        value_type = type(v)\n        if recurse is True:\n            if value_type in _ATOMIC_TYPES:\n                rv.append(v)\n            elif has(value_type):\n                rv.append(\n                    astuple(\n                        v,\n                        recurse=True,\n                        filter=filter,\n                        tuple_factory=tuple_factory,\n                        retain_collection_types=retain,\n                    )\n                )\n            elif issubclass(value_type, (tuple, list, set, frozenset)):\n                cf = v.__class__ if retain is True else list\n                items = [\n                    (\n                        astuple(\n                            j,\n                            recurse=True,\n                            filter=filter,\n                            tuple_factory=tuple_factory,\n                            retain_collection_types=retain,\n                        )\n                        if has(j.__class__)\n                        else j\n                    )\n                    for j in v\n                ]\n                try:\n                    rv.append(cf(items))\n                except TypeError:\n                    if not issubclass(cf, tuple):\n                        raise\n                    # Workaround for TypeError: cf.__new__() missing 1 required\n                    # positional argument (which appears, for a namedturle)\n                    rv.append(cf(*items))\n            elif issubclass(value_type, dict):\n                df = value_type if retain is True else dict\n                rv.append(\n                    df(\n                        (\n                            (\n                                astuple(\n                                    kk,\n                                    tuple_factory=tuple_factory,\n                                    retain_collection_types=retain,\n                                )\n                                if has(kk.__class__)\n                                else kk\n                            ),\n                            (\n                                astuple(\n                                    vv,\n                                    tuple_factory=tuple_factory,\n                                    retain_collection_types=retain,\n                                )\n                                if has(vv.__class__)\n                                else vv\n                            ),\n                        )\n                        for kk, vv in v.items()\n                    )\n                )\n            else:\n                rv.append(v)\n        else:\n            rv.append(v)\n\n    return rv if tuple_factory is list else tuple_factory(rv)\n\n\ndef has(cls):\n    \"\"\"\n    Check whether *cls* is a class with *attrs* attributes.\n\n    Args:\n        cls (type): Class to introspect.\n\n    Raises:\n        TypeError: If *cls* is not a class.\n\n    Returns:\n        bool:\n    \"\"\"\n    attrs = getattr(cls, \"__attrs_attrs__\", None)\n    if attrs is not None:\n        return True\n\n    # No attrs, maybe it's a specialized generic (A[str])?\n    generic_base = get_generic_base(cls)\n    if generic_base is not None:\n        generic_attrs = getattr(generic_base, \"__attrs_attrs__\", None)\n        if generic_attrs is not None:\n            # Stick it on here for speed next time.\n            cls.__attrs_attrs__ = generic_attrs\n        return generic_attrs is not None\n    return False\n\n\ndef assoc(inst, **changes):\n    \"\"\"\n    Copy *inst* and apply *changes*.\n\n    This is different from `evolve` that applies the changes to the arguments\n    that create the new instance.\n\n    `evolve`'s behavior is preferable, but there are `edge cases`_ where it\n    doesn't work. Therefore `assoc` is deprecated, but will not be removed.\n\n    .. _`edge cases`: https://github.com/python-attrs/attrs/issues/251\n\n    Args:\n        inst: Instance of a class with *attrs* attributes.\n\n        changes: Keyword changes in the new copy.\n\n    Returns:\n        A copy of inst with *changes* incorporated.\n\n    Raises:\n        attrs.exceptions.AttrsAttributeNotFoundError:\n            If *attr_name* couldn't be found on *cls*.\n\n        attrs.exceptions.NotAnAttrsClassError:\n            If *cls* is not an *attrs* class.\n\n    ..  deprecated:: 17.1.0\n        Use `attrs.evolve` instead if you can. This function will not be\n        removed du to the slightly different approach compared to\n        `attrs.evolve`, though.\n    \"\"\"\n    import copy\n\n    new = copy.copy(inst)\n    attrs = fields(inst.__class__)\n    for k, v in changes.items():\n        a = getattr(attrs, k, NOTHING)\n        if a is NOTHING:\n            msg = f\"{k} is not an attrs attribute on {new.__class__}.\"\n            raise AttrsAttributeNotFoundError(msg)\n        _OBJ_SETATTR(new, k, v)\n    return new\n\n\ndef resolve_types(\n    cls, globalns=None, localns=None, attribs=None, include_extras=True\n):\n    \"\"\"\n    Resolve any strings and forward annotations in type annotations.\n\n    This is only required if you need concrete types in :class:`Attribute`'s\n    *type* field. In other words, you don't need to resolve your types if you\n    only use them for static type checking.\n\n    With no arguments, names will be looked up in the module in which the class\n    was created. If this is not what you want, for example, if the name only\n    exists inside a method, you may pass *globalns* or *localns* to specify\n    other dictionaries in which to look up these names. See the docs of\n    `typing.get_type_hints` for more details.\n\n    Args:\n        cls (type): Class to resolve.\n\n        globalns (dict | None): Dictionary containing global variables.\n\n        localns (dict | None): Dictionary containing local variables.\n\n        attribs (list | None):\n            List of attribs for the given class. This is necessary when calling\n            from inside a ``field_transformer`` since *cls* is not an *attrs*\n            class yet.\n\n        include_extras (bool):\n            Resolve more accurately by passing ``include_extras=True`` to\n            `typing.get_type_hints`.\n\n    Raises:\n        TypeError: If *cls* is not a class.\n\n        attrs.exceptions.NotAnAttrsClassError:\n            If *cls* is not an *attrs* class and you didn't pass any attribs.\n\n        NameError: If types cannot be resolved because of missing variables.\n\n    Returns:\n        *cls* so you can use this function also as a class decorator. Please\n        note that you have to apply it **after** `attrs.define`. That means the\n        decorator has to come in the line **before** `attrs.define`.\n\n    ..  versionadded:: 20.1.0\n    ..  versionadded:: 21.1.0 *attribs*\n    ..  versionadded:: 23.1.0 *include_extras*\n    \"\"\"\n    # Since calling get_type_hints is expensive we cache whether we've\n    # done it already.\n    if getattr(cls, \"__attrs_types_resolved__\", None) != cls:\n        import typing\n\n        kwargs = {\n            \"globalns\": globalns,\n            \"localns\": localns,\n            \"include_extras\": include_extras,\n        }\n\n        hints = typing.get_type_hints(cls, **kwargs)\n        for field in fields(cls) if attribs is None else attribs:\n            if field.name in hints:\n                # Since fields have been frozen we must work around it.\n                _OBJ_SETATTR(field, \"type\", hints[field.name])\n        # We store the class we resolved so that subclasses know they haven't\n        # been resolved.\n        cls.__attrs_types_resolved__ = cls\n\n    # Return the class so you can use it as a decorator too.\n    return cls\n", "src/attr/_make.py": "# SPDX-License-Identifier: MIT\n\nfrom __future__ import annotations\n\nimport abc\nimport contextlib\nimport enum\nimport itertools\nimport linecache\nimport sys\nimport types\nimport unicodedata\nimport weakref\n\nfrom collections.abc import Callable, Mapping\nfrom functools import cached_property\nfrom typing import Any, NamedTuple, TypeVar\n\n# We need to import _compat itself in addition to the _compat members to avoid\n# having the thread-local in the globals here.\nfrom . import _compat, _config, setters\nfrom ._compat import (\n    PY_3_11_PLUS,\n    PY_3_13_PLUS,\n    _AnnotationExtractor,\n    _get_annotations,\n    _lazy_is_generator,\n    get_generic_base,\n)\nfrom .exceptions import (\n    DefaultAlreadySetError,\n    FrozenInstanceError,\n    NotAnAttrsClassError,\n    UnannotatedAttributeError,\n)\n\n\n# This is used at least twice, so cache it here.\n_OBJ_SETATTR = object.__setattr__\n_INIT_FACTORY_PAT = \"__attr_factory_%s\"\n_CLASSVAR_PREFIXES = (\n    \"typing.ClassVar\",\n    \"t.ClassVar\",\n    \"ClassVar\",\n    \"typing_extensions.ClassVar\",\n)\n# we don't use a double-underscore prefix because that triggers\n# name mangling when trying to create a slot for the field\n# (when slots=True)\n_HASH_CACHE_FIELD = \"_attrs_cached_hash\"\n\n_EMPTY_METADATA_SINGLETON = types.MappingProxyType({})\n\n# Unique object for unequivocal getattr() defaults.\n_SENTINEL = object()\n\n_DEFAULT_ON_SETATTR = setters.pipe(setters.convert, setters.validate)\n\n\nclass _Nothing(enum.Enum):\n    \"\"\"\n    Sentinel to indicate the lack of a value when `None` is ambiguous.\n\n    If extending attrs, you can use ``typing.Literal[NOTHING]`` to show\n    that a value may be ``NOTHING``.\n\n    .. versionchanged:: 21.1.0 ``bool(NOTHING)`` is now False.\n    .. versionchanged:: 22.2.0 ``NOTHING`` is now an ``enum.Enum`` variant.\n    \"\"\"\n\n    NOTHING = enum.auto()\n\n    def __repr__(self):\n        return \"NOTHING\"\n\n    def __bool__(self):\n        return False\n\n\nNOTHING = _Nothing.NOTHING\n\"\"\"\nSentinel to indicate the lack of a value when `None` is ambiguous.\n\nWhen using in 3rd party code, use `attrs.NothingType` for type annotations.\n\"\"\"\n\n\nclass _CacheHashWrapper(int):\n    \"\"\"\n    An integer subclass that pickles / copies as None\n\n    This is used for non-slots classes with ``cache_hash=True``, to avoid\n    serializing a potentially (even likely) invalid hash value. Since `None`\n    is the default value for uncalculated hashes, whenever this is copied,\n    the copy's value for the hash should automatically reset.\n\n    See GH #613 for more details.\n    \"\"\"\n\n    def __reduce__(self, _none_constructor=type(None), _args=()):  # noqa: B008\n        return _none_constructor, _args\n\n\ndef attrib(\n    default=NOTHING,\n    validator=None,\n    repr=True,\n    cmp=None,\n    hash=None,\n    init=True,\n    metadata=None,\n    type=None,\n    converter=None,\n    factory=None,\n    kw_only=None,\n    eq=None,\n    order=None,\n    on_setattr=None,\n    alias=None,\n):\n    \"\"\"\n    Create a new field / attribute on a class.\n\n    Identical to `attrs.field`, except it's not keyword-only.\n\n    Consider using `attrs.field` in new code (``attr.ib`` will *never* go away,\n    though).\n\n    ..  warning::\n\n        Does **nothing** unless the class is also decorated with\n        `attr.s` (or similar)!\n\n\n    .. versionadded:: 15.2.0 *convert*\n    .. versionadded:: 16.3.0 *metadata*\n    .. versionchanged:: 17.1.0 *validator* can be a ``list`` now.\n    .. versionchanged:: 17.1.0\n       *hash* is `None` and therefore mirrors *eq* by default.\n    .. versionadded:: 17.3.0 *type*\n    .. deprecated:: 17.4.0 *convert*\n    .. versionadded:: 17.4.0\n       *converter* as a replacement for the deprecated *convert* to achieve\n       consistency with other noun-based arguments.\n    .. versionadded:: 18.1.0\n       ``factory=f`` is syntactic sugar for ``default=attr.Factory(f)``.\n    .. versionadded:: 18.2.0 *kw_only*\n    .. versionchanged:: 19.2.0 *convert* keyword argument removed.\n    .. versionchanged:: 19.2.0 *repr* also accepts a custom callable.\n    .. deprecated:: 19.2.0 *cmp* Removal on or after 2021-06-01.\n    .. versionadded:: 19.2.0 *eq* and *order*\n    .. versionadded:: 20.1.0 *on_setattr*\n    .. versionchanged:: 20.3.0 *kw_only* backported to Python 2\n    .. versionchanged:: 21.1.0\n       *eq*, *order*, and *cmp* also accept a custom callable\n    .. versionchanged:: 21.1.0 *cmp* undeprecated\n    .. versionadded:: 22.2.0 *alias*\n    .. versionchanged:: 25.4.0\n       *kw_only* can now be None, and its default is also changed from False to\n       None.\n    .. versionchanged:: 26.2.0\n       *on_setattr* hooks can now be generator functions to run code before and\n       after an attribute is set.\n    \"\"\"\n    eq, eq_key, order, order_key = _determine_attrib_eq_order(\n        cmp, eq, order, True\n    )\n\n    if hash is not None and hash is not True and hash is not False:\n        msg = \"Invalid value for hash.  Must be True, False, or None.\"\n        raise TypeError(msg)\n\n    if factory is not None:\n        if default is not NOTHING:\n            msg = (\n                \"The `default` and `factory` arguments are mutually exclusive.\"\n            )\n            raise ValueError(msg)\n        if not callable(factory):\n            msg = \"The `factory` argument must be a callable.\"\n            raise ValueError(msg)\n        default = Factory(factory)\n\n    if metadata is None:\n        metadata = {}\n\n    # Apply syntactic sugar by auto-wrapping.\n    if isinstance(on_setattr, (list, tuple)):\n        on_setattr = setters.pipe(*on_setattr)\n\n    if validator and isinstance(validator, (list, tuple)):\n        validator = and_(*validator)\n\n    if converter and isinstance(converter, (list, tuple)):\n        converter = pipe(*converter)\n\n    return _CountingAttr(\n        default=default,\n        validator=validator,\n        repr=repr,\n        cmp=None,\n        hash=hash,\n        init=init,\n        converter=converter,\n        metadata=metadata,\n        type=type,\n        kw_only=kw_only,\n        eq=eq,\n        eq_key=eq_key,\n        order=order,\n        order_key=order_key,\n        on_setattr=on_setattr,\n        alias=alias,\n    )\n\n\ndef _compile_and_eval(\n    script: str,\n    globs: dict[str, Any] | None,\n    locs: Mapping[str, object] | None = None,\n    filename: str = \"\",\n) -> None:\n    \"\"\"\n    Evaluate the script with the given global (globs) and local (locs)\n    variables.\n    \"\"\"\n    bytecode = compile(script, filename, \"exec\")\n    eval(bytecode, globs, locs)\n\n\ndef _linecache_and_compile(\n    script: str,\n    filename: str,\n    globs: dict[str, Any] | None,\n    locals: Mapping[str, object] | None = None,\n) -> dict[str, Any]:\n    \"\"\"\n    Cache the script with _linecache_, compile it and return the _locals_.\n    \"\"\"\n\n    locs = {} if locals is None else locals\n\n    # In order of debuggers like PDB being able to step through the code,\n    # we add a fake linecache entry.\n    count = 1\n    base_filename = filename\n    while True:\n        linecache_tuple = (\n            len(script),\n            None,\n            script.splitlines(True),\n            filename,\n        )\n        old_val = linecache.cache.setdefault(filename, linecache_tuple)\n        if old_val == linecache_tuple:\n            break\n\n        filename = f\"{base_filename[:-1]}-{count}>\"\n        count += 1\n\n    _compile_and_eval(script, globs, locs, filename)\n\n    return locs\n\n\ndef _make_attr_tuple_class(cls_name: str, attr_names: list[str]) -> type:\n    \"\"\"\n    Create a tuple subclass to hold `Attribute`s for an `attrs` class.\n\n    The subclass is a bare tuple with properties for names.\n\n    class MyClassAttributes(tuple):\n        __slots__ = ()\n        x = property(itemgetter(0))\n    \"\"\"\n    attr_class_name = f\"{cls_name}Attributes\"\n    body = {}\n    for i, attr_name in enumerate(attr_names):\n\n        def getter(self, i=i):\n            return self[i]\n\n        body[attr_name] = property(getter)\n    return type(attr_class_name, (tuple,), body)\n\n\n# Tuple class for extracted attributes from a class definition.\n# `base_attrs` is a subset of `attrs`.\nclass _Attributes(NamedTuple):\n    attrs: type\n    base_attrs: list[Attribute]\n    base_attrs_map: dict[str, type]\n\n\ndef _is_class_var(annot):\n    \"\"\"\n    Check whether *annot* is a typing.ClassVar.\n\n    The string comparison hack is used to avoid evaluating all string\n    annotations which would put attrs-based classes at a performance\n    disadvantage compared to plain old classes.\n    \"\"\"\n    annot = getattr(annot, \"__forward_arg__\", annot)\n    annot = str(annot)\n\n    # Annotation can be quoted.\n    if annot.startswith((\"'\", '\"')) and annot.endswith((\"'\", '\"')):\n        annot = annot[1:-1]\n\n    return annot.startswith(_CLASSVAR_PREFIXES)\n\n\ndef _has_own_attribute(cls, attrib_name):\n    \"\"\"\n    Check whether *cls* defines *attrib_name* (and doesn't just inherit it).\n    \"\"\"\n    return attrib_name in cls.__dict__\n\n\ndef _collect_base_attrs(\n    cls, taken_attr_names\n) -> tuple[list[Attribute], dict[str, type]]:\n    \"\"\"\n    Collect attr.ibs from base classes of *cls*, except *taken_attr_names*.\n    \"\"\"\n    base_attrs = []\n    base_attr_map = {}  # A dictionary of base attrs to their classes.\n\n    # Traverse the MRO and collect attributes.\n    for base_cls in reversed(cls.__mro__[1:-1]):\n        for a in getattr(base_cls, \"__attrs_attrs__\", []):\n            if a.inherited or a.name in taken_attr_names:\n                continue\n\n            a = a.evolve(inherited=True)  # noqa: PLW2901\n            base_attrs.append(a)\n            base_attr_map[a.name] = base_cls\n\n    # For each name, only keep the freshest definition i.e. the furthest at the\n    # back.  base_attr_map is fine because it gets overwritten with every new\n    # instance.\n    filtered = []\n    seen = set()\n    for a in reversed(base_attrs):\n        if a.name in seen:\n            continue\n        filtered.insert(0, a)\n        seen.add(a.name)\n\n    return filtered, base_attr_map\n\n\ndef _collect_base_attrs_broken(cls, taken_attr_names):\n    \"\"\"\n    Collect attr.ibs from base classes of *cls*, except *taken_attr_names*.\n\n    N.B. *taken_attr_names* will be mutated.\n\n    Adhere to the old incorrect behavior.\n\n    Notably it collects from the front and considers inherited attributes which\n    leads to the buggy behavior reported in #428.\n    \"\"\"\n    base_attrs = []\n    base_attr_map = {}  # A dictionary of base attrs to their classes.\n\n    # Traverse the MRO and collect attributes.\n    for base_cls in cls.__mro__[1:-1]:\n        for a in getattr(base_cls, \"__attrs_attrs__\", []):\n            if a.name in taken_attr_names:\n                continue\n\n            a = a.evolve(inherited=True)  # noqa: PLW2901\n            taken_attr_names.add(a.name)\n            base_attrs.append(a)\n            base_attr_map[a.name] = base_cls\n\n    return base_attrs, base_attr_map\n\n\ndef _transform_attrs(\n    cls,\n    these,\n    auto_attribs,\n    kw_only,\n    collect_by_mro,\n    field_transformer,\n) -> _Attributes:\n    \"\"\"\n    Transform all `_CountingAttr`s on a class into `Attribute`s.\n\n    If *these* is passed, use that and don't look for them on the class.\n\n    If *collect_by_mro* is True, collect them in the correct MRO order,\n    otherwise use the old -- incorrect -- order.  See #428.\n\n    Return an `_Attributes`.\n    \"\"\"\n    cd = cls.__dict__\n    anns = _get_annotations(cls)\n\n    if these is not None:\n        ca_list = list(these.items())\n    elif auto_attribs is True:\n        ca_names = {\n            name\n            for name, attr in cd.items()\n            if attr.__class__ is _CountingAttr\n        }\n        ca_list = []\n        annot_names = set()\n        for attr_name, type in anns.items():\n            if _is_class_var(type):\n                continue\n            annot_names.add(attr_name)\n            a = cd.get(attr_name, NOTHING)\n\n            if a.__class__ is not _CountingAttr:\n                a = attrib(a)\n            ca_list.append((attr_name, a))\n\n        unannotated = ca_names - annot_names\n        if unannotated:\n            raise UnannotatedAttributeError(\n                \"The following `attr.ib`s lack a type annotation: \"\n                + \", \".join(\n                    sorted(unannotated, key=lambda n: cd.get(n).counter)\n                )\n                + \".\"\n            )\n    else:\n        ca_list = sorted(\n            (\n                (name, attr)\n                for name, attr in cd.items()\n                if attr.__class__ is _CountingAttr\n            ),\n            key=lambda e: e[1].counter,\n        )\n\n    fca = Attribute.from_counting_attr\n    no = ClassProps.KeywordOnly.NO\n    own_attrs = [\n        fca(\n            attr_name,\n            ca,\n            kw_only is not no,\n            anns.get(attr_name),\n        )\n        for attr_name, ca in ca_list\n    ]\n\n    if collect_by_mro:\n        base_attrs, base_attr_map = _collect_base_attrs(\n            cls, {a.name for a in own_attrs}\n        )\n    else:\n        base_attrs, base_attr_map = _collect_base_attrs_broken(\n            cls, {a.name for a in own_attrs}\n        )\n\n    if kw_only is ClassProps.KeywordOnly.FORCE:\n        own_attrs = [a.evolve(kw_only=True) for a in own_attrs]\n        base_attrs = [a.evolve(kw_only=True) for a in base_attrs]\n\n    attrs = base_attrs + own_attrs\n\n    # Resolve default field alias before executing field_transformer, so that\n    # the transformer receives fully populated Attribute objects with usable\n    # alias values.\n    for a in attrs:\n        if not a.alias:\n            # Evolve is very slow, so we hold our nose and do it dirty.\n            _OBJ_SETATTR.__get__(a)(\"alias\", _default_init_alias_for(a.name))\n            _OBJ_SETATTR.__get__(a)(\"alias_is_default\", True)\n\n    if field_transformer is not None:\n        attrs = tuple(field_transformer(cls, attrs))\n\n    # Check attr order after executing the field_transformer.\n    # Mandatory vs non-mandatory attr order only matters when they are part of\n    # the __init__ signature and when they aren't kw_only (which are moved to\n    # the end and can be mandatory or non-mandatory in any order, as they will\n    # be specified as keyword args anyway). Check the order of those attrs:\n    had_default = False\n    for a in (a for a in attrs if a.init is not False and a.kw_only is False):\n        if had_default is True and a.default is NOTHING:\n            msg = f\"No mandatory attributes allowed after an attribute with a default value or factory.  Attribute in question:            raise\",\n                \"             return super().__getattr__(item)\",\n                \"         original_error = f\\\"'{self.__class__.__name__}' object has no attribute '{item}'\\\"\",\n                \"         raise AttributeError(original_error)\",\n            ]\n        )\n\n    lines.extend(\n        [\n            \"    return __getattr__\",\n            \"__getattr__ = wrapper(_cls)\",\n        ]\n    )\n\n    unique_filename = _generate_unique_filename(cls, \"getattr\")\n\n    glob = {\n        \"cached_properties\": cached_properties,\n        \"_cached_setattr_get\": _OBJ_SETATTR.__get__,\n        \"original_getattr\": original_getattr,\n    }\n\n    return _linecache_and_compile(\n        \"\\n\".join(lines), unique_filename, glob, locals={\"_cls\": cls}\n    )[\"__getattr__\"]\n\n\ndef _frozen_setattrs(self, name, value):\n    \"\"\"\n    Attached to frozen classes as __setattr__.\n    \"\"\"\n    if isinstance(self, BaseException) and name in (\n        \"__cause__\",\n        \"__context__\",\n        \"__traceback__\",\n        \"__suppress_context__\",\n        \"__notes__\",\n    ):\n        BaseException.__setattr__(self, name, value)\n        return\n\n    raise FrozenInstanceError\n\n\ndef _frozen_delattrs(self, name):\n    \"\"\"\n    Attached to frozen classes as __delattr__.\n    \"\"\"\n    if isinstance(self, BaseException) and name == \"__notes__\":\n        BaseException.__delattr__(self, name)\n        return\n\n    raise FrozenInstanceError\n\n\ndef evolve(*args, **changes):\n    \"\"\"\n    Create a new instance, based on the first positional argument with\n    *changes* applied.\n\n    .. tip::\n\n       On Python 3.13 and later, you can also use `copy.replace` instead.\n\n    Args:\n\n        inst:\n            Instance of a class with *attrs* attributes. *inst* must be passed\n            as a positional argument.\n\n        changes:\n            Keyword changes in the new copy.\n\n    Returns:\n        A copy of inst with *changes* incorporated.\n\n    Raises:\n        TypeError:\n            If *attr_name* couldn't be found in the class ``__init__``.\n\n        attrs.exceptions.NotAnAttrsClassError:\n            If *cls* is not an *attrs* class.\n\n    .. versionadded:: 17.1.0\n    .. deprecated:: 23.1.0\n       It is now deprecated to pass the instance using the keyword argument\n       *inst*. It will raise a warning until at least April 2024, after which\n       it will become an error. Always pass the instance as a positional\n       argument.\n    .. versionchanged:: 24.1.0\n       *inst* can't be passed as a keyword argument anymore.\n    \"\"\"\n    try:\n        (inst,) = args\n    except ValueError:\n        msg = (\n            f\"evolve() takes 1 positional argument, but {len(args)} were given\"\n        )\n        raise TypeError(msg) from None\n\n    cls = inst.__class__\n    attrs = fields(cls)\n    for a in attrs:\n        if not a.init:\n            continue\n        attr_name = a.name  # To deal with private attributes.\n        init_name = a.alias\n        if init_name not in changes:\n            changes[init_name] = getattr(inst, attr_name)\n\n    return cls(**changes)\n\n\nclass _ClassBuilder:\n    \"\"\"\n    Iteratively build *one* class.\n    \"\"\"\n\n    __slots__ = (\n        \"_add_method_dunders\",\n        \"_attr_names\",\n        \"_attrs\",\n        \"_base_attr_map\",\n        \"_base_names\",\n        \"_cache_hash\",\n        \"_cls\",\n        \"_cls_dict\",\n        \"_delete_attribs\",\n        \"_frozen\",\n        \"_has_custom_setattr\",\n        \"_has_post_init\",\n        \"_has_pre_init\",\n        \"_is_exc\",\n        \"_on_setattr\",\n        \"_pre_init_has_args\",\n        \"_repr_added\",\n        \"_script_snippets\",\n        \"_slots\",\n        \"_weakref_slot\",\n        \"_wrote_own_setattr\",\n    )\n\n    def __init__(\n        self,\n        cls: type,\n        these,\n        auto_attribs: bool,\n        prop ,\n        \"  except AttributeError:\",\n        \"    already_repring = {id(self),}\",\n        \"    _compat.repr_context.already_repring = already_repring\",\n        \"  else:\",\n        \"    if id(self) in already_repring:\",\n        \"      return '...'\",\n        \"    else:\",\n        \"      already_repring.add(id(self))\",\n        \"  try:\",\n        f\"    return f'{cls_name_fragment}({repr_fragment})'\",\n        \"  finally:\",\n        \"    already_repring.remove(id(self))\",\n    ]\n\n    return \"\\n\".join(lines), globs\n\n\ndef _add_repr(cls, ns=None, attrs=None):\n    \"\"\"\n    Add a repr method to *cls*.\n    \"\"\"\n    if attrs is None:\n        attrs = cls.__attrs_attrs__\n\n    script, globs = _make_repr_script(attrs, ns)\n    _compile_and_eval(\n        script, globs, filename=_generate_unique_filename(cls, \"__repr__\")\n    )\n    cls.__repr__ = globs[\"__repr__\"]\n    return cls\n\n\ndef fields(cls):\n    \"\"\"\n    Return the tuple of *attrs* attributes for a class or instance.\n\n    The tuple also allows accessing the fields by their names (see below for\n    examples).\n\n    Args:\n        cls (type): Class or instance to introspect.\n\n    Raises:\n        TypeError: If *cls* is neither a class nor an *attrs* instance.\n\n        attrs.exceptions.NotAnAttrsClassError:\n            If *cls* is not an *attrs* class.\n\n    Returns:\n        tuple (with name accessors) of `attrs.Attribute`\n\n    .. versionchanged:: 16.2.0 Returned tuple allows accessing the fields\n       by name.\n    .. versionchanged:: 23.1.0 Add support for generic classes.\n    .. versionchanged:: 26.1.0 Add support for instances.\n    \"\"\"\n    generic_base = get_generic_base(cls)\n\n    if generic_base is None and not isinstance(cls, type):\n        type_ = type(cls)\n        if getattr(type_, \"__attrs_attrs__\", None) is None:\n            msg = \"Passed object must be a class or attrs instance.\"\n            raise TypeError(msg)\n\n        re
