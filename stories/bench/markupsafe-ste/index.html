<script type="application/json" id="data">{"title": "Nothing Gets Out Unescaped: A Run Through MarkupSafe", "premise": "A web page wants to show a comment somebody posted: `<script>alert(document.cookie);<\/script>`. Printed as-is into HTML, that string stops being text and starts being code \\u2014 it is a cross-site scripting payload. MarkupSafe exists to make the difference between \"text\" and \"markup\" a property of the value itself, carried in its type, so that a template can mix trusted and untrusted pieces and the untrusted ones can only ever arrive as inert characters. This story follows that one untrusted comment from the moment it is handed to `escape()` until it comes back out of a rendered fragment as plain text again, and notes at each step exactly what is guaranteed, what is merely trusted, and who is responsible for which.", "reader": "owner-ste", "repo": {"name": "pallets/markupsafe", "url": "https://github.com/pallets/markupsafe", "commit": "b2e4d9c7687be25695fffbe93a37622302b24fb1"}, "chapters": [{"n": 1, "title": "The Trust Boundary, and the Unguarded Door Beside It", "data_in": "s = '<script>alert(document.cookie);<\/script>' \\u2014 a plain str of unknown provenance", "data_out": "Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;'), and the same value again after a second trip through escape()", "span": [2, 17], "md": "# Chapter 1 \u00b7 The Trust Boundary, and the Unguarded Door Beside It\n\n> **Enters as:** `'<script>alert(document.cookie);<\/script>'` \u2014 a plain `str` of unknown origin\n\nThe engine was chosen before the string arrived. At import time the module tries to load `_escape_inner` from the compiled C extension `_speedups`, and falls back to the pure-Python `_native` module if that import fails ([`__init__.py:7-10`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L7-L10)). Both versions replace the same five characters, so the choice changes speed only. The string itself knows none of this. It is a comment that somebody posted, and it contains a cross-site scripting payload.\n\n`escape` receives it as the single positional argument `s` ([`__init__.py:24-45`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L24-L45)). The first test is `type(s) is str` ([`__init__.py:39-40`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39-L40)). The comment is an exact `str`, so it takes this fast path and skips the `__html__` check below it. The code uses `type(s)` and not `isinstance(s, str)` on purpose. The comment in the source says a proxy object can report the `__class__` of the value it wraps ([`__init__.py:35-38`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L35-L38)). An `isinstance` test would let such an object through unescaped.\n\n`_escape_inner` then does the work. The pure-Python version chains five calls to `str.replace` ([`_native.py:1-8`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_native.py#L1-L8)). It replaces `&` first, before the four replacements that introduce new `&` characters; the reverse order would escape every entity twice. The C version scans the string, counts the extra length, and returns the input object unchanged when nothing needs escaping ([`_speedups.c:84-87`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_speedups.c#L84-L87)). Our comment needs escaping. It leaves this step as `'&lt;script&gt;alert(document.cookie);&lt;/script&gt;'`, still a plain `str`.\n\n> **For the owner:** `escape` replaces exactly 5 characters: `&`, `>`, `<`, `'`, `\"`. It does not replace the backtick, the equals sign, or whitespace. The output is therefore safe in element text and inside quoted attribute values. It is not sufficient for unquoted attributes, for `javascript:` URLs, or inside `<script>` and `<style>` blocks. Check that your templates quote all attribute values.\n\n`Markup.__new__` receives the escaped text next, with `encoding=None` and `errors='strict'` ([`__init__.py:122-131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)). The constructor performs no escaping at all. It first checks for an `__html__` attribute on the object, which a plain `str` does not have. Then, because `encoding` is `None`, it calls `str.__new__(cls, object)` and returns. The road not taken is the decode road: a non-`None` `encoding` forwards `encoding` and `errors` to `str.__new__` for bytes input. The value now leaves the call as `Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')`. Its safety is its type and nothing else, because `Markup` declares `__slots__ = ()` and stores no flag ([`__init__.py:120`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L120)).\n\n> **For the owner:** `Markup(text)` marks any text as safe without a check. This is the unguarded door next to the trust boundary. The guarantee runs in one direction only: output of `escape` is safe, input of `Markup` is the responsibility of the application author. In review, treat every `Markup(...)` call whose argument is not a developer-written literal as a finding.\n\nThe scenario then printed the value. `Markup.__repr__` calls `str.__repr__` and wraps the result in the class name ([`__init__.py:167-168`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L167-L168)). It returned `\"Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')\"`. A `Markup` is therefore visible as such in logs and in a REPL, and a reader can tell it apart from a `str`.\n\nThe same value went back into `escape` one more time, to show that escaping is idempotent. This time the road is different. `Markup` is a subclass of `str`, so `type(s) is str` is false, and the second test, `hasattr(s, \"__html__\")`, wins ([`__init__.py:42-43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L42-L43)). `Markup.__html__` returns `self` ([`__init__.py:133-134`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L133-L134)). `escape` passes that result to `Markup(...)`, and the constructor checks the result for `__html__` and calls it again ([`__init__.py:125-126`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L125-L126)). The trace shows `Markup.__html__` twice for this one `escape` call: once from `escape`, once from `Markup.__new__` on the value it got back. The five replacements never run on this value again, so the entities stay single-escaped and the result equals the input.\n\n> **For the owner:** `escape` calls `__html__` on the object, and `Markup.__new__` then calls `__html__` on the value that method returned. A class whose `__html__` returns a plain `str` is called 1 time. A class whose `__html__` returns another object with `__html__` causes a second call on that object. Require `__html__` implementations to be pure and cheap, with no side effects.\n\nA third road exists and this run did not take it. An object that is neither an exact `str` nor an object with `__html__` reaches the last line, `Markup(_escape_inner(str(s)))` ([`__init__.py:45`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L45)). That road converts the object with `str()` first. It is also the reason why `escape(None)` gives `Markup('None')`, and why the library provides `escape_silent` for optional values ([`__init__.py:48-61`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L48-L61)).\n\n> **Leaves as:** `Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')`, and the same value again after a second trip through `escape`\n"}, {"n": 2, "title": "An Object That Writes Its Own HTML, and a Template That Escapes Its Arguments", "data_in": "a User instance with id=3 and name='Alice \"The <b>Great<\/b>\"'; then '<p>User: {user:link} said: {comment}<\/p>' wrapped as Markup", "data_out": "repr 'Markup(\\'<span class=\"user\">Alice &#3...lt;b&gt;Great&lt;/b&gt;&#34;<\/span>\\')'; then control inside User.__html_format__, holding Markup('<a href=\"/user/{}\">{}<\/a>')", "span": [18, 29], "md": "# Chapter 2 \u00b7 An Object That Writes Its Own HTML, and a Template That Escapes Its Arguments\n\n> **Enters as:** a `User` instance with `id=3` and `name='Alice \"The <b>Great<\/b>\"'`, with `Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')` waiting beside it\n\nThe escaped comment now waits. The scenario built a second value for the same page: a `User` object that knows how to write its own HTML. The scenario handed that object to `escape`. This time the first test, `type(s) is str`, fails, because a `User` is not a `str`. The second test, `hasattr(s, \"__html__\")`, succeeds, so `escape` calls the method and wraps the result ([`__init__.py:42-43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L42-L43)). The trace collapses the nested calls into one line; chapter 3 shows the same work in full.\n\n`escape` does not escape the text that `__html__` returns. It marks it safe without a check. This `User` is careful: its `__html__` builds the span with `Markup('<span class=\"user\">{0}<\/span>').format(self.name)`, so the name goes through the escape machinery. The library cannot verify that an arbitrary `__html__` did the same. The documentation states this responsibility in plain words ([`docs/html.rst:31-43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/docs/html.rst#L31-L43)). The result of the call was `Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>')`: the tags live, the name inert.\n\n> **For the owner:** This is the second unguarded door, after `Markup(text)` from chapter 1. Every `__html__` and `__html_format__` method in your codebase is part of the trust boundary. The library believes the text that these methods return. Review each one, and check that it escapes the data it inserts.\n\n`escape` puts no `try` block around the call to `__html__` ([`__init__.py:42-45`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L42-L45)). An exception from that method therefore leaves `escape` unchanged. The C path once lost such an exception and crashed; a test now pins the behaviour ([`tests/test_exception_custom_html.py:13-23`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_exception_custom_html.py#L13-L23)). The scenario printed the user markup through `Markup.__repr__`, which returned `'Markup(\\'<span class=\"user\">Alice &#3...lt;b&gt;Great&lt;/b&gt;&#34;<\/span>\\')'` in the trace, truncated for width.\n\nNext the template arrived. `Markup.__new__` received the literal `'<p>User: {user:link} said: {comment}<\/p>'` with `encoding=None`, and returned `Markup('<p>User: {user:link} said: {comment}<\/p>')` ([`__init__.py:122-131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)). The template text is trusted because a developer wrote it in the source file. Only the substituted values get escaped. The escaped comment and the `User` object both travel in as keyword arguments.\n\n> **For the owner:** The safety of `Markup.format` depends on the template, not only on the arguments. A template built from user input gives the user control over tags and attributes, and nothing in this module stops that. Require all `Markup` templates to be literals or developer-controlled text.\n\n`Markup.format` starts the render. It creates one `EscapeFormatter` and passes `self.escape`, the bound classmethod of the actual class ([`__init__.py:313-315`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L313-L315)). `EscapeFormatter.__init__` stores that callable and calls `string.Formatter.__init__` ([`__init__.py:335-337`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L335-L337)). The trace shows the return value `None`. Each call builds a new formatter, so two renders share no mutable state. Parsing of `{user:link}` and `{comment}` belongs to `string.Formatter.vformat` in the standard library; only field rendering is custom. `format_map` uses the same machinery with an empty `args` tuple ([`__init__.py:317-323`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L317-L323)).\n\n`vformat` reached the first field and called `EscapeFormatter.format_field` with `value=<User object>` and `format_spec='link'`. The method tests three things in a fixed order ([`__init__.py:339-354`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L339-L354)). It tests `__html_format__` first ([`__init__.py:340-341`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L340-L341)). The `User` has that method, so it wins, and it receives the raw string `'link'`. MarkupSafe defines no grammar for the specifier; the class decides what `'link'` means. All three tests use `hasattr`, so any object that declares these method names is believed.\n\nTwo roads lead away from here, and this field took neither. An object with `__html__` but without `__html_format__`, combined with a non-empty specifier, causes a `ValueError` that names the type ([`__init__.py:342-348`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L342-L348)). A specifier is therefore never dropped in silence. `Markup.__html_format__` raises the same kind of error for any non-empty specifier, so `{0:>10}` on a `Markup` is an error and not padding ([`__init__.py:325-329`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L325-L329)). The third road is the `%` operator, which wraps each argument in `_MarkupEscapeHelper` and escapes it late, inside `__str__` ([`__init__.py:154-165`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L154-L165), [`__init__.py:366-379`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L366-L379)).\n\nControl is now inside `User.__html_format__`, in the scenario's own code. The method built `Markup('<a href=\"/user/{}\">{}<\/a>')` through the same unguarded constructor, with a developer-written literal. It then evaluated the arguments for the inner render. The second argument is `self.__html__()`, which built `Markup('<span class=\"user\">{0}<\/span>')` and is about to format the name into it.\n\n> **Leaves as:** control inside `User.__html_format__`, holding `Markup('<a href=\"/user/{}\">{}<\/a>')` and the just-built `Markup('<span class=\"user\">{0}<\/span>')`\n"}, {"n": 3, "title": "The Innermost Escape: the user's name", "data_in": "Markup('<span class=\"user\">{0}<\/span>').format('Alice \"The <b>Great<\/b>\"')", "data_out": "Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>'), then the completed Markup('<a href=\"/user/3\">\\u2026<\/a>')", "span": [30, 44], "md": "# Chapter 3 \u00b7 The Innermost Escape: the user's name\n\n> **Enters as:** `Markup('<span class=\"user\">{0}<\/span>')` and the single argument `'Alice \"The <b>Great<\/b>\"'`, inside `User.__html__`\n\nThe name starts its own render. `Markup.format` runs again, one level down, on the span template ([`__init__.py:313-315`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L313-L315)). It builds a second `EscapeFormatter` and passes `Markup.escape` to it ([`__init__.py:335-337`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L335-L337)). This formatter is new and shares nothing with the outer one. `string.Formatter.vformat` parses the template, finds the field `{0}`, and calls `format_field` with `value='Alice \"The <b>Great<\/b>\"'` and `format_spec=''`.\n\nThe name is a plain `str`. It has no `__html_format__` and no `__html__`, so the first two tests in `format_field` fail ([`__init__.py:340-342`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L340-L342)). The data falls to the third branch, the default road ([`__init__.py:350-353`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L350-L353)). There `format_field` calls `super().format_field(value, str(format_spec))`, which is Python's own format machinery. The call to `str()` on the specifier is deliberate: a `Markup` specifier would otherwise invoke the wrong `__format__` callbacks. With an empty specifier the name comes back unchanged.\n\nThen the escape happens, on the rendered text, not on the original object ([`__init__.py:354`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L354)). `Markup.escape` calls the module-level `escape` ([`__init__.py:235`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L235)). The value is an exact `str`, so `escape` takes the fast path of chapter 1 ([`__init__.py:39-40`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39-L40)). `_escape_inner` replaced the quotes with `&#34;` and the angle brackets with `&lt;` and `&gt;` ([`_native.py:1-8`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_native.py#L1-L8)). `Markup.__new__` wrapped the result, and the trace shows `Markup('Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;')`. The class of that value already equals `cls`, so `Markup.escape` returned it without a new object ([`__init__.py:237-240`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L237-L240)).\n\n> **For the owner:** Note why the double quote matters here. The name lands between the quotes of `class=\"user\"`-style markup, and `&#34;` keeps it inside its attribute. `_escape_inner` replaces 5 characters only. It does not touch `=`, the backtick, or whitespace. An unquoted attribute value is therefore not protected by this library. Require quotes around every attribute in your templates.\n\n`format_field` then strips the safe type on purpose. It returns `str(self.escape(rv))`, and the trace records the plain string `'Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;'`, without the `Markup` wrapper. The reason is mechanical: `string.Formatter.vformat` joins fields with plain string operations and knows nothing about `Markup`. The escaped characters survive the join; the type does not.\n\n> **For the owner:** The guarantee is absent for 1 step here, and `Markup.format` restores it at the final wrap ([`__init__.py:315`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L315)). `EscapeFormatter` is a public name in the module. If your code calls `EscapeFormatter.vformat` directly, it receives a plain `str` and must wrap the result itself.\n\n`Markup.format` wrapped the joined text with `self.__class__(...)`. `Markup.__new__` received `'<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>'` and returned it as `Markup` ([`__init__.py:122-131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)). The span tags are live markup; the name inside them is inert text. `User.__html__` returned that value to `User.__html_format__`.\n\nThe anchor template now renders, with the same machinery twice more. The trace collapses it into one line, `Markup.format \u00d71 more`. The first field is the integer `3`, which has neither method, so it takes the default branch and escapes to itself. The second field is the span, and `Markup` defines `__html_format__` ([`__init__.py:325-329`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L325-L329)). The specifier is empty, so that method returns `self`, and the span text enters the anchor without a second escape. The completed fragment left `User.__html_format__` as a `Markup`.\n\n> **Leaves as:** `Markup('<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>')`, on its way back to the outer `format_field`\n"}, {"n": 4, "title": "Markup.escape and the Reassembled Page", "data_in": "s = Markup('<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>'), plus the remaining {comment} field", "data_out": "Markup('<p>User: <a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a> said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;<\/p>')", "span": [45, 61], "md": "# Chapter 4 \u00b7 Markup.escape and the Reassembled Page\n\n> **Enters as:** `Markup('<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>')`, returned by `User.__html_format__` into the outer `format_field`\n\nThe anchor fragment comes back to the line that started the whole detour. `format_field` holds it as `rv` and must now hand a string to the formatter. The last statement escapes that value first ([`__init__.py:354`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L354)). The trace records the call at line 45: `Markup.escape(cls=Markup, s=Markup('<a href=\"/user/3\">\u2026<\/a>'))`. This is the moment where a careless library would escape the anchor tag a second time and print it as visible text.\n\n`Markup.escape` is a classmethod with 2 jobs ([`__init__.py:230-240`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L230-L240)). First it calls the module-level `escape` ([`__init__.py:235`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L235)). Second it compares `rv.__class__` with `cls` and re-wraps only when they differ ([`__init__.py:237-240`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L237-L240)). That comparison is how a `Markup` subclass keeps its own type through `escape`, `format`, `join` and `+`. In this run the class already matched, so the method returned the value from `escape` and allocated nothing more.\n\nInside `escape` the fragment took the second road, as the comment did in chapter 1. The anchor is a `Markup`, so `type(s) is str` is false and `_escape_inner` never ran ([`__init__.py:39-40`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39-L40)). The `hasattr(s, \"__html__\")` test won instead ([`__init__.py:42-43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L42-L43)). `Markup.__html__` returns `self` ([`__init__.py:133-134`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L133-L134)), and `Markup.__new__` checked for `__html__` once more before it wrapped the text ([`__init__.py:125-126`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L125-L126)). The trace shows both calls, at lines 47 and 50. The text came out character for character the same: the `<a>` and `<span>` tags stayed live, and the name inside them stayed inert.\n\n> **For the owner:** This is the rule that makes nested fragments usable. Safe markup inside safe markup is never escaped twice. The price is that `escape` calls `__html__` twice for every object that defines it, once in `escape` and once in `Markup.__new__`. Warning: a `__html__` method with side effects or with high cost runs 2 times per call. Keep `__html__` implementations pure and cheap.\n\n`format_field` then returned the plain string `'<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>'`, as trace line 55 shows. The formatter took that string and moved to the next field.\n\nThe `{comment}` field followed the same path, which the trace collapses into one line, `EscapeFormatter.format_field \u00d71 more` at line 56. The comment is a `Markup`, and `Markup` defines `__html_format__`, so the first test in `format_field` wins ([`__init__.py:340-341`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L340-L341)). The specifier is empty, so that method returns `self` ([`__init__.py:325-329`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L325-L329)). The final `escape` call then saw `__html__` again and passed the text through unchanged. The comment entered the page still as `&lt;script&gt;alert(document.cookie);&lt;/script&gt;`.\n\n`string.Formatter.vformat` joined the trusted template text with the 2 field strings into one plain `str`. `Markup.format` wrapped that whole result with `self.__class__(...)` ([`__init__.py:313-315`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L313-L315)). Trace line 57 shows `Markup.__new__` receiving the joined text, and line 59 shows the page leaving `format` as a `Markup`. That final wrap is where the type-level guarantee returns after the plain-string work of chapter 3. The scenario then printed the value, and `Markup.__repr__` labelled it with the class name ([`__init__.py:167-168`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L167-L168)).\n\n> **For the owner:** The page contains `&lt;script&gt;` and never `<script>`. The scenario's check `assert \"<script>\" not in page` holds by construction, not by inspection of the output. Note the limit of that statement. It applies to values that arrived through `escape`, `format`, `%`, `+` or `join`. It does not apply to the template text itself, which `Markup.format` trusts in full. Before you sign off, check that every `Markup(...)` call in the code base wraps a developer-written literal, not data from a request.\n\nFormat errors do not pass silently. A malformed field raises from `string.Formatter`, and the `%` path raises `TypeError` when an argument is missing ([`__init__.py:154-165`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L154-L165), pinned by [`tests/test_markupsafe.py:55-58`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_markupsafe.py#L55-L58)). A render either completes or raises. It does not emit a half-built fragment.\n\n> **Leaves as:** `Markup('<p>User: <a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a> said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;<\/p>')`\n"}, {"n": 5, "title": "Concatenation: the operand gets escaped, both ways", "data_in": "Markup('<footer>') + '<\/p> & <script>oops<\/script>', then + Markup('<\/footer>')", "data_out": "Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')", "span": [62, 91], "md": "# Chapter 5 \u00b7 Concatenation: the operand gets escaped, both ways\n\n> **Enters as:** `Markup('<footer>')`, with the plain string `'<\/p> & <script>oops<\/script>'` waiting on the right of the `+` operator\n\nThe page is finished, and the scenario builds a footer. It writes the literal `Markup(\"<footer>\")`, and the constructor wraps that text without any change ([`__init__.py:122-131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)). Trace line 62 shows the call, and line 63 shows the result, `Markup('<footer>')`. The author controls this literal, so the unguarded constructor from chapter 1 is correct here. The next operand is different. It is the plain string `'<\/p> & <script>oops<\/script>'`, and it contains a closing paragraph tag, an ampersand, and a script tag.\n\n`Markup.__add__` receives that operand as `value` ([`__init__.py:136-140`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L136-L140)). The method first tests `isinstance(value, str) or hasattr(value, \"__html__\")` ([`__init__.py:137`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L137)). The plain string passes the first test. The method then calls `self.escape(value)` before it joins the 2 strings ([`__init__.py:138`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L138)). Trace line 65 records `Markup.escape(cls=Markup, s='<\/p> & <script>oops<\/script>')`.\n\nThe operand now walks the road of chapter 1. `Markup.escape` calls the module-level `escape` ([`__init__.py:235`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L235)). `escape` sees an exact `str`, so it takes the fast path and calls `_escape_inner` ([`__init__.py:39-40`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39-L40)). The 5 characters change, and the trace shows the result at line 68: `Markup('&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;')`. `super().__add__` then joins the 2 texts, and `self.__class__(...)` wraps the joined text ([`__init__.py:138`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L138)). Trace lines 71 to 73 show the new value, `Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;')`.\n\n> **For the owner:** This operator carries the main guarantee for everyday code. Safe markup plus untrusted text gives safe markup, because `__add__` escapes the right operand every time. `Markup.__radd__` does the same work for the other direction, and escapes the left operand first ([`__init__.py:142-146`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L142-L146)). The order of the operands does not change the result.\n\nThe second `+` has a `Markup` on the right. `Markup(\"<\/footer>\")` is built at trace line 74, and `__add__` runs again at line 76. The guard accepts the value, and `Markup.escape` runs again at line 77. This time `escape` sees a `Markup`, so `type(s) is str` is false and the `__html__` branch wins ([`__init__.py:42-43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L42-L43)). `Markup.__html__` returns `self` ([`__init__.py:133-134`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L133-L134)), so `<\/footer>` stays a live tag. Trace line 88 shows the complete footer, `Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')`. The scenario printed it through `Markup.__repr__` at line 90 ([`__init__.py:167-168`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L167-L168)).\n\nOne road stays unused in this run. An operand that is not a `str` and has no `__html__` makes `__add__` return `NotImplemented` ([`__init__.py:140`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L140)). Python then raises `TypeError`. An integer added to a `Markup` fails loudly, and the library does not convert it to text in silence.\n\nThe same pattern covers the rest of the `str` methods on `Markup`. `join` escapes every element of the iterable ([`__init__.py:170-171`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L170-L171)). `replace` escapes only its `new` argument ([`__init__.py:257-258`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L257-L258)). `ljust`, `rjust` and `center` escape the fill character ([`__init__.py:260-264`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L260-L264), [`__init__.py:272-273`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L272-L273)). `strip`, `lstrip`, `rstrip`, `removeprefix`, `removesuffix` and `partition` do not escape their arguments ([`__init__.py:266-276`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L266-L276), [`__init__.py:297-311`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L297-L311)). Version 3.0.0 made that difference on purpose, because these methods search text and do not insert text ([`CHANGES.rst:55-60`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/CHANGES.rst#L55-L60)).\n\n> **For the owner:** Caution: the slice methods keep the type but can break the text. `__getitem__`, `split`, `rsplit` and `splitlines` return `Markup` pieces ([`__init__.py:242-243`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L242-L243), [`__init__.py:173-186`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L173-L186)). A slice can cut an entity such as `&amp;` in half. The result is still typed as safe, but the markup is malformed. Check any code that truncates a `Markup` for display, for example a preview or a summary.\n\n> **Leaves as:** `Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')`\n"}, {"n": 6, "title": "striptags: the exit back to plain text, and what the fragment guarantees", "data_in": "the page Markup('<p>User: <a href=\"/user/3\">\\u2026&lt;/script&gt;<\/p>')", "data_out": "'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>' \\u2014 a plain str with live script text in it; and a final Markup rebuilt from a developer-written literal", "span": [92, 101], "md": "# Chapter 6 \u00b7 striptags: the exit back to plain text, and what the fragment guarantees\n\n> **Enters as:** `Markup('<p>User: <a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a> said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;<\/p>')`\n\nBefore the page moves again, the scenario checks the footer. It builds the expected footer text as a literal and wraps it with `Markup(...)`, at trace lines 92 and 93. The constructor copies the text and marks it safe, with no change and no check ([`__init__.py:122-131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)). The author wrote that literal, so the trust is correct here. Then the page itself enters `Markup.striptags` at trace line 94 ([`__init__.py:199-228`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L199-L228)).\n\n`striptags` first makes a plain copy of the text with `value = str(self)` ([`__init__.py:206`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L206)). It then runs 2 separate loops. The first loop removes HTML comments ([`__init__.py:212-217`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L212-L217)). The code comment above the loops gives the reason for the order ([`__init__.py:208-210`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L208-L210)). A comment that contains a tag would end too early in a single pass, and part of the comment would stay in the output. Our page has no comment, so `find(\"<!--\")` returns `-1` and the loop stops at once.\n\nThe second loop removes the tags ([`__init__.py:220-224`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L220-L224)). It finds each `<`, finds the next `>`, and cuts out the span between them. The `<p>`, `<a href=\"/user/3\">`, `<span class=\"user\">` and their closing tags go away. The escaped text stays, because `&lt;script&gt;` holds no literal `<` character. The last step joins the words with single spaces ([`__init__.py:227`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L227)). The value is now `'User: Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34; said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;'`, which the trace shows at line 95.\n\n> **For the owner:** Caution: `striptags` is best-effort text extraction, and not a sanitizer. An unterminated `<!--` or an unterminated `<` makes the loop `break` and leaves the rest of the text in place ([`__init__.py:214-215`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L214-L215), [`__init__.py:221-222`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L221-L222)). Both loops use `find` and not regular expressions. Version 2.1.4 made that change to remove a performance problem ([`CHANGES.rst:75-81`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/CHANGES.rst#L75-L81)). Large input therefore cannot blow up the run time.\n\nThe final line of `striptags` wraps the stripped value and calls `unescape` on it ([`__init__.py:228`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L228)). Trace line 95 records that wrap, and trace line 97 records the call to `Markup.unescape`. `unescape` imports `html.unescape` and applies it to `str(self)` ([`__init__.py:188-197`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L188-L197)). Every entity turns back into its character. `&#34;` becomes `\"`, `&lt;b&gt;` becomes `<b>`, and `&lt;script&gt;` becomes `<script>`. Trace lines 98 and 99 show the result: `'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'`.\n\nThe data has now left the safe side. The annotation on `unescape` says `-> str`, and the annotation on `striptags` says `-> str` ([`__init__.py:188`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L188), [`__init__.py:199`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L199)). The returned value is a plain `str` and holds a live `<script>` tag again. The scenario only prints it, which is safe. The page object itself did not change, because `striptags` worked on a copy.\n\n> **For the owner:** These 2 methods are the documented exit from safety, and the return type is the only warning. In review, find every place where the output of `striptags` or `unescape` flows back into HTML. Each such place needs a new call to `escape`. Also find every call to `Markup(...)` whose argument is not a developer-written literal, because the constructor marks any text safe.\n\nThe scenario then builds the expected fragment, at trace lines 100 and 101. This is the same unguarded constructor, used on text the author controls. The comparison succeeds, and the checks `isinstance(page, Markup)` and `\"<script>\" not in page` hold. They hold by construction, and not by inspection of the output.\n\nState the guarantee plainly. Text that passes through `escape` has the 5 characters `&`, `>`, `<`, `'` and `\"` replaced, and carries the type `Markup` ([`_native.py:1-8`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_native.py#L1-L8)). The methods `format`, `%`, `+`, `join`, `replace`, `ljust`, `rjust` and `center` route their inserted values through that same `escape`. A value that is already a `Markup` passes through unchanged, so no path escapes it twice. The C version and the pure-Python version do the same work, and the test suite runs against both ([`conftest.py:26-39`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/conftest.py#L26-L39)). A missing C extension changes speed only.\n\n> **For the owner:** Here are the limits to weigh before you sign off. First, `Markup(text)`, `__html__` and `__html_format__` are trusted without any check ([`__init__.py:125-126`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L125-L126), [`__init__.py:340-349`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L340-L349)). Second, only 5 characters are escaped, so unquoted attributes, `javascript:` URLs, and text inside `<script>` or `<style>` are out of scope. Third, `striptags` and `unescape` return unsafe `str`, and a slice can cut an entity in half. Fourth, `escape` can call a user `__html__` twice per call. Two helpers reduce common mistakes at the edge: `escape_silent(None)` gives `Markup('')` where `escape(None)` gives `Markup('None')` ([`__init__.py:48-61`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L48-L61)), and `soft_str` converts to text without destroying an existing `Markup` ([`__init__.py:64-81`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L64-L81)).\n\n> **Leaves as:** `'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'`, a plain `str` with live script text in it\n"}], "flow": [{"kind": "start", "label": "The caller runs the intended use", "chapter": null}, {"kind": "step", "fn": "escape \u00d71", "file": "src/markupsafe/__init__.py", "line": 24, "end": 45, "depth": 1, "returned": "Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>')", "chapter": 2}, {"kind": "decision", "line": 39, "end": 40, "question": "type(s) is str", "answer": "yes", "side": "no", "exit": "if hasattr(s, '__html__'):", "file": "src/markupsafe/__init__.py", "chapter": 2}, {"kind": "decision", "line": 42, "end": 43, "question": "hasattr(s, '__html__')", "answer": "yes", "side": "no", "exit": "return Markup(_escape_inner(str(s)))", "file": "src/markupsafe/__init__.py", "chapter": 2}, {"kind": "data", "label": "Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>')", "chapter": 2}, {"kind": "step", "fn": "escape", "file": "src/markupsafe/__init__.py", "line": 24, "end": 45, "depth": 1, "returned": "Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')", "chapter": 1}, {"kind": "decision", "line": 39, "end": 40, "question": "type(s) is str", "answer": "yes", "side": "no", "exit": "if hasattr(s, '__html__'):", "file": "src/markupsafe/__init__.py", "chapter": 1}, {"kind": "decision", "line": 42, "end": 43, "question": "hasattr(s, '__html__')", "answer": "yes", "side": "no", "exit": "return Markup(_escape_inner(str(s)))", "file": "src/markupsafe/__init__.py", "chapter": 1}, {"kind": "data", "label": "Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')", "chapter": 1}, {"kind": "step", "fn": "Markup.__repr__", "file": "src/markupsafe/__init__.py", "line": 167, "end": 168, "depth": 1, "returned": "\"Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')\"", "chapter": 1}, {"kind": "data", "label": "\"Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')\"", "chapter": 1}, {"kind": "step", "fn": "Markup.__new__", "file": "src/markupsafe/__init__.py", "line": 122, "end": 131, "depth": 1, "returned": "Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')", "chapter": 1}, {"kind": "decision", "line": 125, "end": 126, "question": "hasattr(object, '__html__')", "answer": "yes", "side": "no", "exit": "if encoding is None:", "file": "src/markupsafe/__init__.py", "chapter": 1}, {"kind": "data", "label": "Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')", "chapter": 1}, {"kind": "step", "fn": "escape", "file": "src/markupsafe/__init__.py", "line": 24, "end": 45, "depth": 1, "returned": "Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')", "chapter": 1}, {"kind": "decision", "line": 39, "end": 40, "question": "type(s) is str", "answer": "yes", "side": "no", "exit": "if hasattr(s, '__html__'):", "file": "src/markupsafe/__init__.py", "chapter": 1}, {"kind": "decision", "line": 42, "end": 43, "question": "hasattr(s, '__html__')", "answer": "yes", "side": "no", "exit": "return Markup(_escape_inner(str(s)))", "file": "src/markupsafe/__init__.py", "chapter": 1}, {"kind": "data", "label": "Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')", "chapter": 1}, {"kind": "step", "fn": "Markup.__repr__", "file": "src/markupsafe/__init__.py", "line": 167, "end": 168, "depth": 1, "returned": "'Markup(\\'<span class=\"user\">Alice &#3...lt;b&gt;Great&lt;/b&gt;&#34;<\/span>\\')'", "chapter": 2}, {"kind": "data", "label": "'Markup(\\'<span class=\"user\">Alice &#3...lt;b&gt;Great&lt;/b&gt;&#34;<\/span>\\')'", "chapter": 2}, {"kind": "step", "fn": "Markup.__new__", "file": "src/markupsafe/__init__.py", "line": 122, "end": 131, "depth": 1, "returned": "Markup('<p>User: {user:link} said: {comment}<\/p>')", "chapter": 2}, {"kind": "decision", "line": 125, "end": 126, "question": "hasattr(object, '__html__')", "answer": "yes", "side": "no", "exit": "if encoding is None:", "file": "src/markupsafe/__init__.py", "chapter": 2}, {"kind": "data", "label": "Markup('<p>User: {user:link} said: {comment}<\/p>')", "chapter": 2}, {"kind": "step", "fn": "Markup.format", "file": "src/markupsafe/__init__.py", "line": 313, "end": 315, "depth": 1, "returned": "Markup('<p>User: <a href=\"/user/3\"><sp...(document.cookie);&lt;/script&gt;<\/p>')", "chapter": 2}, {"kind": "step", "fn": "EscapeFormatter.format_field \u00d71", "file": "src/markupsafe/__init__.py", "line": 339, "end": 354, "depth": 2, "returned": "'&lt;script&gt;alert(document.cookie);&lt;/script&gt;'", "chapter": 4}, {"kind": "decision", "line": 340, "end": 353, "question": "hasattr(value, '__html_format__')", "answer": "hasattr(value, '__html_format__')", "side": "otherwise", "exit": "rv = super().format_field(value, str(format_spec))", "file": "src/markupsafe/__init__.py", "chapter": 4}, {"kind": "step", "fn": "EscapeFormatter.format_field", "file": "src/markupsafe/__init__.py", "line": 339, "end": 354, "depth": 2, "returned": "'<a href=\"/user/3\"><span class=\"user\">...t;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>'", "chapter": 2}, {"kind": "step", "fn": "Markup.format \u00d71", "file": "src/markupsafe/__init__.py", "line": 313, "end": 315, "depth": 3, "returned": "Markup('<a href=\"/user/3\"><span class=...;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>')", "chapter": 3}, {"kind": "step", "fn": "Markup.format", "file": "src/markupsafe/__init__.py", "line": 313, "end": 315, "depth": 3, "returned": "Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>')", "chapter": 3}, {"kind": "step", "fn": "EscapeFormatter.format_field", "file": "src/markupsafe/__init__.py", "line": 339, "end": 354, "depth": 4, "returned": "'Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;'", "chapter": 3}, {"kind": "decision", "line": 340, "end": 353, "question": "hasattr(value, '__html_format__')", "answer": "hasattr(value, '__html_format__')", "side": "otherwise", "exit": "rv = super().format_field(value, str(format_spec))", "file": "src/markupsafe/__init__.py", "chapter": 3}, {"kind": "step", "fn": "EscapeFormatter.__init__", "file": "src/markupsafe/__init__.py", "line": 335, "end": 337, "depth": 4, "returned": "None", "chapter": 3}, {"kind": "decision", "line": 340, "end": 353, "question": "hasattr(value, '__html_format__')", "answer": "hasattr(value, '__html_format__')", "side": "otherwise", "exit": "rv = super().format_field(value, str(format_spec))", "file": "src/markupsafe/__init__.py", "chapter": 3}, {"kind": "step", "fn": "Markup.escape", "file": "src/markupsafe/__init__.py", "line": 230, "end": 240, "depth": 3, "returned": "Markup('<a href=\"/user/3\"><span class=...;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>')", "chapter": 4}, {"kind": "step", "fn": "EscapeFormatter.__init__", "file": "src/markupsafe/__init__.py", "line": 335, "end": 337, "depth": 2, "returned": "None", "chapter": 2}, {"kind": "data", "label": "Markup('<p>User: <a href=\"/user/3\"><sp...(document.cookie);&lt;/script&gt;<\/p>')", "ch ter": 5}, {"kind": "step", "fn": "Markup.__add__", "file": "src/markupsafe/__init__.py", "line": 136, "end": 140, "depth": 1, "returned": "Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')", "chapter": 5}, {"kind": "decision", "line": 137, "end": 138, "question": "isinstance(value, str) or hasattr(value, '__html__')", "answer": "yes", "side": "no", "exit": "return NotImplemented", "file": "src/markupsafe/__init__.py", "chapter": 5}, {"kind": "step", "fn": "Markup.escape", "file": "src/markupsafe/__init__.py", "line": 230, "end": 240, "depth": 2, "returned": "Markup('<\/footer>')", "chapter": 5}, {"kind": "data", "label": "Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')", "chapter": 5}, {"kind": "step", "fn": "Markup.__repr__", "file": "src/markupsafe/__init__.py", "line": 167, "end": 168, "depth": 1, "returned": "\"Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')\"", "chapter": 5}, {"kind": "data", "label": "\"Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')\"", "chapter": 5}, {"kind": "step", "fn": "Markup.__new__", "file": "src/markupsafe/__init__.py", "line": 122, "end": 131, "depth": 1, "returned": "Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')", "chapter": 6}, {"kind": "decision", "line": 125, "end": 126, "question": "hasattr(object, '__html__')", "answer": "yes", "side": "no", "exit": "if encoding is None:", "file": "src/markupsafe/__init__.py", "chapter": 6}, {"kind": "data", "label": "Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')", "chapter": 6}, {"kind": "step", "fn": "Markup.striptags", "file": "src/markupsafe/__init__.py", "line": 199, "end": 228, "depth": 1, "returned": "'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'", "chapter": 6}, {"kind": "decision", "line": 221, "end": 222, "question": "(end := value.find('>', start)) == -1", "answer": "no", "side": "yes", "exit": "break", "file": "src/markupsafe/__init__.py", "chapter": 6}, {"kind": "step", "fn": "Markup.unescape", "file": "src/markupsafe/__init__.py", "line": 188, "end": 197, "depth": 2, "returned": "'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'", "chapter": 6}, {"kind": "data", "label": "'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'", "chapter": 6}, {"kind": "step", "fn": "Markup.__new__", "file": "src/markupsafe/__init__.py", "line": 122, "end": 131, "depth": 1, "returned": "Markup('<p>User: <a href=\"/user/3\"><sp...(document.cookie);&lt;/script&gt;<\/p>')", "chapter": 6}, {"kind": "decision", "line": 125, "end": 126, "question": "hasattr(object, '__html__')", "answer": "yes", "side": "no", "exit": "if encoding is None:", "file": "src/markupsafe/__init__.py", "chapter": 6}, {"kind": "data", "label": "Markup('<p>User: <a href=\"/user/3\"><sp...(document.cookie);&lt;/script&gt;<\/p>')", "chapter": 6}, {"kind": "end", "label": "The caller holds Markup('<p>User: <a href=\"/user/3\"><sp...(document.cookie);&lt;/script&gt;<\/p>')", "chapter": null}], "files": {"CHANGES.rst": "Version 3.1.0\n-------------\n\nUnreleased\n\n-   Drop support for Python 3.9.\n-   Remove previously deprecated code.\n\n\nVersion 3.0.3\n-------------\n\nReleased 2025-09-27\n\n-   ``__version__`` raises ``DeprecationWarning`` instead of ``UserWarning``.\n    :issue:`487`\n-   Adopt multi-phase initialisation (:pep:`489`) for the C extension.\n    :issue:`494`\n-   Build Windows ARM64 wheels. :issue:`485`\n-   Build Python 3.14 wheels. :issue:`503`\n-   Build riscv64 wheels. :issue:`505`\n\n\nVersion 3.0.2\n-------------\n\nReleased 2024-10-18\n\n-   Fix compatibility when ``__str__`` returns a ``str`` subclass. :issue:`472`\n-   Build requires setuptools >= 70.1. :issue:`475`\n\n\nVersion 3.0.1\n-------------\n\nReleased 2024-10-08\n\n-   Address compiler warnings that became errors in GCC 14. :issue:`466`\n-   Fix compatibility with proxy objects. :issue:`467`\n\n\nVersion 3.0.0\n-------------\n\nReleased 2024-10-07\n\n-   Support Python 3.13 and its experimental free-threaded build. :pr:`461`\n-   Drop support for Python 3.7 and 3.8.\n-   Use modern packaging metadata with ``pyproject.toml`` instead of ``setup.cfg``.\n    :pr:`348`\n-   Change ``distutils`` imports to ``setuptools``. :pr:`399`\n-   Use deferred evaluation of annotations. :pr:`400`\n-   Update signatures for ``Markup`` methods to match ``str`` signatures. Use\n    positional-only arguments. :pr:`400`\n-   Some ``str`` methods on ``Markup`` no longer escape their argument:\n    ``strip``, ``lstrip``, ``rstrip``, ``removeprefix``, ``removesuffix``,\n    ``partition``, and ``rpartition``; ``replace`` only escapes its ``new``\n    argument. These methods are conceptually linked to search methods such as\n    ``in``, ``find``, and ``index``, which already do not escape their argument.\n    :issue:`401`\n-   The ``__version__`` attribute is deprecated. Use feature detection, or\n    ``importlib.metadata.version(\"markupsafe\")``, instead. :pr:`402`\n-   Speed up escaping plain strings by 40%. :pr:`434`\n-   Simplify speedups implementation. :pr:`437`\n\n\nVersion 2.1.5\n-------------\n\nReleased 2024-02-02\n\n-   Fix ``striptags`` not collapsing spaces. :issue:`417`\n\n\nVersion 2.1.4\n-------------\n\nReleased 2024-01-19\n\n-   Don't use regular expressions for ``striptags``, avoiding a performance\n    issue. :pr:`413`\n\n\nVersion 2.1.3\n-------------\n\nReleased 2023-06-02\n\n-   Implement ``format_map``, ``casefold``, ``removeprefix``, and ``removesuffix``\n    methods. :issue:`370`\n-   Fix static typing for basic ``str`` methods on ``Markup``. :issue:`358`\n-   Use ``Self`` for annotating return types. :pr:`379`\n\n\nVersion 2.1.2\n-------------\n\nReleased 2023-01-17\n\n-   Fix ``striptags`` not stripping tags containing newlines.\n    :issue:`310`\n\n\nVersion 2.1.1\n-------------\n\nReleased 2022-03-14\n\n-   Avoid ambiguous regex matches in ``striptags``. :pr:`293`\n\n\nVersion 2.1.0\n-------------\n\nReleased 2022-02-17\n\n-   Drop support for Python 3.6. :pr:`262`\n-   Remove ``soft_unicode``, which was previously deprecated. Use\n    ``soft_str`` instead. :pr:`261`\n-   Raise error on missing single placeholder during string\n    interpolation. :issue:`225`\n-   Disable speedups module for GraalPython. :issue:`277`\n\n\nVersion 2.0.1\n-------------\n\nReleased 2021-05-18\n\n-   Mark top-level names as exported so type checking understands\n    imports in user projects. :pr:`215`\n-   Fix some types that weren't available in Python 3.6.0. :pr:`215`\n\n\nVersion 2.0.0\n-------------\n\nReleased 2021-05-11\n\n-   Drop Python 2.7, 3.4, and 3.5 support.\n-   ``Markup.unescape`` uses :func:`html.unescape` to support HTML5\n    character references. :pr:`117`\n-   Add type annotations for static typing tools. :pr:`149`\n\n\nVersion 1.1.1\n-------------\n\nReleased 2019-02-23\n\n-   Fix segfault when ``__html__`` method raises an exception when using\n    the C speedups. The exception is now propagated correctly. :pr:`109`\n\n\nVersion 1.1.0\n-------------\n\nReleased 2018-11-05\n\n-   Drop support for Python 2.6 and 3.3.\n-   Build wheels for Linux, Mac, and Windows, allowing systems without\n    a compiler to take advantage of the C extension speedups. :pr:`104`\n-   Use newer CPython API on Python 3, resulting in a 1.5x speedup.\n    :pr:`64`\n-   ``escape`` wraps ``__html__`` result in ``Markup``, consistent with\n    documented behavior. :pr:`69`\n\n\nVersion 1.0\n-----------\n\nReleased 2017-03-07\n\n-   Fixed custom types not invoking ``__unicode__`` when used with\n    ``format()``.\n-   Added ``__version__`` module attribute.\n-   Improve unescape code to leave lone ampersands alone.\n\n\nVersion 0.18\n------------\n\nReleased 2013-05-22\n\n-   Fixed ``__mul__`` and string splitting on Python 3.\n\n\nVersion 0.17\n------------\n\nReleased 2013-05-21\n\n-   Fixed a bug with broken interpolation on tuples.\n\n\nVersion 0.16\n------------\n\nReleased 2013-05-20\n\n-   Improved Python 3 Support and removed 2to3.\n-   Removed support for Python 3.2 and 2.5.\n\n\nVersion 0.15\n------------\n\nReleased 2011-07-20\n\n-   Fixed a typo that caused the library to fail to install on pypy and\n    jython.\n\n\nVersion 0.14\n------------\n\nReleased 2011-07-20\n\n-   Release fix for 0.13.\n\n\nVersion 0.13\n------------\n\nReleased 2011-07-20\n\n-   Do not attempt to compile extension for PyPy or Jython.\n-   Work around some 64bit Windows issues.\n\n\nVersion 0.12\n------------\n\nReleased 2011-02-17\n\n-   Improved PyPy compatibility.\n", "docs/html.rst": ".. currentmodule:: markupsafe\n\nHTML Representations\n====================\n\nIn many frameworks, if a class implements an ``__html__`` method it\nwill be used to get the object's representation in HTML. MarkupSafe's\n:func:`escape` function and :class:`Markup` class understand and\nimplement this method. If an object has an ``__html__`` method it will\nbe called rather than converting the object to a string, and the result\nwill be assumed safe and not escaped.\n\nFor example, an ``Image`` class might automatically generate an\n``<img>`` tag:\n\n.. code-block:: python\n\n    class Image:\n        def __init__(self, url):\n            self.url = url\n\n        def __html__(self):\n            return f'<img src=\"{self.url}\">'\n\n.. code-block:: pycon\n\n    >>> img = Image(\"/static/logo.png\")\n    >>> Markup(img)\n    Markup('<img src=\"/static/logo.png\">')\n\nSince this bypasses escaping, you need to be careful about using\nuser-provided data in the output. For example, a user's display name\nshould still be escaped:\n\n.. code-block:: python\n\n    class User:\n        def __init__(self, id, name):\n            self.id = id\n            self.name = name\n\n        def __html__(self):\n            return f'<a href=\"/user/{self.id}\">{escape(self.name)}<\/a>'\n\n.. code-block:: pycon\n\n    >>> user = User(3, \"<script>\")\n    >>> escape(user)\n    Markup('<a href=\"/users/3\">&lt;script&gt;<\/a>')\n", "src/markupsafe/__init__.py": "from __future__ import annotations\n\nimport collections.abc as cabc\nimport string\nimport typing as t\n\ntry:\n    from ._speedups import _escape_inner\nexcept ImportError:\n    from ._native import _escape_inner\n\nif t.TYPE_CHECKING:\n    import typing_extensions as te\n\n\nclass _HasHTML(t.Protocol):\n    def __html__(self, /) -> str: ...\n\n\nclass _TPEscape(t.Protocol):\n    def __call__(self, s: t.Any, /) -> Markup: ...\n\n\ndef escape(s: t.Any, /) -> Markup:\n    \"\"\"Replace the characters ``&``, ``<``, ``>``, ``'``, and ``\"`` in\n    the string with HTML-safe sequences. Use this if you need to display\n    text that might contain such characters in HTML.\n\n    If the object has an ``__html__`` method, it is called and the\n    return value is assumed to already be safe for HTML.\n\n    :param s: An object to be converted to a string and escaped.\n    :return: A :class:`Markup` string with the escaped text.\n    \"\"\"\n    # If the object is already a plain string, skip __html__ check and string\n    # conversion. This is the most common use case.\n    # Use type(s) instead of s.__class__ because a proxy object may be reporting\n    # the __class__ of the proxied value.\n    if type(s) is str:\n        return Markup(_escape_inner(s))\n\n    if hasattr(s, \"__html__\"):\n        return Markup(s.__html__())\n\n    return Markup(_escape_inner(str(s)))\n\n\ndef escape_silent(s: t.Any | None, /) -> Markup:\n    \"\"\"Like :func:`escape` but treats ``None`` as the empty string.\n    Useful with optional values, as otherwise you get the string\n    ``'None'`` when the value is ``None``.\n\n    >>> escape(None)\n    Markup('None')\n    >>> escape_silent(None)\n    Markup('')\n    \"\"\"\n    if s is None:\n        return Markup()\n\n    return escape(s)\n\n\ndef soft_str(s: t.Any, /) -> str:\n    \"\"\"Convert an object to a string if it isn't already. This preserves\n    a :class:`Markup` string rather than converting it back to a basic\n    string, so it will still be marked as safe and won't be escaped\n    again.\n\n    >>> value = escape(\"<User 1>\")\n    >>> value\n    Markup('&lt;User 1&gt;')\n    >>> escape(str(value))\n    Markup('&amp;lt;User 1&amp;gt;')\n    >>> escape(soft_str(value))\n    Markup('&lt;User 1&gt;')\n    \"\"\"\n    if not isinstance(s, str):\n        return str(s)\n\n    return s\n\n\nclass Markup(str):\n    \"\"\"A string that is ready to be safely inserted into an HTML or XML\n    document, either because it was escaped or because it was marked\n    safe.\n\n    Passing an object to the constructor converts it to text and wraps\n    it to mark it safe without escaping. To escape the text, use the\n    :meth:`escape` class method instead.\n\n    >>> Markup(\"Hello, <em>World<\/em>!\")\n    Markup('Hello, <em>World<\/em>!')\n    >>> Markup(42)\n    Markup('42')\n    >>> Markup.escape(\"Hello, <em>World<\/em>!\")\n    Markup('Hello &lt;em&gt;World&lt;/em&gt;!')\n\n    This implements the ``__html__()`` interface that some frameworks\n    use. Passing an object that implements ``__html__()`` will wrap the\n    output of that method, marking it safe.\n\n    >>> class Foo:\n    ...     def __html__(self):\n    ...         return '<a href=\"/foo\">foo<\/a>'\n    ...\n    >>> Markup(Foo())\n    Markup('<a href=\"/foo\">foo<\/a>')\n\n    This is a subclass of :class:`str`. It has the same methods, but\n    escapes their arguments and returns a ``Markup`` instance.\n\n    >>> Markup(\"<em>%s<\/em>\") % (\"foo & bar\",)\n    Markup('<em>foo &amp; bar<\/em>')\n    >>> Markup(\"<em>Hello<\/em> \") + \"<foo>\"\n    Markup('<em>Hello<\/em> &lt;foo&gt;')\n    \"\"\"\n\n    __slots__ = ()\n\n    def __new__(\n        cls, object: t.Any = \"\", encoding: str | None = None, errors: str = \"strict\"\n    ) -> te.Self:\n        if hasattr(object, \"__html__\"):\n            object = object.__html__()\n\n        if encoding is None:\n            return super().__new__(cls, object)\n\n        return super().__new__(cls, object, encoding, errors)\n\n    def __html__(self, /) -> te.Self:\n        return self\n\n    def __add__(self, value: str | _HasHTML, /) -> te.Self:\n        if isinstance(value, str) or hasattr(value, \"__html__\"):\n            return self.__class__(super().__add__(self.escape(value)))\n\n        return NotImplemented\n\n    def __radd__(self, value: str | _HasHTML, /) -> te.Self:\n        if isinstance(value, str) or hasattr(value, \"__html__\"):\n            return self.escape(value).__add__(self)\n\n        return NotImplemented\n\n    def __mul__(self, value: t.SupportsIndex, /) -> te.Self:\n        return self.__class__(super().__mul__(value))\n\n    def __rmul__(self, value: t.SupportsIndex, /) -> te.Self:\n        return self.__class__(super().__mul__(value))\n\n    def __mod__(self, value: t.Any, /) -> te.Self:\n        if isinstance(value, tuple):\n            # a tuple of arguments, each wrapped\n            value = tuple(_MarkupEscapeHelper(x, self.escape) for x in value)\n        elif hasattr(type(value), \"__getitem__\") and not isinstance(value, str):\n            # a mapping of arguments, wrapped\n            value = _MarkupEscapeHelper(value, self.escape)\n        else:\n            # a single argument, wrapped with the helper and a tuple\n            value = (_MarkupEscapeHelper(value, self.escape),)\n\n        return self.__class__(super().__mod__(value))\n\n    def __repr__(self, /) -> str:\n        return f\"{self.__class__.__name__}({super().__repr__()})\"\n\n    def join(self, iterable: cabc.Iterable[str | _HasHTML], /) -> te.Self:\n        return self.__class__(super().join(map(self.escape, iterable)))\n\n    def split(  # type: ignore[override]\n        self, /, sep: str | None = None, maxsplit: t.SupportsIndex = -1\n    ) -> list[te.Self]:\n
