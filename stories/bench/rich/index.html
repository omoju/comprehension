 get_style(column.style or \"\")` \u2014 `Style(dim=True)`, the `style=\"dim\"` passed to `add_column` back in Chapter 6 ([`L675-L677`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L675-L677)). Note the asymmetry: the header's style replaces the column's, it does not stack on top of it.\n\nThen padding. `any(padding)` is true for `(0, 1, 0, 1)`, so each raw cell is wrapped in a `Padding` renderable ([`L684-L691`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L684-L691)). `loop_first_last` tells `get_padding` whether this is the first or last row, and with `pad_edge=True` and `collapse_padding=False` nothing is trimmed: the trace shows `get_padding(first_row=True, last_row=False) \u2192 (0, 1, 0, 1)`, cached against that flag pair ([`L642-L665`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L642-L665)). Out comes `_Cell(style=Style(magenta, bold), renderable=Padding('Date', (0,1,0,1)), vertical='top')` \u2014 the vertical taken from the renderable if it declares one, else from the column ([`L686-L691`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L686-L691)).\n\nThe string `'Dec 20, 2019'` is still a string at this point. So is `'[red]Solo[/red]: A Star Wars Story'`.\n\n## Choosing the characters\n\nBefore a border is drawn, the box is given a chance to change itself ([`table.py#L767-L774`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L767-L774)). `pick_bool(self.safe_box, console.safe_box)` picks the first non-`None` of the table's `None` and the console's `True`, returning `True` ([`_pick.py#L4-L17`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_pick.py#L4-L17)), and `Box.substitute` runs two tests ([`box.py#L67-L83`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/box.py#L67-L83)): legacy Windows, which would swap `HEAVY_HEAD` for `SQUARE` from the substitution table ([`box.py#L405-L412`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/box.py#L405-L412)), and `options.ascii_only`, which would replace it with plain `+-|` ASCII. The trace shows `ascii_only \u2192 False` \u2014 the console's encoding is `'utf-8'` ([`console.py#L142-L145`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L142-L145)) \u2014 so `HEAVY_HEAD` survives intact. (`get_plain_headed_box`, which strips the header-specific characters, is skipped because `show_header` is true.)\n\n> **For the owner:** The box characters are chosen from `options.encoding`, which is read off the output file object, not from a setting. Redirect the same program into a `cp1252` pipe and the table silently renders in ASCII instead of raising \u2014 that is the intended degradation, but confirm it is acceptable for any consumer that parses your output, and pin `box=box.ASCII` explicitly if it must never vary.\n\n## The first line\n\n`Box.get_top` walks the widths with `loop_last`, emitting a corner, a run of `\u2501` per column, and a divider between each ([`box.py#L95-L113`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/box.py#L95-L113)). The result is `'\u250f' + '\u2501'\u00d714 + '\u2533' + '\u2501'\u00d735 + '\u2533' + '\u2501'\u00d719 + '\u2533' + '\u2501'\u00d716 + '\u2513'` \u2014 89 characters, exactly the `table_width` computed in Chapter 7. It is yielded as `Segment('\u250f\u2501\u2501\u2501\u2026\u2513', Style())` followed by `Segment('\\n')`, and those two are the first things this renderable has produced ([`table.py#L804-L806`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L804-L806)).\n\n## Each row, one cell at a time\n\nFrom here the loop runs per row ([`table.py#L813-L931`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L813-L931)) \u2014 the eighty further pumps of the generator the trace folds away. For the header row `row_style` is `Style.null()`; body rows get `get_row_style`, which composes alternating `row_styles` with any per-row style ([`L823-L828`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L823-L828), [`L310-L318`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L310-L318)). Neither is set here.\n\nEach cell is then rendered on its own, at its own width ([`L829-L844`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L829-L844)): the options are updated with `width`, the column's `justify`, `no_wrap`, `overflow` and `highlight`, and `console.render_lines` is called with `style=get_style(cell.style) + row_style`. This is where the strings finally stop being strings. `Padding.__rich_console__` renders its inner renderable at `width - left - right` ([`padding.py#L92-L99`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/padding.py#L92-L99)), which routes `'Date'` through `Console.render` \u2192 `render_str` \u2192 `markup.render` exactly as in Chapter 2 \u2014 markup still enabled, highlighting now off. The column's `justify` is applied by `Lines.justify`, which pads left-aligned cells on the right and right-aligned ones on the left ([`containers.py#L129-L142`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/containers.py#L129-L142)).\n\nThe segments this produces are visible the moment `print` takes them: `Segment('\u2503', Style())`, then `Segment(' ', Style(magenta, bold))`, `Segment('Date        ', Style(magenta, bold))` \u2014 four characters plus eight of justification, filling 14 minus 2 of padding \u2014 then the right pad, then `Segment('Title                            ', \u2026)` at 33 cells, `Segment('Production Budget', \u2026)` at exactly 17, and `Segment('    Box Office', \u2026)` right-justified into 14. The padding spaces carry the cell style because `render_lines` applies it to every segment it produces ([`console.py#L1372-L1373`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1372-L1373)), which is what makes a background colour fill the whole cell rather than just the glyphs.\n\nFurther down, `Segment('Solo', \u2026)` and `Segment('$1,332,539,889', \u2026)` appear \u2014 the markup in those cells was interpreted here, into their own spans, inside the cell render.\n\n> **For the owner:** Table cells are parsed as console markup. `'[red]Solo[/red]'` became styled text; a cell containing user-supplied text with square brackets will be interpreted the same way, and an unbalanced tag raises `MarkupError` out of `console.print`, turning a table into an exception. Wrap untrusted cell values in `rich.markup.escape()` or pass them as `Text` objects.\n\nRows are then squared off. `align_cell` pads a cell vertically to the row height \u2014 forced to `bottom` for the header and `top` for the footer, otherwise the column's `vertical` \u2014 and `Segment.set_shape` fixes every cell to the same width and height ([`table.py#L846-L877`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L846-L877)). That is the guarantee that the vertical bars line up even when one cell wraps to three lines and its neighbours do not. The dividers between cells come from `box_segments`, choosing head/mid/foot characters by row position, and a divider made of whitespace is re-styled with the row's background so zebra striping has no gaps ([`L885-L904`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L885-L904)). After the header row, `get_row(widths, \"head\")` draws the `\u2521\u2501\u2501\u2501\u2547\u2026\u2529` rule ([`L910-L914`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L910-L914)), and the last thing the generator yields is `get_bottom(widths)` ([`L933-L935`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L933-L935)) \u2014 the `\u2514\u2500\u2500\u2500\u2026\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518` the final output ends with.\n\n> **For the owner:** A cell wider than its column is not an error. `Column.overflow` defaults to `\"ellipsis\"` ([`table.py#L90-L91`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L90-L91)) and is passed into each cell's render options ([`L830-L837`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L830-L837)), so content is truncated with a `\u2026` and the layout holds. Set `overflow=\"fold\"` on any column whose values must survive in full.\n\n> **Leaves as:** a stream of `Segment`s beginning `Segment('\u250f\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2533\u2026\u2513', Style())`, `Segment('\\n')`, `Segment('\u2503', Style())`, `Segment(' ', Style(magenta, bold))`, `Segment('Date        ', Style(magenta, bold))`, \u2026 and ending with the bottom border\n"}, {"n": 9, "title": "One Last Crop, Styles Spent, and Reading Back What Was Printed", "data_in": "~80 Segments of table output, self.width == 100", "data_out": "'\\u250f\\u2501\\u2501\\u2501\\u2026\\u2513\\n\\u2026\\u2514\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2518\\n' written once to stdout and flushed, copied into _record_buffer, then export_text returning 'Hello World!\\nWhere there is a Will t\\u2026\\u2534\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2500\\u2518\\n' and emptying that buffer", "span": [545, 706], "md": "# Chapter 9 \u00b7 One Last Crop, Styles Spent, and Reading Back What Was Printed\n\n> **Enters as:** a stream of `Segment`s beginning `Segment('\u250f\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2533\u2026\u2513', Style())`, `Segment('\\n')`, `Segment('\u2503', Style())`, `Segment(' ', Style(magenta, bold))`, `Segment('Date        ', Style(magenta, bold))`, \u2026 and ending with the bottom border\n\nThe generator is drained into a list \u2014 eighty-odd segments, the whole table \u2014 and `print` now has one thing left to do before it lets go of them.\n\n## The measure that is actually enforced\n\n`crop` defaulted to `True`, so every segment goes through `Segment.split_and_crop_lines` at `self.width` with `pad=False` ([`console.py#L1749-L1756`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1749-L1756)). The trace shows `Console.width` resolved again to `100` \u2014 `self._width` wins over anything the OS reports ([`console.py#L1040-L1043`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1040-L1043)) \u2014 and then the splitter walking the stream, cutting at each `\\n` and handing each accumulated line to `adjust_line_length` ([`segment.py#L333-L351`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L333-L351)).\n\nThe first line is the top border alone. `adjust_line_length` sums `segment.cell_length` ([`segment.py#L372`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L372)), which for a non-control segment is `cell_len(text)` ([`segment.py#L78-L86`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L78-L86)), and `cell_len` \u2014 short string, so the cached path \u2014 returns **89** ([`cells.py#L98-L110`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/cells.py#L98-L110)). Each heavy box-drawing glyph is one cell, so the 89-character border is 89 cells wide, exactly the `table_width` computed in Chapter 7. 89 is less than 100 and `pad=False`, so the branch taken is the one that copies the line unchanged ([`segment.py#L375-L379`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L375-L379)) \u2014 no truncation, and no padding out to the console width either, which is why the exported text has no trailing spaces. The newline segment is re-appended and the line goes into `self._buffer` ([`segment.py#L341-L346`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L341-L346)). Seven more lines follow the same route.\n\nHad any line been longer, the `line_length > length` branch would have rebuilt it segment by segment and cut the last one with `set_cell_size` ([`segment.py#L380-L393`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L380-L393)) \u2014 which, for a split double-width glyph, substitutes spaces rather than half a character.\n\n> **For the owner:** This crop is the only unconditional width guarantee in the pipeline; `max_width` in `ConsoleOptions` is advice that a renderable may ignore, but `print(crop=True)` truncates whatever it is handed. Note the escape hatch cuts the other way: `soft_wrap=True` sets `crop = False` ([`console.py#L1697-L1702`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1697-L1702)), so a custom `__rich_console__` that ignores the width can then emit lines wider than the console. Review any use of `soft_wrap` alongside third-party renderables.\n\n## Leaving the buffer context\n\n`print`'s `with self:` block ends, `__exit__` calls `_exit_buffer` ([`console.py#L862-L864`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L862-L864)), the depth counter goes from 1 back to 0, and `_check_buffer` runs ([`console.py#L817-L820`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L817-L820)). That counter is the reason a table is one write and not eighty: nested prints only increment it, and nothing reaches the file until the outermost context exits.\n\n`_check_buffer` has two outcomes worth knowing ([`console.py#L2044-L2057`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2044-L2057)): if `quiet` is set the buffer is discarded wholesale and nothing is written, and a `BrokenPipeError` from the write is routed to `on_broken_pipe`, whose default is to go quiet, point stdout at `/dev/null` and raise `SystemExit(1)` ([`console.py#L2030-L2042`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2030-L2042)). Neither is a silent corruption; both are deliberate.\n\nInside `_write_buffer`, under the console lock, the recording happens *first* \u2014 `record` is true and `_buffer_index` is 0, so a copy of the buffer is appended to `self._record_buffer` under its own separate lock ([`console.py#L2062-L2065`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2062-L2065)). What is recorded is exactly what is about to be written, once per flush.\n\n> **For the owner:** `record=True` makes `_record_buffer` grow without bound; nothing trims it, and only an `export_*` call with `clear=True` empties it. A long-running process that records and never exports leaks every segment it ever printed. Treat `record` as a debugging or one-shot-export setting, not a default.\n\n## Styles, spent\n\n`_render_buffer` walks the copy once ([`console.py#L2132-L2154`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2132-L2154)). It reads `not_terminal = not self.is_terminal` up front \u2014 `False` here, as it has been all run \u2014 and would strip colour entirely if `no_color` were set ([`console.py#L2139-L2140`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2139-L2140)). Then, per segment: truthy style \u2192 `style.render(text, \u2026)`; otherwise append the text, unless it is a control code and the target is not a terminal, in which case it is dropped ([`console.py#L2141-L2151`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2141-L2151)).\n\nThe trace shows the triage plainly. `Style.__bool__` returns `False` for the border segments ([`style.py#L340-L342`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L340-L342)) and their text is appended raw. It returns `True` for `'Date        '`, `'Title                            '`, `'Production Budget'`, `'    Box Office'`, `'Dec 20, 2019'`, `'Solo'`, `'$1,332,539,889'` \u2014 and each of those goes to `Style.render`, which is handed `color_system=None` and returns the string **unchanged** ([`style.py#L710-L711`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L710-L711)).\n\nThat is the end of the thread begun in Chapter 1. The magenta, the bold, the dim, the `[red]` on *Solo* and the `[bold]` on `$1,332,539,889` all travelled the full length of the pipeline as real `Style` objects attached to real `Segment`s, composed correctly at every join \u2014 and then evaporated at the last instruction, because the colour system was decided once, at construction, from a `stdout` that was not a terminal. Flip that one input and exactly the same segments emit SGR sequences.\n\nThe joined string \u2014 `'\u250f\u2501\u2501\u2501\u2026\u2513\\n\u2026\u2514\u2500\u2500\u2500\u2026\u2518\\n'` \u2014 is written in a single `self.file.write`, followed by `flush()`, and the buffer is deleted ([`console.py#L2121-L2130`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2121-L2130)). On Windows the same text would be split into ~8K-character batches to dodge a CPython write-size bug ([`console.py#L2098-L2117`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2098-L2117)), and a `UnicodeEncodeError` on either path is re-raised with a `PYTHONIOENCODING` hint attached ([`console.py#L2125-L2127`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2125-L2127)).\n\n## Reading it back\n\n`console.export_text()` opens the record buffer \u2014 the accumulated copy of all three prints ([`console.py#L2192-L2222`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2192-L2222)). With the default `styles=False` it joins `segment.text` for every non-control segment ([`console.py#L2214-L2219`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2214-L2219)), which in this run is byte-for-byte what went to stdout, and returns `'Hello World!\\nWhere there is a Will t\u2026\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\\n'`. Then, because `clear` defaults to `True`, it empties the buffer ([`console.py#L2220-L2221`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2220-L2221)).\n\nThe scenario's five assertions hold against that string, including `\"Solo: A Star Wars Story\"` \u2014 the tags are gone because they became spans in Chapter 8, and the spans produced no codes here.\n\n> **For the owner:** Two things about export. The `record=True` precondition is an `assert` ([`console.py#L2204-L2206`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L eType, optional): Optional renderable to replace current renderable,\n                or None for no change. Defaults to None.\n            style: (Style, optional): Replacement style, or None for no change. Defaults to None.\n        \"\"\"\n        if renderables:\n            self.screen.renderable = (\n                Group(*renderables) if len(renderables) > 1 else renderables[0]\n            )\n        if style is not None:\n            self.screen.style = style\n        self.console.print(self.screen, end=\"\")\n\n    def __enter__(self) -> \"ScreenContext\":\n        self._changed = self.console.set_alt_screen(True)\n        if self._changed and self.hide_cursor:\n            self.console.show_cursor(False)\n        return self\n\n    def __exit__(\n        self,\n        exc_type: Optional[Type[BaseException]],\n        exc_val: Optional[BaseException],\n        exc_tb: Optional[TracebackType],\n    ) -> None:\n        if self._changed:\n            self.console.set_alt_screen(False)\n            if self.hide_cursor:\n                self.console.show_cursor(True)\n\n\nclass Group:\n    \"\"\"Takes a group of renderables and returns a renderable object that renders the group.\n\n    Args:\n        renderables (Iterable[RenderableType]): An iterable of renderable objects.\n        fit (bool, optional): Fit dimension of group to contents, or fill available space. Defaults to True.\n    \"\"\"\n\n    def __init__(self, *renderables: \"RenderableType\", fit: bool = True) -> None:\n        self._renderables = renderables\n        self.fit = fit\n        self._render: Optional[List[RenderableType]] = None\n\n    @property\n    def renderables(self) -> List[\"RenderableType\"]:\n        if self._render is None:\n            self._render = list(self._renderables)\n        return self._render\n\n    def __rich_measure__(\n        self, console: \"Console\", options: \"ConsoleOptions\"\n    ) -> \"Measurement\":\n        if self.fit:\n            return measure_rende isable interactive mode, or None to auto detect. Defaults to None.\n        soft_wrap (Optional[bool], optional): Set soft wrap default on print method. Defaults to False.\n        theme (Theme, optional): An optional style theme object, or ``None`` for default theme.\n        stderr (bool, optional): Use stderr rather than stdout if ``file`` is not specified. Defaults to False.\n        file (IO, optional): A file object where the console should write to. Defaults to stdout.\n        quiet (bool, Optional): Boolean to suppress all output. Defaults to False.\n        width (int, optional): The width of the terminal. Leave as default to auto-detect width.\n        height (int, optional): The height of the terminal. Leave as default to auto-detect height.\n        style (StyleType, optional): Style to apply to all output, or None for no style. Defaults to None.\n        no_color (Optional[bool], optional): Enabled no color mode, or None to auto detect. Defaults to None.\n        tab_size (int, optional): Number of spaces used to replace a tab character. Defaults to 8.\n        record (bool, optional): Boolean to enable recording of terminal output,\n            required to call :meth:`export_html`, :meth:`export_svg`, and :meth:`export_text`. Defaults to False.\n        markup (bool, optional): Boolean to enable :ref:`console_markup`. Defaults to True.\n        emoji (bool, optional): Enable emoji code. Defaults to True.\n        emoji_variant (str, optional): Optional emoji variant, either \"text\" or \"emoji\". Defaults to None.\n        highlight (bool, optional): Enable automatic highlighting. Defaults to True.\n        log_time (bool, optional): Boolean to enable logging of time by :meth:`log` methods. Defaults to True.\n        log_path (bool, optional): Boolean to enable the logging of the caller by :meth:`log`. Defaults to True.\n        log_time_format (Union[str, TimeFormatterCallable], optional): If ``log_time`` is enabled, either string for strftime or callable that formats the time. Defaults to \"[%X] \".\n        highlighter (HighlighterType, optional): Default highlighter.\n        legacy_windows (bool, optional): Enable legacy Windows mode, or ``None`` to auto detect. Defaults to ``None``.\n        safe_box (bool, optional): Restrict box options that don't render on legacy Windows.\n        get_datetime (Callable[[], datetime], optional): Callable that gets the current time as a datetime.datetime object (used by Console.log),\n            or None for datetime.now.\n        get_time (Callable[[], time], optional): Callable that gets the current time in seconds, default uses time.monotonic.\n    \"\"\"\n\n    _environ: Mapping[str, str] = os.environ\n\n    def __init__(\n        self,\n        *,\n        color_system: Optional[\n            Literal[\"auto\", \"standard\", \"256\", \"truecolor\", \"windows\"]\n        ] = \"auto\",\n        force_terminal: Optional[bool] = None,\n        force_jupyter: Optional[bool] = None,\n        force_interactive: Optional[bool] = None,\n        soft_wrap: bool = False,\n        theme: Optional[Theme] = None,\n        stderr: bool = False,\n        file: Optional[IO[str]] = None,\n        quiet: bool = False,\n        width: Optional[int] = None,\n        height: Optional[int] = None,\n        style: Optional[StyleType] = None,\n        no_color: Optional[bool] = None,\n        tab_size: int = 8,\n        record: bool = False,\n        markup: bool = True,\n        emoji: bool = True,\n        emoji_variant: Optional[EmojiVariant] = None,\n        highlight: bool = True,\n        log_time: bool = True,\n        log_path: bool = True,\n        log_time_format: Union[str, FormatTimeCallable] = \"[%X]\",\n        highlighter: Optional[\"HighlighterType\"] = ReprHighlighter(),\n        legacy_windows: Optional[bool] = None,\n        safe_box: bool = True,\n        get_datetime: Optional[Callable[[], datetime]] = None,\n        get_time: Optional[Callable[[], float]] = None,\n
