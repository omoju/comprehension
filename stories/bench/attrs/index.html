n        )\n\n    extra_lines, fmt_setter, fmt_setter_with_converter = _determine_setters(\n        is_frozen, is_slotted, base_attr_map\n    )\n    lines.extend(extra_lines)\n\n    args = []  # Parameters in the definition of __init__\n    pre_init_args = []  # Parameters in the call to __attrs_pre_init__\n    kw_only_args = []  # Used for both 'args' and 'pre_init_args' above\n    attrs_to_validate = []\n\n    # This is a dictionary of names to validator and converter callables.\n    # Injecting this into __init__ globals lets us avoid lookups.\n    names_for_globals = {}\n    annotations = {\"return\": None}\n\n    for a in attrs:\n        if a.validator:\n            attrs_to_validate.append(a)\n\n        attr_name = a.name\n        has_on_setattr = a.on_setattr is not None or (\n            a.on_setattr is not setters.NO_OP and has_cls_on_setattr\n        )\n        # a.alias is set to maybe-mangled attr_name in _ClassBuilder if not\n        # explicitly provided\n        arg_name = a.alias\n\n        has_factory = isinstance(a.default, Factory)\n        maybe_self = \"self\" if has_factory and a.default.takes_self else \"\"\n\n        if a.converter is not None and not isinstance(a.converter, Converter):\n            converter = Converter(a.converter)\n        else:\n            converter = a.converter\n\n        if a.init is False:\n            if has_factory:\n                init_factory_name = _INIT_FACTORY_PAT % (a.name,)\n                if converter is not None:\n                    lines.append(\n                        fmt_setter_with_converter(\n                            attr_name,\n                            init_factory_name + f\"({maybe_self})\",\n                            has_on_setattr,\n                            converter,\n                        )\n                    )\n                    names_for_globals[converter._get_global_name(a.name)] = (\n                        converter.converter\n                    )\n                else:\n                    lines.append(\n                        fmt_setter(\n                            attr_name,\n                            init_factory_name + f\"({maybe_self})\",\n                            has_on_setattr,\n                        )\n                    )\n                names_for_globals[init_factory_name] = a.default.factory\n            elif converter is not None:\n                lines.append(\n                    fmt_setter_with_converter(\n                        attr_name,\n                        f\"attr_dict['{attr_name}'].default\",\n                        has_on_setattr,\n                        converter,\n                    )\n                )\n                names_for_globals[converter._get_global_name(a.name)] = (\n                    converter.converter\n                )\n            else:\n                lines.append(\n                    fmt_setter(\n                        attr_name,\n                        f\"attr_dict['{attr_name}'].default\",\n                        has_on_setattr,\n                    )\n                )\n        elif a.default is not NOTHING and not has_factory:\n            arg = f\"{arg_name}=attr_dict['{attr_name}'].default\"\n            if a.kw_only:\n                kw_only_args.append(arg)\n            else:\n                args.append(arg)\n                pre_init_args.append(arg_name)\n\n            if converter is not None:\n                lines.append(\n                    fmt_setter_with_converter(\n                        attr_name, arg_name, has_on_setattr, converter\n                    )\n                )\n                names_for_globals[converter._get_global_name(a.name)] = (\n                    converter.converter\n                )\n            else:\n                lines.append(fmt_setter(attr_name, arg_name, has_on_setattr))\n\n        elif has_factory:\n            arg = f\"{arg_name}=NOTHING\"\n            if a.kw_only:\n                kw_only_args.append(arg)\n            else:\n                args.append(arg)\n                pre_init_args.append(arg_name)\n            lines.append(f\"if {arg_name} is not NOTHING:\")\n\n            init_factory_name = _INIT_FACTORY_PAT % (a.name,)\n            if converter is not None:\n                lines.append(\n                    \"    \"\n                    + fmt_setter_with_converter(\n                        attr_name, arg_name, has_on_setattr, converter\n                    )\n                )\n                lines.append(\"else:\")\n                lines.append(\n                    \"    \"\n                    + fmt_setter_with_converter(\n                        attr_name,\n                        init_factory_name + \"(\" + maybe_self + \")\",\n                        has_on_setattr,\n                        converter,\n                    )\n                )\n                names_for_globals[converter._get_global_name(a.name)] = (\n                    converter.converter\n                )\n            else:\n                lines.append(\n                    \"    \" + fmt_setter(attr_name, arg_name, has_on_setattr)\n                )\n                lines.append(\"else:\")\n                lines.append(\n                    \"    \"\n                    + fmt_setter(\n                        attr_name,\n                        init_factory_name + \"(\" + maybe_self + \")\",\n                        has_on_setattr,\n                    )\n                )\n            names_for_globals[init_factory_name] = a.default.factory\n        else:\n            if a.kw_only:\n                kw_only_args.append(arg_name)\n            else:\n                args.append(arg_name)\n                pre_init_args.append(arg_name)\n\n            if converter is not None:\n                lines.append(\n                    fmt_setter_with_converter(\n                        attr_name, arg_name, has_on_setattr, converter\n                    )\n                )\n                names_for_globals[converter._get_global_name(a.name)] = (\n                    converter.converter\n                )\n            else:\n                lines.append(fmt_setter(attr_name, arg_name, has_on_setattr))\n\n        if a.init is True:\n            if a.type is not None and converter is None:\n                annotations[arg_name] = a.type\n            elif converter is not None and converter._first_param_type:\n                # Use the type from the converter if present.\n                annotations[arg_name] = converter._first_param_type\n\n    if attrs_to_validate:  # we can skip this if there are no validators.\n        names_for_globals[\"_config\"] = _config\n        lines.append(\"if _config._run_validators is True:\")\n        for a in attrs_to_validate:\n            val_name = \"__attr_validator_\" + a.name\n            attr_name = \"__attr_\" + a.name\n            lines.append(f\"    {val_name}(self, {attr_name}, self.{a.name})\")\n            names_for_globals[val_name] = a.validator\n            names_for_globals[attr_name] = a\n\n    if call_post_init:\n        lines.append(\"self.__attrs_post_init__()\")\n\n    # Because this is set only after __attrs_post_init__ is called, a crash\n    # will result if post-init tries to access the hash code.  This seemed\n    # preferable to setting this beforehand, in which case alteration to field\n    # values during post-init combined with post-init accessing the hash code\n    # would result in silent bugs.\n    if does_cache_hash:\n        if is_frozen:\n            if is_slotted:\n                init_hash_cache = f\"_setattr('{_HASH_CACHE_FIELD}', None)\"\n            else:\n                init_hash_cache = f\"_inst_dict['{_HASH_CACHE_FIELD}'] = None\"\n        else:\n            init_hash_cache = f\"self.{_HASH_CACHE_FIELD} = None\"\n        lines.append(init_hash_cache)\n\n    # For exceptions we rely on BaseException.__init__ for proper\n    # initialization.\n    if is_exc:\n        vals = \",\".join(f\"self.{a.name}\" for a in attrs if a.init)\n\n        lines.append(f\"BaseException.__init__(self, {vals})\")\n\n    args = \", \".join(args)\n    pre_init_args = \", \".join(pre_init_args)\n    if kw_only_args:\n        # leading comma & kw_only args\n        args += f\"{', ' if args else ''}*, {', '.join(kw_only_args)}\"\n        pre_init_kw_only_args = \", \".join(\n            [\n                f\"{kw_arg_name}={kw_arg_name}\"\n                # We need to remove the defaults from the kw_only_args.\n                for kw_arg_name in (kwa.split(\"=\")[0] for kwa in kw_only_args)\n            ]\n        )\n        pre_init_args += \", \" if pre_init_args else \"\"\n        pre_init_args += pre_init_kw_only_args\n\n    if call_pre_init and pre_init_has_args:\n        # If pre init method has arguments, pass the values given to __init__.\n        lines[0] = f\"self.__attrs_pre_init__({pre_init_args})\"\n\n    # Python <3.12 doesn't allow backslashes in f-strings.\n    NL = \"\\n    \"\n    return (\n        f\"\"\"def {method_name}(self, {args}):\n    {NL.join(lines) if lines else \"pass\"}\n\"\"\",\n        names_for_globals,\n        annotations,\n    )\n\n\ndef _default_init_alias_for(name: str) -> str:\n    \"\"\"\n    The default __init__ parameter name for a field.\n\n    This performs private-name adjustment via leading-unscore stripping,\n    and is the default value of Attribute.alias if not provided.\n    \"\"\"\n\n    return name.lstrip(\"_\")\n\n\nclass Attribute:\n    \"\"\"\n    *Read-only* representation of an attribute.\n\n    .. warning::\n\n       You should never instantiate this class yourself.\n\n    The class has *all* arguments of `attr.ib` (except for ``factory`` which is\n    only syntactic sugar for ``default=Factory(...)`` plus the following:\n\n    - ``name`` (`str`): The name of the attribute.\n    - ``alias`` (`str`): The __init__ parameter name of the attribute, after\n      any explicit overrides and default private-attribute-name handling.\n    - ``alias_is_default`` (`bool`): Whether the ``alias`` was automatically\n      generated (``True``) or explicitly provided by the user (``False``).\n    - ``inherited`` (`bool`): Whether or not that attribute has been inherited\n      from a base class.\n    - ``eq_key`` and ``order_key`` (`typing.Callable` or `None`): The\n      callables that are used for comparing and ordering objects by this\n      attribute, respectively. These are set by passing a callable to\n      `attr.ib`'s ``eq``, ``order``, or ``cmp`` arguments. See also\n      :ref:`comparison customization <custom-comparison>`.\n\n    Instances of this class are frequently used for introspection purposes\n    like:\n\n    - `fields` returns a tuple of them.\n    - Validators get them passed as the first argument.\n    - The :ref:`field transformer <transform-fields>` hook receives a list of\n      them.\n    - The ``alias`` property exposes the __init__ parameter name of the field,\n      with any overrides and default private-attribute handling applied.\n\n\n    .. versionadded:: 20.1.0 *inherited*\n    .. versionadded:: 20.1.0 *on_setattr*\n    .. versionchanged:: 20.2.0 *inherited* is not taken into account for\n        equality checks and hashing anymore.\n    .. versionadded:: 21.1.0 *eq_key* and *order_key*\n    .. versionadded:: 22.2.0 *alias*\n    .. versionadded:: 26.1.0 *alias_is_default*\n\n    For the full version history of the fields, see `attr.ib`.\n    \"\"\"\n\n    # These slots must NOT be reordered because we use them later for\n    # instantiation.\n    __slots__ = (  # noqa: RUF023\n        \"name\",\n        \"default\",\n        \"validator\",\n        \"repr\",\n        \"eq\",\n        \"eq_key\",\n        \"order\",\n        \"order_key\",\n        \"hash\",\n        \"init\",\n        \"metadata\",\n        \"type\",\n        \"converter\",\n        \"kw_only\",\n        \"inherited\",\n        \"on_setattr\",\n        \"alias\",\n        \"alias_is_default\",\n    )\n\n    def __init__(\n        self,\n        name,\n        default,\n        validator,\n        repr,\n        cmp,  # XXX: unused, remove along with other cmp code.\n        hash,\n        init,\n        inherited,\n        metadata=None,\n        type=None,\n        converter=None,\n        kw_only=False,\n        eq=None,\n        eq_key=None,\n        order=None,\n        order_key=None,\n        on_setattr=None,\n        alias=None,\n        alias_is_default=None,\n    ):\n        eq, eq_key, order, order_key = _determine_attrib_eq_order(\n            cmp, eq_key or eq, order_key or order, True\n        )\n\n        # Cache this descriptor here to speed things up later.\n        bound_setattr = _OBJ_SETATTR.__get__(self)\n\n        # Despite the big red warning, people *do* instantiate `Attribute`\n        # themselves.\n        bound_setattr(\"name\", name)\n        bound_setattr(\"default\", default)\n        bound_setattr(\"validator\", validator)\n        bound_setattr(\"repr\", repr)\n        bound_setattr(\"eq\", eq)\n        bound_setattr(\"eq_key\", eq_key)\n        bound_setattr(\"order\", order)\n        bound_setattr(\"order_key\", order_key)\n        bound_setattr(\"hash\", hash)\n        bound_setattr(\"init\", init)\n        bound_setattr(\"converter\", converter)\n        bound_setattr(\n            \"metadata\",\n            (\n                types.MappingProxyType(dict(metadata))  # Shallow copy\n                if metadata\n                else _EMPTY_METADATA_SINGLETON\n            ),\n        )\n        bound_setattr(\"type\", type)\n        bound_setattr(\"kw_only\", kw_only)\n        bound_setattr(\"inherited\", inherited)\n        bound_setattr(\"on_setattr\", on_setattr)\n        bound_setattr(\"alias\", alias)\n        bound_setattr(\n            \"alias_is_default\",\n            alias is None if alias_is_default is None else alias_is_default,\n        )\n\n    def __setattr__(self, name, value):\n        raise FrozenInstanceError\n\n    @classmethod\n    def from_counting_attr(\n        cls, name: str, ca: _CountingAttr, kw_only: bool, type=None\n    ):\n        # The 'kw_only' argument is the class-level setting, and is used if the\n        # attribute itself does not explicitly set 'kw_only'.\n        # type holds the annotated value. deal with conflicts:\n        if type is None:\n            type = ca.type\n        elif ca.type is not None:\n            msg = f\"Type annotation and type argument cannot both be present for '{name}'.\"\n            raise ValueError(msg)\n        return cls(\n            name,\n            ca._default,\n            ca._validator,\n            ca.repr,\n            None,\n            ca.hash,\n            ca.init,\n            False,\n            ca.metadata,\n            type,\n            ca._converter,\n            kw_only if ca.kw_only is None else ca.kw_only,\n            ca.eq,\n            ca.eq_key,\n            ca.order,\n            ca.order_key,\n            ca.on_setattr,\n            ca.alias,\n            ca.alias is None,\n        )\n\n    # Don't use attrs.evolve since fields(Attribute) doesn't work\n    def evolve(self, **changes):\n        \"\"\"\n        Copy *self* and apply *changes*.\n\n        This works similarly to `attrs.evolve` but that function does not work\n        with :class:`attrs.Attribute`.\n\n        It is mainly meant to be used for `transform-fields`.\n\n        .. versionadded:: 20.3.0\n        \"\"\"\n        import copy\n\n        new = copy.copy(self)\n\n        new._setattrs(changes.items())\n\n        if \"alias\" in changes and \"alias_is_default\" not in changes:\n            # Explicit alias provided -- no longer the default.\n            _OBJ_SETATTR.__get__(new)(\"alias_is_default\", False)\n        elif (\n            \"name\" in changes\n            and \"alias\" not in changes\n            # Don't auto-generate alias if the user picked picked the old one.\n            and self.alias_is_default\n        ):\n            # Name changed, alias was auto-generated -- update it.\n            _OBJ_SETATTR.__get__(new)(\n                \"alias\", _default_init_alias_for(new.name)\n            )\n\n        return new\n\n    # Don't use _add_pickle since fields(Attribute) doesn't work\n    def __getstate__(self):\n        \"\"\"\n        Play nice with pickle.\n        \"\"\"\n        return tuple(\n            getattr(self, name) if name != \"metadata\" else dict(self.metadata)\n            for name in self.__slots__\n        )\n\n    def __setstate__(self, state):\n        \"\"\"\n        Play nice with pickle.\n        \"\"\"\n        if len(state) < len(self.__slots__):\n            # Pre-26.1.0 pickle without alias_is_default -- infer it\n            # heuristically.\n            state_dict = dict(zip(self.__slots__, state, strict=False))\n            alias_is_default = state_dict.get(\n                \"alias\"\n            ) is None or state_dict.get(\"alias\") == _default_init_alias_for(\n                state_dict[\"name\"]\n            )\n            state = (*state, alias_is_default)\n\n        self._setattrs(zip(self.__slots__, state, strict=True))\n\n    def _setattrs(self, name_values_pairs):\n        bound_setattr = _OBJ_SETATTR.__get__(self)\n        for name, value in name_values_pairs:\n            if name != \"metadata\":\n                bound_setattr(name, value)\n            else:\n                bound_setattr(\n                    name,\n                    (\n                        types.MappingProxyType(dict(value))\n                        if value\n                        else _EMPTY_METADATA_SINGLETON\n                    ),\n                )\n\n\n_a = [\n    Attribute(\n        name=name,\n        default=NOTHING,\n        validator=None,\n        repr=(name != \"alias_is_default\"),\n        cmp=None,\n        eq=True,\n        order=False,\n        hash=(name != \"metadata\"),\n        init=True,\n        inherited=False,\n        alias=_default_init_alias_for(name),\n    )\n    for name in Attribute.__slots__\n]\n\nAttribute = _add_hash(\n    _add_eq(\n        _add_repr(Attribute, attrs=_a),\n        attrs=[a for a in _a if a.name != \"inherited\"],\n    ),\n    attrs=[a for a in _a if a.hash and a.name != \"inherited\"],\n)\n\n\nclass _CountingAttr:\n    \"\"\"\n    Intermediate representation of attributes that uses a counter to preserve\n    the order in which the attributes have been defined.\n\n    *Internal* data structure of the attrs library.  Running into is most\n    likely the result of a bug like a forgotten `@attr.s` decorator.\n    \"\"\"\n\n    __slots__ = (\n        \"_converter\",\n        \"_default\",\n        \"_validator\",\n        \"alias\",\n        \"counter\",\n        \"eq\",\n        \"eq_key\",\n        \"hash\",\n        \"init\",\n        \"kw_only\",\n        \"metadata\",\n        \"on_setattr\",\n        \"order\",\n        \"order_key\",\n        \"repr\",\n        \"type\",\n    )\n    __attrs_attrs__ = (\n        *tuple(\n            Attribute(\n                name=name,\n                alias=_default_init_alias_for(name),\n                default=NOTHING,\n                validator=None,\n                repr=True,\n                cmp=None,\n                hash=True,\n                init=True,\n                kw_only=False,\n                eq=True,\n                eq_key=None,\n                order=False,\n                order_key=None,\n                inherited=False,\n                on_setattr=None,\n            )\n            for name in (\n                \"counter\",\n                \"_default\",\n                \"repr\",\n                \"eq\",\n                \"order\",\n                \"hash\",\n                \"init\",\n                \"on_setattr\",\n                \"alias\",\n            )\n        ),\n        Attribute(\n            name=\"metadata\",\n            alias=\"metadata\",\n            default=None,\n            validator=None,\n            repr=True,\n            cmp=None,\n            hash=False,\n            init=True,\n            kw_only=False,\n            eq=True,\n            eq_key=None,\n            order=False,\n            order_key=None,\n            inherited=False,\n            on_setattr=None,\n        ),\n    )\n    cls_counter = 0\n\n    def __init__(\n        self,\n        default,\n        validator,\n        repr,\n        cmp,\n        hash,\n        init,\n        converter,\n        metadata,\n        type,\n        kw_only,\n        eq,\n        eq_key,\n        order,\n        order_key,\n        on_setattr,\n        alias,\n    ):\n        _CountingAttr.cls_counter += 1\n        self.counter = _CountingAttr.cls_counter\n        self._default = default\n        self._validator = validator\n        self._converter = converter\n        self.repr = repr\n        self.eq = eq\n        self.eq_key = eq_key\n        self.order = order\n        self.order_key = order_key\n        self.hash = hash\n        self.init = init\n        self.metadata = metadata\n        self.type = type\n        self.kw_only = kw_only\n        self.on_setattr = on_setattr\n        self.alias = alias\n\n    def validator(self, meth):\n        \"\"\"\n        Decorator that adds *meth* to the list of validators.\n\n        Returns *meth* unchanged.\n\n        .. versionadded:: 17.1.0\n        \"\"\"\n        if self._validator is None:\n            self._validator = meth\n        else:\n            self._validator = and_(self._validator, meth)\n        return meth\n\n    def default(self, meth):\n        \"\"\"\n        Decorator that allows to set the default for an attribute.\n\n        Returns *meth* unchanged.\n\n        Raises:\n            DefaultAlreadySetError: If default has been set before.\n\n        .. versionadded:: 17.1.0\n        \"\"\"\n        if self._default is not NOTHING:\n            raise DefaultAlreadySetError\n\n        self._default = Factory(meth, takes_self=True)\n\n        return meth\n\n    def converter(self, meth):\n        \"\"\"\n        Decorator that appends *meth* to the list of converters.\n\n        Returns *meth* unchanged.\n\n        .. versionadded:: 26.2.0\n        \"\"\"\n        decorated_converter = Converter(\n            lambda value, _self, field: meth(_self, field, value),\n            takes_self=True,\n            takes_field=True,\n        )\n        if self._converter is None:\n            self._converter = decorated_converter\n        else:\n            self._converter = pipe(self._converter, decorated_converter)\n\n        return meth\n\n\n_CountingAttr = _add_eq(_add_repr(_CountingAttr))\n\n\nclass ClassProps:\n    \"\"\"\n    Effective class properties as derived from parameters to `attr.s()` or\n    `define()` decorators.\n\n    This is the same data structure that *attrs* uses internally to decide how\n    to construct the final class.\n\n    Warning:\n\n        This feature is currently **experimental** and is not covered by our\n        strict backwards-compatibility guarantees.\n\n\n    Attributes:\n        is_exception (bool):\n            Whether the class is treated as an exception class.\n\n        is_slotted (bool):\n            Whether the class is `slotted <slotted classes>`.\n\n        has_weakref_slot (bool):\n            Whether the class has a slot for weak references.\n\n        is_frozen (bool):\n            Whether the class is frozen.\n\n        kw_only (KeywordOnly):\n            Whether / how the class enforces keyword-only arguments on the\n            ``__init__`` method.\n\n        collected_fields_by_mro (bool):\n            Whether the class fields were collected by method resolution order.\n            That is, correctly but unlike `dataclasses`.\n\n        added_init (bool):\n            Whether the class has an *attrs*-generated ``__init__`` method.\n\n        added_repr (bool):\n            Whether the class has an *attrs*-generated ``__repr__`` method.\n\n        added_eq (bool):\n            Whether the class has *attrs*-generated equality methods.\n\n        added_ordering (bool):\n            Whether the class has *attrs*-generated ordering methods.\n\n        hashability (Hashability): How `hashable <hashing>` the class is.\n\n        added_match_args (bool):\n            Whether the class supports positional `match <match>` over its\n            fields.\n\n        added_str (bool):\n            Whether the class has an *attrs*-generated ``__str__`` method.\n\n        added_pickling (bool):\n            Whether the class has *attrs*-generated ``__getstate__`` and\n            ``__setstate__`` methods for `pickle`.\n\n        on_setattr_hook (Callable[[Any, Attribute[Any], Any], Any] | None):\n            The class's ``__setattr__`` hook.\n\n        field_transformer (Callable[[Attribute[Any]], Attribute[Any]] | None):\n            The class's `field transformers <transform-fields>`.\n\n    .. versionadded:: 25.4.0\n    \"\"\"\n\n    class Hashability(enum.Enum):\n        \"\"\"\n        The hashability of a class.\n\n        .. versionadded:: 25.4.0\n        \"\"\"\n\n        HASHABLE = \"hashable\"\n        \"\"\"Write a ``__hash__``.\"\"\"\n        HASHABLE_CACHED = \"hashable_cache\"\n        \"\"\"Write a ``__hash__`` and cache the hash.\"\"\"\n        UNHASHABLE = \"unhashable\"\n        \"\"\"Set ``__hash__`` to ``None``.\"\"\"\n        LEAVE_ALONE = \"leave_alone\"\n        \"\"\"Don't touch ``__hash__``.\"\"\"\n\n    class KeywordOnly(enum.Enum):\n        \"\"\"\n        How attributes should be treated regarding keyword-only parameters.\n\n        .. versionadded:: 25.4.0\n        \"\"\"\n\n        NO = \"no\"\n        \"\"\"Attributes are not keyword-only.\"\"\"\n        YES = \"yes\"\n        \"\"\"Attributes in current class without kw_only=False are keyword-only.\"\"\"\n        FORCE = \"force\"\n        \"\"\"All attributes are keyword-only.\"\"\"\n\n    __slots__ = (  # noqa: RUF023 -- order matters for __init__\n        \"is_exception\",\n        \"is_slotted\",\n        \"has_weakref_slot\",\n        \"is_frozen\",\n        \"kw_only\",\n        \"collected_fields_by_mro\",\n        \"added_init\",\n        \"added_repr\",\n        \"added_eq\",\n        \"added_ordering\",\n        \"hashability\",\n        \"added_match_args\",\n        \"added_str\",\n        \"added_pickling\",\n        \"on_setattr_hook\",\n        \"field_transformer\",\n    )\n\n    def __init__(\n        self,\n        is_exception,\n        is_slotted,\n        has_weakref_slot,\n        is_frozen,\n        kw_only,\n        collected_fields_by_mro,\n        added_init,\n        added_repr,\n        added_eq,\n        added_ordering,\n        hashability,\n        added_match_args,\n        added_str,\n        added_pickling,\n        on_setattr_hook,\n        field_transformer,\n    ):\n        self.is_exception = is_exception\n        self.is_slotted = is_slotted\n        self.has_weakref_slot = has_weakref_slot\n        self.is_frozen = is_frozen\n        self.kw_only = kw_only\n        self.collected_fields_by_mro = collected_fields_by_mro\n        self.added_init = added_init\n        self.added_repr = added_repr\n        self.added_eq = added_eq\n        self.added_ordering = added_ordering\n        self.hashability = hashability\n        self.added_match_args = added_match_args\n        self.added_str = added_str\n        self.added_pickling = added_pickling\n        self.on_setattr_hook = on_setattr_hook\n        self.field_transformer = field_transformer\n\n    @property\n    def is_hashable(self):\n        return (\n            self.hashability is ClassProps.Hashability.HASHABLE\n            or self.hashability is ClassProps.Hashability.HASHABLE_CACHED\n        )\n\n\n_cas = [\n    Attribute(\n        name=name,\n        default=NOTHING,\n        validator=None,\n        repr=True,\n        cmp=None,\n        eq=True,\n        order=False,\n        hash=True,\n        init=True,\n        inherited=False,\n        alias=_default_init_alias_for(name),\n    )\n    for name in ClassProps.__slots__\n]\n\nClassProps = _add_eq(_add_repr(ClassProps, attrs=_cas), attrs=_cas)\n\n\nclass Factory:\n    \"\"\"\n    Stores a factory callable.\n\n    If passed as the default value to `attrs.field`, the factory is used to\n    generate a new value.\n\n    Args:\n        factory (typing.Callable):\n            A callable that takes either none or exactly one mandatory\n            positional argument depending on *takes_self*.\n\n        takes_self (bool):\n            Pass the partially initialized instance that is being initialized\n            as a positional argument.\n\n    .. versionadded:: 17.1.0  *takes_self*\n    \"\"\"\n\n    __slots__ = (\"factory\", \"takes_self\")\n\n    def __init__(self, factory, takes_self=False):\n        self.factory = factory\n        self.takes_self = takes_self\n\n    def __getstate__(self):\n        \"\"\"\n        Play nice with pickle.\n        \"\"\"\n        return tuple(getattr(self, name) for name in self.__slots__)\n\n    def __setstate__(self, state):\n        \"\"\"\n        Play nice with pickle.\n        \"\"\"\n        for name, value in zip(self.__slots__, state, strict=True):\n            setattr(self, name, value)\n\n\n_f = [\n    Attribute(\n        name=name,\n        default=NOTHING,\n        validator=None,\n        repr=True,\n        cmp=None,\n        eq=True,\n        order=False,\n        hash=True,\n        init=True,\n        inherited=False,\n    )\n    for name in Factory.__slots__\n]\n\nFactory = _add_hash(_add_eq(_add_repr(Factory, attrs=_f), attrs=_f), attrs=_f)\n\n\nclass Converter:\n    \"\"\"\n    Stores a converter callable.\n\n    Allows for the wrapped converter to take additional arguments. The\n    arguments are passed in the order they are documented.\n\n    Args:\n        converter (Callable): A callable that converts the passed value.\n\n        takes_self (bool    `self.takes_self` and `self.takes_field`.\n        \"\"\"\n        if not (self.takes_self or self.takes_field):\n            return f\"{self._get_global_name(attr_name)}({value_var})\"\n\n        if self.takes_self and self.takes_field:\n            return f\"{self._get_global_name(attr_name)}({value_var}, self, attr_dict['{attr_name}'])\"\n\n        if self.takes_self:\n            return f\"{self._get_global_name(attr_name)}({value_var}, self)\"\n\n        return f\"{self._get_global_name(attr_name)}({value_var}, attr_dict['{attr_name}'])\"\n\n    def __getstate__(self):\n        \"\"\"\n        Return a dict containing only converter and takes_self -- the rest gets\n        computed when loading.\n        \"\"\"\n        return {\n            \"converter\": self.converter,\n            \"takes_self\": self.takes_self,\n            \"takes_field\": self.takes_field,\n        }\n\n    def __setstate__(self, state):\n        \"\"\"\n        Load instance from state.\n        \"\"\"\n        self.__init__(**state)\n\n\n_f = [\n    Attribute(\n        name=name,\n        default=NOTHING,\n        validator=None,\n        repr=True,\n        cmp=None,\n        eq=True,\n        order=False,\n        hash=True,\n        init=True,\n        inherited=False,\n    )\n    for name in (\"converter\", \"takes_self\", \"takes_field\")\n]\n\nConverter = _add_hash(\n    _add_eq(_add_repr(Converter, attrs=_f), attrs=_f), attrs=_f\n)\n\n\ndef make_class(\n    name, attrs, bases=(object,), class_body=None, **attributes_arguments\n):\n    r\"\"\"\n    A quick way to create a new class called *name* with *attrs*.\n\n    .. note::\n\n        ``make_class()`` is a thin wrapper around `attr.s`, not `attrs.define`\n        which means that it doesn't come with some of the improved defaults.\n\n        For example, if you want the same ``on_setattr`` behavior as in\n        `attrs.define`, you have to pass the hooks yourself: ``make_class(...,\n        on_setattr=setters.pipe(setters. py": "# SPDX-License-Identifier: MIT\n\n\"\"\"\nThese are keyword-only APIs that call `attr.s` and `attr.ib` with different\ndefault values.\n\"\"\"\n\nfrom functools import partial\n\nfrom . import setters\nfrom ._funcs import asdict as _asdict\nfrom ._funcs import astuple as _astuple\nfrom ._make import (\n    _DEFAULT_ON_SETATTR,\n    NOTHING,\n    _frozen_setattrs,\n    attrib,\n    attrs,\n)\nfrom .exceptions import NotAnAttrsClassError, UnannotatedAttributeError\n\n\ndef define(\n    maybe_cls=None,\n    *,\n    these=None,\n    repr=None,\n    unsafe_hash=None,\n    hash=None,\n    init=None,\n    slots=True,\n    frozen=False,\n    weakref_slot=True,\n    str=False,\n    auto_attribs=None,\n    kw_only=False,\n    cache_hash=False,\n    auto_exc=True,\n    eq=None,\n    order=False,\n    auto_detect=True,\n    getstate_setstate=None,\n    on_setattr=None,\n    field_transformer=None,\n    match_args=True,\n    force_kw_only=False,\n):\n    r\"\"\"\n    A class decorator that adds :term:`dunder methods` according to\n    :term:`fields <field>` specified using :doc:`type annotations <types>`,\n    `field()` calls, or the *these* argument.\n\n    Since *attrs* patches or replaces an existing class, you cannot use\n    `object.__init_subclass__` with *attrs* classes, because it runs too early.\n    As a replacement, you can define ``__attrs_init_subclass__`` on your class.\n    It will be called by *attrs* classes that subclass it after they're\n    created. See also :ref:`init-subclass`.\n\n    Args:\n        slots (bool):\n            Create a :term:`slotted class <slotted classes>` that's more\n            memory-efficient. Slotted classes are generally superior to the\n            default dict classes, but have some gotchas you should know about,\n            so we encourage you to read the :term:`glossary entry <slotted\n            classes>`.\n\n        auto_detect (bool):\n            Instead of setting the *init*, *repr*, *eq*, and *hash* arguments\n            explicitly, assume they are set to True **unless any** of the\n            involved methods for one of the arguments is implemented in the\n            *current* class (meaning, it is *not* inherited from some base\n            class).\n\n            So, for example by implementing ``__eq__`` on a class yourself,\n            *attrs* will deduce ``eq=False`` and will create *neither*\n            ``__eq__`` *nor* ``__ne__`` (but Python classes come with a\n            sensible ``__ne__`` by default, so it *should* be enough to only\n            implement ``__eq__`` in most cases).\n\n            Passing :data:`True` or :data:`False` to *init*, *repr*, *eq*, or *hash*\n            overrides whatever *auto_detect* would determine.\n\n        auto_exc (bool):\n            If the class subclasses `BaseException` (which implicitly includes\n            any subclass of any exception), the following happens to behave\n            like a well-behaved Python exception class:\n\n            - the values for *eq*, *order*, and *hash* are ignored and the\n              instances compare and hash by the instance's ids [#]_ ,\n            - all attributes that are either passed into ``__init__`` or have a\n              default value are additionally available as a tuple in the\n              ``args`` attribute,\n            - the value of *str* is ignored leaving ``__str__`` to base\n              classes.\n\n            .. [#]\n               Note that *attrs* will *not* remove existing implementations of\n               ``__hash__`` or the equality methods. It just won't add own\n               ones.\n\n        on_setattr (~typing.Callable | list[~typing.Callable] | None | ~typing.Literal[attrs.setters.NO_OP]):\n            A callable that is run whenever the user attempts to set an\n            attribute (either by assignment like ``i.x = 42`` or by using\n            `setattr` like ``setattr(i, \"x\", 42)``). It receives the same\n            arguments as validators: the types of both classes are\n            *identical*.\n\n            If `None` mirror value of *eq*.\n\n            .. seealso:: `comparison`\n\n        unsafe_hash (bool | None):\n            If None (default), the ``__hash__`` method is generated according\n            how *eq* and *frozen* are set.\n\n            1. If *both* are True, *attrs* will generate a ``__hash__`` for\n               you.\n            2. If *eq* is True and *frozen* is False, ``__hash__`` will be set\n               to None, marking it unhashable (which it is).\n            3. If *eq* is False, ``__hash__`` will be left untouched meaning\n               the ``__hash__`` method of the base class will be used. If the\n               base class is `object`, this means it will fall back to id-based\n               hashing.\n\n            Although not recommended, you can decide for yourself and force\n            *attrs* to create one (for example, if the class is immutable even\n            though you didn't freeze it programmatically) by passing True or\n            not.  Both of these cases are rather special and should be used\n            carefully.\n\n            .. seealso::\n\n                - Our documentation on `hashing`,\n                - Python's documentation on `object.__hash__`,\n                - and the `GitHub issue that led to the default \\ behavior\n                  <https://github.com/python-attrs/attrs/issues/136>`_ for more\n                  details.\n\n        hash (bool | None):\n            Deprecated alias for *unsafe_hash*. *unsafe_hash* takes precedence.\n\n        cache_hash (bool):\n            Ensure that the object's hash code is computed only once and stored\n            on the object.  If this is set to True, hashing must be either\n            explicitly or implicitly enabled for this class.  If the hash code\n            is cached, avoid any reassignments of fields involved in hash code\n            computation or mutations of the objects those fields point to after\n            object creation.  If such changes occur, the behavior of the\n            object's hash code is undefined.\n\n        frozen (bool):\n            Make instances immutable after initialization.  If someone attempts\n            to modify a frozen instance, `attrs.exceptions.FrozenInstanceError`\n            is raised.\n\n            .. note::\n\n                1. This is achieved by installing a custom ``__setattr__``\n                   method on your class, so you can't implement your own.\n\n                2. True immutability is impossible in Python.\n\n                3. This *does* have a minor a runtime performance `impact\n                   <how-frozen>` when initializing new instances.  In other\n                   words: ``__init__`` is slightly slower with ``frozen=True``.\n\n                4. If a class is frozen, you cannot modify ``self`` in\n                   ``__attrs_post_init__`` or a self-written ``__init__``. You\n                   can circumvent that limitation by using\n                   ``object.__setattr__(self, \"attribute_name\", value)``.\n\n                5. Subclasses of a frozen class are frozen too.\n\n        kw_only (bool):\n            Make attributes keyword-only in the generated ``__init__`` (if\n            *init* is False, this parameter is ignored).  Attributes that\n            explicitly set ``kw_only=False`` are not affected; base class\n            attributes are also not affected.\n\n            Also see *force_kw_only*.\n\n        weakref_slot (bool):\n            Make instances weak-referenceable.  This has no effect unless\n            *slots* is True.\n\n        field_transformer (~typing.Callable | None):\n            A function that is called with the original class object and all\n            fields right before *attrs* finalizes the class.  You can use this,\n            for example, to automatically add converters or validators to\n            fields based on their types.\n\n            .. seealso:: `transform-fields`\n\n        match_args (bool):\n            If True (default), set ``__match_args__`` on the class to support\n            :pep:`634` (*Structural Pattern Matching*). It is a tuple of all\n            non-keyword-only ``__init__`` parameter names.\n\n        force_kw_only (bool):\n            A back-compat flag for restoring pre-25.4.0 behavior.  If True and\n            ``kw_only=True``, all attributes are made keyword-only, including\n            base class attributes, and those set to ``kw_only=False`` at the\n            attribute level.  Defaults to False.\n\n            See also `issue #980\n            <https://github.com/python-attrs/attrs/issues/980>`_.\n\n        getstate_setstate (bool | None):\n            .. note::\n\n                This is usually only interesting for slotted classes and you\n                should probably just set *auto_detect* to True.\n\n            If True, ``__getstate__`` and ``__setstate__`` are generated and\n            attached to the class. This is necessary for slotted classes to be\n            pickleable. If left None, it's True by default for slotted classes\n            and False for dict classes.\n\n            If *auto_detect* is True, and *getstate_setstate* is left None, and\n            **either** ``__getstate__`` or ``__setstate__`` is detected\n            directly on the class (meaning: not inherited), it is set to False\n            (this is usually what you want).\n\n        auto_attribs (bool | None):\n            If True, look at type annotations to determine which attributes to\n            use, like `dataclasses`. If False, it will only look for explicit\n            :func:`field` class attributes, like classic *attrs*.\n\n            If left None, it will guess:\n\n            1. If any attributes are annotated and no unannotated\n               `attrs.field`\\ s are found, it assumes *auto_attribs=True*.\n            2. Otherwise it assumes *auto_attribs=False* and tries to collect\n               `attrs.field`\\ s.\n\n            If *attrs* decides to look at type annotations, **all** fields\n            **must** be annotated. If *attrs* encounters a field that is set to\n            a :func:`field` / `attr.ib` but lacks a type annotation, an\n            `attrs.exceptions.UnannotatedAttributeError` is raised.  Use\n            ``field_name: typing.Any = field(...)`` if you don't want to set a\n            type.\n\n            .. warning::\n\n                For features that use the attribute name to create decorators\n                (for example, :ref:`validators <validators>`), you still *must*\n                assign :func:`field` / `attr.ib` to them. Otherwise Python will\n                either not find the name or try to use the default value to\n                call, for example, ``validator`` on it.\n\n            Attributes annotated as `typing.ClassVar`, and attributes that are\n            neither annotated nor set to an `field()` are **ignored**.\n\n        these (dict[str, object]):\n            A dictionary of name to the (private) return value of `field()`\n            mappings. This is useful to avoid the definition of your attributes\n            within the class body because you can't (for example, if you want\n            to add ``__repr__`` methods to Django models) or don't want to.\n\n            If *these* is not `None`, *attrs* will *not* search the class body\n            for attributes and will *not* remove any attributes from it.\n\n            The order is deduced from the order of the attributes inside\n            *these*.\n\n            Arguably, this is a rather obscure feature.\n\n    .. versionadded:: 20.1.0\n    .. versionchanged:: 21.3.0 Converters are also run ``on_setattr``.\n    .. versionadded:: 22.2.0\n       *unsafe_hash* as an alias for *hash* (for :pep:`681` compliance).\n    .. versionchanged:: 24.1.0\n       Instances are not compared as tuples of attributes anymore, but u <script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const short = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const permalink = (path, a, b) => `${D.repo.url}/blob/${D.repo.commit}/${path}#L${a}` + (b && b !== a ? `-L${b}` : "");

$("meta").textContent = `${D.repo.name} @ ${D.repo.commit.slice(0, 7)} · written for the ${D.reader}`;
$("title").textContent = D.title;
$("premise").innerHTML = marked.parseInline(D.premise);

// ---- flowchart: laid out top to bottom on one spine; roads not taken exit to the right
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
function wrap(text, width) {  // monospace, so characters are a fair measure
  const out = []; let line = "";
  for (let word of String(text).split(/(?<=[ .,(])/)) {
    if ((line + word).length > width && line) { out.push(line.trimEnd()); line = ""; }
    while (word.length > width && !line) { out.push(word.slice(0, width)); word = word.slice(width); }
    line += word;
  }
  if (line) out.push(line.trimEnd());
  return out;
}
const svg = $("chart");
const CX = 112, BOX = 210, SIDE_X = 240, SIDE_W = 136, GAP = 26;
const bandOf = {}; let y = 10, prevBottom = null, prevChapter = undefined;
const defs = el("defs", {}, svg);
for (const [id, cls] of [["arrow", ""], ["dash", ""]]) {
  const m = el("marker", { id, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L8,4 L0,8 z" }, m);
}
const bandsLayer = el("g", {}, svg), wires = el("g", {}, svg), nodes = el("g", {}, svg);
const chapterTitle = Object.fromEntries(D.chapters.map((c) => [c.n, c]));
function textLines(g, lines, x, y0, anchor, cls) {
  lines.forEach((t, i) => { const e = el("text", { x, y: y0 + i * 13, "text-anchor": anchor }, g); if (cls) e.setAttribute("class", cls); e.textContent = t; });
}
function connect(fromY, toY, label) {
  el("line", { x1: CX, y1: fromY, x2: CX, y2: toY - 1, class: "wire", "marker-end": "url(#arrow)" }, wires);
  if (label) { const t = el("text", { x: CX + 6, y: fromY + 14, class: "ans" }, wires); t.textContent = label; }
}
let pendingLabel = null;
for (const it of D.flow) {
  if (it.chapter !== prevChapter && it.chapter != null) {  // a chapter starts: open its band
    y += prevBottom == null ? 0 : 8;
    bandOf[it.chapter] = { top: y, bottom: y };
    y += 20;
  }
  if (it.chapter != null) prevChapter = it.chapter;
  const top = y + (prevBottom == null ? 0 : GAP);
  const g = el("g", { class: "node", tabindex: 0 }, nodes);
  let h;
  if (it.kind === "start" || it.kind === "end") {
    const lines = wrap(it.label, 30); h = 14 + lines.length * 13;
    g.classList.add("term");
    el("rect", { x: CX - BOX / 2, y: top, width: BOX, height: h, rx: h / 2, class: "shape" }, g);
    textLines(g, lines, CX, top + 17, "middle");
  } else if (it.kind === "data") {
    const lines = wrap(it.label, 28).slice(0, 3); h = 14 + lines.length * 13;
    g.classList.add("data");
    const k = 10;
    el("path", { d: `M${CX - BOX / 2 + k},${top} H${CX + BOX / 2} L${CX + BOX / 2 - k},${top + h} H${CX - BOX / 2} Z`, class: "shape" }, g);
    textLines(g, lines, CX, top + 17, "middle");
    g.onclick = () => {};
  } else if (it.kind === "step") {
    const name = it.fn.length > 28 && it.fn.includes(".") ? [it.fn.slice(0, it.fn.lastIndexOf(".")), it.fn.slice(it.fn.lastIndexOf("."))] : wrap(it.fn, 28);
    const val = it.returned && it.returned !== "None" ? ["→ " + (it.returned.length > 26 ? it.returned.slice(0, 25) + "…" : it.returned)] : [];
    h = 12 + (name.length + val.length) * 13;
    el("rect", { x: CX - BOX / 2, y: top, width: BOX, height: h, rx: 3, class: "shape" }, g);
    textLines(g, name, CX, top + 16, "middle");
    textLines(g, val, CX, top + 16 + name.length * 13, "middle", "val");
    const title = el("title", {}, g); title.textContent = `${it.fn}  (${it.file}:${it.line})` + (it.returned ? `\nreturns ${it.returned}` : "");
    g.onclick = () => { showCode(it.file, it.line, it.end); if (it.chapter) $("ch-" + it.chapter).scrollIntoView(); };
  } else {  // decision
    let lines = wrap(it.question, 16);
    if (lines.length > 3) lines = [...lines.slice(0, 2), lines[2].slice(0, 15) + "…"];
    h = 34 + lines.length * 13;
    const hw = 100;
    el("path", { d: `M${CX},${top} L${CX + hw},${top + h / 2} L${CX},${top + h} L${CX - hw},${top + h / 2} Z`, class: "shape" }, g);
    textLines(g, lines, CX, top + h / 2 - (lines.length - 1) * 6 + 4, "middle");
    // the road not taken
    const ex = el("g", { class: "exit" }, g);
    const exitLines = wrap(it.exit, 20).slice(0, 3);
    const eh = 10 + exitLines.length * 13, ey = top + h / 2 - eh / 2;
    el("path", { d: `M${CX + hw},${top + h / 2} H${SIDE_X - 1}`, class: "road", "marker-end": "url(#dash)" }, ex);
    const sa = el("text", { x: CX + hw + 5, y: top + h / 2 - 5, class: "ans side" }, ex); sa.textContent = it.side;
    el("rect", { x: SIDE_X, y: ey, width: SIDE_W, height: eh, rx: 3 }, ex);
    textLines(ex, exitLines, SIDE_X + 6, ey + 15, "start");
    sa.setAttribute("x", CX + hw + 3);
    const title = el("title", {}, g); title.textContent = `${it.question}\ntaken: ${it.answer}\notherwise (${it.side}): ${it.exit}\n${it.file}:${it.line}`;
    g.onclick = () => { showCode(it.file, it.line, it.end); if (it.chapter) $("ch-" + it.chapter).scrollIntoView(); };
  }
  if (prevBottom != null) connect(prevBottom, top, pendingLabel);
  pendingLabel = it.kind === "decision" ? it.answer : null;
  if (pendingLabel && pendingLabel.length > 18) pendingLabel = pendingLabel.slice(0, 17) + "…";
  prevBottom = top + h; y = prevBottom;
  if (it.chapter != null && bandOf[it.chapter]) bandOf[it.chapter].bottom = y;
}
y += 12;
for (const [n, b] of Object.entries(bandOf)) {
  const ch = chapterTitle[n];
  const g = el("g", { class: "band" + (ch && ch.md ? "" : " unwritten"), id: "band-" + n }, bandsLayer);
  el("rect", { x: 0, y: b.top, width: 380, height: b.bottom - b.top + 8, rx: 6 }, g);
  const t = el("text", { x: 6, y: b.top + 14 }, g);
  t.textContent = `${n} · ${ch ? (ch.title.length > 48 ? ch.title.slice(0, 47) + "…" : ch.title) : ""}`;
  g.style.cursor = "pointer";
  g.onclick = () => $("ch-" + n).scrollIntoView();
}
svg.setAttribute("viewBox", `0 0 380 ${y}`);
svg.setAttribute("height", y);

// ---- story
const story = $("story");
const cite = new RegExp(D.repo.url.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "/blob/[0-9a-f]+/([^#]+)#L(\\d+)(?:-L(\\d+))?");
for (const ch of D.chapters) {
  const sec = document.createElement("section");
  sec.className = "chapter"; sec.id = "ch-" + ch.n; sec.dataset.n = ch.n;
  const prose = document.createElement("div"); prose.className = "prose";
  if (ch.md) {
    prose.innerHTML = marked.parse(ch.md);
    for (const q of prose.querySelectorAll("blockquote")) {  // "**For the owner:** …" callouts
      const lead = q.querySelector("p > strong:first-child");
      if (lead && /^for the /i.test(lead.textContent)) q.classList.add("aside");
    }
    for (const a of prose.querySelectorAll("a[href]")) {
      const m = a.getAttribute("href").match(cite);
      if (!m) { a.target = "_blank"; a.rel = "noopener"; continue; }
      a.className = "cite";
      a.dataset.path = m[1]; a.dataset.a = m[2]; a.dataset.b = m[3] || m[2];
      a.onclick = (e) => { e.preventDefault(); pick(a, true); };
    }
  } else {
    prose.innerHTML = `<h1></h1><div class="pending">This chapter is planned but not written yet.<div class="io"></div></div>`;
    prose.querySelector("h1").textContent = `Chapter ${ch.n} · ${ch.title}`;
    prose.querySelector(".io").textContent = `enters as ${ch.data_in}\nleaves as ${ch.data_out}`;
  }
  sec.append(prose);
  story.append(sec);
}

// ---- code panel
const panel = $("code");
let pinned = null;
function showCode(path, a, b) {
  a = +a; b = +b;
  const src = D.files[path];
  $("where").textContent = `${path}:${a}${b !== a ? "-" + b : ""}`;
  $("gh").href = permalink(path, a, b);
  const body = $("codebody");
  body.textContent = "";
  if (src === undefined) { body.innerHTML = '<div class="code-empty">This file is not part of the repository snapshot.</div>'; return; }
  const frag = document.createDocumentFragment();
  src.split("\n").forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "ln" + (i + 1 >= a && i + 1 <= b ? " hl" : "");
    const n = document.createElement("span"); n.textContent = i + 1;
    const t = document.createElement("span"); t.textContent = text || " ";
    row.append(n, t); frag.append(row);
  });
  body.append(frag);
  const first = body.children[Math.max(0, a - 1)];
  if (first) body.scrollTop += first.getBoundingClientRect().top - body.getBoundingClientRect().top - body.clientHeight * 0.3;
  panel.classList.add("open");
}
function pick(a, byClick) {
  document.querySelectorAll("a.cite.on").forEach((x) => x.classList.remove("on"));
  a.classList.add("on");
  if (byClick) pinned = a.closest("p, li, td, blockquote");
  showCode(a.dataset.path, a.dataset.a, a.dataset.b);
}
$("close").onclick = () => panel.classList.remove("open");

// ---- follow the reader: current chapter on the map, current paragraph's code on the right
const wide = () => window.matchMedia("(min-width: 1361px)").matches;
let current = null, activePara = null;
function follow() {
  const mid = window.innerHeight * 0.4;
  let sec = null;
  for (const s of document.querySelectorAll(".chapter")) { const r = s.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid) sec = s; }
  if (sec && sec.dataset.n !== current) {
    current = sec.dataset.n;
    document.querySelectorAll(".band.active").forEach((b) => b.classList.remove("active"));
    const band = $("band-" + current);
    if (band) {
      band.classList.add("active");
      const map = document.querySelector(".map");
      if (window.matchMedia("(min-width: 761px)").matches) {
        const r = band.getBoundingClientRect(), m = map.getBoundingClientRect();
        if (r.top < m.top || r.top > m.bottom - 80) map.scrollTop += r.top - m.top - 40;
      }
    }
  }
  if (!wide()) return;  // on narrow screens the code opens only when asked
  let para = null;
  for (const p of document.querySelectorAll(".chapter p")) {
    if (!p.querySelector("a.cite")) continue;
    const r = p.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid - 40) { para = p; break; }
  }
  if (para && para !== activePara) {
    if (activePara) activePara.classList.remove("active");
    activePara = para; para.classList.add("active");
    if (pinned !== para) { pinned = null; pick(para.querySelector("a.cite"), false); }
  }
}
let ticking = false;
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; follow(); }); } }, { passive: true });
addEventListener("resize", follow);
follow();
if (wide()) { const first = document.querySelector("a.cite"); if (first && !activePara) pick(first, false); }
</script>
