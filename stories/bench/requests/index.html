sed, headers parsed, body still on the wire \u2014 is about to be dressed as a `requests.Response`.\n\n> **Leaves as:** a live `<urllib3.response.HTTPResponse object at 0x10c23f910>` (status 200, body unread), returned from `conn.urlopen` after `'GET /basic-auth/user/pass'` was sent with five headers including `Authorization: Basic dXNlcjpwYXNz`, about to enter `build_response(req, resp)`\n"}, {"n": 8, "title": "Dressing the Raw Response", "data_in": "req=<PreparedRequest [GET]>, resp=<urllib3.response.HTTPResponse object at 0x10c23f910>", "data_out": "<Response [200]> with headers {'Server': ..., 'Content-Type': 'application/json; charset=utf-8', 'Content-Length': '39'}, encoding 'utf-8', url set, cookies jar, request and connection attached", "span": [255, 289], "md": "# Chapter 8 \u00b7 Dressing the Raw Response\n\n> **Enters as:** `build_response(req=<PreparedRequest [GET]>, resp=<urllib3.response.HTTPResponse object at 0x10c23f910>)`\n\nThe last line of `HTTPAdapter.send` hands two objects to `build_response`: the PreparedRequest that has been travelling since Chapter 3, and a urllib3 response that knows its status and its headers and nothing about its body ([adapters.py#L365-L401](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L365-L401)). This function does no I/O. It is a wrapping: it takes what urllib3 parsed and arranges it into the shape the README promised.\n\nIt opens, as every public entry point in this library does, with `assert _is_prepared(req)` \u2014 a type-narrowing no-op at runtime that the trace faithfully records as `\u2192 True` ([adapters.py#L375](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L375), [_types.py#L47-L52](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/_types.py#L47-L52)).\n\n## An empty Response first\n\n`response = Response()` builds something deliberately blank ([models.py#L765-L810](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L765-L810)). The trace shows two calls inside it: a `CaseInsensitiveDict.__init__(data=None)` for the headers, and `cookiejar_from_dict({})` for a fresh empty `RequestsCookieJar` ([models.py#L776](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L776), [models.py#L798](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L798)).\n\nTwo of the blank values matter later. `self._content = False` is a sentinel distinct from `None`, and it is what `Response.content` checks to decide whether the body has ever been read ([models.py#L766](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L766)). And `self.elapsed = datetime.timedelta(0)` is a placeholder; the real figure is computed back in `Session.send`, from a clock that started before `adapter.send` and stops the moment this function returns \u2014 it measures time-to-headers, not time-to-body ([models.py#L806](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L806), [sessions.py#L781-L788](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L781-L788)).\n\n## The status code, taken on faith\n\n```python\nresponse.status_code = getattr(resp, \"status\", None)\n```\n([adapters.py#L378-L379](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L378-L379))\n\nHere it is `200`, which is what makes the object print as `<Response [200]>` ([models.py#L834-L835](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L834-L835)). The comment above the line is candid: *Fallback to None if there's no status_code, for whatever reason.* A transport object that never produced a status yields a perfectly constructible `Response` whose `status_code` is `None`.\n\nNothing in this function looks at the value. 200, 404 and 503 are dressed identically.\n\n> **For the owner:** `build_response` does not inspect the status code, so a 4xx or 5xx produces an ordinary `Response` with no exception. Require `raise_for_status()` or an explicit status check in any code path that treats a response as success.\n\n## Headers, case-folded once\n\n```python\nresponse.headers = CaseInsensitiveDict(getattr(resp, \"headers\", {}))\n```\n([adapters.py#L381-L382](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L381-L382))\n\nThe trace shows urllib3's `HTTPHeaderDict({'Server': 'BaseHTTP/0....harset=utf-8', 'Content-Length': '39'})` going in and four `__setitem__` calls coming out \u2014 `Server`, `Date`, `Content-Type`, `Content-Length` \u2014 each stored under its lowercased key with its original casing kept alongside ([structures.py#L59-L65](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/structures.py#L59-L65)). This is why the scenario's `r.headers[\"content-type\"]` works later even though the server sent `Content-Type`, and why the trace's final lines show `__getitem__(key='content-type')` returning `'application/json; charset=utf-8'` without complaint.\n\n## Deciding the encoding, from headers and nothing else\n\n```python\nresponse.encoding = get_encoding_from_headers(response.headers)\n```\n([adapters.py#L384-L385](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L384-L385))\n\n`get_encoding_from_headers` reads `content-type`, hands it to `_parse_content_type_header`, and the trace records the split: `('application/json', {'charset': 'utf-8'})` ([utils.py#L569-L591](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L569-L591), [utils.py#L547-L566](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L547-L566)). The parser is lenient: it strips quotes and whitespace from each parameter and lowercases the key, so `charset=\"UTF-8\"` and `; charset=utf-8` land in the same place. A `charset` present wins outright, and the function returns `'utf-8'` ([utils.py#L583-L584](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L583-L584)).\n\nThree roads were not taken. With no charset, a content type containing `text` returns `ISO-8859-1` \u2014 the RFC 2616 default, and very often wrong for a modern UTF-8 page ([utils.py#L586-L587](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L586-L587)). A bare `application/json` returns `utf-8` on RFC 4627 grounds ([utils.py#L589-L591](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L589-L591)). Anything else \u2014 including a missing `content-type` entirely \u2014 falls off the end of the function and returns `None`, which is the signal that sends `Response.text` to statistical guessing in Chapter 10 ([utils.py#L576-L579](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L576-L579)).\n\nNote what is *not* consulted: the body. A `<meta charset>` tag or an XML declaration has no influence here, because the body has not been read.\n\n> **For the owner:** The encoding is derived from HTTP headers alone, and `text/*` without a charset silently becomes ISO-8859-1. Set `r.encoding` explicitly before reading `r.text` whenever you parse a response from a server you do not control.\n\n## The live stream, and the URL\n\n```python\nresponse.raw = resp\nresponse.reason = response.raw.reason\n```\n([adapters.py#L386-L387](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L386-L387))\n\n`raw` is the same urllib3 object that came out of `conn.urlopen`, body still unread, connection still checked out of the pool. From here until someone drains it, this `Response` is holding a socket.\n\nThen the URL is copied across from the request, decoded if it arrived as bytes ([adapters.py#L389-L392](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L389-L392)). `r.url` is therefore the *prepared* URL \u2014 percent-re-encoded, params appended \u2014 not the string the caller typed. On a redirect chain it would be the URL of this particular hop.\n\n## Cookies, if the transport cooperates\n\n```python\nextract_cookies_to_jar(response.cookies, req, resp)\n```\n([adapters.py#L394-L395](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L394-L395))\n\nThe function's first act is a guard: if the urllib3 response has no truthy `_original_response`, it returns immediately and the jar stays empty ([cookies.py#L144-L145](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L144-L145)). Ours has one, so the adaptation proceeds: `MockRequest(request)` wraps the PreparedRequest in the `urllib2.Request` shape \u2014 the same wrapper Chapter 4 used on the way out ([cookies.py#L31-L50](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L31-L50)) \u2014 and `MockResponse(response._original_response.msg)` wraps the raw `http.client.HTTPMessage` so that `info()` returns it ([cookies.py#L114-L132](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L114-L132)). The trace shows `MockResponse.info` called twice: that is the standard library's `CookieJar.extract_cookies` reading the header block ([cookies.py#L150](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L150)).\n\nThe decision of *which* cookies may be stored \u2014 domain, path, secure, HttpOnly \u2014 is `http.cookiejar`'s, not Requests'. Our server sent no `Set-Cookie`, so the jar comes back `<RequestsCookieJar[]>`.\n\n> **For the owner:** Cookie extraction is silently skipped when the response object lacks `_original_response`. Check this before accepting a custom transport adapter or a response-mocking library, because such a response will carry no cookies and will fail without an error.\n\n## Two back-references, and out\n\n```python\nresponse.request = req\nresponse.connection = self\n```\n([adapters.py#L397-L399](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L397-L399))\n\n`response.request` is what makes `r.request.headers` available to the caller \u2014 including, on this response, the `Authorization: Basic dXNlcjpwYXNz` that went out. `response.connection` is the adapter itself, and it is more than a convenience: it is the mechanism by which a response hook can issue a *new* request. `HTTPDigestAuth.handle_401` reaches through exactly this attribute \u2014 `r.connection.send(prep, **kwargs)` \u2014 to replay a request with a digest header after a 401 ([auth.py#L300-L316](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/auth.py#L300-L316)).\n\n`build_response` returns `<Response [200]>`, and `HTTPAdapter.send` returns it unchanged. The object now has a status, case-insensitive headers, a declared encoding of `'utf-8'`, its URL, an empty cookie jar, and a pointer back to the request and the adapter \u2014 and a body that is still thirty-nine bytes sitting on an open socket.\n\n> **Leaves as:** `<Response [200]>` with `headers={'Server': ..., 'Date': ..., 'Content-Type': 'application/json; charset=utf-8', 'Content-Length': '39'}`, `encoding='utf-8'`, `url='http://127.0.0.1:54897/basic-auth/user/pass'`, `cookies=<RequestsCookieJar[]>`, `request` and `connection` attached, `_content` still `False` and `raw` still a live stream \u2014 returned from `HTTPAdapter.send` into `Session.send`\n"}, {"n": 9, "title": "Hooks, Cookie Persistence, and the Redirect That Wasn't", "data_in": "<Response [200]>, hooks {'response': []}, session cookie jar", "data_out": "<Response [200]> unchanged; session jar still empty; get_redirect_target returned None so the redirect generator yields nothing", "span": [290, 310], "md": "# Chapter 9 \u00b7 Hooks, Cookie Persistence, and the Redirect That Wasn't\n\n> **Enters as:** `<Response [200]>` with `encoding='utf-8'`, a live unread `raw`, `request` and `connection` attached \u2014 back inside `Session.send`, alongside `hooks={'response': []}` and the session's empty cookie jar\n\n`HTTPAdapter.send` has returned. The Response is back in `Session.send`, and the first thing that happens to it is arithmetic: `elapsed = preferred_clock() - start`, converted to a `timedelta` and stored on the response ([sessions.py#L786-L788](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L786-L788)). The clock started immediately before `adapter.send` ([sessions.py#L780-L784](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L780-L784)), and it stops here \u2014 before the body is read. `r.elapsed` is time-to-headers, which is the number the docstring on the attribute promises ([models.py#L800-L806](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L800-L806)).\n\nThen three things happen in sequence to a response that nobody has read yet: hooks get a turn at it, its cookies get copied into the session, and it gets asked whether it is a redirect.\n\n## The hook that does nothing\n\n```python\nr = dispatch_hook(\"response\", hooks, r, **kwargs)\n```\n([sessions.py#L790-L791](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L790-L791))\n\n`hooks` is `request.hooks`, the dict prepared back in Chapter 5 ([sessions.py#L775](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L775)). The trace shows what it holds: `{'response': []}`. `dispatch_hook` looks up the key, finds an empty list, and the `if hook_list:` test is false \u2014 so it returns `hook_data` untouched ([hooks.py#L32-L48](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/hooks.py#L32-L48)). The trace confirms it: `dispatch_hook(...) \u2192 <Response [200]>`, the same object.\n\nTwo details of the road not taken are worth knowing before you sign off on a codebase that uses hooks. First, a single callable is normalised into a list, so `hooks={'response': print_url}` and `hooks={'response': [print_url]}` behave identically ([hooks.py#L42-L43](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/hooks.py#L42-L43)). Second, and more consequential: a hook's return value *replaces* the response, but only when it is not `None` ([hooks.py#L44-L47](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/hooks.py#L44-L47)). A hook that forgets to `return r` is harmless; a hook that returns something else substitutes it for everything downstream \u2014 including, as `HTTPDigestAuth.handle_401` does, a whole new response fetched over the adapter reference Chapter 8 attached ([auth.py#L300-L316](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/auth.py#L300-L316)).\n\nThere is no `try` around the hook call. An exception inside a hook propagates straight out of `requests.get` to the caller.\n\n> **For the owner:** Response hooks run with the body unread and can replace the response object entirely by returning a non-`None` value. Require every hook you accept to handle its own exceptions and to return either `None` or a `Response`.\n\n## Cookies move from the response to the session\n\n```python\nif r.history:\n    for resp in r.history:\n        extract_cookies_to_jar(self.cookies, resp.request, resp.raw)\n\nextract_cookies_to_jar(self.cookies, request, r.raw)\n```\n([sessions.py#L793-L799](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L793-L799))\n\n`r.history` is still the empty list `Response.__init__` gave it ([models.py#L789-L792](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L789-L792)), so the loop is skipped. The unconditional call runs, and the trace walks through it exactly as in Chapter 8: a `MockRequest` around the PreparedRequest, a `MockResponse` around `response._original_response.msg`, and two `info()` calls as the standard library's `CookieJar.extract_cookies` reads the header block ([cookies.py#L135-L150](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L135-L150)).\n\nThe difference from Chapter 8 is the destination. There the jar was `response.cookies`, a per-response record. Here it is `self.cookies` \u2014 the Session's jar, created in `Session.__init__` ([sessions.py#L494-L498](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L494-L498)). This line, and the loop above it, are the whole of Requests' cookie-persistence guarantee: cookies accumulate on the *Session*, which is why the documented pattern for a login flow is to reuse one. Our server sent no `Set-Cookie`, so the jar is unchanged and still empty.\n\nThe history loop exists for a specific reason, spelled out in its comment: *If the hooks create history then we want those cookies too* ([sessions.py#L793-L797](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L793-L797)). Digest auth's 401 retry appends the original response to `_r.history` inside the hook; without this loop, a cookie set alongside the 401 challenge would be lost.\n\n> **For the owner:** Cookie persistence lives on the `Session`, not on the response. Because `requests.get` builds and discards a Session per call, a server cookie set by one top-level `requests.get` is not sent by the next \u2014 use `requests.Session()` when a flow depends on cookies.\n\n## Asking whether to follow\n\n`allow_redirects` was popped off the kwargs earlier and is `True`, the default that `Session.get` set ([sessions.py#L773](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L773), [sessions.py#L670-L671](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L670-L671)). So:\n\n```python\ngen = self.resolve_redirects(r, request, **kwargs)\nhistory = [resp for resp in gen]\n```\n([sessions.py#L801-L805](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L801-L805))\n\n`resolve_redirects` is a generator, so building the list is what actually runs it. The trace shows it entered with the full kwargs set \u2014 `stream=False, timeout=None, verify=True, cert=None, proxies=OrderedDict(), yield_requests=False` \u2014 which is precisely why Chapter 6's `Session.send` bothered to fill in every default: each redirect hop must be reproducible with the same settings ([sessions.py#L186-L197](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L186-L197)).\n\nThe generator's first act is the question:\n\n```python\nurl = self.get_redirect_target(resp)\n```\n([sessions.py#L200-L204](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L200-L204))\n\n`get_redirect_target` consults `resp.is_redirect` ([sessions.py#L134-L152](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L134-L152)), which is a conjunction of two conditions:\n\n```python\nreturn \"location\" in self.headers and self.status_code in REDIRECT_STATI\n```\n([models.py#L876-L881](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L876-L881))\n\nThe trace captures the first test resolving: `CaseInsensitiveDict.__getitem__(key='location') \u2192 None`. Our server sent `Server`, `Date`, `Content-Type` and `Content-Length`, and no `Location`. `is_redirect` returns `False`, `get_redirect_target` returns `None`, the `while url:` loop never executes, and the generator finishes without yielding ([sessions.py#L204](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L204)). `history` is `[]`, so the shuffling block that would pop the last response off and attach the rest as `r.history` is skipped ([sessions.py#L809-L815](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L809-L815)). And because `allow_redirects` is `True`, the `r._next` block that would compute a single next-hop PreparedRequest is skipped too ([sessions.py#L817-L824](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L817-L824)).\n\nNote that `REDIRECT_STATI` is exactly `(301, 302, 303, 307, 308)` ([models.py#L93-L101](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L93-L101)). A 300 Multiple Choices with a `Location`, or a 302 without one, is not followed \u2014 it is simply returned.\n\n## The road not taken, briefly\n\nOur response stayed on the main road, but it is worth knowing what the detour does, because the detour is where the credentials from Chapter 5 would have been at risk.\n\nOn each hop the generator copies the request, consumes `resp.content` to free the socket, and checks `len(resp.history) >= self.max_redirects` \u2014 30 by default \u2014 raising `TooManyRedirects` if exceeded ([sessions.py#L205-L222](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L205-L222)). For anything other than 307 or 308 it discards the body and the `Content-Length`, `Content-Type` and `Transfer-Encoding` headers ([sessions.py#L249-L258](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L249-L258)), and `rebuild_method` applies the browser-compatibility quirks: 303 and 302 become GET unless the method was HEAD, and a POST answered with 301 becomes a GET ([sessions.py#L370-L392](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L370-L392)).\n\nThen the part that matters for the password. `rebuild_auth` deletes the `Authorization` header whenever `should_strip_auth` says so ([sessions.py#L309-L332](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L309-L332)), and `should_strip_auth` strips on any hostname change, permits the `http`\u2192`https` upgrade on standard ports, permits a same-scheme hop between default ports, and otherwise strips on a changed port or scheme ([sessions.py#L154-L184](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L154-L184)). Immediately afterwards, if `trust_env` is on, `.netrc` may supply fresh credentials for the new host ([sessions.py#L329-L332](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L329-L332)). `rebuild_proxies` is similarly defensive: it always deletes `Proxy-Authorization` and re-derives it, and refuses to re-add it when the target scheme starts with `https`, so it is never leaked into a CONNECT tunnel ([sessions.py#L334-L368](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L334-L368)).\n\n> **For the owner:** Credentials survive a same-host redirect and an `http`\u2192`https` upgrade on default ports, and are stripped on a host, port, or downgrade change. If you send Basic auth over plaintext `http://` as this scenario does, the credentials are already on the wire in base64 before any redirect logic runs \u2014 require `https://` for any URL carrying auth.\n\nThe Response leaves this span exactly as it entered it: same object, same status, `history` still `[]`, `_next` still `None`, cookie jars still empty \u2014 and its body still unread on an open socket. The next line of `Session.send` is the one that changes that.\n\n> **Leaves as:** the same `<Response [200]>`, unreplaced by hooks, with `history == []` and `_next is None`; the session jar still `<RequestsCookieJar[]>`; `_content` still `False` and `raw` still a live stream, about to meet `if not stream: r.content`\n"}, {"n": 10, "title": "Reading the Body, Closing Everything, and Decoding What Came Back", "data_in": "<Response [200]> with stream=False and an unread raw stream", "data_out": "r._content = b'{\"authenticated\": true, \"user\": \"user\"}'; Session closed; 'application/json; charset=utf-8', 'utf-8', '{\"authenticated\": true, \"user\": \"user\"}', {'authenticated': True, 'user': 'user'}", "span": [311, 351], "md": "# Chapter 10 \u00b7 Reading the Body, Closing Everything, and Decoding What Came Back\n\n> **Enters as:** `<Response [200]>` with `_content = False`, `_content_consumed = False`, `encoding = 'utf-8'`, and a live urllib3 stream at `raw` \u2014 one line from the end of `Session.send`\n\nTwo statements remain:\n\n```python\n        if not stream:\n            r.content\n\n        return r\n```\n([sessions.py#L826-L829](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L826-L829))\n\n`stream` was read out of the kwargs back at the top of `send` ([sessions.py#L774](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L774)), and Chapter 6 settled it at `False` \u2014 the Session default, untouched by the caller. So the body gets read now, inside the library, before the Response is ever handed back. The bare expression statement `r.content` looks like a no-op; it is the entire download.\n\n## Draining the stream\n\n`content` is a property. Its first test is `if self._content is False:` \u2014 the sentinel `Response.__init__` set ([models.py#L765-L768](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L765-L768)), meaning *not read yet*, distinct from a legitimately empty `b\"\"` or a `None`. `_content_consumed` is False, `status_code` is 200 and `raw` is not None, so it falls to the real work:\n\n```python\n                self._content = b\"\".join(self.iter_content(CONTENT_CHUNK_SIZE)) or b\"\"\n```\n([models.py#L1034-L1051](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L1034-L1051))\n\n`CONTENT_CHUNK_SIZE` is `10 * 1024` ([models.py#L104](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L104)), which is why the trace records the call as `iter_content(chunk_size=10240, decode_unicode=False)`.\n\n`iter_content` is mostly guards. It raises `StreamConsumedError` if a stream has already been drained ([models.py#L958-L959](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L958-L959)) and `TypeError` for a non-integer chunk size ([models.py#L960-L965](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L960-L965)). Then it branches: for an already-consumed response it replays the cached bytes through `iter_slices` ([models.py#L967-L970](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L967-L970), [utils.py#L621-L630](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L621-L630)); here it is not, so it returns the `generate()` generator unstarted ([models.py#L971-L977](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L971-L977)). `decode_unicode` is False, so the decoding wrapper is skipped and the chunks stay bytes. The trace shows exactly that: a `<generator object ... generate>`, returned without running.\n\n`b\"\".join` is what runs it. The trace records two entries into `generate`: the first yields `b'{\"authenticated\": true, \"user\": \"user\"}'`, the second finds the stream exhausted and falls through to the last line of the function.\n\n```python\n            if hasattr(self.raw, \"stream\"):\n                try:\n                    yield from self.raw.stream(chunk_size, decode_content=True)\n```\n([models.py#L935-L956](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L935-L956))\n\nNote `decode_content=True` here, against the `decode_content=False` the adapter passed to `urlopen` in Chapter 7 ([adapters.py#L696-L708](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L696-L708)). That is deliberate: content decoding \u2014 gzip, deflate, brotli \u2014 is deferred from transport time to read time, so `raw` stays a genuinely raw stream for anyone who wants it, while `content` and `iter_content` give you decompressed bytes. Our server sent no `Content-Encoding`, so the 39 bytes arrive as they were written.\n\nThe `try` around that `yield from` is the second half of Chapter 7's exception-translation contract, and it covers the half that happens *after* a status line has already been seen: `ProtocolError` becomes `ChunkedEncodingError`, `DecodeError` becomes `ContentDecodingError`, `ReadTimeoutError` becomes `ConnectionError`, urllib3's `SSLError` becomes `requests.exceptions.SSLError` ([models.py#L940-L947](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L940-L947)).\n\nOn the way out, `generate` sets `self._content_consumed = True` ([models.py#L956](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L956)), and `content` sets it again and caches the joined bytes ([models.py#L1048](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L1048)). The comment beside it states the ownership rule plainly: *don't need to release the connection; that's been handled by urllib3 since we exhausted the data* ([models.py#L1049-L1050](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L1049-L1050)). Draining the stream is what returns the socket to the pool. `Response.close()` exists for the other case \u2014 it closes `raw` only when the content was *not* consumed, then calls `release_conn` ([models.py#L1173-L1184](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L1173-L1184)) \u2014 and nothing in this run needed it.\n\n> **For the owner:** With the default `stream=False`, Requests reads the whole body into memory before returning, which bounds nothing by size but guarantees the connection is released. If any caller passes `stream=True`, require that they consume the body or use the response as a context manager; an unread streamed response holds a pooled connection open, and transport errors can still surface from `iter_content` long after a `200` was observed.\n\n## Closing up\n\n`r.content` returns, `Session.send` returns `<Response [200]>`, `Session.request` returns it unchanged ([sessions.py#L651-L653](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L651-L653)), and control reaches the end of the `with` block that Chapter 1 opened:\n\n```python\n    with sessions.Session() as session:\n        return session.request( \Z\")\n_VALID_HEADER_VALUE_RE_STR = re.compile(r\"^\\S[^\\r\\n]*\\Z|^\\Z\")\n\n_HEADER_VALIDATORS_STR = (_VALID_HEADER_NAME_RE_STR, _VALID_HEADER_VALUE_RE_STR)\n_HEADER_VALIDATORS_BYTE = (_VALID_HEADER_NAME_RE_BYTE, _VALID_HEADER_VALUE_RE_BYTE)\nHEADER_VALIDATORS = {\n    bytes: _HEADER_VALIDATORS_BYTE,\n    str: _HEADER_VALIDATORS_STR,\n}\n\n\ndef to_native_string(string: str | bytes, encoding: str = \"ascii\") -> str:\n    \"\"\"Given a string object, regardless of type, returns a representation of\n    that string in the native string type, encoding and decoding where\n    necessary. This assumes ASCII unless told otherwise.\n    \"\"\"\n    if isinstance(string, builtin_str):\n        out = string\n    else:\n        out = string.decode(encoding)\n\n    return out\n\n\ndef unicode_is_ascii(u_string: str) -> bool:\n    \"\"\"Determine if unicode string only contains ASCII characters.\n\n    :param str u_string: unicode string to check. Must be unicode\n        and not Python 2 `str`.\n    :rtype: bool\n    \"\"\"\n    assert isinstance(u_string, str)\n    try:\n        u_string.encode(\"ascii\")\n        return True\n    except UnicodeEncodeError:\n        return False\n", "611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60:src/requests/_types.py": "\"\"\"\nrequests._types\n~~~~~~~~~~~~~~~\n\nThis module contains type aliases used internally by the Requests library.\nThese types are not part of the public API and must not be relied upon\nby external code.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections.abc import Callable, Iterable, Mapping, MutableMapping, Sequence\nfrom typing import (\n    TYPE_CHECKING,\n    Any,\n    Protocol,\n    TypeAlias,\n    TypeVar,\n    runtime_checkable,\n)\n\n_T_co = TypeVar(\"_T_co\", covariant=True)\n_KT_co = TypeVar(\"_KT_co\", covariant=True)\n_VT_co = TypeVar(\"_VT_co\", covariant=True)\n\n\n@runtime_checkable\nclass SupportsRead(Protocol[_T_co]):\n    def read(self, length: int = ..., /) -> _T_co: ...\n\n\ndef has_read(obj: Any) -> TypeIs[SupportsRead[str | bytes]]:\n    \"\"\"Check if obj supports read, including __getattr__ based proxies.\"\"\"\n    return isinstance(obj, SupportsRead) or hasattr(obj, \"read\")\n\n\n@runtime_checkable\nclass SupportsItems(Protocol[_KT_co, _VT_co]):\n    def items(self) -> Iterable[tuple[_KT_co, _VT_co]]: ...\n\n\n# These are needed at runtime for default_hooks() return type\nHookType: TypeAlias = Callable[[\"Response\"], Any]\nHooksInputType: TypeAlias = Mapping[str, Iterable[HookType] | HookType]\n\n\ndef is_prepared(request: PreparedRequest) -> TypeIs[_ValidatedRequest]:\n    \"\"\"Verify a PreparedRequest has been fully prepared.\"\"\"\n    if TYPE_CHECKING:\n        return request.url is not None and request.method is not None\n    # noop at runtime to avoid AssertionError\n    return True\n\n\nif TYPE_CHECKING:\n    from http.cookiejar import CookieJar\n    from typing import TypeAlias, TypedDict\n\n    from typing_extensions import (\n        Buffer,  # TODO: move to collections.abc when Python >= 3.12\n        TypeIs,  # TODO: move to typing when Python >= 3.13\n    )\n\n    from .auth import AuthBase\n    from .cookies import RequestsCookieJar\n    from .models import PreparedRequest, Response\n    from .structures import CaseInsensitiveDict\n\n    class _ValidatedRequest(PreparedRequest):\n        \"\"\"Subtype asserting a PreparedRequest has been fully prepared before calling.\n\n        The override suppression is required because mutable attribute types are\n        invariant (Liskov), but we only narrow after preparation is complete. This\n        is the explicit contract for Requests but Python's typing doesn't have a\n        better way to represent the requirement.\n        \"\"\"\n\n        url: str  # type: ignore[reportIncompatibleVariableOverride]\n        method: str  # type: ignore[reportIncompatibleVariableOverride]\n\n    # Type aliases for core API concepts (ordered by request() signature)\n    UriType: TypeAlias = str | bytes\n\n    _ParamsMappingKeyType: TypeAlias = str | bytes | int | float\n    _ParamsMappingValueType: TypeAlias = (\n        str | bytes | int | float | Iterable[str | bytes | int | float] | None\n    )\n    ParamsType: TypeAlias = (\n        SupportsItems[_ParamsMappingKeyType, _ParamsMappingValueType]\n        | tuple[tuple[_ParamsMappingKeyType, _ParamsMappingValueType], ...]\n        | Iterable[tuple[_ParamsMappingKeyType, _ParamsMappingValueType]]\n        | str\n        | bytes\n        | None\n    )\n\n    KVDataType: TypeAlias = Iterable[tuple[Any, Any]] | SupportsItems[Any, Any]\n\n    RawDataType: TypeAlias = KVDataType | str | bytes\n    StreamDataType: TypeAlias = SupportsRead[str | bytes]\n    EncodableDataType: TypeAlias = RawDataType | StreamDataType\n\n    DataType: TypeAlias = (\n        KVDataType\n        | Iterable[bytes | str]\n        | str\n        | bytes\n        | Buffer\n        | SupportsRead[str | bytes]\n        | None\n    )\n\n    BodyType: TypeAlias = (\n        bytes | str | Iterable[bytes | str] | SupportsRead[bytes | str] | None\n    )\n\n    HeadersType: TypeAlias = Mapping[str, str | bytes] | None\n\n    CookiesType: TypeAlias = RequestsCookieJar | Mapping[str, str]\n\n    # Building blocks for FilesType\n    _FileName: TypeAlias = str | None\n    _FileContent: TypeAlias = SupportsRead[str | bytes] | str | bytes\n    _FileSpecBasic: TypeAlias = tuple[_FileName, _FileContent]\n    _FileSpecWithContentType: TypeAlias = tuple[_FileName, _FileContent, str]\n    _FileSpecWithHeaders: TypeAlias = tuple[\n        _FileName, _FileContent, str, CaseInsensitiveDict[str] | Mapping[str, str]\n    ]\n    _FileSpec: TypeAlias = (\n        _FileContent | _FileSpecBasic | _FileSpecWithContentType | _FileSpecWithHeaders\n    )\n    FilesType: TypeAlias = (\n        Mapping[str, _FileSpec] | Iterable[tuple[str, _FileSpec]] | None\n    )\n\n    AuthType: TypeAlias = (\n        tuple[str, str] | AuthBase | Callable[[PreparedRequest], PreparedRequest] | None\n    )\n\n    TimeoutType: TypeAlias = float | tuple[float | None, float | None] | None\n    ProxiesType: TypeAlias = MutableMapping[str, str]\n    HooksType: TypeAlias = dict[str, list[HookType]] | None\n    VerifyType: TypeAlias = bool | str\n    CertType: TypeAlias = str | tuple[str, str] | None\n    JsonType: TypeAlias = (\n        None\n        | bool\n        | int\n        | float\n        | str\n        | Sequence[\"JsonType\"]\n        | Mapping[str, \"JsonType\"]\n    )\n\n    # TypedDicts for Unpack kwargs (PEP 692)\n\n    class BaseRequestKwargs(TypedDict, total=False):\n        headers: HeadersType\n        cookies: RequestsCookieJar | CookieJar | dict[str, str] | None\n        files: FilesType\n        auth: AuthType\n        timeout: TimeoutType\n        allow_redirects: bool\n        proxies: dict[str, str] | None\n        hooks: HooksInputType | None\n        stream: bool | None\n        verify: VerifyType | None\n        cert: CertType\n\n    class RequestKwargs(BaseRequestKwargs, total=False):\n        \"\"\"kwargs for request(), options(), head(), delete().\"\"\"\n\n        params: ParamsType\n        data: DataType\n        json: JsonType\n\n    class GetKwargs(BaseRequestKwargs, total=False):\n        data: DataType\n        json: JsonType\n\n    class PostKwargs(BaseRequestKwargs, total=False):\n        params: ParamsType\n\n    class DataKwargs(BaseRequestKwargs, total=False):\n        \"\"\"kwargs for put(), patch().\"\"\"\n\n        params: ParamsType\n        json: JsonType\n", "611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60:src/requests/adapters.py": "\"\"\"\nrequests.adapters\n~~~~~~~~~~~~~~~~~\n\nThis module contains the transport adapters that Requests uses to define\nand maintain connections.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os.path\nimport socket  # noqa: F401\nimport typing\nimport warnings\nfrom typing import Any\n\nfrom urllib3.exceptions import (\n    ClosedPoolError,\n    ConnectTimeoutError,\n    LocationValueError,\n    MaxRetryError,\n    NewConnectionError,\n    ProtocolError,\n    ReadTimeoutError,\n    ResponseError,\n)\nfrom urllib3.exceptions import HTTPError as _HTTPError\nfrom urllib3.exceptions import InvalidHeader as _InvalidHeader\nfrom urllib3.exceptions import ProxyError as _ProxyError\nfrom urllib3.exceptions import SSLError as _SSLError\nfrom urllib3.poolmanager import PoolManager, proxy_from_url\nfrom urllib3.util import Timeout as TimeoutSauce\nfrom urllib3.util import parse_url\nfrom urllib3.util.retry import Retry\n\nfrom .auth import _basic_auth_str\nfrom .compat import basestring, urlparse\nfrom .cookies import extract_cookies_to_jar\nfrom .exceptions import (\n    ConnectionError,\n    ConnectTimeout,\n    InvalidHeader,\n    InvalidProxyURL,\n    InvalidSchema,\n    InvalidURL,\n    ProxyError,\n    ReadTimeout,\n    RetryError,\n    SSLError,\n)\nfrom .models import Response\nfrom .structures import CaseInsensitiveDict\nfrom .utils import (\n    DEFAULT_CA_BUNDLE_PATH,\n    get_auth_from_url,\n    get_encoding_from_headers,\n    prepend_scheme_if_needed,\n    select_proxy,\n    urldefragauth,\n)\n\ntry:\n    from urllib3.contrib.socks import SOCKSProxyManager  # type: ignore[assignment]\nexcept ImportError:\n\n    def SOCKSProxyManager(*args: Any, **kwargs: Any) -> None:\n        raise InvalidSchema(\"Missing dependencies for SOCKS support.\")\n\n\nif typing.TYPE_CHECKING:\n    from urllib3.connectionpool import HTTPConnectionPool\n    from urllib3.poolmanager import PoolManager as _PoolManager\n\n    from . import _types as _t\n    from .models import PreparedRequest\n\nfrom ._types import is_prepared as _is_prepared\n\nDEFAULT_POOLBLOCK = False\nDEFAULT_POOLSIZE = 10\nDEFAULT_RETRIES = 0\nDEFAULT_POOL_TIMEOUT = None\n\n\ndef _urllib3_request_context(\n    request: PreparedRequest,\n    verify: bool | str | None,\n    client_cert: tuple[str, str] | str | None,\n    poolmanager: PoolManager,\n) -> tuple[dict[str, Any], dict[str, Any]]:\n    host_params: dict[str, Any] = {}\n    pool_kwargs: dict[str, Any] = {}\n    parsed_request_url = urlparse(request.url)\n    scheme = parsed_request_url.scheme.lower()\n    port = parsed_request_url.port\n\n    cert_reqs = \"CERT_REQUIRED\"\n    if verify is False:\n        cert_reqs = \"CERT_NONE\"\n    elif isinstance(verify, str):\n        if not os.path.isdir(verify):\n            pool_kwargs[\"ca_certs\"] = verify\n        else:\n            pool_kwargs[\"ca_cert_dir\"] = verify\n    pool_kwargs[\"cert_reqs\"] = cert_reqs\n    if client_cert is not None:\n        if isinstance(client_cert, tuple) and len(client_cert) == 2:\n            pool_kwargs[\"cert_file\"] = client_cert[0]\n            pool_kwargs[\"key_file\"] = client_cert[1]\n        else:\n            # According to our docs, we allow users to specify just the client\n            # cert path\n            pool_kwargs[\"cert_file\"] = client_cert\n    host_params = {\n        \"scheme\": scheme,\n        \"host\": parsed_request_url.hostname,\n        \"port\": port,\n    }\n    return host_params, pool_kwargs\n\n\nclass BaseAdapter:\n    \"\"\"The Base Transport Adapter\"\"\"\n\n    def __init__(self) -> None:\n        super().__init__()\n\n    def send(\n        self,\n        request: PreparedRequest,\n        stream: bool = False,\n        timeout: _t.TimeoutType = None,\n        verify: _t.VerifyType = True,\n        cert: _t.CertType = None,\n        proxies: dict[str, str] | None = None,\n    ) -> Response:\n        \"\"\"Sends PreparedRequest object. Returns Response object.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param stream: (optional) Whether to stream the request content.\n        :param timeout: (optional) How long to wait for the server to send\n            data before giving up, as a float, or a :ref:`(connect timeout,\n            read timeout) <timeouts>` tuple.\n        :type timeout: float or tuple\n        :param verify: (optional) Either a boolean, in which case it controls whether we verify\n            the server's TLS certificate, or a string, in which case it must be a path\n            to a CA bundle to use\n        :param cert: (optional) Any user-provided SSL certificate to be trusted.\n        :param proxies: (optional) The proxies dictionary to apply to the request.\n        \"\"\"\n        raise NotImplementedError\n\n    def close(self) -> None:\n        \"\"\"Cleans up adapter specific items.\"\"\"\n        raise NotImplementedError\n\n\nclass HTTPAdapter(BaseAdapter):\n    \"\"\"The built-in HTTP Adapter for urllib3.\n\n    Provides a general-case interface for Requests sessions to contact HTTP and\n    HTTPS urls by implementing the Transport Adapter interface. This class will\n    usually be created by the :class:`Session <Session>` class under the\n    covers.\n\n    :param pool_connections: The number of urllib3 connection pools to cache.\n    :param pool_maxsize: The maximum number of connections to save in the pool.\n    :param max_retries: The maximum number of retries each connection\n        should attempt. Note, this applies only to failed DNS lookups, socket\n        connections and connection timeouts, never to requests where data has\n        made it to the server. By default, Requests does not retry failed\n        connections. If you need granular control over the conditions under\n        which we retry a request, import urllib3's ``Retry`` class and pass\n        that instead.\n    :param pool_block: Whether the connection pool should block for connections.\n\n    Usage::\n\n      >>> import requests\n      >>> s = requests.Session()\n      >>> a = requests.adapters.HTTPAdapter(max_retries=3)\n      >>> s.mount('http://', a)\n    \"\"\"\n\n    __attrs__: list[str] = [\n        \"max_retries\",\n        \"config\",\n        \"_pool_connections\",\n        \"_pool_maxsize\",\n        \"_pool_block\",\n    ]\n\n    max_retries: Retry\n    config: dict[str, Any]\n    proxy_manager: dict[str, Any]\n    _pool_connections: int\n    _pool_maxsize: int\n    _pool_block: bool\n    poolmanager: _PoolManager\n\n    def __init__(\n        self,\n        pool_connections: int = DEFAULT_POOLSIZE,\n        pool_maxsize: int = DEFAULT_POOLSIZE,\n        max_retries: int | Retry = DEFAULT_RETRIES,\n        pool_block: bool = DEFAULT_POOLBLOCK,\n    ) -> None:\n        if max_retries == DEFAULT_RETRIES:\n            self.max_retries = Retry(0, read=False)\n        else:\n            self.max_retries = Retry.from_int(max_retries)\n        self.config = {}\n        self.proxy_manager = {}\n\n        super().__init__()\n\n        self._pool_connections = pool_connections\n        self._pool_maxsize = pool_maxsize\n        self._pool_block = pool_block\n\n        self.init_poolmanager(pool_connections, pool_maxsize, block=pool_block)\n\n    def __getstate__(self) -> dict[str, Any]:\n        return {attr: getattr(self, attr, None) for attr in self.__attrs__}\n\n    def __setstate__(self, state: dict[str, Any]) -> None:\n        # Can't handle by adding 'proxy_manager' to self.__attrs__ because\n        # self.poolmanager uses a lambda function, which isn't pickleable.\n        self.proxy_manager = {}\n        self.config = {}\n\n        for attr, value in state.items():\n            setattr(self, attr, value)\n\n        self.init_poolmanager(\n            self._pool_connections, self._pool_maxsize, block=self._pool_block\n        )\n\n    def init_poolmanager(\n        self,\n        connections: int,\n        maxsize: int,\n        block: bool = DEFAULT_POOLBLOCK,\n        **pool_kwargs: Any,\n    ) -> None:\n        \"\"\"Initializes a urllib3 PoolManager.\n\n        This method should not be called from user code, and is only\n        exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param connections: The number of urllib3 connection pools to cache.\n        :param maxsize: The maximum number of connections to save in the pool.\n        :param block: Block when no free connections are available.\n        :param pool_kwargs: Extra keyword arguments used to initialize the Pool Manager.\n        \"\"\"\n        # save these values for pickling\n        self._pool_connections = connections\n        self._pool_maxsize = maxsize\n        self._pool_block = block\n\n        self.poolmanager = PoolManager(\n            num_pools=connections,\n            maxsize=maxsize,\n            block=block,\n            **pool_kwargs,\n        )\n\n    def proxy_manager_for(self, proxy: str, **proxy_kwargs: Any) -> Any:\n        \"\"\"Return urllib3 ProxyManager for the given proxy.\n\n        This method should not be called from user code, and is only\n        exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param proxy: The proxy to return a urllib3 ProxyManager for.\n        :param proxy_kwargs: Extra keyword arguments used to configure the Proxy Manager.\n        :returns: ProxyManager\n        :rtype: urllib3.ProxyManager\n        \"\"\"\n        if proxy in self.proxy_manager:\n            manager = self.proxy_manager[proxy]\n        elif proxy.lower().startswith(\"socks\"):\n            username, password = get_auth_from_url(proxy)\n            manager = self.proxy_manager[proxy] = SOCKSProxyManager(\n                proxy,\n                username=username,\n                password=password,\n                num_pools=self._pool_connections,\n                maxsize=self._pool_maxsize,\n                block=self._pool_block,\n                **proxy_kwargs,\n            )\n        else:\n            proxy_headers = self.proxy_headers(proxy)\n            manager = self.proxy_manager[proxy] = proxy_from_url(\n                proxy,\n                proxy_headers=proxy_headers,\n                num_pools=self._pool_connections,\n                maxsize=self._pool_maxsize,\n                block=self._pool_block,\n                **proxy_kwargs,\n            )\n\n        return manager\n\n    def cert_verify(\n        self, conn: Any, url: str, verify: _t.VerifyType, cert: _t.CertType\n    ) -> None:\n        \"\"\"Verify a SSL certificate. This method should not be called from user\n        code, and is only exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param conn: The urllib3 connection object associated with the cert.\n        :param url: The requested URL.\n        :param verify: Either a boolean, in which case it controls whether we verify\n            the server's TLS certificate, or a string, in which case it must be a path\n            to a CA bundle to use\n        :param cert: The SSL certificate to verify.\n        \"\"\"\n        if url.lower().startswith(\"https\") and verify:\n            cert_loc = None\n\n            # Allow self-specified cert location.\n            if verify is not True:\n                cert_loc = verify\n\n            if not cert_loc:\n                cert_loc = DEFAULT_CA_BUNDLE_PATH\n\n            if not cert_loc or not os.path.exists(cert_loc):\n                raise OSError(\n                    f\"Could not find a suitable TLS CA certificate bundle, \"\n                    f\"invalid path: {cert_loc}\"\n                )\n\n            conn.cert_reqs = \"CERT_REQUIRED\"\n\n            if not os.path.isdir(cert_loc):\n                conn.ca_certs = cert_loc\n            else:\n                conn.ca_cert_dir = cert_loc\n        else:\n            conn.cert_reqs = \"CERT_NONE\"\n            conn.ca_certs = None\n            conn.ca_cert_dir = None\n\n        if cert:\n            if not isinstance(cert, basestring):\n                conn.cert_file = cert[0]\n                conn.key_file = cert[1]\n            else:\n                conn.cert_file = cert\n                conn.key_file = None\n            if conn.cert_file and not os.path.exists(conn.cert_file):\n                raise OSError(\n                    f\"Could not find the TLS certificate file, \"\n                    f\"invalid path: {conn.cert_file}\"\n                )\n            if conn.key_file and not os.path.exists(conn.key_file):\n                raise OSError(\n                    f\"Could not find the TLS key file, invalid path: {conn.key_file}\"\n                )\n\n    def build_response(self, req: PreparedRequest, resp: Any) -> Response:\n        \"\"\"Builds a :class:`Response <requests.Response>` object from a urllib3\n        response. This should not be called from user code, and is only exposed\n        for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`\n\n        :param req: The :class:`PreparedRequest <PreparedRequest>` used to generate the response.\n        :param resp: The urllib3 response object.\n        :rtype: requests.Response\n        \"\"\"\n        assert _is_prepared(req)\n        response = Response()\n\n        # Fallback to None if there's no status_code, for whatever reason.\n        response.status_code = getattr(resp, \"status\", None)  # type: ignore[assignment]\n\n        # Make headers case-insensitive.\n        response.headers = CaseInsensitiveDict(getattr(resp, \"headers\", {}))\n\n        # Set encoding.\n        response.encoding = get_encoding_from_headers(response.headers)\n        response.raw = resp\n        response.reason = response.raw.reason\n\n        if isinstance(req.url, bytes):\n            response.url = req.url.decode(\"utf-8\")\n        else:\n            response.url = req.url\n\n        # Add new cookies from the server.\n        extract_cookies_to_jar(response.cookies, req, resp)\n\n        # Give the Response some context.\n        response.request = req\n        response.connection = self\n\n        return response\n\n    def build_connection_pool_key_attributes(\n        self, request: PreparedRequest, verify: _t.VerifyType, cert: _t.CertType = None\n    ) -> tuple[dict[str, Any], dict[str, Any]]:\n        \"\"\"Build the PoolKey attributes used by urllib3 to return a connection.\n\n        This looks at the PreparedRequest, the user-specified verify value,\n        and the value of the cert parameter to determine what PoolKey values\n        to use to select a connection from a given urllib3 Connection Pool.\n\n        The SSL related pool key arguments are not consistently set. As of\n        this writing, use the following to determine what keys may be in that\n        dictionary:\n\n        * If ``verify`` is ``True``, ``\"ssl_context\"`` will be set and will be the\n          default Requests SSL Context\n        * If ``verify`` is ``False``, ``\"ssl_context\"`` will not be set but\n          ``\"cert_reqs\"`` will be set\n        * If ``verify`` is a string, (i.e., it is a user-specified trust bundle)\n          ``\"ca_certs\"`` will be set if the string is not a directory recognized\n          by :py:func:`os.path.isdir`, otherwise ``\"ca_cert_dir\"`` will be\n          set.\n        * If ``\"cert\"`` is specified, ``\"cert_file\"`` will always be set. If\n          ``\"cert\"`` is a tuple with a second item, ``\"key_file\"`` will also\n          be present\n\n        To override these settings, one may subclass this class, call this\n        method and use the above logic to change parameters as desired. For\n        example, if one wishes to use a custom :py:class:`ssl.SSLContext` one\n        must both set ``\"ssl_context\"`` and based on what else they require,\n        alter the other keys to ensure the desired behaviour.\n\n        :param request:\n            The PreparedRequest being sent over the connection.\n        :type request:\n            :class:`~requests.models.PreparedRequest`\n        :param verify:\n            Either a boolean, in which case it controls whether\n            we verify the server's TLS certificate, or a string, in which case it\n            must be a path to a CA bundle to use.\n        :param cert:\n            (optional) Any user-provided SSL certificate for client\n            authentication (a.k.a., mTLS). This may be a string (i.e., just\n            the path to a file which holds both certificate and key) or a\n            tuple of length 2 with the certificate file path and key file\n            path.\n        :returns:\n            A tuple of two dictionaries. The first is the \"host parameters\"\n            portion of the Pool Key including scheme, hostname, and port. The\n            second is a dictionary of SSLContext related parameters.\n        \"\"\"\n        return _urllib3_request_context(request, verify, cert, self.poolmanager)\n\n    def get_connection_with_tls_context(\n        self,\n        request: PreparedRequest,\n        verify: _t.VerifyType,\n        proxies: dict[str, str] | None = None,\n        cert: _t.CertType = None,\n    ) -> HTTPConnectionPool:\n        \"\"\"Returns a urllib3 connection for the given request and TLS settings.\n        This should not be called from user code, and is only exposed for use\n        when subclassing the :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request:\n            The :class:`PreparedRequest <PreparedRequest>` object to be sent\n            over the connection.\n        :param verify:\n            Either a boolean, in which case it controls whether we verify the\n            server's TLS certificate, or a string, in which case it must be a\n            path to a CA bundle to use.\n        :param proxies:\n            (optional) The proxies dictionary to apply to the request.\n        :param cert:\n            (optional) Any user-provided SSL certificate to be used for client\n            authentication (a.k.a., mTLS).\n        :rtype:\n            urllib3.HTTPConnectionPool\n        \"\"\"\n        assert _is_prepared(request)\n\n        proxy = select_proxy(request.url, proxies)\n        try:\n            host_params, pool_kwargs = self.build_connection_pool_key_attributes(\n                request,\n                verify,\n                cert,\n            )\n        except ValueError as e:\n            raise InvalidURL(e, request=request)\n        if proxy:\n            proxy = prepend_scheme_if_needed(proxy, \"http\")\n            proxy_url = parse_url(proxy)\n            if not proxy_url.host:\n                raise InvalidProxyURL(\n                    \"Please check proxy URL. It is malformed \"\n                    \"and could be missing the host.\"\n                )\n            proxy_manager = self.proxy_manager_for(proxy)\n            conn = proxy_manager.connection_from_host(\n                **host_params, pool_kwargs=pool_kwargs\n            )\n        else:\n            # Only scheme should be lower case\n            conn = self.poolmanager.connection_from_host(\n                **host_params, pool_kwargs=pool_kwargs\n            )\n\n        return conn\n\n    def get_connection(\n        self, url: str, proxies: dict[str, str] | None = None\n    ) -> HTTPConnectionPool:\n        \"\"\"DEPRECATED: Users should move to `get_connection_with_tls_context`\n        for all subclasses of HTTPAdapter using Requests>=2.32.2.\n\n        Returns a urllib3 connection for the given URL. This should not be\n        called from user code, and is only exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param url: The URL to connect to.\n        :param proxies: (optional) A Requests-style dictionary of proxies used on this request.\n        :rtype: urllib3.HTTPConnectionPool\n        \"\"\"\n        warnings.warn(\n            (\n                \"`get_connection` has been deprecated in favor of \"\n                \"`get_connection_with_tls_context`. Custom HTTPAdapter subclasses \"\n                \"will need to migrate for Requests>=2.32.2. Please see \"\n                \"https://github.com/psf/requests/pull/6710 for more details.\"\n            ),\n            DeprecationWarning,\n        )\n        proxy = select_proxy(url, proxies)\n\n        if proxy:\n            proxy = prepend_scheme_if_needed(proxy, \"http\")\n            proxy_url = parse_url(proxy)\n            if not proxy_url.host:\n                raise InvalidProxyURL(\n                    \"Please check proxy URL. It is malformed \"\n                    \"and could be missing the host.\"\n                )\n            proxy_manager = self.proxy_manager_for(proxy)\n            conn = proxy_manager.connection_from_url(url)\n        else:\n            # Only scheme should be lower case\n            parsed = urlparse(url)\n            url = parsed.geturl()\n            conn = self.poolmanager.connection_from_url(url)\n\n        return conn\n\n    def close(self) -> None:\n        \"\"\"Disposes of any internal state.\n\n        Currently, this closes the PoolManager and any active ProxyManager,\n        which closes any pooled connections.\n        \"\"\"\n        self.poolmanager.clear()\n        for proxy in self.proxy_manager.values():\n            proxy.clear()\n\n    def request_url(\n        self, request: PreparedRequest, proxies: dict[str, str] | None\n    ) -> str:\n        \"\"\"Obtain the url to use when making the final request.\n\n        If the message is being sent through a HTTP proxy, the full URL has to\n        be used. Otherwise, we should only use the path portion of the URL.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param proxies: A dictionary of schemes or schemes and hosts to proxy URLs.\n        :rtype: str\n        \"\"\"\n        assert _is_prepared(request)\n\n        proxy = select_proxy(request.url, proxies)\n        scheme = urlparse(request.url).scheme\n\n        is_proxied_http_request = proxy and scheme != \"https\"\n        using_socks_proxy = False\n        if proxy:\n            proxy_scheme = urlparse(proxy).scheme.lower()\n            using_socks_proxy = proxy_scheme.startswith(\"socks\")\n\n        url = request.path_url\n\n        if is_proxied_http_request and not using_socks_proxy:\n            url = urldefragauth(request.url)\n\n        return url\n\n    def add_headers(self, request: PreparedRequest, **kwargs: Any) -> None:\n        \"\"\"Add any headers needed by the connection. As of v2.0 this does\n        nothing by default, but is left for overriding by users that subclass\n        the :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` to add headers to.\n        :param kwargs: The keyword arguments from the call to send().\n        \"\"\"\n        pass\n\n    def proxy_headers(self, proxy: str) -> dict[str, str]:\n        \"\"\"Returns a dictionary of the headers to add to any request sent\n        through a proxy. This works with urllib3 magic to ensure that they are\n        correctly sent to the proxy, rather than in a tunnelled request if\n        CONNECT is being used.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param proxy: The url of the proxy being used for this request.\n        :rtype: dict\n        \"\"\"\n        headers: dict[str, str] = {}\n        username, password = get_auth_from_url(proxy)\n\n        if username:\n            headers[\"Proxy-Authorization\"] = _basic_auth_str(username, password)\n\n        return headers\n\n    def send(\n        self,\n        request: PreparedRequest,\n        stream: bool = False,\n        timeout: _t.TimeoutType = None,\n        verify: _t.VerifyType = True,\n        cert: _t.CertType = None,\n        proxies: dict[str, str] | None = None,\n    ) -> Response:\n        \"\"\"Sends PreparedRequest object. Returns Response object.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param stream: (optional) Whether to stream the request content.\n        :param timeout: (optional) How long to wait for the server to send\n            data before giving up, as a float, or a :ref:`(connect timeout,\n            read timeout) <timeouts>` tuple.\n        :type timeout: float or tuple or urllib3 Timeout object\n        :param verify: (optional) Either a boolean, in which case it controls whether\n            we verify the server's TLS certificate, or a string, in which case it\n            must be a path to a CA bundle to use\n        :param cert: (optional) Any user-provided SSL certificate to be trusted.\n        :param proxies: (optional) The proxies dictionary to apply to the request.\n        :rtype: requests.Response\n        \"\"\"\n\n        assert _is_prepared(request)\n\n        try:\n            conn = self.get_connection_with_tls_context(\n                request, verify, proxies=proxies, cert=cert\n            )\n        except LocationValueError as e:\n            raise InvalidURL(e, request=request)\n\n        self.cert_verify(conn, request.url, verify, cert)\n        url = self.request_url(request, proxies)\n        self.add_headers(\n            request,\n            stream=stream,\n            timeout=timeout,\n            verify=verify,\n            cert=cert,\n            proxies=proxies,\n        )\n\n        chunked = not (request.body is None or \"Content-Length\" in request.headers)\n\n        if isinstance(timeout, tuple):\n            try:\n                connect, read = timeout\n                resolved_timeout = TimeoutSauce(connect=connect, read=read)\n            except ValueError:\n                raise ValueError(\n                    f\"Invalid timeout {timeout}. Pass a (connect, read) timeout tuple, \"\n                    f\"or a single float to set both timeouts to the same value.\"\n                )\n        elif isinstance(timeout, TimeoutSauce):\n            resolved_timeout = timeout\n        else:\n            resolved_timeout = TimeoutSauce(connect=timeout, read=timeout)\n\n        try:\n            resp = conn.urlopen(\n                method=request.method,\n                url=url,\n                body=request.body,  # type: ignore[arg-type]  # urllib3 stubs don't accept Iterable[bytes | str]\n                headers=request.headers,  # type: ignore[arg-type]  # urllib3#3072\n                redirect=False,\n                assert_same_host=False,\n                preload_content=False,\n                decode_content=False,\n                retries=self.max_retries,\n                timeout=resolved_timeout,\n                chunked=chunked,\n            )\n\n        except (ProtocolError, OSError) as err:\n            raise ConnectionError(err, request=request)\n\n        except MaxRetryError as e:\n            if isinstance(e.reason, ConnectTimeoutError):\n                # TODO: Remove this in 3.0.0: see #2811\n                if not isinstance(e.reason, NewConnectionError):\n                    raise ConnectTimeout(e, request=request)\n\n            if isinstance(e.reason, ResponseError):\n                raise RetryError(e, request=request)\n\n            if isinstance(e.reason, _ProxyError):\n                raise ProxyError(e, request=request)\n\n            if isinstance(e.reason, _SSLError):\n                # This branch is for urllib3 v1.22 and later.\n                raise SSLError(e, request=request)\n\n            raise ConnectionError(e, request=request)\n\n        except ClosedPoolError as e:\n            raise ConnectionError(e, request=request)\n\n        except _Proxy
