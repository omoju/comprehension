<script type="application/json" id="data">{"title": "What Actually Reaches the Terminal: Two Strings and a Table Through Rich", "premise": "A caller wants styled, laid-out text on a terminal: colours, markup tags like [bold cyan]\\u2026[/bold cyan], and a four-column table that fits the available width \\u2014 without hand-writing ANSI escape sequences, without overflowing the line, and with the option to capture whatever was produced for later inspection. The data handed in is ordinary Python: two plain strings, one markup string, and a table of cell strings. Everything between that data and the bytes on the file object is Rich's job, and the owner of this code has to vouch for it: what it promises, where it decides on the caller's behalf, and how it fails.", "reader": "owner", "repo": {"name": "Textualize/rich", "url": "https://github.com/Textualize/rich", "commit": "9d8f9a372cc5916fd4781fec207ced7ddac2f08f"}, "chapters": [{"n": 1, "title": "The World the Data Enters", "data_in": "Console(color_system='auto', width=100, record=True, markup=True, emoji=True, highlight=True, highlighter=ReprHighlighter(), log_time_format='[%X]', ...)", "data_out": "a Console whose _color_system is None, width is fixed at 100, record is True, and whose file resolves to <_io.TextIOWrapper name='<stdout>' encoding='utf-8'>", "span": [2, 21], "md": "# Chapter 1 \u00b7 The World the Data Enters\n\n> **Enters as:** `Console(color_system='auto', force_terminal=None, soft_wrap=False, theme=None, file=None, quiet=False, width=100, height=None, style=None, no_color=None, tab_size=8, record=True, markup=True, emoji=True, highlight=True, log_time_format='[%X]', highlighter=ReprHighlighter(), legacy_windows=None, safe_box=True, _environ=None)`\n\nThe data has not arrived yet. Two short strings \u2014 `'Hello'` and `'World!'` \u2014 are still just literals in the caller's source, and the table is not even built. What exists first is the machine they will travel through, and that machine is assembled in a single constructor call before anything is printed.\n\nThe caller asks for very little: a width of 100 and `record=True`. Everything else is a default, and the defaults are where the interesting decisions live.\n\nThe first question the constructor asks is *where am I running*. `_is_jupyter()` looks for a `get_ipython` name in the global scope; there is none, so it returns `False` on a `NameError` without raising ([`console.py#L505-L522`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L505-L522)). Had it returned `True`, the width and height would have been taken from `JUPYTER_COLUMNS` / `JUPYTER_LINES` or defaulted to 115\u00d7100 ([`L657-L670`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L657-L670)). It didn't, so the caller's `width=100` stands untouched.\n\nNext, `detect_legacy_windows()` \u2014 `WINDOWS and not get_windows_console_features().vt` ([`L576-L578`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L576-L578)) \u2014 returns `False`, so `legacy_windows` is `False` ([`L678-L682`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L678-L682)). That flag matters later than you'd think: it is subtracted from the console width, it is passed to every box-drawing decision, and it chooses between the win32 API renderer and an ordinary `file.write` at the very end.\n\nBecause `width` was given explicitly, the block that reads `COLUMNS` from the environment is skipped ([`L684-L691`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L684-L691)), and `Console.size` will short-circuit to the stored value rather than calling `os.get_terminal_size` ([`L1012-L1013`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1012-L1013)). From here on, \"100 cells wide\" is a fact about this object, not about the terminal it happens to be attached to. That is a deliberate guarantee, and it is what makes the scenario's output reproducible.\n\nThen comes the decision that quietly governs every style in the run. `color_system='auto'` sends the constructor into `_detect_color_system` ([`L707-L712`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L707-L712)), which immediately asks `is_terminal` ([`L789-L811`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L789-L811)). `is_terminal` works down a list of overrides in order: an explicit `force_terminal`, an Idle check, Jupyter, the `TTY_COMPATIBLE` variable (`\"0\"` forces false, `\"1\"` forces true), `FORCE_COLOR`, and only then `file.isatty()` ([`L930-L976`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L930-L976)). To reach `isatty` it must first resolve `file`, which is `sys.stdout` here, possibly unwrapped from a `rich_proxied_file` and falling back to a null sink if it is `None` ([`L756-L763`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L756-L763)). The trace records the answer: `<_io.TextIOWrapper name='<stdout>' mode='w' encoding='utf-8'>`, and `isatty()` is `False`.\n\nNot a terminal, therefore `_detect_color_system` returns `None` ([`L793-L794`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L793-L794)), and `self._color_system` is `None`. The `'bold red'` the caller is about to pass will still be parsed into a real `Style` and carried the entire length of the pipeline \u2014 but at the final step `Style.render` returns its text unchanged whenever `color_system is None` ([`style.py#L710-L711`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L710-L711)). The colour is decided here, once, at construction, by sniffing the output file.\n\n> **For the owner:** Colour is auto-detected at construction, not at write time, so redirecting the console's `file` afterwards will not re-run the detection. If you need colour in a pipe or a CI log, set `force_terminal=True` on the constructor or set `FORCE_COLOR` / `TTY_COMPATIBLE=1` in the environment ([`console.py#L955-L966`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L955-L966)). Note also that `is_terminal` swallows a `ValueError` from `isatty()` on a closed file and reports \"not a terminal\" rather than raising ([`console.py#L969-L976`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L969-L976)).\n\nThe remaining construction is bookkeeping, but two pieces matter. A `LogRender` is built from the logging defaults \u2014 `show_time=True`, `show_path=True`, `time_format='[%X]'` \u2014 and stashed on the console ([`L715-L719`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L715-L719), [`_log_render.py#L15-L30`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_log_render.py#L15-L30)). Our data never touches it \u2014 `print` does not use `LogRender`; only `log` does \u2014 but it is constructed eagerly either way. And a `ThemeStack` is wrapped around `themes.DEFAULT` inside a `ConsoleThreadLocals` ([`L745-L747`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L745-L747), [`theme.py#L88-L91`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/theme.py#L88-L91)). That stack holds every named style \u2014 `repr.number`, `table.header`, `log.time` \u2014 and it is *thread-local*, alongside the output buffer and buffer index, so two threads printing to the same console get independent buffers and independent theme stacks.\n\nFinally, because `record=True`, `self._record_buffer` is created empty and a second lock, `_record_buffer_lock`, is created to guard it ([`L744-L748`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L744-L748)). Nothing is recorded yet. The scenario's closing `console.export_text()` depends on this flag having been set *before* any printing happened; it cannot be enabled retroactively.\n\n> **For the owner:** `record=True` makes the console keep a copy of every segment it writes, appended under `_record_buffer_lock` and never trimmed except by an `export_*` call ([`console.py#L2063-L2065`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2063-L2065)). Do not enable it on a long-lived console unless something drains it; memory growth is proportional to total output.\n\nThe object the data will meet is now fixed: 100 cells wide, writing to stdout, encoding `utf-8`, markup on, emoji on, highlighting on, colour off, recording on. The strings can arrive.\n\n> **Leaves as:** a `Console` with `_color_system = None`, `legacy_windows = False`, `is_jupyter = False`, `_width = 100`, `record = True`, an empty `_record_buffer`, a `LogRender(show_time=True, show_path=True, time_format='[%X]')`, a default-themed `ThemeStack`, and `file` resolving to `<_io.TextIOWrapper name='<stdout>' mode='w' encoding='utf-8'>`\n"}, {"n": 2, "title": "Two Strings Become One Text", "data_in": "objects=('Hello', 'World!'), sep=' ', end='\\n'", "data_out": "[<text 'Hello World!' [] ''>] \\u2014 a single Text with no style spans", "span": [22, 129], "md": "# Chapter 2 \u00b7 Two Strings Become One Text\n\n> **Enters as:** `objects=('Hello', 'World!')`, `sep=' '`, `end='\\n'`, `style='bold red'`, every other print argument `None`\n\nThe call lands in `Console.print` ([`console.py#L1652-L1669`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1652-L1669)). Before the two strings are looked at, two guards run past them. `objects` is non-empty, so the \"print nothing\" substitution of a `NewLine()` is skipped ([`L1689-L1693`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1689-L1693)); `soft_wrap` is `None` and falls back to the console's `False`, so no-wrap and overflow stay unset and `crop` stays `True` ([`L1695-L1702`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1695-L1702)). That last decision is a promise cashed in much later: because `crop` is still `True`, every line this print produces will be measured and truncated against the console width before it reaches the file.\n\nThen `with self:` ([`L1704`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1704)) enters the buffer context \u2014 `__enter__` calls `_enter_buffer`, which bumps the thread-local `_buffer_index` from `0` to `1` ([`L857-L860`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L857-L860), [`L813-L815`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L813-L815)). Nothing will be written until that index comes back to zero. The strings are now inside a transaction.\n\n## Being admitted\n\n`_collect_renderables` takes the tuple and walks it ([`L1500-L1587`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1500-L1587)). Before the loop it chooses a highlighter: `highlight` is `None` and the console's `_highlight` is `True`, so `_highlighter` becomes the console's `ReprHighlighter` rather than the no-op `NullHighlighter` ([`L1546-L1548`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1546-L1548)).\n\n`'Hello'` is first put through `rich_cast` ([`protocol.py#L18-L41`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/protocol.py#L18-L41)), which repeatedly calls `__rich__` on anything that has one. A plain `str` has none, so it comes straight back as `'Hello'`. The loop is worth knowing in outline, because it is where Rich decides what kind of thing you handed it: a `str` is rendered to `Text`, an existing `Text` is taken as-is, anything satisfying the `ConsoleRenderable` protocol is appended untouched, anything \"expandable\" (list, dict, dataclass\u2026) is wrapped in `Pretty`, and everything else is stringified through the highlighter ([`L1556-L1579`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1556-L1579)). Our strings take the first branch.\n\n## Becoming Text\n\n`render_str` is where the three content defaults are resolved ([`L1437-L1439`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1437-L1439)): `emoji`, `markup` and `highlight` are all `None` on this call, so all three take the console's value \u2014 all `True`.\n\nMarkup being enabled sends `'Hello'` into `markup.render` ([`L1441-L1449`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1441-L1449)). The first thing that function does is check for a `[`; there isn't one, so it takes the fast path \u2014 emoji substitution and a plain `Text`, with the tag parser never entered ([`markup.py#L127-L132`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L127-L132)).\n\n`_emoji_replace` runs the regex `(:(\\S*?)(?:(?:\\-)(emoji|text))?:)` over the text and looks each name up in the `EMOJI` table ([`_emoji_replace.py#L9-L31`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_emoji_replace.py#L9-L31)). `'Hello'` has no colons, so it returns `'Hello'` unchanged. The important detail for an unknown code is the `except KeyError: return emoji_code` at [`L28-L29`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_emoji_replace.py#L28-L29): a name Rich doesn't recognise is put back verbatim rather than raising.\n\nThen `Text.__init__` ([`text.py#L144-L165`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L144-L165)) does the one thing that happens to *every* string printed through Rich: `strip_control_codes` ([`L156`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L156)). That is a `str.translate` with a table mapping bell, backspace, vertical tab, form feed and carriage return to `None` ([`control.py#L181-L192`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/control.py#L181-L192), table at [`L9-L18`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/control.py#L9-L18)). `'Hello'` survives intact, and the trace records the result: `<text 'Hello' [] ''>` \u2014 plain text, no spans, no style.\n\n> **For the owner:** Rich deletes five control characters from every string it renders, silently and without a flag to turn it off. Treat `\\r`, `\\b`, `\\a`, `\\v` and `\\f` as unprintable through this API, and do not use Rich's `print` for carriage-return-based progress tricks or for any text whose byte-for-byte fidelity matters. Note that ESC (`0x1b`) is *not* in that list \u2014 raw ANSI sequences pass through; use `Text.from_ansi` if you need them decoded rather than emitted.\n\n## Being highlighted anyway\n\nHighlighting is on, so the freshly-made `Text` does not go straight back. `render_str` stringifies it and hands it to the `ReprHighlighter` ([`L1462-L1466`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1462-L1466)). `Highlighter.__call__` builds a *second* `Text` from the string \u2014 another `strip_control_codes` pass \u2014 and calls `highlight` on it ([`highlighter.py#L32-L39`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/highlighter.py#L32-L39)). `RegexHighlighter.highlight` then runs `highlight_regex` once per pattern in `highlights` ([`L75-L77`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/highlighter.py#L75-L77)); `ReprHighlighter` has four of them \u2014 tags, `name=value` pairs, braces, and one big combined alternation covering numbers, paths, URLs, UUIDs, IP addresses, quoted strings, `True`/`False`/`None` and more ([`L84-L103`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/highlighter.py#L84-L103)). Each named regex group becomes a `Span` prefixed with `repr.` ([`text.py#L618-L630`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L618-L630)).\n\nThe trace shows the first pass returning `0` and three more passes behind it. `'Hello'` matches nothing, so the highlighted copy is still `<text 'Hello' [] ''>`. `copy_styles` merges the (empty) span list from the markup-rendered original back onto it ([`text.py#L1054-L1060`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L1054-L1060)), and the highlighted copy is what `render_str` returns.\n\n`'World!'` takes exactly the same road and arrives as `<text 'World!' [] ''>`.\n\n> **For the owner:** Markup, emoji and automatic highlighting are all on by default and all apply to whatever string you pass, including data you did not write. A `:name:` sequence becomes an emoji, a number or a `/path` or a `\"quoted string\"` acquires a style you never asked for, and square brackets are parsed as tags (which can raise \u2014 see Chapter 5). Pass `markup=False, emoji=False, highlight=False` per call, or set them on the `Console`, whenever you print untrusted or machine-readable content. `Console.out` already does exactly that ([`console.py#L1639-L1650`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1639-L1650)).\n\n## Becoming one\n\nBoth `Text` objects were accumulated in a local list, not appended to the result yet. `check_text` closes them out ([`L1550-L1554`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1550-L1554)): it builds a separator `Text(' ', justify=None, end='\\n')` and calls `sep_text.join([...])`.\n\n`Text.join` ([`text.py#L778-L815`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L778-L815)) starts from a `blank_copy` of the separator \u2014 so the result inherits the separator's `style`, `justify`, `overflow`, `no_wrap`, `end` and `tab_size`, which is how `end='\\n'` makes it onto the joined text. Its inner `iter_text` generator interleaves the pieces with the separator using `loop_last` ([`_loop.py#L18-L28`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_loop.py#L18-L28)), and the trace shows the alternation plainly: `'Hello'` (length 5), `' '` (length 1), `'World!'` (length 6), then `None` to stop.\n\nThe accounting in that loop is the part that matters. For each piece, `join` extends the text fragments, re-emits the piece's own `style` as a span over `[offset, offset + len)`, and shifts every one of the piece's existing spans by `offset` ([`L805-L814`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L805-L814)). Styles survive concatenation because their offsets are rewritten, not because the strings happen to be short. Here there are no styles to carry, so `_spans` stays empty and `_length` ends at `0 + 5 + 1 + 6 = 12`.\n\nThe two strings the caller typed are now one object: `<text 'Hello World!' [] ''>`, returned as a single-element list ([`L1581-L1587`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1581-L1587) \u2014 `self.style` is `None` on this console, so the `Styled` wrapping step is skipped). Nothing has been measured, wrapped or written. That starts next.\n\n> **Leaves as:** `[<text 'Hello World!' [] ''>]` \u2014 one `Text`, plain `'Hello World!'`, `len` 12, `spans == []`, `style == ''`, `end == '\\n'`\n"}, {"n": 3, "title": "Measuring the Room and Naming the Colour", "data_in": "<text 'Hello World!' [] ''> plus style='bold red' and the Console's current size", "data_out": "ConsoleOptions(size=100x25, min_width=1, max_width=100, is_terminal=False, encoding='utf-8') and Style(color=Color('red', STANDARD, number=1), bold=True)", "span": [130, 163], "md": "# Chapter 3 \u00b7 Measuring the Room and Naming the Colour\n\n> **Enters as:** `[<text 'Hello World!' [] ''>]` held inside `print`, with `style='bold red'` still an uninterpreted string and no idea yet how wide the world is\n\nThe joined `Text` is sitting in a local list. Before anything renders it, `print` has to answer two questions on its behalf: how much room there is, and what `'bold red'` actually means. Both answers are computed fresh, here, on every call.\n\n## How wide is the world\n\n`print` asks `self.options` ([`console.py#L1716`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1716-L1724)). That property is small but it pulls on three others ([`L990-L1002`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L990-L1002)).\n\nFirst `Console.size` ([`L1004-L1043`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1004-L1043)). The scenario pinned `width=100` but left height alone, so the fast path at [`L1012-L1013`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1012-L1013) \u2014 which requires *both* to be set \u2014 is skipped. `is_dumb_terminal` is consulted next ([`L1015-L1016`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L978-L988)), and the trace shows it reaching all the way down through `is_terminal` to `Console.file` and back with `False` \u2014 the same `<_io.TextIOWrapper name='<stdout>'>` and the same `False` as in Chapter 1, recomputed from scratch because none of these are cached. Then the method queries `os.get_terminal_size` on each standard stream ([`L1021-L1028`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1021-L1028)), swallowing `AttributeError`, `ValueError` and `OSError`, and then lets `COLUMNS` and `LINES` from the environment override whatever it found ([`L1030-L1035`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1030-L1035)). None of that matters for width: the final return re-asserts the explicit `self._width` and only falls back to the detected value when it is `None` ([`L1038-L1043`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1038-L1043)). The trace records the answer: `ConsoleDimensions(width=100, height=25)` \u2014 100 because the caller said so, 25 because nothing could be detected and `height or 25` took over.\n\nThen `Console.encoding` ([`L921-L928`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L921-L928)) reads `.encoding` off the file object and lowercases it, defaulting to `'utf-8'` twice over \u2014 once if the attribute is missing, once if it is present but falsy. Here stdout reports `utf-8`. That string is not decoration: `ConsoleOptions.ascii_only` is defined as `not self.encoding.startswith(\"utf\")` ([`L142-L145`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L142-L145)), and that is the flag the table's box characters will consult in Chapter 8.\n\nThe result is one `ConsoleOptions` dataclass: `size=(100, 25)`, `legacy_windows=False`, `min_width=1`, `max_width=100`, `is_terminal=False`, `encoding='utf-8'`, `max_height=25`, and every content override (`justify`, `overflow`, `highlight`, `markup`, `height`) `None`, with `no_wrap` at its dataclass default of `False`.\n\n## A copy for the journey\n\n`print` immediately calls `update` on it ([`L157-L192`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L157-L192)). The trace shows what arrives: `width`, `min_width` and `max_width` are the sentinel `NoChange` instance, and `justify`, `overflow`, `no_wrap`, `highlight`, `markup`, `height` are all literal `None`. That distinction is the whole design of the method \u2014 `None` is a *value* that means \"no override\", and `NO_CHANGE` is the only way to say \"leave it alone\". So the three width fields survive untouched while `no_wrap` is actually overwritten, going from `False` to `None`. (That is why the very next thing the `Text` meets, `pick_bool(self.no_wrap, options.no_wrap, False)`, falls through two `None`s to the literal `False` at trace line 175.)\n\nThe first line of `update` is `options = self.copy()` ([`L171`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L171)), and `copy` builds a new instance with a shallow-copied `__dict__` ([`L147-L155`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L147-L155)). Every option-narrowing method in the file does this. It is the reason a nested renderable \u2014 a cell inside a table inside a panel \u2014 cannot widen or re-justify its parent by mutating what it was handed.\n\nThe road not taken sits one line below, at [`L1719`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1719): had the caller passed `width=200`, it would have been clamped by `min(width, self.width)` before reaching `update`. The console width is a ceiling a caller can lower but not raise.\n\n> **For the owner:** `max_width` is advice, not enforcement. It is copied down the render tree and well-behaved renderables respect it, but nothing in `ConsoleOptions` stops a third-party `__rich_console__` from emitting a 400-cell line. The actual guarantee is the crop in Chapter 5, which runs over the finished segments regardless of who produced them \u2014 and which `soft_wrap=True` or `crop=False` switches off. If you accept custom renderables from elsewhere, keep `crop` at its default.\n\n## Naming the colour\n\nBecause `style` is not `None`, `print` resolves it before rendering ([`L1733`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1729-L1741)). `Console.get_style('bold red')` ([`L1470-L1498`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1470-L1498)) first asks the thread-local `ThemeStack` ([`theme.py#L88-L91`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/theme.py#L88-L91)), whose `get` is bound directly to the top dict's `.get`. `'bold red'` is a *definition*, not a theme name like `repr.number`, so the lookup returns `None` and the string falls through to `Style.parse` ([`L1489-L1492`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1488-L1492)).\n\n`Style.parse` ([`style.py#L496-L561`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L496-L561)) is a word-by-word state machine: `on` consumes the next word as a background colour, `not` negates the following attribute, `link` takes a URL, a word in `STYLE_ATTRIBUTES` sets a flag, and anything else must parse as a colour. `'bold'` is in the attribute table ([`L549-L550`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L549-L550)); `'red'` falls to the final `else` and `Color.parse` accepts it ([`L552-L559`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L552-L559)). The trace shows the constructor turning it into `Color('red', ColorType.STANDARD, number=1)` ([`L155-L158`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L155-L158)) \u2014 the 8-colour ANSI red, index 1, not a 24-bit triplet. The attribute flags become two integer bitmasks, `_set_attributes` recording *which* attributes were mentioned and `_attributes` recording their values ([`L160-L197`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L160-L197)), which is what makes \"bold is off\" distinguishable from \"bold was never set\".\n\nBack in `get_style`, the last line decides whether to hand out the cached object or a copy: `style.copy() if style.link else style` ([`L1492`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1492)). The trace duly checks `Style.link` ([`style.py#L457-L460`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L457-L460)) and gets `None`, so the caller receives the very object `Style.parse` cached \u2014 `parse` is wrapped in `lru_cache(maxsize=4096)` ([`L496-L498`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L496-L498)). Sharing is safe because `Style` is slotted and has no setters ([`L75-L87`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L75-L87)); styles that carry a hyperlink are the exception, because each use needs a fresh `_link_id`.\n\n> **For the owner:** A style name that does not parse is a hard failure at print time, not a silent fallback to plain text: `StyleSyntaxError` from `parse` becomes `errors.MissingStyle` ([`console.py#L1493-L1498`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1493-L1498)) and propagates out of `print`. That is usually what you want for a typo in your own source, but it means a style string built from configuration or user input can take down a logging call. Pass `default=` to `get_style` when the style name is not a literal you control.\n\nThe two answers are in hand: a `ConsoleOptions` describing a hundred-cell, non-terminal, UTF-8 world, and a `Style` carrying red and bold. The `Text` has not moved yet.\n\n> **Leaves as:** `ConsoleOptions(size=ConsoleDimensions(100, 25), legacy_windows=False, min_width=1, max_width=100, is_terminal=False, encoding='utf-8', max_height=25, justify=None, overflow=None, no_wrap=None, highlight=None, markup=None, height=None)` and `Style(color=Color('red', ColorType.STANDARD, number=1), bold=True)`\n"}, {"n": 4, "title": "From Text to Segments: Wrapping, Cells, and the Style Stack", "data_in": "<text 'Hello World!' [] ''> rendered under ConsoleOptions(max_width=100) with render_style=Style(red, bold)", "data_out": "([Segment('Hello World!')], True) from split_lines_terminator, restyled into Segment('Hello World!', Style(red, bold)) followed by Segment('\\n')", "span": [164, 320], "md": "# Chapter 4 \u00b7 From Text to Segments: Wrapping, Cells, and the Style Stack\n\n> **Enters as:** `<text 'Hello World!' [] ''>`, to be rendered under `ConsoleOptions(max_width=100)` with `render_style=Style(color=Color('red', ColorType.STANDARD, number=1), bold=True)`\n\nBecause `style` was given, `print` takes the lower of its two branches ([`console.py#L1729-L1741`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1729-L1741)). First it makes a spare newline to hand out later \u2014 `Segment.line()` ([`segment.py#L181-L184`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L181-L184)) returns `Segment('\\n')` \u2014 and then it opens the pipeline that the `Text` will travel down: `Segment.split_lines_terminator(render(renderable, render_options))`.\n\nNothing has actually happened yet. `Console.render` is a generator; so is `split_lines_terminator`. The whole chapter is driven by the `for` loop pulling items out of the far end.\n\n## The gate\n\nThe first pull enters `Console.render` ([`console.py#L1294-L1343`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1294-L1343)). Two checks guard the door. The width guard at [`L1311-L1314`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1311-L1314) returns an empty render when `max_width < 1` \u2014 the comment says why: it prevents recursion errors when a container keeps subdividing an already-zero-width space. With `max_width=100` the `Text` walks straight past it.\n\nThen `rich_cast` runs again ([`L1317`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1317)) \u2014 the trace shows it handing the `Text` back unchanged \u2014 and the object is sorted into one of exactly three kinds: something with `__rich_console__`, a bare `str`, or an error ([`L1318-L1329`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1318-L1329)). `Text` has the method, so its own render method is asked for an iterable.\n\n> **For the owner:** `Console.render` is the only entry point for arbitrary objects, and it rejects anything it cannot handle with `errors.NotRenderableError` naming the object ([`console.py#L1325-L1329`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1325-L1329)). Note that this raises from inside `print`, lazily, as the generator is consumed \u2014 so a bad object reaches you as an exception at output time, not when it was constructed. If you print values of uncertain type, catch `rich.errors.NotRenderableError` at the call site or convert with `str()` first.\n\nBefore the loop that drains the result, `render` calls `_options.reset_height()` ([`L1338`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1337-L1343)) \u2014 another copy, this one clearing `height` so a fixed height set for a parent is not silently inherited by its children.\n\n## Measuring in cells, not characters\n\n`Text.__rich_console__` ([`text.py#L689-L705`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L689-L705)) resolves the three layered defaults \u2014 `justify` falls through `self.justify` and `options.justify` to `'default'`, `overflow` to `'fold'` \u2014 and asks `pick_bool(self.no_wrap, options.no_wrap, False)` ([`_pick.py#L4-L17`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_pick.py#L4-L17)) whether wrapping is off. Both candidates are `None`, so it returns the literal `False`: wrap.\n\n`Text.wrap` ([`text.py#L1201-L1250`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L1201-L1250)) splits on newlines first ([`L1230`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L1230)); `'Hello World!'` has none, so `split` takes its early return and hands back `Lines([<text 'Hello World!'>])` built from a copy ([`L1082-L1083`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L1082-L1083)). No tab is present, so `expand_tabs` is skipped, and the single line goes to `divide_line(str(line), 100, fold=True)` ([`L1239`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L1239)).\n\nThis is where the width promise becomes arithmetic ([`_wrap.py#L26-L78`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_wrap.py#L26-L78)). The `words` generator ([`L12-L23`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_wrap.py#L12-L23)) yields `(0, 6, 'Hello ')` \u2014 a word plus its trailing whitespace. The loop measures the word twice: `cell_len(word.rstrip())` is 5, which is what must fit, and `cell_len(word)` is 6, which is what the cursor advances by ([`L45-L50`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_wrap.py#L44-L50)). Trailing spaces are allowed to run off the end of a line; visible characters are not. Then `(6, 12, 'World!')`, length 6 against 94 remaining. Both fit, and the trace records the return: `[]` \u2014 no break positions.\n\nThe unit is a *terminal cell*, not a Python character. `cell_len` ([`cells.py#L98-L110`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/cells.py#L98-L110)) routes strings under 512 characters through an LRU cache of 4096 entries and falls through to `_cell_len`, which has a fast path: if every character is in the frozen set of known single-cell ranges, the answer is just `len(text)` ([`L124-L125`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/cells.py#L124-L125)). ASCII takes that path. Anything else is looked up in a per-Unicode-version width table by binary search ([`L46-L78`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/cells.py#L46-L78)), so a CJK glyph counts as two and a zero-width joiner sequence counts once. This is the reason Rich's columns line up with text that `len()` would get wrong.\n\nThe road not taken is one branch down: had a word been wider than the whole line, `fold=True` would have sent it to `chop_cells` and broken it mid-word across several lines ([`_wrap.py#L54-L66`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/_wrap.py#L54-L66)); with `fold=False` it would have been cropped instead.\n\nWith no offsets, `Text.divide([])` returns a single-line `Lines` from another copy ([`text.py#L1117-L1118`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L1117-L1118)). `rstrip_end(100)` sees a length of 12 and does nothing ([`L666-L678`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L666-L678)). `Lines.justify` is called with `justify='default'`, which matches none of its four branches \u2014 left, center, right, full ([`containers.py#L129-L167`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/containers.py#L129-L167)) \u2014 and returns having touched nothing. `truncate(100, overflow='fold')` measures 12 cells against 100 and leaves the text alone ([`text.py#L873-L884`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L873-L884)). The `Text` comes out of `wrap` exactly as it went in, having been copied three times on the way.\n\n## Spans into segments\n\nBack in `__rich_console__`, the lines are rejoined with `Text(\"\\n\").join(lines)` ([`text.py#L704`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L704)) \u2014 the same offset-shifting join from Chapter 2, here with one element and so no separator inserted \u2014 and the result is handed to `Text.render(console, end=self.end)` with `end='\\n'`.\n\n`Text.render` ([`text.py#L719-L776`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L719-L776)) checks `self._spans` first. There are none, so it takes the four-line fast path: one `Segment` for the text, one for the end character, return ([`L731-L735`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L731-L735)). The trace shows the first of those surfacing all the way up through `Console.render` as `Segment('Hello World!')`.\n\nThe machinery below that fast path is the style stack the chapter is named for, and the markup string and the table cells will both use it. It builds a list of `(offset, leaving, style_id)` events \u2014 one for each span start, one for each span end \u2014 sorts them, and walks the text between consecutive offsets while pushing and popping ids on a stack ([`L738-L774`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/text.py#L738-L774)). At each step the active styles are combined, with the result cached by the tuple of ids. Overlapping spans therefore *compose* rather than overwrite: `[bold][red]\u2026[/red][/bold]` yields one segment carrying both, not two fighting segments.\n\n## Line endings, and the style arriving last\n\n`split_lines_terminator` ([`segment.py#L275-L304`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L275-L304)) accumulates the first segment, then receives `Segment('\\n')`, splits on the newline, and yields what the trace records at line 300: `([Segment('Hello World!')], True)`. The newline has been converted from a character into a flag. Control segments are deliberately excluded from this splitting (`and not segment.control` at [`L291`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L291)), so an escape sequence that happens to contain a newline byte cannot be chopped in half.\n\nNow the style finally meets the text. `Segment.apply_style(line, render_style)` ([`segment.py#L186-L225`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L186-L225)) checks the style is truthy and returns a *generator expression* \u2014 trace line 304 shows exactly that object \u2014 which `extend` then drains, which is why `Style.__add__` only appears at trace line 305. For each segment it computes `style + segment.style` ([`L208-L211`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L208-L211)), and crucially passes `None` as the style for control segments so cursor codes are never wrapped in SGR sequences.\n\nThe segment's own style is `None` here, so `Style._add` returns `self` immediately ([`style.py#L733-L735`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L732-L735)); `__add__` then checks for a link, finds none, and hands back the same cached red-bold object ([`L757-L759`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L757-L759)). The `Style.__hash__` call at trace line 306 is the `lru_cache` key being computed for `_add`.\n\n> **For the owner:** Note the direction of that addition: `apply_style` composes as *base + segment*, so the `style=` argument to `print` sits **underneath** whatever styles the renderable already carried. In `Style._add` the right-hand side's set attributes win ([`style.py#L743-L748`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L743-L748)). A per-call `style=\"bold red\"` is therefore a floor, not an override \u2014 markup spans and table cell styles will beat it on any attribute they both set. Do not rely on `style=` to force a colour onto content you do not control.\n\nThe `for` loop appends the spare `Segment('\\n')` because `add_new_line` was `True`, then asks for a second line. Both generators resume where they stopped \u2014 the trace shows those resumptions at lines 313\u2013320 as calls returning `None` \u2014 find nothing left, and finish. `Console.render` is lazy and single-use; what you get back is a stream, consumed once.\n\n`new_segments` now holds two items, which is where Chapter 5 picks them up.\n\n> **Leaves as:** `new_segments == [Segment('Hello World!', Style(color=Color('red', ColorType.STANDARD, number=1), bold=True)), Segment('\\n')]`\n"}, {"n": 5, "title": "Cropping, the Buffer, and the Single Write", "data_in": "[Segment('Hello World!', Style(red, bold)), Segment('\\n')], then the markup string 'Where there is a [bold cyan]Will[/bold cyan] there [u]is[/u] a [i]way[/i].'", "data_out": "'Hello World!\\n' and then 'Where there is a Will there is a way.\\n' written to stdout and flushed; self._buffer emptied each time", "span": [321, 377], "md": "# Chapter 5 \u00b7 Cropping, the Buffer, and the Single Write\n\n> **Enters as:** `new_segments == [Segment('Hello World!', Style(color=Color('red', ColorType.STANDARD, number=1), bold=True)), Segment('\\n')]` \u2014 with the second string, `'Where there is a [bold cyan]Will[/bold cyan] there [u]is[/u] a [i]way[/i].'`, still waiting its turn\n\nTwo segments, a list, in memory. Nothing has been written yet. Between here and the file there are three gates: a crop, a buffer, and a single `write`.\n\n## The crop\n\n`print` skips the `new_line_start` branch ([`console.py#L1743-L1748`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1743-L1748)) \u2014 the caller left it `False` \u2014 and arrives at `if crop:` ([`L1749-L1756`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1749-L1756)). It looks up `self._buffer`, the thread-local list ([`L770-L773`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L770-L773)), which the trace shows as empty, and asks `self.width` for the cropping length. That property re-derives the size from scratch ([`L1056-L1063`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1056-L1063)); because `_width` was pinned in the constructor, whatever else `Console.size` consults, the final width it reports is the 100 the caller asked for ([`L1040-L1043`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1040-L1043)).\n\n`Segment.split_and_crop_lines(new_segments, 100, pad=False)` ([`segment.py#L306-L351`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L306-L351)) accumulates the first segment, meets the `'\\n'`, and hands the accumulated line \u2014 the text segment alone \u2014 to `adjust_line_length` ([`L353-L396`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L353-L396)). That function sums `segment.cell_length`, which is `0` for control segments and `cell_len(text)` otherwise ([`L78-L86`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L78-L86)), and the trace records the measurement: 12 cells. Twelve is less than a hundred, and `pad=False`, so the line is returned as a shallow copy, unchanged ([`L375-L379`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L375-L379)). Because `include_new_lines` defaults to `True`, a fresh `Segment('\\n')` is appended ([`L344-L346`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L344-L346)), and the trace shows the yielded line: `[Segment('Hello World!', Style(...)), Segment('\\n')]`. A second pull from the generator finds nothing left.\n\nThe branch not taken is the interesting one. Had the line measured more than 100 cells, `adjust_line_length` would have walked the segments accumulating width and cut the one that crossed the boundary with `set_cell_size` ([`L380-L393`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/segment.py#L380-L393)), discarding everything after it \u2014 and if the cut fell inside a double-width glyph, that glyph becomes spaces so the visible width still comes out exact.\n\n> **For the owner:** This is the only unconditional enforcement of the console width. `ConsoleOptions.max_width` is advice that well-behaved renderables honour; `split_and_crop_lines` at `self.width` is the floor under them, and it runs for every line regardless of what produced it ([`console.py#L1749-L1754`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1749-L1754)). Passing `crop=False`, or `soft_wrap=True` which sets `crop = False` for you ([`console.py#L1695-L1702`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1695-L1702)), removes it \u2014 after that a third-party `__rich_console__` can emit lines wider than the terminal. Treat `soft_wrap` as switching off the width guarantee, not as a formatting preference.\n\n## The buffer closes\n\nThe cropped line is extended into `self._buffer`, and the `with self:` block that has wrapped the whole of `print` since Chapter 2 now exits. `Console.__exit__` ([`L862-L864`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L862-L864)) calls `_exit_buffer`, which decrements `_buffer_index` from 1 to 0 and then calls `_check_buffer` ([`L817-L820`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L817-L820)).\n\n`_check_buffer` ([`L2044-L2057`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2044-L2057)) has one early exit \u2014 if `self.quiet` were set, the buffer would be deleted and the output silently dropped \u2014 and otherwise calls `_write_buffer` inside a `try` that catches `BrokenPipeError`.\n\nInside `_write_buffer` ([`L2059-L2130`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2059-L2130)) the console takes its re-entrant lock and checks `self.record and not self._buffer_index` ([`L2063-L2065`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2063-L2065)). Both hold \u2014 the trace shows the index read as `0` and the buffer read immediately after \u2014 so a copy of exactly these two segments is appended to `_record_buffer` under a *separate* lock. The recording happens before the write and contains precisely what will be written.\n\nThen `_buffer_index == 0` again ([`L2067`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2067)), not Jupyter, not Windows, so the data takes the short final branch ([`L2121-L2127`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2121-L2127)): render the buffer to a string, write it, flush, delete.\n\n## Segments become a string\n\n`_render_buffer` ([`L2132-L2154`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2132-L2154)) caches three decisions up front \u2014 the colour system (`None`), legacy Windows (`False`), and `not_terminal`, which the trace shows being computed as `is_terminal` returns `False`. Then one pass over the segments: a segment with a truthy style goes through `Style.render`; a styleless segment is appended verbatim *unless* it is a control segment on a non-terminal, in which case it is dropped ([`L2141-L2151`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2141-L2151)). That last clause is why piping Rich output to a file does not fill it with cursor-movement junk.\n\nThe red-bold style is truthy, so `Style.render('Hello World!', color_system=None, legacy_windows=False)` is called \u2014 and returns the text untouched, because the very first line of the method short-circuits on a `None` colour system ([`style.py#L710-L711`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L710-L711)). This is where the question left open in Chapter 1 is settled: the style was parsed, cached, composed onto the segment, and carried the whole way here, and at the last step it costs nothing and produces nothing. The trace shows the return: `'Hello World!'`. Joined with the newline segment, `_render_buffer` gives back `'Hello World!\\n'`.\n\n`self.file` is resolved twice \u2014 once for `write`, once for `flush` \u2014 and `del self._buffer[:]` leaves the console clean for the next call.\n\n> **For the owner:** Two guarantees and two failure modes live in this block. One `print` is one `write` plus one `flush`, taken under `self._lock`, so concurrent prints cannot interleave partial lines and a crash mid-render leaves nothing on screen rather than half a table. The failure modes are both loud: a `BrokenPipeError` is routed to `on_broken_pipe`, whose default sets `quiet`, redirects stdout to `/dev/null` and raises `SystemExit(1)` ([`console.py#L2030-L2042`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2030-L2042)) \u2014 override that method if your service must survive a closed pipe. A `UnicodeEncodeError` is re-raised with a `PYTHONIOENCODING` hint appended ([`console.py#L2125-L2127`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2125-L2127)). The quiet path is the only silent one: setting `Console.quiet` discards output without telling anyone ([`console.py#L2050-L2052`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L2050-L2052)).\n\n## The second string, and the tag parser\n\nThe trace folds the second `print` into a single line \u2014 the same path, the same gates \u2014 but one thing differs at the start of it. `'Where there is a [bold cyan]Will[/bold cyan] there [u]is[/u] a [i]way[/i].'` contains a `[`, so `markup.render` cannot take the fast path it used for `'Hello'` and `'World!'` ([`markup.py#L128-L132`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L128-L132)). It runs the parser.\n\n`_parse` ([`markup.py#L73-L104`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L73-L104)) walks `RE_TAGS` and yields `(position, text, tag)` triples, handling backslash escapes on the way: an even number of backslashes becomes literal backslashes, an odd one escapes the following tag so it is emitted as text ([`L88-L98`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L88-L98)). `render` appends plain text to a growing `Text`, pushes each opening tag onto a stack paired with the current text length ([`L219-L221`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L219-L221)), and on each closing tag pops the matching entry and emits a `Span` over the enclosed range ([`L159-L217`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L159-L217)).\n\nBoth sides of a pair are passed through `Style.normalize` ([`style.py#L387-L402`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L387-L402)), which round-trips the definition through `Style.parse`. That is why `[u]` matches `[/u]` and both become the span style `'underline'`, and why `[i]`/`[/i]` become `'italic'`. Tags still open when the string ends are closed silently at the full text length ([`markup.py#L223-L228`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L223-L228)); a closing tag with nothing to close is not silent \u2014 it raises `MarkupError` ([`L164-L176`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L164-L176)).\n\nFrom there the three spans ride through `Text.render`'s style stack (the machinery described in Chapter 4), each becoming a `Segment` carrying a composed `Style` \u2014 and each of those styles, like the red-bold one before it, renders to nothing at the final step. The export at the end of the run confirms what landed: the recorded text begins `'Hello World!\\nWhere there is a Will t\u2026'`.\n\n> **For the owner:** Markup is on by default for every string `print` and `log` touch. Any caller-supplied string containing `[...]` is *interpreted*: at best it injects styles you did not ask for, at worst an unbalanced tag turns a log line into a `MarkupError` raised from inside `print`. The two mitigations are `markup=False` (per call, or on the `Console` constructor) and `rich.markup.escape` ([`markup.py#L48-L70`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/markup.py#L48-L70)). Decide which one applies to every path where untrusted data reaches a console, and say so in review.\n\n> **Leaves as:** `'Hello World!\\n'` and then `'Where there is a Will there is a way.\\n'` written to the file and flushed \u2014 each as one `write`, each copied into `_record_buffer` first, and `self._buffer` emptied after both\n"}, {"n": 6, "title": "Building the Table: Columns, Cells, and the Renderability Gate", "data_in": "Table(show_header=True, header_style='bold magenta'), then four add_column calls and three add_row calls of plain strings", "data_out": "a Table with 4 Columns (widths 12/None/None/None, justify left/left/right/right) and 3 Rows, cells stored as the original str objects", "span": [378, 403], "md": "# Chapter 6 \u00b7 Building the Table: Columns, Cells, and the Renderability Gate\n\n> **Enters as:** `Table(show_header=True, header_style='bold magenta')`, then four column definitions and three rows of plain strings \u2014 among them `'[red]Solo[/red]: A Star Wars Story'` and `'[bold]$1,332,539,889[/bold]'`\n\nNothing is printed in this chapter. Twelve cell strings and four headers arrive, get sorted into columns, and are stored \u2014 as they were given, uninterpreted. The interesting work here is what the table *checks* on the way in, and what it decides not to check until much later.\n\n## The container\n\n`Table.__init__` ([`table.py#L188-L250`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L188-L250)) takes two keyword arguments from the caller and about twenty-five defaults from its own signature. The ones that matter later: `box=box.HEAVY_HEAD`, the heavy-topped Unicode frame; `padding=(0, 1)`; `safe_box=None`, which defers to the console; `show_edge=True`; `expand=False`.\n\nTwo of those defaults are normalised immediately. `header_style or \"\"` and `footer_style or \"\"` turn a `None` into an empty string so later concatenation never has to guard ([`L235-L236`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L235-L236)). And `padding` is handed to `Padding.unpack` ([`L225`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L225)), which expands the CSS-style shorthand: one integer means all four sides, two means (top, right) repeated, four means all four given, and anything else raises `ValueError` naming the length it got ([`padding.py#L60-L74`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/padding.py#L60-L74)). The trace shows the call and its answer: `(0, 1) \u2192 (0, 1, 0, 1)`. From here on the table only ever deals in a four-tuple.\n\nThe constructor ends with a loop over `*headers` ([`L244-L250`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L244-L250)) that would have turned bare strings into columns. The caller passed none, so it does nothing, and the table exists with `columns == []` and `rows == []`.\n\n## Four columns\n\n`add_column` is called four times ([`L364-L420`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L364-L420)); the trace spells out the first \u2014 `header='Date'`, `style='dim'`, `width=12` \u2014 and folds the other three. Each call builds one `Column` dataclass and appends it ([`L403-L420`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L403-L420)). Three things are decided there that the caller did not state:\n\n`_index=len(self.columns)` stamps each column with its position at creation time \u2014 0, 1, 2, 3 \u2014 and that index is what `_get_padding_width` later uses to know whether a column is the first or last and so whether edge padding applies ([`L700-L714`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L700-L714)). `highlight=highlight if highlight is not None else self.highlight` inherits the table's setting, which is `False` by default ([`L408`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L408)) \u2014 so the automatic `ReprHighlighter` that ran over `'Hello'` back in Chapter 2 will *not* run over these cells. And `overflow='ellipsis'` is the signature default ([`L375`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L375)): if a cell turns out wider than its column, the chosen failure is to truncate it with a `\u2026` rather than to break the layout.\n\n`width=12` on the Date column is the only hard constraint in the set; the other three say `width=None`, meaning *measure me*. That distinction is the whole subject of the next chapter.\n\n## Three rows, and the gate\n\n`add_row` runs three times ([`L422-L467`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L422-L467)). The trace shows the first in full: four `is_renderable` checks, each returning `True`, each followed by an `add_cell` into the column at that index.\n\nThe list of renderables is first reconciled with the list of columns ([`L446-L450`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L446-L450)): a short row is padded out with `None`, and each `None` becomes an empty-string cell ([`L459-L460`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L459-L460)). A row *longer* than the current columns is not an error either \u2014 it grows the table, creating a new `Column` and back-filling every existing row with `Text(\"\")` so the grid stays rectangular ([`L452-L456`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L452-L456)). Here all three rows supply exactly four values, so neither branch is taken.\n\nWhat each value must pass is `is_renderable` ([`protocol.py#L9-L15`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/protocol.py#L9-L15)): it is a `str`, or it has `__rich__`, or it has `__rich_console__`. Nothing else. An integer, a `datetime`, a `Decimal` \u2014 all rejected, with `errors.NotRenderableError` naming the type ([`table.py#L463-L466`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L463-L466)). That is deliberate: `print` will happily pretty-print an arbitrary object, but a table cell will not, because a cell has to be measurable in columns before it can be laid out.\n\n> **For the owner:** `add_row` validates at insert time, not at render time, so a bad cell fails at the line that added it. But the check is interleaved with the mutation: cells for the earlier columns are already appended when a later one raises, and the `Row` is never appended ([`table.py#L451-L467`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L451-L467)). A caught `NotRenderableError` therefore leaves the table ragged \u2014 one column holding more cells than `row_count` \u2014 and the next `add_row` will misalign. Treat `NotRenderableError` from `add_row` as fatal for that `Table` instance; do not catch it and carry on.\n\nEach accepted value goes into `add_cell`, a three-line closure that appends to `column._cells` ([`L440-L441`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L440-L441)) \u2014 the per-column list declared with `field(default_factory=list)` on the `Column` dataclass ([`L114`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L114)). Note the storage shape: cells live on *columns*, not on rows. The `Row` object appended at the end of each call ([`L467`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L467)) holds only a style and an `end_section` flag ([`L131-L139`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L131-L139)); the grid is reassembled by zipping the columns together when it is time to draw.\n\nAnd the strings are stored exactly as handed over. `'[red]Solo[/red]: A Star Wars Story'` is still thirty-three characters of plain text with square brackets in it. No `markup.render`, no `Text`, no spans. Nothing in this chapter has looked inside a cell.\n\n> **For the owner:** Markup inside cells is deferred, not skipped. It is interpreted later, one cell at a time, when the table is rendered through `Console.render_lines` \u2014 which means an unbalanced tag in cell data raises `MarkupError` from inside `console.print(table)`, a long way from the `add_row` that introduced it. If cell content comes from outside your code, convert it at insert time with `Text(value)` (which never parses markup) rather than passing a raw `str`.\n\n> **For the owner:** Row arity is not validated. Too few values are silently filled with blanks, too many silently add a column and back-fill every earlier row ([`table.py#L446-L456`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L446-L456)). A loop that occasionally yields a short record will produce a plausible-looking table with the wrong data in it. Assert the length of each row before calling `add_row` if the rows are built programmatically.\n\n> **Leaves as:** a `Table` holding four `Column`s \u2014 `_index` 0\u20133, `width` 12/`None`/`None`/`None`, `justify` left/left/right/right, `highlight` `False`, padding `(0, 1, 0, 1)` \u2014 and three `Row`s, with all twelve cells still the original `str` objects\n"}, {"n": 7, "title": "Deciding the Shape: Column Measurement and Collapse", "data_in": "print(table) with ConsoleOptions(max_width=100); Table with 4 columns, _extra_width 5", "data_out": "widths = [14, 35, 19, 16] (table_width 89) and render_options updated to width=89, highlight=False", "span": [404, 474], "md": "# Chapter 7 \u00b7 Deciding the Shape: Column Measurement and Collapse\n\n> **Enters as:** the assembled `Table` (4 columns, 3 rows of raw strings) handed to `console.print(table)`, measured against `ConsoleOptions(max_width=100)`\n\nThe table has structure but no dimensions. Before a single box character can be drawn, somebody has to decide how wide each of the four columns gets to be \u2014 and the only budget available is the 100 cells the console was pinned to in Chapter 1.\n\n## Recognised, not converted\n\n`print` opens the buffer context and hands its one object to `_collect_renderables` ([`console.py#L1705-L1713`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1705-L1713)). The table makes the same first stop every object makes: `rich_cast`, which returns it unchanged because a `Table` has no `__rich__` ([`protocol.py#L18-L41`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/protocol.py#L18-L41)).\n\nThen the chain of `isinstance` checks ([`console.py#L1556-L1579`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1556-L1579)). It is not a `str`, not a `Text`, but it *is* a `ConsoleRenderable` \u2014 a `runtime_checkable` Protocol whose entire test is \"does this object have a `__rich_console__` attribute\" ([`console.py#L256-L263`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L256-L263)). So the table is appended as-is ([`L1570-L1572`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1570-L1572)): no pretty-printing, no highlighting, no `Text` conversion. `check_text()` runs twice and does nothing both times, because no strings accumulated. The list that comes back is `[<rich.table.Table object>]`.\n\n`Console.options` is rebuilt from scratch \u2014 `size` \u2192 `ConsoleDimensions(width=100, height=25)`, `encoding` \u2192 `'utf-8'`, `is_terminal` \u2192 `False` \u2014 and `update()` copies it with every override still `None` ([`console.py#L1716-L1724`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1716-L1724)). `Console.render` casts again, resets `height` ([`L1338`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1338)), confirms the object has `__rich_console__` and is not itself a class ([`L1318-L1319`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1318-L1319)), and calls it. The guard at the top \u2014 return immediately if `max_width < 1` ([`L1312-L1314`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L1312-L1314)) \u2014 is what stops a nested renderable from recursing forever on zero width; at 100 it is a no-op.\n\n## The budget\n\n`Table.__rich_console__` begins with arithmetic ([`table.py#L482-L491`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L482-L491)). `self.width` is `None`, so `max_width` stays 100. Then `_extra_width` ([`L295-L303`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L295-L303)) counts what the frame will cost before any content exists: two cells for the outer edges, plus one per divider between four columns \u2014 `2 + 3`, and the trace shows `\u2192 5`.\n\n95 cells of content budget, handed down as `options.update_width(95)` ([`L488-L490`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L488-L490)). `update_width` clamps with `max(0, width)` ([`console.py#L194-L205`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/console.py#L194-L205)), so a console narrower than the frame yields a budget of zero rather than a negative one.\n\n## Measuring four columns\n\n`_calculate_column_widths` measures every column, then decides whether the result fits ([`table.py#L523-L586`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L523-L586)).\n\nThe Date column takes the short path. `_get_padding_width(0)` reads the normalised `(0, 1, 0, 1)` and returns `pad_left + pad_right` = 2 ([`L700-L714`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L700-L714)); because `column.width` is 12, `_measure_column` returns a fixed `Measurement(12 + 2, 12 + 2)` and clamps it against the budget ([`L729-L733`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L729-L733)). The trace: `with_maximum(95) \u2192 Measurement(minimum=14, maximum=14)`. The cells are never looked at.\n\nThe other three have `width=None`, so they are measured from their contents ([`L734-L748`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L734-L748)). `_get_cells` yields header, body cells and footer, each already wrapped in a `Padding` ([`L684-L691`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L684-L691)), and `Measurement.get` is asked for each one. For a padded string, that routes through `Padding.__rich_measure__`, which adds `left + right` to whatever is inside ([`padding.py#L125-L135`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/padding.py#L125-L135)) \u2014 which is why the fixed column adds its 2 by hand and the flexible ones do not.\n\nThe inner string reaches `Measurement.get`, which converts it with `console.render_str(renderable, markup=options.markup, highlight=False)` ([`measure.py#L98-L101`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/measure.py#L98-L101)). Two consequences worth naming. Markup is honoured, so `'[red]Solo[/red]: A Star Wars Story'` is measured as the 23 visible cells of `Solo: A Star Wars Story` \u2014 tags cost nothing. And highlighting is forced off, so measurement can never disagree with rendering about width on account of a regex.\n\nThe column finally reports `max(min_widths)` and `max(max_widths)` across its cells, clamped to the budget and then to the column's own `min_width`/`max_width` ([`L745-L752`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L745-L752)). The maxima are taken as the working widths, with `or 1` so a column measuring zero still occupies a cell ([`L532`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L532)). The trace reports the answer: `[14, 35, 19, 16]`. Those numbers are the widest cell in each column plus two of padding \u2014 35 is `Star Wars Ep. VIII: The Last Jedi`, 19 is the header `Production Budget`, 16 is `$1,332,539,889` (inference from the arithmetic; the trace folds the three flexible measurements).\n\n> **For the owner:** Measurement renders the cell contents a second time \u2014 once to measure, once to draw \u2014 and a third time if the collapse path below triggers a re-measure ([`table.py#L569-L573`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L569-L573)). Keep `__rich_measure__` and `__rich_console__` free of side effects and cheap in any custom renderable you put in a cell, because Rich will call them more than once per `print`.\n\n## Two roads not taken\n\n`self.expand` is consulted twice and answers `False` both times ([`L285-L288`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L285-L288)) \u2014 no `width=` was set and `expand=False` was the default. So the ratio-distribution branch is skipped ([`L536-L553`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L536-L553)), and so is the pad-out branch at the end ([`L575-L584`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L575-L584)). The table will render at its natural size, narrower than the console.\n\nThe other skipped road is the one that matters when things go wrong. `sum(widths)` is 84, under the 95-cell budget, so `_collapse_widths` is never called ([`L556-L573`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L556-L573)). Had it been, it would have repeatedly shaved the widest column down toward the second widest \u2014 but only among columns marked shrinkable, which is `column.width is None and not column.no_wrap` ([`L557-L561`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L557-L561), [`L588-L625`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L588-L625)). The Date column, with its explicit `width=12`, would have been protected. And if that still did not fit, the last resort reduces *every* column evenly, protection or not ([`L563-L567`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L563-L567)).\n\n> **For the owner:** An explicit `width=` or `no_wrap=True` on a column is a preference, not a contract. It holds while the table fits and while some other column can give way; under real pressure the even reduction shrinks fixed columns too, and the column's `overflow='ellipsis'` default then truncates the content with a `\u2026`. If a column must never lose characters, bound the data or the console width yourself rather than relying on `width=`.\n\n## What leaves\n\n`table_width = sum(widths) + extra_width` = `84 + 5` = 89, and the options that will govern every cell are built from it ([`L493-L495`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L493-L495)): `width=89`, `height=None`, and `highlight=self.highlight` \u2014 `False`. The trace shows exactly that call. The console's automatic `ReprHighlighter`, which was on for `'Hello'` in Chapter 2, is switched off for everything inside this table; markup, however, is left alone and will be interpreted cell by cell in the next chapter.\n\n`self.title` is `None`, so the annotation branch is skipped ([`L509-L514`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L509-L514)) and control passes straight to `_render` with the four numbers.\n\n> **Leaves as:** `widths = [14, 35, 19, 16]` (table width 89, inside the console's 100) and `ConsoleOptions(min_width=89, max_width=89, highlight=False, height=None)`\n"}, {"n": 8, "title": "Drawing the Table: Padding, Box Characters, and Per-Cell Styles", "data_in": "widths=[14, 35, 19, 16] and the raw cell strings", "data_out": "a stream of Segments beginning Segment('\\u250f\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2501\\u2533\\u2026\\u2513', Style()), then Segment('\\n'), Segment('\\u2503', Style()), Segment('Date        ', Style(magenta, bold)), \\u2026", "span": [475, 544], "md": "# Chapter 8 \u00b7 Drawing the Table: Padding, Box Characters, and Per-Cell Styles\n\n> **Enters as:** `widths = [14, 35, 19, 16]` and `ConsoleOptions(max_width=89, highlight=False, height=None)`, with the cells still raw strings on `Column._cells`\n\nFour numbers and twelve strings. `_render` now has to turn them into a stream of `Segment`s \u2014 frame, padding, styled text \u2014 in the exact order a terminal would read them.\n\n## Dressing the frame\n\nThe first thing `_render` resolves is style, before geometry ([`table.py#L755-L760`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L755-L760)). `self.style` is the string `'none'`, so `console.get_style('none')` is asked twice \u2014 once for the table, once for `self.border_style or \"\"` \u2014 and the trace shows it returning `Style()` both times, the null style that `Style.parse` short-circuits to for an empty or `\"none\"` definition ([`style.py#L510-L511`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L510-L511)). Adding them gives `Style()` again: `Style.__add__` delegates to the cached `_add`, which returns `self` unchanged when the right-hand style is null ([`style.py#L732-L737`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/style.py#L732-L737)). So every box character in this run will carry an empty style \u2014 the `Segment('\u250f\u2501\u2501\u2026\u2513', Style())` the trace ends on.\n\n## Columns become rows\n\n`_render` builds a generator per column and then transposes them ([`table.py#L761-L766`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L761-L766)). Each `_get_cells` call yields the header, then every body cell, then the footer if one is shown ([`table.py#L667-L682`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L667-L682)); `zip(*\u2026)` pulls one from each in lockstep, which is why the trace shows `_get_cells` entered once and then resumed sixteen more times \u2014 four columns \u00d7 four rows.\n\nFor the Date column the trace spells out what each cell gets. The header style is `get_style(self.header_style or \"\") + get_style(column.header_style)`, i.e. `Style(color=magenta, bold=True)` plus the empty per-column override ([`L670-L674`](https://github.com/Textualize/rich/blob/9d8f9a372cc5916fd4781fec207ced7ddac2f08f/rich/table.py#L670-L674)). The body cells get `cell_style =
