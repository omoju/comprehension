aise BadPayload", "file": "src/itsdangerous/serializer.py", "chapter": 8}, {"kind": "step", "fn": "_CompactJSON.loads", "file": "src/itsdangerous/_json.py", "line": 10, "end": 12, "depth": 4, "returned": "{'id': 5, 'name': 'itsdangerous'}", "chapter": 8}, {"kind": "data", "label": "{'id': 5, 'name': 'itsdangerous'}", "chapter": 8}, {"kind": "end", "label": "The caller holds {'id': 5, 'name': 'itsdangerous'}", "chapter": null}], "files": {"docs/concepts.rst": "General Concepts\n================\n\n\nSerializer vs Signer\n--------------------\n\nItsDangerous provides two levels of data handling. The :doc:`/signer` is\nthe basic system that signs a given ``bytes`` value based on the given\nsigning parameters. The :doc:`/serializer` wraps a signer to enable\nserializing and signing other data besides ``bytes``.\n\nTypically, you'll want to use a serializer, not a signer. You can\nconfigure the signing parameters through the serializer, and even\nprovide fallback signers to upgrade old tokens to new parameters.\n\n\nThe Secret Key\n--------------\n\nSignatures are secured by the ``secret_key``. Typically one secret key\nis used with all signers, and the salt is used to distinguish different\ncontexts. Changing the secret key will invalidate existing tokens.\n\nIt should be a long random string of bytes. This value must be kept\nsecret and should not be saved in source code or committed to version\ncontrol. If an attacker learns the secret key, they can change and\nresign data to look valid. If you suspect this happened, change the\nsecret key to invalidate existing tokens.\n\nOne way to keep the secret key separate is to read it from an\nenvironment variable. When deploying for the first time, generate a key\nand set the environment variable when running the application. All\nprocess managers (like systemd) and hosting services have a way to\nspecify environment variables.\n\n.. code-block:: python\n\n    import os\n    from itsdangerous.serializer import Serializer\n    SECRET_KEY = os.environ.get(\"SECRET_KEY\")\n    s = Serializer(SECRET_KEY)\n\n.. code-block:: text\n\n    $ export SECRET_KEY=\"base64 encoded random bytes\"\n    $ python application.py\n\nOne way to generate a key is to use :func:`os.urandom`.\n\n.. code-block:: text\n\n    $ python3 -c 'import os; print(os.urandom(16).hex())'\n\n\nThe Salt\n--------\n\nThe salt is combined with the secret key to derive a unique key for\ndistinguishing different contexts. Unlike the secret key, the salt\ndoesn't have to be random, and can be saved in code. It only has to be\nunique between contexts, not private.\n\nFor example, you want to email activation links to activate user\naccounts, and upgrade links to upgrade users to a paid accounts. If all\nyou sign is the user id, and you don't use different salts, a user could\nreuse the token from the activation link to upgrade the account. If you\nuse different salts, the signatures will be different and will not be\nvalid in the other context.\n\n.. code-block:: python\n\n    from itsdangerous.url_safe import URLSafeSerializer\n\n    s1 = URLSafeSerializer(\"secret-key\", salt=\"activate\")\n    s1.dumps(42)\n    'NDI.MHQqszw6Wc81wOBQszCrEE_RlzY'\n\n    s2 = URLSafeSerializer(\"secret-key\", salt=\"upgrade\")\n    s2.dumps(42)\n    'NDI.c0MpsD6gzpilOAeUPra3NShPXsE'\n\nThe second serializer can't load data dumped with the first because the\nsalts differ.\n\n.. code-block:: python\n\n    s2.loads(s1.dumps(42))\n    Traceback (most recent call last):\n      ...\n    BadSignature: Signature does not match\n\nOnly the serializer with the same salt can load the data.\n\n.. code-block:: python\n\n    s2.loads(s2.dumps(42))\n    42\n\n\nKey Rotation\n------------\n\nKey rotation can provide an extra layer of mitigation against an\nattacker discovering a secret key. A rotation system will keep a list of\nvalid keys, generating a new key and removing the oldest key\nperiodically. If it takes four weeks for an attacker to crack a key, but\nthe key is rotated out after three weeks, they will not be able to use\nany keys they crack. However, if a user doesn't refresh their token\nwithin three weeks it will be invalid too.\n\nThe system that generates and maintains this list is outside the scope\nof ItsDangerous, but ItsDangerous does support validating against a list\nof keys.\n\nInstead of passing a single key, you can pass a list of keys, oldest to\nnewest. When signing the last (newest) key will be used, and when\nvalidating each key will be tried from newest to oldest before raising\na validation error.\n\n.. code-block:: python\n\n    SECRET_KEYS = [\"2b9cd98e\", \"169d7886\", \"b6af09f5\"]\n\n    # sign some data with the latest key\n    s = Serializer(SECRET_KEYS)\n    t = s.dumps({\"id\": 42})\n\n    # rotate a new key in and the oldest key out\n    SECRET_KEYS.append(\"cf9b3588\")\n    del SECRET_KEYS[0]\n\n    s = Serializer(SECRET_KEYS)\n    s.loads(t)  # valid even though it was signed with a previous key\n\n\nDigest Method Security\n----------------------\n\nA signer is configured with a ``digest_method``, a hash function that\nis used as an intermediate step when generating the HMAC signature. The\ndefault method is :func:`hashlib.sha1`. Occasionally, users are\nconcerned about this default because they have heard about hash\ncollisions with SHA-1.\n\nWhen used as the intermediate, iterated step in HMAC, SHA-1 is not\ninsecure. In fact, even MD5 is still secure in HMAC. The security of the\nhash alone doesn't apply when used in HMAC.\n\nIf a project considers SHA-1 a risk anyway, they can configure the\nsigner with a different digest method such as :func:`hashlib.sha512`.\nA fallback signer for SHA-1 can be configured so that old tokens will be\nupgraded. SHA-512 produces a longer hash, so tokens will take up more\nspace, which is relevant in cookies and URLs.\n", "docs/index.rst": ".. rst-class:: hide-header\n\nItsDangerous\n============\n\n.. image:: _static/itsdangerous-name.svg\n    :align: center\n    :height: 200px\n\nSometimes you want to send some data to untrusted environments, then get\nit back later. To do this safely, the data must be signed to detect\nchanges.\n\nGiven a key only you know, you can cryptographically sign your data and\nhand it over to someone else. When you get the data back you can ensure\nthat nobody tampered with it.\n\nThe receiver can see the data, but they can not modify it unless they\nalso have your key. So if you keep the key secret and complex, you will\nbe fine.\n\n\nInstalling\n----------\n\nInstall and update using `pip`_:\n\n.. code-block:: text\n\n    pip install -U itsdangerous\n\n.. _pip: https://pip.pypa.io/en/stable/quickstart/\n\n\nExample Use Cases\n-----------------\n\n-   Sign a user ID in a URL and email it to them to unsubscribe from a\n    newsletter. This way you don't need to generate one-time tokens and\n    store them in the database. Same thing with any kind of activation\n    link for accounts and similar things.\n-   Signed objects can be stored in cookies or other untrusted sources\n    which means you don't need to have sessions stored on the server,\n    which reduces the number of necessary database queries.\n-   Signed information can safely do a round trip between server and\n    client in general which makes them useful for passing server-side\n    state to a client and then back.\n\n\nTable of Contents\n-----------------\n\n.. toctree::\n\n    concepts\n    serializer\n    signer\n    exceptions\n    timed\n    url_safe\n    encoding\n    license\n    changes\n", "docs/serializer.rst": ".. module:: itsdangerous.serializer\n\nSerialization Interface\n=======================\n\nThe :doc:`/signer` only signs bytes. To sign other types, the\n:class:`Serializer` class provides a ``dumps``/``loads`` interface\nsimilar to Python's :mod:`json` module, which serializes the object to a\nstring then signs that.\n\nUse :meth:`~Serializer.dumps` to serialize and sign the data:\n\n.. code-block:: python\n\n    from itsdangerous.serializer import Serializer\n    s = Serializer(\"secret-key\")\n    s.dumps([1, 2, 3, 4])\n    b'[1, 2, 3, 4].r7R9RhGgDPvvWl3iNzLuIIfELmo'\n\nUse :meth:`~Serializer.loads` to verify the signature and deserialize\nthe data.\n\n.. code-block:: python\n\n    s.loads('[1, 2, 3, 4].r7R9RhGgDPvvWl3iNzLuIIfELmo')\n    [1, 2, 3, 4]\n\nBy default, data is serialized to JSON with the built-in :mod:`json`\nmodule. This internal serializer can be changed by subclassing.\n\nTo record and validate the age of the signature, see :doc:`/timed`.\nTo serialize to a format that is safe to use in URLs, see\n:doc:`/url_safe`.\n\n\nResponding to Failure\n---------------------\n\nExceptions have helpful attributes which allow you to inspect the\npayload if the signature check failed. This has to be done with extra\ncare because at that point you know that someone tampered with your data\nbut it might be useful for debugging purposes.\n\n.. code-block:: python\n\n    from itsdangerous.serializer import Serializer\n    from itsdangerous.exc import BadSignature, BadData\n\n    s = URLSafeSerializer(\"secret-key\")\n    decoded_payload = None\n\n    try:\n        decoded_payload = s.loads(data)\n        # This payload is decoded and safe\n    except BadSignature as e:\n        if e.payload is not None:\n            try:\n                decoded_payload = s.load_payload(e.payload)\n            except BadData:\n                pass\n            # This payload is decoded but unsafe because someone\n            # tampered with the signature. The decode (load_payload)\n            # step is explicit because it might be unsafe to unserialize\n            # the payload (think pickle instead of json!)\n\nIf you don't want to inspect attributes to figure out what exactly went\nwrong you can also use :meth:`~Serializer.loads_unsafe`:\n\n.. code-block:: python\n\n    sig_okay, payload = s.loads_unsafe(data)\n\nThe first item in the returned tuple is a boolean that indicates if the\nsignature was correct.\n\n\nFallback Signers\n----------------\n\nYou may want to upgrade the signing parameters without invalidating\nexisting signatures immediately. For example, you may decide that you\nwant to use a different digest method. New signatures should use the new\nmethod, but old signatures should still validate.\n\nA list of ``fallback_signers`` can be given that will be tried if\nunsigning with the current signer fails. Each item in the list can be:\n\n-   A dict of ``signer_kwargs`` to instantiate the ``signer`` class\n    passed to the serializer.\n-   A :class:`~itsdangerous.signer.Signer` class to instantiated with\n    the ``secret_key``, ``salt``, and ``signer_kwargs`` passed to the\n    serializer.\n-   A tuple of ``(signer_class, signer_kwargs)`` to instantiate the\n    given class with the given args.\n\nFor example, this is a serializer that signs using SHA-512, but will\nunsign using either SHA-512 or SHA-1:\n\n.. code-block:: python\n\n    s = Serializer(\n        signer_kwargs={\"digest_method\": hashlib.sha512},\n        fallback_signers=[{\"digest_method\": hashlib.sha1}]\n    )\n\n\n\nAPI\n---\n\n.. autoclass:: Serializer\n    :members:\n", "docs/signer.rst": ".. module:: itsdangerous.signer\n\nSigning Interface\n=================\n\nThe most basic interface is the signing interface. The :class:`Signer`\nclass can be used to attach a signature to a specific string:\n\n.. code-block:: python\n\n    from itsdangerous import Signer\n    s = Signer(\"secret-key\")\n    s.sign(\"my string\")\n    b'my string.wh6tMHxLgJqB6oY1uT73iMlyrOA'\n\nThe signature is appended to the string, separated by a dot. To validate\nthe string, use the :meth:`~Signer.unsign` method:\n\n.. code-block:: python\n\n    s.unsign(b\"my string.wh6tMHxLgJqB6oY1uT73iMlyrOA\")\n    b'my string'\n\nIf unicode strings are provided, an implicit encoding to UTF-8 happens.\nHowever after unsigning you won't be able to tell if it was unicode or\na bytestring.\n\nIf the value is changed, the signature will no longer match, and\nunsigning will raise a :exc:`~itsdangerous.exc.BadSignature` exception:\n\n.. code-block:: python\n\n    s.unsign(b\"different string.wh6tMHxLgJqB6oY1uT73iMlyrOA\")\n    Traceback (most recent call last):\n      ...\n    BadSignature: Signature does not match\n\nTo record and validate the age of a signature, see :doc:`/timed`.\n\n.. autoclass:: Signer\n    :members:\n\n\nSigning Algorithms\n------------------\n\n.. autoclass:: NoneAlgorithm\n\n.. autoclass:: HMACAlgorithm\n", "src/itsdangerous/_json.py": "from __future__ import annotations\n\nimport json as _json\nimport typing as t\n\n\nclass _CompactJSON:\n    \"\"\"Wrapper around json module that strips whitespace.\"\"\"\n\n    @staticmethod\n    def loads(payload: str | bytes) -> t.Any:\n        return _json.loads(payload)\n\n    @staticmethod\n    def dumps(obj: t.Any, **kwargs: t.Any) -> str:\n        kwargs.setdefault(\"ensure_ascii\", False)\n        kwargs.setdefault(\"separators\", (\",\", \":\"))\n        return _json.dumps(obj, **kwargs)\n", "src/itsdangerous/encoding.py": "from __future__ import annotations\n\nimport base64\nimport string\nimport struct\nimport typing as t\n\nfrom .exc import BadData\n\n\ndef want_bytes(\n    s: str | bytes, encoding: str = \"utf-8\", errors: str = \"strict\"\n) -> bytes:\n    if isinstance(s, str):\n        s = s.encode(encoding, errors)\n\n    return s\n\n\ndef base64_encode(string: str | bytes) -> bytes:\n    \"\"\"Base64 encode a string of bytes or text. The resulting bytes are\n    safe to use in URLs.\n    \"\"\"\n    string = want_bytes(string)\n    return base64.urlsafe_b64encode(string).rstrip(b\"=\")\n\n\ndef base64_decode(string: str | bytes) -> bytes:\n    \"\"\"Base64 decode a URL-safe string of bytes or text. The result is\n    bytes.\n    \"\"\"\n    string = want_bytes(string, encoding=\"ascii\", errors=\"ignore\")\n    string += b\"=\" * (-len(string) % 4)\n\n    try:\n        return base64.urlsafe_b64decode(string)\n    except (TypeError, ValueError) as e:\n        raise BadData(\"Invalid base64-encoded data\") from e\n\n\n# The alphabet used by base64.urlsafe_*\n_base64_alphabet = f\"{string.ascii_letters}{string.digits}-_=\".encode(\"ascii\")\n\n_int64_struct = struct.Struct(\">Q\")\n_int_to_bytes = _int64_struct.pack\n_bytes_to_int = t.cast(\"t.Callable[[bytes], tuple[int]]\", _int64_struct.unpack)\n\n\ndef int_to_bytes(num: int) -> bytes:\n    return _int_to_bytes(num).lstrip(b\"\\x00\")\n\n\ndef bytes_to_int(bytestr: bytes) -> int:\n    return _bytes_to_int(bytestr.rjust(8, b\"\\x00\"))[0]\n", "src/itsdangerous/exc.py": "from __future__ import annotations\n\nimport typing as t\nfrom datetime import datetime\n\n\nclass BadData(Exception):\n    \"\"\"Raised if bad data of any sort was encountered. This is the base\n    for all exceptions that ItsDangerous defines.\n\n    .. versionadded:: 0.15\n    \"\"\"\n\n    def __init__(self, message: str):\n        super().__init__(message)\n        self.message = message\n\n    def __str__(self) -> str:\n        return self.message\n\n\nclass BadSignature(BadData):\n    \"\"\"Raised if a signature does not match.\"\"\"\n\n    def __init__(self, message: str, payload: t.Any | None = None):\n        super().__init__(message)\n\n        #: The payload that failed the signature test. In some\n        #: situations you might still want to inspect this, even if\n        #: you know it was tampered with.\n        #:\n        #: .. versionadded:: 0.14\n        self.payload: t.Any | None = payload\n\n\nclass BadTimeSignature(BadSignature):\n    \"\"\"Raised if a time-based signature is invalid. This is a subclass\n    of :class:`BadSignature`.\n    \"\"\"\n\n    def __init__(\n        self,\n        message: str,\n        payload: t.Any | None = None,\n        date_signed: datetime | None = None,\n    ):\n        super().__init__(message, payload)\n\n        #: If the signature expired this exposes the date of when the\n        #: signature was created. This can be helpful in order to\n        #: tell the user how long a link has been gone stale.\n        #:\n        #: .. versionchanged:: 2.0\n        #:     The datetime value is timezone-aware rather than naive.\n        #:\n        #: .. versionadded:: 0.14\n        self.date_signed = date_signed\n\n\nclass SignatureExpired(BadTimeSignature):\n    \"\"\"Raised if a signature timestamp is older than ``max_age``. This\n    is a subclass of :exc:`BadTimeSignature`.\n    \"\"\"\n\n\nclass BadHeader(BadSignature):\n    \"\"\"Raised if a signed header is invalid in some form. This only\n    happens for serializers that have a header that goes with the\n    signature.\n\n    .. versionadded:: 0.24\n    \"\"\"\n\n    def __init__(\n        self,\n        message: str,\n        payload: t.Any | None = None,\n        header: t.Any | None = None,\n        original_error: Exception | None = None,\n    ):\n        super().__init__(message, payload)\n\n        #: If the header is actually available but just malformed it\n        #: might be stored here.\n        self.header: t.Any | None = header\n\n        #: If available, the error that indicates why the payload was\n        #: not valid. This might be ``None``.\n        self.original_error: Exception | None = original_error\n\n\nclass BadPayload(BadData):\n    \"\"\"Raised if a payload is invalid. This could happen if the payload\n    is loaded despite an invalid signature, or if there is a mismatch\n    between the serializer and deserializer. The original exception\n    that occurred during loading is stored on as :attr:`original_error`.\n\n    .. versionadded:: 0.15\n    \"\"\"\n\n    def __init__(self, message: str, original_error: Exception | None = None):\n        super().__init__(message)\n\n        #: If available, the error that indicates why the payload was\n        #: not valid. This might be ``None``.\n        self.original_error: Exception | None = original_error\n", "src/itsdangerous/serializer.py": "from __future__ import annotations\n\nimport collections.abc as cabc\nimport json\nimport typing as t\n\nfrom .encoding import want_bytes\nfrom .exc import BadPayload\nfrom .exc import BadSignature\nfrom .signer import _make_keys_list\nfrom .signer import Signer\n\nif t.TYPE_CHECKING:\n    import typing_extensions as te\n\n    # This should be either be str or bytes. To avoid having to specify the\n    # bound type, it falls back to a union if structural matching fails.\n    _TSerialized = te.TypeVar(\"_TSerialized\", bound=str | bytes, default=str | bytes)\nelse:\n    # Still available at runtime on Python < 3.13, but without the default.\n    _TSerialized = t.TypeVar(\"_TSerialized\", bound=str | bytes)\n\n\nclass _PDataSerializer(t.Protocol[_TSerialized]):\n    def loads(self, payload: _TSerialized, /) -> t.Any: ...\n    # A signature with additional arguments is not handled correctly by type\n    # checkers right now, so an overload is used below for serializers that\n    # don't match this strict protocol.\n    def dumps(self, obj: t.Any, /) -> _TSerialized: ...\n\n\n# Use TypeIs once it's available in typing_extensions or 3.13.\ndef is_text_serializer(\n    serializer: _PDataSerializer[t.Any],\n) -> te.TypeGuard[_PDataSerializer[str]]:\n    \"\"\"Checks whether a serializer generates text or binary.\"\"\"\n    return isinstance(serializer.dumps({}), str)\n\n\nclass Serializer(t.Generic[_TSerialized]):\n    \"\"\"A serializer wraps a :class:`~itsdangerous.signer.Signer` to\n    enable serializing and securely signing data other than bytes. It\n    can unsign to verify that the data hasn't been changed.\n\n    The serializer provides :meth:`dumps` and :meth:`loads`, similar to\n    :mod:`json`, and by default uses :mod:`json` internally to serialize\n    the data to bytes.\n\n    The secret key should be a random string of ``bytes`` and should not\n    be saved to code or version control. Different salts should be used\n    to distinguish signing in different contexts. See :doc:`/concepts`\n    for information about the security of the secret key and salt.\n\n    :param secret_key: The secret key to sign and verify with. Can be a\n        list of keys, oldest to newest, to support key rotation.\n    :param salt: Extra key to combine with ``secret_key`` to distinguish\n        signatures in different contexts.\n    :param serializer: An object that provides ``dumps`` and ``loads``\n        methods for serializing data to a string. Defaults to\n        :attr:`default_serializer`, which defaults to :mod:`json`.\n    :param serializer_kwargs: Keyword arguments to pass when calling\n        ``serializer.dumps``.\n    :param signer: A ``Signer`` class to instantiate when signing data.\n        Defaults to :attr:`default_signer`, which defaults to\n        :class:`~itsdangerous.signer.Signer`.\n    :param signer_kwargs: Keyword arguments to pass when instantiating\n        the ``Signer`` class.\n    :param fallback_signers: List of signer parameters to try when\n        unsigning with the default signer fails. Each item can be a dict\n        of ``signer_kwargs``, a ``Signer`` class, or a tuple of\n        ``(signer, signer_kwargs)``. Defaults to\n        :attr:`default_fallback_signers`.\n\n    .. versionchanged:: 2.0\n        Added support for key rotation by passing a list to\n        ``secret_key``.\n\n    .. versionchanged:: 2.0\n        Removed the default SHA-512 fallback signer from\n        ``default_fallback_signers``.\n\n    .. versionchanged:: 1.1\n        Added support for ``fallback_signers`` and configured a default\n        SHA-512 fallback. This fallback is for users who used the yanked\n        1.0.0 release which defaulted to SHA-512.\n\n    .. versionchanged:: 0.14\n        The ``signer`` and ``signer_kwargs`` parameters were added to\n        the constructor.\n    \"\"\"\n\n    #: The default serialization module to use to serialize data to a\n    #: string internally. The default is :mod:`json`, but can be changed\n    #: to any object that provides ``dumps`` and ``loads`` methods.\n    default_serializer: _PDataSerializer[t.Any] = json\n\n    #: The default ``Signer`` class to instantiate when signing data.\n    #: The default is :class:`itsdangerous.signer.Signer`.\n    default_signer: type[Signer] = Signer\n\n    #: The default fallback signers to try when unsigning fails.\n    default_fallback_signers: list[\n        dict[str, t.Any] | tuple[type[Signer], dict[str, t.Any]] | type[Signer]\n    ] = []\n\n    # Serializer[str] if no data serializer is provided, or if it returns str.\n    @t.overload\n    def __init__(\n        self: Serializer[str],\n        secret_key: str | bytes | cabc.Iterable[str] | cabc.Iterable[bytes],\n        salt: str | bytes | None = b\"itsdangerous\",\n        serializer: None | _PDataSerializer[str] = None,\n        serializer_kwargs: dict[str, t.Any] | None = None,\n        signer: type[Signer] | None = None,\n        signer_kwargs: dict[str, t.Any] | None = None,\n        fallback_signers: list[\n            dict[str, t.Any] | tuple[type[Signer], dict[str, t.Any]] | type[Signer]\n        ]\n        | None = None,\n    ): ...\n\n    # Serializer[bytes] with a bytes data serializer positional argument.\n    @t.overload\n    def __init__(\n        self: Serializer[bytes],\n        secret_key: str | bytes | cabc.Iterable[str] | cabc.Iterable[bytes],\n        salt: str | bytes | None,\n        serializer: _PDataSerializer[bytes],\n        serializer_kwargs: dict[str, t.Any] | None = None,\n        signer: type[Signer] | None = None,\n        signer_kwargs: dict[str, t.Any] | None = None,\n        fallback_signers: list[\n            dict[str, t.Any] | tuple[type[Signer], dict[str, t.Any]] | type[Signer]\n        ]\n        | None = None,\n    ): ...\n\n    # Serializer[bytes] with a bytes data serializer keyword argument.\n    @t.overload\n    def __init__(\n        self: Serializer[bytes],\n        secret_key: str | bytes | cabc.Iterable[str] | cabc.Iterable[bytes],\n        salt: str | bytes | None = b\"itsdangerous\",\n        *,\n        serializer: _PDataSerializer[bytes],\n        serializer_kwargs: dict[str, t.Any] | None = None,\n        signer: type[Signer] | None = None,\n        signer_kwargs: dict[str, t.Any] | None = None,\n        fallback_signers: list[\n            dict[str, t.Any] | tuple[type[Signer], dict[str, t.Any]] | type[Signer]\n        ]\n        | None = None,\n    ): ...\n\n    # Fall back with a positional argument. If the strict signature of\n    # _PDataSerializer doesn't match, fall back to a union, requiring the user\n    # to specify the type.\n    @t.overload\n    def __init__(\n        self,\n        secret_key: str | bytes | cabc.Iterable[str] | cabc.Iterable[bytes],\n        salt: str | bytes | None,\n        serializer: t.Any,\n        serializer_kwargs: dict[str, t.Any] | None = None,\n        signer: type[Signer] | None = None,\n        signer_kwargs: dict[str, t.Any] | None = None,\n        fallback_signers: list[\n            dict[str, t.Any] | tuple[type[Signer], dict[str, t.Any]] | type[Signer]\n        ]\n        | None = None,\n    ): ...\n\n    # Fall back with a keyword argument.\n    @t.overload\n    def __init__(\n        self,\n        secret_key: str | bytes | cabc.Iterable[str] | cabc.Iterable[bytes],\n        salt: str | bytes | None = b\"itsdangerous\",\n        *,\n        serializer: t.Any,\n        serializer_kwargs: dict[str, t.Any] | None = None,\n        signer: type[Signer] | None = None,\n        signer_kwargs: dict[str, t.Any] | None = None,\n        fallback_signers: list[\n            dict[str, t.Any] | tuple[type[Signer], dict[str, t.Any]] | type[Signer]\n        ]\n        | None = None,\n    ): ...\n\n    def __init__(\n        self,\n        secret_key: str | bytes | cabc.Iterable[str] | cabc.Iterable[bytes],\n        salt: str | bytes | None = b\"itsdangerous\",\n        serializer: t.Any | None = None,\n        serializer_kwargs: dict[str, t.Any] | None = None,\n        signer: type[Signer] | None = None,\n        signer_kwargs: dict[str, t.Any] | None = None,\n        fallback_signers: list[\n            dict[str, t.Any] | tuple[type[Signer], dict[str, t.Any]] | type[Signer]\n        ]\n        | None = None,\n    ):\n        #: The list of secret keys to try for verifying signatures, from\n        #: oldest to newest. The newest (last) key is used for signing.\n        #:\n        #: This allows a key rotation system to keep a list of allowed\n        #: keys and remove expired ones.\n        self.secret_keys: list[bytes] = _make_keys_list(secret_key)\n\n        if salt is not None:\n            salt = want_bytes(salt)\n            # if salt is None then the signer's default is used\n\n        self.salt = salt\n\n        if serializer is None:\n            serializer = self.default_serializer\n\n        self.serializer: _PDataSerializer[_TSerialized] = serializer\n        self.is_text_serializer: bool = is_text_serializer(serializer)\n\n        if signer is None:\n            signer = self.default_signer\n\n        self.signer: type[Signer] = signer\n        self.signer_kwargs: dict[str, t.Any] = signer_kwargs or {}\n\n        if fallback_signers is None:\n            fallback_signers = list(self.default_fallback_signers)\n\n        self.fallback_signers: list[\n            dict[str, t.Any] | tuple[type[Signer], dict[str, t.Any]] | type[Signer]\n        ] = fallback_signers\n        self.serializer_kwargs: dict[str, t.Any] = serializer_kwargs or {}\n\n    @property\n    def secret_key(self) -> bytes:\n        \"\"\"The newest (last) entry in the :attr:`secret_keys` list. This\n        is for compatibility from before key rotation support was added.\n        \"\"\"\n        return self.secret_keys[-1]\n\n    def load_payload(\n        self, payload: bytes, serializer: _PDataSerializer[t.Any] | None = None\n    ) -> t.Any:\n        \"\"\"Loads the encoded object. This function raises\n        :class:`.BadPayload` if the payload is not valid. The\n        ``serializer`` parameter can be used to override the serializer\n        stored on the class. The encoded ``payload`` should always be\n        bytes.\n        \"\"\"\n        if serializer is None:\n            use_serializer = self.serializer\n            is_text = self.is_text_serializer\n        else:\n            use_serializer = serializer\n            is_text = is_text_serializer(serializer)\n\n        try:\n            if is_text:\n                return use_serializer.loads(payload.decode(\"utf-8\"))  # type: ignore[arg-type]\n\n            return use_serializer.loads(payload)  # type: ignore[arg-type]\n        except Exception as e:\n            raise BadPayload(\n                \"Could not load the payload because an exception\"\n                \" occurred on unserializing the data.\",\n                original_error=e,\n            ) from e\n\n    def dump_payload(self, obj: t.Any) -> bytes:\n        \"\"\"Dumps the encoded object. The return value is always bytes.\n        If the internal serializer returns text, the value will be\n        encoded as UTF-8.\n        \"\"\"\n        return want_bytes(self.serializer.dumps(obj, **self.serializer_kwargs))\n\n    def make_signer(self, salt: str | bytes | None = None) -> Signer:\n        \"\"\"Creates a new instance of the signer to be used. The default\n        implementation uses the :class:`.Signer` base class.\n        \"\"\"\n        if salt is None:\n            salt = self.salt\n\n        return self.signer(self.secret_keys, salt=salt, **self.signer_kwargs)\n\n    def iter_unsigners(self, salt: str | bytes | None = None) -> cabc.Iterator[Signer]:\n        \"\"\"Iterates over all signers to be tried for unsigning. Starts\n        with the configured signer, then constructs each signer\n        specified in ``fallback_signers``.\n        \"\"\"\n        if salt is None:\n            salt = self.salt\n\n        yield self.make_signer(salt)\n\n        for fallback in self.fallback_signers:\n            if isinstance(fallback, dict):\n                kwargs = fallback\n                fallback = self.signer\n            elif isinstance(fallback, tuple):\n                fallback, kwargs = fallback\n            else:\n                kwargs = self.signer_kwargs\n\n            for secret_key in self.secret_keys:\n                yield fallback(secret_key, salt=salt, **kwargs)\n\n    def dumps(self, obj: t.Any, salt: str | bytes | None = None) -> _TSerialized:\n        \"\"\"Returns a signed string serialized with the internal\n        serializer. The return value can be either a byte or unicode\n        string depending on the format of the internal serializer.\n        \"\"\"\n        payload = want_bytes(self.dump_payload(obj))\n        rv = self.make_signer(salt).sign(payload)\n\n        if self.is_text_serializer:\n            return rv.decode(\"utf-8\")  # type: ignore[return-value]\n\n        return rv  # type: ignore[return-value]\n\n    def dump(self, obj: t.Any, f: t.IO[t.Any], salt: str | bytes | None = None) -> None:\n        \"\"\"Like :meth:`dumps` but dumps into a file. The file handle has\n        to be compatible with what the internal serializer expects.\n        \"\"\"\n        f.write(self.dumps(obj, salt))\n\n    def loads(\n        self, s: str | bytes, salt: str | bytes | None = None, **kwargs: t.Any\n    ) -> t.Any:\n        \"\"\"Reverse of :meth:`dumps`. Raises :exc:`.BadSignature` if the\n        signature validation fails.\n        \"\"\"\n        s = want_bytes(s)\n        last_exception = None\n\n        for signer in self.iter_unsigners(salt):\n            try:\n                return self.load_payload(signer.unsign(s))\n            except BadSignature as err:\n                last_exception = err\n\n        raise t.cast(BadSignature, last_exception)\n\n    def load(self, f: t.IO[t.Any], salt: str | bytes | None = None) -> t.Any:\n        \ <script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const short = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const permalink = (path, a, b) => `${D.repo.url}/blob/${D.repo.commit}/${path}#L${a}` + (b && b !== a ? `-L${b}` : "");

$("meta").textContent = `${D.repo.name} @ ${D.repo.commit.slice(0, 7)} · written for the ${D.reader}`;
$("title").textContent = D.title;
$("premise").innerHTML = marked.parseInline(D.premise);

// ---- flowchart: laid out top to bottom on one spine; roads not taken exit to the right
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
function wrap(text, width) {  // monospace, so characters are a fair measure
  const out = []; let line = "";
  for (let word of String(text).split(/(?<=[ .,(])/)) {
    if ((line + word).length > width && line) { out.push(line.trimEnd()); line = ""; }
    while (word.length > width && !line) { out.push(word.slice(0, width)); word = word.slice(width); }
    line += word;
  }
  if (line) out.push(line.trimEnd());
  return out;
}
const svg = $("chart");
const CX = 112, BOX = 210, SIDE_X = 240, SIDE_W = 136, GAP = 26;
const bandOf = {}; let y = 10, prevBottom = null, prevChapter = undefined;
const defs = el("defs", {}, svg);
for (const [id, cls] of [["arrow", ""], ["dash", ""]]) {
  const m = el("marker", { id, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L8,4 L0,8 z" }, m);
}
const bandsLayer = el("g", {}, svg), wires = el("g", {}, svg), nodes = el("g", {}, svg);
const chapterTitle = Object.fromEntries(D.chapters.map((c) => [c.n, c]));
function textLines(g, lines, x, y0, anchor, cls) {
  lines.forEach((t, i) => { const e = el("text", { x, y: y0 + i * 13, "text-anchor": anchor }, g); if (cls) e.setAttribute("class", cls); e.textContent = t; });
}
function connect(fromY, toY, label) {
  el("line", { x1: CX, y1: fromY, x2: CX, y2: toY - 1, class: "wire", "marker-end": "url(#arrow)" }, wires);
  if (label) { const t = el("text", { x: CX + 6, y: fromY + 14, class: "ans" }, wires); t.textContent = label; }
}
let pendingLabel = null;
for (const it of D.flow) {
  if (it.chapter !== prevChapter && it.chapter != null) {  // a chapter starts: open its band
    y += prevBottom == null ? 0 : 8;
    bandOf[it.chapter] = { top: y, bottom: y };
    y += 20;
  }
  if (it.chapter != null) prevChapter = it.chapter;
  const top = y + (prevBottom == null ? 0 : GAP);
  const g = el("g", { class: "node", tabindex: 0 }, nodes);
  let h;
  if (it.kind === "start" || it.kind === "end") {
    const lines = wrap(it.label, 30); h = 14 + lines.length * 13;
    g.classList.add("term");
    el("rect", { x: CX - BOX / 2, y: top, width: BOX, height: h, rx: h / 2, class: "shape" }, g);
    textLines(g, lines, CX, top + 17, "middle");
  } else if (it.kind === "data") {
    const lines = wrap(it.label, 28).slice(0, 3); h = 14 + lines.length * 13;
    g.classList.add("data");
    const k = 10;
    el("path", { d: `M${CX - BOX / 2 + k},${top} H${CX + BOX / 2} L${CX + BOX / 2 - k},${top + h} H${CX - BOX / 2} Z`, class: "shape" }, g);
    textLines(g, lines, CX, top + 17, "middle");
    g.onclick = () => {};
  } else if (it.kind === "step") {
    const name = it.fn.length > 28 && it.fn.includes(".") ? [it.fn.slice(0, it.fn.lastIndexOf(".")), it.fn.slice(it.fn.lastIndexOf("."))] : wrap(it.fn, 28);
    const val = it.returned && it.returned !== "None" ? ["→ " + (it.returned.length > 26 ? it.returned.slice(0, 25) + "…" : it.returned)] : [];
    h = 12 + (name.length + val.length) * 13;
    el("rect", { x: CX - BOX / 2, y: top, width: BOX, height: h, rx: 3, class: "shape" }, g);
    textLines(g, name, CX, top + 16, "middle");
    textLines(g, val, CX, top + 16 + name.length * 13, "middle", "val");
    const title = el("title", {}, g); title.textContent = `${it.fn}  (${it.file}:${it.line})` + (it.returned ? `\nreturns ${it.returned}` : "");
    g.onclick = () => { showCode(it.file, it.line, it.end); if (it.chapter) $("ch-" + it.chapter).scrollIntoView(); };
  } else {  // decision
    let lines = wrap(it.question, 16);
    if (lines.length > 3) lines = [...lines.slice(0, 2), lines[2].slice(0, 15) + "…"];
    h = 34 + lines.length * 13;
    const hw = 100;
    el("path", { d: `M${CX},${top} L${CX + hw},${top + h / 2} L${CX},${top + h} L${CX - hw},${top + h / 2} Z`, class: "shape" }, g);
    textLines(g, lines, CX, top + h / 2 - (lines.length - 1) * 6 + 4, "middle");
    // the road not taken
    const ex = el("g", { class: "exit" }, g);
    const exitLines = wrap(it.exit, 20).slice(0, 3);
    const eh = 10 + exitLines.length * 13, ey = top + h / 2 - eh / 2;
    el("path", { d: `M${CX + hw},${top + h / 2} H${SIDE_X - 1}`, class: "road", "marker-end": "url(#dash)" }, ex);
    const sa = el("text", { x: CX + hw + 5, y: top + h / 2 - 5, class: "ans side" }, ex); sa.textContent = it.side;
    el("rect", { x: SIDE_X, y: ey, width: SIDE_W, height: eh, rx: 3 }, ex);
    textLines(ex, exitLines, SIDE_X + 6, ey + 15, "start");
    sa.setAttribute("x", CX + hw + 3);
    const title = el("title", {}, g); title.textContent = `${it.question}\ntaken: ${it.answer}\notherwise (${it.side}): ${it.exit}\n${it.file}:${it.line}`;
    g.onclick = () => { showCode(it.file, it.line, it.end); if (it.chapter) $("ch-" + it.chapter).scrollIntoView(); };
  }
  if (prevBottom != null) connect(prevBottom, top, pendingLabel);
  pendingLabel = it.kind === "decision" ? it.answer : null;
  if (pendingLabel && pendingLabel.length > 18) pendingLabel = pendingLabel.slice(0, 17) + "…";
  prevBottom = top + h; y = prevBottom;
  if (it.chapter != null && bandOf[it.chapter]) bandOf[it.chapter].bottom = y;
}
y += 12;
for (const [n, b] of Object.entries(bandOf)) {
  const ch = chapterTitle[n];
  const g = el("g", { class: "band" + (ch && ch.md ? "" : " unwritten"), id: "band-" + n }, bandsLayer);
  el("rect", { x: 0, y: b.top, width: 380, height: b.bottom - b.top + 8, rx: 6 }, g);
  const t = el("text", { x: 6, y: b.top + 14 }, g);
  t.textContent = `${n} · ${ch ? (ch.title.length > 48 ? ch.title.slice(0, 47) + "…" : ch.title) : ""}`;
  g.style.cursor = "pointer";
  g.onclick = () => $("ch-" + n).scrollIntoView();
}
svg.setAttribute("viewBox", `0 0 380 ${y}`);
svg.setAttribute("height", y);

// ---- story
const story = $("story");
const cite = new RegExp(D.repo.url.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "/blob/[0-9a-f]+/([^#]+)#L(\\d+)(?:-L(\\d+))?");
for (const ch of D.chapters) {
  const sec = document.createElement("section");
  sec.className = "chapter"; sec.id = "ch-" + ch.n; sec.dataset.n = ch.n;
  const prose = document.createElement("div"); prose.className = "prose";
  if (ch.md) {
    prose.innerHTML = marked.parse(ch.md);
    for (const q of prose.querySelectorAll("blockquote")) {  // "**For the owner:** …" callouts
      const lead = q.querySelector("p > strong:first-child");
      if (lead && /^for the /i.test(lead.textContent)) q.classList.add("aside");
    }
    for (const a of prose.querySelectorAll("a[href]")) {
      const m = a.getAttribute("href").match(cite);
      if (!m) { a.target = "_blank"; a.rel = "noopener"; continue; }
      a.className = "cite";
      a.dataset.path = m[1]; a.dataset.a = m[2]; a.dataset.b = m[3] || m[2];
      a.onclick = (e) => { e.preventDefault(); pick(a, true); };
    }
  } else {
    prose.innerHTML = `<h1></h1><div class="pending">This chapter is planned but not written yet.<div class="io"></div></div>`;
    prose.querySelector("h1").textContent = `Chapter ${ch.n} · ${ch.title}`;
    prose.querySelector(".io").textContent = `enters as ${ch.data_in}\nleaves as ${ch.data_out}`;
  }
  sec.append(prose);
  story.append(sec);
}

// ---- code panel
const panel = $("code");
let pinned = null;
function showCode(path, a, b) {
  a = +a; b = +b;
  const src = D.files[path];
  $("where").textContent = `${path}:${a}${b !== a ? "-" + b : ""}`;
  $("gh").href = permalink(path, a, b);
  const body = $("codebody");
  body.textContent = "";
  if (src === undefined) { body.innerHTML = '<div class="code-empty">This file is not part of the repository snapshot.</div>'; return; }
  const frag = document.createDocumentFragment();
  src.split("\n").forEach((text, i) => {
    const row = document.createElement("div");
    row.className = "ln" + (i + 1 >= a && i + 1 <= b ? " hl" : "");
    const n = document.createElement("span"); n.textContent = i + 1;
    const t = document.createElement("span"); t.textContent = text || " ";
    row.append(n, t); frag.append(row);
  });
  body.append(frag);
  const first = body.children[Math.max(0, a - 1)];
  if (first) body.scrollTop += first.getBoundingClientRect().top - body.getBoundingClientRect().top - body.clientHeight * 0.3;
  panel.classList.add("open");
}
function pick(a, byClick) {
  document.querySelectorAll("a.cite.on").forEach((x) => x.classList.remove("on"));
  a.classList.add("on");
  if (byClick) pinned = a.closest("p, li, td, blockquote");
  showCode(a.dataset.path, a.dataset.a, a.dataset.b);
}
$("close").onclick = () => panel.classList.remove("open");

// ---- follow the reader: current chapter on the map, current paragraph's code on the right
const wide = () => window.matchMedia("(min-width: 1361px)").matches;
let current = null, activePara = null;
function follow() {
  const mid = window.innerHeight * 0.4;
  let sec = null;
  for (const s of document.querySelectorAll(".chapter")) { const r = s.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid) sec = s; }
  if (sec && sec.dataset.n !== current) {
    current = sec.dataset.n;
    document.querySelectorAll(".band.active").forEach((b) => b.classList.remove("active"));
    const band = $("band-" + current);
    if (band) {
      band.classList.add("active");
      const map = document.querySelector(".map");
      if (window.matchMedia("(min-width: 761px)").matches) {
        const r = band.getBoundingClientRect(), m = map.getBoundingClientRect();
        if (r.top < m.top || r.top > m.bottom - 80) map.scrollTop += r.top - m.top - 40;
      }
    }
  }
  if (!wide()) return;  // on narrow screens the code opens only when asked
  let para = null;
  for (const p of document.querySelectorAll(".chapter p")) {
    if (!p.querySelector("a.cite")) continue;
    const r = p.getBoundingClientRect(); if (r.top <= mid && r.bottom > mid - 40) { para = p; break; }
  }
  if (para && para !== activePara) {
    if (activePara) activePara.classList.remove("active");
    activePara = para; para.classList.add("active");
    if (pinned !== para) { pinned = null; pick(para.querySelector("a.cite"), false); }
  }
}
let ticking = false;
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; follow(); }); } }, { passive: true });
addEventListener("resize", follow);
follow();
if (wide()) { const first = document.querySelector("a.cite"); if (first && !activePara) pick(first, false); }
</script>
