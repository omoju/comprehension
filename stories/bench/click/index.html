alue from a command callback has no effect on the process exit code. If a command must fail, call `ctx.exit(n)` or raise a `ClickException`; a `return 1` will exit 0 and look like success to CI.\n\n## Closing before raising\n\n[`Context.exit`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L845-L853) does two things in order. It calls [`close()`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L715-L721), which forwards to [`_close_with_exception_info(None, None, None)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L722-L738) and unwinds the `ExitStack` that has been riding along since chapter 3 \u2014 every `call_on_close` callback, every `with_resource` context manager. Nothing is registered here, so it returns `False`. A fresh `ExitStack` is installed in its place, so the context survives reuse.\n\nOnly then does it raise [`Exit(0)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/exceptions.py#L366-L378) \u2014 a bare `RuntimeError` subclass carrying one integer. The ordering is the guarantee: an early exit still runs your cleanup. A `click.File` parameter opened during parsing gets flushed and closed before the process goes away, not after.\n\nThe `Exit` travels up through `main`'s `with self.make_context(...) as ctx` block, so [`Context.__exit__`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L580-L592) runs with the live `(Exit, Exit(0), <traceback>)` triple. `_depth` drops to 0, so `_close_with_exception_info` is called a second time \u2014 on the new, empty stack, returning `False` again \u2014 and this time the exception information is forwarded into `ExitStack.__exit__`. That is not decoration: a registered resource can inspect the failure that is tearing the context down, and can suppress it by returning true. Then [`pop_context()`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/globals.py#L49-L51) removes the context from the thread-local stack, and `__exit__` returns `False`, letting the `Exit` keep going.\n\n## The ladder, and the road not taken\n\n[`except Exit`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1599-L1611) copies `e.exit_code` into the local `exit_code`, leaves `report` as `None`, and the teardown after the `try` [writes nothing and calls `sys.exit(0)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1637-L1640).\n\nHad `--count=x` arrived instead, the `BadParameter` raised back in chapter 7 would have been caught by [`except ClickException`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1625-L1629), which sets `report, exit_code = e.show, e.exit_code` \u2014 2 for a `UsageError`. [`UsageError.show`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/exceptions.py#L87-L111) then prints the usage line, a hint built from the *longest* help name (`Try 'hello --help' for help.`), and `Error: Invalid value for '--count': 'x' is not a valid integer.` \u2014 all to stderr. A `Ctrl-C` or exhausted stdin would have gone through [the `EOFError`/`KeyboardInterrupt` arm](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1617-L1624) to `Aborted!` and the initial `exit_code = 1`.\n\nOne policy is worth naming because it is a conscious trade. The whole ladder, *including* the reporting step, sits inside [an outer `except (EOFError, KeyboardInterrupt)`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/core.py#L1641-L1645) that simply calls `sys.exit(exit_code)`. If a user interrupts while the error message is being written, the message may be lost \u2014 the intended exit code still wins.\n\n## What the runner makes of a `SystemExit`\n\n`sys.exit(0)` raises `SystemExit`, which the runner catches in [its own handler](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L688-L703). `e.code` is `0`, so it is not `None` and not non-zero: `exception` stays `None`, `exit_code` becomes `0`, and `exc_info` keeps the `(SystemExit, SystemExit(0), traceback)` triple for anyone who wants it. A non-integer code would have been written to stdout and coerced to `1`.\n\nSeparately, [`except Exception`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L705-L710) swallows a genuine crash into `exit_code = 1` plus `result.exception`, because `catch_exceptions` defaults to `True`.\n\n> **For the owner:** A test that asserts only on `result.output` will pass while the command crashed, because the exception is captured rather than raised. Assert `result.exit_code == 0` (or pass `catch_exceptions=False`) in every test that is meant to prove a command works.\n\nThe [`finally`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L711-L728) flushes both streams \u2014 two more `BytesIOCopy.flush` calls \u2014 and, in `fd` mode, stops the `_FDCapture`s and merges their bytes into the same buffers so late or C-level writes are not lost. Here `capture='sys'`, so it goes straight to `getvalue()` on all three buffers: `b'Your name: Click\\nHello, Click!\\nHello, Click!\\nHello, Click!\\n'` for stdout and for the mixed output, `b''` for stderr.\n\nLeaving the `with self.isolation(...)` block runs [isolation's own `finally`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L576-L594): `os.environ` keys restored (including deleting ones that were absent), `sys.stdout/stderr/stdin` put back, the two `termui` prompt hooks and `_getchar` restored, both references to `should_strip_ansi` restored, `FORCED_WIDTH` restored, `pdb.Pdb.__init__` unpatched. Unconditionally, whatever happened inside. As the old wrappers lose their last reference, their `close` runs \u2014 and [that method is an empty no-op by design](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L184-L190), because the `BytesIO` underneath belongs to the `StreamMixer` and the `Result` is about to read it.\n\n[`Result`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L262-L280) is a plain record of those bytes. [`result.output`](https://github.com/pallets/click/blob/06b2a678741131fd577ce170e23e5ca0aeba0309/src/click/testing.py#L282-L292) decodes with `errors='replace'` and normalises `\\r\\n`, so undecodable output never raises at assertion time \u2014 and the string the scenario prints is `'Your name: Click\\nHello, Click!\\nHello, Click!\\nHello, Click!\\n'`, exactly what a user at a terminal would have seen.\n\n> **Leaves as:** `Result(exit_code=0, exception=None, exc_info=(SystemExit, SystemExit(0), tb), stdout_bytes=b'Your name: Click\\nHello, Click!\\nHello, Click!\\nHello, Click!\\n', stderr_bytes=b'')`, and `result.output` as the matching `str`\n"}], "flow": [{"kind": "start", "label": "The caller runs the intended use", "chapter": null}, {"kind": "step", "fn": "option \u00d71", "file": "src/click/decorators.py", "line": 352, "end": 377, "depth": 1, "returned": "<function option.<locals>.decorator at 0x10bc41760>", "chapter": 1}, {"kind": "data", "label": "<function option.<locals>.decorator at 0x10bc41760>", "chapter": 1}, {"kind": "step", "fn": "option.<locals>.decorator \u00d71", "file": "src/click/decorators.py", "line": 373, "end": 375, "depth": 1, "returned": "<function hello at 0x10bc41800>", "chapter": 1}, {"kind": "data", "label": "<function hello at 0x10bc41800>", "chapter": 1}, {"kind": "step", "fn": "Result.output \u00d71", "file": "src/click/testing.py", "line": 282, "end": 292, "depth": 1, "returned": "'Your name: Click\\nHello, Click!\\nHello, Click!\\nHello, Click!\\n'", "chapter": 9}, {"kind": "data", "label": "'Your name: Click\\nHello, Click!\\nHello, Click!\\nHello, Click!\\n'", "chapter": 9}, {"kind": "step", "fn": "command", "file": "src/click/decorators.py", "line": 168, "end": 255, "depth": 1, "returned": "<function command.<locals>.decorator at 0x10bc09ee0>", "chapter": 1}, {"kind": "decision", "line": 208, "end": 212, "question": "callable(name)", "answer": "no", "side": "yes", "exit": "func = name", "file": "src/click/decorators.py", "chapter": 1}, {"kind": "decision", "line": 218, "end": 219, "question": "isinstance(f, Command)", "answer": "no", "side": "yes", "exit": "raise TypeError", "file": "src/click/decorators.py", "chapter": 1}, {"kind": "decision", "line": 224, "end": 230, "question": "decorator_params = f.__click_params__ fails?", "answer": "no", "side": "yes", "exit": "pass", "file": "src/click/decorators.py", "chapter": 1}, {"kind": "decision", "line": 235, "end": 237, "question": "t.TYPE_CHECKING", "answer": "no", "side": "yes", "exit": "assert cls is not None", "file": "src/click/decorators.py", "chapter": 1}, {"kind": "decision", "line": 245, "end": 246, "question": "sep and suffix in {'command', 'cmd', 'group', 'grp'}", "answer": "no", "side": "yes", "exit": "cmd_name = cmd_left", "file": "src/click/decorators.py", "chapter": 1}, {"kind": "data", "label": "<function command.<locals>.decorator at 0x10bc09ee0>", "chapter": 1}, {"kind": "step", "fn": "command.<locals>.decorator", "file": "src/click/decorators.py", "line": 217, "end": 250, "depth": 1, "returned": "<Command hello>", "chapter": 1}, {"kind": "decision", "line": 218, "end": 219, "question": "isinstance(f, Command)", "answer": "no", "side": "yes", "exit": "raise TypeError", "file": "src/click/decorators.py", "chapter": 1}, {"kind": "decision", "line": 224, "end": 230, "question": "decorator_params = f.__click_params ion_order: cabc.Sequence[Parameter],\n) -> list[Parameter]:\n    \"\"\"Returns all declared parameters in the order they should be processed.\n\n    The declared parameters are re-shuffled depending on the order in which\n    they were invoked, as well as the eagerness of each parameters.\n\n    The invocation order takes precedence over the declaration order. I.e. the\n    order in which the user provided them to the CLI is respected.\n\n    This behavior and its effect on callback evaluation is detailed at:\n    https://click.palletsprojects.com/en/stable/advanced/#callback-evaluation-order\n    \"\"\"\n\n    def sort_key(item: Parameter) -> tuple[bool, float]:\n        try:\n            idx: float = invocation_order.index(item)\n        except ValueError:\n            idx = float(\"inf\")\n\n        return not item.is_eager, idx\n\n    return sorted(declaration_order, key=sort_key)\n\n\nclass ParameterSource(enum.IntEnum):\n    \"\"\"This is an :class:`~enum.IntEnum` that indicates the source of a\n    parameter's value.\n\n    Use :meth:`click.Context.get_parameter_source` to get the\n    source for a parameter by name.\n\n    Members are ordered from most explicit to least explicit source.\n    This allows comparison to check if a value was explicitly provided:\n\n    .. code-block:: python\n\n        source = ctx.get_parameter_source(\"port\")\n        if source < click.ParameterSource.DEFAULT_MAP:\n            ...  # value was explicitly set\n\n    .. versionchanged:: 8.3.3\n        Use :class:`~enum.IntEnum` and reorder members from most to\n        least explicit. Supports comparison operators.\n\n    .. versionchanged:: 8.0\n        Use :class:`~enum.Enum` and drop the ``validate`` method.\n\n    .. versionchanged:: 8.0\n        Added the ``PROMPT`` value.\n    \"\"\"\n\n    PROMPT = enum.auto()\n    \"\"\"Used a prompt to confirm a default or provide a value.\"\"\"\n    COMMANDLINE = enum.auto()\n    \"\"\"The value was provided by the command line args.\"\"\"\n    ENVIRONMENT = enum.auto()\n    \"\"\"The value was provided with an environment variable.\"\"\"\n    DEFAULT_MAP = enum.auto()\n    \"\"\"Used a default provided by :attr:`Context.default_map`.\"\"\"\n    DEFAULT = enum.auto()\n    \"\"\"Used the default specified by the parameter.\"\"\"\n\n\nclass Context:\n    \"\"\"The context is a special internal object that holds state relevant\n    for the script execution at every single level.  It's normally invisible\n    to commands unless they opt-in to getting access to it.\n\n    The context is useful as it can pass internal objects around and can\n    control special execution features such as reading data from\n    environment variables.\n\n    A context can be used as context manager in which case it will call\n    :meth:`close` on teardown.\n\n    :param command: the command class for this context.\n    :param parent: the parent context.\n    :param info_name: the info name for this invocation.  Generally this\n                      is the most descriptive name for the script or\n                      command.  For the toplevel script it is usually\n                      the name of the script, for commands below that it's\n                      the name of the script.\n    :param obj: an arbitrary object of user data.\n    :param auto_envvar_prefix: the prefix to use for automatic environment\n                               variables.  If this is `None` then reading\n                               from environment variables is disabled.  This\n                               does not affect manually set environment\n                               variables which are always read.\n    :param default_map: a dictionary (like object) with default values\n                        for parameters.\n    :param terminal_width: the width of the terminal.  The default is\n                           inherit from parent context.  If no context\n                           defines the terminal width then auto\n                           detection will be applied.\n    :param max_content_width: the maximum width for content rendered by\n                              Click (this currently only affects help\n                              pages).  This defaults to 80 characters if\n                              not overridden.  In other words: even if the\n                              terminal is larger than that, Click will not\n                              format things wider than 80 characters by\n                              default.  In addition to that, formatters might\n                              add some safety mapping on the right.\n    :param resilient_parsing: if this flag is enabled then Click will\n                              parse without any interactivity or callback\n                              invocation.  Default values will also be\n                              ignored.  This is useful for implementing\n                              things such as completion support.\n    :param allow_extra_args: if this is set to `True` then extra arguments\n                             at the end will not raise an error and will be\n                             kept on the context.  The default is to inherit\n                             from the command.\n    :param allow_interspersed_args: if this is set to `False` then options\n                                    and arguments cannot be mixed.  The\n                                    default is to inherit from the command.\n    :param ignore_unknown_options: instructs click to ignore options it does\n                                   not know and keeps them for later\n                                   processing.\n    :param help_option_names: optionally a list of strings that define how\n                              the default help parameter is named.  The\n                              default is ``['--help']``.\n    :param token_normalize_func: an optional function that is used to\n                                 normalize tokens (options, choices,\n                                 etc.).  This for instance can be used to\n                                 implement case insensitive behavior.\n    :param color: controls if the terminal supports ANSI colors or not.  The\n                  default is autodetection.  This is only needed if ANSI\n                  codes are used in texts that Click prints which is by\n                  default not the case.  This for instance would affect\n                  help output.\n    :param show_default: Show the default value for commands. If this\n        value is not set, it defaults to the value from the parent\n        context. ``Command.show_default`` overrides this default for the\n        specific command.\n\n    .. versionchanged:: 8.2\n        The ``protected_args`` attribute is deprecated and will be removed in\n        Click 9.0. ``args`` will contain remaining unparsed tokens.\n\n    .. versionchanged:: 8.1\n        The ``show_default`` parameter is overridden by\n        ``Command.show_default``, instead of the other way around.\n\n    .. versionchanged:: 8.0\n        The ``show_default`` parameter defaults to the value from the\n        parent context.\n\n    .. versionchanged:: 7.1\n       Added the ``show_default`` parameter.\n\n    .. versionchanged:: 4.0\n        Added the ``color``, ``ignore_unknown_options``, and\n        ``max_content_width`` parameters.\n\n    .. versionchanged:: 3.0\n        Added the ``allow_extra_args`` and ``allow_interspersed_args``\n        parameters.\n\n    .. versionchanged:: 2.0\n        Added the ``resilient_parsing``, ``help_option_names``, and\n        ``token_normalize_func`` parameters.\n    \"\"\"\n\n    #: The formatter class to create with :meth:`make_formatter`.\n    #:\n    #: .. versionadded:: 8.0\n    formatter_class: type[HelpFormatter] = HelpFormatter\n\n    parent: Context | None\n    command: Command\n    info_name: str | None\n    params: dict[str, t.Any]\n    args: list[str]\n    _protected_args: list[str]\n    _opt_prefixes: set[str]\n    obj: t.Any\n    _meta: dict[str, t.Any]\n    default_map: cabc.MutableMapping[str, t.Any] | None\n    invoked_subcommand: str | None\n    terminal_width: int | None\n    max_content_width: int | None\n    allow_extra_args: bool\n    allow_interspersed_args: bool\n    ignore_unknown_options: bool\n    help_option_names: list[str]\n    token_normalize_func: t.Callable[[str], str] | None\n    resilient_parsing: bool\n    auto_envvar_prefix: str | None\n    color: bool | None\n    show_default: bool | None\n    _close_callbacks: list[t.Callable[[], t.Any]]\n    _depth: int\n    _parameter_source: dict[str, ParameterSource]\n    _param_default_explicit: dict[str, bool]\n    _exit_stack: ExitStack\n\n    def __init__(\n        self,\n        command: Command,\n        parent: Context | None = None,\n        info_name: str | None = None,\n        obj: t.Any | None = None,\n        auto_envvar_prefix: str | None = None,\n        default_map: cabc.MutableMapping[str, t.Any] | None = None,\n        terminal_width: int | None = None,\n        max_content_width: int | None = None,\n        resilient_parsing: bool = False,\n        allow_extra_args: bool | None = None,\n        allow_interspersed_args: bool | None = None,\n        ignore_unknown_options: bool | None = None,\n        help_option_names: list[str] | None = None,\n        token_normalize_func: t.Callable[[str], str] | None = None,\n        color: bool | None = None,\n        show_default: bool | None = None,\n    ) -> None:\n        #: the parent context or `None` if none exists.\n        self.parent = parent\n        #: the :class:`Command` for this context.\n        self.command = command\n        #: the descriptive information name\n        self.info_name = info_name\n        #: Map of parameter names to their parsed values. Parameters\n        #: with ``expose_value=False`` are not stored.\n        self.params = {}\n        #: the leftover arguments.\n        self.args = []\n        #: protected arguments.  These are arguments that are prepended\n        #: to `args` when certain parsing scenarios are encountered but\n        #: must be never propagated to another arguments.  This is used\n        #: to implement nested parsing.\n        self._protected_args = []\n        #: the collected prefixes of the command's options.\n        self._opt_prefixes = set(parent._opt_prefixes) if parent else set()\n\n        if obj is None and parent is not None:\n            obj = parent.obj\n\n        #: the user object stored.\n        self.obj = obj\n        self._meta = getattr(parent, \"meta\", {})\n\n        #: A dictionary (-like object) with defaults for parameters.\n        if (\n            default_map is None\n            and info_name is not None\n            and parent is not None\n            and parent.default_map is not None\n        ):\n            default_map = parent.default_map.get(info_name)\n\n        self.default_map = default_map\n\n        #: This flag indicates if a subcommand is going to be executed. A\n        #: group callback can use this information to figure out if it's\n        #: being executed directly or because the execution flow passes\n        #: onwards to a subcommand. By default it's None, but it can be\n        #: the name of the subcommand to execute.\n        #:\n        #: If chaining is enabled this will be set to ``'*'`` in case\n        #: any commands are executed.  It is however not possible to\n        #: figure out which ones.  If you require this knowledge you\n        #: should use a :func:`result_callback`.\n        self.invoked_subcommand = None\n\n        if terminal_width is None and parent is not None:\n            terminal_width = parent.terminal_width\n\n        #: The width of the terminal (None is autodetection).\n        self.terminal_width = terminal_width\n\n        if max_content_width is None and parent is not None:\n            max_content_width = parent.max_content_width\n\n        #: The maximum width of formatted content (None implies a sensible\n        #: default which is 80 for most things).\n        self.max_content_width = max_content_width\n\n        if allow_extra_args is None:\n            allow_extra_args = command.allow_extra_args\n\n        #: Indicates if the context allows extra args or if it should\n        #: fail on parsing.\n        #:\n        #: .. versionadded:: 3.0\n        self.allow_extra_args = allow_extra_args\n\n        if allow_interspersed_args is None:\n            allow_interspersed_args = command.allow_interspersed_args\n\n        #: Indicates if the context allows mixing of arguments and\n        #: options or not.\n        #:\n        #: .. versionadded:: 3.0\n        self.allow_interspersed_args = allow_interspersed_args\n\n        if ignore_unknown_options is None:\n            ignore_unknown_options = command.ignore_unknown_options\n\n        #: Instructs click to ignore options that a command does not\n        #: understand and will store it on the context for later\n        #: processing.  This is primarily useful for situations where you\n        #: want to call into external programs.  Generally this pattern is\n        #: strongly discouraged because it's not possibly to losslessly\n        #: forward all arguments.\n        #:\n        #: .. versionadded:: 4.0\n        self.ignore_unknown_options = ignore_unknown_options\n\n        if help_option_names is None:\n            if parent is not None:\n                help_option_names = parent.help_option_names\n            else:\n                help_option_names = [\"--help\"]\n\n        #: The names for the help options.\n        self.help_option_names = help_option_names\n\n        if token_normalize_func is None and parent is not None:\n            token_normalize_func = parent.token_normalize_func\n\n        #: An optional normalization function for tokens.  This is\n        #: options, choices, commands etc.\n        self.token_normalize_func = token_normalize_func\n\n        #: Indicates if resilient parsing is enabled.  In that case Click\n        #: will do its best to not cause any failures and default values\n        #: will be ignored. Useful for completion.\n        self.resilient_parsing = resilient_parsing\n\n        # If there is no envvar prefix yet, but the parent has one and\n        # the command on this level has a name, we can expand the envvar\n        # prefix automatically.\n        if auto_envvar_prefix is None:\n            if (\n                parent is not None\n                and parent.auto_envvar_prefix is not None\n                and self.info_name is not None\n            ):\n                auto_envvar_prefix = (\n                    f\"{parent.auto_envvar_prefix}_{self.info_name.upper()}\"\n                )\n        else:\n            auto_envvar_prefix = auto_envvar_prefix.upper()\n\n        if auto_envvar_prefix is not None:\n            auto_envvar_prefix = auto_envvar_prefix.replace(\"-\", \"_\")\n\n        self.auto_envvar_prefix = auto_envvar_prefix\n\n        if color is None and parent is not None:\n            color = parent.color\n\n        #: Controls if styling output is wanted or not.\n        self.color = color\n\n        if show_default is None and parent is not None:\n            show_default = parent.show_default\n\n        #: Show option default values when formatting help text.\n        self.show_default = show_default\n\n        self._close_callbacks = []\n        self._depth = 0\n        self._parameter_source = {}\n        # Tracks whether the option that currently owns each parameter slot in\n        # :attr:`params` had its ``default`` set explicitly by the user. Used\n        # to tie-break feature-switch groups where multiple options share a\n        # parameter name and both fall back to their default value.\n        # Refs: https://github.com/pallets/click/issues/3403\n        self._param_default_explicit = {}\n        self._exit_stack = ExitStack()\n\n    @property\n    def protected_args(self) -> list[str]:\n        import warnings\n\n        warnings.warn(\n            \"'protected_args' is deprecated and will be removed in Click 9.0.\"\n            \" 'args' will contain remaining unparsed tokens.\",\n            DeprecationWarning,\n            stacklevel=2,\n        )\n        return self._protected_args\n\n    def to_info_dict(self) -> dict[str, t.Any]:\n        \"\"\"Gather information that could be useful for a tool generating\n        user-facing documentation. This traverses the entire CLI\n        structure.\n\n        .. code-block:: python\n\n            with Context(cli) as ctx:\n                info = ctx.to_info_dict()\n\n        .. versionadded:: 8.0\n        \"\"\"\n        return {\n            \"command\": self.command.to_info_dict(self),\n            \"info_name\": self.info_name,\n            \"allow_extra_args\": self.allow_extra_args,\n            \"allow_interspersed_args\": self.allow_interspersed_args,\n            \"ignore_unknown_options\": self.ignore_unknown_options,\n            \"auto_envvar_prefix\": self.auto_envvar_prefix,\n        }\n\n    def __enter__(self) -> Self:\n        self._depth += 1\n        push_context(self)\n        return self\n\n    def __exit__(\n        self,\n        exc_type: type[BaseException] | None,\n        exc_value: BaseException | None,\n        tb: TracebackType | None,\n    ) -> bool | None:\n        self._depth -= 1\n        exit_result: bool | None = None\n        if self._depth == 0:\n            exit_result = self._close_with_exception_info(exc_type, exc_value, tb)\n        pop_context()\n\n        return exit_result\n\n    @contextmanager\n    def scope(self, cleanup: bool = True) -> cabc.Generator[Context]:\n        \"\"\"This helper method can be used with the context object to promote\n        it to the current thread local (see :func:`get_current_context`).\n        The default behavior of this is to invoke the cleanup functions which\n        can be disabled by setting `cleanup` to `False`.  The cleanup\n        functions are typically used for things such as closing file handles.\n\n        If the cleanup is intended the context object can also be directly\n        used as a context manager.\n\n        Example usage::\n\n            with ctx.scope():\n                assert get_current_context() is ctx\n\n        This is equivalent::\n\n            with ctx:\n                assert get_current_context() is ctx\n\n        .. versionadded:: 5.0\n\n        :param cleanup: controls if the cleanup functions should be run or\n                        not.  The default is to run these functions.  In\n                        some situations the context only wants to be\n                        temporarily pushed in which case this can be disabled.\n                        Nested pushes automatically defer the cleanup.\n        \"\"\"\n        if not cleanup:\n            self._depth += 1\n        try:\n            with self as rv:\n                yield rv\n        finally:\n            if not cleanup:\n                self._depth -= 1\n\n    @property\n    def meta(self) -> dict[str, t.Any]:\n        \"\"\"This is a dictionary which is shared with all the contexts\n        that are nested.  It exists so that click utilities can store some\n        state here if they need to.  It is however the responsibility of\n        that code to manage this dictionary well.\n\n        The keys are supposed to be unique dotted strings.  For instance\n        module paths are a good choice for it.  What is stored in there is\n        irrelevant for the operation of click.  However what is important is\n        that code that places data here adheres to the general semantics of\n        the system.\n\n        Example usage::\n\n            LANG_KEY = f'{__name__}.lang'\n\n            def set_language(value):\n                ctx = get_current_context()\n                ctx.meta[LANG_KEY] = value\n\n            def get_language():\n                return get_current_context().meta.get(LANG_KEY, 'en_US')\n\n        .. versionadded:: 5.0\n        \"\"\"\n        return self._meta\n\n    def make_formatter(self) -> HelpFormatter:\n        \"\"\"Creates the :class:`~click.HelpFormatter` for the help and\n        usage output.\n\n        To quickly customize the formatter class used without overriding\n        this method, set the :attr:`formatter_class` attribute.\n\n        .. versionchanged:: 8.0\n            Added the :attr:`formatter_class` attribute.\n        \"\"\"\n        return self.formatter_class(\n            width=self.terminal_width, max_width=self.max_content_width\n        )\n\n    def with_resource(self, context_manager: AbstractContextManager[V]) -> V:\n        \"\"\"Register a resource as if it were used in a ``with``\n        statement. The resource will be cleaned up when the context is\n        popped.\n\n        Uses :meth:`contextlib.ExitStack.enter_context`. It calls the\n        resource's ``__enter__()`` method and returns the result. When\n        the context is popped, it closes the stack, which calls the\n        resource's ``__exit__()`` method.\n\n        To register a cleanup function for something that isn't a\n        context manager, use :meth:`call_on_close`. Or use something\n        from :mod:`contextlib` to turn it into a context manager first.\n\n        .. code-block:: python\n\n            @click.group()\n            @click.option(\"--name\")\n            @click.pass_context\n            def cli(ctx):\n                ctx.obj = ctx.with_resource(connect_db(name))\n\n        :param context_manager: The context manager to enter.\n        :return: Whatever ``context_manager.__enter__()`` returns.\n\n        .. versionadded:: 8.0\n        \"\"\"\n        return self._exit_stack.enter_context(context_manager)\n\n    def call_on_close(self, f: t.Callable[..., t.Any]) -> t.Callable[..., t.Any]:\n        \"\"\"Register a function to be called when the context tears down.\n\n        This can be used to close resources opened during the script\n        execution. Resources that support Python's context manager\n        protocol which would be used in a ``with`` statement should be\n        registered with :meth:`with_resource` instead.\n\n        :param f: The function to execute on teardown.\n        \"\"\"\n        return self._exit_stack.callback(f)\n\n    def close(self) -> None:\n        \"\"\"Invoke all close callbacks registered with\n        :meth:`call_on_close`, and exit all context managers entered\n        with :meth:`with_resource`.\n        \"\"\"\n        self._close_with_exception_info(None, None, None)\n\n    def _close_with_exception_info(\n        self,\n        exc_type: type[BaseException] | None,\n        exc_value: BaseException | None,\n        tb: TracebackType | None,\n    ) -> bool | None:\n        \"\"\"Unwind the exit stack by calling its :meth:`__exit__` providing the exception\n        information to allow for exception handling by the various resources registered\n        using :meth;`with_resource`\n\n        :return: Whatever ``exit_stack.__exit__()`` returns.\n        \"\"\"\n        exit_result = self._exit_stack.__exit__(exc_type, exc_value, tb)\n        # In case the context is reused, create a new exit stack.\n        self._exit_stack = ExitStack()\n\n        return exit_result\n\n    @property\n    def command_path(self) -> str:\n        \"\"\"The computed command path.  This is used for the ``usage``\n        information on the help page.  It's automatically created by\n        combining the info names of the chain of contexts to the root.\n        \"\"\"\n        rv = \"\"\n        if self.info_name is not None:\n            rv = self.info_name\n        if self.parent is not None:\n            parent_command_path = [self.parent.command_path]\n\n            if isinstance(self.parent.command, Command):\n                for param in self.parent.command.get_params(self):\n                    parent_command_path.extend(param.get_usage_pieces(self))\n\n            rv = f\"{' '.join(parent_command_path)} {rv}\"\n        return rv.lstrip()\n\n    def find_root(self) -> Context:\n        \"\"\"Finds the outermost context.\"\"\"\n        node = self\n        while node.parent is not None:\n            node = node.parent\n        return node\n\n    def find_object(self, object_type: type[V]) -> V | None:\n        \"\"\"Finds the closest object of a given type.\"\"\"\n        node: Context | None = self\n\n        while node is not None:\n            if isinstance(node.obj, object_type):\n                return node.obj\n\n            node = node.parent\n\n        return None\n\n    def ensure_object(self, object_type: type[V]) -> V:\n        \"\"\"Like :meth:`find_object` but sets the innermost object to a\n        new instance of `object_type` if it does not exist.\n        \"\"\"\n        rv = self.find_object(object_type)\n        if rv is None:\n            self.obj = rv = object_type()\n        return rv\n\n    def _default_map_has(self, name: str | None) -> bool:\n        \"\"\"Check if :attr:`default_map` contains a real value for ``name``.\n\n        Returns ``False`` when the key is absent, the map is ``None``,\n        ``name`` is ``None``, or the stored value is the internal\n        :data:`UNSET` sentinel.\n        \"\"\"\n        return (\n            name is not None\n            and self.default_map is not None\n            and name in self.default_map\n            and self.default_map[name] is not UNSET\n        )\n\n    @t.overload\n    def lookup_default(\n        self, name: str, call: t.Literal[True] = True\n    ) -> t.Any | None: ...\n\n    @t.overload\n    def lookup_default(\n        self, name: str, call: t.Literal[False] = ...\n    ) -> t.Any | t.Callable[[], t.Any] | None: ...\n\n    def lookup_default(self, name: str, call: bool = True) -> t.Any | None:\n        \"\"\"Get the default for a parameter from :attr:`default_map`.\n\n        :param name: Name of the parameter.\n        :param call: If the default is a callable, call it. Disable to\n            return the callable instead.\n\n        .. versionchanged:: 8.0\n            Added the ``call`` parameter.\n        \"\"\"\n        if not self._default_map_has(name):\n            return None\n\n        # Assert to make the type checker happy.\n        assert self.default_map is not None\n        value = self.default_map[name]\n\n        if call and callable(value):\n            return value()\n\n        return value\n\n    def fail(self, message: str) -> t.NoReturn:\n        \"\"\"Aborts the execution of the program with a specific error\n        message.\n\n        :param message: the error message to fail with.\n        \"\"\"\n        raise UsageError(message, self)\n\n    def abort(self) -> t.NoReturn:\n        \"\"\"Aborts the script.\"\"\"\n        raise Abort()\n\n    def exit(self, code: int = 0) -> t.NoReturn:\n        \"\"\"Exits the application with a given exit code.\n\n        .. versionchanged:: 8.2\n            Callbacks and context managers registered with :meth:`call_on_close`\n            and :meth:`with_resource` are closed before exiting.\n        \"\"\"\n        self.close()\n        raise Exit(code)\n\n    def get_usage(self) -> str:\n        \"\"\"Helper method to get formatted usage string for the current\n        context and command.\n        \"\"\"\n        return self.command.get_usage(self)\n\n    def get_help(self) -> str:\n        \"\"\"Helper method to get formatted help page for the current\n        context and command.\n        \"\"\"\n        return self.command.get_help(self)\n\n    def _make_sub_context(self, command: Command) -> Context:\n        \"\"\"Create a new context of the same type as this context, but\n        for a new command.\n\n        :meta private:\n        \"\"\"\n        return type(self)(command, info_name=command.name, parent=self)\n\n    @t.overload\n    def invoke(\n        self, callback: t.Callable[..., V], /, *args: t.Any, **kwargs: t.Any\n    ) -> V: ...\n\n    @t.overload\n    def invoke(self, callback: Command, /, *args: t.Any, **kwargs: t.Any) -> t.Any: ...\n\n    def invoke(\n        self, callback: Command | t.Callable[..., V], /, *args: t.Any, **kwargs: t.Any\n    ) -> t.Any | V:\n        \"\"\"Invokes a command callback in exactly the way it expects.  There\n        are two ways to invoke this method:\n\n        1.  the first argument can be a callback and all other arguments and\n            keyword arguments are forwarded directly to the function.\n        2.  the first argument is a click command object.  In that case all\n            arguments are forwarded as well but proper click parameters\n            (options and click arguments) must be keyword arguments and Click\n            will fill in defaults.\n\n        .. versionchanged:: 8.0\n            All ``kwargs`` are tracked in :attr:`params` so they will be\n            passed if :meth:`forward` is called at multiple levels.\n\n        .. versionchanged:: 3.2\n            A new context is created, and missing arguments use default values.\n        \"\"\"\n        if isinstance(callback, Command):\n            other_cmd = callback\n\n            if other_cmd.callback is None:\n                raise TypeError(\n                    \"The given command does not have a callback that can be invoked.\"\n                )\n            else:\n                callback = t.cast(\"t.Callable[..., V]\", other_cmd.callback)\n\n            ctx = self._make_sub_context(other_cmd)\n\n            for param in other_cmd.params:\n                if param.name not in kwargs and param.expose_value:\n                    default_value = param.get_default(ctx)\n                    # We explicitly hide the :attr:`UNSET` value to the user, as we\n                    # choose to make it an implementation detail. And because ``invoke``\n                    # has been designed as part of Click public API, we return ``None``\n                    # instead. Refs:\n                    # https://github.com/pallets/click/issues/3066\n                    # https://github.com/pallets/click/issues/3065\n                    # https://github.com/pallets/click/pull/3068\n                    if default_value is UNSET:\n                        default_value = None\n                    kwargs[param.name] = param.type_cast_value(ctx, default_value)\n\n            # Track all kwargs as params, so that forward() will pass\n            # them on in subsequent calls.\n            ctx.params.update(kwargs)\n        else:\n            ctx = self\n\n        with augment_usage_errors(self), ctx:\n            return callback(*args, **kwargs)\n\n    def forward(self, cmd: Command, /, *args: t.Any, **kwargs: t.Any) -> t.Any:\n        \"\"\"Similar to :meth:`invoke` but fills in default keyword\n        arguments from the current context if the other command expects\n        it.  This cannot invoke callbacks directly, only other commands.\n\n        .. versionchanged:: 8.0\n            All ``kwargs`` are tracked in :attr:`params` so they will be\n            passed if ``forward`` is called at multiple levels.\n        \"\"\"\n        # Can only forward to other commands, not direct callbacks.\n        if not isinstance(cmd, Command):\n            raise TypeError(\"Callback is not a command.\")\n\n        for param in self.params:\n            if param not in kwargs:\n                kwargs[param] = self.params[param]\n\n        return self.invoke(cmd, *args, **kwargs)\n\n    def set_parameter_source(self, name: str, source: ParameterSource) -> None:\n        \"\"\"Set the source of a parameter. This indicates the location\n        from which the value of the parameter was obtained.\n\n        :param name: The name of the parameter.\n        :param source: A member of :class:`~click.core.ParameterSource`.\n        \"\"\"\n        self._parameter_source[name] = source\n\n    def get_parameter_source(self, name: str) -> ParameterSource | None:\n        \"\"\"Get the source of a parameter. This indicates the location\n        from which the value of the parameter was obtained.\n\n        This can be useful for determining when a user specified a value\n        on the command line that is the same as the default value. It\n        will be :attr:`~click.core.ParameterSource.DEFAULT` only if the\n        value was actually taken from the default.\n\n        :param name: The name of the parameter.\n        :rtype: ParameterSource\n\n        .. versionchanged:: 8.0\n            Returns ``None`` if the parameter was not provided from any\n            source.\n        \"\"\"\n        return self._parameter_source.get(name)\n\n\nclass Command:\n    \"\"\"Commands are the basic building block of command line interfaces in\n    Click.  A basic command handles command line parsing and might dispatch\n    more parsing to commands nested below it.\n\n    :param name: the name of the command to use unless a group overrides it.\n    :param context_settings: an optional dictionary with defaults that are\n                             passed to the context object.\n    :param callback: the callback to invoke.  This is optional.\n    :param params: the parameters to register with this command.  This can\n                   be either :class:`Option` or :class:`Argument` objects.\n    :param help: the help string to use for this command.\n    :param epilog: like the help string but it's printed at the end of the\n                   help page after everything else.\n    :param short_help: the short help to use for this command.  This is\n                       shown on the command listing of the parent command.\n    :param add_help_option: by default each command registers a ``--help``\n                            option.  This can be disabled by this parameter.\n    :param no_args_is_help: this controls what happens if no arguments are\n                            provided.  This option is disabled by default.\n                            If enabled this will add ``--help`` as argument\n                            if no arguments are passed\n    :param hidden: hide this command from help outputs.\n    :param deprecated: If ``True`` or non-empty string, issues a message\n                        indicating that the command is deprecated and highlights\n                        its deprecation in --help. The message can be customized\n                        by using a string as the value.\n\n    .. versionchanged:: 8.2\n        This is the base class for all commands, not ``BaseCommand``.\n        ``deprecated`` can be set to a string as well to customize the\n        deprecation message.\n\n    .. versionchanged:: 8.1\n        ``help``, ``epilog``, and ``short_help`` are stored unprocessed,\n        all formatting is done when outputting help text, not at init,\n        and is done even if not using the ``@command`` decorator.\n\n    .. versionchanged:: 8.0\n        Added a ``repr`` showing the command name.\n\n    .. versionchanged:: 7.1\n        Added the ``no_args_is_help`` parameter.\n\n    .. versionchanged:: 2.0\n        Added the ``context_settings`` parameter.\n    \"\"\"\n\n    #: The context class to create with :meth:`make_context`.\n    #:\n    #: .. versionadded:: 8.0\n    context_class: type[Context] = Context\n\n    #: the default for the :attr:`Context.allow_extra_args` flag.\n    allow_extra_args = False\n\n    #: the default for the :attr:`Context.allow_interspersed_args` flag.\n    allow_interspersed_args = True\n\n    #: the default for the :attr:`Context.ignore_unknown_options` flag.\n    ignore_unknown_options = False\n\n    name: str | None\n    context_settings: cabc.MutableMapping[str, t.Any]\n    callback: t.Callable[..., t.Any] | None\n    params: list[Parameter]\n    help: str | None\n    epilog: str | None\n    options_metavar: str | None\n    short_help: str | None\n    add_help_option: bool\n    _help_option: Option | None\n    no_args_is_help: bool\n    hidden: bool\n    deprecated: bool | str\n\n    def __init__(\n        self,\n        name: str | None,\n        context_settings: cabc.MutableMapping[str, t.Any] | None = None,\n        callback: t.Callable[..., t.Any] | None = None,\n        params: list[Parameter] | None = None,\n        help: str | None = None,\n        epilog: str | None = None,\n        short_help: str | None = None,\n        options_metavar: str | None = \"[OPTIONS]\",\n        add_help_option: bool = True,\n        no_args_is_help: bool = False,\n        hidden: bool = False,\n        deprecated: bool | str = False,\n    ) -> None:\n        #: the name the command thinks it has.  Upon registering a command\n        #: on a :class:`Group` the group will default the command name\n        #: with this information.  You should instead use the\n        #: :class:`Context`\\'s :attr:`~Context.info_name` attribute.\n        self.name = name\n\n        if context_settings is None:\n            context_settings = {}\n\n        #: an optional dictionary with defaults passed to the context.\n        self.context_settings = context_settings\n\n        #: the callback to execute when the command fires.  This might be\n        #: `None` in which case nothing happens.\n        self.callback = callback\n        #: the list of parameters for this command in the order they\n        #: should show up in the help page and execute.  Eager parameters\n        #: will automatically be handled before non eager ones.\n        self.params = params or []\n        self.help = help\n        self.epilog = epilog\n        self.options_metavar = options_metavar\n        self.short_help = short_help\n        self.add_help_option = add_help_option\n        self._help_option = None\n        self.no_args_is_help = no_args_is_help\n        self.hidden = hidden\n        self.deprecated = deprecated\n\n    def to_info_dict(self, ctx: Context) -> dict[str, t.Any]:\n        return {\n            \"name\": self.name,\n            \"params\": [param.to_info_dict() for param in self.get_params(ctx)],\n            \"help\": self.help,\n            \"epilog\": self.epilog,\n            \"short_help\": self.short_help,\n            \"hidden\": self.hidden,\n            \"deprecated\": self.deprecated,\n        }\n\n    def __repr__(self) -> str:\n        return f\"<{self.__class__.__name__} {self.name}>\"\n\n    def get_usage(self, ctx: Context) -> str:\n        \"\"\"Formats the usage line into a string and returns it.\n\n        Calls :meth:`format_usage` internally.\n        \"\"\"\n        formatter = ctx.make_formatter()\n        self.format_usage(ctx, formatter)\n        return formatter.getvalue().rstrip(\"\\n\")\n\n    def get_params(self, ctx: Context) -> list[Parameter]:\n        params = self.params\n        help_option = self.get_help_option(ctx)\n\n        if help_option is not None:\n            params = [*params, help_option]\n\n        if __debug__:\n            import warnings\n\n            opts = [opt for param in params for opt in param.opts]\n            opts_counter = Counter(opts)\n            duplicate_opts = (opt for opt, count in opts_counter.items() if count > 1)\n\n            for duplicate_opt in duplicate_opts:\n                warnings.warn(\n                    (\n                        f\"The parameter {duplicate_opt} is used more than once. \"\n                        \"Remove its duplicate as parameters should be unique.\"\n                    ),\n                    stacklevel=3,\n                )\n\n            # Options may deliberately share a storage name to compete for\n            # the same value (feature switches), but an argument sharing a\n            # name silently overwrites the other parameter's value.\n            names_counter = Counter(param.name for param in params)\n            duplicate_names = (\n                name for name, count in names_counter.items() if count > 1\n            )\n\n            for duplicate_name in duplicate_names:\n                sharers = [param for param in params if param.name == duplicate_name]\n\n                if help_option in sharers:\n                    warnings.warn(\n                        (\n                            f\"The name {duplicate_name!r} is reserved for the \"\n                            \"automatic help option. Give the parameter a \"\n                            \"different name.\"\n                        ),\n                        stacklevel=3,\n                    )\n                elif any(isinstance(param, Argument) for param in sharers):\n                    warnings.warn(\n                        (\n                            f\"The name {duplicate_name!r} is used by an argument \"\n                            \"and another parameter. They will overwrite each \"\n                            \"other's value during parsing. Give each parameter \"\n                            \"a unique name.\"\n                        ),\n                        stacklevel=3,\n                    )\n\n        return params\n\n    def format_usage(self, ctx: Context, formatter: HelpFormatter) -> None:\n        \"\"\"Writes the usage line into the formatter.\n\n        This is a low-level method called by :meth:`get_usage`.\n        \"\"\"\n        pieces = self.collect_usage_pieces(ctx)\n        formatter.write_usage(ctx.command_path, \" \".join(pieces))\n\n    def collect_usage_pieces(self, ctx: Context) -> list[str]:\n        \"\"\"Returns all the pieces that go into the usage line and returns\n        it as a list of strings.\n        \"\"\"\n        rv = [self.options_metavar] if self.options_metavar else []\n\n        for param in self.get_params(ctx):\n            rv.extend(param.get_usage_pieces(ctx))\n\n        return rv\n\n    def get_help_option_names(self, ctx: Context) -> list[str]:\n        \"\"\"Returns the names for the help option.\n\n        Drops duplicates and names already reserved by another parameter. Order of\n        :attr:`Context.help_option_names` is preserved, so the result is stable.\n\n        .. versionchanged:: 8.5.0\n            Names keep their declaration order.\n        \"\"\"\n        all_names = dict.fromkeys(ctx.help_option_names)\n        for param in self.params:\n            for name in (*param.opts, *param.secondary_opts):\n                all_names.pop(name, None)\n        return list(all_names)\n\n    def get_help_option(self, ctx: Context) -> Option | None:\n        \"\"\"Returns the help option object.\n\n        Skipped if :attr:`add_help_option` is ``False``.\n\n        .. versionchanged:: 8.5.0\n            The help option stores its value under the reserved name\n            ``_click_default_help``, so a parameter named ``help`` no\n            longer breaks parsing.\n\n        .. versionchanged:: 8.1.8\n            The help option is now cached to avoid creating it multiple times.\n        \"\"\"\n        help_option_names = self.get_help_option_names(ctx)\n\n        if not help_option_names or not self.add_help_option:\n            return None\n\n        # Cache the help option object in private _help_option attribute to\n        # avoid creating it multiple times. Not doing this will break the\n        # callback ordering by iter_params_for_processing(), which relies on\n        # object comparison.\n        if self._help_option is None:\n            # Avoid circular import.\n            from .decorators import help_option\n\n            # The help option never exposes its value, so it uses a reserved\n            # storage name, keeping it clear of user parameters (like an\n            # argument named \"help\") that would otherwise clobber its value.\n            help_option(*help_option_names, _HELP_OPTION_STORAGE_NAME)(self)\n            self._help_option = self.params.pop()  # type: ignore[assignment]\n\n        return self._help_option\n\n    def make_parser(self, ctx: Context) -> _OptionParser:\n        \"\"\"Creates the underlying option parser for this command.\"\"\"\n        parser = _OptionParser(ctx)\n        for param in self.get_params(ctx):\n            param.add_to_parser(parser, ctx)\n        return parser\n\n    def get_help(self, ctx: Context) -> str:\n        \"\"\"Formats the help into a string and returns it.\n\n        Calls :meth:`format_help` internally.\n        \"\"\"\n        formatter = ctx.make_formatter()\n        self.format_help(ctx, formatter)\n        return formatter.getvalue().rstrip(\"\\n\")\n\n    def get_short_help_str(self, limit: int = 45) -> str:\n        \"\"\"Gets short help for the command or makes it by shortening the\n        long help string.\n        \"\"\"\n        if self.short_help:\n            text = inspect.cleandoc(self.short_help)\n        elif self.help:\n            text = _make_default_short_help(self.help, limit)\n        else:\n            text = \"\"\n\n        if self.deprecated:\n            text = f\"{_(text)} {_format_deprecated_label(self.deprecated)}\"\n\n        return text.strip()\n\n    def format_help(self, ctx: Context, formatter: HelpFormatter) -> None:\n        \"\"\"Writes the help into the formatter if it exists.\n\n        This is a low-level method called by :meth:`get_help`.\n\n        This calls the following methods:\n\n        -   :meth:`format_usage`\n        -   :meth:`format_help_text`\n        -   :meth:`format_arguments`\n        -   :meth:`format_options`\n        -   :meth:`format_epilog`\n        \"\"\"\n        self.format_usage(ctx, formatter)\n        self.format_help_text(ctx, formatter)\n        self.format_arguments(ctx, formatter)\n        self.format_options(ctx, formatter)\n        self.format_epilog(ctx, formatter)\n\n    def format_help_text(self, ctx: Context, formatter: HelpFormatter) -> None:\n        \"\"\"Writes the help text to the formatter if it exists.\"\"\"\n        if self.help is not None:\n            # truncate the help text to the first form feed\n            text = inspect.cleandoc(self.help).partition(\"\\f\")[0]\n        else:\n            text = \"\"\n\n        if self.deprecated:\n            label = _format_deprecated_label(self.deprecated)\n            text = f\"{_(text)} {label}\" if text else label\n\n        if text:\n            formatter.write_paragraph()\n\n            with formatter.indentation():\n                formatter.write_text(text)\n\n    def format_options(self, ctx: Context, formatter: HelpFormatter) -> None:\n        \"\"\"Writes all the options into the formatter if they exist.\"\"\"\n        opts = []\n        for param in self.get_params(ctx):\n            rv = param.get_help_record(ctx)\n            if rv is not None and not isinstance(param, Argument):\n                opts.append(rv)\n\n        if opts:\n            with formatter.section(_(\"Options\")):\n                formatter.write_dl(opts)\n\n    def format_arguments(self, ctx: Context, formatter: HelpFormatter) -> None:\n        \"\"\"Writes all arguments into the formatter, if at least one is documented.\n\n        An argument with no help gets an empty description, the same way an option\n        with no help does. That keeps the section an exhaustive list of the\n        positional arguments, matching the usage line.\n        \"\"\"\n        args = [param for param in self.get_params(ctx) if isinstance(param, Argument)]\n\n        if any(arg.help is not None for arg in args):\n            with formatter.section(_(\"Positional arguments\")):\n                formatter.write_dl([arg.get_help_record(ctx) for arg in args])\n\n    def format_epilog(self, ctx: Context, formatter: HelpFormatter) -> None:\n        \"\"\"Writes the epilog into the formatter if it exists.\"\"\"\n        if self.epilog:\n            epilog = inspect.cleandoc(self.epilog)\n            formatter.write_paragraph()\n\n            with formatter.indentation():\n                formatter.write_text(epilog)\n\n    def make_context(\n        self,\n        info_name: str | None,\n        args: list[str],\n        parent: Context | None = None,\n        **extra: t.Any,\n    ) -> Context:\n        \"\"\"This function when given an info name and arguments will kick\n        off the parsing and create a new :class:`Context`.  It does not\n        invoke the actual command callback though.\n\n        To quickly customize the context class used without overriding\n        this method, set the :attr:`context_class` attribute.\n\n        :param info_name: the info name for this invocation.  Generally this\n                          is the most descriptive name for the script or\n                          command.  For the toplevel script it's usually\n                          the name of the script, for commands below it's\n                          the name of the command.\n        :param args: the arguments to parse as list of strings.\n        :param parent: the parent context if available.\n        :param extra: extra keyword arguments forwarded to the context\n                      constructor.\n\n        .. versionchanged:: 8.0\n            Added the :attr:`context_class` attribute.\n        \"\"\"\n        for key, value in self.context_settings.items():\n            if key not in extra:\n                extra[key] = value\n\n        ctx = self.context_class(self, info_name=info_name, parent=parent, **extra)\n\n        with ctx.scope(cleanup=False):\n            self.parse_args(ctx, args)\n        return ctx\n\n    def parse_args(self, ctx: Context, args: list[str]) -> list[str]:\n        if not args and self.no_args_is_help and not ctx.resilient_parsing:\n            raise NoArgsIsHelpError(ctx)\n\n        parser = self.make_parser(ctx)\n        opts, args, param_order = parser.parse_args(args=args)\n\n        for param in iter_params_for_processing(param_order, self.get_params(ctx)):\n            _, args = param.handle_parse_result(ctx, opts, args)\n\n        # We now have all parameters' values into `ctx.params`, but the data may contain\n        # the `UNSET` sentinel.\n        # Convert `UNSET` to `None` to ensure that the user doesn't see `UNSET`.\n        #\n        # Waiting until after the initial parse to convert allows us to treat `UNSET`\n        # more like a missing value when multiple params use the same name.\n        # Refs:\n        # https://github.com/pallets/click/issues/3071\n        # https://github.com/pallets/click/pull/3079\n        for name, value in ctx.params.items():\n            if value is UNSET:\n                ctx.params[name] = None\n\n        if args and not ctx.allow_extra_args and not ctx.resilient_parsing:\n            ctx.fail(\n                ngettext(\n                    \"Got unexpected extra argument ({args})\",\n                    \"Got unexpected extra arguments ({args})\",\n                    len(args),\n                ).format(args=\" \".join(map(str, args)))\n            )\n\n        ctx.args = args\n        ctx._opt_prefixes.update(parser._opt_prefixes)\n        return args\n\n    def invoke(self, ctx: Context) -> t.Any:\n        \"\"\"Given a context, this invokes the attached callback (if it exists)\n        in the right way.\n        \"\"\"\n        if self.deprecated:\n            message = _(\n                \"DeprecationWarning: The command {name!r} is deprecated.{extra_message}\"\n            ).format(\n                name=self.name,\n                extra_message=_format_deprecated_suffix(self.deprecated),\n            )\n            echo(style(message, fg=\"red\"), err=True)\n\n        if self.callback is not None:\n            return ctx.invoke(self.callback, **ctx.params)\n\n    def shell_complete(self, ctx: Context, incomplete: str) -> list[CompletionItem]:\n        \"\"\"Return a list of completions for the incomplete value. Looks\n        at the names of options and chained multi-commands.\n\n        Any command could be part of a chained multi-command, so sibling\n        commands are valid at any point during command completion.\n\n        :param ctx: Invocation context for this command.\n        :param incomplete: Value being completed. May be empty.\n\n        .. versionadded:: 8.0\n        \"\"\"\n        from click.shell_completion import CompletionItem\n\n        results: list[CompletionItem] = []\n\n        if incomplete and not incomplete[0].isalnum():\n            for param in self.get_params(ctx):\n                if (\n                    not isinstance(param, Option)\n                    or param.hidden\n                    or (\n                        not param.multiple\n                        and ctx.get_parameter_source(param.name)\n                        is ParameterSource.COMMANDLINE\n                    )\n                ):\n                    continue\n\n                results.extend(\n                    CompletionItem(name, help=param.help)\n                    for name in [*param.opts, *param.secondary_opts]\n                    if name.startswith(incomplete)\n                )\n\n        while ctx.parent is not None:\n            ctx = ctx.parent\n\n            if isinstance(ctx.command, Group) and ctx.command.chain:\n                results.extend(\n                    CompletionItem(name, help=command.get_short_help_str())\n                    for name, command in _complete_visible_commands(ctx, incomplete)\n                    if name not in ctx._protected_args\n                )\n\n        return results\n\n    @t.overload\n    def main(\n        self,\n        args: cabc.Sequence[str] | None = None,\n        prog_name: str | None = None,\n        complete_var: str | None = None,\n        standalone_mode: t.Literal[True] = True,\n        **extra: t.Any,\n    ) -> t.NoReturn: ...\n\n    @t.overload\n    def main(\n        self,\n        args: cabc.Sequence[str] | None = None,\n        prog_name: str | None = None,\n        complete_var: str | None = None,\n        standalone_mode: bool = ...,\n        **extra: t.Any,\n    ) -> t.Any: ...\n\n    def main(\n        self,\n        args: cabc.Sequence[str] | None = None,\n        prog_name: str | None = None,\n        complete_var: str | None = None,\n        standalone_mode: bool = True,\n        windows_expand_args: bool = True,\n        **extra: t.Any,\n    ) -> t.Any:\n        \"\"\"This is the way to invoke a script with all the bells and\n        whistles as a command line application.  This will always terminate\n        the application after a call.  If this is not wanted, ``SystemExit``\n        needs to be caught.\n\n        This method is also available by directly calling the instance of\n        a :class:`Command`.\n\n        :param args: the arguments that should be used for parsing.  If not\n                     provided, ``sys.argv[1:]`` is used.\n        :param prog_name: the program name that should be used.  By default\n                          the program name is constructed by taking the file\n                          name from ``sys.argv[0]``.\n        :param complete_var: the environment variable that controls the\n                             bash completion support.  The default is\n                             ``\"_<prog_name>_COMPLETE\"`` with prog_name in\n                             uppercase.\n        :param standalone_mode: the default behavior is to invoke the script\n                                in standalone mode.  Click will then\n                                handle exceptions and convert them into\n                                error messages and the function will never\n                                return but shut down the interpreter.  If\n                                this is set to `False` they will be\n                                propagated to the caller and the return\n                                value of this function is the return value\n                                of :meth:`invoke`.\n        :param windows_expand_args: Expand glob patterns, user dir, and\n            env vars in command line args on Windows.\n        :param extra: extra keyword arguments are forwarded to the context\n                      constructor.  See :class:`Context` for more information.\n\n        .. versionchanged:: 8.0.1\n            Added the ``windows_expand_args`` parameter to allow\n            disabling command line arg expansion on Windows.\n\n        .. versionchanged:: 8.0\n            When taking arguments from ``sys.argv`` on Windows, glob\n            patterns, user dir, and env vars are expanded.\n\n        .. versionchanged:: 3.0\n           Added the ``standalone_mode`` parameter.\n        \"\"\"\n        if args is None:\n            args = sys.argv[1:]\n\n            if os.name == \"nt\" and windows_expand_args:\n                args = _expand_args(args)\n        else:\n            args = list(args)\n\n        if prog_name is None:\n            prog_name = _detect_program_name()\n\n        # Process shell completion requests and exit early.\n        self._main_shell_completion(extra, prog_name, complete_var)\n\n        # Every handler below takes the same two steps: propagate when\n        # standalone mode is disabled, otherwise collect the message and the\n        # exit code, and leave both to the teardown after the ``try``. The\n        # teardown writes the message and exits, and the outermost handler\n        # holds one policy for every interrupt arriving that late: the\n        # message may be lost, the intended exit code still wins.\n        report: cabc.Callable[[], None] | None = None\n        exit_code = 1\n\n        try:\n            try:\n                with self.make_context(prog_name, args, **extra) as ctx:\n                    rv = self.invoke(ctx)\n                    if not standalone_mode:\n                        return rv\n                    # it's not safe to `ctx.exit(rv)` here!\n                    # note that `rv` may actually contain data like \"1\" which\n                    # has obvious effects\n                    # more subtle case: `rv=[None, None]` can come out of\n                    # chained commands which all returned `None` -- so it's not\n                    # even always obvious that `rv` indicates success/failure\n                    # by its truthiness/falsiness\n                    ctx.exit()\n            except Exit as e:\n                if not standalone_mode:\n                    # in non-standalone mode, return the exit code\n                    # note that this is only reached if `self.invoke` above raises\n                    # an Exit explicitly -- thus bypassing the check there which\n                    # would return its result\n                    # the results of non-standalone execution may therefore be\n                    # somewhat ambiguous: if there are codepaths which lead to\n                    # `ctx.exit(1)` and to `return 1`, the caller won't be able to\n                    # tell the difference between the two\n                    return e.exit_code\n\n                exit_code = e.exit_code\n            except Abort:\n                if not standalone_mode:\n                    raise\n\n                report = _echo_aborted\n            except (EOFError, KeyboardInterrupt) as e:\n                # The blank line closes the terminal's ``^C`` echo.\n                echo(file=sys.stderr)\n\n                if not standalone_mode:\n                    raise Abort() from e\n\n                report = _echo_aborted\n            except ClickException as e:\n                if not standalone_mode:\n                    raise\n\n                report, exit_code = e.show, e.exit_code\n            except OSError as e:\n                if e.errno != errno.EPIPE:\n                    raise\n\n                sys.stdout = t.cast(t.TextIO, _PacifyFlushWrapper(sys.stdout))\n                sys.stderr = t.cast(t.TextIO, _PacifyFlushWrapper(sys.stderr))\n\n            if report is not None:\n                report()\n\n            sys.exit(exit_code)\n        except (EOFError, KeyboardInterrupt):\n            if not standalone_mode:\n                raise\n\n            sys.exit(exit_code)\n\n    def _main_shell_completion(\n        self,\n        ctx_args: cabc.MutableMapping[str, t.Any],\n        prog_name: str,\n        complete_var: str | None = None,\n    ) -> None:\n        \"\"\"Check if the shell is asking for tab completion, process\n        that, then exit early. Called from :meth:`main` before the\n        program is invoked.\n\n        :param prog_name: Name of the executable in the shell.\n        :param complete_var: Name of the environment variable that holds\n            the completion instruction. Defaults to\n            ``_{PROG_NAME}_COMPLETE``.\n\n        .. versionchanged:: 8.2.0\n            Dots (``.``) in ``prog_name`` are replaced with underscores (``_``).\n        \"\"\"\n        if complete_var is None:\n            complete_name = prog_name.replace(\"-\", \"_\").replace(\".\", \"_\")\n            complete_var = f\"_{complete_name}_COMPLETE\".upper()\n\n        instruction = os.environ.get(complete_var)\n\n        if not instruction:\n            return\n\n        from .shell_completion import shell_complete\n\n        rv = shell_complete(self, ctx_args, prog_name, complete_var, instruction)\n        sys.exit(rv)\n\n    def __call__(self, *args: t.Any, **kwargs: t.Any) -> t.Any:\n        \"\"\"Alias for :meth:`main`.\"\"\"\n        return self.main(*args, **kwargs)\n\n\nclass _FakeSubclassCheck(type):\n    def __subclasscheck__(cls, subclass: type) -> bool:\n        return issubclass(subclass, cls.__bases__[0])\n\n    def __instancecheck__(cls, instance: t.Any) -> bool:\n        return isinstance(instance, cls.__bases__[0])\n\n\nclass _BaseCommand(Command, metaclass=_FakeSubclassCheck):\n    \"\"\"\n    .. deprecated:: 8.2\n        Will be removed in Click 9.0. Use ``Command`` instead.\n    \"\"\"\n\n\nclass Group(Command):\n    \"\"\"A group is a command that nests other commands (or more groups).\n\n    :param name: The name of the group command.\n    :param commands: Map names to :class:`Command` objects. Can be a list, which\n        will use :attr:`Command.name` as the keys.\n    :param invoke_without_command: Invoke the group's callback even if a\n        subcommand is not given.\n    :param no_args_is_help: If no arguments are given, show the group's help and\n        exit. Defaults to the opposite of ``invoke_without_command``.\n    :param subcommand_metavar: How to represent the subcommand argument in help.\n        The default will represent whether ``chain`` is set or not.\n    :param chain: Allow passing more than one subcommand argument. After parsing\n        a command's arguments, if any arguments remain another command will be\n        matched, and so on.\n    :param result_callback: A function to call after the group's and\n        subcommand's callbacks. The value returned by the subcommand is passed.\n        If ``chain`` is enabled, the value will be a list of values returned by\n        all the commands. If ``invoke_without_command`` is enabled, the value\n        will be the value returned by the group's callback, or an empty list if\n        ``chain`` is enabled.\n    :param kwargs: Other arguments passed to :class:`Command`.\n\n    .. versionchanged:: 8.0\n        The ``commands`` argument can be a list of command objects.\n\n    .. versionchanged:: 8.2\n        Merged with and replaces the ``MultiCommand`` base class.\n    \"\"\"\n\n    allow_extra_args = True\n    allow_interspersed_args = False\n\n    #: If set, this is used by the group's :meth:`command` decorator\n    #: as the default :class:`Command` class. This is useful to make all\n    #: subcommands use a custom command class.\n    #:\n    #: .. versionadded:: 8.0\n    command_class: type[Command] | None = None\n\n    #: If set, this is used by the group's :meth:`group` decorator\n    #: as the default :class:`Group` class. This is useful to make all\n    #: subgroups use a custom group class.\n    #:\n    #: If set to the special value :class:`type` (literally\n    #: ``group_class = type``), this group's class will be used as the\n    #: default class. This makes a custom group class continue to make\n    #: custom groups.\n    #:\n    #: .. versionadded:: 8.0\n    group_class: type[Group | type] | None = None\n    # Literal[type] isn't valid, so use Type[type]\n\n    commands: cabc.MutableMapping[str, Command]\n    invoke_without_command: bool\n    subcommand_metavar: str\n    chain: bool\n    _result_callback: t.Callable[..., t.Any] | None\n\n    def __init__(\n        self,\n        name: str | None = None,\n        commands: cabc.MutableMapping[str, Command]\n        | cabc.Sequence[Command]\n        | None = None,\n        invoke_without_command: bool = False,\n        no_args_is_help: bool | None = None,\n        subcommand_metavar: str | None = None,\n        chain: bool = False,\n        result_callback: t.Callable[..., t.Any] | None = None,\n        **kwargs: t.Any,\n    ) -> None:\n        super().__init__(name, **kwargs)\n\n        if commands is None:\n            commands = {}\n        elif isinstance(commands, abc.Sequence):\n            commands = {c.name: c for c in commands if c.name is not None}\n\n        #: The registered subcommands by their exported names.\n        self.commands = commands\n\n        if no_args_is_help is None:\n            no_args_is_help = not invoke_without_command\n\n        self.no_args_is_help = no_args_is_help\n        self.invoke_without_command = invoke_without_command\n\n        if subcommand_metavar is None:\n            # When the group can run without a subcommand, the leading command\n            # token is optional, so wrap it in brackets to reflect that.\n            if chain:\n                if invoke_without_command:\n                    subcommand_metavar = \"[COMMAND1] [ARGS]... [COMMAND2 [ARGS]...]...\"\n                else:\n                    subcommand_metavar = \"COMMAND1 [ARGS]... [COMMAND2 [ARGS]...]...\"\n            elif invoke_without_command:\n                subcommand_metavar = \"[COMMAND] [ARGS]...\"\n            else:\n                subcommand_metavar = \"COMMAND [ARGS]...\"\n\n        self.subcommand_metavar = subcommand_metavar\n        self.chain = chain\n        # The result callback that is stored. This can be set or\n        # overridden with the :func:`result_callback` decorator.\n        self._result_callback = result_callback\n\n        if self.chain:\n            for param in self.params:\n                if isinstance(param, Argument) and not param.required:\n                    raise RuntimeError(\n                        \"A group in chain mode cannot have optional arguments.\"\n                    )\n\n    def to_info_dict(self, ctx: Context) -> dict[str, t.Any]:\n        info_dict = super().to_info_dict(ctx)\n        commands = {}\n\n        for name in self.list_commands(ctx):\n            command = self.get_command(ctx, name)\n\n            if command is None:\n                continue\n\n            sub_ctx = ctx._make_sub_context(command)\n\n            with sub_ctx.scope(cleanup=False):\n                commands[name] = command.to_info_dict(sub_ctx)\n\n        info_dict.update(commands=commands, chain=self.chain)\n        return info_dict\n\n    def add_command(self, cmd: Command, name: str | None = None) -> None:\n        \"\"\"Registers another :class:`Command` with this group.  If the name\n        is not provided, the name of the command is used.\n        \"\"\"\n        name = name or cmd.name\n        if name is None:\n            raise TypeError(\"Command has no name.\")\n        _check_nested_chain(self, name, cmd, register=True)\n        self.commands[name] = cmd\n\n    @t.overload\n    def command(self, __func: t.Callable[..., t.Any]) -> Command: ...\n\n    @t.overload\n    def command(\n        self, *args: t.Any, **kwargs: t.Any\n    ) -> t.Callable[[t.Callable[..., t.Any]], Command]: ...\n\n    def command(\n        self, *args: t.Any, **kwargs: t.Any\n    ) -> t.Callable[[t.Callable[..., t.Any]], Command] | Command:\n        \"\"\"A shortcut decorator for declaring and attaching a command to\n        the group. This takes the same arguments as :func:`command` and\n        immediately registers the created command with this group by\n        calling :meth:`add_command`.\n\n        To customize the command class used, set the\n        :attr:`command_class` attribute.\n\n        .. versionchanged:: 8.1\n            This decorator can be applied without parentheses.\n\n        .. versionchanged:: 8.0\n            Added the :attr:`command_class` attribute.\n        \"\"\"\n        from .decorators import command\n\n        func: t.Callable[..., t.Any] | None = None\n\n        if args and callable(args[0]):\n            assert len(args) == 1 and not kwargs, (\n                \"Use 'command(**kwargs)(callable)' to provide arguments.\"\n            )\n            (func,) = args\n            args = ()\n\n        if self.command_class and kwargs.get(\"cls\") is None:\n            kwargs[\"cls\"] = self.command_class\n\n        def decorator(f: t.Callable[..., t.Any]) -> Command:\n            cmd: Command = command(*args, **kwargs)(f)\n            self.add_command(cmd)\n            return cmd\n\n        if func is not None:\n            return decorator(func)\n\n        return decorator\n\n    @t.overload\n    def group(self, __func: t.Callable[..., t.Any]) -> Group: ...\n\n    @t.overload\n    def group(\n        self, *args: t.Any, **kwargs: t.Any\n    ) -> t.Callable[[t.Callable[..., t.Any]], Group]: ...\n\n    def group(\n        self, *args: t.Any, **kwargs: t.Any\n    ) -> t.Callable[[t.Callable[..., t.Any]], Group] | Group:\n        \"\"\"A shortcut decorator for declaring and attaching a group to\n        the group. This takes the same arguments as :func:`group` and\n        immediately
