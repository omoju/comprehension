<script type="application/json" id="data">{"title": "Nothing Gets Out Unescaped: A Run Through MarkupSafe", "premise": "A web page wants to show a comment somebody posted: `<script>alert(document.cookie);<\/script>`. Printed as-is into HTML, that string stops being text and starts being code \\u2014 it is a cross-site scripting payload. MarkupSafe exists to make the difference between \"text\" and \"markup\" a property of the value itself, carried in its type, so that a template can mix trusted and untrusted pieces and the untrusted ones can only ever arrive as inert characters. This story follows that one untrusted comment from the moment it is handed to `escape()` until it comes back out of a rendered fragment as plain text again, and notes at each step exactly what is guaranteed, what is merely trusted, and who is responsible for which.", "reader": "owner", "repo": {"name": "pallets/markupsafe", "url": "https://github.com/pallets/markupsafe", "commit": "b2e4d9c7687be25695fffbe93a37622302b24fb1"}, "chapters": [{"n": 1, "title": "The Trust Boundary, and the Unguarded Door Beside It", "data_in": "s = '<script>alert(document.cookie);<\/script>' \\u2014 a plain str of unknown provenance", "data_out": "Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;'), and the same value again after a second trip through escape()", "span": [2, 17], "md": "# Chapter 1 \u00b7 The Trust Boundary, and the Unguarded Door Beside It\n\n> **Enters as:** `s = '<script>alert(document.cookie);<\/script>'` \u2014 a plain `str` of unknown provenance\n\nThe world this string is about to enter is small and already assembled. At import time the package picked one of two engines for the actual character replacement: it tries the compiled `_speedups._escape_inner` and falls back to the pure-Python `_native._escape_inner` if the C extension was never built ([`__init__.py#L7-L10`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L7-L10)). Whichever one it got, the behaviour is the same; only the speed differs. Nothing else is configured. There is no policy object, no allowlist, no sanitizer. There is a function and a type.\n\nThe string itself is forty characters of someone else's intent: `<script>alert(document.cookie);<\/script>`. Dropped verbatim into a page, it stops being text and starts being code. It is handed to `escape`.\n\n## The first door: `type(s) is str`\n\n`escape` begins with a single identity check ([`__init__.py#L39-L40`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39-L40)). Not `isinstance` \u2014 `type(s) is str`, exactly. Our comment is exactly a `str`, so it takes this path immediately and never reaches the two branches below it.\n\nThe comment above that line explains the choice, and it is a security choice, not a micro-optimisation: a proxy object can report a borrowed `__class__`, so `isinstance(s, str)` can be made to return `True` for something that is not a string at all ([`__init__.py#L35-L38`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L35-L38)). `type()` cannot be lied to the same way, so a proxy falls through to the slower, more careful branches instead of being waved past. The repository pins this behaviour with a deliberately deceitful `Proxy` class ([`tests/test_escape.py#L50-L55`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_escape.py#L50-L55)).\n\n## The replacement itself: exactly five characters\n\nInside, `_escape_inner` does the only transformation this library performs. In the Python implementation it is five chained `str.replace` calls ([`_native.py#L1-L8`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_native.py#L1-L8)): `&` \u2192 `&amp;`, then `>`, `<`, `'`, `\"`. The order is load-bearing \u2014 `&` is replaced *first*, because the other four replacements all introduce new `&` characters; reverse the order and every entity would be escaped twice. The C version does the same five, in one pass, sized ahead of time, with a shortcut: if the scan finds nothing to escape it increments the refcount and hands back the *same* string object ([`_speedups.c#L84-L87`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_speedups.c#L84-L87), dispatched by width at [`#L151-L171`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_speedups.c#L151-L171)).\n\nOur comment has four angle brackets and nothing else of interest, so it comes back three characters longer per bracket: `'&lt;script&gt;alert(document.cookie);&lt;/script&gt;'`. The parentheses, the dot, the semicolons, the word `alert` \u2014 all untouched. They were never dangerous as *text*; what made the string dangerous was the brackets that let it leave text and become a tag.\n\n> **For the owner:** Five characters is the entire scope of the escaping: `& > < ' \"`. Backtick, `=`, and whitespace are not touched. That is sufficient for HTML text nodes and for *quoted* attribute values \u2014 the quote characters are escaped, so the value cannot break out. It is **not** sufficient for an unquoted attribute (`<a href=%s>`), for a URL scheme (`href=\"javascript:...\"` survives escaping untouched), or for anything inside `<script>` or `<style>`, where HTML entity rules do not apply. If your templates have any of those shapes, MarkupSafe is not what protects them.\n\n## The second door, which is not locked at all\n\nThe escaped text is handed to `Markup(...)` ([`__init__.py#L40`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39-L40)), and the trace records the constructor receiving `object='&lt;script&gt;alert(document.cookie);&lt;/script&gt;', encoding=None, errors='strict'`.\n\n`Markup.__new__` performs no escaping whatsoever ([`__init__.py#L122-L131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)). It checks whether the object has an `__html__` method and, if so, uses its return value; then \u2014 since `encoding` is `None` here \u2014 it calls `str.__new__` and returns. The bytes-decoding road, where `encoding` and `errors` are forwarded, is not taken on this run or on any other in this scenario.\n\nSo the value that leaves is the same characters, in a different type: `Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')`. The class carries `__slots__ = ()` ([`__init__.py#L120`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L120)) \u2014 there is no flag, no field, no provenance record. The type *is* the claim. When the scenario prints it, `__repr__` wraps `str.__repr__` in the class name ([`__init__.py#L167-L168`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L167-L168)) and yields `\"Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')\"`, so in a log or a REPL you can tell safe text from a bare string at a glance.\n\n> **For the owner:** This is the asymmetry to understand before signing off. `escape()` **produces** safety; `Markup()` merely **asserts** it, on any string at all, with no check. `Markup(request.args[\"q\"])` is a cross-site scripting hole, and the library will not notice. The same applies to a user-defined `__html__`, whose output `__new__` takes on faith at [L125-L126](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L125-L126). In review, every `Markup(` call site is a trust assertion by a human; grep for them, and expect the argument to be a literal.\n\n## The round trip: escaping what is already safe\n\nThe scenario immediately rebuilds the expected value with `Markup('&lt;script&gt;...')` for its assertion (the constructor call at trace line 8, which takes the same no-op path), and then does the thing a real template does constantly: it escapes something that has already been escaped.\n\nThis time `escape` takes a different road. `Markup` is a subclass of `str`, so `type(s) is str` is `False` and the fast path is refused \u2014 precisely the conservatism from the proxy decision, here paying off differently. The next check, `hasattr(s, \"__html__\")`, succeeds ([`__init__.py#L42-L43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L42-L43)), and `Markup.__html__` simply returns `self` ([`__init__.py#L133-L134`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L133-L134)). The five replacements never run. `&lt;` does not become `&amp;lt;`. Escaping is idempotent, which is the property that lets safe fragments nest inside safe fragments later in this story.\n\nThe trace shows `__html__` called twice on this one round trip \u2014 lines 11-12 from `escape`, then lines 14-15 from inside `Markup.__new__`, which re-checks for `__html__` on the value it was handed. For a `Markup` the returned value *is* `self`, so the same method runs again and returns the same object; it costs nothing. The thing to carry forward is the shape of it: the *result* of `__html__` is inspected for `__html__` again. An object's own `__html__` is called once by `escape`; if it returns a `Markup`, that `Markup`'s trivial `__html__` runs a second time.\n\nThe road not taken here, for completeness: a `str` *subclass* without `__html__` \u2014 the repository's `ReferenceStr` is the test case ([`tests/test_escape.py#L58-L68`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_escape.py#L58-L68)) \u2014 would fall to the third branch, `Markup(_escape_inner(str(s)))` ([`__init__.py#L45`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L45)). That same branch is why `escape(None)` is `Markup('None')` rather than empty, and why `escape_silent` exists as the opt-in for optional values ([`__init__.py#L48-L61`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L48-L61)).\n\nThe comment is now inert text wearing a type that says so. It is ready to be put into a page.\n\n> **Leaves as:** `Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')` \u2014 and the same value, unchanged and unescaped a second time, after a round trip back through `escape`\n"}, {"n": 2, "title": "An Object That Writes Its Own HTML, and a Template That Escapes Its Arguments", "data_in": "a User instance with id=3 and name='Alice \"The <b>Great<\/b>\"'; then '<p>User: {user:link} said: {comment}<\/p>' wrapped as Markup", "data_out": "repr 'Markup(\\'<span class=\"user\">Alice &#3...lt;b&gt;Great&lt;/b&gt;&#34;<\/span>\\')'; then control inside User.__html_format__, holding Markup('<a href=\"/user/{}\">{}<\/a>')", "span": [18, 29], "md": "# Chapter 2 \u00b7 An Object That Writes Its Own HTML, and a Template That Escapes Its Arguments\n\n> **Enters as:** `User(3, 'Alice \"The <b>Great<\/b>\"')` \u2014 an object with its own HTML; and the template text `'<p>User: {user:link} said: {comment}<\/p>'`\n\nThe escaped comment steps aside for a moment. It is about to be a field in somebody else's render, and before that can happen two other values have to be built: the user, and the template they will both be poured into.\n\n## The third door: an object that claims to know its own markup\n\n`escape(user)` enters the same three-branch hallway as before. The first door, `type(s) is str`, is shut \u2014 a `User` is not a `str`. The second opens: `hasattr(s, \"__html__\")` is true, so `escape` calls the method and wraps whatever comes back in `Markup`, with no escaping at all ([`__init__.py#L42-L43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L42-L43)).\n\nThat is the whole protocol. An object that defines `__html__` is believed. This particular `User` deserves it \u2014 its `__html__` builds the span by calling `.format()` on a `Markup` literal, so the name goes through the escaping machinery on the way in (that render is the next chapter's business). The result comes back as `Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>')`: the `<span>` tags intact and live, the double quotes and angle brackets *inside* the name turned into `&#34;` and `&lt;b&gt;`. The scenario prints it, and `__repr__` ([`__init__.py#L167-L168`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L167-L168)) shows the two kinds of bracket side by side in one value \u2014 that is the whole point of the library in a single line of output.\n\nHad `__html__` instead returned `f'<span>{self.name}<\/span>'` with no escaping, `escape` would have wrapped that too, just as cheerfully, and the `<b>` would have been live markup. The documentation states the division of responsibility outright ([`docs/html.rst#L31-L43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/docs/html.rst#L31-L43)): since `__html__` bypasses escaping, the author must escape user-provided data inside it.\n\n> **For the owner:** `__html__` is the second unguarded door, after `Markup()` itself. Any class in your codebase \u2014 or in a dependency \u2014 that defines `__html__` has opted its output out of escaping everywhere it is used. It is worth enumerating them; each one is a small sanitizer written by hand. One guarantee you do get: an exception raised inside `__html__` propagates out of `escape` rather than being swallowed or crashing the interpreter. That was a real segfault in the C path once, and it is pinned by a test today ([`tests/test_exception_custom_html.py#L13-L23`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_exception_custom_html.py#L13-L23)).\n\n## The template: trusted because a developer typed it\n\nNext, `Markup(\"<p>User: {user:link} said: {comment}<\/p>\")` \u2014 the same no-op constructor from chapter 1 ([`__init__.py#L122-L131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)), here used for exactly what it is for: text the author controls. The `<p>` tags need to stay live, so the template must not be escaped. Everything substituted *into* it will be.\n\n> **For the owner:** The asymmetry is worth naming before you sign off on a template layer. The literal text is trusted wholesale; only the field values are escaped. `Markup(some_template_from_the_database).format(...)` therefore protects the arguments and nothing else \u2014 the template itself can contain any markup it likes. If templates are ever user-supplied or user-editable in your system, MarkupSafe is not the control that makes that safe.\n\n## `Markup.format`: standard parsing, custom field rendering\n\n`template.format(user=user, comment=safe_comment)` does two things ([`__init__.py#L313-L315`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L313-L315)). It constructs a fresh `EscapeFormatter`, passing `self.escape` \u2014 the bound classmethod of the *actual* class, which is why a `Markup` subclass formats into its own type rather than decaying to `Markup`. The formatter stores that callable and chains to `string.Formatter.__init__` ([`__init__.py#L335-L337`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L335-L337)); the trace records it arriving as `escape=<bound method Markup.escape of <class 'markupsafe.Markup'>>`. Then it hands the whole job to `vformat`.\n\nEverything about *parsing* `{user:link}` \u2014 finding the field names, splitting off the spec, walking `{0[1][bar]}`-style lookups \u2014 is the standard library's, unmodified. MarkupSafe overrides exactly one hook: `format_field`. That is a deliberate narrow seam. The only thing it wants to change is what happens to each value once it has been located.\n\nA quick note on a road this run never takes: the `%` operator goes somewhere else entirely. `Markup.__mod__` wraps each argument in a `_MarkupEscapeHelper` ([`__init__.py#L154-L165`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L154-L165)), a tiny proxy that escapes lazily when `str()` or `repr()` is called on it but passes `__int__` and `__float__` straight through unescaped ([`__init__.py#L357-L379`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L357-L379)) \u2014 different mechanism, same guarantee, which is why `Markup(\"%i\") % 3.14` gives `\"3\"` and not an escaped-then-parsed mess ([`tests/test_markupsafe.py#L19-L33`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_markupsafe.py#L19-L33)).\n\n## `format_field`: three doors again, in a fixed order\n\n`vformat` finds the first field and calls `format_field(value=<User object>, format_spec='link')`. The dispatch is a familiar shape \u2014 three branches, tried in order ([`__init__.py#L339-L354`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L339-L354)):\n\n1. `__html_format__`, if present, is called with the spec and wins outright ([L340-L341](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L340-L341)).\n2. Otherwise `__html__`, if present \u2014 but only when there is no spec; a non-empty spec on an `__html__`-only object raises a `ValueError` that names the offending type ([L342-L349](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L342-L349)). Specs are never silently discarded.\n3. Otherwise Python's ordinary formatting, with the spec coerced by `str(format_spec)` first so that a `Markup` spec cannot route into the wrong `__format__` callbacks ([L350-L353](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L350-L353)).\n\nOur `User` defines `__html_format__`, so door one. The spec `'link'` is handed over as an opaque string; MarkupSafe imposes no grammar on it and makes no attempt to interpret it. `Markup` itself takes the strictest possible line on specs for its own values: `Markup.__html_format__` raises `ValueError(\"Unsupported format specification for Markup.\")` for anything non-empty ([`__init__.py#L325-L329`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L325-L329)) \u2014 `{x:>10}` on safe markup is an error, not padding, because padding escaped text would be measuring the wrong length.\n\nAll three doors are `hasattr` checks. Any object that merely *claims* these method names is believed, which is the same duck-typed trust as `__html__`, extended to formatting.\n\nInside `User.__html_format__`, the spec is `\"link\"`, so the first thing built is another trusted literal: `Markup('<a href=\"/user/{}\">{}<\/a>')` \u2014 the constructor again, again doing nothing but changing the type. Then the arguments are evaluated: the integer `3`, and `self.__html__()`, which constructs its own literal `Markup('<span class=\"user\">{0}<\/span>')` and is about to format the name into it.\n\nTwo template literals now exist, both trusted, both waiting on values. The escaped comment is still sitting in the keyword arguments, untouched, two fields away from its turn.\n\n> **Leaves as:** control inside `User.__html_format__`, holding `Markup('<a href=\"/user/{}\">{}<\/a>')` with `self.id = 3` and the span template `Markup('<span class=\"user\">{0}<\/span>')` built, about to render the name\n"}, {"n": 3, "title": "The Innermost Escape: the user's name", "data_in": "Markup('<span class=\"user\">{0}<\/span>').format('Alice \"The <b>Great<\/b>\"')", "data_out": "Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>'), then the completed Markup('<a href=\"/user/3\">\\u2026<\/a>')", "span": [30, 44], "md": "# Chapter 3 \u00b7 The Innermost Escape: the user's name\n\n> **Enters as:** `'Alice \"The <b>Great<\/b>\"'` \u2014 a plain `str`, handed as the sole argument to `Markup('<span class=\"user\">{0}<\/span>').format(...)`\n\nThe name is the deepest point of the run. Everything above it \u2014 two template literals, a format spec, a half-built anchor tag \u2014 is waiting on this one string to come back inert.\n\n`Markup.format` runs the same two lines it ran one level up ([`__init__.py#L313-L315`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L313-L315)): a fresh `EscapeFormatter` holding `Markup.escape` ([`__init__.py#L335-L337`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L335-L337)), then `vformat` to do the parsing. `vformat` locates the single field `{0}`, pulls the name out of the positional arguments, and calls `format_field(value='Alice \"The <b>Great<\/b>\"', format_spec='')`.\n\n## The third door, this time\n\nIn `format_field` the first two doors are shut. A plain `str` has no `__html_format__` and no `__html__`, so the dispatch falls through to Python's ordinary formatting ([`__init__.py#L350-L353`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L350-L353)): `super().format_field(value, str(''))`, which with an empty spec returns the string unchanged. Only then does the escaping happen, on the last line of the method ([`__init__.py#L354`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L354)).\n\nThe order matters more than it looks. Escaping is applied to the *rendered* field, not to the value that arrived. That is why a `float` formatted with `%`-free `{:.2f}`, a date, a custom `__format__` \u2014 anything Python's machinery can turn into text \u2014 gets escaped too, rather than only the values that happened to start life as strings ([`tests/test_markupsafe.py#L169-L174`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_markupsafe.py#L169-L174)).\n\n`self.escape` here is `Markup.escape`, the classmethod ([`__init__.py#L230-L240`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L230-L240)); it forwards to the module-level `escape`, which takes the exact-`str` fast path it took in chapter 1 ([`__init__.py#L39-L40`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39-L40)) and runs the five replacements ([`_native.py#L1-L8`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_native.py#L1-L8)). The name comes back as `Markup('Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;')`: the two double quotes became `&#34;`, the `<b>` and `<\/b>` became `&lt;b&gt;` and `&lt;/b&gt;`.\n\nThen `format_field` does something that looks like a step backwards: `str(...)` around the result. What it returns to `vformat`, as the trace records at this depth, is the bare `str` `'Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;'` \u2014 escaped text, but no longer carrying the safe type. That is deliberate. `string.Formatter.vformat` assembles its output with plain string concatenation; handing it `Markup` pieces would buy nothing, and the type is restored in one place at the end instead of being threaded through the standard library.\n\n> **For the owner:** The double quote is the character to notice. MarkupSafe escapes both `\"` and `'`, which is what makes an escaped value safe to drop inside a quoted HTML attribute \u2014 `title=\"{name}\"` cannot be broken out of. It does *not* escape backtick, `=`, or whitespace, so an **unquoted** attribute (`title={name}`) is not protected: a space ends the value and the attacker is writing new attributes. If you are reviewing templates, \"are all attribute values quoted?\" is the assumption this escape set is built on. Likewise, nothing here helps inside a `<script>` or `<style>` block, or in a JavaScript string literal \u2014 those are different grammars with different escapes, and are out of scope.\n\n## Back up one level, and then one more\n\n`vformat` joins the trusted literal pieces of `<span class=\"user\">{0}<\/span>` with that escaped field, and `Markup.format` wraps the joined string in `self.__class__(...)` \u2014 the no-op constructor ([`__init__.py#L122-L131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)) applied to text the library itself just assembled. `Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>')` leaves `User.__html__`. That final wrap is where the safe type is reinstated; it is the same line that will reinstate it for the outer page later.\n\nWith both arguments now in hand \u2014 the integer `3` and that span \u2014 the anchor render runs: `Markup('<a href=\"/user/{}\">{}<\/a>').format(3, span)`. The trace elides it as one more `Markup.format` at the same depth, because it is the path just told, twice over. The `3` has neither HTML method, so it goes the way the name went: `format(3, '')` gives `'3'`, and escaping `'3'` leaves `'3'`. The span goes a different way \u2014 `Markup` defines `__html_format__`, so it takes the *first* door, and `Markup.__html_format__('')` returns `self` unchanged because the spec is empty ([`__init__.py#L325-L329`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L325-L329)). Its tags survive verbatim; the escaped name inside them is not escaped again.\n\n> **For the owner:** `3` is a database id here, and it lands in `href=\"/user/3\"`. Escaping made it safe as *text inside a quoted attribute* and nothing more \u2014 it is not URL validation. If a value interpolated into an `href` or `src` can ever be attacker-influenced in full (a stored profile URL, a redirect target), `javascript:alert(1)` contains none of the five escaped characters and would pass through untouched. URL-scheme allow-listing is a separate control that this library does not claim to provide.\n\nThe anchor closes: `Markup('<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>')`. It is a `Markup`, it is already escaped exactly where it needs to be, and it is about to be handed back to `format_field` one level up \u2014 which will route it straight into `Markup.escape` again. Whether that second trip leaves the anchor tags alive or turns them into visible text is the next chapter's question.\n\n> **Leaves as:** `Markup('<span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span>')`, and then the completed `Markup('<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>')` returning from `User.__html_format__`\n"}, {"n": 4, "title": "Markup.escape and the Reassembled Page", "data_in": "s = Markup('<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>'), plus the remaining {comment} field", "data_out": "Markup('<p>User: <a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a> said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;<\/p>')", "span": [45, 61], "md": "# Chapter 4 \u00b7 Markup.escape and the Reassembled Page\n\n> **Enters as:** `s = Markup('<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>')`, arriving at `Markup.escape` from the last line of `format_field`\n\nThe anchor has come back out of `User.__html_format__` and is now the local `rv` inside `EscapeFormatter.format_field`. The method has one line left: `return str(self.escape(rv))` ([`__init__.py#L354`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L354)). Every branch of the dispatch \u2014 the `__html_format__` door, the `__html__` door, the default door \u2014 funnels through this same escape call. That is the point of the design: there is one exit, and nothing leaves a format field without passing it.\n\nSo the anchor, tags and all, is handed to the escaper.\n\n## A second trip that changes nothing\n\n`self.escape` is `Markup.escape`, the classmethod ([`__init__.py#L230-L240`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L230-L240)). It calls the module-level `escape` and inspects what comes back.\n\nInside `escape`, the anchor fails the exact-type test \u2014 `type(s) is str` is false for a `Markup`, which is a *subclass* of `str` ([`__init__.py#L39`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39)) \u2014 and falls to the `__html__` branch ([`__init__.py#L42-L43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L42-L43)). `Markup.__html__` returns `self` ([`__init__.py#L133-L134`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L133-L134)), and the result is passed to `Markup(...)`, whose constructor checks for `__html__` once more and calls it a second time ([`__init__.py#L125-L126`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L125-L126)) \u2014 the trace shows both calls, at depth and again one level in. For a `Markup` that is cheap. For a user-written `__html__` that queries a database or builds a fragment, it is two invocations per `escape` call; worth knowing if yours has a cost or a side effect.\n\nWhat `Markup(...)` produces here is a *fresh* `Markup` carrying the same characters: no replacement ran, but `str.__new__` on a subclass still allocates ([`__init__.py#L128-L129`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L128-L129)). Back in `Markup.escape`, that value's class is compared with `cls`: `rv.__class__ is not cls` is false, so `escape`'s result is returned as-is instead of being pushed through `cls(...)` a second time ([`__init__.py#L237-L240`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L237-L240)) \u2014 one wrap saved on a path that runs once per format field. That comparison is also what makes `Markup` subclassable: because the module-level `escape` always builds a plain `Markup` ([`__init__.py#L43`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L43)), an application's `class MyMarkup(Markup)` would otherwise be quietly downgraded on every escape; the re-wrap puts the subclass back, so escaping, formatting, joining and concatenation all return the application's own type.\n\nThe anchor therefore reaches `str(...)` with its text unchanged, and `format_field` returns the bare string `'<a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a>'`. The tags are alive. The name inside them is still escaped, exactly once.\n\n> **For the owner:** This is the trust boundary in its most concrete form. The anchor was built by MarkupSafe's own formatter, so its tags are there by construction \u2014 but `escape` cannot tell that apart from an `__html__` that pasted raw request data between two angle brackets. Whatever an `__html__`/`__html_format__` returns as `Markup` is inserted verbatim, here and anywhere else. When reviewing, the question is not \"does the template escape?\" (it does) but \"does every `__html__` in our codebase build its output through `Markup(...).format` or `escape`, rather than f-strings over user data?\" One careless `__html__` defeats everything downstream of it. The mirror image is a quieter surprise in your favour: if `__html_format__` returns a *plain* `str` containing tags, this line escapes it and the tags show up as visible text rather than markup ([`docs/formatting.rst#L17-L19`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/docs/formatting.rst#L17-L19)).\n\n## The second field, and the join\n\n`vformat` moves on to `{comment}`. The trace elides it \u2014 `EscapeFormatter.format_field \u00d71 more` \u2014 because it is the path just walked. The value is `Markup('&lt;script&gt;alert(document.cookie);&lt;/script&gt;')`, the escaped comment from chapter 1. Being a `Markup`, it takes the first door, `__html_format__`, which returns `self` for an empty spec ([`__init__.py#L325-L329`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L325-L329)), and then the same `escape` round trip leaves its text untouched. Its `&lt;script&gt;` is not escaped into `&amp;lt;script&amp;gt;`; the comment is rendered once and only once, no matter how many `Markup` layers it passes through.\n\n`string.Formatter.vformat` now concatenates the trusted literal pieces of the template \u2014 `'<p>User: '`, `' said: '`, `'<\/p>'` \u2014 with those two plain strings, and `Markup.format` wraps the whole joined result in `self.__class__(...)` ([`__init__.py#L313-L315`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L313-L315)). The trace records that final constructor call with the complete page text. This single wrap is where the safe type is restored, after the standard library has done its plain-string work; the bare `str`s in between were never visible outside the formatter.\n\nThe page leaves as `Markup('<p>User: <a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a> said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;<\/p>')`, and `print(repr(page))` sends it through `Markup.__repr__` ([`__init__.py#L167-L168`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L167-L168)), which prefixes the class name so a safe value is distinguishable from a plain string in a log or a REPL. The scenario's `assert \"<script>\" not in page` holds \u2014 not because anything inspected the output, but because the only route the comment could take escaped it before it ever reached the join.\n\n> **For the owner:** Formatting fails loudly, which is the behaviour you want at a boundary. A misspelled field name raises `KeyError` out of `string.Formatter`; a format spec on an object that defines `__html__` but not `__html_format__` raises `ValueError` naming the type ([`__init__.py#L343-L348`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L343-L348)); the `%` path raises `TypeError` on a missing argument ([`tests/test_markupsafe.py#L55-L58`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_markupsafe.py#L55-L58)). There is no \"render what we can and drop the rest\" mode, so a template bug surfaces as a 500, not as a half-escaped page. The one thing this chapter does *not* protect is the template itself: `Markup(\"<p>\u2026{x}\u2026\")` trusts its literal text completely. If a template string is ever assembled from user input before `.format()` is called, nothing here will save you.\n\n> **Leaves as:** `Markup('<p>User: <a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a> said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;<\/p>')`\n"}, {"n": 5, "title": "Concatenation: the operand gets escaped, both ways", "data_in": "Markup('<footer>') + '<\/p> & <script>oops<\/script>', then + Markup('<\/footer>')", "data_out": "Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')", "span": [62, 91], "md": "# Chapter 5 \u00b7 Concatenation: the operand gets escaped, both ways\n\n> **Enters as:** `Markup('<footer>')`, with `'<\/p> & <script>oops<\/script>'` waiting on the right of a `+`\n\nThe page is finished. What follows in the scenario is a smaller, blunter exercise: building a footer by gluing three pieces together with `+`. It matters out of proportion to its size, because in real application code this is the shape most mixing takes \u2014 a safe fragment, a plain string, another safe fragment \u2014 and it happens without anyone thinking about escaping at all.\n\nFirst the literal `'<footer>'` goes through the constructor the story met in chapter 1: `Markup.__new__` with `encoding=None`, which checks for `__html__` (a plain `str` has none), skips the decoding branch, and hands the text straight to `str.__new__` ([`__init__.py#L122-L131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)). No escaping. The developer wrote those angle brackets and means them; the trace returns `Markup('<footer>')`.\n\nPython then evaluates the two `+` operators left to right, so this `Markup` is the left operand of the first one.\n\n## The right operand is escaped, not trusted\n\n`Markup.__add__` is four lines ([`__init__.py#L136-L140`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L136-L140)). It first asks whether the operand is something that can become markup at all: `isinstance(value, str) or hasattr(value, \"__html__\")`. The payload `'<\/p> & <script>oops<\/script>'` is a `str`, so the guard passes. Had it been, say, an `int`, `__add__` would return `NotImplemented` and Python \u2014 finding no `int.__radd__` that accepts a `Markup` \u2014 would raise `TypeError`. That is deliberate: a `Markup` will not silently stringify arbitrary objects into your document.\n\nThe operand is then passed through `self.escape(value)`, the classmethod from the last chapter ([`__init__.py#L230-L240`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L230-L240)), which calls the module-level `escape`. This time the fast path applies \u2014 `type(s) is str` is exactly true ([`__init__.py#L39-L40`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L39-L40)) \u2014 so `_escape_inner` runs over the characters and the trace shows the constructor receiving `'&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;'`.\n\nLook at what happened to the bare ampersand in the middle. In the pure-Python implementation, `&` is replaced *first*, before the four replacements that themselves introduce `&` ([`_native.py#L1-L8`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_native.py#L1-L8)). Reverse that order and the `&` of every freshly-written `&lt;` would be escaped again into `&amp;lt;`; the whole string would come out double-escaped. The ordering is the entire correctness of that function, and the C version encodes the same thing differently, by writing each replacement directly to an output buffer in one pass ([`_speedups.c#L18-L72`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_speedups.c#L18-L72)).\n\nWith the operand now inert, `__add__` calls `super().__add__(...)` \u2014 ordinary string concatenation \u2014 and wraps the joined text in `self.__class__`, not in a hard-coded `Markup` ([`__init__.py#L138`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L138)). The trace records the constructor call with `'<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;'` and returns it as a `Markup`. The footer's own tag survived; the payload's did not.\n\n## Safe plus safe is not escaped twice\n\nThe second `+` has `Markup('<\/footer>')` on the right \u2014 built, like the first literal, by a plain constructor call at trace line 74. It goes through exactly the same door: the guard passes (a `Markup` is a `str`), and `Markup.escape` is called on it.\n\nInside, the familiar round trip: `type(s) is str` is false for the subclass, the `__html__` branch is taken, `Markup.__html__` returns `self` ([`__init__.py#L133-L134`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L133-L134)), the constructor calls `__html__` once more on the way in, and `'<\/footer>'` emerges with its tag intact. Concatenating safe to safe costs an allocation and changes nothing. That idempotence is what lets application code use `+` freely without tracking which side has already been escaped.\n\nThe final constructor call yields `Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')`, and `print(repr(...))` runs it through `Markup.__repr__`, which prefixes the class name so the value reads as markup rather than as a string in the output ([`__init__.py#L167-L168`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L167-L168)).\n\nOne road not taken here: had the plain string been on the *left* \u2014 `\"<\/p> & \u2026\" + Markup(\"<footer>\")` \u2014 Python would still reach MarkupSafe, because for a subclass operand it tries the reflected method first, and `Markup.__radd__` escapes the left operand before adding ([`__init__.py#L142-L146`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L142-L146)). Direction does not matter; the test for it is one line long ([`tests/test_markupsafe.py#L13-L16`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_markupsafe.py#L13-L16)).\n\n> **For the owner:** The `str` API on `Markup` is not uniformly escaping, and the split is worth knowing before you sign off. Methods that *insert* text escape their argument: `join` escapes every element ([`__init__.py#L170-L171`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L170-L171)), `replace` escapes its `new` argument but not `old` ([`__init__.py#L257-L258`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L257-L258)), and `ljust`, `rjust`, `center` escape the fill character ([`__init__.py#L260-L264`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L260-L264), [`#L272-L273`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L272-L273)). Methods that *search* deliberately do not: `strip`/`lstrip`/`rstrip` ([`__init__.py#L266-L276`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L266-L276)), `removeprefix`/`removesuffix` ([`#L297-L301`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L297-L301)) and `partition`/`rpartition` ([`#L303-L311`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L303-L311)) pass their argument through untouched. That was a breaking change in 3.0.0, made so these line up with `in`, `find` and `index`, which never escaped ([`CHANGES.rst#L55-L60`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/CHANGES.rst#L55-L60)). The rule is defensible \u2014 you are matching against existing escaped text, not adding to it \u2014 but it is a rule a reviewer has to carry in their head, and code written against 2.x may be relying on the old behaviour.\n\n> **For the owner:** The sharper edge is that slicing and splitting return `Markup` pieces without checking what they cut: `__getitem__` ([`__init__.py#L242-L243`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L242-L243)), `split`, `rsplit` and `splitlines` ([`#L173-L186`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L173-L186)) each wrap their results in `self.__class__`. In this footer, `&lt;script&gt;` is 12 characters standing for 8; truncating it for a preview can leave a dangling `&lt;scr`, which is well-typed `Markup` and malformed HTML. It is not an injection \u2014 the entity is still inert \u2014 but it is output you would not want shipped. If anywhere in the codebase truncates or slices rendered markup, flag it: truncate the plain text *before* escaping, not after.\n\nEverything in this chapter has only added safety: escaped operands, preserved tags, a type that says so. The next step in the scenario asks for the opposite \u2014 the plain-text view of the page \u2014 and that is the one operation here that gives the entities back.\n\n> **Leaves as:** `Markup('<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>')`\n"}, {"n": 6, "title": "striptags: the exit back to plain text, and what the fragment guarantees", "data_in": "the page Markup('<p>User: <a href=\"/user/3\">\\u2026&lt;/script&gt;<\/p>')", "data_out": "'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>' \\u2014 a plain str with live script text in it; and a final Markup rebuilt from a developer-written literal", "span": [92, 101], "md": "# Chapter 6 \u00b7 striptags: the exit back to plain text, and what the fragment guarantees\n\n> **Enters as:** `Markup('<p>User: <a href=\"/user/3\"><span class=\"user\">Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34;<\/span><\/a> said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;<\/p>')`\n\nBefore the page moves, one small thing happens beside it. The scenario's assertion about the footer builds its expected value with `Markup(\"<footer>&lt;/p&gt; &amp; &lt;script&gt;oops&lt;/script&gt;<\/footer>\")`, and the trace duly records another trip through the constructor at line 92 \u2014 no `__html__`, no `encoding`, straight to `str.__new__` ([`__init__.py#L122-L131`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L122-L131)). It is the same unguarded door from chapter 1, used the way it is meant to be used: on a literal the developer typed. The comparison succeeds.\n\nThen the page itself is asked for something it has not been asked for before. Every operation so far has preserved or added escaping. `page.striptags()` undoes it.\n\n## Two loops, in a deliberate order\n\n`striptags` starts by taking a plain copy of the text, `value = str(self)` ([`__init__.py#L206`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L206)), and then runs two passes: comments first, tags second.\n\nThe comment pass looks for `<!--`, and for each one it finds, looks for a matching `-->` beyond it and cuts out everything between ([`__init__.py#L211-L217`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L211-L217)). Our page has no comments, so `value.find(\"<!--\")` returns `-1` on the first test and the loop body never executes. The code comment just above explains why the pass exists at all and why it comes first ([`__init__.py#L208-L210`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L208-L210)): given `<!-- comment about <em> -->`, a tag-first pass would stop at the `>` of the inner `<em>` and leave ` -->` behind as visible text. Doing comments first means a comment is removed as a unit, whatever it contains. There is a test that pins exactly this, with a comment containing a tag, a comment containing newlines, and an attribute containing newlines ([`tests/test_markupsafe.py#L77-L89`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_markupsafe.py#L77-L89)).\n\nThe tag pass is the same shape: find `<`, find the next `>` after it, splice them out, repeat ([`__init__.py#L219-L224`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L219-L224)). On our page it fires six times \u2014 `<p>`, `<a href=\"/user/3\">`, `<span class=\"user\">`, `<\/span>`, `<\/a>`, `<\/p>` \u2014 and then stops, because nothing else in the text is a literal `<`. The `&lt;script&gt;` in the middle has no angle bracket in it; it is nine characters of entity, invisible to a loop looking for `<`. The escaped payload survives this pass as what it has been all along: text.\n\nWhat is left is\n\n```\nUser: Alice &#34;The &lt;b&gt;Great&lt;/b&gt;&#34; said: &lt;script&gt;alert(document.cookie);&lt;/script&gt;\n```\n\nand the last transformation before the handover is `\" \".join(value.split())` ([`__init__.py#L226-L227`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L226-L227)), which collapses every run of whitespace to a single space and trims the ends. Here there is nothing to collapse \u2014 removing `<\/span><\/a>` left exactly one space before `said:` \u2014 but the step matters when tags sat on their own lines; it was a bug fix in 2.1.5 ([`CHANGES.rst#L72`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/CHANGES.rst#L72)). The trace records that string arriving at `Markup.__new__` at line 95.\n\nBoth passes use `str.find` rather than a regular expression. That is not a style choice: the regex version had a pathological-backtracking problem, and it was removed in 2.1.4 ([`CHANGES.rst#L80-L81`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/CHANGES.rst#L80-L81)). With `find`, each pass is linear scans over a shrinking string, so no attacker-supplied input can make `striptags` hang. Correspondingly, when a marker is unterminated \u2014 a `<!--` with no `-->`, or a `<` with no `>` \u2014 the loop does not guess; it `break`s and leaves the rest of the string exactly as it is ([`__init__.py#L214-L215`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L214-L215), [`#L221-L222`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L221-L222)). Stripping is best effort.\n\n## The type is dropped on purpose\n\nThe last line is `return self.__class__(value).unescape()` ([`__init__.py#L228`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L228)) \u2014 hence the `Markup.__new__` at trace line 95 and the `Markup.unescape` at line 97. `unescape` imports Python's own `html.unescape` lazily and applies it to `str(self)` ([`__init__.py#L195-L197`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L195-L197)), which resolves HTML5 character references. `&#34;` becomes `\"`. `&lt;b&gt;` becomes `<b>`. `&lt;script&gt;alert(document.cookie);&lt;/script&gt;` becomes exactly the string the whole run began with.\n\nWhat comes back, at trace line 99, is\n\n```\nUser: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>\n```\n\nand its type is `str`. Not `Markup` \u2014 the brief `Markup` wrapper on the line before was only there so that a subclass gets its own `unescape`; the method itself is annotated `-> str` ([`__init__.py#L188`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L188)) and so is `striptags` ([`__init__.py#L199`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L199)). That is the whole warning, and it is an accurate one: the payload is live again, and if this value is printed into a page without being escaped first, the attack the library prevented in chapter 1 happens here instead.\n\n> **For the owner:** `striptags` and `unescape` are the documented exit from the safe world, and they are the two names to grep for in review. They are *not* sanitizers: they strip markers they recognise and give up on ones they don't, and `unescape` is not reversible in the obvious way either \u2014 `&amp;lt;` comes back as `&lt;`, and a second `unescape` of the same text keeps decoding ([`tests/test_markupsafe.py#L92-L104`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/test_markupsafe.py#L92-L104)). Their legitimate uses are plain-text summaries, search indexes, email bodies, `<title>` text that will be escaped again on the way out. Any path where their output flows back into HTML without a fresh `escape()` is a finding.\n\nThe scenario closes by building its `expected` value with `Markup(...)` over a multi-line literal \u2014 the constructor call at trace line 100 \u2014 and comparing. The page matches, it is still an instance of `Markup`, and `\"<script>\" not in page` holds. That last assertion is the point of the whole exercise, and it holds by construction rather than by inspection: no path the comment travelled had any way to put a bare `<` back into the fragment.\n\n## What the fragment actually guarantees\n\nStated plainly, from what this run showed: anything that passes through `escape` \u2014 directly, or via `Markup.format`, `%`, `+`, `join`, `replace`, `ljust`/`rjust`/`center` \u2014 has `&`, `>`, `<`, `'` and `\"` replaced with entities and comes back typed `Markup` ([`__init__.py#L24-L45`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L24-L45), [`_native.py#L1-L8`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/_native.py#L1-L8)). A value that is already `Markup` fed back through any of those paths is not escaped a second time, because `Markup.__html__` returns `self` ([`__init__.py#L133-L134`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L133-L134)). Whether the C extension or the Python fallback is loaded changes speed, not behaviour: the import prefers `_speedups` and falls back silently ([`__init__.py#L7-L10`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L7-L10)), and the suite is parametrised to run against both ([`tests/conftest.py#L26-L39`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/tests/conftest.py#L26-L39)).\n\n> **For the owner:** The non-guarantees are the half worth writing down. Five characters are escaped and no more \u2014 not backtick, not `=`, not whitespace \u2014 so safety in an attribute assumes the attribute is quoted; unquoted attributes, `javascript:` URLs, and text inserted inside `<script>` or `<style>` blocks or into JS/CSS string contexts are outside what this library claims. `Markup(text)` blesses anything, and a user-defined `__html__` or `__html_format__` is believed on sight ([`__init__.py#L125-L126`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L125-L126), [`#L340-L349`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L340-L349)), which is why `docs/html.rst` spends its second half on the author's responsibility ([`docs/html.rst#L31-L49`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/docs/html.rst#L31-L49)). Note also that `escape` on such an object calls `__html__` twice \u2014 once itself, once inside the constructor \u2014 so an implementation with side effects or real cost pays double.\n\n> **For the owner:** Two small things to keep on hand before you sign off. `escape(None)` is `Markup('None')`, a literal four letters in your page; `escape_silent(None)` is `Markup('')` ([`__init__.py#L48-L61`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L48-L61)) \u2014 for optional values, the second is nearly always what was meant. And when you need a string rather than markup, `soft_str` converts without flattening an existing `Markup` back to plain `str` ([`__init__.py#L64-L81`](https://github.com/pallets/markupsafe/blob/b2e4d9c7687be25695fffbe93a37622302b24fb1/src/markupsafe/__init__.py#L64-L81)); a bare `str(markup)` discards the type, and the next `escape` will escape it all over again. The three questions worth asking of the codebase that depends on this: where is `Markup()` called on something that is not a literal, what do our `__html__` implementations do with user data, and does anything feed `striptags`/`unescape` output back into a template.\n\n> **Leaves as:** `'User: Alice \"The <b>Great<\/b>\" said: <script>alert(document.cookie);<\/script>'` \u2014 a plain `str`, no longer safe and no longer claiming to be \u2014 alongside the page, still `Markup`, equal to the expected fragment.\n"}], "flow": [{"kind": "start", "label": "The caller runs the intended use", "chapter": null}, {"kind": "step", "fn
