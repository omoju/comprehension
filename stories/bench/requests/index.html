* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); padding-inline: 16px; padding-block: 0 }
a { color: var(--route) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--route); outline-offset: 2px }

header.top { max-width: 2000px; margin: 0 auto; padding-block: 28px 20px; display: grid; gap: 8px; border-bottom: 1px solid var(--rule) }

.evidence { display: grid; gap: 14px; max-width: 120ch; margin-top: 4px }
.verdict { font: 16.5px/1.55 var(--serif); background: var(--sheet); border: 1px solid var(--rule); border-left: 3px solid var(--route); border-radius: 6px; padding: 12px 16px; margin: 0 }
.evidence h2 { font: 600 12px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px }
.evidence table { border-collapse: collapse; font: 13.5px/1.4 var(--sans); display: block; overflow-x: auto }
.evidence td, .evidence th { border-bottom: 1px solid var(--rule); padding: 6px 14px 6px 0; text-align: left; vertical-align: top }
.evidence th { font: 600 11px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.pill { font: 500 11.5px/1 var(--mono); padding: 3px 6px; border-radius: 4px; white-space: nowrap; display: inline-block }
.pill.pass { background: var(--add-soft); color: var(--add) }

.pill.other { background: var(--chg-soft); color: var(--chg) }
.unexercised { margin: 0; padding-left: 18px; font: 14px/1.5 var(--sans) }

.desk { max-width: 2000px; margin: 0 auto; display: grid; grid-template-columns: 380px minmax(0, 1fr) clamp(440px, calc(100vw - 1140px), 880px); gap: 28px; align-items: start; padding-block: 20px 80px }

.legend { font: 11px/1.4 var(--sans); color: var(--muted); margin: 0 0 8px }

#chart .band rect { fill: transparent; stroke: none }
#chart .band.active rect { fill: var(--route-soft) }
#chart .band text { font: 600 11px var(--sans); fill: var(--muted) }
#chart .band.active text { fill: var(--route) }
#chart .band.unwritten text { fill: var(--faint) }
#chart .node { cursor: pointer }
#chart .node .shape { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.2 }
#chart .node:hover .shape, #chart .node:focus .shape { stroke: var(--route); stroke-width: 2 }

#chart .node.term .shape { fill: var(--ink); stroke: var(--ink) }

#chart .val { fill: var(--muted) }
#chart .wire { stroke: var(--ink); stroke-width: 1.2; fill: none }

#chart .ans { font-family: var(--sans); font-size: 10.5px; font-weight: 600 }
#chart .node.m-add .shape { stroke: var(--add); fill: var(--add-soft) }
#chart .node.m-del .shape { stroke: var(--del); stroke-dasharray: 4 3; fill: var(--del-soft) }
#chart .node.m-chg .shape { stroke: var(--chg); fill: var(--chg-soft) }

.story { min-width: 0 }
.chapter { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 26px clamp(18px, 4vw, 44px) 30px; margin-bottom: 22px; scroll-margin-top: 16px }

.chapter td, .chapter th { border-bottom: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top }
a.cite { text-decoration: none; border-bottom: 1.5px solid var(--mark-edge); color: inherit; cursor: pointer }

.code-head .flip { background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 2px 8px; cursor: pointer; font: 12px var(--sans) }
.code-head .close { display: none; background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 2px 8px; cursor: pointer }

.ln.hl { background: var(--mark) }
.ln.hl span:first-child { color: var(--ink) }
.code-empty { padding: 16px; color: var(--muted); font: 14px/1.5 var(--sans) }

<script type="application/json" id="data">{"mode": "repo", "title": "One GET, End to End: What Requests Promises and Where It Trusts You", "premise": "A caller has a URL and a pair of credentials: `requests.get('http://127.0.0.1:54897/basic-auth/user/pass', auth=('user','pass'))`. Between that line and a parsed JSON dict lies every decision Requests makes on your behalf \u2014 which headers it adds, whether it checks a certificate, how long it will wait, where it will send your password next, and what it does with a response body it has not yet read. This story follows that URL and that password through the library, stopping wherever a guarantee is made or a default quietly decides something for you.", "reader": "owner", "repo": {"name": "psf/requests", "url": "https://github.com/psf/requests", "commit": "611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60"}, "chapters": [{"n": 1, "title": "A URL and a Password Walk Into a Session", "data_in": "url='http://127.0.0.1:54897/basic-auth/user/pass', params=None, auth=('user','pass')", "data_out": "the same url/auth, now inside a live Session: headers {'User-Agent': 'python-requests/2.34.2', 'Accept-Encoding': 'gzip, deflate', 'Accept': '*/*', 'Connection': 'keep-alive'}, empty RequestsCookieJar, HTTPAdapters mounted at 'https://' and 'http://'", "span": [2, 38], "md": "# Chapter 1 \u00b7 A URL and a Password Walk Into a Session\n\n> **Enters as:** `url='http://127.0.0.1:54897/basic-auth/user/pass'`, `params=None`, `auth=('user', 'pass')`\n\nThe URL arrives as a plain string and the password as the second half of a two-element tuple. Neither has been examined yet. The first function to receive them is `requests.get`, which does almost nothing of its own: it forwards the URL, slots `params` into the keyword arguments, and hands everything to `requests.api.request` with the method spelled lowercase as `\"get\"` ([api.py#L74-L87](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/api.py#L74-L87)).\n\n`request` does one thing before it passes the data along, and it is the decision that frames the whole journey: it builds a brand-new `Session` inside a `with` block ([api.py#L67-L71](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/api.py#L67-L71)). The comment above it says why \u2014 closing the session avoids leaving sockets open, which can look like a `ResourceWarning` in some cases and a memory leak in others. The cost is on the other side of the ledger: this Session will live for exactly one request and then be torn down, so there is no connection to keep alive and no cookie jar that survives into the next call.\n\nSo before the URL goes anywhere, it waits while a world is built around it.\n\n`Session.__init__` assembles that world in one pass ([sessions.py#L442-L503](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L442-L503)). Its first act is `default_headers()`, which asks `default_user_agent()` for a string \u2014 in this run, `'python-requests/2.34.2'` \u2014 and packs four entries into a `CaseInsensitiveDict` ([utils.py#L942-L962](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L942-L962)):\n\n```\n{'User-Agent': 'python-requests/2.34.2',\n 'Accept-Encoding': 'gzip, deflate',\n 'Accept': '*/*',\n 'Connection': 'keep-alive'}\n```\n\nThese four go out on every request this library makes unless the caller overrides them. The `User-Agent` names the library and its exact version to whoever is listening; the `Accept-Encoding` value is computed once at import time from urllib3's `make_headers` ([utils.py#L91-L93](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L91-L93)), which is why it reads `gzip, deflate` here and might read differently on a machine with a Brotli library installed.\n\n> **For the owner:** Every outgoing request discloses the library name and exact version in `User-Agent` by default. Override `session.headers['User-Agent']` if your threat model treats that as fingerprinting.\n\nNext come the settings that will decide, several chapters from now, how much the code trusts the other end of the wire. The constructor sets them as plain attributes and the trace shows no branching: `self.auth = None`, `self.proxies = {}`, `self.stream = False`, `self.verify = True`, `self.cert = None`, `self.max_redirects = DEFAULT_REDIRECT_LIMIT` (30), and `self.trust_env = True` ([sessions.py#L450-L492](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L450-L492)). Two of these are worth marking now because they are invisible later. `verify = True` is the TLS promise: it will mean \"check the server's certificate against a CA bundle\" when, and only when, the URL turns out to be https. And `trust_env = True` means the surrounding process environment is allowed a vote \u2014 proxy variables, CA-bundle variables, and the user's `.netrc` file are all in scope by default.\n\nThe hooks dictionary comes from `default_hooks()`, which returns `{'response': []}` \u2014 one event, no handlers ([hooks.py#L22-L26](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/hooks.py#L22-L26)). Then `cookiejar_from_dict({})` builds an empty `RequestsCookieJar`; with an empty dict there is nothing to insert, so it iterates the (empty) jar once and returns it ([cookies.py#L579-L601](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L579-L601)).\n\nLast, the transports. The Session constructs two `HTTPAdapter` instances and mounts them under the prefixes `'https://'` and `'http://'` ([sessions.py#L500-L503](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L500-L503)). Each adapter is built with `pool_connections=10`, `pool_maxsize=10`, `max_retries=0`, `pool_block=False`, and in its constructor the retry default is turned into a concrete object: because `max_retries == DEFAULT_RETRIES`, it takes the first branch and stores `Retry(0, read=False)` ([adapters.py#L201-L221](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L201-L221)). Had the caller passed an integer, `Retry.from_int` would have built a retry policy instead. As configured, nothing is retried \u2014 not a refused connection, not a DNS failure, not a timeout. The class docstring states this as policy: by default, Requests does not retry failed connections, and callers who want granularity should construct urllib3's `Retry` themselves ([adapters.py#L168-L174](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L168-L174)).\n\nEach mount also calls `init_poolmanager`, which creates the urllib3 `PoolManager` that will eventually hold the socket ([adapters.py#L239-L267](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L239-L267)).\n\n> **For the owner:** Connection failures are never retried by default, and there is no automatic backoff anywhere in this path. If this code calls a flaky dependency, mount an adapter built with an explicit `urllib3.util.Retry` and decide the retry budget deliberately rather than inheriting zero.\n\nTwo prefixes are mounted and no others. A URL beginning with `mailto:` or `ftp://` has no transport at all here \u2014 a fact that will not surface until much later, when adapter lookup fails. Our URL begins with `http://`, so one of these two adapters is already waiting for it.\n\nWith the world built, `with` calls `Session.__enter__`, which simply returns the session itself ([sessions.py#L505-L506](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L505-L506)). The URL and the credential tuple are still exactly what the caller typed \u2014 unparsed, unencoded, untouched. But they are now inside a session that has already decided, on their behalf, what headers they will carry, how many redirects they may follow, whether a certificate will be checked, and how many times they may try again if the first attempt fails.\n\n> **Leaves as:** the same `url='http://127.0.0.1:54897/basic-auth/user/pass'` and `auth=('user', 'pass')`, now held by a live `Session` whose `headers` are `{'User-Agent': 'python-requests/2.34.2', 'Accept-Encoding': 'gzip, deflate', 'Accept': '*/*', 'Connection': 'keep-alive'}`, whose `cookies` is an empty `RequestsCookieJar`, whose defaults are `verify=True`, `stream=False`, `trust_env=True`, `max_redirects=30`, `auth=None`, `proxies={}`, and whose adapters are mounted at `'https://'` and `'http://'` with `Retry(0, read=False)`\n"}, {"n": 2, "title": "Merging What the Caller Said With What the Session Believes", "data_in": "Session.request(method='get', url=..., auth=('user','pass'), everything else None)", "data_out": "a Request [GET] plus merged settings: headers CaseInsensitiveDict with the four defaults, params OrderedDict(), auth ('user','pass'), cookies <RequestsCookieJar[]>, hooks {'response': []}", "span": [39, 85], "md": "# Chapter 2 \u00b7 Merging What the Caller Said With What the Session Believes\n\n> **Enters as:** `Session.request(method='get', url='http://127.0.0.1:54897/basic-auth/user/pass', auth=('user','pass'), params=None, data=None, headers=None, cookies=None, files=None, timeout=None, allow_redirects=True, proxies=None, hooks=None, stream=None, verify=None, cert=None, json=None)`\n\nFourteen of the sixteen arguments are `None`. The URL and the credential tuple are the only things the caller actually supplied, and `Session.request` now has to reconcile that near-emptiness with everything the Session already believes.\n\nIts first move is a type check it doesn't need here: if the URL were `bytes` it would be decoded as UTF-8 ([sessions.py#L619-L620](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L619-L620)). Ours is already `str`, so it passes through untouched.\n\nThen it builds a `Request` ([sessions.py#L622-L634](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L622-L634)). Two small coercions happen in the argument list: `data=data or {}` and `params=params or {}`. The trace shows the result \u2014 `Request.__init__(method='GET', url=..., headers=None, files=None, data={}, params={}, auth=('user', 'pass'), cookies=None, hooks=None, json=None)`. Note `or`, not `is None`: a falsy body such as `b''`, `0` or `[]` is replaced by an empty dict here, which is indistinguishable from \"no body at all\" by the time the body is prepared.\n\n`Request.__init__` fills the remaining holes with empty containers \u2014 `files=None` becomes `[]`, `headers=None` becomes `{}`, `hooks=None` becomes `{}` \u2014 then calls `default_hooks()` for a fresh `{'response': []}` and copies the rest onto itself ([models.py#L336-L355](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L336-L355)). The method string, already upper-cased by the caller's frame, is stored as `'GET'`. It will be upper-cased a second time in a moment ([sessions.py#L542](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L542)) \u2014 harmless, and it means `'get'` and `'GET'` are equivalent inputs at every entry point.\n\nNow the merge proper. `Session.prepare_request` is where request-level and session-level configuration meet ([sessions.py#L511-L555](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L511-L555)).\n\nCookies go first. `request.cookies or {}` gives `{}`, which is not a `CookieJar`, so `cookiejar_from_dict({})` builds an empty `RequestsCookieJar`. Then two nested `merge_cookies` calls pour the session's jar and then the request's jar into a **third, brand-new** `RequestsCookieJar` ([sessions.py#L524-L533](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L524-L533), [cookies.py#L604-L625](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L604-L625)). Both jars are empty, so the trace shows nothing but an iteration over nothing. The structure still matters: preparation never mutates `session.cookies`. Cookies only enter the session jar on the way back, after a response.\n\nNext, the branch our credentials cause the code to skip:\n\n```python\nauth = request.auth\nif self.trust_env and not auth and not self.auth:\n    auth = get_netrc_auth(url)\n```\n([sessions.py#L535-L538](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L535-L538))\n\n`auth` is `('user', 'pass')` and therefore truthy, so `get_netrc_auth` is never called \u2014 and indeed it does not appear in the trace. Had the caller omitted `auth`, this line would have read the user's `~/.netrc` (or `$NETRC`) and, if it found an entry for `127.0.0.1`, returned a `(login, password)` tuple that is treated exactly like one the caller passed ([utils.py#L231-L280](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L231-L280)). That path is silent: no warning, no log line. It is also higher-precedence than an `Authorization` header set via `headers=`, because auth is applied after headers during preparation.\n\n> **For the owner:** With the default `trust_env=True`, credentials from the user's `.netrc` are attached automatically whenever no `auth` argument is given, and they override an `Authorization` header the caller set by hand. Set `session.trust_env = False` for any request whose credentials must come only from your code.\n\nThen the four `merge_setting` calls that give the chapter its name ([sessions.py#L76-L105](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L76-L105)). The rules are short and worth knowing in order:\n\n- If the session value is `None`, the request value wins outright. This is how `auth` resolves: `merge_setting(('user','pass'), None)` returns the tuple unchanged ([sessions.py#L84-L85](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L84-L85)).\n- If the request value is `None`, the session value wins ([sessions.py#L87-L88](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L87-L88)).\n- If either side is not a `Mapping`, there is no merging at all \u2014 the request value is returned as-is ([sessions.py#L91-L94](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L91-L94)). That is why scalar settings like `verify` and `cert` can never be half-inherited.\n- Otherwise both sides are flattened with `to_key_val_list` and poured into `dict_class`, session first, request second \u2014 so request keys overwrite session keys ([sessions.py#L96-L97](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L96-L97)).\n- Finally, any key whose merged value is `None` is **deleted** ([sessions.py#L99-L103](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L99-L103)).\n\nFor headers, the trace shows this in full: `to_key_val_list` turns the session's `CaseInsensitiveDict` into `[('User-Agent', 'python-requests/2.34.2'), ('Accept-Encoding', 'gzip, deflate'), ('Accept', '*/*'), ('Connection', 'keep-alive')]`, a new `CaseInsensitiveDict` is built from it, the request's empty list adds nothing, and the four-key scan for `None` values finds none. The merged result is the four session defaults, now in a container that belongs to this request alone. `params` merges `{}` with `{}` into an empty `OrderedDict()` \u2014 the default `dict_class` when no case-insensitive container is asked for.\n\n> **For the owner:** Setting a header (or proxy, or param) to `None` on a single request is the supported way to suppress a session-level default for that request \u2014 it is removed from the merged mapping, not sent as the string \"None\". Reviewers should read a `None` in a per-request dict as a deletion, not an oversight.\n\nHooks take a separate path, because the naive merge would break them. `merge_hooks` sees `session_hooks.get(\"response\") == []` and returns the request's hooks immediately \u2014 `{'response': []}` ([sessions.py#L108-L124](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L108-L124)). The docstring explains the special case: an empty response list on either side must not be allowed to wipe out the other side's handlers.\n\nA fresh `PreparedRequest` is constructed ([models.py#L407-L422](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L407-L422)) and all of this is handed to its `prepare` method as keywords ([sessions.py#L540-L554](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L540-L554)). The URL is still the caller's raw string; the password is still a plain tuple element. Nothing has been encoded, validated or percent-quoted yet. That begins on the other side of the call.\n\n> **Leaves as:** the arguments to `PreparedRequest.prepare`: `method='GET'`, `url='http://127.0.0.1:54897/basic-auth/user/pass'`, `files=[]`, `data={}`, `json=None`, `headers=CaseInsensitiveDict({'User-Agent': 'python-requests/2.34.2', 'Accept-Encoding': 'gzip, deflate', 'Accept': '*/*', 'Connection': 'keep-alive'})`, `params=OrderedDict()`, `auth=('user', 'pass')`, `cookies=<RequestsCookieJar[]>`, `hooks={'response': []}`\n"}, {"n": 3, "title": "Turning a String Into a URL You Can Trust", "data_in": "method='GET', url='http://127.0.0.1:54897/basic-auth/user/pass', params=OrderedDict()", "data_out": "self.method='GET', self.url='http://127.0.0.1:54897/basic-auth/user/pass' (re-quoted, host validated)", "span": [86, 104], "md": "# Chapter 3 \u00b7 Turning a String Into a URL You Can Trust\n\n> **Enters as:** `PreparedRequest.prepare(method='GET', url='http://127.0.0.1:54897/basic-auth/user/pass', headers=CaseInsensitiveDict({'User-Agent': 'python-requests/2.34.2', 'Accept-Encoding': 'gzip, deflate', 'Accept': '*/*', 'Connection': 'keep-alive'}), files=[], data={}, params=OrderedDict(), auth=('user', 'pass'), cookies=<RequestsCookieJar[]>, hooks={'response': []}, json=None)`\n\nThe object receiving all this was built empty a few lines earlier: `method`, `url`, `headers`, `_cookies`, `body` and `_body_position` are all `None`, and `hooks` is a fresh `{'response': []}` ([models.py#L407-L422](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L407-L422)). `prepare` fills it in, and the order it does so is not incidental:\n\n```python\nself.prepare_method(method)\nself.prepare_url(url, params)\nself.prepare_headers(headers)\nself.prepare_cookies(cookies)\nself.prepare_body(data, files, json)\nself.prepare_auth(auth, url)\n```\n([models.py#L440-L451](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L440-L451))\n\nThe comments beneath that block spell out the contract: `prepare_auth` must be last so that authentication schemes such as OAuth see a fully assembled request to sign, and `prepare_hooks` must come after `prepare_auth` because an auth handler is allowed to register a hook. Anyone subclassing `PreparedRequest` or calling these methods by hand inherits that ordering requirement.\n\nThis chapter covers the first two steps. The credentials sit in the argument list untouched the whole time.\n\n## The method\n\n`prepare_method` assigns the string, then normalises it: `to_native_string(self.method.upper())` ([models.py#L467-L471](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L467-L471)). The trace records `to_native_string(string='GET', encoding='ascii') \u2192 'GET'` \u2014 the value was already a `str`, so the function returned it unchanged rather than decoding ([_internal_utils.py#L26-L36](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/_internal_utils.py#L26-L36)). `self.method` is now `'GET'`. This is the third place the verb has been upper-cased on the way down; a lowercase verb from the caller is equivalent everywhere.\n\n## The URL\n\n`prepare_url` is the longest single piece of work in preparation, and almost all of it is validation ([models.py#L483-L563](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L483-L563)).\n\nIt starts by coercing: `bytes` are decoded as UTF-8, anything else goes through `str()` \u2014 which is how objects with a string representation are accepted ([models.py#L494-L497](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L494-L497)). Then leading whitespace is stripped, silently ([models.py#L499-L500](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L499-L500)). `'  http://\u2026'` and `'http://\u2026'` are the same request.\n\nNext comes an escape hatch our URL walks straight past:\n\n```python\nif \":\" in url and not url.lower().startswith(\"http\"):\n    self.url = url\n    return\n```\n([models.py#L505-L507](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L505-L507))\n\nA `mailto:` or `data:` URL is stored verbatim and no further checks are performed \u2014 no scheme check, no host check, no re-quoting. The comment explains why: RFC 3986 parsing throws on these, and the project chose passthrough over failure. The request does not then succeed; it dies later, when `Session.get_adapter` finds no mounted prefix and raises `InvalidSchema` (Chapter 6).\n\n> **For the owner:** Any URL containing a colon that does not begin with `http` skips URL validation entirely and is stored as the caller gave it. Validate URLs that come from untrusted input before handing them to Requests, rather than relying on `prepare_url` to reject them.\n\nOur URL does begin with `http`, so it goes to urllib3's `parse_url`, which splits it into `scheme='http'`, `auth=None`, `host='127.0.0.1'`, `port=54897`, `path='/basic-auth/user/pass'`, `query=None`, `fragment=None`. Four roads branch off here, and each one raises a `requests.exceptions` type **before any socket is opened**:\n\n- a `LocationParseError` from `parse_url` becomes `InvalidURL` ([models.py#L510-L513](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L510-L513));\n- no scheme becomes `MissingSchema`, with a message suggesting the `https://` form ([models.py#L515-L519](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L515-L519));\n- no host becomes `InvalidURL` ([models.py#L521-L522](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L521-L522));\n- a host starting with `*` or `.` becomes `InvalidURL('URL has an invalid label.')` ([models.py#L533-L534](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L533-L534)).\n\nThe wildcard check is the `else` of an internationalisation branch. `unicode_is_ascii('127.0.0.1')` is called and returns `True` \u2014 it simply tries `u_string.encode(\"ascii\")` and reports whether that raised ([_internal_utils.py#L39-L51](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/_internal_utils.py#L39-L51)). A non-ASCII host would instead be run through `idna.encode(host, uts46=True)`, with an `idna.IDNAError` converted to `UnicodeError` and then to `InvalidURL` ([models.py#L473-L481](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L473-L481), [models.py#L528-L532](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L528-L532)). Our ASCII host takes the wildcard check instead, and passes.\n\n> **For the owner:** Every malformed-URL failure in this path is a subclass of `RequestException` raised during preparation, before a connection is attempted. Code that catches `requests.exceptions.RequestException` around a call therefore catches bad URLs too; code that only catches `ConnectionError` will not.\n\nThe netloc is then rebuilt by hand rather than reused from the parse: `auth` (absent) would be prefixed with `@`, the host appended, then `:54897` ([models.py#L536-L542](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L536-L542)). An empty path would become `/`, because bare domains are not valid URLs ([models.py#L544-L546](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L544-L546)); ours is already `/basic-auth/user/pass`.\n\nNow the query string. `params` is an `OrderedDict()` \u2014 not a `str` or `bytes`, so it isn't passed through `to_native_string`, and not `None`, so it is encoded ([models.py#L548-L554](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L548-L554)). `_encode_params` checks in order: is it a string (no), does it support `read` (the trace shows `has_read(obj=OrderedDict()) \u2192 False`), does it have `__iter__` (yes) ([models.py#L150-L180](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L150-L180), [_types.py#L32-L34](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/_types.py#L32-L34)). So it flattens the mapping with `to_key_val_list`, which returns `[]`, and `urlencode([], doseq=True)` gives `''`. Values of `None` would have been dropped at the same point ([models.py#L171-L177](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L171-L177)) \u2014 that is the mechanism behind \"a param set to `None` is not sent\".\n\nBecause `enc_params` is empty, the block that would append it is skipped. Had the caller passed params for a URL that already had a query string, the two would be joined with `&`, params last ([models.py#L556-L560](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L556-L560)).\n\nFinally the pieces are reassembled and re-quoted:\n\n```python\nurl = requote_uri(urlunparse((scheme, netloc, path, \"\", query, fragment)))\nself.url = url\n```\n([models.py#L562-L563](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L562-L563))\n\n`requote_uri` runs an unquote/quote cycle so that the result is consistently percent-encoded no matter how the caller wrote it: `unquote_unreserved` decodes only `%XX` sequences that map to unreserved characters, then `quote` escapes everything illegal while leaving reserved characters and `%` alone ([utils.py#L704-L723](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L704-L723), [utils.py#L680-L701](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L680-L701)). A broken escape sequence raises `InvalidURL` inside `unquote_unreserved`, and `requote_uri` catches it and quotes the whole URI instead \u2014 degrading rather than failing ([utils.py#L719-L723](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L719-L723)). Our URL contains nothing to escape, so the trace shows it come back identical: `'http://127.0.0.1:54897/basic-auth/user/pass'`.\n\nTwo fields are now set. `self.headers` is still `None`, `self._cookies` is still `None`, `self.body` is still `None`, and the credentials are still just a tuple in the caller's frame. The next step takes the merged header mapping and decides whether anything in it is allowed near a socket.\n\n> **Leaves as:** the same `PreparedRequest`, with `method='GET'` and `url='http://127.0.0.1:54897/basic-auth/user/pass'`; `headers`, `_cookies` and `body` still `None`\n"}, {"n": 4, "title": "Headers, Cookies, and the CRLF That Never Happens", "data_in": "headers={'User-Agent': 'python-requests/2.34.2', 'Accept-Encoding': 'gzip, deflate', 'Accept': '*/*', 'Connection': 'keep-alive'}, cookies=<RequestsCookieJar[]>", "data_out": "self.headers = CaseInsensitiveDict with those four validated entries; self._cookies set to the empty jar, no 'Cookie' header added (get_cookie_header returned None)", "span": [105, 168], "md": "# Chapter 4 \u00b7 Headers, Cookies, and the CRLF That Never Happens\n\n> **Enters as:** `prepare_headers(headers=CaseInsensitiveDict({'User-Agent': 'python-requests/2.34.2', 'Accept-Encoding': 'gzip, deflate', 'Accept': '*/*', 'Connection': 'keep-alive'}))`, then `prepare_cookies(cookies=<RequestsCookieJar[]>)`\n\nThe four headers arrive as the merged `CaseInsensitiveDict` built back in Chapter 2. They are about to become the only text in this request that a caller can put arbitrary bytes into, so this is where Requests checks them.\n\nThe first thing `prepare_headers` does is throw away whatever `self.headers` was and start clean:\n\n```python\nself.headers = CaseInsensitiveDict()\nif headers:\n    for header in headers.items():\n        # Raise exception on invalid header value.\n        check_header_validity(header)\n        name, value = header\n        self.headers[to_native_string(name)] = value\n```\n([models.py#L565-L574](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L565-L574))\n\nThe trace shows the empty construction \u2014 `CaseInsensitiveDict.__init__(data=None)` \u2014 and then the loop walking the source mapping: `__len__ \u2192 4`, an `__iter__` yielding the cased keys, and a `__getitem__` per key. `items()` on a `CaseInsensitiveDict` comes from `MutableMapping`, so it is driven by those two methods, which is why the trace shows them one pair at a time rather than a single bulk read ([structures.py#L64-L71](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/structures.py#L64-L71)).\n\n## The check that runs on every header, every time\n\nEach pair goes to `check_header_validity`, which is two calls to `_validate_header_part` \u2014 one for the name at validator index 0, one for the value at index 1. The trace shows exactly that shape four times over: `check_header_validity(header=('User-Agent', 'python-requests/2.34.2'))` containing `_validate_header_part(..., header_part='User-Agent', header_validator_index=0)` and one more ([utils.py#L1087-L1095](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L1087-L1095)).\n\n`_validate_header_part` picks a regex pair by the type of the part \u2014 `str` or `bytes` \u2014 and raises `InvalidHeader` outright for anything else, so stringifying an int or a `UUID` is the caller's job ([utils.py#L1098-L1112](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L1098-L1112)). The regexes themselves are the whole defence:\n\n```python\n_VALID_HEADER_NAME_RE_STR = re.compile(r\"^[^:\\s][^:\\r\\n]*\\Z\")\n_VALID_HEADER_VALUE_RE_STR = re.compile(r\"^\\S[^\\r\\n]*\\Z|^\\Z\")\n```\n([_internal_utils.py#L13-L23](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/_internal_utils.py#L13-L23))\n\nA name may not begin with a colon or whitespace and may contain no colon, carriage return or line feed. A value may not begin with whitespace and may contain no CR or LF; the empty string is explicitly allowed by the `|^\\Z` alternative. A mismatch raises `InvalidHeader` naming which part failed ([utils.py#L1114-L1119](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L1114-L1119)).\n\nThat is the answer to the question the last chapter left open. A header value like `\"1\\r\\nX-Injected: yes\"` cannot close the header block early and smuggle a second request past the server, because it never reaches the socket: preparation fails first, with a `RequestException` subclass, before a connection is attempted. Our four values are boring and all four pass.\n\n> **For the owner:** `prepare_headers` is the only place in the request path that validates header names and values. Assigning to `prepared.headers[...]` after preparation \u2014 the documented prepared-request recipe does exactly this \u2014 stores the value without any CRLF check, and nothing downstream re-validates it. Treat direct mutation of a prepared request's headers as a trust boundary you own.\n\n## Storing them\n\nThe surviving name is passed through `to_native_string`, which returns a `str` unchanged and decodes `bytes` as ASCII ([_internal_utils.py#L26-L36](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/_internal_utils.py#L26-L36)); the trace confirms `'User-Agent' \u2192 'User-Agent'` and so on for the other three. The *value* gets no such treatment \u2014 it is stored exactly as given, which is why `PreparedRequest.headers` is typed as holding `str | bytes` ([models.py#L401](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L401)).\n\nThen `__setitem__` files it under a lowercased key while remembering the casing you used:\n\n```python\nself._store[key.lower()] = (key, value)\n```\n([structures.py#L59-L62](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/structures.py#L59-L62))\n\nSo `headers['content-type']` will later find a header the server spelled `Content-Type`, and the wire format keeps the original casing. The cost is stated in the class's own docstring: if two keys differ only in case, \"the behavior is undefined\" ([structures.py#L41-L45](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/structures.py#L41-L45)) \u2014 in practice the second write silently wins and the first disappears. A caller who passes both `{'Accept': 'a'}` and `{'ACCEPT': 'b'}` sends one header, not two.\n\nFour `__setitem__` calls later, `self.headers` holds `User-Agent`, `Accept-Encoding`, `Accept`, `Connection`, in that order.\n\n## The cookie jar, and the header that wasn't\n\n`prepare_cookies` receives the merged `RequestsCookieJar[]` \u2014 empty. Because it is already a `cookielib.CookieJar`, it is adopted by reference rather than rebuilt; a plain dict would have gone through `cookiejar_from_dict` instead ([models.py#L712-L715](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L712-L715)).\n\nThen `get_cookie_header` does the actual work, and it is mostly an act of translation ([cookies.py#L153-L161](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L153-L161)). Requests does not implement cookie matching itself; it hands the job to the standard library's `http.cookiejar`, which expects a `urllib2.Request`. `MockRequest` is the adapter: it wraps the `PreparedRequest` and exposes `get_type()`, `get_host()`, `get_full_url()` and friends by re-parsing `self._r.url` ([cookies.py#L31-L112](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L45-L78)). The trace shows its construction, with `is_prepared(request=<PreparedRequest [GET]>) \u2192 True` asserting that `url` and `method` are populated \u2014 which is why `prepare_url` had to run first.\n\nTwo details of that adapter carry weight. `is_unverifiable()` returns `True` unconditionally ([cookies.py#L80-L81](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L80-L81)), which affects how the stdlib's third-party-cookie policy treats the request. And `get_full_url()` prefers a caller-set `Host` header over the real URL host when deciding which domain the request is for ([cookies.py#L60-L78](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/cookies.py#L60-L78)) \u2014 so overriding `Host` changes which of your cookies get sent, not just what the server sees.\n\n`jar.add_cookie_header(r)` then iterates the jar (the trace's `RequestsCookieJar.__iter__ \u2192 <generator object deepvalues>`), finds nothing, and writes nothing. `MockRequest.get_new_headers()` returns `{}`, `.get(\"Cookie\")` returns `None`, and back in `prepare_cookies` the `if cookie_header is not None` guard is not taken ([models.py#L717-L720](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L717-L720)). No `Cookie` header is added. `self.headers` still has exactly four entries.\n\n> **For the owner:** `prepare_cookies` is effectively single-use: cookielib will not regenerate a `Cookie` header that already exists, so a second call on the same object does nothing unless the header is deleted first \u2014 the method's docstring says so, and redirect handling depends on it by popping `Cookie` before re-preparing ([models.py#L699-L711](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L699-L711), [sessions.py#L260-L269](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L260-L269)). If you modify cookies on a prepared request by hand, delete `headers['Cookie']` before re-preparing.\n\nThe request now has a method, a URL, four validated headers and a jar. The password is still a tuple in `prepare`'s argument list. Next come the body \u2014 there isn't one \u2014 and the moment those credentials become a header.\n\n> **Leaves as:** the same `PreparedRequest`, with `headers = {'User-Agent': 'python-requests/2.34.2', 'Accept-Encoding': 'gzip, deflate', 'Accept': '*/*', 'Connection': 'keep-alive'}` (no `Cookie` key) and `_cookies` bound to the empty `RequestsCookieJar`; `body` still `None`\n"}, {"n": 5, "title": "No Body, and the Password Becomes a Header", "data_in": "data={}, files=[], json=None, auth=('user','pass'), url='http://127.0.0.1:54897/basic-auth/user/pass'", "data_out": "self.body = None (no Content-Length, no Content-Type); headers gain 'Authorization': 'Basic dXNlcjpwYXNz'; hooks {'response': []} registered; PreparedRequest [GET] complete", "span": [169, 192], "md": "# Chapter 5 \u00b7 No Body, and the Password Becomes a Header\n\n> **Enters as:** `prepare_body(data={}, files=[], json=None)` on a `PreparedRequest` whose `headers` hold four validated entries and whose `body` is `None`\n\nThe `data` is an empty dict, `files` an empty list, `json` is `None`. Those are not the caller's values \u2014 the caller passed nothing at all. `Session.request` turned `data=None` into `data or {}` and `params=None` into `params or {}` ([sessions.py#L623-L634](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L623-L634)), and `Request.__init__` turned `files=None` into `[]` ([models.py#L336-L341](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L336-L341)). Three empty containers arrive where a body might have been.\n\n## Three ways to have a body, and none of them apply\n\n`prepare_body` starts with `body = None` and `content_type = None` and then asks three questions in a fixed order ([models.py#L576-L652](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L576-L652)).\n\nFirst: `if not data and json is not None` ([models.py#L588-L599](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L588-L599)). `data` is falsy here, but `json` is `None`, so no. Worth naming the shape of that condition anyway, because it is a precedence rule with teeth: `json=` is only honoured when `data` is falsy. Pass both and the `json` is silently dropped \u2014 no warning, no error, just a form-encoded body where you expected JSON. If it had been taken, the serialisation runs with `allow_nan=False`, so a `float('nan')` anywhere in the payload becomes an `InvalidJSONError` rather than a body no server will parse.\n\nSecond: is this a stream? ([models.py#L602-L630](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L602-L630))\n\n```python\nis_iterable = isinstance(data, Iterable) or hasattr(data, \"__iter__\")\nif is_iterable and not isinstance(data, (str, bytes, list, tuple, Mapping)):\n```\n\nA `dict` *is* iterable, but it is also a `Mapping`, so the exclusion list catches it and the branch is skipped. This is the path a file object or a generator takes, and it is worth knowing what it does even though our data avoids it: `super_len(data)` tries to determine a length; if it finds one, `Content-Length` is set, and if it does not, `Transfer-Encoding: chunked` is set instead. It also records `self._body_position = body.tell()` so the body can be rewound if a redirect forces a resend \u2014 and if `tell()` raises `OSError`, it stores a bare `object()` sentinel instead of `None`, specifically so a later rewind attempt raises `UnrewindableBodyError` rather than silently hanging the connection ([models.py#L611-L620](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L611-L620)). Streamed bodies combined with `files` raise `NotImplementedError` outright ([models.py#L622-L625](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L622-L625)).\n\nSo control falls into the `else` ([models.py#L631-L650](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L631-L650)). Third question: `if files` \u2014 `[]` is falsy, so no multipart encoding. Then `if raw_data` \u2014 `{}` is falsy, so no form encoding either, and `_encode_params` is never called on it. `body` is still `None`, `content_type` is still `None`, and the `if content_type and (...)` guard at the end adds nothing to the headers.\n\n## The header that is deliberately absent\n\nWhat remains is one call, and the trace shows it: `prepare_content_length(body=None) \u2192 None`.\n\n```python\nif body is not None:\n    length = super_len(body)\n    ...\nelif (\n    self.method not in (\"GET\", \"HEAD\")\n    and self.headers.get(\"Content-Length\") is None\n):\n    self.headers[\"Content-Length\"] = \"0\"\n```\n([models.py#L654-L668](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L654-L668))\n\n`body` is `None`, so the first branch is out. The `elif` checks the method, and `self.method` is `'GET'` \u2014 set back in Chapter 3. So no `Content-Length` is written. Had this been a POST with no body, the same code would have written `Content-Length: 0`, because a method that *may* carry a body should say it is carrying zero bytes. A GET says nothing. Remember that absence; Chapter 7 will ask the transport what it makes of a request with neither `Content-Length` nor a body.\n\n`self.body = body` assigns `None` and `prepare_body` returns. The request still has exactly four headers.\n\n## The tuple becomes credentials\n\nNow `prepare_auth(auth=('user', 'pass'), url='http://127.0.0.1:54897/basic-auth/user/pass')` ([models.py#L670-L697](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L670-L697)). This is the step the previous chapters kept deferring to.\n\nThe first thing it does is a branch we skip, and it is worth a sentence because it is a trust decision: if `auth` were `None`, Requests would call `get_auth_from_url(self.url)` and use any `user:pass@` embedded in the URL as credentials ([models.py#L678-L680](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L678-L680), [utils.py#L1070-L1084](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L1070-L1084)). A URL from an untrusted source can therefore supply its own `Authorization` header. Here `auth` is truthy, so the URL is not consulted.\n\nThen the dispatch:\n\n```python\nif isinstance(auth, tuple) and len(auth) == 2:\n    # special-case basic HTTP auth\n    auth_handler = HTTPBasicAuth(*auth)\nelse:\n    auth_handler = cast(\"Callable[..., PreparedRequest]\", auth)\n```\n([models.py#L682-L688](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L682-L688))\n\nThe trace shows `HTTPBasicAuth.__init__(username='user', password='pass')`, which does nothing but store the two strings ([auth.py#L96-L98](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/auth.py#L96-L98)). Anything that is not a 2-tuple is simply assumed callable and invoked with the prepared request \u2014 that is the extension point every third-party auth scheme uses, and it means a bad `auth=` argument surfaces as a `TypeError` from a call, not as a validation error.\n\n`HTTPBasicAuth.__call__(r=<PreparedRequest [GET]>)` is a single line ([auth.py#L111-L113](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/auth.py#L111-L113)):\n\n```python\nr.headers[\"Authorization\"] = _basic_auth_str(self.username, self.password)\n```\n\nInside `_basic_auth_str`, the two strings are encoded \u2014 and the encoding matters:\n\n```python\nif isinstance(username, str):\n    username = username.encode(\"latin1\")\n\nif isinstance(password, str):\n    password = password.encode(\"latin1\")\n\nauthstr = \"Basic \" + to_native_string(\n    b64encode(b\":\".join((username, password))).strip()\n)\n```\n([auth.py#L65-L75](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/auth.py#L65-L75))\n\nLatin-1, not UTF-8. `b'user:pass'` base64-encodes to `b'dXNlcjpwYXNz'`, which the trace shows passing through `to_native_string(string=b'dXNlcjpwYXNz', encoding='ascii') \u2192 'dXNlcjpwYXNz'`, and the function returns `'Basic dXNlcjpwYXNz'`. A password containing a character outside latin-1 \u2014 any emoji, most non-Latin scripts \u2014 raises `UnicodeEncodeError` from inside preparation. Non-string credentials are coerced with a `DeprecationWarning` announcing removal in 3.0 ([auth.py#L44-L62](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/auth.py#L44-L62)).\n\nThe trace then shows `CaseInsensitiveDict.__setitem__(key='Authorization', value='Basic dXNlcjpwYXNz')`. Note what did *not* happen: this assignment goes straight into the dict, bypassing `check_header_validity` entirely \u2014 the validation from Chapter 4 only covers the `headers=` mapping. For a base64 string that is fine; for a custom auth handler writing a header from untrusted input, it is the caller's problem.\n\nNote also what the code did not check. There is no inspection of the scheme. This URL is `http://`, and `Basic dXNlcjpwYXNz` is a reversible encoding, not encryption \u2014 base64-decode it and you have `user:pass`. The credentials will cross the network in a form anyone on the path can read, and Requests says nothing about it.\n\n> **For the owner:** `prepare_auth` attaches Basic credentials to `http://` URLs with no warning and no scheme check. If your service accepts a configurable base URL, validate that it is `https://` before passing `auth=`, because the library will not. The same applies to `user:pass@host` credentials embedded in a URL, which are extracted automatically whenever `auth` is not supplied.\n\n> **For the owner:** HTTP Basic credentials are latin-1 encoded before base64. Passwords outside latin-1 raise `UnicodeEncodeError` during request preparation, not at the server. Confirm your credential source cannot produce such characters, or catch the error at your boundary.\n\n## The handler owns the request\n\nTwo lines follow the call, and both exist because an auth handler is allowed to do more than set one header:\n\n```python\n# Update self to reflect the auth changes.\nself.__dict__.update(r.__dict__)\n\n# Recompute Content-Length\nself.prepare_content_length(self.body)\n```\n([models.py#L691-L697](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L691-L697))\n\nThe `__dict__.update` means a handler may return a *different* `PreparedRequest` and have its entire state adopted. The recompute exists because a handler may have replaced the body. In our run neither happened \u2014 `HTTPBasicAuth` mutates in place and returns the same object \u2014 and the trace's second `prepare_content_length(body=None) \u2192 None` is a no-op for the same reason the first one was: `body` is `None` and the method is `GET`.\n\nThen `prepare_hooks(hooks={'response': []})` ([models.py#L722-L729](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L722-L729)) walks the one event and calls `register_hook('response', [])`, which extends the existing empty list with nothing ([models.py#L257-L270](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L257-L270)). The ordering is a contract spelled out in `prepare`'s own comments: hooks come *after* auth precisely so an auth handler can register one ([models.py#L440-L451](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L440-L451)). `HTTPDigestAuth` depends on it \u2014 its `__call__` registers `handle_401` as a response hook so it can retry a challenge ([auth.py#L339-L341](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/auth.py#L339-L341)).\n\n`prepare` returns. The request is complete: `GET`, a validated URL, five headers, no body, one empty hook list. The credentials are no longer a tuple in an argument list; they are a string on an object about to be handed to a transport.\n\n> **Leaves as:** a fully prepared `PreparedRequest [GET]` \u2014 `method='GET'`, `url='http://127.0.0.1:54897/basic-auth/user/pass'`, `body=None`, no `Content-Length`, `headers={'User-Agent': 'python-requests/2.34.2', 'Accept-Encoding': 'gzip, deflate', 'Accept': '*/*', 'Connection': 'keep-alive', 'Authorization': 'Basic dXNlcjpwYXNz'}`, `hooks={'response': []}`\n"}, {"n": 6, "title": "What the Environment Gets to Say, and Choosing a Transport", "data_in": "prep.url, proxies={}, stream=None, verify=None, cert=None", "data_out": "{'cert': None, 'proxies': OrderedDict(), 'stream': False, 'verify': True}; adapter = <HTTPAdapter object at 0x10da78190> (the one mounted at 'http://')", "span": [193, 216], "md": "# Chapter 6 \u00b7 What the Environment Gets to Say, and Choosing a Transport\n\n> **Enters as:** a complete `PreparedRequest [GET]` with `url='http://127.0.0.1:54897/basic-auth/user/pass'` and `Authorization: Basic dXNlcjpwYXNz`, back in `Session.request` alongside `proxies=None, stream=None, verify=None, cert=None`\n\n`Session.prepare_request` hands the finished object back and `Session.request` names it `prep`. The next line looks like a safety check and is not one:\n\n```python\nassert _is_prepared(prep)\n```\n([sessions.py#L635-L643](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L635-L643))\n\nThe trace shows `is_prepared(request=<PreparedRequest [GET]>) \u2192 True`, and it would have shown `True` for any argument at all: the function returns `True` unconditionally at runtime, with the real check living only inside a `TYPE_CHECKING` block, explicitly so it cannot raise an `AssertionError` in production ([_types.py#L47-L52](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/_types.py#L47-L52)). These asserts are type narrowing for pyright, not validation. An owner reading the source should not count them as a guarantee that `url` and `method` are set.\n\nThen `proxies = proxies or {}` turns the caller's `None` into an empty dict, and the request's four unset transport settings go off to be reconciled with the world.\n\n## The environment is a parameter\n\n`merge_environment_settings(url='http://127.0.0.1:54897/basic-auth/user/pass', proxies={}, stream=None, verify=None, cert=None)` ([sessions.py#L831-L868](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L831-L868)) begins with a gate:\n\n```python\nif self.trust_env:\n```\n\n`trust_env` is `True` by default, set in `Session.__init__` back in Chapter 1 ([sessions.py#L490-L492](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L490-L492)). Inside that gate, two things that the caller never mentioned get a vote on how this request is sent.\n\nThe first is proxying. `get_environ_proxies(url, no_proxy=None)` ([utils.py#L873-L882](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L873-L882)) first asks `should_bypass_proxies` whether this host is exempt. That function reads `no_proxy` from the environment via a helper that prefers the lowercase name over the uppercase one ([utils.py#L817-L826](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L817-L826)) \u2014 the trace shows `get_proxy(key='no_proxy') \u2192 None`, so there was no list to match against. It matches hostnames exactly, with a port, as a dotted suffix, and \u2014 for IPv4 literals like ours \u2014 against CIDR ranges ([utils.py#L834-L859](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L834-L859)).\n\nThen it does something worth flagging:\n\n```python\nwith set_environ(\"no_proxy\", no_proxy_arg):\n    try:\n        bypass = proxy_bypass(hostname)\n```\n([utils.py#L861-L865](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L861-L865))\n\nThe trace shows `set_environ(env_name='no_proxy', value=None)` entered and exited. `set_environ` writes to `os.environ` and restores the old value in a `finally` ([utils.py#L787-L807](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L787-L807)) \u2014 here `value is None` so it does nothing, but when a caller passes `no_proxy` in the `proxies` dict this is a process-global mutation performed so the platform's `proxy_bypass` can see it. In a threaded program, other threads see it too, briefly.\n\n`should_bypass_proxies` returned `False`, so `getproxies()` was consulted and returned `{}` \u2014 no proxy variables in this environment. Had there been any, they would have been folded in with `setdefault`, meaning an explicit `proxies` argument wins per key but any key the caller left out can still be filled from `http_proxy`, `https_proxy` or `all_proxy` ([sessions.py#L846-L851](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L846-L851)).\n\nThe second environment vote is the one that matters most:\n\n```python\nif verify is True or verify is None:\n    verify = (\n        os.environ.get(\"REQUESTS_CA_BUNDLE\")\n        or os.environ.get(\"CURL_CA_BUNDLE\")\n        or verify\n    )\n```\n([sessions.py#L853-L860](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L853-L860))\n\nAn environment variable can replace the default trust store with an arbitrary file path. Neither variable was set here, so `verify` stayed `None`.\n\n> **For the owner:** With the default `trust_env=True`, the process environment can redirect the request through a proxy (`http_proxy`, `https_proxy`, `all_proxy`) and replace the CA bundle (`REQUESTS_CA_BUNDLE`, `CURL_CA_BUNDLE`), and `.netrc` can supply credentials when `auth` is omitted. Set `session.trust_env = False` for any request whose transport and trust configuration must come only from your code.\n\n## Four merges, one settings dict\n\nThe remaining four lines each run the same `merge_setting` seen in Chapter 2 ([sessions.py#L862-L868](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L862-L868), [sessions.py#L76-L105](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L76-L105)), and the trace shows the first in full plus \"\u00d73 more\":\n\n- `proxies`: `{}` and `{}` are both Mappings, so they merge into `OrderedDict()`.\n- `stream`: request value `None`, so the session's `False` is returned.\n- `verify`: request value `None`, so the session's `True` is returned.\n- `cert`: session value `None`, so the request's `None` is returned.\n\nThe result is exactly what the trace records: `{'cert': None, 'proxies': OrderedDict(), 'stream': False, 'verify': True}`. Note that `verify` and `stream` are not dicts, so they take the short-circuit at [sessions.py#L91-L94](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L91-L94) \u2014 a per-request `verify=False` wins outright over a session's `verify=True`, with no merging and no complaint.\n\n`Session.request` stacks these on top of two more and calls send ([sessions.py#L645-L651](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L645-L651)):\n\n```python\nsend_kwargs = {\n    \"timeout\": timeout,\n    \"allow_redirects\": allow_redirects,\n}\nsend_kwargs.update(settings)\n```\n\n`timeout` is `None` \u2014 the caller never passed one, and nothing in this path supplies a default. `allow_redirects` is `True`.\n\n## Session.send: defaults, a guard, and an adapter\n\n`Session.send(request=<PreparedRequest [GET]>, **send_kwargs)` ([sessions.py#L752-L784](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L752-L784)) opens with three `setdefault` calls for `stream`, `verify` and `cert`, all no-ops because `merge_environment_settings` already filled them, and a fallback that is also skipped:\n\n```python\nif \"proxies\" not in kwargs:\n    kwargs[\"proxies\"] = resolve_proxies(request, self.proxies, self.trust_env)\n```\n\nThe trace confirms it: between `Session.send` and `is_prepared` there is no `resolve_proxies` call. That fallback exists because `send` is a public entry point \u2014 someone can call `session.send(prepped)` directly with no settings at all, as the \"prepared requests\" documentation shows \u2014 and the kwargs must be complete before they are handed to hooks and to redirect resolution, so a redirect hop reproduces the same transport configuration.\n\nThen the one real runtime guard in this span:\n\n```python\nif isinstance(request, Request):\n    raise ValueError(\"You can only send PreparedRequests.\")\n```\n([sessions.py#L765-L768](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L765-L768))\n\nA `Request` has a `url` and a `method` but no `headers` `CaseInsensitiveDict`, no body, no `Authorization` header \u2014 sending one would fail deep inside urllib3 with something unintelligible, so it is rejected here by name.\n\n`allow_redirects` is popped off into a local (`True`), `stream` is read (`False`), `hooks` is taken from the request itself, and then the question of which transport:\n\n```python\nadapter = self.get_adapter(url=request.url)\n```\n\n`get_adapter` is a linear scan over the mounted prefixes, lowercased, using `startswith` ([sessions.py#L870-L881](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L870-L881)). `Session.mount` keeps longer prefixes first by moving every shorter key to the end as each one is registered ([sessions.py#L888-L897](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L888-L897)), so a specific mount beats a general one. Our URL starts with `http://`, and the trace returns the adapter at `0x10da78190` \u2014 the second `HTTPAdapter` built in Chapter 1, the one mounted at `'http://'` on trace line 34.\n\nThe scan is a plain prefix test, not a URL-aware one. Mounting an adapter at `http://localhost` also matches `http://localhost.other.com` and `http://localhost@other.com`; the documentation says to terminate hostnames with a `/`. And when nothing matches, this is where the `mailto:` and `data:` URLs that `prepare_url` waved through in Chapter 3 finally stop: `InvalidSchema(f\"No connection adapters were found for {url!r}\")`.\n\n> **For the owner:** `get_adapter` matches by string prefix, so a custom adapter mounted at `http://internal-api` will also be used for `http://internal-api.attacker.example/`. Terminate every mount prefix with a `/` when the adapter carries different credentials, certificates or retry behaviour.\n\nOne line before the send itself, a clock starts:\n\n```python\nstart = preferred_clock()\n```\n([sessions.py#L780-L788](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/sessions.py#L780-L788))\n\nIt stops the moment `adapter.send` returns, which is when the response *headers* have been parsed \u2014 not when the body has been read. `Response.elapsed` therefore measures time-to-headers, and is unaffected by how long the content takes or whether `stream=True` defers it.\n\nThe request, the five headers, the base64 credentials and a settings dict containing `timeout=None` now cross into the adapter, where a socket will finally open.\n\n> **Leaves as:** `adapter = <HTTPAdapter at 0x10da78190>` (mounted at `'http://'`) about to receive `request=<PreparedRequest [GET]>, stream=False, timeout=None, verify=True, cert=None, proxies=OrderedDict()`\n"}, {"n": 7, "title": "The Adapter: Pools, Certificates, and Everything That Can Go Wrong", "data_in": "request=<PreparedRequest [GET]>, stream=False, timeout=None, verify=True, cert=None, proxies=OrderedDict()", "data_out": "a live urllib3 HTTPResponse at 0x10c23f910, headers sent as {'User-Agent': ..., 'Authorization': 'Basic dXNlcjpwYXNz'}, url '/basic-auth/user/pass'", "span": [217, 254], "md": "# Chapter 7 \u00b7 The Adapter: Pools, Certificates, and Everything That Can Go Wrong\n\n> **Enters as:** `HTTPAdapter.send(request=<PreparedRequest [GET]>, stream=False, timeout=None, verify=True, cert=None, proxies=OrderedDict())`\n\nThe request crosses out of `sessions.py` and into the one object that knows about sockets. `HTTPAdapter.send` is a long function, and almost all of its length is spent on things that did not happen here: proxies, TLS, timeouts, and a catalogue of failures ([adapters.py#L634-L748](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L634-L748)).\n\nIt opens with the same type-narrowing `assert _is_prepared(request)` the Session used \u2014 the trace shows `is_prepared \u2192 True`, as it does for every argument \u2014 and then asks for a connection ([adapters.py#L659-L666](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L659-L666)).\n\n## Finding a pool, and what the pool key remembers\n\n`get_connection_with_tls_context(request, verify=True, proxies=OrderedDict(), cert=None)` ([adapters.py#L455-L510](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L455-L510)) first repeats the proxy question the Session already answered: `select_proxy(request.url, proxies)` walks four candidate keys \u2014 `http://127.0.0.1`, `http`, `all://127.0.0.1`, `all` \u2014 against the empty dict ([utils.py#L885-L908](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L885-L908)). The trace records `\u2192 None`. Had it returned a proxy, the request would have been routed through `proxy_manager_for(proxy)` instead, and a malformed proxy URL with no host would have raised `InvalidProxyURL` ([adapters.py#L492-L503](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L492-L503)).\n\nThen it builds the key that decides *which* pooled connection this request may use. `build_connection_pool_key_attributes` is a thin public wrapper, documented as the subclassing hook for custom `SSLContext` work, over `_urllib3_request_context` ([adapters.py#L403-L453](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L403-L453)). That function parses the URL and assembles two dicts ([adapters.py#L85-L119](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L85-L119)):\n\n```\n({'host': '127.0.0.1', 'port': 54897, 'scheme': 'http'}, {'cert_reqs': 'CERT_REQUIRED'})\n```\n\nThe first is the host identity. The second is the TLS posture: `cert_reqs` starts at `\"CERT_REQUIRED\"` and is downgraded to `\"CERT_NONE\"` only when `verify is False`; a string `verify` becomes `ca_certs` or, if it names a directory, `ca_cert_dir`; a `cert` tuple becomes `cert_file` plus `key_file` ([adapters.py#L97-L113](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L97-L113)). Those second-dict entries are passed to urllib3 as `pool_kwargs`, which means they are part of the pool key \u2014 two requests to the same host with different `verify` or `cert` settings get *different* pools. A connection established under a relaxed setting cannot be silently handed to a request that asked for a strict one.\n\nNote what this says about our request. The scheme is `http`; `cert_reqs: CERT_REQUIRED` is set anyway, and will mean nothing, because there is no TLS handshake to apply it to. The trace returns `<urllib3.connectionpool.HTTPConnectionPool object at 0x10da09400>`.\n\nIf URL parsing had failed with a `ValueError` here, or if urllib3 had raised `LocationValueError` on the way out, both would surface as `requests.exceptions.InvalidURL` carrying the request ([adapters.py#L490-L491](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L490-L491), [adapters.py#L665-L666](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L665-L666)).\n\n## cert_verify: where the TLS promise lives, and where it doesn't\n\n`self.cert_verify(conn, request.url, verify, cert)` ([adapters.py#L307-L363](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L307-L363)) is the function an owner should read if they read only one in this chapter. Its first line is the whole story:\n\n```python\nif url.lower().startswith(\"https\") and verify:\n```\n([adapters.py#L321](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L321))\n\nFor an `https` URL with a truthy `verify`, this is where the default trust store is resolved \u2014 `verify=True` falls through to `DEFAULT_CA_BUNDLE_PATH`, which is certifi's bundle, and a missing or nonexistent path raises `OSError` with the offending location named, before any connection attempt ([adapters.py#L322-L342](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L322-L342), [utils.py#L81-L82](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L81-L82)).\n\nOur URL starts with `http`, so the `else` branch ran ([adapters.py#L343-L346](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L343-L346)):\n\n```python\nconn.cert_reqs = \"CERT_NONE\"\nconn.ca_certs = None\nconn.ca_cert_dir = None\n```\n\nThe `verify=True` that survived two merges in Chapter 6 has just been set aside, correctly and quietly, because there is nothing to verify. `cert` is `None`, so the client-certificate block \u2014 which checks that the cert file and key file exist and raises `OSError` naming each if not ([adapters.py#L348-L363](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L348-L363)) \u2014 is skipped entirely. The trace shows `cert_verify \u2192 None` with nothing underneath it.\n\n> **For the owner:** `verify` has no effect on `http://` URLs; certificate and hostname checking exist only on the TLS path. Confirm that any request carrying credentials uses an `https://` URL, because the `Authorization: Basic dXNlcjpwYXNz` header on this request is base64, not encryption, and goes out in clear text on the wire.\n\n## The request line, and a header dict urllib3 is about to copy\n\n`request_url(request, proxies)` decides what goes after the verb ([adapters.py#L565-L597](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L565-L597)). It asks `select_proxy` a second time (`None` again), reads the scheme, and takes the default path:\n\n```python\nurl = request.path_url\n```\n\n`path_url` splits the prepared URL and joins path and query, substituting `/` for an empty path ([models.py#L111-L130](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/models.py#L111-L130)). The trace: `'/basic-auth/user/pass'`. Only a proxied non-HTTPS request would have used the absolute form, and then through `urldefragauth`, which strips the fragment *and* any `user:pass@` from the netloc so credentials embedded in a URL are not handed to a proxy ([adapters.py#L594-L595](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L594-L595), [utils.py#L1122-L1136](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/utils.py#L1122-L1136)).\n\n`add_headers` is called next with every send kwarg and does nothing at all \u2014 it is `pass`, documented as an override point for subclasses that need per-connection headers ([adapters.py#L599-L611](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L599-L611)).\n\nThen one line that answers a question left open two chapters ago:\n\n```python\nchunked = not (request.body is None or \"Content-Length\" in request.headers)\n```\n([adapters.py#L679](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L679))\n\n`request.body` is `None`, so `chunked` is `False`. The GET goes out with neither `Content-Length` nor `Transfer-Encoding` \u2014 a bodiless request, exactly as `prepare_content_length` intended.\n\n## timeout=None becomes a Timeout that never fires\n\n```python\nelse:\n    resolved_timeout = TimeoutSauce(connect=timeout, read=timeout)\n```\n([adapters.py#L681-L693](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L681-L693))\n\nA tuple would have been unpacked into `(connect, read)`, with a malformed tuple rejected by a `ValueError` whose message tells the caller the two accepted shapes. An already-built urllib3 `Timeout` would pass through. Ours is `None`, so `TimeoutSauce(connect=None, read=None)`: no connect deadline, no read deadline.\n\nAnd the retry budget was fixed back in Chapter 1: `HTTPAdapter.__init__` saw the default `max_retries=0` and built `Retry(0, read=False)` ([adapters.py#L208-L211](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L208-L211)).\n\n> **For the owner:** With no `timeout` argument this call can block indefinitely, and `max_retries=0` means there is no retry budget bounding it either. Require an explicit `timeout` on every outbound request in code you sign off on.\n\n## The one call that touches the network\n\n```python\nresp = conn.urlopen(\n    method=request.method,\n    url=url,\n    body=request.body,\n    headers=request.headers,\n    redirect=False,\n    assert_same_host=False,\n    preload_content=False,\n    decode_content=False,\n    retries=self.max_retries,\n    timeout=resolved_timeout,\n    chunked=chunked,\n)\n```\n([adapters.py#L695-L708](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L695-L708))\n\nFour of those keywords are a division of labour. `redirect=False` and `retries=self.max_retries` keep redirect-following and retrying in Requests' own hands, where `resolve_redirects` can strip credentials and `Response.history` can record hops. `preload_content=False` means urllib3 returns as soon as it has parsed the status line and headers \u2014 the body stays on the socket. `decode_content=False` means gzip and deflate are not unwrapped here either; that happens later, when Requests reads the stream.\n\nInside urllib3, the trace shows our headers being handled: `CaseInsensitiveDict.copy()` builds a fresh dict from the stored `(cased key, value)` pairs ([structures.py#L89-L90](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/structures.py#L89-L90)) \u2014 five entries this time, the four defaults plus `'Authorization': 'Basic dXNlcjpwYXNz'` \u2014 and is then iterated and read key by key. The original casing survives the round trip; that is the whole point of storing the cased key alongside the value.\n\nA socket opens to 127.0.0.1:54897, the request line and five headers go out, and `conn.urlopen` returns `<urllib3.response.HTTPResponse object at 0x10c23f910>` with its body unread.\n\n## The failures that didn't happen\n\nNothing in this run entered the `except` blocks, but they are the adapter's contract with the caller, so they are worth naming ([adapters.py#L710-L746](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L710-L746)). Every urllib3 or OS error that this layer recognises is re-raised as a `requests.exceptions` type carrying `request=request`:\n\n- `ProtocolError` or any `OSError` \u2192 `ConnectionError`\n- `MaxRetryError`, dispatched on `e.reason`: `ConnectTimeoutError` (but not `NewConnectionError`) \u2192 `ConnectTimeout`; `ResponseError` \u2192 `RetryError`; urllib3 `ProxyError` \u2192 `ProxyError`; urllib3 `SSLError` \u2192 `SSLError`; anything else \u2192 `ConnectionError`\n- `ClosedPoolError` \u2192 `ConnectionError`; bare `_ProxyError` \u2192 `ProxyError`\n- `_SSLError` \u2192 `SSLError`, `ReadTimeoutError` \u2192 `ReadTimeout`, `_InvalidHeader` \u2192 `InvalidHeader`, and any other `_HTTPError` is **re-raised unchanged** ([adapters.py#L745-L746](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L745-L746))\n\n> **For the owner:** Catch `requests.exceptions.RequestException` for transport failures, but do not assume it covers everything \u2014 an unrecognised `urllib3.exceptions.HTTPError` escapes this layer as itself. Note also that a 4xx or 5xx status raises nothing here; only `raise_for_status()` turns a status code into an exception.\n\nOne line remains in `send`: `return self.build_response(request, resp)` ([adapters.py#L748](https://github.com/psf/requests/blob/611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60/src/requests/adapters.py#L748)). The urllib3 response \u2014 status par
